<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glass and Metal Bus Stop Kiosk</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #b8c4ca;
    }
    canvas {
      display: block;
    }
    #label {
      position: fixed;
      left: 22px;
      bottom: 20px;
      color: rgba(255,255,255,.84);
      font: 600 11px/1.4 Arial, sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,.45);
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="label">URBAN TRANSIT // KIOSK 07</div>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xbcc8cc);
    scene.fog = new THREE.Fog(0xbcc8cc, 18, 38);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(7.4, 5.4, 7.7);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.65;
    controls.minDistance = 5;
    controls.maxDistance = 16;
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.target.set(0, 1.65, 0);

    const hemi = new THREE.HemisphereLight(0xe5f0f3, 0x44505a, 2.0);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff1d4, 3.4);
    sun.position.set(-6, 10, 5);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -10;
    sun.shadow.camera.right = 10;
    sun.shadow.camera.top = 10;
    sun.shadow.camera.bottom = -10;
    sun.shadow.bias = -0.0004;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0xbfd9ff, 0.85);
    fill.position.set(7, 5, -8);
    scene.add(fill);

    const warm = new THREE.PointLight(0xffc887, 1.3, 7, 2);
    warm.position.set(0, 2.5, -0.3);
    scene.add(warm);

    const metal = new THREE.MeshStandardMaterial({
      color: 0x26363d,
      metalness: 0.88,
      roughness: 0.24
    });

    const brushed = new THREE.MeshStandardMaterial({
      color: 0x71838a,
      metalness: 0.92,
      roughness: 0.3
    });

    const darkRubber = new THREE.MeshStandardMaterial({
      color: 0x14191c,
      metalness: 0.15,
      roughness: 0.64
    });

    const concrete = new THREE.MeshStandardMaterial({
      color: 0x8d9698,
      metalness: 0.04,
      roughness: 0.88
    });

    const curbMat = new THREE.MeshStandardMaterial({
      color: 0xaeb4b1,
      metalness: 0.02,
      roughness: 0.78
    });

    const glass = new THREE.MeshPhysicalMaterial({
      color: 0x9bc4ca,
      metalness: 0.05,
      roughness: 0.12,
      transmission: 0.22,
      transparent: true,
      opacity: 0.34,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    const roofMat = new THREE.MeshStandardMaterial({
      color: 0x34474e,
      metalness: 0.72,
      roughness: 0.3
    });

    const seatMat = new THREE.MeshStandardMaterial({
      color: 0x465b61,
      metalness: 0.48,
      roughness: 0.36
    });

    const accent = new THREE.MeshStandardMaterial({
      color: 0xd6a449,
      metalness: 0.68,
      roughness: 0.25
    });

    function box(name, size, position, material, cast = true, receive = true) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), material);
      mesh.name = name;
      mesh.position.set(position[0], position[1], position[2]);
      mesh.castShadow = cast;
      mesh.receiveShadow = receive;
      scene.add(mesh);
      return mesh;
    }

    function cylinder(name, radius, height, position, material, radial = 20) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, height, radial), material);
      mesh.name = name;
      mesh.position.set(position[0], position[1], position[2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function makeTextTexture(lines, colors) {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 768;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = colors.background;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      gradient.addColorStop(0, "rgba(255,255,255,.15)");
      gradient.addColorStop(.48, "rgba(255,255,255,0)");
      gradient.addColorStop(1, "rgba(0,0,0,.26)");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = colors.accent;
      ctx.fillRect(42, 48, 428, 8);
      ctx.fillRect(42, 690, 120, 8);

      ctx.fillStyle = colors.main;
      ctx.font = "700 58px Arial";
      ctx.fillText(lines[0], 42, 180);
      ctx.font = "700 104px Arial";
      ctx.fillText(lines[1], 42, 295);
      ctx.font = "700 104px Arial";
      ctx.fillText(lines[2], 42, 410);

      ctx.fillStyle = colors.secondary;
      ctx.font = "500 28px Arial";
      ctx.fillText("MOVE THROUGH THE CITY", 44, 515);
      ctx.font = "500 21px Arial";
      ctx.fillText("EVERY ARRIVAL STARTS HERE", 44, 565);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    const ground = box("paved plaza", [30, 0.18, 30], [0, -0.09, 0], concrete, false, true);
    const road = box("road edge", [30, 0.08, 4.8], [0, 0.02, -4.5], darkRubber, false, true);
    box("curb", [30, 0.22, 0.32], [0, 0.1, -2.78], curbMat, false, true);

    for (let i = -12; i <= 12; i += 2) {
      box("paving seam", [0.018, 0.012, 30], [i, 0.075, 0], new THREE.MeshStandardMaterial({
        color: 0x737d7e,
        roughness: 1
      }), false, false);
    }
    for (let i = -12; i <= 12; i += 2) {
      box("paving seam", [30, 0.012, 0.018], [0, 0.076, i], new THREE.MeshStandardMaterial({
        color: 0x737d7e,
        roughness: 1
      }), false, false);
    }

    const W = 4.8;
    const D = 2.2;
    const postH = 3.18;
    const frontZ = -1.0;
    const backZ = 1.0;

    const postPositions = [
      [-2.22, postH / 2, frontZ],
      [ 2.22, postH / 2, frontZ],
      [-2.22, postH / 2, backZ],
      [ 2.22, postH / 2, backZ]
    ];

    postPositions.forEach((p, i) => {
      box("vertical steel post " + i, [0.14, postH, 0.14], p, metal);
      cylinder("post foot " + i, 0.16, 0.06, [p[0], 0.03, p[2]], brushed, 24);
    });

    box("front upper beam", [W - 0.16, 0.15, 0.15], [0, 3.08, frontZ], brushed);
    box("back upper beam", [W - 0.16, 0.15, 0.15], [0, 3.08, backZ], brushed);
    box("left upper beam", [0.15, 0.15, D - 0.14], [-2.22, 3.08, 0], brushed);
    box("right upper beam", [0.15, 0.15, D - 0.14], [2.22, 3.08, 0], brushed);

    box("cantilever canopy", [5.28, 0.22, 2.68], [0, 3.34, 0], roofMat);
    box("canopy underside trim", [5.12, 0.08, 2.52], [0, 3.205, 0], metal);
    box("canopy front fascia", [5.28, 0.32, 0.12], [0, 3.3, -1.28], brushed);
    box("canopy rear fascia", [5.28, 0.32, 0.12], [0, 3.3, 1.28], brushed);

    const sidePanelL = box("left glass side panel", [0.035, 2.72, 2.02], [-2.15, 1.63, 0], glass, false, true);
    const sidePanelR = box("right glass side panel", [0.035, 2.72, 2.02], [2.15, 1.63, 0], glass, false, true);
    const backPanel = box("rear glass panel", [4.22, 2.72, 0.035], [0, 1.63, 0.95], glass, false, true);

    box("left glass lower rail", [0.1, 0.1, 2.08], [-2.14, 0.28, 0], metal);
    box("right glass lower rail", [0.1, 0.1, 2.08], [2.14, 0.28, 0], metal);
    box("rear glass lower rail", [4.24, 0.1, 0.1], [0, 0.28, 0.94], metal);
    box("rear glass center mullion", [0.08, 2.7, 0.08], [0, 1.63, 0.91], brushed);

    const seatLength = 3.75;
    box("bench seat", [seatLength, 0.18, 0.48], [0, 1.02, 0.58], seatMat);
    box("bench front edge", [seatLength, 0.12, 0.08], [0, 0.98, 0.34], accent);
    box("bench backrest", [seatLength, 0.58, 0.11], [0, 1.55, 0.82], seatMat);
    box("bench backrest cap", [seatLength, 0.07, 0.14], [0, 1.86, 0.82], brushed);

    [-1.55, 1.55].forEach((x) => {
      box("bench leg", [0.1, 0.98, 0.1], [x, 0.53, 0.58], metal);
      box("bench foot", [0.5, 0.08, 0.28], [x, 0.08, 0.58], metal);
      box("backrest support", [0.08, 0.76, 0.08], [x, 1.42, 0.77], brushed);
    });

    const signBody = box("advertising sign cabinet", [1.42, 1.52, 0.13], [-1.38, 2.05, -1.02], metal);
    box("sign inner face", [1.25, 1.35, 0.025], [-1.38, 2.05, -1.098], new THREE.MeshBasicMaterial({
      map: makeTextTexture(["NEXT", "STOP", "NOW"], {
        background: "#173c45",
        main: "#f3d27b",
        secondary: "#d9e4df",
        accent: "#e7a53e"
      })
    }), false, false);

    box("sign top bracket", [1.18, 0.08, 0.2], [-1.38, 2.84, -0.92], brushed);
    box("sign bottom bracket", [1.18, 0.08, 0.2], [-1.38, 1.26, -0.92], brushed);
    box("sign left edge", [0.08, 1.52, 0.16], [-2.08, 2.05, -1.0], accent);
    box("sign right edge", [0.08, 1.52, 0.16], [-0.68, 2.05, -1.0], accent);

    const routePoleX = 2.86;
    cylinder("route marker pole", 0.045, 2.4, [routePoleX, 1.2, -0.72], metal, 18);
    box("route marker head", [0.55, 0.68, 0.12], [routePoleX, 2.42, -0.72], accent);
    box("route marker face", [0.39, 0.45, 0.018], [routePoleX, 2.42, -0.785], new THREE.MeshBasicMaterial({
      map: makeTextTexture(["R", "24", "→"], {
        background: "#f0b642",
        main: "#172a31",
        secondary: "#172a31",
        accent: "#17323a"
      })
    }), false, false);

    box("information rail", [3.55, 0.06, 0.06], [0, 2.55, -1.06], brushed);
    [-1.55, 1.55].forEach((x) => {
      cylinder("rail mount", 0.045, 0.28, [x, 2.42, -1.06], metal, 16);
    });

    const lightHousing = box("canopy light housing", [2.3, 0.055, 0.12], [0, 3.13, -0.02], metal);
    const luminous = new THREE.MeshStandardMaterial({
      color: 0xfff3d0,
      emissive: 0xffd98a,
      emissiveIntensity: 2.6,
      roughness: 0.25
    });
    box("warm linear canopy light", [1.86, 0.018, 0.045], [0, 3.095, -0.02], luminous, false, false);

    const smallPoint = new THREE.PointLight(0xffd59a, 2.2, 5, 2);
    smallPoint.position.set(0, 3.0, -0.1);
    smallPoint.castShadow = true;
    scene.add(smallPoint);

    box("front threshold", [4.25, 0.06, 0.12], [0, 0.08, -1.05], brushed);
    box("left threshold", [0.12, 0.06, 2.05], [-2.15, 0.08, 0], brushed);
    box("right threshold", [0.12, 0.06, 2.05], [2.15, 0.08, 0], brushed);

    function addBolt(x, y, z) {
      cylinder("bolt", 0.027, 0.018, [x, y, z], accent, 12).rotation.x = Math.PI / 2;
    }
    [-1.98, 1.98].forEach((x) => {
      addBolt(x, 0.105, -1.07);
      addBolt(x, 0.105, 1.0);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      warm.intensity = 1.15 + Math.sin(elapsed * 1.8) * 0.08;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
