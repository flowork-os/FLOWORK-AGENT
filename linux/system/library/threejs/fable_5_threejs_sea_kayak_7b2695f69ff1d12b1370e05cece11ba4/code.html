<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sea Kayak on Roof-Rack Cradles</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#e8edf2}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8edf2);
scene.fog = new THREE.Fog(0xe8edf2, 14, 30);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.6, 2.5, 5.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.75, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
controls.minDistance = 3;
controls.maxDistance = 14;
controls.maxPolarAngle = 1.48;

// Lights
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a929c, 0.55));
const key = new THREE.DirectionalLight(0xfff3e2, 2.2);
key.position.set(4, 7, 3);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -4.5;
key.shadow.camera.right = key.shadow.camera.top = 4.5;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
scene.add(key);
const fill = new THREE.DirectionalLight(0xdfeaff, 0.5);
fill.position.set(-5, 3, -4);
scene.add(fill);

// Ground
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(10, 64).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0xd7dce2, roughness: 0.95, metalness: 0 })
);
ground.receiveShadow = true;
scene.add(ground);

// ---------- Kayak hull functions ----------
const L = 5.2, B = 0.29, D = 0.19, H = 0.15;
const clamp = THREE.MathUtils.clamp, smooth = THREE.MathUtils.smoothstep;
const sinp = (s, p) => Math.pow(Math.sin(Math.PI * clamp(s, 0, 1)), p);
const bw = s => B * sinp(s, 0.7);            // half beam
const hd = s => D * sinp(s, 0.85);           // hull depth
const dh = s => H * sinp(s, 0.75);           // deck height
const sheer = s => 0.10 * Math.pow(Math.abs(2 * s - 1), 2.8);
const deckY = (x, z) => { const s = z / L + 0.5, b = Math.max(bw(s), 1e-5), f = clamp(x / b, -1, 1); return sheer(s) + dh(s) * Math.pow(Math.max(1 - f * f, 0), 0.675); };

const kayak = new THREE.Group();

// Hull + deck (one smooth two-tone shell)
{
  const nS = 130, nA = 48, pos = [], col = [], idx = [];
  const cHull = new THREE.Color(0xc14b2c), cDeck = new THREE.Color(0xefe6d3), cSeam = new THREE.Color(0x2a2724), tmp = new THREE.Color();
  for (let i = 0; i <= nS; i++) {
    const s = i / nS, z = (s - 0.5) * L;
    for (let j = 0; j < nA; j++) {
      const a = j / nA * Math.PI * 2, c = Math.cos(a), sn = Math.sin(a);
      const x = bw(s) * c;
      const y = sheer(s) + (sn >= 0 ? dh(s) * Math.pow(sn, 1.35) : -hd(s) * Math.pow(-sn, 0.85));
      pos.push(x, y, z);
      tmp.copy(cHull).lerp(cDeck, smooth(sn, -0.05, 0.2));
      tmp.lerp(cSeam, (1 - smooth(Math.abs(sn), 0.02, 0.1)) * 0.85);
      col.push(tmp.r, tmp.g, tmp.b);
    }
  }
  for (let i = 0; i < nS; i++) for (let j = 0; j < nA; j++) {
    const a = i * nA + j, b = i * nA + (j + 1) % nA, c = a + nA, d = b + nA;
    idx.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const body = new THREE.Mesh(g, new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.26, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.12 }));
  body.castShadow = true;
  kayak.add(body);
}

// Cockpit: dark opening draped on deck + coaming ring
{
  const zc = -0.30;
  const og = new THREE.CircleGeometry(1, 48).rotateX(-Math.PI / 2);
  const p = og.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const X = p.getX(i) * 0.20, Z = p.getZ(i) * 0.40 + zc;
    p.setXYZ(i, X, deckY(X, Z) + 0.008, Z);
  }
  og.computeVertexNormals();
  kayak.add(new THREE.Mesh(og, new THREE.MeshStandardMaterial({ color: 0x121317, roughness: 0.9 })));

  const pts = [];
  for (let k = 0; k < 40; k++) {
    const t = k / 40 * Math.PI * 2, px = 0.215 * Math.sin(t), pz = zc + 0.42 * Math.cos(t);
    pts.push(new THREE.Vector3(px, deckY(px, pz) + 0.012, pz));
  }
  const coaming = new THREE.Mesh(
    new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, true), 80, 0.03, 10, true),
    new THREE.MeshPhysicalMaterial({ color: 0x16181c, roughness: 0.35, clearcoat: 0.6 })
  );
  coaming.castShadow = true;
  kayak.add(coaming);
}

// Deck rigging: bungee lines arcing over the deck + fittings
{
  const ropeMat = new THREE.MeshStandardMaterial({ color: 0x23262b, roughness: 0.7 });
  const fitMat = new THREE.MeshStandardMaterial({ color: 0x16181c, roughness: 0.5, metalness: 0.3 });
  const anchor = (z, side) => { const x = side * 0.72 * bw(z / L + 0.5); return new THREE.Vector3(x, deckY(x, z) + 0.01, z); };
  const line = (p1, p2) => {
    const mid = p1.clone().add(p2).multiplyScalar(0.5);
    mid.y = deckY(mid.x, mid.z) + 0.028;
    const m = new THREE.Mesh(new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(p1, mid, p2), 16, 0.012, 8), ropeMat);
    m.castShadow = true;
    kayak.add(m);
  };
  const pairs = [[0.55, 1.15], [1.15, 1.75], [-0.95, -1.55]];
  const zs = new Set();
  for (const [za, zb] of pairs) {
    line(anchor(za, 1), anchor(zb, -1));
    line(anchor(za, -1), anchor(zb, 1));
    zs.add(za); zs.add(zb);
  }
  for (const z of zs) for (const side of [1, -1]) {
    const p = anchor(z, side);
    const f = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.024, 0.022, 12), fitMat);
    f.position.copy(p);
    kayak.add(f);
  }
}

kayak.position.y = 0.66;
scene.add(kayak);

// ---------- Roof-rack cradle bars ----------
const metal = new THREE.MeshStandardMaterial({ color: 0x51565e, metalness: 0.85, roughness: 0.35 });
const foam = new THREE.MeshStandardMaterial({ color: 0x26282c, roughness: 1 });
const plastic = new THREE.MeshStandardMaterial({ color: 0x1b1d21, roughness: 0.8 });

function cradle(z) {
  const g = new THREE.Group();
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 1.7, 24).rotateZ(Math.PI / 2), metal);
  bar.position.y = 0.42;
  g.add(bar);
  for (const s of [1, -1]) {
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.05, 20).rotateZ(Math.PI / 2), plastic);
    cap.position.set(s * 0.85, 0.42, 0);
    g.add(cap);
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.42, 0.16), plastic);
    foot.position.set(s * 0.62, 0.21, 0);
    g.add(foot);
    const pad = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.05, 0.22), foam);
    pad.position.set(s * 0.18, 0.52, 0);
    pad.rotation.z = s * 0.6;
    g.add(pad);
  }
  g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  g.position.z = z;
  scene.add(g);
}
cradle(1.05);
cradle(-1.05);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
