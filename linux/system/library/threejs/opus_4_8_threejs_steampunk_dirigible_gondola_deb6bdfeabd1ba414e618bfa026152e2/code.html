<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Steampunk Sky Runner</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #14120f; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    font: 12px/1.4 "Georgia", "Times New Roman", serif; letter-spacing: 0.12em;
    color: rgba(226, 200, 150, 0.45); text-transform: uppercase;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="hint">Steampunk Sky Runner &mdash; drag to orbit &middot; scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14120f);
scene.fog = new THREE.Fog(0x14120f, 26, 70);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(9.5, 3.2, 12.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 7;
controls.maxDistance = 40;
controls.target.set(0, 0.2, 0);

/* ============================================================
   LIGHTING
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xbfd4e8, 0x2a1d12, 0.42);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffe6be, 2.5);
key.position.set(9, 12, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 45;
key.shadow.camera.left = -12;
key.shadow.camera.right = 12;
key.shadow.camera.top = 12;
key.shadow.camera.bottom = -12;
key.shadow.bias = -0.0012;
key.shadow.normalBias = 0.02;
scene.add(key);

const fill = new THREE.DirectionalLight(0x8fb3d9, 0.55);
fill.position.set(-8, 4, 6);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffb066, 1.15);
rim.position.set(-6, 3.5, -10);
scene.add(rim);

const boilerGlow = new THREE.PointLight(0xff7a22, 2.2, 6.5, 2);
boilerGlow.position.set(0, -2.05, -1.55);
scene.add(boilerGlow);

const lampGlow = new THREE.PointLight(0xffca7a, 1.1, 4.0, 2);
lampGlow.position.set(0, -1.35, 2.75);
scene.add(lampGlow);

/* shadow-only ground */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(120, 120),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -6.2;
ground.receiveShadow = true;
scene.add(ground);

/* ============================================================
   MATERIALS
   ============================================================ */
const M = {
  brass: new THREE.MeshStandardMaterial({ color: 0xc9973f, metalness: 1.0, roughness: 0.32 }),
  brassDark: new THREE.MeshStandardMaterial({ color: 0x8a6524, metalness: 1.0, roughness: 0.46 }),
  copper: new THREE.MeshStandardMaterial({ color: 0xb4602e, metalness: 1.0, roughness: 0.3 }),
  copperDark: new THREE.MeshStandardMaterial({ color: 0x7d4322, metalness: 1.0, roughness: 0.45 }),
  envelope: new THREE.MeshStandardMaterial({ color: 0xa8813c, metalness: 0.92, roughness: 0.42 }),
  iron: new THREE.MeshStandardMaterial({ color: 0x39332e, metalness: 0.85, roughness: 0.62 }),
  ironDark: new THREE.MeshStandardMaterial({ color: 0x241f1c, metalness: 0.8, roughness: 0.7 }),
  leather: new THREE.MeshStandardMaterial({ color: 0x4b2d18, metalness: 0.08, roughness: 0.82 }),
  leatherDark: new THREE.MeshStandardMaterial({ color: 0x33200f, metalness: 0.05, roughness: 0.88 }),
  walnut: new THREE.MeshStandardMaterial({ color: 0x5a3116, metalness: 0.06, roughness: 0.3 }),
  walnutDark: new THREE.MeshStandardMaterial({ color: 0x3d2010, metalness: 0.05, roughness: 0.36 }),
  walnutLight: new THREE.MeshStandardMaterial({ color: 0x74441f, metalness: 0.06, roughness: 0.34 }),
  propWood: new THREE.MeshStandardMaterial({ color: 0x8a5524, metalness: 0.05, roughness: 0.4 }),
  rope: new THREE.MeshStandardMaterial({ color: 0x2b241c, metalness: 0.1, roughness: 0.9 }),
  glass: new THREE.MeshPhysicalMaterial({
    color: 0xbfe0e6, metalness: 0.0, roughness: 0.06,
    transmission: 0.92, thickness: 0.12, ior: 1.45,
    transparent: true, opacity: 0.5, side: THREE.DoubleSide
  }),
  gaugeFace: new THREE.MeshStandardMaterial({ color: 0xe8dcc0, metalness: 0.0, roughness: 0.62 }),
  needle: new THREE.MeshStandardMaterial({ color: 0x1a1512, metalness: 0.3, roughness: 0.6 }),
  emberGlass: new THREE.MeshStandardMaterial({
    color: 0xff8a2a, emissive: 0xff5f10, emissiveIntensity: 2.4, roughness: 0.3, metalness: 0.0
  }),
  lamp: new THREE.MeshStandardMaterial({
    color: 0xffd28a, emissive: 0xffb24d, emissiveIntensity: 2.0, roughness: 0.3, metalness: 0.0
  }),
  canvasFin: new THREE.MeshStandardMaterial({
    color: 0x6b3a1c, metalness: 0.05, roughness: 0.85, side: THREE.DoubleSide
  })
};

/* ============================================================
   HELPERS
   ============================================================ */
function mesh(geo, mat, cast = true, receive = true) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = cast;
  m.receiveShadow = receive;
  return m;
}

/** A short rivet nub. */
const rivetGeo = new THREE.SphereGeometry(1, 8, 6);
function rivet(r, mat) {
  const m = mesh(rivetGeo, mat, true, false);
  m.scale.setScalar(r);
  return m;
}

/** Instanced rivets along a ring at given x on the envelope profile. */
function rivetRing(parent, x, radius, count, r, mat, phase = 0) {
  const inst = new THREE.InstancedMesh(rivetGeo, mat, count);
  inst.castShadow = true;
  const d = new THREE.Object3D();
  for (let i = 0; i < count; i++) {
    const a = phase + (i / count) * Math.PI * 2;
    d.position.set(x, Math.sin(a) * radius, Math.cos(a) * radius);
    d.scale.setScalar(r);
    d.rotation.set(0, 0, 0);
    d.updateMatrix();
    inst.setMatrixAt(i, d.matrix);
  }
  inst.instanceMatrix.needsUpdate = true;
  parent.add(inst);
  return inst;
}

/** Taut cable between two points in a common parent space. */
function cable(parent, a, b, radius = 0.012, mat = M.rope) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  if (len < 1e-5) return null;
  const g = new THREE.CylinderGeometry(radius, radius, len, 5, 1, true);
  const m = mesh(g, mat, true, false);
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  parent.add(m);
  return m;
}

/** Small brass pipe following a path of points. */
function pipe(parent, pts, radius = 0.035, mat = M.brass, tubular = 40) {
  const curve = new THREE.CatmullRomCurve3(pts);
  const g = new THREE.TubeGeometry(curve, tubular, radius, 8, false);
  const m = mesh(g, mat);
  parent.add(m);
  return m;
}

/* ============================================================
   ROOT
   ============================================================ */
const ship = new THREE.Group();
scene.add(ship);

/* ------------------------------------------------------------
   ENVELOPE — fat riveted brass cigar
   ------------------------------------------------------------ */
const ENV_LEN = 11.0;      // total length along X
const ENV_R = 2.35;        // max radius
const HALF = ENV_LEN / 2;

// Profile: fat cigar, blunt nose, tapered tail
function envelopeRadius(t) { // t in [-1, 1] along X
  const s = Math.abs(t);
  const nose = Math.pow(1 - Math.pow(s, 2.6), 0.52);
  // slight tail taper asymmetry
  const asym = t > 0 ? 1.0 : 1.0 - 0.06 * Math.pow(s, 2);
  return ENV_R * nose * asym;
}

const envGroup = new THREE.Group();
ship.add(envGroup);

{
  const SEG = 96;
  const pts = [];
  for (let i = 0; i <= SEG; i++) {
    const t = -1 + (2 * i) / SEG;
    const x = t * HALF;
    let r = envelopeRadius(t);
    // gentle longitudinal ribbing for the riveted-plate look
    r += Math.sin(t * Math.PI * 9.0) * 0.012 * (1 - Math.abs(t) * 0.5);
    pts.push(new THREE.Vector2(Math.max(r, 0.0009), x));
  }
  const g = new THREE.LatheGeometry(pts, 84);
  g.rotateZ(Math.PI / 2);   // lathe axis Y -> X
  const env = mesh(g, M.envelope);
  envGroup.add(env);
}

/* nose cap + tail cap (brass fittings) */
{
  const noseCap = mesh(new THREE.SphereGeometry(0.42, 24, 18), M.brass);
  noseCap.position.set(HALF - 0.06, 0, 0);
  noseCap.scale.set(1.5, 1, 1);
  envGroup.add(noseCap);

  const noseSpike = mesh(new THREE.ConeGeometry(0.13, 0.85, 14), M.copper);
  noseSpike.rotation.z = -Math.PI / 2;
  noseSpike.position.set(HALF + 0.5, 0, 0);
  envGroup.add(noseSpike);

  const noseCollar = mesh(new THREE.TorusGeometry(0.2, 0.05, 10, 24), M.brassDark);
  noseCollar.rotation.y = Math.PI / 2;
  noseCollar.position.set(HALF + 0.12, 0, 0);
  envGroup.add(noseCollar);

  const tailCap = mesh(new THREE.SphereGeometry(0.34, 20, 16), M.brass);
  tailCap.position.set(-HALF + 0.05, 0, 0);
  tailCap.scale.set(1.6, 1, 1);
  envGroup.add(tailCap);

  const tailCollar = mesh(new THREE.TorusGeometry(0.26, 0.055, 10, 24), M.copperDark);
  tailCollar.rotation.y = Math.PI / 2;
  tailCollar.position.set(-HALF + 0.16, 0, 0);
  envGroup.add(tailCollar);
}

/* copper banding rings + rivet rows around the envelope */
{
  const bandXs = [-4.4, -3.2, -1.9, -0.6, 0.7, 2.0, 3.2, 4.2];
  bandXs.forEach((x, i) => {
    const t = x / HALF;
    const r = envelopeRadius(t);
    if (r < 0.15) return;
    const band = mesh(new THREE.TorusGeometry(r + 0.015, 0.055, 10, 72), i % 2 ? M.copper : M.brassDark);
    band.rotation.y = Math.PI / 2;
    band.position.x = x;
    envGroup.add(band);

    rivetRing(envGroup, x + 0.13, r + 0.035, 30, 0.038, M.brass, i * 0.11);
    rivetRing(envGroup, x - 0.13, r + 0.035, 30, 0.038, M.brass, i * 0.11 + 0.1);
  });
}

/* longitudinal riveted seams (plate joints) */
{
  const seamCount = 8;
  for (let s = 0; s < seamCount; s++) {
    const ang = (s / seamCount) * Math.PI * 2 + 0.2;
    const seamPts = [];
    const N = 34;
    for (let i = 0; i <= N; i++) {
      const t = -0.965 + (1.93 * i) / N;
      const r = envelopeRadius(t) + 0.02;
      seamPts.push(new THREE.Vector3(t * HALF, Math.sin(ang) * r, Math.cos(ang) * r));
    }
    const curve = new THREE.CatmullRomCurve3(seamPts);
    const g = new THREE.TubeGeometry(curve, 70, 0.022, 6, false);
    envGroup.add(mesh(g, M.copperDark, true, false));

    // rivets along the seam
    const inst = new THREE.InstancedMesh(rivetGeo, M.brass, 30);
    inst.castShadow = true;
    const d = new THREE.Object3D();
    for (let i = 0; i < 30; i++) {
      const t = -0.94 + (1.88 * i) / 29;
      const r = envelopeRadius(t) + 0.035;
      d.position.set(t * HALF, Math.sin(ang) * r, Math.cos(ang) * r);
      d.scale.setScalar(0.032);
      d.updateMatrix();
      inst.setMatrixAt(i, d.matrix);
    }
    inst.instanceMatrix.needsUpdate = true;
    envGroup.add(inst);
  }
}

/* leather straps wrapping the envelope (wide belts with buckles) */
{
  const strapXs = [-2.55, -1.25, 0.05, 1.35, 2.65];
  strapXs.forEach((x, i) => {
    const t = x / HALF;
    const r = envelopeRadius(t);
    const strap = mesh(new THREE.CylinderGeometry(r + 0.045, r + 0.045, 0.34, 64, 1, true), M.leather, true, true);
    strap.material.side = THREE.DoubleSide;
    strap.rotation.z = Math.PI / 2;
    strap.position.x = x;
    envGroup.add(strap);

    const edgeA = mesh(new THREE.TorusGeometry(r + 0.05, 0.022, 8, 60), M.leatherDark);
    edgeA.rotation.y = Math.PI / 2;
    edgeA.position.x = x + 0.17;
    envGroup.add(edgeA);
    const edgeB = edgeA.clone();
    edgeB.position.x = x - 0.17;
    envGroup.add(edgeB);

    // buckle on top
    const buckle = mesh(new THREE.BoxGeometry(0.3, 0.36, 0.1), M.brass);
    buckle.position.set(x, r + 0.09, 0);
    envGroup.add(buckle);
    const pin = mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.34, 8), M.brassDark);
    pin.rotation.z = Math.PI / 2;
    pin.position.set(x, r + 0.09, 0);
    envGroup.add(buckle.parent === envGroup ? pin : pin);

    // side D-rings the rigging attaches to
    [-1, 1].forEach(sgn => {
      const dr = mesh(new THREE.TorusGeometry(0.085, 0.022, 8, 16), M.brass);
      dr.position.set(x, -r * 0.62, sgn * r * 0.74);
      dr.lookAt(new THREE.Vector3(x, -r * 1.6, sgn * r * 1.8));
      envGroup.add(dr);
    });
    void i;
  });
}

/* dorsal keel ridge + inspection hatches */
{
  const ridgePts = [];
  for (let i = 0; i <= 40; i++) {
    const t = -0.9 + (1.8 * i) / 40;
    const r = envelopeRadius(t) + 0.03;
    ridgePts.push(new THREE.Vector3(t * HALF, r, 0));
  }
  pipe(envGroup, ridgePts, 0.05, M.brassDark, 80);

  for (let i = 0; i < 5; i++) {
    const x = -3.4 + i * 1.7;
    const r = envelopeRadius(x / HALF);
    const hatch = mesh(new THREE.CylinderGeometry(0.19, 0.19, 0.07, 18), M.copper);
    hatch.position.set(x, 0, r + 0.02);
    hatch.rotation.x = Math.PI / 2;
    envGroup.add(hatch);
    const hr = mesh(new THREE.TorusGeometry(0.19, 0.022, 8, 20), M.brass);
    hr.position.set(x, 0, r + 0.05);
    envGroup.add(hr);

    const hatch2 = hatch.clone();
    hatch2.position.set(x, 0, -r - 0.02);
    envGroup.add(hatch2);
    const hr2 = hr.clone();
    hr2.position.set(x, 0, -r - 0.05);
    envGroup.add(hr2);
  }
}

/* ------------------------------------------------------------
   TAIL FINS
   ------------------------------------------------------------ */
function finShape() {
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.lineTo(1.45, 0.12);
  s.lineTo(1.5, 1.05);
  s.lineTo(0.55, 1.5);
  s.lineTo(0.02, 0.7);
  s.closePath();
  return s;
}
{
  const geo = new THREE.ExtrudeGeometry(finShape(), { depth: 0.07, bevelEnabled: true, bevelSize: 0.02, bevelThickness: 0.02, bevelSegments: 2 });
  geo.center();
  const angles = [0, Math.PI / 2, Math.PI, -Math.PI / 2];
  angles.forEach((a) => {
    const holder = new THREE.Group();
    holder.rotation.x = a;
    const f = mesh(geo, M.canvasFin);
    f.rotation.y = Math.PI / 2;
    f.position.set(-4.35, 1.15, 0);
    holder.add(f);

    // fin brass spars
    const sparA = mesh(new THREE.CylinderGeometry(0.035, 0.035, 1.5, 8), M.brassDark);
    sparA.position.set(-4.35, 1.15, 0);
    holder.add(sparA);
    const sparB = mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.45, 8), M.brassDark);
    sparB.rotation.z = Math.PI / 2;
    sparB.position.set(-4.35, 1.6, 0);
    holder.add(sparB);

    // bracing cables from fin tip back to hull
    const rHull = envelopeRadius(-3.1 / HALF);
    cable(holder, new THREE.Vector3(-4.35, 1.85, 0), new THREE.Vector3(-3.1, rHull * 0.72, 0.0), 0.013);
    cable(holder, new THREE.Vector3(-4.9, 1.7, 0), new THREE.Vector3(-3.1, rHull * 0.68, 0.0), 0.011);

    envGroup.add(holder);
  });
}

/* ------------------------------------------------------------
   PROPELLER AT THE STERN — wooden blades in a brass ring
   ------------------------------------------------------------ */
const propAssembly = new THREE.Group();
propAssembly.position.set(-HALF - 0.95, -0.35, 0);
ship.add(propAssembly);

const propSpinner = new THREE.Group();
{
  // Brass duct ring (shroud)
  const ringR = 1.28;
  const shroud = mesh(new THREE.TorusGeometry(ringR, 0.115, 14, 64), M.brass);
  shroud.rotation.y = Math.PI / 2;
  propAssembly.add(shroud);

  const shroudBand = mesh(new THREE.CylinderGeometry(ringR - 0.02, ringR - 0.02, 0.5, 60, 1, true), M.copperDark);
  shroudBand.material = M.copperDark;
  shroudBand.rotation.z = Math.PI / 2;
  propAssembly.add(shroudBand);

  const lip1 = mesh(new THREE.TorusGeometry(ringR + 0.02, 0.05, 10, 60), M.brassDark);
  lip1.rotation.y = Math.PI / 2;
  lip1.position.x = 0.25;
  propAssembly.add(lip1);
  const lip2 = lip1.clone();
  lip2.position.x = -0.25;
  propAssembly.add(lip2);

  // rivets on the ring
  rivetRing(propAssembly, 0.25, ringR + 0.06, 28, 0.035, M.brass);
  rivetRing(propAssembly, -0.25, ringR + 0.06, 28, 0.035, M.brass);

  // 4 struts from the ring to the hub housing
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
    const strut = mesh(new THREE.BoxGeometry(0.09, ringR - 0.28, 0.075), M.brassDark);
    strut.position.set(-0.06, Math.sin(a) * (ringR / 2 + 0.1), Math.cos(a) * (ringR / 2 + 0.1));
    strut.rotation.x = -a;
    propAssembly.add(strut);
  }

  // hub housing
  const housing = mesh(new THREE.CylinderGeometry(0.24, 0.3, 0.62, 20), M.brassDark);
  housing.rotation.z = Math.PI / 2;
  housing.position.x = -0.12;
  propAssembly.add(housing);
  const hRing = mesh(new THREE.TorusGeometry(0.3, 0.04, 8, 22), M.copper);
  hRing.rotation.y = Math.PI / 2;
  hRing.position.x = -0.4;
  propAssembly.add(hRing);

  // ---- spinning part ----
  const hub = mesh(new THREE.CylinderGeometry(0.19, 0.22, 0.3, 18), M.brass);
  hub.rotation.z = Math.PI / 2;
  hub.position.x = 0.18;
  propSpinner.add(hub);

  const nose = mesh(new THREE.ConeGeometry(0.19, 0.34, 18), M.copper);
  nose.rotation.z = -Math.PI / 2;
  nose.position.x = 0.48;
  propSpinner.add(nose);

  // 4 varnished wooden blades
  const bladeShape = new THREE.Shape();
  bladeShape.moveTo(-0.11, 0);
  bladeShape.quadraticCurveTo(-0.20, 0.5, -0.13, 1.02);
  bladeShape.quadraticCurveTo(-0.03, 1.16, 0.08, 1.0);
  bladeShape.quadraticCurveTo(0.17, 0.5, 0.10, 0.02);
  bladeShape.quadraticCurveTo(0, -0.06, -0.11, 0);
  const bladeGeo = new THREE.ExtrudeGeometry(bladeShape, {
    depth: 0.05, bevelEnabled: true, bevelSize: 0.022, bevelThickness: 0.018, bevelSegments: 2
  });

  for (let i = 0; i < 4; i++) {
    const arm = new THREE.Group();
    arm.rotation.x = (i / 4) * Math.PI * 2;
    const b = mesh(bladeGeo, M.propWood);
    b.rotation.y = Math.PI / 2;   // face into the airstream plane
    b.rotation.x = 0.0;
    b.position.set(0.16, 0.16, 0);
    // pitch the blade
    const pitch = new THREE.Group();
    pitch.rotation.x = 0;
    b.rotation.z = 0;
    arm.add(b);
    b.rotation.set(0, Math.PI / 2, 0);
    b.rotateY(0);
    b.rotateX(0);
    // apply pitch about the blade's radial (Y) axis via parent tilt
    const tilt = new THREE.Group();
    tilt.rotation.z = 0;
    arm.add(tilt);
    void pitch; void tilt;

    // blade root brass ferrule
    const fer = mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.19, 12), M.brassDark);
    fer.position.set(0.16, 0.2, 0);
    arm.add(fer);

    propSpinner.add(arm);
  }
  propSpinner.position.set(0, 0, 0);
  propAssembly.add(propSpinner);
}

/* pitch the blades properly: rotate each blade mesh about its own radial axis */
propSpinner.children.forEach(child => {
  if (child.type === 'Group') {
    child.children.forEach(c => {
      if (c.isMesh && c.geometry.type === 'ExtrudeGeometry') {
        c.rotation.set(0, Math.PI / 2, 0);
        c.rotateY(0);
        // tilt around the world-Y of the arm space => blade pitch
        c.rotation.y = Math.PI / 2;
        c.rotation.z = 0;
        c.rotation.x = 0;
        c.rotateOnAxis(new THREE.Vector3(0, 1, 0), 0.0);
        c.rotateOnAxis(new THREE.Vector3(0, 0, 1), 0.0);
        // final pitch: rotate about radial (local +Y after placement)
        c.rotateY(0.42);
      }
    });
  }
});

/* drive shaft from gondola engine to the propeller */
{
  const shaft = mesh(new THREE.CylinderGeometry(0.075, 0.075, 2.5, 12), M.iron);
  shaft.rotation.z = Math.PI / 2;
  shaft.position.set(-HALF + 0.55, -0.35, 0);
  ship.add(shaft);

  for (let i = 0; i < 3; i++) {
    const c = mesh(new THREE.TorusGeometry(0.11, 0.028, 8, 16), M.brass);
    c.rotation.y = Math.PI / 2;
    c.position.set(-HALF + 0.05 + i * 0.75, -0.35, 0);

  const railF = mesh(new THREE.BoxGeometry(0.1, 0.075, G_W + 0.12), M.brass);

  // roof ribs

    const x = -C_L / 2 + 0.28 + i * ((C_L - 0.56) / 4);

  /* ---- BAY WINDOW: faceted bow window bulging forward ---- */
  const bay = new THREE.Group();
  bay.position.set(C_L / 2, C_H * 0.5, 0);
  cabin.add(bay);

  const bayH = C_H * 0.86;
  // Facet plan: 5 panes wrapping from -z to +z, bulging in +x
  const facetAngles = [-1.05, -0.53, 0, 0.53, 1.05];
  const bayR = 0.62;
  const pts2 = facetAngles.map(a => new THREE.Vector3(Math.cos(a) * bayR, 0, Math.sin(a) * bayR * 1.15));
  // add the wall-return points
  const wallZ = C_W / 2 - 0.02;
  const allPts = [new THREE.Vector3(-0.02, 0, -wallZ), ...pts2, new THREE.Vector3(-0.02, 0, wallZ)];

  for (let i = 0; i < allPts.length - 1; i++) {
    const a = allPts[i], b = allPts[i + 1];
    const mid = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);
    const dir = new THREE.Vector3().subVectors(b, a);
    const len = dir.length();
    const yaw = Math.atan2(dir.x, dir.z);

    // glass pane
    const pane = mesh(new THREE.BoxGeometry(len - 0.055, bayH - 0.12, 0.03), M.glass, false, false);
    pane.position.set(mid.x, bayH / 2, mid.z);

    const fTop = mesh(new THREE.BoxGeometry(len, 0.075, 0.085), M.brass);
    fTop.position.set(mid.x, bayH - 0.03, mid.z);
    fTop.rotation.y = yaw + Math.PI / 2;
    bay.add(fTop);
    const fBot = fTop.clone();
    fBot.position.y = 0.03;
    bay.add(fBot);
    // horizontal muntin
    const mid2 = mesh(new THREE.BoxGeometry(len, 0.038, 0.06), M.brassDark);
    mid2.position.set(mid.x, bayH * 0.52, mid.z);
    mid2.rotation.y = yaw + Math.PI / 2;
    bay.add(mid2);

    // vertical mullion post at each vertex
    const post = mesh(new THREE.CylinderGeometry(0.045, 0.045, bayH, 10), M.brass);
    post.position.set(a.x, bayH / 2, a.z);
    bay.add(post);
    if (i === allPts.length - 2) {
      const post2 = post.clone();
      post2.position.set(b.x, bayH / 2, b.z);
      bay.add(post2);
    }
  }

  // bay window sill + hood
  const sillShape = new THREE.Shape();
  sillShape.moveTo(-0.06, -wallZ - 0.06);
  allPts.slice(1, -1).forEach(p => sillShape.lineTo(p.x + 0.08, p.z * 1.07));
  sillShape.lineTo(-0.06, wallZ + 0.06);
  sillShape.lineTo(-0.28, wallZ + 0.06);
  sillShape.lineTo(-0.28, -wallZ - 0.06);
  sillShape.closePath();
  const sillGeo = new THREE.ExtrudeGeometry(sillShape, { depth: 0.1, bevelEnabled: true, bevelSize: 0.02, bevelThickness: 0.02, bevelSegments: 2 });
  sillGeo.rotateX(-Math.PI / 2);

  const sill = mesh(sillGeo, M.walnutDark);
  sill.position.set(0, 0.02, 0);
  bay.add(sill);

  const hood = mesh(sillGeo, M.copper);
  hood.position.set(0, bayH - 0.02, 0);

  const lampHousing = mesh(new THREE.CylinderGeometry(0.12, 0.16, 0.24, 12), M.brass);
  lampHousing.position.set(bayR + 0.05, -0.28, 0);

  const lampGlass = mesh(new THREE.SphereGeometry(0.11, 14, 10), M.lamp, false, false);
  lampGlass.position.set(bayR + 0.05, -0.42, 0);
  bay.add(lampGlass);
  const lampCap = mesh(new THREE.ConeGeometry(0.17, 0.12, 12), M.brassDark);
  lampCap.position.set(bayR + 0.05, -0.14, 0);
  bay.add(lampCap);
}

const gaugeParts = [];   // animated needles

function pressureGauge(scale = 1) {
  const g = new THREE.Group();

  const body = mesh(new THREE.CylinderGeometry(0.17, 0.19, 0.12, 20), M.brass);
  body.rotation.x = Math.PI / 2;
  g.add(body);

  const bezel = mesh(new THREE.TorusGeometry(0.175, 0.028, 8, 24), M.brassDark);
  bezel.position.z = 0.06;
  g.add(bezel);

  const face = mesh(new THREE.CircleGeometry(0.155, 24), M.gaugeFace, false, false);
  face.position.z = 0.062;
  g.add(face);

  // tick marks
  for (let i = 0; i < 11; i++) {
    const a = -Math.PI * 0.72 + (i / 10) * Math.PI * 1.44;
    const t = mesh(new THREE.BoxGeometry(0.012, 0.032, 0.008), M.needle, false, false);
    t.position.set(Math.sin(a) * 0.125, Math.cos(a) * 0.125, 0.068);
    t.rotation.z = -a;
    g.add(t);
  }

  const needle = new THREE.Group();
  const nd = mesh(new THREE.BoxGeometry(0.016, 0.13, 0.008), M.needle, false, false);
  nd.position.y = 0.055;
  needle.add(nd);
  needle.position.z = 0.072;
  g.add(needle);

  const pin = mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.03, 10), M.brass, false, false);
  pin.rotation.x = Math.PI / 2;
  pin.position.z = 0.078;
  g.add(pin);

  // glass dome
  const dome = mesh(new THREE.SphereGeometry(0.16, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2.6), M.glass, false, false);
  dome.rotation.x = Math.PI / 2;
  dome.position.z = 0.062;
  dome.scale.set(1, 0.45, 1);
  g.add(dome);

  // bolts
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    const b = rivet(0.024, M.brassDark);
    b.position.set(Math.cos(a) * 0.19, Math.sin(a) * 0.19, 0.05);
    g.add(b);
  }

  g.scale.setScalar(scale);
  gaugeParts.push({ needle, phase: gaugeParts.length * 1.7, speed: 0.6 + gaugeParts.length * 0.13 });
  return g;
}

function valveWheel(radius = 0.2, mat = M.brass) {
  const g = new THREE.Group();
  const rim = mesh(new THREE.TorusGeometry(radius, radius * 0.13, 8, 22), mat);
  g.add(rim);
  const hub = mesh(new THREE.CylinderGeometry(radius * 0.22, radius * 0.22, radius * 0.34, 12), M.brassDark);
  hub.rotation.x = Math.PI / 2;
  g.add(hub);
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2;
    const sp = mesh(new THREE.BoxGeometry(radius * 0.09, radius * 1.85, radius * 0.07), mat);
    sp.rotation.z = a;
    g.add(sp);
  }
  const stem = mesh(new THREE.CylinderGeometry(radius * 0.11, radius * 0.11, radius * 0.9, 10), M.copper);
  stem.rotation.x = Math.PI / 2;
  stem.position.z = -radius * 0.55;
  g.add(stem);
  return g;
}

  engineBay.add(cluster);

  const g1 = pressureGauge(1.0); g1.position.set(-0.22, 0.06, 0); cluster.add(g1);
  const g2 = pressureGauge(0.78); g2.position.set(0.2, -0.02, 0); cluster.add(g2);
  const g3 = pressureGauge(0.62); g3.position.set(0.06, 0.32, 0); cluster.add(g3);

  const plate = mesh(new THREE.BoxGeometry(0.85, 0.72, 0.06), M.brassDark);
  plate.position.set(0, 0.08, -0.05);
  cluster.add(plate);
  for (let i = 0; i < 4; i++) {
    const b = rivet(0.03, M.brass);
    b.position.set((i % 2 ? 1 : -1) * 0.37, (i < 2 ? 1 : -1) * 0.29 + 0.08, 0.0);
    cluster.add(b);
  }

  // gauges on the cabin rear bulkhead
  const gA = pressureGauge(0.85);
  gA.position.set(-0.98, 1.42, 0.42);
  gA.rotation.y = -Math.PI / 2;
  gondola.add(gA);
  const gB = pressureGauge(0.66);
  gB.position.set(-0.98, 1.12, -0.4);
  gB.rotation.y = -Math.PI / 2;
  gondola.add(gB);

  // gauge on the gondola flank
  [-1, 1].forEach(s => {
    const gS = pressureGauge(0.7);
    gS.position.set(1.35, 0.12, s * (G_W / 2 + 0.05));
    gS.rotation.y = s > 0 ? 0 : Math.PI;
    gondola.add(gS);
  });

  // valve wheels
  const w1 = valveWheel(0.24, M.brass);
  w1.position.set(-0.72, 1.02, 0.0);
  w1.rotation.y = Math.PI / 2;
  engineBay.add(w1);
  spinningWheels.push({ o: w1, s: 0.35 });

  const w2 = valveWheel(0.17, M.copper);
  w2.position.set(0.55, 0.86, 0.3);
  w2.rotation.x = Math.PI / 2;
  engineBay.add(w2);
  spinningWheels.push({ o: w2, s: -0.5 });

  const w3 = valveWheel(0.2, M.brass);
  w3.position.set(-1.0, 0.42, G_W / 2 - 0.02);
  engineBay.add(w3);
  spinningWheels.push({ o: w3, s: 0.28 });

  const w4 = valveWheel(0.15, M.copper);
  w4.position.set(-1.0, 0.42, -G_W / 2 + 0.02);
  w4.rotation.y = Math.PI;
  engineBay.add(w4);
  spinningWheels.push({ o: w4, s: -0.42 });

  const w5 = valveWheel(0.22, M.brass);
  w5.position.set(1.9, -0.1, 0);
  w5.rotation.y = Math.PI / 2;
  w5.rotation.z = 0.3;
  gondola.add(w5);
  spinningWheels.push({ o: w5, s: 0.22 });
}

/* small pipes lacing the gondola exterior */
{
  pipe(gondola, [
    new THREE.Vector3(-2.3, 0.1, 0.7),
    new THREE.Vector3(-1.2, 0.2, 0.76),
    new THREE.Vector3(0.2, 0.16, 0.76),
    new THREE.Vector3(1.3, 0.05, 0.7)
  ], 0.045, M.copper, 40);
  pipe(gondola, [
    new THREE.Vector3(-2.3, -0.05, -0.7),
    new THREE.Vector3(-1.2, 0.05, -0.76),
    new THREE.Vector3(0.2, 0.0, -0.76),
    new THREE.Vector3(1.3, -0.1, -0.7)
  ], 0.045, M.copper, 40);

  // pipe brackets
  for (let i = 0; i < 5; i++) {
    const x = -2.0 + i * 0.85;
    [-1, 1].forEach(s => {
      const br = mesh(new THREE.TorusGeometry(0.065, 0.018, 6, 14), M.brass);
      br.rotation.y = Math.PI / 2;
      br.position.set(x, s > 0 ? 0.14 : 0.0, s * 0.74);
      gondola.add(br);
    });
  }
}

/* rudder at the gondola stern */
{
  const rudderShape = new THREE.Shape();
  rudderShape.moveTo(0, 0);
  rudderShape.lineTo(0.62, 0.12);
  rudderShape.lineTo(0.66, 0.78);
  rudderShape.lineTo(0.06, 0.62);
  rudderShape.closePath();
  const rg = new THREE.ExtrudeGeometry(rudderShape, { depth: 0.05, bevelEnabled: true, bevelSize: 0.015, bevelThickness: 0.015, bevelSegments: 2 });
  rg.center();
  const rud = mesh(rg, M.walnutLight);
  rud.rotation.y = Math.PI / 2;
  rud.position.set(-2.65, 0.62, 0);
  gondola.add(rud);

  const rPost = mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.95, 10), M.brass);
  rPost.position.set(-2.65, 0.62, 0);
  gondola.add(rPost);
}

/* ------------------------------------------------------------
   SUSPENSION FRAME: envelope <-> gondola
   ------------------------------------------------------------ */
{
  const attachXs = [-2.55, -1.25, 0.05, 1.35, 2.65];
  const frame = new THREE.Group();
  ship.add(frame);

  // main brass yoke arms
  attachXs.forEach((x) => {
    const r = envelopeRadius(x / HALF);
    [-1, 1].forEach(s => {
      const top = new THREE.Vector3(x, -r * 0.74 - 0.02, s * r * 0.62);
      const bottom = new THREE.Vector3(
        THREE.MathUtils.clamp(x * 0.72 + 0.15, -2.15, 2.15),
        gondola.position.y + G_H * 0.5 + 0.02,
        s * (G_W / 2 - 0.05)
      );
      // thick rigging cable
      cable(frame, top, bottom, 0.028, M.ironDark);
      // parallel thin cable for the "spidery web"
      const t2 = top.clone().add(new THREE.Vector3(0.16, 0.02, s * 0.1));
      const b2 = bottom.clone().add(new THREE.Vector3(-0.16, 0, 0));
      cable(frame, t2, b2, 0.012);
      const t3 = top.clone().add(new THREE.Vector3(-0.16, 0.02, s * 0.1));
      const b3 = bottom.clone().add(new THREE.Vector3(0.16, 0, 0));
      cable(frame, t3, b3, 0.012);

      // turnbuckle on the thick line
      const midp = new THREE.Vector3().lerpVectors(top, bottom, 0.42);
      const tb = mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.22, 10), M.brass);
      tb.position.copy(midp);
      const dir = new THREE.Vector3().subVectors(bottom, top).normalize();
      tb.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      frame.add(tb);

      // eye-plate on gondola rail
      const eye = mesh(new THREE.TorusGeometry(0.06, 0.02, 6, 14), M.brass);
      eye.position.copy(bottom);
      eye.rotation.x = Math.PI / 2;
      frame.add(eye);
    });
  });

  // longitudinal bracing along the gondola rails up to nose & tail
  const bowTop = new THREE.Vector3(HALF - 1.1, -envelopeRadius((HALF - 1.1) / HALF) * 0.78, 0);
  const sternTop = new THREE.Vector3(-HALF + 1.3, -envelopeRadius((-HALF + 1.3) / HALF) * 0.78, 0);
  const gBow = new THREE.Vector3(gondola.position.x + G_LEN / 2 + 0.1, gondola.position.y + G_H * 0.55, 0);
  const gStern = new THREE.Vector3(gondola.position.x - G_LEN / 2 - 0.1, gondola.position.y + G_H * 0.55, 0);
  cable(frame, bowTop, gBow, 0.022, M.ironDark);
  cable(frame, sternTop, gStern, 0.022, M.ironDark);
  cable(frame, new THREE.Vector3(HALF + 0.35, 0, 0), gBow.clone().add(new THREE.Vector3(0.3, 0.1, 0)), 0.014);
  cable(frame, new THREE.Vector3(-HALF - 0.2, -0.2, 0), gStern.clone().add(new THREE.Vector3(-0.2, 0.1, 0)), 0.014);

  // cross-web: diagonals between adjacent attach points (both sides)
  for (let i = 0; i < attachXs.length - 1; i++) {
    const xa = attachXs[i], xb = attachXs[i + 1];
    const ra = envelopeRadius(xa / HALF), rb = envelopeRadius(xb / HALF);
    [-1, 1].forEach(s => {
      const A = new THREE.Vector3(xa, -ra * 0.74, s * ra * 0.62);
      const B = new THREE.Vector3(xb, -rb * 0.74, s * rb * 0.62);
      const Ag = new THREE.Vector3(THREE.MathUtils.clamp(xa * 0.72 + 0.15, -2.15, 2.15), gondola.position.y + G_H * 0.5 + 0.02, s * (G_W / 2 - 0.05));
      const Bg = new THREE.Vector3(THREE.MathUtils.clamp(xb * 0.72 + 0.15, -2.15, 2.15), gondola.position.y + G_H * 0.5 + 0.02, s * (G_W / 2 - 0.05));
      cable(frame, A, Bg, 0.009);
      cable(frame, B, Ag, 0.009);
      cable(frame, A, B, 0.01);
    });
    // lateral tie under the envelope
    const A2 = new THREE.Vector3(xa, -ra * 0.86, -ra * 0.5);
    const B2 = new THREE.Vector3(xa, -ra * 0.86, ra * 0.5);
    cable(frame, A2, B2, 0.009);
  }

  // web over the envelope: net of cables hugging the upper hull
  for (let s = 0; s < 10; s++) {
    const ang0 = (s / 10) * Math.PI * 2;
    const ang1 = ((s + 1) / 10) * Math.PI * 2;
    for (let i = 0; i < 6; i++) {
      const t0 = -0.78 + (1.56 * i) / 6;
      const t1 = -0.78 + (1.56 * (i + 1)) / 6;
      const r0 = envelopeRadius(t0) + 0.05;
      const r1 = envelopeRadius(t1) + 0.05;
      const P0 = new THREE.Vector3(t0 * HALF, Math.sin(ang0) * r0, Math.cos(ang0) * r0);
      const P1 = new THREE.Vector3(t1 * HALF, Math.sin(ang1) * r1, Math.cos(ang1) * r1);
      cable(envGroup, P0, P1, 0.0075);
    }
  }
}

/* mooring line coiled at the bow of the gondola */
{
  const coil = new THREE.Group();
  coil.position.set(2.05, 0.62, 0.45);
  for (let i = 0; i < 4; i++) {
    const t = mesh(new THREE.TorusGeometry(0.16 - i * 0.028, 0.026, 6, 20), M.rope);
    t.rotation.x = Math.PI / 2;
    t.position.y = i * 0.05;
    coil.add(t);
  }
  gondola.add(coil);

  const cleat = mesh(new THREE.BoxGeometry(0.24, 0.05, 0.06), M.brass);
  cleat.position.set(2.05, 0.6, -0.45);
  gondola.add(cleat);
  const cp1 = mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.12, 8), M.brass);
  cp1.position.set(1.96, 0.55, -0.45);
  gondola.add(cp1);
  const cp2 = cp1.clone();
  cp2.position.x = 2.14;
  gondola.add(cp2);
}

/* ------------------------------------------------------------
   STEAM PUFFS (soft translucent billows above the stacks)
   ------------------------------------------------------------ */
const puffs = [];
{
  const puffMat = new THREE.MeshStandardMaterial({
    color: 0xd8d3cc, roughness: 1.0, metalness: 0.0,
    transparent: true, opacity: 0.16, depthWrite: false
  });
  const puffGeo = new THREE.SphereGeometry(0.2, 12, 10);
  for (let i = 0; i < 14; i++) {
    const p = new THREE.Mesh(puffGeo, puffMat.clone());
    const side = i % 2 === 0 ? -0.42 : 0.30;
    p.position.set(-1.55 + (i % 2 === 0 ? -0.18 : 0.16) + 0.15, G_H * 0.5 + 3.0, side);
    p.userData = {
      x0: -1.55 + (i % 2 === 0 ? -0.18 : 0.16) + 0.15,
      z0: side,
      t: (i / 14) * 1.0,
      sp: 0.16 + (i % 5) * 0.014,
      drift: (i % 3 - 1) * 0.16
    };
    gondola.add(p);
    puffs.push(p);
  }
}

/* ============================================================
   FRAME / CENTERING
   ============================================================ */
ship.updateMatrixWorld(true);
{
  const box = new THREE.Box3().setFromObject(ship);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  ship.position.sub(center);          // center the single object at origin
  ship.position.y += 0.0;

  const maxDim = Math.max(size.x, size.y, size.z);
  const dist = (maxDim / 2) / Math.tan((camera.fov * Math.PI / 180) / 2) * 1.15;
  camera.position.set(dist * 0.62, dist * 0.24, dist * 0.72);
  controls.target.set(0, 0, 0);
  controls.minDistance = maxDim * 0.5;
  controls.maxDistance = maxDim * 3.2;
  ground.position.y = -size.y * 0.62;
  key.shadow.camera.left = -maxDim * 0.8;
  key.shadow.camera.right = maxDim * 0.8;
  key.shadow.camera.top = maxDim * 0.8;
  key.shadow.camera.bottom = -maxDim * 0.8;
  key.shadow.camera.updateProjectionMatrix();
  controls.update();
}

/* keep the point lights attached to the ship's moving parts */
ship.add(boilerGlow);
ship.add(lampGlow);
boilerGlow.position.set(gondola.position.x + 0.4, gondola.position.y + 1.0, 0);
lampGlow.position.set(gondola.position.x + 2.3, gondola.position.y + 0.6, 0);

/* ============================================================
   ANIMATION
   ============================================================ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // propeller spin
  propSpinner.rotation.x -= dt * 9.0;

  // valve wheels idle-turn
  for (const w of spinningWheels) w.o.rotation.z += dt * w.s;

  // gauge needles jitter
  for (const g of gaugeParts) {
    g.needle.rotation.z = Math.sin(t * g.speed + g.phase) * 0.55 + Math.sin(t * 5.3 + g.phase) * 0.035 - 0.35;
  }

  // gentle airborne bob
  ship.position.y = Math.sin(t * 0.55) * 0.09;
  ship.rotation.z = Math.sin(t * 0.4) * 0.012;
  ship.rotation.x = Math.sin(t * 0.33 + 1.0) * 0.008;

  // ember flicker
  boilerGlow.intensity = 2.0 + Math.sin(t * 7.3) * 0.35 + Math.sin(t * 17.1) * 0.15;
  M.emberGlass.emissiveIntensity = 2.2 + Math.sin(t * 9.1) * 0.5;

  // steam puffs rise and fade
  for (const p of puffs) {
    const u = p.userData;
    u.t += dt * u.sp;
    if (u.t > 1) u.t -= 1;
    const e = u.t;
    p.position.set(
      u.x0 + u.drift * e * 1.6,
      G_H * 0.5 + 2.25 + e * 2.4,
      u.z0 + Math.sin(e * 3.0 + u.sp * 10) * 0.18
    );
    const s = 0.55 + e * 2.6;
    p.scale.setScalar(s);
    p.material.opacity = 0.2 * (1 - e) * Math.min(1, e * 5);
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});
</script>
