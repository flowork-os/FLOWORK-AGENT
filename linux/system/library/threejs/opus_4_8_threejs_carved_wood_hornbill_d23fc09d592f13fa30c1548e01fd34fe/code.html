<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   Renderer / Scene / Camera
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.05, 100);
camera.position.set(1.75, 1.35, 3.05);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.target.set(0, 0.92, 0);
controls.minDistance = 1.4;
controls.maxDistance = 8.0;
controls.maxPolarAngle = Math.PI * 0.52;
controls.update();

/* ============================================================
   Lighting: hemisphere ambient + key + fill + rim
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xffe9cf, 0x241a13, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff0d8, 2.5);
key.position.set(3.0, 4.4, 2.6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 16;
key.shadow.camera.left = -3;
key.shadow.camera.right = 3;
key.shadow.camera.top = 3;
key.shadow.camera.bottom = -3;
key.shadow.bias = -0.0009;
key.shadow.normalBias = 0.015;
key.shadow.radius = 3;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbfd2ff, 0.42);
fill.position.set(-3.6, 1.9, 1.7);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd9a0, 1.35);
rim.position.set(-1.6, 2.4, -3.4);
scene.add(rim);

const bounce = new THREE.PointLight(0xffbb77, 0.35, 6, 2);
bounce.position.set(0.6, 0.25, 1.2);
scene.add(bounce);

/* ---- shadow-only ground ---- */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(9, 64).rotateX(-Math.PI / 2),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ============================================================
   Small deterministic PRNG + noise helpers
   ============================================================ */
function makeRand(seed) {
  let s = seed >>> 0;
  return function () {
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5;  s >>>= 0;
    return (s >>> 0) / 4294967296;
  };
}
const rand = makeRand(20260720);

function hash3(x, y, z) {
  let h = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
  return h - Math.floor(h);
}
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  function lerp(a, b, t) { return a + (b - a) * t; }
  const c000 = hash3(xi, yi, zi),       c100 = hash3(xi + 1, yi, zi);
  const c010 = hash3(xi, yi + 1, zi),   c110 = hash3(xi + 1, yi + 1, zi);
  const c001 = hash3(xi, yi, zi + 1),   c101 = hash3(xi + 1, yi, zi + 1);
  const c011 = hash3(xi, yi + 1, zi + 1), c111 = hash3(xi + 1, yi + 1, zi + 1);
  const x00 = lerp(c000, c100, u), x10 = lerp(c010, c110, u);
  const x01 = lerp(c001, c101, u), x11 = lerp(c011, c111, u);
  return lerp(lerp(x00, x10, v), lerp(x01, x11, v), w);
}
function fbm(x, y, z) {
  return vnoise(x, y, z) * 0.6 + vnoise(x * 2.1, y * 2.1, z * 2.1) * 0.28 + vnoise(x * 4.3, y * 4.3, z * 4.3) * 0.12;
}

/* ============================================================
   Procedural wood-grain canvas textures
   ============================================================ */
function woodTexture(opts) {
  const o = Object.assign({
    size: 512,
    base: [104, 52, 30],
    dark: [46, 20, 11],
    light: [162, 96, 58],
    rings: 15.0,
    turbulence: 0.55,
    diagonal: 0.0,
    contrast: 1.0,
    speckle: 0.05
  }, opts || {});

  const S = o.size;
  const cv = document.createElement('canvas');
  cv.width = S; cv.height = S;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(S, S);
  const d = img.data;

  const ca = Math.cos(o.diagonal), sa = Math.sin(o.diagonal);

  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const u = x / S, v = y / S;
      // rotate uv for diagonal grain sweep
      const ru = u * ca - v * sa;
      const rv = u * sa + v * ca;

      const n = fbm(ru * 3.0, rv * 1.1, 0.5) - 0.5;
      let g = Math.sin((rv * o.rings + n * o.turbulence * 9.0) * Math.PI * 2.0);
      g = Math.pow(Math.abs(g), 0.55) * Math.sign(g);
      let t = g * 0.5 + 0.5;
      t = Math.pow(t, o.contrast);

      // fine fiber streaks along the grain
      const fiber = (vnoise(ru * 220.0, rv * 6.0, 3.7) - 0.5) * 0.16;
      t = Math.min(1, Math.max(0, t + fiber));

      // occasional darker figure
      const figure = Math.max(0, fbm(ru * 1.7 + 9.3, rv * 1.7 - 4.1, 8.8) - 0.55) * 1.8;
      t = Math.max(0, t - figure * 0.55);

      let r, gg, b;
      if (t < 0.5) {
        const k = t / 0.5;
        r = o.dark[0] + (o.base[0] - o.dark[0]) * k;
        gg = o.dark[1] + (o.base[1] - o.dark[1]) * k;
        b = o.dark[2] + (o.base[2] - o.dark[2]) * k;
      } else {
        const k = (t - 0.5) / 0.5;
        r = o.base[0] + (o.light[0] - o.base[0]) * k;
        gg = o.base[1] + (o.light[1] - o.base[1]) * k;
        b = o.base[2] + (o.light[2] - o.base[2]) * k;
      }

      const sp = (hash3(x * 0.37, y * 0.53, 1.1) - 0.5) * 255 * o.speckle;
      r += sp; gg += sp; b += sp;

      const i = (y * S + x) * 4;
      d[i]     = Math.min(255, Math.max(0, r));
      d[i + 1] = Math.min(255, Math.max(0, gg));
      d[i + 2] = Math.min(255, Math.max(0, b));
      d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);

  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return tex;
}

function bumpFromWood(opts) {
  const o = Object.assign({ size: 512, rings: 15.0, turbulence: 0.55, diagonal: 0.0, strength: 1.0 }, opts || {});
  const S = o.size;
  const cv = document.createElement('canvas');
  cv.width = S; cv.height = S;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(S, S);
  const d = img.data;
  const ca = Math.cos(o.diagonal), sa = Math.sin(o.diagonal);

  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const u = x / S, v = y / S;
      const ru = u * ca - v * sa;
      const rv = u * sa + v * ca;
      const n = fbm(ru * 3.0, rv * 1.1, 0.5) - 0.5;
      let g = Math.sin((rv * o.rings + n * o.turbulence * 9.0) * Math.PI * 2.0) * 0.5 + 0.5;
      const fiber = (vnoise(ru * 240.0, rv * 5.0, 2.2) - 0.5) * 0.35;
      let t = Math.min(1, Math.max(0, (g * 0.75 + fiber * 0.5 + 0.12)));
      t = 0.5 + (t - 0.5) * o.strength;
      const c = Math.min(255, Math.max(0, t * 255));
      const i = (y * S + x) * 4;
      d[i] = d[i + 1] = d[i + 2] = c;
      d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 4;
  return tex;
}

/* ---- Texture set ---- */
const mahoganyMap  = woodTexture({ base: [116, 56, 31], dark: [56, 23, 12], light: [178, 106, 62], rings: 13, turbulence: 0.6, diagonal: 0.32, contrast: 1.05 });
const mahoganyBump = bumpFromWood({ rings: 13, turbulence: 0.6, diagonal: 0.32, strength: 0.9 });

const tailMap  = woodTexture({ base: [92, 43, 24], dark: [28, 12, 7], light: [156, 88, 50], rings: 9, turbulence: 0.95, diagonal: -0.85, contrast: 1.25, speckle: 0.045 });
const tailBump = bumpFromWood({ rings: 9, turbulence: 0.95, diagonal: -0.85, strength: 1.1 });

const mapleMap = woodTexture({ base: [225, 198, 148], dark: [186, 154, 105], light: [246, 226, 186], rings: 22, turbulence: 0.22, diagonal: 1.35, contrast: 0.85, speckle: 0.02 });
const mapleBump = bumpFromWood({ rings: 22, turbulence: 0.22, diagonal: 1.35, strength: 0.35 });

const stumpMap  = woodTexture({ base: [96, 55, 32], dark: [40, 21, 12], light: [148, 94, 56], rings: 26, turbulence: 1.35, diagonal: 0.06, contrast: 1.2, speckle: 0.07 });
const stumpBump = bumpFromWood({ rings: 26, turbulence: 1.35, diagonal: 0.06, strength: 1.3 });

const ebonyMap = woodTexture({ base: [40, 26, 20], dark: [16, 10, 8], light: [72, 50, 38], rings: 18, turbulence: 0.8, diagonal: 0.9, contrast: 1.2, speckle: 0.03 });

/* ============================================================
   Materials — waxed mahogany, glassy maple, dark accents
   ============================================================ */
const matMahogany = new THREE.MeshPhysicalMaterial({
  map: mahoganyMap,
  bumpMap: mahoganyBump,
  bumpScale: 0.012,
  color: 0xffffff,
  roughness: 0.52,
  metalness: 0.0,
  clearcoat: 0.5,
  clearcoatRoughness: 0.42,
  sheen: 0.32,
  sheenColor: new THREE.Color(0xffcb90),
  sheenRoughness: 0.7,
  flatShading: true
});

const matTail = new THREE.MeshPhysicalMaterial({
  map: tailMap,
  bumpMap: tailBump,
  bumpScale: 0.01,
  roughness: 0.48,
  metalness: 0.0,
  clearcoat: 0.55,
  clearcoatRoughness: 0.35,
  sheen: 0.28,
  sheenColor: new THREE.Color(0xffbe80),
  flatShading: true
});

const matMaple = new THREE.MeshPhysicalMaterial({
  map: mapleMap,
  bumpMap: mapleBump,
  bumpScale: 0.003,
  roughness: 0.11,
  metalness: 0.0,
  clearcoat: 1.0,
  clearcoatRoughness: 0.045,
  reflectivity: 0.6,
  sheen: 0.15,
  sheenColor: new THREE.Color(0xfff3dd),
  flatShading: false
});

const matMapleSmoothDeep = matMaple.clone();
matMapleSmoothDeep.color = new THREE.Color(0xf2d9ad);

const matEbony = new THREE.MeshPhysicalMaterial({
  map: ebonyMap,
  roughness: 0.28,
  metalness: 0.0,
  clearcoat: 0.7,
  clearcoatRoughness: 0.18,
  color: 0xdcdcdc
});

const matStump = new THREE.MeshPhysicalMaterial({
  map: stumpMap,
  bumpMap: stumpBump,
  bumpScale: 0.02,
  roughness: 0.68,
  metalness: 0.0,
  clearcoat: 0.28,
  clearcoatRoughness: 0.6,
  flatShading: true
});

const matEye = new THREE.MeshPhysicalMaterial({
  color: 0x140b07,
  roughness: 0.06,
  metalness: 0.0,
  clearcoat: 1.0,
  clearcoatRoughness: 0.02
});

const matBase = new THREE.MeshPhysicalMaterial({
  map: ebonyMap,
  color: 0x9a8f86,
  roughness: 0.5,
  metalness: 0.0,
  clearcoat: 0.4,
  clearcoatRoughness: 0.4
});

/* ============================================================
   Geometry helpers
   ============================================================ */

// Facet a geometry: displace vertices by low-freq noise, then flat-shade
// to read as chisel/gouge marks across a carved surface.
function chiselFacets(geo, amount, freq, seedOff) {
  const pos = geo.attributes.position;
  const so = seedOff || 0.0;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const n1 = fbm(x * freq + so, y * freq * 0.8 + so * 1.7, z * freq + so * 2.3) - 0.5;
    const n2 = vnoise(x * freq * 2.4 + 5.0, y * freq * 2.4 + 3.0, z * freq * 2.4 + 7.0) - 0.5;
    const len = Math.sqrt(x * x + y * y + z * z) || 1.0;
    const k = (n1 * 0.75 + n2 * 0.45) * amount;
    pos.setXYZ(i, x + (x / len) * k, y + (y / len) * k, z + (z / len) * k);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

// Quantize normals into broad planar facets by welding-free flat shading.
function toFlat(geo) {
  const g = geo.toNonIndexed ? geo.toNonIndexed() : geo;
  g.computeVertexNormals();
  return g;
}

// Lathe profile builder from an array of [radius, y] pairs, resampled smooth.
function latheFrom(points, segments, capBottom) {
  const pts = points.map(p => new THREE.Vector2(Math.max(0.0006, p[0]), p[1]));
  const g = new THREE.LatheGeometry(pts, segments);
  g.computeVertexNormals();
  return g;
}

// Catmull-Rom resample of profile pairs for smoother lathes.
function resampleProfile(pairs, n) {
  const curve = new THREE.CatmullRomCurve3(
    pairs.map(p => new THREE.Vector3(p[0], p[1], 0)), false, 'catmullrom', 0.35
  );
  const out = [];
  for (let i = 0; i <= n; i++) {
    const v = curve.getPoint(i / n);
    out.push([Math.max(0.0006, v.x), v.y]);
  }
  return out;
}

/* ============================================================
   THE HORNBILL — one carved object
   ============================================================ */
const hornbill = new THREE.Group();
scene.add(hornbill);

const carving = new THREE.Group();  // bird + stump, all one "block"
hornbill.add(carving);

/* ---------- Base plinth (the bottom of the carved block) ---------- */
{
  const plinth = new THREE.Mesh(
    new THREE.CylinderGeometry(0.42, 0.46, 0.075, 48, 1),
    matBase
  );
  plinth.position.y = 0.037;
  plinth.castShadow = true;
  plinth.receiveShadow = true;
  carving.add(plinth);

  const bevel = new THREE.Mesh(
    new THREE.TorusGeometry(0.425, 0.016, 10, 56).rotateX(Math.PI / 2),
    matBase
  );
  bevel.position.y = 0.072;
  bevel.castShadow = true;
  bevel.receiveShadow = true;
  carving.add(bevel);
}

/* ---------- The stump the bird perches on ---------- */
const stumpTopY = 0.60;
{
  const prof = resampleProfile([
    [0.34, 0.070],
    [0.30, 0.13],
    [0.255, 0.24],
    [0.238, 0.36],
    [0.246, 0.47],
    [0.262, 0.555],
    [0.268, stumpTopY - 0.012],
    [0.246, stumpTopY],
    [0.16, stumpTopY + 0.005],
    [0.0, stumpTopY - 0.005]
  ], 46);

  let g = latheFrom(prof, 40);
  // Bark-like vertical chisel flutes
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const r = Math.sqrt(x * x + z * z);
    if (r < 0.02) continue;
    const ang = Math.atan2(z, x);
    const flute = Math.sin(ang * 11.0 + y * 2.2) * 0.010 + Math.sin(ang * 23.0 - y * 5.0) * 0.005;
    const bulge = (fbm(x * 5.0, y * 3.0, z * 5.0) - 0.5) * 0.03;
    const nr = r + flute + bulge;
    pos.setXYZ(i, (x / r) * nr, y, (z / r) * nr);
  }
  pos.needsUpdate = true;
  g = toFlat(g);
  const stump = new THREE.Mesh(g, matStump);
  stump.castShadow = true;
  stump.receiveShadow = true;
  carving.add(stump);

  // A couple of sawn-off branch nubs
  const nubData = [
    { a: 0.7, y: 0.40, len: 0.13, r0: 0.055, r1: 0.042, tilt: 0.55 },
    { a: 3.6, y: 0.30, len: 0.10, r0: 0.048, r1: 0.036, tilt: 0.75 }
  ];
  nubData.forEach(n => {
    const gg = toFlat(new THREE.CylinderGeometry(n.r1, n.r0, n.len, 12, 1));
    const m = new THREE.Mesh(gg, matStump);
    m.position.set(Math.cos(n.a) * 0.24, n.y, Math.sin(n.a) * 0.24);
    m.rotation.z = -n.tilt * Math.cos(n.a);
    m.rotation.x = n.tilt * Math.sin(n.a);
    m.translateY(n.len * 0.45);
    m.castShadow = true;
    m.receiveShadow = true;
    carving.add(m);

    const cap = new THREE.Mesh(new THREE.CircleGeometry(n.r1 * 0.98, 12), matBase);
    cap.position.copy(m.position);
    cap.rotation.copy(m.rotation);
    cap.translateY(n.len * 0.5 + 0.001);
    cap.rotateX(-Math.PI / 2);
    carving.add(cap);
  });

  // Root flare at the bottom
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + 0.35;
    const gg = toFlat(new THREE.ConeGeometry(0.075, 0.20, 7, 1));
    const m = new THREE.Mesh(gg, matStump);
    m.position.set(Math.cos(a) * 0.29, 0.14, Math.sin(a) * 0.29);
    m.rotation.z = Math.cos(a) * 0.28;
    m.rotation.x = -Math.sin(a) * 0.28;
    m.scale.set(1.0, 1.25, 0.7);
    m.castShadow = true;
    m.receiveShadow = true;
    carving.add(m);
  }
}

/* ---------- Bird group (so it can be posed as a unit) ---------- */
const bird = new THREE.Group();
bird.position.set(0, stumpTopY, 0);
bird.rotation.y = -0.22;
carving.add(bird);

/* ---------- BODY: lathe + chisel faceting ---------- */
const bodyPivotY = 0.42;   // local to bird
{
  const prof = resampleProfile([
    [0.005, -0.34],   // vent / under-tail
    [0.085, -0.30],
    [0.155, -0.22],
    [0.196, -0.10],
    [0.214,  0.02],
    [0.212,  0.14],
    [0.190,  0.26],
    [0.152,  0.36],
    [0.112,  0.44],
    [0.080,  0.50],
    [0.062,  0.545],
    [0.005,  0.57]
  ], 54);

  let g = latheFrom(prof, 44);

  // Squash to an ovoid breast: deeper front-to-back, narrower side-to-side
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    // z is "forward" (breast). Push breast forward, flatten back slightly.
    const fwd = z > 0 ? 1.13 : 0.96;
    pos.setXYZ(i, x * 0.90, y, z * fwd);
  }
  pos.needsUpdate = true;

  // Gouge facets across the breast/body
  g = toFlat(g);
  chiselFacets(g, 0.016, 5.6, 1.1);

  // Add broad chisel scallops: quantize the radius in bands
  const p2 = g.attributes.position;
  for (let i = 0; i < p2.count; i++) {
    const x = p2.getX(i), y = p2.getY(i), z = p2.getZ(i);
    const r = Math.sqrt(x * x + z * z);
    if (r < 0.004) continue;
    const ang = Math.atan2(z, x);
    const scallop = Math.sin(ang * 9.0 + y * 4.0) * 0.0075 * Math.min(1, (0.55 - Math.abs(y - 0.1)) * 2.2);
    const nr = Math.max(0.002, r + scallop);
    p2.setXYZ(i, (x / r) * nr, y, (z / r) * nr);
  }
  p2.needsUpdate = true;
  g.computeVertexNormals();

  const body = new THREE.Mesh(g, matMahogany);
  body.position.y = bodyPivotY;
  body.rotation.x = -0.10;
  body.castShadow = true;
  body.receiveShadow = true;
  bird.add(body);
}

/* ---------- NECK + HEAD ---------- */
const headGroup = new THREE.Group();
headGroup.position.set(0, bodyPivotY + 0.545, 0.055);
headGroup.rotation.x = 0.10;
bird.add(headGroup);

{
  // neck
  let ng = toFlat(new THREE.CylinderGeometry(0.072, 0.098, 0.13, 20, 3));
  chiselFacets(ng, 0.006, 9.0, 3.3);
  const neck = new THREE.Mesh(ng, matMahogany);
  neck.position.set(0, -0.045, -0.005);
  neck.rotation.x = -0.16;
  neck.castShadow = true;
  neck.receiveShadow = true;
  headGroup.add(neck);

  // head — smooth-ish ovoid, mahogany
  let hg = new THREE.SphereGeometry(0.098, 32, 24);
  hg.scale(0.94, 0.98, 1.20);
  hg = toFlat(hg);
  chiselFacets(hg, 0.0045, 11.0, 6.2);
  const head = new THREE.Mesh(hg, matMahogany);
  head.position.set(0, 0.070, 0.018);
  head.castShadow = true;
  head.receiveShadow = true;
  headGroup.add(head);

  // Nape crest ridge (shallow relief, carved)
  const crestShape = new THREE.Shape();
  crestShape.moveTo(0, -0.06);
  crestShape.quadraticCurveTo(0.055, 0.02, 0.030, 0.105);
  crestShape.quadraticCurveTo(0.012, 0.14, -0.012, 0.10);
  crestShape.quadraticCurveTo(-0.030, 0.03, -0.020, -0.06);
  crestShape.lineTo(0, -0.06);
  const crestGeo = new THREE.ExtrudeGeometry(crestShape, {
    depth: 0.030, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.008, bevelSegments: 3, curveSegments: 12
  });
  crestGeo.translate(0, 0, -0.015);
  const crest = new THREE.Mesh(toFlat(crestGeo), matMahogany);
  crest.position.set(0, 0.115, -0.070);
  crest.rotation.set(0.42, Math.PI / 2, 0);
  crest.castShadow = true;
  crest.receiveShadow = true;
  headGroup.add(crest);

  // Eyes: dark polished beads set in a shallow maple ring
  [-1, 1].forEach(s => {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.0165, 20, 16), matEye);
    eye.position.set(s * 0.072, 0.083, 0.062);
    eye.scale.set(1, 1, 0.75);
    headGroup.add(eye);

    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(0.024, 0.0058, 10, 24),
      matMaple
    );
    ring.position.set(s * 0.0715, 0.083, 0.056);
    ring.rotation.y = s * 0.30;
    ring.castShadow = true;
    headGroup.add(ring);

    // brow gouge above the eye
    const brow = new THREE.Mesh(
      new THREE.TorusGeometry(0.040, 0.0055, 8, 20, Math.PI * 0.75),
      matMahogany
    );
    brow.position.set(s * 0.062, 0.100, 0.048);
    brow.rotation.set(0.15, s * 0.35, s * -0.5 + (s > 0 ? 0.1 : -0.1));
    headGroup.add(brow);
  });

  // Bare throat patch suggestion — shallow carved lens
  const throat = new THREE.Mesh(
    new THREE.SphereGeometry(0.055, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.55),
    matEbony
  );
  throat.position.set(0, -0.020, 0.062);
  throat.rotation.x = 1.15;
  throat.scale.set(1.0, 0.5, 0.55);
  headGroup.add(throat);
}

/* ============================================================
   THE BILL + CASQUE — pale maple, polished glassy smooth
   ============================================================ */
const billGroup = new THREE.Group();
billGroup.position.set(0, 0.055, 0.100);
headGroup.add(billGroup);

// Build the huge downcurved bill by lofting elliptical rings along a curve.
function buildBill() {
  const curve = new THREE.CubicBezierCurve3(
    new THREE.Vector3(0, 0.012, 0.00),
    new THREE.Vector3(0, 0.030, 0.17),
    new THREE.Vector3(0, -0.020, 0.34),
    new THREE.Vector3(0, -0.150, 0.415)
  );

  const N = 64;        // rings along the bill
  const R = 26;        // radial segments per ring
  const positions = [];
  const normals = [];
  const uvs = [];
  const indices = [];

  const up = new THREE.Vector3(0, 1, 0);
  const tmpT = new THREE.Vector3();
  const tmpN = new THREE.Vector3();
  const tmpB = new THREE.Vector3();

  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const p = curve.getPoint(t);
    curve.getTangent(t, tmpT).normalize();
    tmpB.crossVectors(tmpT, up);
    if (tmpB.lengthSq() < 1e-8) tmpB.set(1, 0, 0);
    tmpB.normalize();                        // side axis
    tmpN.crossVectors(tmpB, tmpT).normalize(); // up axis in ring plane

    // taper: wide at base, needle at tip
    const taper = Math.pow(1.0 - t, 0.72);
    const halfW = (0.052 * taper + 0.004);
    // upper/lower half-heights: deep base, thin tip
    const halfH = (0.072 * Math.pow(1.0 - t, 0.62) + 0.0045);

    for (let j = 0; j <= R; j++) {
      const a = (j / R) * Math.PI * 2.0;
      const ca = Math.cos(a), sa = Math.sin(a);

      // Squared-off superellipse cross-section: flat-ish sides, keeled top+bottom
      const e = 2.35;
      const sx = Math.sign(ca) * Math.pow(Math.abs(ca), 2.0 / e);
      const sy = Math.sign(sa) * Math.pow(Math.abs(sa), 2.0 / e);

      // Cutting edge (tomium) slightly flared at the seam line
      const seam = Math.exp(-Math.pow(sy / 0.16, 2.0)) * 0.10;
      const w = halfW * (1.0 + seam);

      const vx = tmpB.x * sx * w + tmpN.x * sy * halfH;
      const vy = tmpB.y * sx * w + tmpN.y * sy * halfH;
      const vz = tmpB.z * sx * w + tmpN.z * sy * halfH;

      positions.push(p.x + vx, p.y + vy, p.z + vz);
      normals.push(0, 0, 0);
      uvs.push(j / R, t);
    }
  }

  for (let i = 0; i < N; i++) {
    for (let j = 0; j < R; j++) {
      const a = i * (R + 1) + j;
      const b = a + R + 1;
      indices.push(a, b, a + 1);
      indices.push(b, b + 1, a + 1);
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(indices);
  g.computeVertexNormals();
  return g;
}

{
  const billMesh = new THREE.Mesh(buildBill(), matMaple);
  billMesh.castShadow = true;
  billMesh.receiveShadow = true;
  billGroup.add(billMesh);

  // Base plate where the bill meets the face
  const plate = new THREE.Mesh(
    new THREE.SphereGeometry(0.060, 24, 18),
    matMaple
  );
  plate.scale.set(0.95, 1.18, 0.55);
  plate.position.set(0, 0.010, -0.012);
  plate.castShadow = true;
  billGroup.add(plate);

  // ---- CASQUE: the big polished helmet ridge above the bill ----
  const casqueShape = new THREE.Shape();
  casqueShape.moveTo(-0.045, 0.0);
  casqueShape.bezierCurveTo(-0.055, 0.075, 0.020, 0.115, 0.115, 0.100);
  casqueShape.bezierCurveTo(0.205, 0.085, 0.268, 0.048, 0.300, 0.006);
  casqueShape.bezierCurveTo(0.240, 0.010, 0.130, 0.006, -0.045, 0.0);

  const casqueGeo = new THREE.ExtrudeGeometry(casqueShape, {
    depth: 0.086,
    bevelEnabled: true,
    bevelThickness: 0.026,
    bevelSize: 0.026,
    bevelOffset: 0,
    bevelSegments: 8,
    curveSegments: 36
  });
  casqueGeo.translate(0, 0, -0.043);
  casqueGeo.computeVertexNormals();

  const casque = new THREE.Mesh(casqueGeo, matMaple);
  // Extrusion is in the XY plane with depth along Z; rotate so length runs +Z.
  casque.rotation.set(0, Math.PI / 2, 0);
  casque.position.set(0, 0.044, 0.020);
  casque.scale.set(1.0, 1.0, 1.02);
  casque.castShadow = true;
  casque.receiveShadow = true;
  billGroup.add(casque);

  // Casque crown highlight ridge — a slim polished welt along the top
  const ridgeCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 0.140, -0.030),
    new THREE.Vector3(0, 0.163, 0.060),
    new THREE.Vector3(0, 0.156, 0.150),
    new THREE.Vector3(0, 0.120, 0.235),
    new THREE.Vector3(0, 0.070, 0.300)
  ]);
  const ridge = new THREE.Mesh(
    new THREE.TubeGeometry(ridgeCurve, 40, 0.011, 12, false),
    matMaple
  );
  ridge.castShadow = true;
  billGroup.add(ridge);

  // Dark carved seam between upper and lower mandible
  const seamCurve = new THREE.CubicBezierCurve3(
    new THREE.Vector3(0, 0.010, 0.005),
    new THREE.Vector3(0, 0.026, 0.170),
    new THREE.Vector3(0, -0.024, 0.335),
    new THREE.Vector3(0, -0.148, 0.410)
  );
  const seam = new THREE.Mesh(
    new THREE.TubeGeometry(seamCurve, 60, 0.0055, 10, false),
    matEbony
  );
  seam.scale.set(1.0, 1.0, 1.0);
  billGroup.add(seam);

  // Fine incised growth lines across the bill (shallow relief)
  for (let i = 0; i < 7; i++) {
    const t = 0.10 + i * 0.085;
    const p = new THREE.CubicBezierCurve3(
      new THREE.Vector3(0, 0.012, 0.00),
      new THREE.Vector3(0, 0.030, 0.17),
      new THREE.Vector3(0, -0.020, 0.34),
      new THREE.Vector3(0, -0.150, 0.415)
    ).getPoint(t);
    const taper = Math.pow(1.0 - t, 0.7);
    const rr = 0.058 * taper + 0.006;
    const line = new THREE.Mesh(
      new THREE.TorusGeometry(rr, 0.0022, 6, 22),
      matMapleSmoothDeep
    );
    line.position.copy(p);
    line.rotation.x = Math.PI / 2 - t * 0.85;
    line.scale.set(1.0, 1.25, 1.0);
    billGroup.add(line);
  }
}

/* ============================================================
   WINGS — folded, with shallow relief feather lines
   ============================================================ */
function buildWing(side) {
  const wing = new THREE.Group();

  // Wing shield: a flattened, tapered shell hugging the body
  const shape = new THREE.Shape();
  shape.moveTo(0, 0.22);
  shape.bezierCurveTo(0.115, 0.19, 0.150, 0.02, 0.120, -0.20);
  shape.bezierCurveTo(0.100, -0.32, 0.055, -0.40, 0.010, -0.425);
  shape.bezierCurveTo(-0.035, -0.36, -0.070, -0.14, -0.062, 0.06);
  shape.bezierCurveTo(-0.055, 0.16, -0.030, 0.215, 0, 0.22);

  let g = new THREE.ExtrudeGeometry(shape, {
    depth: 0.055,
    bevelEnabled: true,
    bevelThickness: 0.030,
    bevelSize: 0.028,
    bevelSegments: 6,
    curveSegments: 28
  });
  g.translate(0, 0, -0.0275);

  // Curve the shield around the body barrel + add gouge facets
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const bend = -(x * x) * 1.45 - (y * y) * 0.30;
    const fac = (fbm(x * 7.0 + 2.0, y * 7.0, z * 7.0) - 0.5) * 0.012;
    pos.setXYZ(i, x, y, z + bend + fac);
  }
  pos.needsUpdate = true;
  g = toFlat(g);
  g.computeVertexNormals();

  const shell = new THREE.Mesh(g, matMahogany);
  shell.castShadow = true;
  shell.receiveShadow = true;
  wing.add(shell);

  // Shallow relief lines suggesting each folded flight feather
  const featherCount = 9;
  for (let i = 0; i < featherCount; i++) {
    const t = i / (featherCount - 1);
    const xTop = -0.040 + t * 0.135;
    const xBot = -0.010 + t * 0.115;
    const yTop = 0.175 - t * 0.075;
    const yBot = -0.395 + t * 0.180;

    const c = new THREE.CatmullRomCurve3([
      new THREE.Vector3(xTop, yTop, 0.052),
      new THREE.Vector3((xTop + xBot) * 0.5 + 0.012, (yTop + yBot) * 0.5, 0.060),
      new THREE.Vector3(xBot, yBot, 0.030)
    ]);
    const r = 0.0042 - t * 0.0010;
    const tube = new THREE.TubeGeometry(c, 26, Math.max(0.0018, r), 7, false);
    // press the relief lines onto the curved shell surface
    const tp = tube.attributes.position;
    for (let k = 0; k < tp.count; k++) {
      const x = tp.getX(k), y = tp.getY(k), z = tp.getZ(k);
      const bend = -(x * x) * 1.45 - (y * y) * 0.30;
      tp.setXYZ(k, x, y, z + bend);
    }
    tp.needsUpdate = true;
    tube.computeVertexNormals();

    const line = new THREE.Mesh(tube, i > featherCount - 4 ? matTail : matMahogany);
    line.castShadow = true;
    wing.add(line);
  }

  // Coverts: a stepped block of shorter feathers near the shoulder
  for (let i = 0; i < 5; i++) {
    const t = i / 4;
    const cs = new THREE.Shape();
    cs.moveTo(0, 0);
    cs.quadraticCurveTo(0.030, -0.010, 0.032, -0.070);
    cs.quadraticCurveTo(0.016, -0.098, -0.004, -0.070);
    cs.quadraticCurveTo(-0.020, -0.020, 0, 0);
    const cg = new THREE.ExtrudeGeometry(cs, {
      depth: 0.014, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.008, bevelSegments: 3, curveSegments: 12
    });
    const cm = new THREE.Mesh(toFlat(cg), matMahogany);
    cm.position.set(-0.045 + t * 0.140, 0.150 - t * 0.055, 0.052 - (t * 0.10) * (t * 0.10) * 1.45);
    cm.rotation.set(0.15, 0, -0.20 + t * 0.35);
    cm.castShadow = true;
    wing.add(cm);
  }

  wing.scale.x = side;
  return wing;
}

{
  const wl = buildWing(1);
  wl.position.set(0.183, bodyPivotY + 0.115, 0.010);
  wl.rotation.set(-0.06, 0.30, -0.06);
  bird.add(wl);

  const wr = buildWing(-1);
  wr.position.set(-0.183, bodyPivotY + 0.115, 0.010);
  wr.rotation.set(-0.06, -0.30, 0.06);
  bird.add(wr);
}

/* ============================================================
   TAIL — long, dark diagonal grain
   ============================================================ */
{
  const tail = new THREE.Group();
  tail.position.set(0, bodyPivotY - 0.235, -0.135);
  tail.rotation.x = 0.52;
  bird.add(tail);

  const shape = new THREE.Shape();
  shape.moveTo(-0.085, 0.0);
  shape.bezierCurveTo(-0.105, -0.22, -0.085, -0.50, -0.062, -0.66);
  shape.lineTo(0.062, -0.66);
  shape.bezierCurveTo(0.085, -0.50, 0.105, -0.22, 0.085, 0.0);
  shape.lineTo(-0.085, 0.0);

  let g = new THREE.ExtrudeGeometry(shape, {
    depth: 0.036,
    bevelEnabled: true,
    bevelThickness: 0.016,
    bevelSize: 0.016,
    bevelSegments: 4,
    curveSegments: 26
  });
  g.translate(0, 0, -0.018);

  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    // gentle downward sweep + slight cupping
    const droop = -(y * y) * 0.18;
    const cup = -(x * x) * 0.9;
    const fac = (fbm(x * 8.0, y * 8.0 + 4.0, z * 8.0) - 0.5) * 0.010;
    pos.setXYZ(i, x, y, z + droop + cup + fac);
  }
  pos.needsUpdate = true;
  g = toFlat(g);
  g.computeVertexNormals();

  const slab = new THREE.Mesh(g, matTail);
  slab.castShadow = true;
  slab.receiveShadow = true;
  tail.add(slab);

  // Carved separation grooves between the tail feathers
  for (let i = 0; i < 5; i++) {
    const t = (i / 4) - 0.5;              // -0.5 .. 0.5
    const xTop = t * 0.150;
    const xBot = t * 0.115;
    const c = new THREE.CatmullRomCurve3([
      new THREE.Vector3(xTop, -0.010, 0.030),
      new THREE.Vector3((xTop + xBot) * 0.5, -0.34, 0.036),
      new THREE.Vector3(xBot, -0.655, 0.028)
    ]);
    const tube = new THREE.TubeGeometry(c, 30, 0.0040, 7, false);
    const tp = tube.attributes.position;
    for (let k = 0; k < tp.count; k++) {
      const x = tp.getX(k), y = tp.getY(k), z = tp.getZ(k);
      tp.setXYZ(k, x, y, z - (y * y) * 0.18 - (x * x) * 0.9);
    }
    tp.needsUpdate = true;
    tube.computeVertexNormals();
    const groove = new THREE.Mesh(tube, matEbony);
    groove.castShadow = true;
    tail.add(groove);
  }

  // Pale maple band near the tip (typical hornbill tail marking, carved as inlay)
  const bandShape = new THREE.Shape();
  bandShape.moveTo(-0.068, -0.50);
  bandShape.lineTo(0.068, -0.50);
  bandShape.lineTo(0.062, -0.655);
  bandShape.lineTo(-0.062, -0.655);
  bandShape.lineTo(-0.068, -0.50);
  const bandGeo = new THREE.ExtrudeGeometry(bandShape, {
    depth: 0.020, bevelEnabled: true, bevelThickness: 0.006, bevelSize: 0.006, bevelSegments: 3, curveSegments: 4
  });
  const bp = bandGeo.attributes.position;
  for (let i = 0; i < bp.count; i++) {
    const x = bp.getX(i), y = bp.getY(i), z = bp.getZ(i);
    bp.setXYZ(i, x, y, z + 0.020 - (y * y) * 0.18 - (x * x) * 0.9);
  }
  bp.needsUpdate = true;
  bandGeo.computeVertexNormals();
  const band = new THREE.Mesh(bandGeo, matMaple);
  band.castShadow = true;
  tail.add(band);

  // Tail root fairing so it blends into the body block
  const rootGeo = toFlat(new THREE.SphereGeometry(0.115, 20, 14));
  chiselFacets(rootGeo, 0.006, 9.0, 12.0);
  const root = new THREE.Mesh(rootGeo, matMahogany);
  root.scale.set(1.0, 0.85, 1.15);
  root.position.set(0, 0.02, 0.02);
  root.castShadow = true;
  root.receiveShadow = true;
  tail.add(root);
}

/* ============================================================
   LEGS + FEET gripping the stump
   ============================================================ */
function buildLeg(side) {
  const leg = new THREE.Group();

  // tarsus
  const tg = toFlat(new THREE.CylinderGeometry(0.026, 0.030, 0.115, 12, 2));
  const tarsus = new THREE.Mesh(tg, matEbony);
  tarsus.position.set(0, -0.055, 0);
  tarsus.rotation.z = side * 0.10;
  tarsus.castShadow = true;
  leg.add(tarsus);

  // ankle knuckle
  const knuckle = new THREE.Mesh(new THREE.SphereGeometry(0.033, 14, 10), matEbony);
  knuckle.position.set(0, -0.112, 0.004);
  knuckle.scale.set(1, 0.85, 1.05);
  knuckle.castShadow = true;
  leg.add(knuckle);

  // thigh fairing into the body
  const thigh = new THREE.Mesh(toFlat(new THREE.SphereGeometry(0.062, 16, 12)), matMahogany);
  thigh.scale.set(0.85, 1.0, 1.1);
  thigh.position.set(0, 0.030, 0.005);
  thigh.castShadow = true;
  leg.add(thigh);

  // toes: three forward, one back — each a small curved tube ending in a claw
  const toeDefs = [
    { a: -0.42, len: 0.115 },
    { a: 0.00,  len: 0.130 },
    { a: 0.42,  len: 0.115 },
    { a: Math.PI, len: 0.098 }
  ];
  toeDefs.forEach(td => {
    const dirX = Math.sin(td.a), dirZ = Math.cos(td.a);
    const c = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, -0.130, 0),
      new THREE.Vector3(dirX * td.len * 0.42, -0.150, dirZ * td.len * 0.42),
      new THREE.Vector3(dirX * td.len * 0.82, -0.183, dirZ * td.len * 0.82),
      new THREE.Vector3(dirX * td.len * 1.0, -0.205, dirZ * td.len * 1.0)
    ]);
    const toe = new THREE.Mesh(new THREE.TubeGeometry(c, 22, 0.0135, 9, false), matEbony);
    toe.castShadow = true;
    leg.add(toe);

    // claw
    const claw = new THREE.Mesh(new THREE.ConeGeometry(0.0125, 0.038, 9), matMapleSmoothDeep);
    const end = c.getPoint(1);
    const tan = c.getTangent(1).normalize();
    claw.position.copy(end).addScaledVector(tan, 0.014);
    const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), tan);
    claw.quaternion.copy(q);
    claw.castShadow = true;
    leg.add(claw);
  });

  return leg;
}

{
  const legL = buildLeg(1);
  legL.position.set(0.098, bodyPivotY - 0.215, 0.045);
  legL.rotation.y = -0.22;
  bird.add(legL);

  const legR = buildLeg(-1);
  legR.position.set(-0.098, bodyPivotY - 0.215, 0.045);
  legR.rotation.y = 0.22;
  bird.add(legR);
}

/* ============================================================
   Final placement + subtle contact shadow disc
   ============================================================ */
{
  // Faint warm halo on the floor to seat the piece
  const haloCanvas = document.createElement('canvas');
  haloCanvas.width = haloCanvas.height = 128;
  const hctx = haloCanvas.getContext('2d');
  const grad = hctx.createRadialGradient(64, 64, 4, 64, 64, 62);
  grad.addColorStop(0.0, 'rgba(255,178,110,0.28)');
  grad.addColorStop(0.5, 'rgba(255,150,90,0.10)');
  grad.addColorStop(1.0, 'rgba(255,140,80,0.0)');
  hctx.fillStyle = grad;
  hctx.fillRect(0, 0, 128, 128);
  const haloTex = new THREE.CanvasTexture(haloCanvas);
  haloTex.colorSpace = THREE.SRGBColorSpace;
  const halo = new THREE.Mesh(
    new THREE.PlaneGeometry(2.6, 2.6).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ map: haloTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })
  );
  halo.position.y = 0.004;
  scene.add(halo);
}

// Centre the whole carving on the origin horizontally
hornbill.position.set(0, 0, 0);

/* ============================================================
   Resize + render loop
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
