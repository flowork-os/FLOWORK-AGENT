<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyberpunk Deck Turntable</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05020a}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05020a);
scene.fog = new THREE.Fog(0x05020a, 10, 24);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.2, 5.3, 8.4);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.35;
controls.target.set(0, 0.8, 0);

const mat = (color, roughness=0.45, metalness=0.1, emissive=0x000000, intensity=0) =>
  new THREE.MeshStandardMaterial({ color, roughness, metalness, emissive, emissiveIntensity:intensity });

const black = mat(0x080b10, 0.7, 0.25);
const black2 = mat(0x11151b, 0.5, 0.35);
const scuff = mat(0x252a2c, 0.85, 0.12);
const chrome = mat(0xa7b4b5, 0.18, 0.95);
const chromeDark = mat(0x40494d, 0.25, 0.85);
const green = mat(0xb9ff22, 0.25, 0.15, 0x85ff00, 3.8);
const pink = mat(0xff168e, 0.3, 0.1, 0xff007e, 5);
const cyan = mat(0x21e6ff, 0.25, 0.15, 0x00cfff, 3);
const rubber = mat(0x020304, 0.95, 0.02);

function box(w,h,d, material, x=0,y=0,z=0, rx=0,ry=0,rz=0) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), material);
  mesh.position.set(x,y,z);
  mesh.rotation.set(rx,ry,rz);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}
function cyl(radius, height, material, x=0,y=0,z=0, radial=64) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius,radius,height,radial), material);
  mesh.position.set(x,y,z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}
function torus(major, minor, material, x=0,y=0,z=0, rotX=0) {
  const mesh = new THREE.Mesh(new THREE.TorusGeometry(major,minor,16,96), material);
  mesh.position.set(x,y,z);
  mesh.rotation.x = rotX;
  mesh.castShadow = true;
  return mesh;
}

const deck = new THREE.Group();
scene.add(deck);
deck.rotation.y = -0.18;

const base = box(7.4,0.55,5.0, black, 0,0.45,0);
deck.add(base);
deck.add(box(7.05,0.18,4.65, black2, 0,0.82,0));
deck.add(box(6.65,0.08,4.22, scuff, 0,0.94,0));

const frontLip = box(7.5,0.28,0.18, chromeDark, 0,0.38,2.52);
deck.add(frontLip);

for (const px of [-3.35,3.35]) {
  deck.add(cyl(0.16,0.18,chrome,px,0.22,-2.05,32));
  deck.add(cyl(0.16,0.18,chrome,px,0.22,2.05,32));
}
for (const px of [-3.15,3.15]) {
  deck.add(cyl(0.11,0.12,chrome,px,0.98,-1.87,32));
  deck.add(cyl(0.11,0.12,chrome,px,0.98,1.87,32));
}

const platter = new THREE.Group();
platter.position.set(0.9,1.29,-0.18);
deck.add(platter);

platter.add(cyl(2.02,0.22,chromeDark,0,0,0,96));
platter.add(cyl(1.88,0.13,rubber,0,0.13,0,96));
platter.add(torus(1.91,0.055,pink,0,0.22,0));
platter.add(torus(1.68,0.022,chromeDark,0,0.21,0));
platter.add(cyl(0.22,0.3,chrome,0,0.28,0,48));
platter.add(cyl(0.12,0.38,black2,0,0.44,0,32));

for (let i=0;i<18;i++) {
  const a = i * Math.PI * 2 / 18;
  const bead = cyl(0.035,0.035,chrome,Math.cos(a)*1.52,0.225,Math.sin(a)*1.52,16);
  platter.add(bead);
}
for (let i=0;i<12;i++) {
  const a = i * Math.PI * 2 / 12;
  const mark = box(0.035,0.025,0.22,chromeDark,Math.cos(a)*1.25,0.225,Math.sin(a)*1.25,0,-a,0);
  platter.add(mark);
}

const hoverRing = torus(2.08,0.035,cyan,0.9,1.08,-0.18);
deck.add(hoverRing);

const pitchPanel = box(1.35,0.12,3.15, black2,-2.45,1.03,0.28,0,0,0);
deck.add(pitchPanel);
deck.add(box(1.02,0.035,2.82,rubber,-2.45,1.11,0.28));

const pitchGlow = new THREE.Mesh(
  new THREE.BoxGeometry(0.09,0.025,2.5),
  green
);
pitchGlow.position.set(-2.45,1.145,0.28);
deck.add(pitchGlow);

const pitchRail = box(0.18,0.1,2.15,chromeDark,-2.45,1.18,0.28);
deck.add(pitchRail);
const pitchSlider = box(0.46,0.18,0.36,green,-2.45,1.3,0.72);
deck.add(pitchSlider);
deck.add(box(0.31,0.08,0.23,black2,-2.45,1.4,0.72));

for (let i=0;i<9;i++) {
  const tick = box(0.1,0.018,0.025,chrome,-2.45,1.2,-0.55 + i*0.21);
  deck.add(tick);
}

const lcdCanvas = document.createElement("canvas");
lcdCanvas.width = 512;
lcdCanvas.height = 180;
const lcdCtx = lcdCanvas.getContext("2d");
const lcdTexture = new THREE.CanvasTexture(lcdCanvas);
lcdTexture.colorSpace = THREE.SRGBColorSpace;
const lcdMat = new THREE.MeshStandardMaterial({
  map:lcdTexture, emissive:0x112c34, emissiveIntensity:1.8, roughness:0.5, metalness:0.1
});
const lcd = box(2.55,0.08,0.92,lcdMat,-2.38,1.16,-1.43,0,0,0);
deck.add(lcd);
deck.add(box(2.72,0.12,1.08,black2,-2.38,1.1,-1.43));
deck.add(lcd);
deck.add(box(2.72,0.05,0.1,chromeDark,-2.38,1.2,-1.96));

function drawLCD(t) {
  lcdCtx.fillStyle = "#07151a";
  lcdCtx.fillRect(0,0,512,180);
  lcdCtx.strokeStyle = "#287982";
  lcdCtx.lineWidth = 4;
  lcdCtx.strokeRect(8,8,496,164);
  lcdCtx.fillStyle = "#5dfff2";
  lcdCtx.font = "bold 38px monospace";
  const offset = Math.floor(t * 0.08) % 16;
  const textLine = "ネオン・ターンテーブル // ERROR 404";
  lcdCtx.fillText(textLine.slice(offset) + textLine.slice(0,offset), 22, 70);
  lcdCtx.fillStyle = "#e3ff44";
  lcdCtx.font = "bold 26px monospace";
  lcdCtx.fillText("PITCH +07.3   RPM 33", 22, 115);
  lcdCtx.fillStyle = "#ff2b9a";
  for (let i=0;i<8;i++) {
    const x = ((i*79 + Math.floor(t*0.13)) % 500);
    lcdCtx.fillRect(x,145,Math.random()*38+8,5);
  }
  lcdTexture.needsUpdate = true;
}

const hazardCanvas = document.createElement("canvas");
hazardCanvas.width = 256;
hazardCanvas.height = 160;
const hazardCtx = hazardCanvas.getContext("2d");
hazardCtx.fillStyle = "#e5ed42";
hazardCtx.fillRect(0,0,256,160);
hazardCtx.fillStyle = "#101217";
hazardCtx.font = "bold 52px sans-serif";
hazardCtx.fillText("⚠",20,72);
hazardCtx.font = "bold 18px monospace";
hazardCtx.fillText("LIVE CIRCUIT",86,62);
hazardCtx.fillText("DO NOT LIFT",86,88);
hazardCtx.strokeStyle = "#14171a";
hazardCtx.lineWidth = 8;
for(let i=-160;i<300;i+=34) hazardCtx.beginPath(),hazardCtx.moveTo(i,160),hazardCtx.lineTo(i+70,0),hazardCtx.stroke();
const hazardTexture = new THREE.CanvasTexture(hazardCanvas);
hazardTexture.colorSpace = THREE.SRGBColorSpace;
const hazardMat = new THREE.MeshStandardMaterial({map:hazardTexture,roughness:0.9,side:THREE.DoubleSide});
const hazard = new THREE.Mesh(new THREE.PlaneGeometry(1.25,0.78),hazardMat);
hazard.position.set(2.38,1.15,-1.65);
hazard.rotation.set(-Math.PI/2,0.08,-0.12);
deck.add(hazard);
const tapeMat = mat(0xc6a84d,0.72,0.05);
deck.add(box(0.42,0.025,0.18,tapeMat,1.92,1.2,-1.83,0.03,0.1,0.18));
deck.add(box(0.48,0.025,0.18,tapeMat,2.86,1.2,-1.48,-0.04,-0.12,-0.16));

const cableMat = new THREE.MeshStandardMaterial({color:0x161a1d,roughness:0.55,metalness:0.2});
function cable(points, radius, material) {
  const curve = new THREE.CatmullRomCurve3(points);
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve,48,radius,10,false),material);
  mesh.castShadow = true;
  return mesh;
}
deck.add(cable([
  new THREE.Vector3(-3.0,1.12,1.72),
  new THREE.Vector3(-2.65,1.4,1.38),
  new THREE.Vector3(-1.85,1.18,1.8),
  new THREE.Vector3(-1.35,1.2,1.48)
],0.075,cableMat));
deck.add(cable([
  new THREE.Vector3(2.9,1.04,1.66),
  new THREE.Vector3(2.45,1.38,1.25),
  new THREE.Vector3(1.9,1.16,1.55),
  new THREE.Vector3(1.38,1.18,1.05)
],0.07,cableMat));
deck.add(cable([
  new THREE.Vector3(-2.95,1.12,1.72),
  new THREE.Vector3(-2.8,1.42,1.48),
  new THREE.Vector3(-2.52,1.23,1.28)
],0.027,pink));
deck.add(cable([
  new THREE.Vector3(2.88,1.1,1.65),
  new THREE.Vector3(2.6,1.4,1.44),
  new THREE.Vector3(2.34,1.2,1.16)
],0.026,cyan));

for(let i=0;i<5;i++) {
  const bolt = cyl(0.085,0.06,chrome,1.8+i*0.28,1.08,1.85,24);
  bolt.rotation.x = Math.PI/2;
  deck.add(bolt);
}

const underGlow = new THREE.PointLight(0xff087e,3.5,7,2);
underGlow.position.set(0,0.05,1.8);
deck.add(underGlow);

const greenLight = new THREE.PointLight(0x8cff00,2.2,4,2);
greenLight.position.set(-2.45,1.2,0.2);
deck.add(greenLight);

const key = new THREE.DirectionalLight(0xbcecff,3.2);
key.position.set(4,8,5);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -7;
scene.add(key);

const fill = new THREE.PointLight(0xff1598,8,12,2);
fill.position.set(-5,3,4);
scene.add(fill);

const rim = new THREE.PointLight(0x00d9ff,7,12,2);
rim.position.set(5,4,-5);
scene.add(rim);

scene.add(new THREE.HemisphereLight(0x23384e,0x10030e,1.5));

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(40,40),
  new THREE.MeshStandardMaterial({color:0x08050d,roughness:0.78,metalness:0.12})
);
floor.rotation.x = -Math.PI/2;
floor.position.y = -0.02;
floor.receiveShadow = true;
scene.add(floor);

const grid = new THREE.GridHelper(30,30,0x37123f,0x160a20);
grid.position.y = 0;
grid.material.transparent = true;
grid.material.opacity = 0.34;
scene.add(grid);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  drawLCD(elapsed);
  platter.rotation.y = elapsed * 0.65;
  hoverRing.rotation.y = -elapsed * 0.45;
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
