<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weathered Park Fountain</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #b8c7c0; }
    body { font-family: Georgia, serif; }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 24px;
      bottom: 22px;
      color: rgba(32, 40, 36, 0.78);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 11px;
      pointer-events: none;
      text-shadow: 0 1px 1px rgba(255,255,255,0.4);
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Garden Fountain · Weathered Limestone</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xb9c7c1);
    scene.fog = new THREE.FogExp2(0xb9c7c1, 0.025);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(6.8, 4.6, 7.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.25, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.42;
    controls.minDistance = 5;
    controls.maxDistance = 16;
    controls.maxPolarAngle = Math.PI * 0.48;

    const hemi = new THREE.HemisphereLight(0xdfe9e4, 0x5c6652, 2.2);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff2d7, 4.2);
    sun.position.set(-5, 9, 6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -7;
    sun.shadow.camera.right = 7;
    sun.shadow.camera.top = 7;
    sun.shadow.camera.bottom = -7;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 24;
    sun.shadow.bias = -0.00035;
    sun.shadow.normalBias = 0.025;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x9abec4, 0.65);
    fill.position.set(5, 4, -5);
    scene.add(fill);

    const stoneMaterial = new THREE.MeshStandardMaterial({
      color: 0xb1aa94,
      roughness: 0.92,
      metalness: 0.01,
      vertexColors: true
    });

    const darkStoneMaterial = new THREE.MeshStandardMaterial({
      color: 0x8d8978,
      roughness: 0.98,
      metalness: 0,
      vertexColors: true
    });

    const waterMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x4d9ca4,
      roughness: 0.17,
      metalness: 0,
      transmission: 0.22,
      transparent: true,
      opacity: 0.74,
      clearcoat: 1,
      clearcoatRoughness: 0.12,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    const streamMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xa9e2e7,
      roughness: 0.08,
      transmission: 0.45,
      transparent: true,
      opacity: 0.78,
      clearcoat: 1,
      depthWrite: false
    });

    function hashNoise(x, y, z) {
      const value = Math.sin(x * 18.73 + y * 43.17 + z * 27.91) * 43758.5453;
      return value - Math.floor(value);
    }

    function weatherGeometry(geometry, baseColor, variation = 0.12) {
      const position = geometry.attributes.position;
      const colors = [];
      const base = new THREE.Color(baseColor);
      const temp = new THREE.Color();

      for (let i = 0; i < position.count; i++) {
        const x = position.getX(i);
        const y = position.getY(i);
        const z = position.getZ(i);
        const grain = hashNoise(x, y, z);
        const band = 0.5 + 0.5 * Math.sin(y * 23 + x * 2.1);
        const shade = (grain - 0.5) * variation + (band - 0.5) * variation * 0.3;
        temp.copy(base).offsetHSL(
          (grain - 0.5) * 0.012,
          (grain - 0.5) * 0.04,
          shade
        );
        colors.push(temp.r, temp.g, temp.b);
      }
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      return geometry;
    }

    function latheMesh(points, material = stoneMaterial, segments = 128, color = 0xb1aa94) {
      const profile = points.map(([radius, height]) => new THREE.Vector2(radius, height));
      const geometry = new THREE.LatheGeometry(profile, segments);
      geometry.computeVertexNormals();
      weatherGeometry(geometry, color);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    const fountain = new THREE.Group();
    scene.add(fountain);

    const apronGeometry = new THREE.CylinderGeometry(3.35, 3.45, 0.14, 128);
    weatherGeometry(apronGeometry, 0xa69f8d, 0.09);
    const apron = new THREE.Mesh(apronGeometry, darkStoneMaterial);
    apron.position.y = 0.08;
    apron.receiveShadow = true;
    apron.castShadow = true;
    fountain.add(apron);

    const apronInsetGeometry = new THREE.RingGeometry(2.52, 3.2, 128, 2);
    weatherGeometry(apronInsetGeometry, 0xb6af9b, 0.08);
    const apronInset = new THREE.Mesh(apronInsetGeometry, stoneMaterial);
    apronInset.rotation.x = -Math.PI / 2;
    apronInset.position.y = 0.156;
    apronInset.receiveShadow = true;
    fountain.add(apronInset);

    const lowerBowl = latheMesh([
      [0.62, 0.34],
      [0.58, 0.42],
      [0.70, 0.49],
      [1.08, 0.55],
      [1.52, 0.64],
      [1.91, 0.76],
      [2.17, 0.89],
      [2.28, 0.94],
      [2.36, 0.99],
      [2.37, 1.08],
      [2.31, 1.15],
      [2.16, 1.17],
      [2.07, 1.12],
      [2.04, 1.02],
      [1.84, 0.93],
      [1.48, 0.83],
      [1.03, 0.74],
      [0.68, 0.68],
      [0.53, 0.59],
      [0.52, 0.43],
      [0.62, 0.34]
    ]);
    fountain.add(lowerBowl);

    const lowerWater = new THREE.Mesh(
      new THREE.CircleGeometry(2.08, 128),
      waterMaterial
    );
    lowerWater.rotation.x = -Math.PI / 2;
    lowerWater.position.y = 1.105;
    lowerWater.renderOrder = 2;
    fountain.add(lowerWater);

    const lowerWaterRing = new THREE.Mesh(
      new THREE.TorusGeometry(2.075, 0.012, 8, 128),
      new THREE.MeshPhysicalMaterial({
        color: 0xb8eef0,
        transparent: true,
        opacity: 0.45,
        roughness: 0.12,
        depthWrite: false
      })
    );
    lowerWaterRing.rotation.x = Math.PI / 2;
    lowerWaterRing.position.y = 1.112;
    fountain.add(lowerWaterRing);

    const pedestalBase = latheMesh([
      [0.66, 0.30],
      [0.70, 0.34],
      [0.71, 0.43],
      [0.64, 0.50],
      [0.55, 0.53],
      [0.53, 0.62],
      [0.49, 0.66],
      [0.45, 0.66]
    ], stoneMaterial, 96);
    fountain.add(pedestalBase);

    const pedestal = latheMesh([
      [0.45, 0.62],
      [0.43, 0.78],
      [0.38, 0.92],
      [0.34, 1.08],
      [0.31, 1.30],
      [0.30, 1.57],
      [0.33, 1.73],
      [0.40, 1.82],
      [0.48, 1.86],
      [0.49, 1.96],
      [0.44, 2.03],
      [0.34, 2.07]
    ], stoneMaterial, 96);
    fountain.add(pedestal);

    const upperBowl = latheMesh([
      [0.27, 1.99],
      [0.39, 2.02],
      [0.59, 2.07],
      [0.79, 2.14],
      [0.94, 2.22],
      [1.02, 2.28],
      [1.04, 2.37],
      [1.01, 2.43],
      [0.94, 2.46],
      [0.88, 2.42],
      [0.85, 2.35],
      [0.71, 2.30],
      [0.53, 2.25],
      [0.34, 2.22],
      [0.25, 2.17],
      [0.23, 2.08],
      [0.27, 1.99]
    ], stoneMaterial, 128);
    fountain.add(upperBowl);

    const upperWater = new THREE.Mesh(
      new THREE.CircleGeometry(0.885, 96),
      waterMaterial
    );
    upperWater.rotation.x = -Math.PI / 2;
    upperWater.position.y = 2.415;
    upperWater.renderOrder = 2;
    fountain.add(upperWater);

    const crown = latheMesh([
      [0.20, 2.30],
      [0.23, 2.37],
      [0.22, 2.48],
      [0.18, 2.57],
      [0.15, 2.70],
      [0.13, 2.84],
      [0.09, 2.91],
      [0.07, 2.95]
    ], stoneMaterial, 64);
    fountain.add(crown);

    const topNozzle = new THREE.Mesh(
      new THREE.CylinderGeometry(0.035, 0.055, 0.10, 20),
      new THREE.MeshStandardMaterial({ color: 0x6c766d, roughness: 0.6, metalness: 0.22 })
    );
    topNozzle.position.y = 2.99;
    topNozzle.castShadow = true;
    fountain.add(topNozzle);

    const centralJetCurve = new THREE.CubicBezierCurve3(
      new THREE.Vector3(0, 3.03, 0),
      new THREE.Vector3(0.015, 3.36, 0),
      new THREE.Vector3(-0.012, 3.55, 0),
      new THREE.Vector3(0, 3.72, 0)
    );
    const centralJet = new THREE.Mesh(
      new THREE.TubeGeometry(centralJetCurve, 24, 0.022, 8, false),
      streamMaterial
    );
    centralJet.renderOrder = 3;
    fountain.add(centralJet);

    function addArc(angle, endRadius, startY, peakY, endY, thickness) {
      const radial = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle));
      const tangent = new THREE.Vector3(-Math.sin(angle), 0, Math.cos(angle));
      const start = radial.clone().multiplyScalar(0.13);
      start.y = startY;
      const end = radial.clone().multiplyScalar(endRadius);
      end.addScaledVector(tangent, 0.035 * Math.sin(angle * 3));
      end.y = endY;
      const control1 = start.clone().addScaledVector(radial, endRadius * 0.25);
      control1.y = peakY;
      const control2 = end.clone().addScaledVector(radial, -endRadius * 0.28);
      control2.y = peakY - 0.08;
      const curve = new THREE.CubicBezierCurve3(start, control1, control2, end);
      const geometry = new THREE.TubeGeometry(curve, 30, thickness, 7, false);
      const stream = new THREE.Mesh(geometry, streamMaterial);
      stream.renderOrder = 3;
      fountain.add(stream);
    }

    for (let i = 0; i < 10; i++) {
      addArc(
        i * Math.PI * 2 / 10,
        0.72 + 0.05 * Math.sin(i * 2.3),
        2.88,
        3.08,
        2.43,
        0.014
      );
    }

    for (let i = 0; i < 12; i++) {
      const angle = i * Math.PI * 2 / 12 + Math.PI / 12;
      const radial = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle));
      const start = radial.clone().multiplyScalar(0.29);
      start.y = 2.05;
      const end = radial.clone().multiplyScalar(1.72);
      end.y = 1.12;
      const c1 = radial.clone().multiplyScalar(0.62);
      c1.y = 2.18;
      const c2 = radial.clone().multiplyScalar(1.35);
      c2.y = 1.72;
      const curve = new THREE.CubicBezierCurve3(start, c1, c2, end);
      const stream = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 32, 0.012, 7, false),
        streamMaterial
      );
      stream.renderOrder = 3;
      fountain.add(stream);
    }

    const dropletGeometry = new THREE.SphereGeometry(0.018, 8, 6);
    for (let i = 0; i < 28; i++) {
      const angle = i * 2.39996;
      const radius = 0.35 + (i % 7) * 0.17;
      const droplet = new THREE.Mesh(dropletGeometry, streamMaterial);
      droplet.position.set(
        Math.cos(angle) * radius,
        1.3 + (i % 9) * 0.14,
        Math.sin(angle) * radius
      );
      droplet.scale.y = 1.45;
      droplet.renderOrder = 3;
      fountain.add(droplet);
    }

    const mossMaterial = new THREE.MeshStandardMaterial({
      color: 0x53634b,
      roughness: 1,
      transparent: true,
      opacity: 0.5
    });

    const mossRing1 = new THREE.Mesh(
      new THREE.TorusGeometry(2.285, 0.018, 6, 128),
      mossMaterial
    );
    mossRing1.rotation.x = Math.PI / 2;
    mossRing1.position.y = 0.99;
    fountain.add(mossRing1);

    const mossRing2 = new THREE.Mesh(
      new THREE.TorusGeometry(0.97, 0.012, 6, 96),
      mossMaterial
    );
    mossRing2.rotation.x = Math.PI / 2;
    mossRing2.position.y = 2.36;
    fountain.add(mossRing2);

    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x718063,
      roughness: 1
    });
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(32, 128),
      groundMaterial
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.01;
    ground.receiveShadow = true;
    scene.add(ground);

    const pathMaterial = new THREE.MeshStandardMaterial({
      color: 0xa69e88,
      roughness: 1
    });
    const path = new THREE.Mesh(
      new THREE.RingGeometry(3.48, 5.4, 128),
      pathMaterial
    );
    path.rotation.x = -Math.PI / 2;
    path.position.y = 0.005;
    path.receiveShadow = true;
    scene.add(path);

    const grassTuftMaterial = new THREE.MeshStandardMaterial({
      color: 0x526448,
      roughness: 1
    });

    const tuftGeometry = new THREE.ConeGeometry(0.11, 0.28, 5);
    for (let i = 0; i < 48; i++) {
      const angle = i * 2.399963;
      const radius = 5.7 + (i % 8) * 0.58;
      const tuft = new THREE.Mesh(tuftGeometry, grassTuftMaterial);
      tuft.position.set(
        Math.cos(angle) * radius,
        0.12,
        Math.sin(angle) * radius
      );
      tuft.scale.setScalar(0.65 + hashNoise(i, 2, 5) * 0.75);
      tuft.rotation.y = angle;
      tuft.castShadow = true;
      scene.add(tuft);
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      lowerWater.material.opacity = 0.72 + Math.sin(elapsed * 1.3) * 0.025;
      upperWater.material.opacity = 0.72 + Math.sin(elapsed * 1.6 + 1) * 0.03;
      lowerWaterRing.scale.setScalar(1 + Math.sin(elapsed * 1.2) * 0.003);
      controls.update();
      renderer.render(scene, camera);
    }

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });

    animate();
  </script>
</body>
</html>
