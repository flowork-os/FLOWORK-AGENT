<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astronaut Helmet</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080d}
body{font-family:Arial,sans-serif}
canvas{display:block}
.label{position:fixed;left:28px;bottom:24px;color:#aebdcb;letter-spacing:.28em;font-size:11px;text-transform:uppercase;opacity:.7}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="label">EXPLORATION HELMET // MK-VII</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05080d);
scene.fog = new THREE.Fog(0x05080d, 12, 28);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.2, 5.4, 9.2);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .055;
controls.autoRotate = true;
controls.autoRotateSpeed = .65;
controls.minDistance = 6;
controls.maxDistance = 15;
controls.target.set(0,3.25,0);

const white = new THREE.MeshStandardMaterial({
  color:0xe8edf0, metalness:.08, roughness:.28
});
const whiteDark = new THREE.MeshStandardMaterial({
  color:0xaeb8be, metalness:.3, roughness:.34
});
const graphite = new THREE.MeshStandardMaterial({
  color:0x17212a, metalness:.8, roughness:.24
});
const black = new THREE.MeshStandardMaterial({
  color:0x05080a, metalness:.65, roughness:.2
});
const steel = new THREE.MeshStandardMaterial({
  color:0x7d8a8d, metalness:.92, roughness:.2
});
const gold = new THREE.MeshPhysicalMaterial({
  color:0x9b5f18, metalness:1, roughness:.13, clearcoat:1, clearcoatRoughness:.08
});
const glow = new THREE.MeshStandardMaterial({
  color:0x8bdcff, emissive:0x238bc4, emissiveIntensity:3.2,
  metalness:.1, roughness:.2
});

function mesh(geometry, material, parent, position, scale, rotation){
  const m = new THREE.Mesh(geometry,material);
  if(position)m.position.set(...position);
  if(scale)m.scale.set(...scale);
  if(rotation)m.rotation.set(...rotation);
  m.castShadow = true;
  m.receiveShadow = true;
  if(parent)parent.add(m);
  return m;
}

const helmet = new THREE.Group();
helmet.position.y = .35;
scene.add(helmet);

const dome = mesh(new THREE.SphereGeometry(2.42,64,32,0,Math.PI*2,0,Math.PI*.71),white,helmet,[0,3.45,0],[1,1,1]);
dome.scale.z = .93;

const rearLower = mesh(new THREE.CylinderGeometry(2.23,2.14,.72,64),white,helmet,[0,2.63,0]);
rearLower.scale.z = .91;

const brow = mesh(new THREE.TorusGeometry(1.91,.16,16,64,Math.PI*1.28),whiteDark,helmet,[0,3.64,1.9],[1.08,.75,1],[Math.PI/2,0,0]);
brow.rotation.z = Math.PI;

const visor = mesh(
  new THREE.SphereGeometry(1,64,32,.42,2.30,.48,.92),
  gold,helmet,[0,3.42,2.03],[2.08,1.37,.52]
);
visor.rotation.y = 0;

const visorInner = mesh(
  new THREE.SphereGeometry(1,64,24,.48,2.18,.55,.77),
  new THREE.MeshPhysicalMaterial({
    color:0x24170d, metalness:1, roughness:.07, transmission:.03,
    clearcoat:1, clearcoatRoughness:.04, transparent:true, opacity:.38
  }),
  helmet,[0,3.43,2.10],[2.0,1.3,.535]
);

const visorSeal = mesh(new THREE.TorusGeometry(1.68,.095,12,64,Math.PI*1.27),black,helmet,[0,3.43,2.06],[1.24,.92,.34],[Math.PI/2,0,Math.PI]);
const visorSeal2 = mesh(new THREE.TorusGeometry(1.69,.06,10,64,Math.PI*1.27),steel,helmet,[0,3.43,2.10],[1.24,.92,.35],[Math.PI/2,0,Math.PI]);

for(let i=0;i<5;i++){
  const seam = mesh(new THREE.BoxGeometry(.018,1.25,.025),graphite,helmet,[-1.5+i*.75,3.02,2.405],[1,1,1],[0,0,(i-2)*.045]);
  seam.material.transparent = true;
  seam.material.opacity = .45;
}

const neckRing = mesh(new THREE.CylinderGeometry(1.57,1.72,.43,64),steel,helmet,[0,2.17,0],[1,1,.94]);
const neckInner = mesh(new THREE.CylinderGeometry(1.25,1.4,.32,64),black,helmet,[0,2.32,0],[1,1,.94]);
const neckTop = mesh(new THREE.TorusGeometry(1.58,.085,14,64),graphite,helmet,[0,2.39,0],[1,1,.94]);

for(let i=0;i<18;i++){
  const a = i/18*Math.PI*2;
  mesh(new THREE.BoxGeometry(.16,.14,.07),graphite,helmet,[Math.cos(a)*1.63,2.38,Math.sin(a)*1.53],[1,1,1],[0,-a,0]);
}

function sideModule(side){
  const x = side*2.18;
  const pod = new THREE.Group();
  helmet.add(pod);
  pod.position.set(x,3.3,.05);
  pod.rotation.z = side*.08;
  mesh(new THREE.BoxGeometry(.48,.82,.72),graphite,pod,[0,0,0]);
  mesh(new THREE.BoxGeometry(.56,.38,.78),steel,pod,[0,.18,.03]);
  mesh(new THREE.CylinderGeometry(.16,.16,.04,24),glow,pod,[side*.02,.18,.42],[1,1,1],[Math.PI/2,0,0]);
  mesh(new THREE.TorusGeometry(.18,.035,10,24),steel,pod,[side*.02,.18,.45],[1,1,1],[Math.PI/2,0,0]);
  mesh(new THREE.CylinderGeometry(.09,.12,.16,20),black,pod,[0,-.42,0],[1,1,1]);
  mesh(new THREE.SphereGeometry(.07,16,10),glow,pod,[0,-.42,.09]);
  return pod;
}
sideModule(1);
sideModule(-1);

const antennaBase = new THREE.Group();
helmet.add(antennaBase);
antennaBase.position.set(-2.22,3.83,.1);
mesh(new THREE.CylinderGeometry(.18,.22,.15,24),steel,antennaBase,[0,0,0]);
mesh(new THREE.CylinderGeometry(.045,.055,.82,16),graphite,antennaBase,[0,.45,0],[1,1,1],[0,0,-.18]);
mesh(new THREE.SphereGeometry(.11,20,12),glow,antennaBase,[.08,.86,.13]);

const topPanel = mesh(new THREE.BoxGeometry(.84,.035,.46),whiteDark,helmet,[0,5.08,-.18],[1,1,1],[0,.05,0]);
for(let i=-1;i<=1;i++){
  mesh(new THREE.BoxGeometry(.035,.045,.3),graphite,helmet,[i*.23,5.105,-.18]);
}

const stand = new THREE.Group();
scene.add(stand);
mesh(new THREE.CylinderGeometry(1.72,1.92,.34,64),black,stand,[0,.13,0]);
mesh(new THREE.CylinderGeometry(1.28,1.4,.18,64),steel,stand,[0,.38,0]);
mesh(new THREE.CylinderGeometry(.86,1.02,1.18,48),graphite,stand,[0,1.02,0]);
mesh(new THREE.TorusGeometry(.89,.075,14,48),steel,stand,[0,.55,0]);
mesh(new THREE.TorusGeometry(.9,.05,12,48),steel,stand,[0,1.58,0]);
mesh(new THREE.CylinderGeometry(1.12,1.12,.1,48),black,stand,[0,1.64,0]);

const floor = mesh(new THREE.CircleGeometry(30,96),new THREE.MeshStandardMaterial({color:0x080d13,roughness:.8}),scene,[0,-.06,0],[1,1,1],[ -Math.PI/2,0,0]);
floor.receiveShadow = true;

scene.add(new THREE.HemisphereLight(0x9bb9d5,0x080b0f,1.65));

const key = new THREE.DirectionalLight(0xffffff,4.2);
key.position.set(5,10,7);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 9;
key.shadow.camera.bottom = -3;
scene.add(key);

const rim = new THREE.SpotLight(0x4b9dff,12,18,Math.PI*.18,.55,1.2);
rim.position.set(-6,7,-5);
rim.target.position.set(0,3,0);
scene.add(rim,rim.target);

const warm = new THREE.PointLight(0xff9b42,10,9,2);
warm.position.set(4,3,6);
scene.add(warm);

const fill = new THREE.PointLight(0x4d8bff,8,12,2);
fill.position.set(-5,4,3);
scene.add(fill);

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
</script>
</body>
</html>
