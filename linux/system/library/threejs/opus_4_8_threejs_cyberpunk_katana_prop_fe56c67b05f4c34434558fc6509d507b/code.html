<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cyberpunk Nano Katana</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0b0e; overflow: hidden; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 16px; bottom: 14px;
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #6ff3ff; opacity: .55; letter-spacing: .12em; text-transform: uppercase;
    pointer-events: none; text-shadow: 0 0 8px rgba(0,220,255,.5);
  }
</style>
</head>
<body>
<div id="hud">NANO-KATANA // MK-VII &nbsp;·&nbsp; drag to orbit &nbsp;·&nbsp; scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0b0e);
scene.fog = new THREE.FogExp2(0x0a0b0e, 0.018);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.05, 200);
camera.position.set(0.95, 0.62, 1.35);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.minDistance = 0.55;
controls.maxDistance = 5.0;
controls.target.set(0, 0.10, 0);
controls.maxPolarAngle = Math.PI * 0.52;

/* ============================================================
   PROCEDURAL TEXTURES (canvas-generated, no external assets)
   ============================================================ */

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

// deterministic PRNG so the look is stable
let _seed = 20260720;
function rnd() {
  _seed = (_seed * 1664525 + 1013904223) % 4294967296;
  return _seed / 4294967296;
}

/* --- Oxblood cracked synthetic leather (color + roughness + normal-ish bump) --- */
function makeLeatherTextures(size = 1024) {
  const c = makeCanvas(size, size);
  const ctx = c.getContext('2d');

  // base oxblood
  ctx.fillStyle = '#3a0d13';
  ctx.fillRect(0, 0, size, size);

  // mottled tonal variation
  for (let i = 0; i < 2600; i++) {
    const x = rnd() * size, y = rnd() * size;
    const r = 6 + rnd() * 46;
    const dark = rnd() < 0.5;
    const a = 0.03 + rnd() * 0.06;
    ctx.fillStyle = dark ? `rgba(20,4,7,${a})` : `rgba(112,28,34,${a})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  // fine grain speckle
  const img = ctx.getImageData(0, 0, size, size);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (rnd() - 0.5) * 26;
    d[i] = Math.max(0, Math.min(255, d[i] + n));
    d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + n * 0.8));
    d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + n * 0.8));
  }
  ctx.putImageData(img, 0, 0);

  // crack network — branching polylines
  const bump = makeCanvas(size, size);
  const bctx = bump.getContext('2d');
  bctx.fillStyle = '#8a8a8a';
  bctx.fillRect(0, 0, size, size);

  function crack(x, y, ang, len, width, depth) {
    let px = x, py = y;
    ctx.lineCap = 'round';
    bctx.lineCap = 'round';
    const steps = Math.max(3, Math.floor(len / 9));
    for (let s = 0; s < steps; s++) {
      ang += (rnd() - 0.5) * 0.65;
      const nx = px + Math.cos(ang) * 9;
      const ny = py + Math.sin(ang) * 9;

      // dark crack line on albedo
      ctx.strokeStyle = `rgba(12,2,4,${0.55 + rnd() * 0.3})`;
      ctx.lineWidth = width;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(nx, ny); ctx.stroke();

      // subtle lighter lip (worn edge of crack)
      ctx.strokeStyle = `rgba(150,64,62,${0.10 + rnd() * 0.12})`;
      ctx.lineWidth = width * 2.2;
      ctx.beginPath(); ctx.moveTo(px + 1, py + 1); ctx.lineTo(nx + 1, ny + 1); ctx.stroke();

      // bump: cracks are recessed (dark)
      bctx.strokeStyle = `rgba(30,30,30,0.75)`;
      bctx.lineWidth = width;
      bctx.beginPath(); bctx.moveTo(px, py); bctx.lineTo(nx, ny); bctx.stroke();

      px = nx; py = ny;
      if (depth < 2 && rnd() < 0.10) crack(px, py, ang + (rnd() < 0.5 ? 1 : -1) * 0.9, len * 0.45, width * 0.7, depth + 1);
    }
  }

  for (let i = 0; i < 130; i++) {
    crack(rnd() * size, rnd() * size, rnd() * Math.PI * 2, 40 + rnd() * 150, 1.1 + rnd() * 2.2, 0);
  }

  // scuffs / worn highlights
  for (let i = 0; i < 90; i++) {
    const x = rnd() * size, y = rnd() * size, w = 10 + rnd() * 90, h = 2 + rnd() * 7;
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rnd() * Math.PI);
    ctx.fillStyle = `rgba(168,86,80,${0.05 + rnd() * 0.10})`;
    ctx.fillRect(-w / 2, -h / 2, w, h);
    ctx.restore();

    bctx.save();
    bctx.translate(x, y); bctx.rotate(rnd() * Math.PI);
    bctx.fillStyle = `rgba(180,180,180,0.18)`;
    bctx.fillRect(-w / 2, -h / 2, w, h);
    bctx.restore();
  }

  // pebbled leather grain in bump
  for (let i = 0; i < 9000; i++) {
    const x = rnd() * size, y = rnd() * size, r = 1.5 + rnd() * 4.5;
    bctx.fillStyle = rnd() < 0.5 ? 'rgba(120,120,120,0.10)' : 'rgba(170,170,170,0.10)';
    bctx.beginPath(); bctx.arc(x, y, r, 0, Math.PI * 2); bctx.fill();
  }

  // roughness map derived from bump-ish content: cracks rougher
  const rough = makeCanvas(size, size);
  const rctx = rough.getContext('2d');
  rctx.drawImage(bump, 0, 0);
  rctx.globalCompositeOperation = 'source-over';
  rctx.fillStyle = 'rgba(200,200,200,0.35)';
  rctx.fillRect(0, 0, size, size);

  const colorTex = new THREE.CanvasTexture(c);
  const bumpTex = new THREE.CanvasTexture(bump);
  const roughTex = new THREE.CanvasTexture(rough);
  for (const t of [colorTex, bumpTex, roughTex]) {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  }
  colorTex.colorSpace = THREE.SRGBColorSpace;
  return { colorTex, bumpTex, roughTex };
}

/* --- Hexagonal carbon-fiber core weave --- */
function makeCarbonTextures(size = 1024) {
  const c = makeCanvas(size, size);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#0b0d10';
  ctx.fillRect(0, 0, size, size);

  const R = 34;                      // hex circumradius
  const hw = Math.sqrt(3) / 2 * R;   // half width for pointy-top hex
  const rows = Math.ceil(size / (R * 1.5)) + 2;
  const cols = Math.ceil(size / (hw * 2)) + 2;

  function hexPath(cx, cy, r) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 180 * (60 * i - 90);
      const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  for (let row = -1; row < rows; row++) {
    for (let col = -1; col < cols; col++) {
      const cx = col * hw * 2 + (row % 2 ? hw : 0);
      const cy = row * R * 1.5;

      // hex cell fill with directional weave sheen
      const g = ctx.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
      const t = (row * 7 + col * 3) % 4;
      if (t < 2) {
        g.addColorStop(0, '#191d23'); g.addColorStop(0.5, '#2b323b'); g.addColorStop(1, '#12161a');
      } else {
        g.addColorStop(0, '#12161a'); g.addColorStop(0.5, '#252b33'); g.addColorStop(1, '#191d23');
      }
      ctx.fillStyle = g;
      hexPath(cx, cy, R * 0.94);
      ctx.fill();

      // weave micro-lines inside hex
      ctx.save();
      hexPath(cx, cy, R * 0.94);
      ctx.clip();
      ctx.strokeStyle = 'rgba(255,255,255,0.045)';
      ctx.lineWidth = 1;
      const dir = t < 2 ? 1 : -1;
      for (let k = -R; k < R; k += 4) {
        ctx.beginPath();
        ctx.moveTo(cx - R, cy + k);
        ctx.lineTo(cx + R, cy + k + dir * R * 1.2);
        ctx.stroke();
      }
      ctx.restore();

      // cell border
      ctx.strokeStyle = 'rgba(0,0,0,0.85)';
      ctx.lineWidth = 2.2;
      hexPath(cx, cy, R * 0.94);
      ctx.stroke();
    }
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

  // rough map: hex borders slightly rougher
  const rc = makeCanvas(size, size);
  const rctx = rc.getContext('2d');
  rctx.drawImage(c, 0, 0);
  rctx.globalCompositeOperation = 'luminosity';
  rctx.fillStyle = '#666';
  rctx.globalCompositeOperation = 'source-over';
  rctx.fillStyle = 'rgba(90,90,90,0.55)';
  rctx.fillRect(0, 0, size, size);
  const roughTex = new THREE.CanvasTexture(rc);
  roughTex.wrapS = roughTex.wrapT = THREE.RepeatWrapping;
  roughTex.anisotropy = tex.anisotropy;

  return { tex, roughTex };
}

/* --- Matte black composite blade surface (micro-grain + faint kanji-less etch) --- */
function makeCompositeTextures(w = 256, h = 2048) {
  const c = makeCanvas(w, h);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#0d0f12';
  ctx.fillRect(0, 0, w, h);

  // longitudinal composite layering
  for (let i = 0; i < 260; i++) {
    const x = rnd() * w;
    const wid = 1 + rnd() * 6;
    ctx.fillStyle = rnd() < 0.5 ? 'rgba(255,255,255,0.018)' : 'rgba(0,0,0,0.25)';
    ctx.fillRect(x, 0, wid, h);
  }
  // subtle horizontal fiber banding
  for (let i = 0; i < 420; i++) {
    const y = rnd() * h;
    ctx.fillStyle = `rgba(${rnd() < 0.5 ? '255,255,255,0.012' : '0,0,0,0.16'})`;
    ctx.fillRect(0, y, w, 1 + rnd() * 2);
  }
  // micro speckle
  const img = ctx.getImageData(0, 0, w, h);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (rnd() - 0.5) * 12;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  ctx.putImageData(img, 0, 0);

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

  // roughness: mostly matte with slightly slicker streaks
  const rc = makeCanvas(w, h);
  const rctx = rc.getContext('2d');
  rctx.fillStyle = '#c8c8c8';
  rctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 160; i++) {
    const x = rnd() * w;
    rctx.fillStyle = `rgba(${Math.floor(120 + rnd() * 70)},${Math.floor(120 + rnd() * 70)},${Math.floor(120 + rnd() * 70)},0.6)`;
    rctx.fillRect(x, 0, 1 + rnd() * 5, h);
  }
  const roughTex = new THREE.CanvasTexture(rc);
  roughTex.wrapS = roughTex.wrapT = THREE.RepeatWrapping;
  roughTex.anisotropy = tex.anisotropy;

  return { tex, roughTex };
}

/* --- Exposed circuitry emissive strip (traces + pads), tiled along the edge --- */
function makeCircuitTexture(w = 512, h = 128) {
  const c = makeCanvas(w, h);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#000308';
  ctx.fillRect(0, 0, w, h);

  ctx.lineCap = 'square';
  ctx.lineJoin = 'miter';

  // main bus lines
  const buses = [0.22, 0.5, 0.78];
  for (const b of buses) {
    ctx.strokeStyle = '#0a2c33';
    ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(0, h * b); ctx.lineTo(w, h * b); ctx.stroke();
    ctx.strokeStyle = '#6ffcff';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, h * b); ctx.lineTo(w, h * b); ctx.stroke();
  }

  // orthogonal branch traces
  for (let i = 0; i < 90; i++) {
    const x = Math.floor(rnd() * w);
    const y0 = h * buses[Math.floor(rnd() * buses.length)];
    const y1 = 8 + rnd() * (h - 16);
    ctx.strokeStyle = 'rgba(80,235,255,0.85)';
    ctx.lineWidth = 2 + rnd() * 2;
    ctx.beginPath();
    ctx.moveTo(x, y0);
    ctx.lineTo(x, y1);
    const x2 = x + (rnd() < 0.5 ? -1 : 1) * (8 + rnd() * 34);
    ctx.lineTo(x2, y1);
    ctx.stroke();
    // pad
    ctx.fillStyle = '#bff9ff';
    ctx.fillRect(x2 - 3, y1 - 3, 6, 6);
  }

  // via dots
  for (let i = 0; i < 120; i++) {
    ctx.fillStyle = rnd() < 0.3 ? '#ffffff' : '#8dfbff';
    const r = 1 + rnd() * 2;
    ctx.beginPath(); ctx.arc(rnd() * w, rnd() * h, r, 0, Math.PI * 2); ctx.fill();
  }

  // little SMD-ish blocks
  for (let i = 0; i < 26; i++) {
    const x = rnd() * w, y = rnd() * h;
    ctx.fillStyle = 'rgba(30,120,140,0.9)';
    ctx.fillRect(x, y, 10 + rnd() * 16, 4 + rnd() * 5);
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

/* --- Holographic decal sheet (transparent, iridescent glyph blocks) --- */
function makeHoloDecal(w = 512, h = 256, hue = 190) {
  const c = makeCanvas(w, h);
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, w, h);

  // faint holo panel
  const g = ctx.createLinearGradient(0, 0, w, h);
  g.addColorStop(0.0, `hsla(${hue - 40},100%,65%,0.20)`);
  g.addColorStop(0.4, `hsla(${hue},100%,70%,0.28)`);
  g.addColorStop(0.7, `hsla(${hue + 70},100%,68%,0.22)`);
  g.addColorStop(1.0, `hsla(${hue + 130},100%,66%,0.18)`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  // border frame
  ctx.strokeStyle = `hsla(${hue},100%,80%,0.85)`;
  ctx.lineWidth = 4;
  ctx.strokeRect(6, 6, w - 12, h - 12);
  ctx.strokeStyle = `hsla(${hue + 60},100%,85%,0.55)`;
  ctx.lineWidth = 2;
  ctx.strokeRect(16, 16, w - 32, h - 32);

  // corner ticks
  ctx.fillStyle = `hsla(${hue},100%,88%,0.9)`;
  const tick = 22;
  ctx.fillRect(6, 6, tick, 5); ctx.fillRect(6, 6, 5, tick);
  ctx.fillRect(w - 6 - tick, h - 11, tick, 5); ctx.fillRect(w - 11, h - 6 - tick, 5, tick);

  // glyph rows (abstract data bars, no real font dependency)
  let y = 46;
  for (let row = 0; row < 6; row++) {
    let x = 34;
    while (x < w - 40) {
      const bw = 5 + rnd() * 22;
      const bh = 10 + rnd() * 5;
      if (rnd() < 0.82) {
        ctx.fillStyle = `hsla(${hue + rnd() * 90},100%,${72 + rnd() * 20}%,${0.5 + rnd() * 0.45})`;
        ctx.fillRect(x, y, bw, bh);
      }
      x += bw + 5 + rnd() * 7;
    }
    y += 28;
  }

  // barcode strip
  let bx = 34;
  while (bx < w - 40) {
    const bw = 2 + rnd() * 6;
    ctx.fillStyle = `hsla(${hue + 20},100%,92%,${0.35 + rnd() * 0.5})`;
    ctx.fillRect(bx, h - 46, bw, 26);
    bx += bw + 3 + rnd() * 5;
  }

  // scanline erosion for a printed-film look
  ctx.globalCompositeOperation = 'destination-out';
  for (let sy = 0; sy < h; sy += 3) {
    ctx.fillStyle = 'rgba(0,0,0,0.20)';
    ctx.fillRect(0, sy, w, 1);
  }
  ctx.globalCompositeOperation = 'source-over';

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

/* --- Brushed / notched steel (tsuba + fittings) --- */
function makeSteelTextures(size = 768) {
  const c = makeCanvas(size, size);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#6d737a';
  ctx.fillRect(0, 0, size, size);

  // radial brushing
  const cx = size / 2, cy = size / 2;
  for (let i = 0; i < 5200; i++) {
    const a = rnd() * Math.PI * 2;
    const r0 = rnd() * size * 0.52;
    const len = 8 + rnd() * 60;
    ctx.strokeStyle = rnd() < 0.5 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.07)';
    ctx.lineWidth = 0.8 + rnd() * 1.6;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
    ctx.lineTo(cx + Math.cos(a) * (r0 + len), cy + Math.sin(a) * (r0 + len));
    ctx.stroke();
  }
  // grime pooling
  for (let i = 0; i < 200; i++) {
    ctx.fillStyle = `rgba(24,26,30,${0.02 + rnd() * 0.05})`;
    ctx.beginPath(); ctx.arc(rnd() * size, rnd() * size, 8 + rnd() * 46, 0, Math.PI * 2); ctx.fill();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

  const rc = makeCanvas(size, size);
  const rctx = rc.getContext('2d');
  rctx.fillStyle = '#5a5a5a';
  rctx.fillRect(0, 0, size, size);
  for (let i = 0; i < 2600; i++) {
    const a = rnd() * Math.PI * 2, r0 = rnd() * size * 0.52, len = 10 + rnd() * 70;
    rctx.strokeStyle = rnd() < 0.5 ? 'rgba(255,255,255,0.10)' : 'rgba(0,0,0,0.10)';
    rctx.lineWidth = 1 + rnd() * 2;
    rctx.beginPath();
    rctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
    rctx.lineTo(cx + Math.cos(a) * (r0 + len), cy + Math.sin(a) * (r0 + len));
    rctx.stroke();
  }
  const roughTex = new THREE.CanvasTexture(rc);
  roughTex.wrapS = roughTex.wrapT = THREE.RepeatWrapping;
  roughTex.anisotropy = tex.anisotropy;

  return { tex, roughTex };
}

const leather = makeLeatherTextures(1024);
const carbon = makeCarbonTextures(1024);
const composite = makeCompositeTextures(256, 2048);
const circuitTex = makeCircuitTexture(512, 128);
const steel = makeSteelTextures(768);
const holoA = makeHoloDecal(512, 256, 185);
const holoB = makeHoloDecal(512, 256, 300);

/* ============================================================
   MATERIALS
   ============================================================ */
const CYAN = new THREE.Color(0x35f2ff);
const MAGENTA = new THREE.Color(0xff2ea6);

const matBlade = new THREE.MeshPhysicalMaterial({
  color: 0x14161a,
  map: composite.tex,
  roughnessMap: composite.roughTex,
  roughness: 0.62,
  metalness: 0.28,
  clearcoat: 0.35,
  clearcoatRoughness: 0.55,
  sheen: 0.15,
  sheenColor: new THREE.Color(0x2b3a44),
  envMapIntensity: 0.7
});

const matEdgeCircuit = new THREE.MeshStandardMaterial({
  color: 0x04161b,
  map: circuitTex,
  emissive: 0xffffff,
  emissiveMap: circuitTex,
  emissiveIntensity: 2.6,
  roughness: 0.35,
  metalness: 0.5,
  toneMapped: true
});

const matEdgeBright = new THREE.MeshBasicMaterial({

  toneMapped: false
});

const matGlowSheet = new THREE.MeshBasicMaterial({
  color: 0x27d8ee,
  transparent: true,
  opacity: 0.16,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  side: THREE.DoubleSide,
  toneMapped: false
});

const matSteel = new THREE.MeshStandardMaterial({
  color: 0x9aa2ab,
  map: steel.tex,
  roughnessMap: steel.roughTex,
  roughness: 0.34,
  metalness: 0.98,
  envMapIntensity: 1.0
});

const matDarkSteel = new THREE.MeshStandardMaterial({
  color: 0x4a5058,
  map: steel.tex,
  roughnessMap: steel.roughTex,
  roughness: 0.42,
  metalness: 0.95
});

const matLeather = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  map: leather.colorTex,
  roughnessMap: leather.roughTex,
  bumpMap: leather.bumpTex,
  bumpScale: 0.0016,
  roughness: 0.86,
  metalness: 0.02,
  clearcoat: 0.22,
  clearcoatRoughness: 0.75,
  sheen: 0.35,

});

const matCarbon = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  map: carbon.tex,
  roughnessMap: carbon.roughTex,

/* --- dimensions (metres, realistic) --- */
const BLADE_LEN   = 0.700;   // nagasa ~70 cm
const BLADE_W     = 0.0290;  // blade width (mune -> ha)
const BLADE_T     = 0.0068;  // thickness at spine
const CURVE_SAGI  = 0.026;   // sori
const TANG_LEN    = 0.245;   // nakago / handle length
const TSUKA_R     = 0.0155;

/* ---------- Blade profile cross-section (asymmetric, razor edge) ----------
   Local frame while building: X = across blade (spine at -x, edge at +x)
   Y = thickness, Z = along blade.
   We build it as a lathe-free custom BufferGeometry so the edge tapers to a
   true razor and the tip forms a proper kissaki.
------------------------------------------------------------------------- */

// Cross-section outline in (x, y) — spine at x=-w/2, edge at x=+w/2
function bladeSection(w, t) {
  // shinogi-zukuri: flat-ish from spine to ridge, then bevel to razor edge
  const ridge = w * 0.22;       // ridge (shinogi) offset from spine side
  const pts = [];
  // upper half (y > 0) going spine -> edge
  pts.push(new THREE.Vector2(-w * 0.5, 0.0));                 // mune (spine) center
  pts.push(new THREE.Vector2(-w * 0.5, t * 0.34));            // spine flat top
  pts.push(new THREE.Vector2(-w * 0.5 + w * 0.06, t * 0.5));  // spine chamfer
  pts.push(new THREE.Vector2(-w * 0.5 + ridge, t * 0.5));     // shinogi-ji
  pts.push(new THREE.Vector2(w * 0.16, t * 0.30));            // bevel
  pts.push(new THREE.Vector2(w * 0.40, t * 0.10));
  pts.push(new THREE.Vector2(w * 0.5, 0.0));                  // razor edge
  // mirror for lower half
  const full = pts.slice();
  for (let i = pts.length - 2; i >= 1; i--) {
    full.push(new THREE.Vector2(pts[i].x, -pts[i].y));
  }
  return full;
}

const SECTION = bladeSection(BLADE_W, BLADE_T);
const SEG_N = SECTION.length;

// Spine curve: gentle sori, plus taper factors along length
const STEPS = 168;

function bladeAt(u) {
  // u in [0,1]; 0 = machi (base near guard), 1 = kissaki tip
  const z = u * BLADE_LEN;
  // curvature: rise toward the spine side, classic shallow arc
  const bend = CURVE_SAGI * (1 - Math.cos(u * Math.PI * 0.72)) / (1 - Math.cos(Math.PI * 0.72));
  // width taper: subtle to 0.86, then rapid at kissaki
  let wS;
  if (u < 0.90) wS = 1.0 - 0.16 * u;
  else {
    const k = (u - 0.90) / 0.10;
    wS = (1.0 - 0.16 * 0.90) * (1.0 - 0.62 * Math.pow(k, 1.35));
  }
  // thickness taper
  let tS;
  if (u < 0.90) tS = 1.0 - 0.30 * u;
  else {
    const k = (u - 0.90) / 0.10;
    tS = (1.0 - 0.30 * 0.90) * (1.0 - 0.75 * Math.pow(k, 1.25));
  }
  return { z, bend, wS, tS };
}

function buildBladeGeometry() {
  const positions = [];
  const normals = [];
  const uvs = [];
  const indices = [];

  const ringVerts = SEG_N;
  const rings = STEPS + 1;

  for (let i = 0; i <= STEPS; i++) {
    const u = i / STEPS;
    const { z, bend, wS, tS } = bladeAt(u);
    for (let j = 0; j < ringVerts; j++) {
      const p = SECTION[j];
      const x = p.x * wS;
      const y = (p.y / (BLADE_T * 0.5)) * (BLADE_T * 0.5) * tS;
      // curvature displaces along -x (spine side rises => blade curves away from edge)
      positions.push(x - bend * 0.0 , y, z);
      // store bend into a separate pass below (we bend in X after, see note)
      normals.push(0, 0, 0);
      uvs.push(j / (ringVerts - 1), u);
    }
  }

  // Apply curvature: shift each ring along +X? Real sori curves the whole blade
  // toward the spine. We offset the ring center in X by -bend.
  for (let i = 0; i <= STEPS; i++) {
    const u = i / STEPS;
    const { bend } = bladeAt(u);
    for (let j = 0; j < ringVerts; j++) {
      const idx = (i * ringVerts + j) * 3;
      positions[idx] -= bend;
    }
  }

  for (let i = 0; i < STEPS; i++) {
    for (let j = 0; j < ringVerts; j++) {
      const jn = (j + 1) % ringVerts;
      const a = i * ringVerts + j;
      const b = i * ringVerts + jn;
      const c = (i + 1) * ringVerts + jn;
      const d = (i + 1) * ringVerts + j;
      indices.push(a, b, d);
      indices.push(b, c, d);
    }
  }

  // cap the base (machi end, u=0) with a fan to the ring centroid
  const centerIdx = positions.length / 3;
  {
    const { bend } = bladeAt(0);
    positions.push(-bend, 0, 0);
    normals.push(0, 0, 0);
    uvs.push(0.5, 0);
    for (let j = 0; j < ringVerts; j++) {
      const jn = (j + 1) % ringVerts;
      indices.push(centerIdx, j, jn);
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(indices);
  g.computeVertexNormals();
  return g;
}

/* ---------- Exposed circuitry along the razor edge ----------
   A thin ribbon hugging the cutting edge (the +x extreme of every ring),
   double-sided, emissive circuit texture. Slightly inset so it reads as
   exposed material inside the composite.
------------------------------------------------------------------------ */
function buildEdgeRibbon(width, offset, uRepeat) {
  const positions = [];
  const uvs = [];
  const indices = [];
  for (let i = 0; i <= STEPS; i++) {
    const u = i / STEPS;
    const { z, bend, wS, tS } = bladeAt(u);
    const edgeX = BLADE_W * 0.5 * wS - bend;
    // inner point (toward spine) and edge point
    const innerX = edgeX - width * wS;
    // slight thickness offset so the ribbon sits proud of the blade faces
    const y = offset * tS;
    positions.push(innerX, y, z);
    uvs.push(0, u * uRepeat);
    positions.push(edgeX + 0.00012, y * 0.35, z);
    uvs.push(1, u * uRepeat);
  }
  for (let i = 0; i < STEPS; i++) {
    const a = i * 2, b = i * 2 + 1, c = (i + 1) * 2 + 1, d = (i + 1) * 2;
    indices.push(a, b, d);
    indices.push(b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(indices);
  g.computeVertexNormals();
  return g;
}

/* ---------- Holographic decals on the blade (thin, curved to the face) ---------- */
function bladeDecal(uCenter, uSpan, side, tex, scaleW) {
  const segs = 20;
  const positions = [];
  const uvs = [];
  const indices = [];
  for (let i = 0; i <= segs; i++) {
    const f = i / segs;
    const u = uCenter - uSpan * 0.5 + uSpan * f;
    const { z, bend, wS, tS } = bladeAt(u);
    const cX = -bend;
    const halfW = BLADE_W * 0.5 * wS;
    const x0 = cX - halfW * 0.62 * scaleW;
    const x1 = cX + halfW * 0.30 * scaleW;
    const y = side * (BLADE_T * 0.5 * tS * 0.86 + 0.00022);
    positions.push(x0, y, z); uvs.push(side > 0 ? f : 1 - f, 0);
    positions.push(x1, y * 0.94, z); uvs.push(side > 0 ? f : 1 - f, 1);
  }
  for (let i = 0; i < segs; i++) {
    const a = i * 2, b = i * 2 + 1, c = (i + 1) * 2 + 1, d = (i + 1) * 2;
    if (side > 0) { indices.push(a, b, d, b, c, d); }
    else { indices.push(a, d, b, b, d, c); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(indices);
  g.computeVertexNormals();

  const m = new THREE.MeshBasicMaterial({
    map: tex, transparent: true, opacity: 0.72, side: THREE.DoubleSide,
    depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false
  });
  const mesh = new THREE.Mesh(g, m);
  mesh.renderOrder = 3;
  return mesh;
}

    const frac = seg - Math.floor(seg);

    const x = Math.cos(a) * r;

/* --- Oxblood cracked leather wrap: diamond ito, alternating crossed straps --- */
function makeWrapStrap(zStart, zEnd, sign, phase) {
  // A flattened tube that spirals around the oval hex core
  const turns = 1.0;
  const segs = 44;
  const pts = [];
  for (let i = 0; i <= segs; i++) {
    const f = i / segs;
    const z = THREE.MathUtils.lerp(zStart, zEnd, f);
    const a = phase + sign * f * Math.PI * 2 * turns;
    // radius follows the tapering core
    const tt = THREE.MathUtils.clamp((-z - 0.004) / TANG_LEN, 0, 1);
    const rr = THREE.MathUtils.lerp(TSUKA_R * 0.99, TSUKA_R * 0.86, tt);
    const rx = rr * 0.80, ry = rr * 1.06;
    pts.push(new THREE.Vector3(Math.cos(a) * rx, Math.sin(a) * ry, z));
  }
  const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.35);
  const geo = new THREE.TubeGeometry(curve, 84, 0.0038, 7, false);
  // flatten the strap (ribbon-like)
  const p = geo.attributes.position;
  const nrm = geo.attributes.normal;
  const tmp = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    tmp.set(p.getX(i), p.getY(i), p.getZ(i));
    // squash radially outward less, along strap width more: approximate by
    // scaling the offset from the curve center; TubeGeometry normals give direction
    const nz = nrm.getZ(i);
    const shrink = 1.0 - 0.52 * Math.abs(nz); // flatten along the tube axis direction
    // pull vertex toward the curve axis in z-normal direction
    p.setZ(i, p.getZ(i) * 1.0);
    p.setX(i, p.getX(i) * (0.985 + 0.015 * shrink));
    p.setY(i, p.getY(i) * (0.985 + 0.015 * shrink));
  }
  p.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

{
  const wrapStartZ = -0.010;
  const wrapEndZ = -(TANG_LEN - 0.020);
  const count = 11;
  const span = (wrapEndZ - wrapStartZ) / count;

  const wrapMatA = matLeather.clone();
  wrapMatA.map = leather.colorTex.clone();
  wrapMatA.map.wrapS = wrapMatA.map.wrapT = THREE.RepeatWrapping;
  wrapMatA.map.repeat.set(3, 2);
  wrapMatA.map.needsUpdate = true;
  wrapMatA.bumpMap = leather.bumpTex.clone();
  wrapMatA.bumpMap.wrapS = wrapMatA.bumpMap.wrapT = THREE.RepeatWrapping;
  wrapMatA.bumpMap.repeat.set(3, 2);
  wrapMatA.bumpMap.needsUpdate = true;
  wrapMatA.roughnessMap = leather.roughTex.clone();
  wrapMatA.roughnessMap.wrapS = wrapMatA.roughnessMap.wrapT = THREE.RepeatWrapping;
  wrapMatA.roughnessMap.repeat.set(3, 2);
  wrapMatA.roughnessMap.needsUpdate = true;

  const wrapMatB = wrapMatA.clone();
  wrapMatB.color = new THREE.Color(0xd8cfc9); // slight tonal shift on the crossing strap

  for (let i = 0; i < count; i++) {
    const z0 = wrapStartZ + span * i;
    const z1 = z0 + span * 1.30;

    const g1 = makeWrapStrap(z0, z1, +1, i * 0.55);
    const m1 = new THREE.Mesh(g1, wrapMatA);
    m1.castShadow = true; m1.receiveShadow = true;

    const g2 = makeWrapStrap(z0, z1, -1, i * 0.55 + Math.PI * 0.5);
    const m2 = new THREE.Mesh(g2, wrapMatB);
    m2.castShadow = true; m2.receiveShadow = true;
    tsukaGroup.add(m2);
  }

  // menuki-like ornament under the wrap (small metal boss), both sides
  for (const s of [1, -1]) {

    men.position.set(s * TSUKA_R * 0.86, 0, -TANG_LEN * 0.42);
    men.rotation.z = 0.35 * s;
    tsukaGroup.add(men);
  }
}

/* --- Thin data cable coiled near the pommel --- */
{
  const coilPts = [];
  // starts at the port, coils several times around the very end of the tsuka,
  // then trails off with a short slack loop
  const turns = 4.4;
  const N = 260;
  for (let i = 0; i <= N; i++) {
    const f = i / N;
    const a = f * Math.PI * 2 * turns;
    // radius eases out from the port, then holds, then flares for the trailing loop
    let r, z;
    if (f < 0.10) {
      const k = f / 0.10;
      r = THREE.MathUtils.lerp(0.0035, TSUKA_R * 1.16, k);
      z = THREE.MathUtils.lerp(POMMEL_Z - 0.010, POMMEL_Z + 0.004, k);
    } else if (f < 0.80) {
      const k = (f - 0.10) / 0.70;
      r = TSUKA_R * (1.16 - 0.03 * Math.sin(k * Math.PI * 3));
      z = THREE.MathUtils.lerp(POMMEL_Z + 0.004, POMMEL_Z + 0.052, k);
    } else {
      const k = (f - 0.80) / 0.20;
      // slack: peels away from the handle into a hanging loop
      r = TSUKA_R * (1.16 + 1.55 * Math.pow(k, 1.6));
      z = THREE.MathUtils.lerp(POMMEL_Z + 0.052, POMMEL_Z + 0.016, k);
    }
    const sag = -0.014 * Math.pow(Math.max(0, (f - 0.80) / 0.20), 1.8);
    coilPts.push(new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r * 1.06 + sag, z));
  }
  const coilCurve = new THREE.CatmullRomCurve3(coilPts, false, 'catmullrom', 0.5);
  const coilGeo = new THREE.TubeGeometry(coilCurve, 640, 0.00115, 9, false);
  const coil = new THREE.Mesh(coilGeo, matCableJacket);
  coil.castShadow = true;
  pommelGroup.add(coil);

  // luminous data-flow filament just inside the jacket
  const coreGeo = new THREE.TubeGeometry(coilCurve, 640, 0.00048, 7, false);
  const coreMat = new THREE.MeshBasicMaterial({ color: 0x0e5c6c, toneMapped: false });
  const coilCore = new THREE.Mesh(coreGeo, coreMat);
  pommelGroup.add(coilCore);

  // pulsing packet beads that travel along the cable
  const beads = [];
  for (let i = 0; i < 7; i++) {
    const b = new THREE.Mesh(
      new THREE.SphereGeometry(0.0013, 10, 8),
      new THREE.MeshBasicMaterial({ color: 0x7ff6ff, toneMapped: false })
    );
    b.userData.offset = i / 7;
    beads.push(b);
    pommelGroup.add(b);
  }
  pommelGroup.userData.beads = beads;
  pommelGroup.userData.coilCurve = coilCurve;

  // connector plug at the loose end
  const endPt = coilCurve.getPoint(1.0);
  const endTan = coilCurve.getTangent(1.0);
  const plug = new THREE.Mesh(
    new THREE.CylinderGeometry(0.0026, 0.0021, 0.011, 14),
    new THREE.MeshStandardMaterial({ color: 0x30343b, roughness: 0.3, metalness: 0.95 })
  );
  plug.position.copy(endPt);
  plug.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), endTan.clone().normalize());
  pommelGroup.add(plug);

  const plugTip = new THREE.Mesh(
    new THREE.CylinderGeometry(0.0013, 0.0013, 0.006, 12),
    new THREE.MeshStandardMaterial({ color: 0xc9a24a, roughness: 0.25, metalness: 1.0 })
  );
  plugTip.position.copy(endPt.clone().add(endTan.clone().normalize().multiplyScalar(0.0082)));
  plugTip.quaternion.copy(plug.quaternion);
  pommelGroup.add(plugTip);

  // cable tie / clamp on the handle
  const tie = new THREE.Mesh(
    new THREE.TorusGeometry(TSUKA_R * 1.02, 0.0011, 8, 26),
    new THREE.MeshStandardMaterial({ color: 0x1b1e23, roughness: 0.5, metalness: 0.3 })
  );
  tie.scale.set(0.80, 1.06, 1.0);
  tie.position.z = POMMEL_Z + 0.030;
  pommelGroup.add(tie);
}

function flatDecal(tex, w, h, opacity) {
  const m = new THREE.MeshBasicMaterial({

    depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false
  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h, 1, 1), m);
  mesh.renderOrder = 4;
  return mesh;
}

}

/* --- Environment: tiny procedural studio env for crisp metal reflections --- */
{

    }));

/* ============================================================
   ANIMATION
   ============================================================ */
const clock = new THREE.Clock();
const _v = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // circuit traces flow along the edge
  circuitTexA.offset.y = -t * 0.055;
  circuitTexB.offset.y = -t * 0.055 + 0.31;

  // edge intensity breathing + occasional data surge
  const surge = Math.pow(Math.max(0, Math.sin(t * 0.62)), 8) * 1.6;
  const breathe = 2.2 + Math.sin(t * 1.7) * 0.35 + surge;
  matEdgeCircuit.emissiveIntensity = breathe;
  matEdgeCircuitB.emissiveIntensity = breathe * 0.92;
  matEdgeBright.color.copy(CYAN).multiplyScalar(1.7 + 0.45 * Math.sin(t * 2.3) + surge * 0.5);
  matGlowSheet.opacity = 0.14 + 0.05 * Math.sin(t * 1.9) + surge * 0.05;
  matGlowSheet2.opacity = 0.07 + 0.03 * Math.sin(t * 1.3);
  edgeGlowLight.intensity = 0.75 + 0.25 * Math.sin(t * 1.7) + surge * 0.4;

  // spine LEDs chase
  for (const m of spineLEDs) {
    const v = 0.22 + 0.78 * Math.pow(Math.max(0, Math.sin(t * 2.4 - m.userData.phase)), 6);
    m.material.color.setRGB(0.05 * v + 0.02, 0.62 * v, 0.78 * v);
  }

  // magenta status LED blink pattern (double-blink then hold)
  const cyc = (t * 0.9) % 1;
  let lv = 0.55;
  if (cyc < 0.08) lv = 1.6;
  else if (cyc > 0.16 && cyc < 0.24) lv = 1.4;
  else lv = 0.5 + 0.18 * Math.sin(t * 5.0);
  for (const d of tsubaGroup.userData.ledDomes) d.material.color.copy(MAGENTA).multiplyScalar(lv * 1.5);
  for (const h of tsubaGroup.userData.haloDiscs) h.material.opacity = 0.16 + lv * 0.22;
  tsubaGroup.userData.ledLight.intensity = 0.10 + lv * 0.20;

  // data packets travelling the cable
  const curve = pommelGroup.userData.coilCurve;
  for (const b of pommelGroup.userData.beads) {
    const f = (b.userData.offset + t * 0.11) % 1;
    curve.getPoint(f, _v);
    b.position.copy(_v);
    const fade = 0.35 + 0.65 * Math.pow(Math.sin(f * Math.PI), 0.4);
    b.material.color.setRGB(0.35 * fade, 0.92 * fade, 1.0 * fade);
    b.scale.setScalar(0.75 + 0.45 * fade);
  }

  // holo decals shimmer / flicker
  for (const d of decals) {
    d.material.opacity = 0.48 + 0.26 * Math.sin(t * 1.6 + d.position.z * 22) + (Math.sin(t * 33) > 0.985 ? -0.35 : 0);
  }
  for (const tg of tsukaGroup.userData.tags) {
    tg.material.opacity = 0.42 + 0.22 * Math.sin(t * 2.1 + tg.position.z * 40);
  }

  controls.update();
  renderer.render(scene, camera);
}

});
