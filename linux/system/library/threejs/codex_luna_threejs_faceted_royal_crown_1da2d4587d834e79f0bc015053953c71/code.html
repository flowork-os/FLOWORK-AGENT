<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeweled Crown</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #07050a; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08060c);
scene.fog = new THREE.Fog(0x08060c, 10, 22);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 2.5, 9);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 5;
controls.maxDistance = 13;
controls.target.set(0, 2.1, 0);

const gold = new THREE.MeshStandardMaterial({
  color: 0xc98b21,
  metalness: 0.9,
  roughness: 0.2
});
const goldBright = new THREE.MeshStandardMaterial({
  color: 0xffd86a,
  metalness: 0.95,
  roughness: 0.14
});
const darkGold = new THREE.MeshStandardMaterial({
  color: 0x80500f,
  metalness: 0.85,
  roughness: 0.27
});

const ruby = new THREE.MeshPhysicalMaterial({
  color: 0xb80d32,
  emissive: 0x260008,
  metalness: 0.12,
  roughness: 0.08,
  clearcoat: 1,
  clearcoatRoughness: 0.08,
  flatShading: true
});
const emerald = new THREE.MeshPhysicalMaterial({
  color: 0x08a862,
  emissive: 0x001b0d,
  metalness: 0.1,
  roughness: 0.07,
  clearcoat: 1,
  clearcoatRoughness: 0.06,
  flatShading: true
});
const sapphire = new THREE.MeshPhysicalMaterial({
  color: 0x145bd1,
  emissive: 0x020a2b,
  metalness: 0.1,
  roughness: 0.06,
  clearcoat: 1,
  clearcoatRoughness: 0.05,
  flatShading: true
});
const diamond = new THREE.MeshPhysicalMaterial({
  color: 0xeaf7ff,
  emissive: 0x172b4d,
  metalness: 0.04,
  roughness: 0.025,
  transmission: 0.18,
  thickness: 0.35,
  clearcoat: 1,
  clearcoatRoughness: 0.02,
  flatShading: true
});

function gemGeometry(radius, height, segments = 8) {
  const rings = [
    [-height * 0.5, 0.035],
    [-height * 0.28, radius * 0.68],
    [0, radius],
    [height * 0.27, radius * 0.7],
    [height * 0.5, 0.06]
  ];
  const vertices = [];
  for (const ring of rings) {
    for (let i = 0; i < segments; i++) {
      const a = i / segments * Math.PI * 2;
      vertices.push(Math.cos(a) * ring[1], ring[0], Math.sin(a) * ring[1]);
    }
  }
  const indices = [];
  for (let r = 0; r < rings.length - 1; r++) {
    for (let i = 0; i < segments; i++) {
      const n = (i + 1) % segments;
      const a = r * segments + i;
      const b = r * segments + n;
      const c = (r + 1) * segments + n;
      const d = (r + 1) * segments + i;
      if ((i + r) % 2 === 0) {
        indices.push(a, b, d, b, c, d);
      } else {
        indices.push(a, b, c, a, c, d);
      }
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

function makeGem(material, radius, height, position, scale = 1) {
  const mesh = new THREE.Mesh(gemGeometry(radius, height, 10), material);
  mesh.position.copy(position);
  mesh.scale.setScalar(scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function torus(radius, tube, y, material, segments = 64) {
  const mesh = new THREE.Mesh(new THREE.TorusGeometry(radius, tube, 14, segments), material);
  mesh.rotation.x = Math.PI / 2;
  mesh.position.y = y;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const crown = new THREE.Group();
crown.position.y = -0.2;
scene.add(crown);

const band = new THREE.Mesh(new THREE.CylinderGeometry(2.15, 2.15, 0.58, 64, 1, false), gold);
band.castShadow = true;
band.receiveShadow = true;
crown.add(band);
crown.add(torus(2.15, 0.13, 0.31, goldBright));
crown.add(torus(2.15, 0.1, -0.31, darkGold));

const lowerInset = new THREE.Mesh(
  new THREE.CylinderGeometry(1.88, 1.98, 0.14, 64),
  darkGold
);
lowerInset.position.y = -0.38;
lowerInset.castShadow = true;
crown.add(lowerInset);

const count = 8;
const archMaterials = [goldBright, gold, darkGold];
for (let i = 0; i < count; i++) {
  const a = i / count * Math.PI * 2;
  const x = Math.cos(a);
  const z = Math.sin(a);
  const path = new THREE.CatmullRomCurve3([
    new THREE.Vector3(x * 1.72, 0.02, z * 1.72),
    new THREE.Vector3(x * 1.58, 1.0, z * 1.58),
    new THREE.Vector3(x * 1.05, 2.16, z * 1.05),
    new THREE.Vector3(0, 3.02, 0)
  ]);
  const arch = new THREE.Mesh(
    new THREE.TubeGeometry(path, 28, 0.105, 10, false),
    archMaterials[i % archMaterials.length]
  );
  arch.castShadow = true;
  arch.receiveShadow = true;
  crown.add(arch);

  const levels = [0.42, 1.18, 1.92];
  levels.forEach((t, j) => {
    const p = path.getPoint(t / 3.02);
    const material = j === 0 ? [ruby, sapphire, emerald][i % 3] : [emerald, ruby, sapphire][(i + j) % 3];
    const jewel = makeGem(material, 0.19 - j * 0.025, 0.34 - j * 0.035, p);
    jewel.lookAt(0, p.y + 0.8, 0);
    crown.add(jewel);
  });
}

for (let i = 0; i < 8; i++) {
  const a = i / 8 * Math.PI * 2 + Math.PI / 8;
  const jewel = makeGem(
    [ruby, emerald, sapphire][i % 3],
    0.27,
    0.44,
    new THREE.Vector3(Math.cos(a) * 1.99, -0.02, Math.sin(a) * 1.99)
  );
  jewel.rotation.y = -a;
  crown.add(jewel);
}

const centralMount = new THREE.Mesh(
  new THREE.CylinderGeometry(0.42, 0.52, 0.24, 32),
  goldBright
);
centralMount.position.y = 3.03;
centralMount.castShadow = true;
crown.add(centralMount);

const centralGem = makeGem(diamond, 0.52, 0.9, new THREE.Vector3(0, 3.48, 0), 1);
centralGem.rotation.y = Math.PI / 8;
crown.add(centralGem);

const crownPoint = new THREE.Mesh(
  new THREE.ConeGeometry(0.13, 0.5, 8),
  goldBright
);
crownPoint.position.y = 4.18;
crownPoint.castShadow = true;
crown.add(crownPoint);

function addGlint(x, y, z, size, color) {
  const positions = new Float32Array([
    x - size, y, z, x + size, y, z,
    x, y - size, z, x, y + size, z,
    x, y, z - size, x, y, z + size
  ]);
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  const lines = new THREE.LineSegments(
    geometry,
    new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.92 })
  );
  crown.add(lines);
}

addGlint(0, 3.54, 0.48, 0.42, 0xdff8ff);
addGlint(0.35, 3.72, 0.25, 0.16, 0xffffff);
addGlint(-0.28, 3.38, 0.42, 0.13, 0xa9d8ff);

for (let i = 0; i < 12; i++) {
  const a = i / 12 * Math.PI * 2;
  const p = new THREE.Vector3(Math.cos(a) * 1.48, 0.08, Math.sin(a) * 1.48);
  addGlint(p.x, p.y, p.z, 0.065, [0xff5068, 0x52ffc0, 0x5ca8ff][i % 3]);
}

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(5.5, 64),
  new THREE.MeshStandardMaterial({ color: 0x100d16, metalness: 0.3, roughness: 0.46 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.75;
floor.receiveShadow = true;
scene.add(floor);

const hemi = new THREE.HemisphereLight(0xcbd8ff, 0x170b18, 1.8);
scene.add(hemi);

const key = new THREE.SpotLight(0xffe4ae, 850, 16, Math.PI / 6, 0.45, 1.2);
key.position.set(4.5, 8, 5.5);
key.target = crown;
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
scene.add(key);

const fill = new THREE.PointLight(0x4b7dff, 55, 10, 2);
fill.position.set(-4, 3, 4);
scene.add(fill);

const rim = new THREE.PointLight(0xff2d6d, 45, 9, 2);
rim.position.set(3, 2, -4);
scene.add(rim);

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
