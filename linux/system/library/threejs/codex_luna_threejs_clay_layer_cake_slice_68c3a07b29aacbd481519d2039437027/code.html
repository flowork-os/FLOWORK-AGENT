<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claymation Layer Cake Slice</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #ead8c1; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xead8c1);
scene.fog = new THREE.Fog(0xead8c1, 10, 22);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6.3, 5.1, 7.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 5;
controls.maxDistance = 12;
controls.target.set(0, 1.8, 0);

scene.add(new THREE.HemisphereLight(0xfff4df, 0x98775f, 2.1));

const key = new THREE.DirectionalLight(0xffe2bd, 4.2);
key.position.set(-4, 9, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -4;
key.shadow.bias = -0.0004;
scene.add(key);

const fill = new THREE.DirectionalLight(0xb8d5ff, 1.15);
fill.position.set(5, 3, -5);
scene.add(fill);

const cake = new THREE.Group();
cake.rotation.y = -0.12;
scene.add(cake);

const spongeMat = new THREE.MeshStandardMaterial({
  color: 0xd98c55, roughness: 0.92, metalness: 0
});
const spongeLightMat = new THREE.MeshStandardMaterial({
  color: 0xe5a067, roughness: 0.94
});
const creamMat = new THREE.MeshStandardMaterial({
  color: 0xef7890, roughness: 0.88
});
const creamHighlightMat = new THREE.MeshStandardMaterial({
  color: 0xff9ca8, roughness: 0.86
});
const chocolateMat = new THREE.MeshStandardMaterial({
  color: 0x4b211c, roughness: 0.9
});
const chocolateLightMat = new THREE.MeshStandardMaterial({
  color: 0x663028, roughness: 0.88
});
const cherryMat = new THREE.MeshStandardMaterial({
  color: 0x981f2f, roughness: 0.86
});
const cherryDarkMat = new THREE.MeshStandardMaterial({
  color: 0x50131e, roughness: 0.9
});
const stemMat = new THREE.MeshStandardMaterial({
  color: 0x4f6b37, roughness: 0.95
});

function wedge(width, length, height, material, y, bevel = 0.12) {
  const shape = new THREE.Shape();
  shape.moveTo(-length, -width);
  shape.lineTo(length * 0.82, -width);
  shape.lineTo(length * 0.82, width);
  shape.lineTo(-length, -width);
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: height,
    bevelEnabled: true,
    bevelSegments: 3,
    bevelSize: bevel,
    bevelThickness: bevel * 0.72,
    curveSegments: 4
  });
  geometry.rotateX(Math.PI / 2);
  geometry.translate(0, y, 0);
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  cake.add(mesh);
  return mesh;
}

function blob(position, scale, material, segments = 16) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, segments, segments), material);
  mesh.position.copy(position);
  mesh.scale.copy(scale);
  mesh.rotation.set(
    Math.sin(position.x * 3.1) * 0.18,
    position.x * 0.23,
    Math.cos(position.z * 2.4) * 0.15
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  cake.add(mesh);
  return mesh;
}

function addSpongeDents(y, width, length, material) {
  const points = [
    [-1.72, width + 0.025, 0.22],
    [-0.92, width + 0.035, 0.16],
    [-0.15, width + 0.02, 0.19],
    [0.72, width + 0.03, 0.14],
    [1.42, width + 0.025, 0.2]
  ];
  points.forEach(([x, z, s], i) => {
    blob(
      new THREE.Vector3(x, y + (i % 2 ? 0.05 : -0.02), z),
      new THREE.Vector3(s * 1.25, s * 0.58, 0.055),
      material,
      12
    );
  });
  for (let i = 0; i < 4; i++) {
    const x = -1.55 + i * 0.72;
    blob(
      new THREE.Vector3(x, y + 0.18, width * 0.82),
      new THREE.Vector3(0.12, 0.08, 0.07),
      spongeLightMat,
      12
    );
  }
}

wedge(1.45, 2.62, 0.7, spongeMat, 0.62, 0.13);
wedge(1.42, 2.58, 0.68, spongeLightMat, 1.49, 0.13);
wedge(1.39, 2.54, 0.68, spongeMat, 2.35, 0.13);

addSpongeDents(0.62, 1.45, 2.62, spongeLightMat);
addSpongeDents(1.49, 1.42, 2.58, spongeMat);
addSpongeDents(2.35, 1.39, 2.54, spongeLightMat);

wedge(1.43, 2.59, 0.18, creamMat, 1.02, 0.1);
wedge(1.4, 2.55, 0.18, creamHighlightMat, 1.88, 0.1);

for (let i = 0; i < 9; i++) {
  const x = -2.05 + i * 0.48;
  const z = 1.43 + Math.sin(i * 1.4) * 0.035;
  blob(
    new THREE.Vector3(x, 0.99 + Math.sin(i * 1.7) * 0.035, z),
    new THREE.Vector3(0.22, 0.16 + (i % 3) * 0.025, 0.12),
    creamMat,
    14
  );
}

wedge(1.5, 2.67, 0.25, chocolateMat, 2.84, 0.16);

const dripXs = [-2.0, -1.42, -0.82, -0.18, 0.5, 1.12, 1.67];
dripXs.forEach((x, i) => {
  if (i === 1 || i === 4 || i === 6) {
    blob(
      new THREE.Vector3(x, 2.59 - (i % 2) * 0.08, 1.49),
      new THREE.Vector3(0.18, 0.34 + (i % 3) * 0.08, 0.15),
      chocolateLightMat,
      16
    );
  }
});
[-1.75, -0.9, 0.0, 0.92, 1.62].forEach((x, i) => {
  if (i !== 2) {
    blob(
      new THREE.Vector3(x, 2.62, -1.49),
      new THREE.Vector3(0.2, 0.25 + (i % 2) * 0.12, 0.16),
      chocolateMat,
      16
    );
  }
});

for (let i = 0; i < 7; i++) {
  const x = -1.95 + i * 0.59;
  blob(
    new THREE.Vector3(x, 3.01 + Math.sin(i * 2.2) * 0.025, 0.02),
    new THREE.Vector3(0.12, 0.055, 0.11),
    chocolateLightMat,
    12
  );
}

const cherry = blob(
  new THREE.Vector3(0.28, 3.53, 0.08),
  new THREE.Vector3(0.48, 0.48, 0.48),
  cherryMat,
  24
);
cherry.rotation.set(0.08, -0.18, 0.13);

for (let i = 0; i < 3; i++) {
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.34 - i * 0.045, 0.018, 7, 28),
    cherryDarkMat
  );
  ring.rotation.x = Math.PI / 2;
  ring.position.set(0.28, 3.53 + (i - 1) * 0.13, 0.08);
  ring.scale.set(1, 0.9, 1);
  ring.castShadow = true;
  cake.add(ring);
}

const stemCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0.28, 3.87, 0.08),
  new THREE.Vector3(0.24, 4.22, 0.05),
  new THREE.Vector3(0.48, 4.43, 0.02),
  new THREE.Vector3(0.67, 4.34, 0.02)
]);
const stem = new THREE.Mesh(
  new THREE.TubeGeometry(stemCurve, 18, 0.055, 8, false),
  stemMat
);
stem.castShadow = true;
cake.add(stem);

const leaf = new THREE.Mesh(
  new THREE.SphereGeometry(1, 12, 8),
  new THREE.MeshStandardMaterial({ color: 0x6f873f, roughness: 0.94 })
);
leaf.position.set(0.64, 4.34, 0.02);
leaf.scale.set(0.28, 0.07, 0.13);
leaf.rotation.z = -0.32;
leaf.castShadow = true;
cake.add(leaf);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(9, 64),
  new THREE.MeshStandardMaterial({ color: 0xd8bfa4, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.03;
ground.receiveShadow = true;
scene.add(ground);

const pedestalShadow = new THREE.Mesh(
  new THREE.CircleGeometry(3.2, 48),
  new THREE.MeshBasicMaterial({ color: 0xb79a83, transparent: true, opacity: 0.2 })
);
pedestalShadow.rotation.x = -Math.PI / 2;
pedestalShadow.position.set(0, 0.005, 0);
pedestalShadow.scale.set(1.08, 0.62, 1);
scene.add(pedestalShadow);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
