<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metal Workshop Stool</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #181a1b;
  font-family: Arial, sans-serif;
}
canvas {
  display: block;
}
.label {
  position: fixed;
  left: 24px;
  top: 22px;
  color: rgba(235, 235, 225, 0.82);
  letter-spacing: 0.18em;
  font-size: 11px;
  user-select: none;
  pointer-events: none;
}
.label span {
  display: block;
  margin-top: 7px;
  color: rgba(190, 190, 180, 0.48);
  font-size: 9px;
  letter-spacing: 0.12em;
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="label">WORKSHOP STOOL<span>FABRICATED STEEL / RUBBER FEET</span></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x181a1b);
scene.fog = new THREE.Fog(0x181a1b, 6.5, 13);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.25, 3.15, 4.7);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.15;
controls.minDistance = 3.1;
controls.maxDistance = 7.5;
controls.target.set(0, 1.35, 0);

const metal = new THREE.MeshStandardMaterial({
  color: 0x50575a,
  metalness: 0.88,
  roughness: 0.28
});
const edgeMetal = new THREE.MeshStandardMaterial({
  color: 0x697074,
  metalness: 0.92,
  roughness: 0.22
});
const darkMetal = new THREE.MeshStandardMaterial({
  color: 0x252a2c,
  metalness: 0.78,
  roughness: 0.36
});
const rubber = new THREE.MeshStandardMaterial({
  color: 0x202322,
  metalness: 0.04,
  roughness: 0.88
});
const scuff = new THREE.MeshStandardMaterial({
  color: 0x777064,
  metalness: 0.12,
  roughness: 0.96
});
const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0x303334,
  metalness: 0.08,
  roughness: 0.78
});

function cylinderBetween(a, b, radius, material, segments = 18) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const length = direction.length();
  const midpoint = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);
  const geometry = new THREE.CylinderGeometry(radius, radius, length, segments);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(midpoint);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.normalize()
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function addCylinder(radiusTop, radiusBottom, height, radialSegments, material, x, y, z) {
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radiusTop, radiusBottom, height, radialSegments),
    material
  );
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

const seat = addCylinder(0.385, 0.395, 0.12, 64, metal, 0, 2.53, 0);
const seatTop = addCylinder(0.357, 0.362, 0.027, 64, edgeMetal, 0, 2.602, 0);
const underside = addCylinder(0.255, 0.29, 0.075, 48, darkMetal, 0, 2.445, 0);
const mountingPlate = addCylinder(0.155, 0.18, 0.055, 32, darkMetal, 0, 2.39, 0);

const seatRim = new THREE.Mesh(
  new THREE.TorusGeometry(0.365, 0.022, 10, 64),
  edgeMetal
);
seatRim.rotation.x = Math.PI / 2;
seatRim.position.y = 2.555;
seatRim.castShadow = true;
seatRim.receiveShadow = true;
scene.add(seatRim);

const legTopY = 2.46;
const legBottomY = 0.31;
const topRadius = 0.215;
const bottomRadius = 0.665;
const legData = [];

for (let i = 0; i < 4; i++) {
  const angle = i * Math.PI / 2 + Math.PI / 4;
  const radial = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle));
  const top = new THREE.Vector3(radial.x * topRadius, legTopY, radial.z * topRadius);
  const bottom = new THREE.Vector3(radial.x * bottomRadius, legBottomY, radial.z * bottomRadius);
  const axis = new THREE.Vector3().subVectors(bottom, top).normalize();

  cylinderBetween(top, bottom, 0.056, metal, 20);

  const upperCollar = new THREE.Mesh(
    new THREE.TorusGeometry(0.071, 0.012, 8, 20),
    edgeMetal
  );
  upperCollar.position.copy(top).add(axis.clone().multiplyScalar(0.045));
  upperCollar.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), axis);
  upperCollar.castShadow = true;
  scene.add(upperCollar);

  const footStart = bottom.clone().add(axis.clone().multiplyScalar(0.015));
  const footEnd = bottom.clone().add(axis.clone().multiplyScalar(0.22));
  cylinderBetween(footStart, footEnd, 0.098, rubber, 16);

  const sole = addCylinder(0.104, 0.112, 0.045, 16, rubber, footEnd.x, 0.135, footEnd.z);

  const scuffPatch = new THREE.Mesh(
    new THREE.SphereGeometry(0.035, 8, 5),
    scuff
  );
  scuffPatch.scale.set(1.25, 0.3, 0.8);
  scuffPatch.position.copy(footEnd).add(new THREE.Vector3(0, 0.018, 0));
  scuffPatch.castShadow = true;
  scene.add(scuffPatch);

  legData.push({ top, bottom, axis, angle });
}

const braceY = 1.02;
const braceRadius = bottomRadius - (bottomRadius - topRadius) * ((braceY - legBottomY) / (legTopY - legBottomY));
const brace = new THREE.Mesh(
  new THREE.TorusGeometry(braceRadius, 0.037, 12, 72),
  metal
);
brace.rotation.x = Math.PI / 2;
brace.position.y = braceY;
brace.castShadow = true;
brace.receiveShadow = true;
scene.add(brace);

for (const leg of legData) {
  const t = (legTopY - braceY) / (legTopY - legBottomY);
  const joint = new THREE.Vector3().lerpVectors(leg.top, leg.bottom, t);
  const weld = new THREE.Mesh(
    new THREE.SphereGeometry(0.073, 14, 8),
    edgeMetal
  );
  weld.position.copy(joint);
  weld.scale.set(1.15, 0.72, 1.15);
  weld.castShadow = true;
  weld.receiveShadow = true;
  scene.add(weld);
}

for (const leg of legData) {
  const braceJoint = new THREE.Vector3(
    Math.cos(leg.angle) * braceRadius,
    braceY,
    Math.sin(leg.angle) * braceRadius
  );
  cylinderBetween(
    new THREE.Vector3(0, 2.40, 0),
    new THREE.Vector3(leg.top.x * 0.9, 2.40, leg.top.z * 0.9),
    0.028,
    darkMetal,
    12
  );
  braceJoint.y += 0.002;
}

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  floorMaterial
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
floor.receiveShadow = true;
scene.add(floor);

const grid = new THREE.GridHelper(14, 28, 0x545959, 0x383c3d);
grid.position.y = 0.006;
grid.material.transparent = true;
grid.material.opacity = 0.22;
scene.add(grid);

const hemisphere = new THREE.HemisphereLight(0xc8d0d2, 0x171918, 1.55);
scene.add(hemisphere);

const key = new THREE.DirectionalLight(0xfff2dc, 3.2);
key.position.set(3.8, 6.5, 4.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -3.5;
key.shadow.camera.right = 3.5;
key.shadow.camera.top = 5;
key.shadow.camera.bottom = -2;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 14;
key.shadow.bias = -0.00025;
scene.add(key);

const fill = new THREE.PointLight(0x91b6c7, 28, 8, 2);
fill.position.set(-3.2, 3.4, 2.4);
scene.add(fill);

const rim = new THREE.SpotLight(0xffbd78, 34, 9, Math.PI / 5, 0.55, 1.5);
rim.position.set(-2.8, 4.6, -3.4);
rim.target.position.set(0, 1.2, 0);
rim.castShadow = true;
rim.shadow.mapSize.set(1024, 1024);
scene.add(rim);
scene.add(rim.target);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
