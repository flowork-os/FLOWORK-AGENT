<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Metro Train Car</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: radial-gradient(circle at 50% 30%, #e8edf1 0%, #b8c2ca 100%);
      font-family: system-ui, sans-serif;
    }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 24px;
      bottom: 22px;
      color: rgba(25, 38, 48, 0.72);
      letter-spacing: 0.16em;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="label">Metropolitan Transit · Series M4</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xcbd4da);
    scene.fog = new THREE.Fog(0xcbd4da, 25, 48);

    const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(12, 7.5, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.15, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.55;
    controls.minDistance = 8;
    controls.maxDistance = 28;
    controls.maxPolarAngle = Math.PI * 0.48;

    const hemi = new THREE.HemisphereLight(0xeaf5ff, 0x4a5360, 2.2);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff5e8, 4.2);
    sun.position.set(-7, 12, 9);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -14;
    sun.shadow.camera.right = 14;
    sun.shadow.camera.top = 12;
    sun.shadow.camera.bottom = -8;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 35;
    sun.shadow.bias = -0.00015;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x9dc7df, 1.25);
    fill.position.set(8, 6, -10);
    scene.add(fill);

    const materials = {
      body: new THREE.MeshPhysicalMaterial({
        color: 0xe7e9e8,
        roughness: 0.31,
        metalness: 0.34,
        clearcoat: 0.38,
        clearcoatRoughness: 0.3
      }),
      trim: new THREE.MeshStandardMaterial({
        color: 0x202a32,
        roughness: 0.36,
        metalness: 0.72
      }),
      blue: new THREE.MeshStandardMaterial({
        color: 0x087d9c,
        roughness: 0.35,
        metalness: 0.24
      }),
      accent: new THREE.MeshStandardMaterial({
        color: 0xf0b72e,
        roughness: 0.38,
        metalness: 0.16
      }),
      glass: new THREE.MeshPhysicalMaterial({
        color: 0x17333e,
        roughness: 0.12,
        metalness: 0.1,
        transmission: 0.12,
        transparent: true,
        opacity: 0.88,
        clearcoat: 0.8
      }),
      rubber: new THREE.MeshStandardMaterial({
        color: 0x15191c,
        roughness: 0.82,
        metalness: 0.08
      }),
      steel: new THREE.MeshStandardMaterial({
        color: 0x5e6970,
        roughness: 0.44,
        metalness: 0.78
      }),
      darkSteel: new THREE.MeshStandardMaterial({
        color: 0x2a3237,
        roughness: 0.56,
        metalness: 0.7
      }),
      light: new THREE.MeshStandardMaterial({
        color: 0xf2eee0,
        emissive: 0xffe1a1,
        emissiveIntensity: 1.8,
        roughness: 0.28
      }),
      red: new THREE.MeshStandardMaterial({
        color: 0xb62829,
        emissive: 0x4b0805,
        emissiveIntensity: 0.5,
        roughness: 0.28
      })
    };

    function mesh(geometry, material, position, rotation = null, shadows = true) {
      const object = new THREE.Mesh(geometry, material);
      object.position.set(position[0], position[1], position[2]);
      if (rotation) object.rotation.set(rotation[0], rotation[1], rotation[2]);
      object.castShadow = shadows;
      object.receiveShadow = shadows;
      scene.add(object);
      return object;
    }

    function box(size, material, position, radius = 0.02, segments = 2) {
      const geometry = radius > 0
        ? new RoundedBoxGeometry(size[0], size[1], size[2], segments, radius)
        : new THREE.BoxGeometry(size[0], size[1], size[2]);
      return mesh(geometry, material, position);
    }

    const train = new THREE.Group();
    scene.add(train);

    const crossSection = new THREE.Shape();
    crossSection.moveTo(-1.47, -1.34);
    crossSection.lineTo(1.47, -1.34);
    crossSection.quadraticCurveTo(1.55, -1.34, 1.55, -1.22);
    crossSection.lineTo(1.55, 0.76);
    crossSection.quadraticCurveTo(1.52, 1.1, 1.23, 1.28);
    crossSection.quadraticCurveTo(0.74, 1.48, 0, 1.5);
    crossSection.quadraticCurveTo(-0.74, 1.48, -1.23, 1.28);
    crossSection.quadraticCurveTo(-1.52, 1.1, -1.55, 0.76);
    crossSection.lineTo(-1.55, -1.22);
    crossSection.quadraticCurveTo(-1.55, -1.34, -1.47, -1.34);

    const bodyGeometry = new THREE.ExtrudeGeometry(crossSection, {
      depth: 15,
      steps: 1,
      bevelEnabled: true,
      bevelThickness: 0.055,
      bevelSize: 0.045,
      bevelSegments: 3,
      curveSegments: 12
    });
    bodyGeometry.rotateY(Math.PI / 2);
    bodyGeometry.translate(-7.5, 2.72, 0);

    const body = new THREE.Mesh(bodyGeometry, materials.body);
    body.castShadow = true;
    body.receiveShadow = true;
    train.add(body);

    function trainBox(size, material, position, radius = 0.02, segments = 2) {
      const geometry = radius > 0
        ? new RoundedBoxGeometry(size[0], size[1], size[2], segments, radius)
        : new THREE.BoxGeometry(size[0], size[1], size[2]);
      const object = new THREE.Mesh(geometry, material);
      object.position.set(position[0], position[1], position[2]);
      object.castShadow = true;
      object.receiveShadow = true;
      train.add(object);
      return object;
    }

    for (const side of [-1, 1]) {
      const zFace = side * 1.558;

      trainBox([14.7, 0.31, 0.035], materials.blue, [0, 1.62, zFace], 0.01);
      trainBox([14.65, 0.075, 0.04], materials.accent, [0, 2.02, side * 1.563], 0.01);
      trainBox([14.7, 0.06, 0.035], materials.trim, [0, 3.42, side * 1.563], 0.01);

      const windowData = [
        [-6.25, 1.28],
        [-4.93, 1.02],
        [-2.25, 1.2],
        [-0.9, 1.18],
        [0.55, 1.18],
        [2.05, 1.18],
        [4.92, 1.04],
        [6.25, 1.28]
      ];

      for (const [x, width] of windowData) {
        trainBox([width + 0.12, 1.08, 0.055], materials.trim, [x, 2.78, zFace], 0.035, 3);
        trainBox([width, 0.94, 0.065], materials.glass, [x, 2.79, side * 1.594], 0.025, 3);
        trainBox([0.025, 0.87, 0.012], materials.steel, [x, 2.79, side * 1.631], 0);
      }

      for (const doorX of [-3.65, 3.65]) {
        trainBox([2.02, 2.25, 0.07], materials.trim, [doorX, 2.42, zFace], 0.035, 3);
        trainBox([1.88, 2.12, 0.075], materials.body, [doorX, 2.43, side * 1.592], 0.025, 3);
        trainBox([0.035, 2.08, 0.02], materials.trim, [doorX, 2.43, side * 1.637], 0);
        trainBox([0.76, 0.9, 0.045], materials.trim, [doorX - 0.48, 2.86, side * 1.637], 0.025, 3);
        trainBox([0.76, 0.9, 0.045], materials.trim, [doorX + 0.48, 2.86, side * 1.637], 0.025, 3);
        trainBox([0.67, 0.81, 0.055], materials.glass, [doorX - 0.48, 2.86, side * 1.666], 0.02, 3);
        trainBox([0.67, 0.81, 0.055], materials.glass, [doorX + 0.48, 2.86, side * 1.666], 0.02, 3);
        trainBox([0.08, 1.98, 0.035], materials.accent, [doorX - 0.94, 2.42, side * 1.647], 0.01);
        trainBox([0.08, 1.98, 0.035], materials.accent, [doorX + 0.94, 2.42, side * 1.647], 0.01);
        trainBox([1.7, 0.055, 0.08], materials.steel, [doorX, 1.33, side * 1.62], 0.01);
      }

      for (const x of [-6.95, 6.95]) {
        trainBox([0.33, 0.15, 0.06], materials.light, [x, 1.72, side * 1.605], 0.035, 3);
      }
    }

    for (const endX of [-7.55, 7.55]) {
      trainBox([0.06, 2.44, 2.78], materials.trim, [endX, 2.64, 0], 0.08, 4);
      trainBox([0.07, 1.86, 1.03], materials.darkSteel, [endX + Math.sign(endX) * 0.035, 2.65, 0], 0.08, 4);
      trainBox([0.075, 0.74, 0.82], materials.glass, [endX + Math.sign(endX) * 0.075, 2.94, 0], 0.04, 3);
      trainBox([0.1, 0.12, 2.35], materials.rubber, [endX + Math.sign(endX) * 0.09, 1.5, 0], 0.03);
      trainBox([0.22, 0.18, 0.18], materials.red, [endX + Math.sign(endX) * 0.09, 2.02, -0.98], 0.04, 3);
      trainBox([0.22, 0.18, 0.18], materials.red, [endX + Math.sign(endX) * 0.09, 2.02, 0.98], 0.04, 3);
    }

    const roofUnits = [
      [-4.75, 1.78, 0.62],
      [-1.65, 1.62, 0.72],
      [1.15, 1.62, 0.72],
      [4.6, 1.92, 0.68]
    ];

    for (const [x, length, width] of roofUnits) {
      trainBox([length, 0.25, width], materials.darkSteel, [x, 4.29, 0], 0.1, 4);
      for (let i = -2; i <= 2; i++) {
        trainBox([length * 0.74, 0.018, 0.025], materials.steel, [x, 4.424, i * width * 0.13], 0);
      }
    }

    for (const x of [-3.1, 3.1]) {
      trainBox([0.62, 0.16, 1.02], materials.steel, [x, 4.24, 0], 0.05, 3);
      const ventGeometry = new THREE.CylinderGeometry(0.25, 0.25, 0.1, 20);
      const vent = new THREE.Mesh(ventGeometry, materials.darkSteel);
      vent.position.set(x, 4.39, 0);
      vent.castShadow = true;
      train.add(vent);
    }

    trainBox([12.8, 0.22, 1.5], materials.darkSteel, [0, 1.12, 0], 0.05, 3);

    const equipment = [
      [-5.7, 1.65, 0.68, 1.12],
      [-3.55, 1.65, 0.6, 1.2],
      [-1.3, 1.9, 0.72, 1.0],
      [1.15, 1.75, 0.72, 1.1],
      [3.4, 1.45, 0.66, 1.22],
      [5.55, 1.55, 0.62, 1.08]
    ];

    for (const [x, length, height, width] of equipment) {
      trainBox([length, height, width], materials.darkSteel, [x, 0.72, 0], 0.07, 3);
      trainBox([length * 0.72, 0.025, width + 0.02], materials.steel, [x, 0.91, 0], 0);
    }

    const wheelGeometry = new THREE.CylinderGeometry(0.46, 0.46, 0.22, 28);
    wheelGeometry.rotateX(Math.PI / 2);
    const hubGeometry = new THREE.CylinderGeometry(0.16, 0.16, 0.245, 20);
    hubGeometry.rotateX(Math.PI / 2);

    for (const bogieX of [-4.85, 4.85]) {
      trainBox([2.15, 0.28, 1.82], materials.darkSteel, [bogieX, 0.62, 0], 0.08, 3);
      trainBox([1.42, 0.16, 1.94], materials.steel, [bogieX, 0.92, 0], 0.04, 3);

      for (const axleOffset of [-0.66, 0.66]) {
        for (const side of [-1, 1]) {
          const wheel = new THREE.Mesh(wheelGeometry, materials.rubber);
          wheel.position.set(bogieX + axleOffset, 0.55, side * 1.16);
          wheel.castShadow = true;
          train.add(wheel);

          const hub = new THREE.Mesh(hubGeometry, materials.steel);
          hub.position.set(bogieX + axleOffset, 0.55, side * 1.285);
          hub.castShadow = true;
          train.add(hub);
        }

        const axle = new THREE.Mesh(
          new THREE.CylinderGeometry(0.075, 0.075, 2.42, 12),
          materials.steel
        );
        axle.rotation.x = Math.PI / 2;
        axle.position.set(bogieX + axleOffset, 0.55, 0);
        train.add(axle);
      }

      for (const side of [-1, 1]) {
        const spring = new THREE.Mesh(
          new THREE.TorusGeometry(0.18, 0.055, 8, 18),
          materials.steel
        );
        spring.position.set(bogieX, 0.78, side * 1.08);
        spring.rotation.y = Math.PI / 2;
        train.add(spring);
      }
    }

    const couplerGeometry = new THREE.CylinderGeometry(0.11, 0.11, 0.72, 12);
    couplerGeometry.rotateZ(Math.PI / 2);
    for (const endX of [-1, 1]) {
      const coupler = new THREE.Mesh(couplerGeometry, materials.darkSteel);
      coupler.position.set(endX * 7.86, 0.82, 0);
      coupler.castShadow = true;
      train.add(coupler);
      trainBox([0.2, 0.34, 0.5], materials.darkSteel, [endX * 8.2, 0.82, 0], 0.05, 3);
    }

    const ground = mesh(
      new THREE.PlaneGeometry(70, 45),
      new THREE.MeshStandardMaterial({ color: 0xaeb7bb, roughness: 0.93, metalness: 0.02 }),
      [0, 0, 0],
      [-Math.PI / 2, 0, 0]
    );
    ground.receiveShadow = true;
    ground.castShadow = false;

    const ballast = mesh(
      new RoundedBoxGeometry(22, 0.12, 4.5, 3, 0.08),
      new THREE.MeshStandardMaterial({ color: 0x6e777b, roughness: 0.95 }),
      [0, 0.08, 0]
    );
    ballast.receiveShadow = true;

    const railMaterial = new THREE.MeshStandardMaterial({
      color: 0x656b6d,
      roughness: 0.32,
      metalness: 0.88
    });

    for (const z of [-1.04, 1.04]) {
      const rail = mesh(
        new RoundedBoxGeometry(22, 0.15, 0.12, 2, 0.025),
        railMaterial,
        [0, 0.22, z]
      );
      rail.receiveShadow = true;
    }

    const sleeperMaterial = new THREE.MeshStandardMaterial({
      color: 0x4e4540,
      roughness: 0.9
    });

    for (let x = -10.5; x <= 10.5; x += 0.72) {
      mesh(
        new RoundedBoxGeometry(0.18, 0.12, 3.15, 2, 0.025),
        sleeperMaterial,
        [x, 0.14, 0]
      );
    }

    const backdropMaterial = new THREE.MeshStandardMaterial({
      color: 0xd8dfe2,
      roughness: 0.88
    });

    for (const x of [-18, 18]) {
      box([0.35, 7, 18], backdropMaterial, [x, 3.5, -4], 0.08, 3);
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      train.position.y = Math.sin(elapsed * 0.8) * 0.006;
      controls.update();
      renderer.render(scene, camera);
    }

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });

    animate();
  </script>
</body>
</html>
