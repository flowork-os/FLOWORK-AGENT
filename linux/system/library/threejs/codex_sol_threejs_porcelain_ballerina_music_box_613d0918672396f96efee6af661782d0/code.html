<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Porcelain Ballerina</title>
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #171b24; }
canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171b24);
scene.fog = new THREE.Fog(0x171b24, 14, 26);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8.5, 5.9, 10.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4.25, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 8;
controls.maxDistance = 20;
controls.maxPolarAngle = Math.PI * 0.68;

function crackleTexture() {
  const size = 512;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#777';
  ctx.fillRect(0, 0, size, size);
  ctx.strokeStyle = 'rgba(220,220,220,0.34)';
  ctx.lineWidth = 0.65;

  let seed = 93217;
  const random = () => {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  };

  for (let i = 0; i < 290; i++) {
    let x = random() * size;
    let y = random() * size;
    const branches = 1 + Math.floor(random() * 3);
    for (let b = 0; b < branches; b++) {
      ctx.beginPath();
      ctx.moveTo(x, y);
      let angle = random() * Math.PI * 2;
      const steps = 2 + Math.floor(random() * 5);
      for (let s = 0; s < steps; s++) {
        angle += (random() - 0.5) * 1.25;
        const length = 7 + random() * 18;
        x += Math.cos(angle) * length;
        y += Math.sin(angle) * length;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(3.5, 3.5);
  texture.colorSpace = THREE.NoColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return texture;
}

const crackle = crackleTexture();

const porcelain = new THREE.MeshPhysicalMaterial({
  color: 0xf2ead8,
  roughness: 0.2,
  metalness: 0,
  clearcoat: 0.82,
  clearcoatRoughness: 0.11,
  bumpMap: crackle,
  bumpScale: 0.018
});

const porcelainWarm = porcelain.clone();
porcelainWarm.color.set(0xeadfc9);

const cobalt = new THREE.MeshPhysicalMaterial({
  color: 0x173f82,
  roughness: 0.25,
  clearcoat: 0.72,
  clearcoatRoughness: 0.12
});

const gold = new THREE.MeshStandardMaterial({
  color: 0xd6a73f,
  metalness: 0.78,
  roughness: 0.2
});

const hairMat = new THREE.MeshPhysicalMaterial({
  color: 0x44362f,
  roughness: 0.28,
  clearcoat: 0.65,
  clearcoatRoughness: 0.16,
  bumpMap: crackle,
  bumpScale: 0.012
});

const darkGold = new THREE.MeshStandardMaterial({
  color: 0x8c6421,
  metalness: 0.65,
  roughness: 0.25
});

const figure = new THREE.Group();
figure.rotation.y = -0.18;
scene.add(figure);

function mesh(geometry, material, parent = figure) {
  const object = new THREE.Mesh(geometry, material);
  object.castShadow = true;
  object.receiveShadow = true;
  parent.add(object);
  return object;
}

function limbBetween(a, b, r1, r2, material = porcelain, radial = 20) {
  const start = new THREE.Vector3(...a);
  const end = new THREE.Vector3(...b);
  const delta = end.clone().sub(start);
  const length = delta.length();
  const geometry = new THREE.CylinderGeometry(r2, r1, length, radial, 5, false);
  const object = mesh(geometry, material);
  object.position.copy(start).add(end).multiplyScalar(0.5);
  object.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), delta.normalize());
  return object;
}

function sphereAt(position, scale, material = porcelain, segments = 28) {
  const object = mesh(new THREE.SphereGeometry(1, segments, Math.max(14, segments / 2)), material);
  object.position.set(...position);
  object.scale.set(...scale);
  return object;
}

function tube(points, radius, material, closed = false, segments = 64) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)), closed, 'centripetal');
  return mesh(new THREE.TubeGeometry(curve, segments, radius, 8, closed), material);
}

function lathe(profile, material, segments = 64) {
  return mesh(
    new THREE.LatheGeometry(profile.map(p => new THREE.Vector2(p[0], p[1])), segments),
    material
  );
}

// Fluted porcelain plinth
const plinthProfile = [
  [0.00, 0.00], [1.20, 0.00], [1.28, 0.10], [1.30, 0.20],
  [1.19, 0.28], [1.12, 0.37], [1.10, 0.72], [1.15, 0.83],
  [1.06, 0.94], [0.00, 0.94]
];
const plinth = lathe(plinthProfile, porcelainWarm, 96);
plinth.position.y = 0.04;

const baseGold1 = mesh(new THREE.TorusGeometry(1.225, 0.025, 8, 96), gold);
baseGold1.rotation.x = Math.PI / 2;
baseGold1.position.y = 0.225;

const baseGold2 = mesh(new THREE.TorusGeometry(1.105, 0.018, 8, 96), gold);
baseGold2.rotation.x = Math.PI / 2;
baseGold2.position.y = 0.80;

for (let i = 0; i < 28; i++) {
  const a = i / 28 * Math.PI * 2;
  const x = Math.cos(a) * 1.115;
  const z = Math.sin(a) * 1.115;
  const flute = mesh(new THREE.CapsuleGeometry(0.024, 0.39, 4, 8), porcelain);
  flute.position.set(x, 0.54, z);
  flute.rotation.z = 0;
}

// Supporting foot and leg
sphereAt([-0.13, 1.03, 0.03], [0.23, 0.11, 0.52], porcelain);
limbBetween([-0.10, 1.18, 0.05], [-0.06, 2.16, 0.04], 0.18, 0.22);
sphereAt([-0.06, 2.17, 0.04], [0.225, 0.22, 0.22]);
limbBetween([-0.06, 2.22, 0.04], [0.02, 3.38, 0.02], 0.23, 0.31);

// Extended arabesque leg, slightly rising behind
sphereAt([0.05, 3.34, -0.10], [0.30, 0.31, 0.30]);
limbBetween([0.04, 3.38, -0.12], [0.18, 3.57, -1.55], 0.29, 0.205);
sphereAt([0.18, 3.57, -1.55], [0.21, 0.20, 0.20]);
limbBetween([0.18, 3.57, -1.56], [0.32, 3.73, -2.68], 0.20, 0.125);
sphereAt([0.35, 3.74, -2.91], [0.14, 0.13, 0.43], porcelain);
const backFoot = figure.children[figure.children.length - 1];
backFoot.rotation.x = -0.12;

// Tutu ruffled disc
function ruffledTutuGeometry() {
  const radialSegments = 96;
  const inner = 0.31;
  const outer = 1.48;
  const thickness = 0.075;
  const positions = [];
  const normals = [];
  const uvs = [];
  const indices = [];

  for (let side = 0; side < 2; side++) {
    for (let ring = 0; ring < 2; ring++) {
      for (let i = 0; i <= radialSegments; i++) {
        const a = i / radialSegments * Math.PI * 2;
        const wave = ring === 1
          ? 0.10 * Math.sin(a * 12) + 0.035 * Math.sin(a * 24 + 0.4)
          : 0;
        const radius = ring === 0 ? inner : outer + 0.055 * Math.sin(a * 12);
        const y = (side === 0 ? thickness : -thickness) + wave;
        positions.push(Math.cos(a) * radius, y, Math.sin(a) * radius);
        normals.push(0, side === 0 ? 1 : -1, 0);
        uvs.push(ring, i / radialSegments);
      }
    }
  }

  const row = radialSegments + 1;
  for (let side = 0; side < 2; side++) {
    const offset = side * row * 2;
    for (let i = 0; i < radialSegments; i++) {
      const a = offset + i;
      const b = offset + row + i;
      if (side === 0) indices.push(a, b, a + 1, a + 1, b, b + 1);
      else indices.push(a, a + 1, b, a + 1, b + 1, b);
    }
  }

  const topOuter = row;
  const bottomOuter = row * 3;
  const topInner = 0;
  const bottomInner = row * 2;
  for (let i = 0; i < radialSegments; i++) {
    indices.push(topOuter + i, bottomOuter + i, topOuter + i + 1);
    indices.push(topOuter + i + 1, bottomOuter + i, bottomOuter + i + 1);
    indices.push(topInner + i, topInner + i + 1, bottomInner + i);
    indices.push(topInner + i + 1, bottomInner + i + 1, bottomInner + i);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

const tutu = mesh(ruffledTutuGeometry(), porcelain);
tutu.position.set(0.02, 3.48, 0);
tutu.rotation.x = -0.025;

// Cobalt rim
const rimPoints = [];
for (let i = 0; i <= 96; i++) {
  const a = i / 96 * Math.PI * 2;
  const r = 1.485 + 0.055 * Math.sin(a * 12);
  rimPoints.push([0.02 + Math.cos(a) * r, 3.55 + 0.10 * Math.sin(a * 12), Math.sin(a) * r]);
}
tube(rimPoints, 0.025, cobalt, true, 160);

// Hand-painted cobalt scrollwork over the tutu
for (let k = 0; k < 8; k++) {
  const base = k / 8 * Math.PI * 2;
  const points = [];
  for (let i = 0; i <= 28; i++) {
    const t = i / 28;
    const a = base + (t - 0.5) * 0.58 + Math.sin(t * Math.PI * 2) * 0.10;
    const r = 0.50 + t * 0.78 + 0.08 * Math.sin(t * Math.PI * 2);
    points.push([
      0.02 + Math.cos(a) * r,
      3.575 + 0.025 * Math.sin(t * Math.PI),
      Math.sin(a) * r
    ]);
  }
  tube(points, 0.018, cobalt, false, 40);

  const curl = [];
  for (let i = 0; i <= 24; i++) {
    const t = i / 24;
    const a = base + 0.24 + t * Math.PI * 1.65;
    const centerR = 0.89;
    const local = 0.19 * (1 - t * 0.65);
    curl.push([
      0.02 + Math.cos(base) * centerR + Math.cos(a) * local,
      3.58 + 0.012 * Math.sin(t * Math.PI),
      Math.sin(base) * centerR + Math.sin(a) * local
    ]);
  }
  tube(curl, 0.014, cobalt, false, 32);
}

// Waist and bodice
const hips = sphereAt([0.02, 3.58, 0], [0.47, 0.43, 0.37], porcelain);
const torso = lathe([
  [0.00, 0.00], [0.34, 0.00], [0.41, 0.24], [0.39, 0.58],
  [0.48, 0.92], [0.40, 1.15], [0.23, 1.27], [0.00, 1.27]
], porcelain, 64);
torso.position.set(0.02, 3.50, 0);
torso.scale.z = 0.78;
torso.rotation.z = -0.055;

const waistGold = mesh(new THREE.TorusGeometry(0.355, 0.027, 10, 64), gold);
waistGold.rotation.x = Math.PI / 2;
waistGold.position.set(0.02, 3.58, 0);

const neckline = tube([
  [-0.29, 4.57, 0.18], [-0.15, 4.65, 0.25], [0.02, 4.68, 0.27],
  [0.19, 4.65, 0.25], [0.32, 4.57, 0.18]
], 0.022, gold, false, 40);

// Neck and head
limbBetween([0.02, 4.72, 0], [0.02, 5.12, 0.01], 0.17, 0.18);
const head = sphereAt([0.02, 5.42, 0.02], [0.39, 0.50, 0.36], porcelain, 36);
head.rotation.z = -0.09;
head.rotation.y = -0.18;

// Ears, nose, and restrained painted features
sphereAt([-0.37, 5.43, 0.01], [0.065, 0.12, 0.055], porcelain, 18);
sphereAt([0.39, 5.43, 0.01], [0.065, 0.12, 0.055], porcelain, 18);
const nose = sphereAt([-0.055, 5.43, 0.365], [0.055, 0.095, 0.07], porcelain, 18);
nose.rotation.x = 0.2;

const featureMat = new THREE.MeshStandardMaterial({ color: 0x514239, roughness: 0.6 });
for (const x of [-0.15, 0.13]) {
  const eye = sphereAt([x, 5.55, 0.344], [0.045, 0.021, 0.012], featureMat, 14);
  eye.rotation.z = -0.08;
}
const lips = tube([
  [-0.105, 5.28, 0.353], [-0.025, 5.255, 0.371], [0.065, 5.285, 0.355]
], 0.012, new THREE.MeshStandardMaterial({ color: 0xa65d59, roughness: 0.45 }), false, 18);

// Sculpted hair cap and bun
const hairCap = sphereAt([0.04, 5.58, -0.055], [0.405, 0.39, 0.34], hairMat, 36);
hairCap.position.z -= 0.08;
const forehead = sphereAt([0.02, 5.72, 0.20], [0.34, 0.18, 0.16], hairMat, 28);
forehead.rotation.x = 0.3;
const bun = sphereAt([0.10, 5.93, -0.20], [0.30, 0.29, 0.27], hairMat, 32);
for (let i = 0; i < 6; i++) {
  const a = i / 6 * Math.PI * 2;
  const strand = mesh(new THREE.TorusGeometry(0.20 - i * 0.015, 0.012, 6, 36, Math.PI * 1.45), darkGold);
  strand.position.set(0.10, 5.93, -0.48);
  strand.rotation.set(Math.PI / 2, a * 0.18, a);
}

// Arms swept overhead
const leftShoulder = [-0.38, 4.62, 0.00];
const leftElbow = [-0.88, 5.22, 0.04];
const leftWrist = [-0.56, 5.91, 0.00];
const leftHand = [-0.25, 6.22, -0.01];

sphereAt(leftShoulder, [0.22, 0.22, 0.22]);
limbBetween(leftShoulder, leftElbow, 0.18, 0.145);
sphereAt(leftElbow, [0.15, 0.15, 0.15]);
limbBetween(leftElbow, leftWrist, 0.145, 0.09);
limbBetween(leftWrist, leftHand, 0.09, 0.065);
const lHand = sphereAt(leftHand, [0.10, 0.24, 0.075], porcelain, 22);
lHand.rotation.z = 0.72;

const rightShoulder = [0.40, 4.63, 0.01];
const rightElbow = [0.83, 5.32, -0.02];
const rightWrist = [0.48, 6.02, -0.03];
const rightHand = [0.18, 6.27, -0.01];

sphereAt(rightShoulder, [0.22, 0.22, 0.22]);
limbBetween(rightShoulder, rightElbow, 0.18, 0.145);
sphereAt(rightElbow, [0.15, 0.15, 0.15]);
limbBetween(rightElbow, rightWrist, 0.145, 0.09);
limbBetween(rightWrist, rightHand, 0.09, 0.062);
const rHand = sphereAt(rightHand, [0.10, 0.23, 0.075], porcelain, 22);
rHand.rotation.z = -0.75;

// Delicate gold bodice seams
tube([
  [-0.25, 3.72, 0.31], [-0.20, 4.05, 0.34], [-0.26, 4.40, 0.30], [-0.33, 4.57, 0.18]
], 0.014, gold, false, 40);
tube([
  [0.29, 3.72, 0.31], [0.24, 4.05, 0.34], [0.29, 4.40, 0.30], [0.32, 4.57, 0.18]
], 0.014, gold, false, 40);

// Small porcelain rose at the waist
for (let i = 0; i < 7; i++) {
  const a = i / 7 * Math.PI * 2;
  const petal = sphereAt([
    0.02 + Math.cos(a) * 0.10,
    3.72 + Math.sin(a) * 0.10,
    0.40
  ], [0.085, 0.05, 0.035], porcelain, 16);
  petal.rotation.z = a;
}
sphereAt([0.02, 3.72, 0.425], [0.055, 0.055, 0.035], gold, 16);

// Studio floor
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(14, 96),
  new THREE.MeshStandardMaterial({ color: 0x242936, roughness: 0.88, metalness: 0.02 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.005;
floor.receiveShadow = true;
scene.add(floor);

// Soft halo behind the sculpture
const backdrop = new THREE.Mesh(
  new THREE.CircleGeometry(5.5, 96),
  new THREE.MeshBasicMaterial({
    color: 0x303746,
    transparent: true,
    opacity: 0.38,
    depthWrite: false
  })
);
backdrop.position.set(0, 4.0, -5.1);
scene.add(backdrop);

const hemi = new THREE.HemisphereLight(0xdde8ff, 0x4a382b, 1.45);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff3dc, 4.0);
key.position.set(5, 9, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 9;
key.shadow.camera.bottom = -2;
key.shadow.camera.near = 1;
key.shadow.camera.far = 24;
key.shadow.bias = -0.00025;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9ebcff, 1.7);
fill.position.set(-6, 5, 3);
scene.add(fill);

const rim = new THREE.SpotLight(0xffd6a2, 3.6, 18, Math.PI / 5, 0.55, 1.2);
rim.position.set(3, 7, -6);
rim.target.position.set(0, 4, 0);
scene.add(rim, rim.target);

const frontGlow = new THREE.PointLight(0xffe9ce, 1.1, 12, 2);
frontGlow.position.set(0, 4.5, 5);
scene.add(frontGlow);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
