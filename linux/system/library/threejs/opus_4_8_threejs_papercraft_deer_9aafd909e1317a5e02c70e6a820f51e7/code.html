<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papercraft Deer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17171b; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    font: 12px/1.4 -apple-system, Segoe UI, Roboto, sans-serif;
    color: rgba(235,225,210,0.35); letter-spacing: 0.06em; pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<div id="hint">folded cardstock deer · drag to orbit</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------- renderer ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* ---------- scene / camera ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17171b);
scene.fog = new THREE.Fog(0x17171b, 7.5, 17);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(2.9, 1.75, 3.25);

/* ---------- lighting: hemi + key + fill + rim ---------- */
const hemi = new THREE.HemisphereLight(0xc9d9ec, 0x2a241d, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2df, 1.25);
key.position.set(3.4, 5.2, 2.6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 20;
key.shadow.camera.left = -3.5;
key.shadow.camera.right = 3.5;
key.shadow.camera.top = 3.5;
key.shadow.camera.bottom = -3.5;
key.shadow.bias = -0.0004;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9db6d8, 0.4);
fill.position.set(-3.2, 2.0, 1.4);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd8ac, 0.7);
rim.position.set(-2.4, 3.0, -3.6);
scene.add(rim);

/* ---------- ground: receives shadow only ---------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ---------- papercraft materials (matte pastel, flat faceted) ---------- */
function paper(color, rough = 0.96) {
  return new THREE.MeshStandardMaterial({
    color, roughness: rough, metalness: 0.0,
    flatShading: true, side: THREE.DoubleSide
  });
}
const bodyMat   = paper(0xe8cba1);
const bellyMat  = paper(0xf3e7d0);
const antlerMat = paper(0xdecda4);
const earMat    = paper(0xe8b4a4);
const hoofMat   = paper(0x463829, 0.8);
const darkMat   = paper(0x241c15, 0.7);
const tailMat   = paper(0xf4ead6);

/* fold-crease lines that trace every panel edge */
const creaseMat = new THREE.LineBasicMaterial({
  color: 0x6f5540, transparent: true, opacity: 0.28
});

/* ---------- deer assembly ---------- */
const deer = new THREE.Group();
scene.add(deer);

function addSolid(geo, mat, opts = {}) {
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  if (opts.pos)   mesh.position.set(opts.pos[0], opts.pos[1], opts.pos[2]);
  if (opts.rot)   mesh.rotation.set(opts.rot[0], opts.rot[1], opts.rot[2]);
  if (opts.scale) mesh.scale.set(opts.scale[0], opts.scale[1], opts.scale[2]);
  if (opts.edges !== false) {
    mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 1), creaseMat));
  }
  (opts.parent || deer).add(mesh);
  return mesh;
}

/* tapered faceted prism between two points — legs, neck, antler tines */
const UP = new THREE.Vector3(0, 1, 0);
function addLimb(a, b, rTop, rBottom, seg, mat, parent) {
  const start = new THREE.Vector3(a[0], a[1], a[2]);
  const end   = new THREE.Vector3(b[0], b[1], b[2]);
  const dir   = new THREE.Vector3().subVectors(end, start);
  const len   = dir.length();
  const geo   = new THREE.CylinderGeometry(rTop, rBottom, len, seg);
  const mesh  = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(UP, dir.normalize());
  mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 1), creaseMat));
  (parent || deer).add(mesh);
  return mesh;
}

const ICO = (r) => new THREE.IcosahedronGeometry(r, 0);

/* --- torso: overlapping faceted masses --- */
addSolid(ICO(0.42), bodyMat,  { pos: [0.00, 1.00, 0], scale: [1.35, 0.95, 0.92] });
addSolid(ICO(0.30), bodyMat,  { pos: [0.32, 1.03, 0], scale: [1.10, 1.00, 0.95] });
addSolid(ICO(0.33), bodyMat,  { pos: [-0.34, 1.00, 0], scale: [1.15, 1.05, 1.00] });
addSolid(ICO(0.20), bellyMat, { pos: [0.50, 0.82, 0], scale: [1.10, 1.30, 0.90] });

/* --- neck --- */
addLimb([0.50, 1.08, 0], [0.75, 1.50, 0], 0.11, 0.17, 6, bodyMat);

/* --- head + muzzle + face --- */
addSolid(ICO(0.19), bodyMat, { pos: [0.86, 1.56, 0], rot: [0, 0, -0.2], scale: [1.55, 0.95, 0.82] });
addLimb([0.95, 1.50, 0], [1.09, 1.44, 0], 0.05, 0.085, 5, bodyMat);
addSolid(ICO(0.036), darkMat, { pos: [1.10, 1.44, 0], edges: false });
addSolid(ICO(0.03), darkMat, { pos: [0.93, 1.615, 0.10], edges: false });
addSolid(ICO(0.03), darkMat, { pos: [0.93, 1.615, -0.10], edges: false });

/* --- ears --- */
function makeEar(side) {
  const g = new THREE.Group();
  addSolid(new THREE.ConeGeometry(0.09, 0.28, 4), bodyMat, { parent: g, scale: [1, 1, 0.4] });
  addSolid(new THREE.ConeGeometry(0.06, 0.20, 4), earMat,  { parent: g, pos: [0.02, 0.0, 0.0], scale: [1, 1, 0.4], edges: false });
  g.position.set(0.68, 1.68, 0.13 * side);
  g.rotation.set(0.55 * side, 0, -0.1);
  deer.add(g);
}
makeEar(1); makeEar(-1);

/* --- antlers --- */
function makeAntler(s) {
  addLimb([0.74, 1.74, 0.07 * s], [0.60, 2.12, 0.15 * s], 0.012, 0.032, 4, antlerMat);
  addLimb([0.72, 1.90, 0.10 * s], [0.88, 2.02, 0.12 * s], 0.010, 0.022, 4, antlerMat);
  addLimb([0.66, 2.00, 0.12 * s], [0.78, 2.20, 0.14 * s], 0.010, 0.020, 4, antlerMat);
  addLimb([0.76, 1.80, 0.09 * s], [0.93, 1.80, 0.10 * s], 0.010, 0.022, 4, antlerMat);
}
makeAntler(1); makeAntler(-1);

/* --- tail --- */
addSolid(new THREE.ConeGeometry(0.06, 0.20, 5), tailMat, { pos: [-0.66, 1.12, 0], rot: [0, 0, 2.0] });

/* --- legs --- */
function makeLeg(side) {
  const z = 0.19 * side;
  // front leg
  addLimb([0.34, 0.86, z * 0.95], [0.36, 0.46, z], 0.062, 0.095, 5, bodyMat);
  addLimb([0.36, 0.46, z], [0.36, 0.02, z], 0.045, 0.060, 5, bodyMat);
  addSolid(new THREE.CylinderGeometry(0.055, 0.05, 0.07, 5), hoofMat, { pos: [0.36, 0.035, z] });
  // hind leg (bent hock)
  addLimb([-0.36, 0.90, z * 0.95], [-0.48, 0.50, z], 0.060, 0.120, 5, bodyMat);
  addLimb([-0.48, 0.50, z], [-0.40, 0.16, z], 0.045, 0.075, 5, bodyMat);
  addLimb([-0.40, 0.16, z], [-0.40, 0.02, z], 0.045, 0.050, 5, bodyMat);
  addSolid(new THREE.CylinderGeometry(0.055, 0.05, 0.07, 5), hoofMat, { pos: [-0.40, 0.035, z] });
}
makeLeg(1); makeLeg(-1);

/* ---------- center the single object horizontally, feet on ground ---------- */
const bbox = new THREE.Box3().setFromObject(deer);
const center = bbox.getCenter(new THREE.Vector3());
deer.position.x -= center.x;
deer.position.z -= center.z;

/* ---------- controls ---------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.minDistance = 2.2;
controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, center.y, 0);
controls.update();

/* ---------- resize ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

/* ---------- render loop ---------- */
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
