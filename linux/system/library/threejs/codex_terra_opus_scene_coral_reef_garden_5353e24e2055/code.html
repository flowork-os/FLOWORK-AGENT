<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coral Reef Garden</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#04233c}
  canvas{display:block}
  #title{position:fixed;left:20px;top:16px;color:#d9f8ff;font:600 13px/1.2 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;pointer-events:none;text-shadow:0 2px 8px #012}
</style>
</head>
<body>
<div id="title">Coral Reef Garden</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x073b62);
scene.fog = new THREE.FogExp2(0x075071, 0.032);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 150);
camera.position.set(15, 10, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.28;
controls.minDistance = 9;
controls.maxDistance = 34;
controls.maxPolarAngle = Math.PI * 0.49;

let seed = 88421;
const rand = () => {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
};
const range = (a, b) => a + (b - a) * rand();
const choose = a => a[(rand() * a.length) | 0];
const damp = (a, b, t) => a + (b - a) * t;

const clock = new THREE.Clock();
const animated = [];
const bubbles = [];
const fishSchools = [];
const kelps = [];
const anemones = [];
const turtleParts = [];

const root = new THREE.Group();
scene.add(root);

const hemi = new THREE.HemisphereLight(0x9beaff, 0x06344b, 2.2);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xb9f3ff, 4.1);
sun.position.set(-8, 18, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -20;
sun.shadow.camera.right = 20;
sun.shadow.camera.top = 20;
sun.shadow.camera.bottom = -20;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 48;
sun.shadow.bias = -0.00035;
scene.add(sun);

const fill = new THREE.PointLight(0x157dff, 2.4, 24, 2);
fill.position.set(8, 6, -4);
scene.add(fill);

const warm = new THREE.PointLight(0xff6d8e, 1.2, 11, 2);
warm.position.set(-2, 3, 1);
scene.add(warm);

function canvasTexture(draw, size = 256) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const x = c.getContext("2d");
  draw(x, size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

const sandMap = canvasTexture((x, s) => {
  x.fillStyle = "#cda96c";
  x.fillRect(0, 0, s, s);
  for (let i = 0; i < 14000; i++) {
    const a = range(0.025, 0.16);
    const g = range(150, 225) | 0;
    x.fillStyle = `rgba(${g},${Math.max(90,g-35)},${Math.max(50,g-90)},${a})`;
    x.fillRect(rand() * s, rand() * s, range(.3, 1.6), range(.3, 1.6));
  }
  for (let i = 0; i < 220; i++) {
    x.strokeStyle = "rgba(255,244,196,.12)";
    x.lineWidth = range(.4, 1.2);
    x.beginPath();
    x.arc(rand()*s, rand()*s, range(6,28), 0, Math.PI*2);
    x.stroke();
  }
}, 512);
sandMap.repeat.set(6, 6);

const coralMap = canvasTexture((x, s) => {
  x.fillStyle = "#ffffff";
  for (let i = 0; i < 2200; i++) {
    const v = (range(205, 255)) | 0;
    x.fillStyle = `rgb(${v},${v},${v})`;
    x.beginPath();
    x.arc(rand()*s, rand()*s, range(.3,2.2), 0, Math.PI*2);
    x.fill();
  }
});

const sand = new THREE.Mesh(
  new THREE.PlaneGeometry(70, 70, 120, 120),
  new THREE.MeshStandardMaterial({ color: 0xd9b575, map: sandMap, roughness: 1, metalness: 0 })
);
sand.rotation.x = -Math.PI / 2;
sand.receiveShadow = true;
root.add(sand);

const floor = sand.geometry;
const pos = floor.attributes.position;
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i), y = pos.getY(i);
  pos.setZ(i, Math.sin(x * .36) * .1 + Math.cos(y * .26) * .09 + Math.sin((x+y)*.62)*.035);
}
floor.computeVertexNormals();

const backdrop = new THREE.Mesh(
  new THREE.SphereGeometry(54, 48, 28),
  new THREE.MeshBasicMaterial({ color: 0x0b567d, side: THREE.BackSide, transparent: true, opacity: 0.72 })
);
backdrop.position.y = 20;
root.add(backdrop);

function material(color, roughness = .72, metalness = 0) {
  return new THREE.MeshStandardMaterial({ color, roughness, metalness, map: coralMap, bumpMap: coralMap, bumpScale: .035 });
}

const rockMat = material(0x795e68, .92);
const stoneMats = [material(0x886b67), material(0x6e6570), material(0x967564)];

function rock(x, z, scale = 1, color = null) {
  const g = new THREE.IcosahedronGeometry(1, 2);
  const m = new THREE.Mesh(g, color ? material(color) : choose(stoneMats));
  m.position.set(x, scale * .48, z);
  m.scale.set(scale * range(.8, 1.35), scale * range(.45, .85), scale * range(.75, 1.15));
  m.rotation.set(rand()*2, rand()*2, rand()*2);
  m.castShadow = true;
  m.receiveShadow = true;
  root.add(m);
  return m;
}

for (let i = 0; i < 36; i++) {
  const a = rand() * Math.PI * 2;
  const r = range(6, 19);
  rock(Math.cos(a)*r, Math.sin(a)*r, range(.18, .75));
}

function tubeBetween(a, b, radius, mat, radial = 7) {
  const d = new THREE.Vector3().subVectors(b, a);
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius*.84, radius, d.length(), radial, 1, false), mat);
  mesh.position.copy(a).add(b).multiplyScalar(.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  root.add(mesh);
  return mesh;
}

function staghorn(x, z, size, color) {
  const base = new THREE.Vector3(x, .15, z);
  const mat = material(color, .62);
  const nodes = [base];
  const tips = [];
  const trunkTop = base.clone().add(new THREE.Vector3(range(-.2,.2), size*1.25, range(-.2,.2)));
  tubeBetween(base, trunkTop, size*.17, mat, 8);
  nodes.push(trunkTop);
  for (let level = 0; level < 2; level++) {
    const current = nodes.slice(level ? 1 : 0);
    for (const n of current) {
      const branches = level ? 2 : 4;
      for (let j = 0; j < branches; j++) {
        const dir = new THREE.Vector3(range(-1,1), range(.55,1.2), range(-1,1)).normalize();
        const len = size * (level ? range(.35,.62) : range(.48,.78));
        const end = n.clone().addScaledVector(dir, len);
        tubeBetween(n, end, size * (level ? .075 : .11), mat, 7);
        if (level === 0) nodes.push(end); else tips.push(end);
      }
    }
  }
  for (const tip of tips) {
    const cap = new THREE.Mesh(new THREE.SphereGeometry(size*.11, 9, 7), mat);
    cap.position.copy(tip);
    cap.castShadow = true;
    root.add(cap);
  }
  const mound = new THREE.Mesh(new THREE.SphereGeometry(size*.5, 16, 8), mat);
  mound.position.copy(base).add(new THREE.Vector3(0, size*.18, 0));
  mound.scale.y = .5;
  mound.castShadow = true;
  root.add(mound);
}

function brainCoral(x, z, size, color) {
  const group = new THREE.Group();
  group.position.set(x, .18, z);
  root.add(group);
  const geo = new THREE.SphereGeometry(size, 36, 21);
  const a = geo.attributes.position;
  for (let i = 0; i < a.count; i++) {
    const p = new THREE.Vector3(a.getX(i), a.getY(i), a.getZ(i));
    const phi = Math.atan2(p.z, p.x);
    const theta = Math.acos(THREE.MathUtils.clamp(p.y / size, -1, 1));
    const groove = Math.sin(phi * 7 + theta * 15 + Math.sin(phi*3)*2) * .07;
    p.multiplyScalar(1 + groove);
    a.setXYZ(i, p.x, p.y * .68, p.z);
  }
  geo.computeVertexNormals();
  const body = new THREE.Mesh(geo, material(color, .58));
  body.castShadow = true;
  body.receiveShadow = true;
  group.add(body);
  const lineMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(color).offsetHSL(0, .08, -.18), roughness: .65 });
  for (let j = 0; j < 12; j++) {
    const curve = new THREE.CatmullRomCurve3([]);
    const phase = j / 12 * Math.PI * 2;
    for (let i = 0; i < 24; i++) {
      const u = i / 23;
      const r = size * (.12 + u*.78);
      const ang = phase + Math.sin(u*Math.PI*5 + phase*2)*.18;
      curve.points.push(new THREE.Vector3(Math.cos(ang)*r, size*.68*Math.sqrt(Math.max(0,1-(r/size)**2))+.025, Math.sin(ang)*r));
    }
    const line = new THREE.Mesh(new THREE.TubeGeometry(curve, 28, size*.018, 5, false), lineMat);
    group.add(line);
  }
}

function seaFan(x, z, size, color) {
  const group = new THREE.Group();
  group.position.set(x, .15, z);
  group.rotation.y = range(0, Math.PI);
  root.add(group);
  const mat = new THREE.MeshStandardMaterial({ color, roughness:.58, side:THREE.DoubleSide, transparent:true, opacity:.86 });
  const stalk = new THREE.Mesh(new THREE.CylinderGeometry(size*.035,size*.07,size*.42,6), mat);
  stalk.position.y = size*.21;
  stalk.castShadow = true;
  group.add(stalk);
  for (let j = 0; j < 13; j++) {
    const curve = new THREE.CatmullRomCurve3();
    const angle = THREE.MathUtils.lerp(-1.22, 1.22, j/12);
    curve.points.push(new THREE.Vector3(0,size*.35,0));
    curve.points.push(new THREE.Vector3(Math.sin(angle)*size*.16,size*.62,0));
    curve.points.push(new THREE.Vector3(Math.sin(angle)*size*.34,size*.95,Math.sin(j)*.04));
    curve.points.push(new THREE.Vector3(Math.sin(angle)*size*.56,size*1.25,Math.sin(j)*.07));
    group.add(new THREE.Mesh(new THREE.TubeGeometry(curve,16,size*.021,5,false),mat));
  }
  for (let j = 0; j < 10; j++) {
    const y = size*(.52+j*.075);
    const width = size*(.19 + j*.026);
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-width,y,0),new THREE.Vector3(0,y+size*.035,0),new THREE.Vector3(width,y,0)
    ]);
    group.add(new THREE.Mesh(new THREE.TubeGeometry(curve,12,size*.014,4,false),mat));
  }
  animated.push({ object:group, type:"fan", phase:rand()*6.28 });
}

function kelp(x, z, height) {
  const group = new THREE.Group();
  group.position.set(x, .08, z);
  root.add(group);
  const stemMat = material(0x336f54,.75);
  const leafMat = new THREE.MeshStandardMaterial({color:0x4f9a62,roughness:.65,side:THREE.DoubleSide});
  const points = [];
  for (let i=0;i<7;i++) points.push(new THREE.Vector3(Math.sin(i*.8)*.13,i*height/6,Math.cos(i*.9)*.1));
  const curve = new THREE.CatmullRomCurve3(points);
  group.add(new THREE.Mesh(new THREE.TubeGeometry(curve,34,.055,6,false),stemMat));
  for (let i=1;i<6;i++) {
    for (const side of [-1,1]) {
      const leaf = new THREE.Mesh(new THREE.PlaneGeometry(.42, .9, 1, 4),leafMat);
      leaf.position.copy(points[i]);
      leaf.position.x += side*.16;
      leaf.position.y += .12;
      leaf.rotation.set(0, side*.35, side*.55);
      const p = leaf.geometry.attributes.position;
      for(let k=0;k<p.count;k++) p.setX(k,p.getX(k)+Math.sin(p.getY(k)*7)*.08);
      leaf.geometry.computeVertexNormals();
      group.add(leaf);
    }
  }
  kelps.push({group, phase:rand()*6.28, baseX:x});
}

function anemone(x, z, scale, color) {
  const group = new THREE.Group();
  group.position.set(x,.13,z);
  root.add(group);
  const baseMat = material(new THREE.Color(color).offsetHSL(0,-.05,-.18),.7);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(scale*.52,scale*.68,scale*.42,16),baseMat);
  base.position.y=scale*.21;
  base.castShadow=true;
  group.add(base);
  const tentacleMat = new THREE.MeshStandardMaterial({color,roughness:.45,emissive:new THREE.Color(color).multiplyScalar(.08)});
  const tentacles=[];
  for(let i=0;i<25;i++){
    const a=i/25*Math.PI*2+rand()*.2, r=Math.sqrt(rand())*scale*.47;
    const curve=new THREE.CatmullRomCurve3([
      new THREE.Vector3(Math.cos(a)*r,scale*.36,Math.sin(a)*r),
      new THREE.Vector3(Math.cos(a)*r*1.1,scale*.72,Math.sin(a)*r*1.1),
      new THREE.Vector3(Math.cos(a)*r*1.25+range(-.16,.16),scale*1.12,Math.sin(a)*r*1.25+range(-.16,.16)),
      new THREE.Vector3(Math.cos(a)*r*1.28+range(-.24,.24),scale*1.45,Math.sin(a)*r*1.28+range(-.24,.24))
    ]);
    const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,16,scale*.036,6,false),tentacleMat);
    group.add(mesh);
    tentacles.push({mesh, phase:rand()*6.28, curve});
  }
  anemones.push({group,tentacles,phase:rand()*6.28,scale});
}

function starfish(x,z,scale,color=0xf06a5d) {
  const shape=new THREE.Shape();
  for(let i=0;i<10;i++){
    const a=-Math.PI/2+i*Math.PI/5;
    const r=i%2===0?scale:scale*.42;
    const px=Math.cos(a)*r, py=Math.sin(a)*r;
    i?shape.lineTo(px,py):shape.moveTo(px,py);
  }
  shape.closePath();
  const geo=new THREE.ExtrudeGeometry(shape,{depth:scale*.15,bevelEnabled:true,bevelSize:scale*.07,bevelThickness:scale*.05,bevelSegments:2});
  const mesh=new THREE.Mesh(geo,material(color,.65));
  mesh.rotation.set(Math.PI/2,0,rand()*6.28);
  mesh.position.set(x,.12,z);
  mesh.castShadow=true;
  root.add(mesh);
}

function clownfish(x,y,z,scale,phase=0) {
  const group=new THREE.Group();
  group.position.set(x,y,z);
  root.add(group);
  const orange=new THREE.MeshStandardMaterial({color:0xff6d22,roughness:.45,emissive:0x270800});
  const white=new THREE.MeshStandardMaterial({color:0xfff3cc,roughness:.38});
  const black=new THREE.MeshStandardMaterial({color:0x161116,roughness:.42});
  const body=new THREE.Mesh(new THREE.SphereGeometry(scale,18,12),orange);
  body.scale.set(1.45,.8,.66);
  group.add(body);
  for(const xx of [-.35,.08]) {
    const band=new THREE.Mesh(new THREE.TorusGeometry(scale*.67,scale*.11,7,14,Math.PI),white);
    band.position.x=xx*scale*2;
    band.rotation.y=Math.PI/2;
    band.scale.z=.8;
    group.add(band);
  }
  const tail=new THREE.Mesh(new THREE.ConeGeometry(scale*.48,scale*.82,4),orange);
  tail.position.x=-scale*1.55;
  tail.rotation.z=-Math.PI/2;
  group.add(tail);
  const fin=new THREE.Mesh(new THREE.ConeGeometry(scale*.28,scale*.55,4),black);
  fin.position.set(0,scale*.72,0);
  group.add(fin);
  const eye=new THREE.Mesh(new THREE.SphereGeometry(scale*.1,8,6),black);
  eye.position.set(scale*1.12,scale*.24,scale*.48);
  group.add(eye);
  animated.push({object:group,type:"clown",phase,base:new THREE.Vector3(x,y,z)});
}

function smallFishSchool(cx,cy,cz,count,color) {
  const group=new THREE.Group();
  group.position.set(cx,cy,cz);
  root.add(group);
  const mat=new THREE.MeshStandardMaterial({color,roughness:.4,emissive:new THREE.Color(color).multiplyScalar(.12)});
  for(let i=0;i<count;i++){
    const f=new THREE.Group();
    const body=new THREE.Mesh(new THREE.SphereGeometry(.13,10,7),mat);
    body.scale.set(1.7,.65,.55);
    f.add(body);
    const tail=new THREE.Mesh(new THREE.ConeGeometry(.1,.25,3),mat);
    tail.position.x=-.22;tail.rotation.z=-Math.PI/2;f.add(tail);
    f.position.set(range(-2.2,2.2),range(-1.1,1.1),range(-1.5,1.5));
    f.rotation.y=range(-.5,.5);
    group.add(f);
  }
  fishSchools.push({group,phase:rand()*6.28,base:new THREE.Vector3(cx,cy,cz)});
}

function turtle(x,y,z) {
  const group=new THREE.Group();
  group.position.set(x,y,z);
  group.rotation.y=-.58;
  root.add(group);
  const shellMat=material(0x547e45,.54);
  const skinMat=new THREE.MeshStandardMaterial({color:0x80a05d,roughness:.65});
  const shell=new THREE.Mesh(new THREE.SphereGeometry(1.12,24,16),shellMat);
  shell.scale.set(1.25,.55,.9);
  shell.castShadow=true;
  group.add(shell);
  const plastron=new THREE.Mesh(new THREE.SphereGeometry(1.02,20,12),new THREE.MeshStandardMaterial({color:0xc0ab69,roughness:.8}));
  plastron.position.y=-.18;plastron.scale.set(1.2,.35,.82);group.add(plastron);
  for(let i=0;i<12;i++){
    const plate=new THREE.Mesh(new THREE.CircleGeometry(.25,6),new THREE.MeshStandardMaterial({color:0x76954d,side:THREE.DoubleSide}));
    const a=i/12*Math.PI*2, r=i<6?.42:.7;
    plate.position.set(Math.cos(a)*r,.56,Math.sin(a)*r*.7);
    plate.rotation.x=-Math.PI/2;
    group.add(plate);
  }
  const head=new THREE.Mesh(new THREE.SphereGeometry(.38,14,10),skinMat);
  head.position.set(1.32,.04,0);head.scale.set(1.15,.8,.8);group.add(head);
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(.22,.28,.55,10),skinMat);
  neck.position.set(.98,.02,0);neck.rotation.z=Math.PI/2;group.add(neck);
  const fins=[];
  for(const [px,pz] of [[.45,.72],[.45,-.72],[-.62,.62],[-.62,-.62]]){
    const fin=new THREE.Mesh(new THREE.SphereGeometry(.52,12,8),skinMat);
    fin.position.set(px,-.1,pz);fin.scale.set(1.25,.12,.65);
    fin.rotation.y=pz>0?.35:-.35;
    group.add(fin);fins.push(fin);
  }
  const tail=new THREE.Mesh(new THREE.ConeGeometry(.18,.55,5),skinMat);
  tail.position.set(-1.35,0,0);tail.rotation.z=-Math.PI/2;group.add(tail);
  turtleParts.push({group,fins,base:new THREE.Vector3(x,y,z),phase:rand()*6.28});
}

function anchor(x,z) {
  const group=new THREE.Group();
  group.position.set(x,.13,z);
  group.rotation.y=.45;
  root.add(group);
  const mat=new THREE.MeshStandardMaterial({color:0x52636a,roughness:.82,metalness:.58});
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(.12,.15,2.4,10),mat);
  shaft.position.y=1.05;shaft.rotation.z=-.16;shaft.castShadow=true;group.add(shaft);
  const cross=new THREE.Mesh(new THREE.CylinderGeometry(.075,.075,1.45,8),mat);
  cross.position.set(.12,1.82,0);cross.rotation.z=Math.PI/2-.16;group.add(cross);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.3,.07,8,16),mat);
  ring.position.set(.3,2.22,0);ring.rotation.y=Math.PI/2;group.add(ring);
  for(const side of [-1,1]){
    const arm=new THREE.Mesh(new THREE.TorusGeometry(.62,.1,8,16,Math.PI*.78),mat);
    arm.position.set(side*.43,.3,0);
    arm.rotation.set(0,side>0?0:Math.PI,side*Math.PI*.18);
    group.add(arm);
    const fluke=new THREE.Mesh(new THREE.ConeGeometry(.24,.5,4),mat);
    fluke.position.set(side*1.0,.36,0);
    fluke.rotation.z=side*Math.PI/2;
    group.add(fluke);
  }
  const chainMat=new THREE.MeshStandardMaterial({color:0x43545b,roughness:.8,metalness:.7});
  for(let i=0;i<12;i++){
    const link=new THREE.Mesh(new THREE.TorusGeometry(.13,.035,6,10),chainMat);
    link.position.set(.42+i*.22,.24+Math.sin(i*.7)*.08,.18+Math.sin(i*.55)*.2);
    link.rotation.set(i%2?Math.PI/2:0,0,0);
    group.add(link);
  }
}

function bubblesAt(x,z,count,height) {
  const mat=new THREE.MeshPhysicalMaterial({color:0xb9f4ff,roughness:.05,metalness:0,transparent:true,opacity:.5,transmission:.25});
  for(let i=0;i<count;i++){
    const mesh=new THREE.Mesh(new THREE.SphereGeometry(range(.035,.11),8,6),mat);
    mesh.position.set(x+range(-.2,.2),range(.2,height),z+range(-.2,.2));
    root.add(mesh);
    bubbles.push({mesh,x,z,offset:rand()*height,speed:range(.32,.68),height});
  }
}

function lightRay(x,z,scale) {
  const g=new THREE.CylinderGeometry(scale*.12,scale*1.25,18,30,1,true);
  const m=new THREE.MeshBasicMaterial({color:0x8cecff,transparent:true,opacity:.055,side:THREE.DoubleSide,depthWrite:false});
  const ray=new THREE.Mesh(g,m);
  ray.position.set(x,11,z);
  ray.rotation.z=range(-.17,.17);
  root.add(ray);
  animated.push({object:ray,type:"ray",phase:rand()*6.28});
}

staghorn(-3.6,1.2,2.1,0xff698b);
staghorn(3.7,.2,1.85,0xff8a3d);

for(let i=0;i<80;i++){
  const shell=new THREE.Mesh(new THREE.SphereGeometry(range(.035,.1),7,5),new THREE.MeshStandardMaterial({color:choose([0xf4dcc4,0xf7aa92,0xd8b287]),roughness:.8}));
  const a=rand()*Math.PI*2,r=range(2,16);
  shell.position.set(Math.cos(a)*r,.075,Math.sin(a)*r);
  shell.scale.y=.38;
  shell.rotation.y=rand()*6.28;
  root.add(shell);
}

function animate() {
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();

  for(const item of animated){
    if(item.type==="fan"){
      item.object.rotation.z=Math.sin(t*.8+item.phase)*.11;
      item.object.rotation.x=Math.cos(t*.65+item.phase)*.04;
    } else if(item.type==="clown"){
      item.object.position.y=item.base.y+Math.sin(t*1.8+item.phase)*.13;
      item.object.position.x=item.base.x+Math.cos(t*.75+item.phase)*.28;
      item.object.rotation.y=Math.sin(t*1.4+item.phase)*.22;
    } else if(item.type==="ray"){
      item.object.material.opacity=.042+Math.sin(t*.8+item.phase)*.018;
      item.object.rotation.z=Math.sin(t*.35+item.phase)*.12;
    }
  }

  for(const k of kelps){
    k.group.rotation.z=Math.sin(t*.72+k.phase)*.09;
    k.group.rotation.x=Math.cos(t*.55+k.phase)*.035;
  }

  for(const a of anemones){
    a.group.rotation.z=Math.sin(t*1.25+a.phase)*.08;
    a.group.scale.y=1+Math.sin(t*1.6+a.phase)*.035;
  }

  for(const school of fishSchools){
    school.group.position.x=school.base.x+Math.sin(t*.32+school.phase)*1.4;
    school.group.position.y=school.base.y+Math.sin(t*.48+school.phase)*.35;
    school.group.rotation.y=Math.sin(t*.32+school.phase)*.22;
    for(let i=0;i<school.group.children.length;i++){
      const f=school.group.children[i];
      f.rotation.z=Math.sin(t*4+i*.67+school.phase)*.14;
    }
  }

  for(const b of bubbles){
    const rise=(t*b.speed+b.offset)%b.height;
    b.mesh.position.y=.16+rise;
    b.mesh.position.x=b.x+Math.sin(t*1.5+b.offset)*.14;
    b.mesh.position.z=b.z+Math.cos(t*1.2+b.offset)*.12;
    const s=.65+Math.sin(t*2+b.offset)*.12;
    b.mesh.scale.setScalar(s);
  }

  for(const tt of turtleParts){
    tt.group.position.x=tt.base.x+Math.sin(t*.27+tt.phase)*1.05;
    tt.group.position.y=tt.base.y+Math.sin(t*.6+tt.phase)*.3;
    tt.group.rotation.z=Math.sin(t*.6+tt.phase)*.07;
    tt.fins.forEach((fin,i)=>fin.rotation.z=Math.sin(t*1.5+tt.phase+i)*.42);
  }

  controls.update();
  renderer.render(scene,camera);
}

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

animate();
</script>
