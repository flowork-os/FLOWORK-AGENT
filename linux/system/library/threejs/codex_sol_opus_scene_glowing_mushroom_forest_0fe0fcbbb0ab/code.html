<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glowing Mushroom Forest</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #02040c;
    }

    canvas {
      display: block;
    }

    .title {
      position: fixed;
      top: 24px;
      left: 28px;
      z-index: 2;
      color: rgba(211, 255, 249, 0.82);
      font: 500 12px/1.45 Georgia, serif;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 0 18px rgba(80, 255, 224, 0.55);
    }

    .title span {
      display: block;
      margin-top: 5px;
      color: rgba(180, 188, 224, 0.45);
      font-size: 9px;
      letter-spacing: 0.18em;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 48%, transparent 42%, rgba(0, 2, 8, 0.32) 75%, rgba(0, 1, 5, 0.72) 100%),
        linear-gradient(to bottom, rgba(1, 4, 14, 0.08), rgba(0, 2, 7, 0.28));
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="title">
    Mycelium Nocturne
    <span>A bioluminescent forest</span>
  </div>
  <div class="vignette"></div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020611);
    scene.fog = new THREE.FogExp2(0x07101a, 0.018);

    const camera = new THREE.PerspectiveCamera(
      48,
      window.innerWidth / window.innerHeight,
      0.1,
      180
    );
    camera.position.set(24, 13, 31);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 5.3, -2);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.22;
    controls.minDistance = 17;
    controls.maxDistance = 58;
    controls.maxPolarAngle = Math.PI * 0.48;

    class SeededRandom {
      constructor(seed = 8347291) {
        this.state = seed >>> 0;
      }

      next() {
        this.state += 0x6D2B79F5;
        let t = this.state;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }

      range(min, max) {
        return min + (max - min) * this.next();
      }

      int(min, max) {
        return Math.floor(this.range(min, max + 1));
      }

      pick(array) {
        return array[Math.floor(this.next() * array.length)];
      }

      sign() {
        return this.next() < 0.5 ? -1 : 1;
      }
    }

    const rng = new SeededRandom(20260830);
    const clock = new THREE.Clock();

    const animatedCaps = [];
    const animatedFerns = [];
    const sporeFields = [];
    const fireflies = [];
    const waterRipples = [];

    const palette = {
      teal: {
        cap: 0x138d87,
        glow: 0x3ffff0,
        dark: 0x073c43
      },
      violet: {
        cap: 0x6442ad,
        glow: 0xc37cff,
        dark: 0x26164b
      },
      amber: {
        cap: 0xa46528,
        glow: 0xffc55d,
        dark: 0x523015
      },
      blue: {
        cap: 0x236ba0,
        glow: 0x70cfff,
        dark: 0x102f52
      }
    };

    function createRadialTexture(
      inner,
      middle,
      outer,
      size = 256,
      speckles = 0
    ) {
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const context = canvas.getContext("2d");
      const center = size * 0.5;
      const gradient = context.createRadialGradient(
        center,
        center,
        0,
        center,
        center,
        center
      );
      gradient.addColorStop(0, inner);
      gradient.addColorStop(0.38, middle);
      gradient.addColorStop(1, outer);
      context.fillStyle = gradient;
      context.fillRect(0, 0, size, size);

      for (let i = 0; i < speckles; i++) {
        const angle = rng.range(0, Math.PI * 2);
        const radius = Math.sqrt(rng.next()) * center * 0.88;
        const x = center + Math.cos(angle) * radius;
        const y = center + Math.sin(angle) * radius;
        const dot = rng.range(1, 4);
        context.beginPath();
        context.arc(x, y, dot, 0, Math.PI * 2);
        context.fillStyle = `rgba(220,255,245,${rng.range(0.08, 0.3)})`;
        context.fill();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    function createGroundTexture() {
      const size = 512;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const context = canvas.getContext("2d");
      context.fillStyle = "#0a1514";
      context.fillRect(0, 0, size, size);

      for (let i = 0; i < 11000; i++) {
        const x = rng.range(0, size);
        const y = rng.range(0, size);
        const green = rng.int(18, 52);
        const alpha = rng.range(0.08, 0.35);
        context.fillStyle = `rgba(${rng.int(5, 22)},${green},${rng.int(20, 38)},${alpha})`;
        context.fillRect(x, y, rng.range(0.6, 2.8), rng.range(0.6, 2.8));
      }

      for (let i = 0; i < 110; i++) {
        const x = rng.range(0, size);
        const y = rng.range(0, size);
        const radius = rng.range(5, 24);
        const gradient = context.createRadialGradient(
          x,
          y,
          0,
          x,
          y,
          radius
        );
        gradient.addColorStop(0, "rgba(28,77,55,0.35)");
        gradient.addColorStop(1, "rgba(5,19,18,0)");
        context.fillStyle = gradient;
        context.fillRect(
          x - radius,
          y - radius,
          radius * 2,
          radius * 2
        );
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(9, 9);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    function createSporeTexture() {
      const size = 128;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const context = canvas.getContext("2d");
      const gradient = context.createRadialGradient(
        64,
        64,
        0,
        64,
        64,
        62
      );
      gradient.addColorStop(0, "rgba(255,255,235,1)");
      gradient.addColorStop(0.12, "rgba(160,255,225,0.95)");
      gradient.addColorStop(0.42, "rgba(70,230,205,0.35)");
      gradient.addColorStop(1, "rgba(20,160,150,0)");
      context.fillStyle = gradient;
      context.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(canvas);
    }

    function createBarkTexture() {
      const size = 256;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const context = canvas.getContext("2d");
      context.fillStyle = "#171719";
      context.fillRect(0, 0, size, size);

      for (let i = 0; i < 1500; i++) {
        const x = rng.range(0, size);
        const y = rng.range(0, size);
        const width = rng.range(1, 4);
        const height = rng.range(5, 30);
        const shade = rng.int(16, 46);
        context.fillStyle = `rgba(${shade},${shade + 6},${shade + 2},${rng.range(0.15, 0.45)})`;
        context.fillRect(x, y, width, height);
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(2, 5);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    const groundTexture = createGroundTexture();
    const sporeTexture = createSporeTexture();
    const barkTexture = createBarkTexture();

    const capTextures = {
      teal: createRadialTexture(
        "#b6fff3",
        "#219b91",
        "#071f29",
        256,
        65
      ),
      violet: createRadialTexture(
        "#f1ceff",
        "#764cbb",
        "#18102d",
        256,
        55
      ),
      amber: createRadialTexture(
        "#fff0ae",
        "#b66b2d",
        "#2e1710",
        256,
        75
      ),
      blue: createRadialTexture(
        "#d4f5ff",
        "#367bb1",
        "#0d1a35",
        256,
        45
      )
    };

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(62, 128),
      new THREE.MeshStandardMaterial({
        map: groundTexture,
        color: 0x223b31,
        roughness: 1,
        metalness: 0
      })
    );
    ground.rotation.x = -Math.PI * 0.5;
    ground.receiveShadow = true;
    scene.add(ground);

    const underGround = new THREE.Mesh(
      new THREE.CylinderGeometry(62, 64, 2.5, 96),
      new THREE.MeshStandardMaterial({
        color: 0x07100e,
        roughness: 1
      })
    );
    underGround.position.y = -1.3;
    underGround.receiveShadow = true;
    scene.add(underGround);

    const hemisphere = new THREE.HemisphereLight(
      0x1b3157,
      0x06110c,
      0.72
    );
    scene.add(hemisphere);

    const moonLight = new THREE.DirectionalLight(0x819ddb, 1.2);
    moonLight.position.set(-20, 32, 13);
    moonLight.castShadow = true;
    moonLight.shadow.mapSize.set(2048, 2048);
    moonLight.shadow.camera.left = -35;
    moonLight.shadow.camera.right = 35;
    moonLight.shadow.camera.top = 35;
    moonLight.shadow.camera.bottom = -35;
    moonLight.shadow.camera.near = 1;
    moonLight.shadow.camera.far = 90;
    moonLight.shadow.bias = -0.0004;
    scene.add(moonLight);

    const centralGlow = new THREE.PointLight(
      0x59ffda,
      18,
      30,
      2
    );
    centralGlow.position.set(-2, 5.2, -4);
    scene.add(centralGlow);

    const violetGlow = new THREE.PointLight(
      0xb36cff,
      13,
      24,
      2
    );
    violetGlow.position.set(9, 4.2, -9);
    scene.add(violetGlow);

    const amberGlow = new THREE.PointLight(
      0xffa84d,
      11,
      22,
      2
    );
    amberGlow.position.set(-12, 3.2, 3);
    scene.add(amberGlow);

    function createStemGeometry(height, radius, leanX, leanZ) {
      const points = [];
      const segments = 18;

      for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        points.push(
          new THREE.Vector3(
            leanX * t * t + Math.sin(t * Math.PI) * radius * 0.18,
            height * t,
            leanZ * t * t
          )
        );
      }

      const curve = new THREE.CatmullRomCurve3(points);
      return new THREE.TubeGeometry(
        curve,
        28,
        radius,
        10,
        false
      );
    }

    function addGills(group, radius, height, glowColor) {
      const gillMaterial = new THREE.MeshBasicMaterial({
        color: glowColor,
        transparent: true,
        opacity: 0.42,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const count = 18;

      for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2;
        const shape = new THREE.Shape();
        shape.moveTo(0.2, 0);
        shape.lineTo(radius * 0.88, -height * 0.1);
        shape.lineTo(radius * 0.2, -height * 0.02);
        shape.closePath();

        const geometry = new THREE.ShapeGeometry(shape);
        const gill = new THREE.Mesh(geometry, gillMaterial);
        gill.rotation.x = -Math.PI * 0.5;
        gill.rotation.z = angle;
        gill.position.y = -height * 0.04;
        group.add(gill);
      }
    }

    function createMushroom(options = {}) {
      const {
        position = new THREE.Vector3(),
        height = 8,
        radius = 3,
        colorKey = "teal",
        leanX = 0,
        leanZ = 0,
        capScaleZ = 1,
        light = true,
        phase = rng.range(0, Math.PI * 2)
      } = options;

      const colors = palette[colorKey];
      const mushroom = new THREE.Group();
      mushroom.position.copy(position);

      const stemGeometry = createStemGeometry(
        height,
        radius * 0.17,
        leanX,
        leanZ
      );
      const stemMaterial = new THREE.MeshStandardMaterial({
        color: 0x9aa690,
        roughness: 0.78,
        metalness: 0,
        emissive: colors.dark,
        emissiveIntensity: 0.18
      });
      const stem = new THREE.Mesh(stemGeometry, stemMaterial);
      stem.castShadow = true;
      stem.receiveShadow = true;
      mushroom.add(stem);

      const collar = new THREE.Mesh(
        new THREE.TorusGeometry(
          radius * 0.19,
          radius * 0.055,
          8,
          30
        ),
        new THREE.MeshStandardMaterial({
          color: 0xd4d6bd,
          roughness: 0.82
        })
      );
      collar.rotation.x = Math.PI * 0.5;
      collar.position.set(
        leanX * 0.25,
        height * 0.67,
        leanZ * 0.25
      );
      collar.castShadow = true;
      mushroom.add(collar);

      const capGroup = new THREE.Group();
      capGroup.position.set(leanX, height, leanZ);
      capGroup.scale.z = capScaleZ;

      const capGeometry = new THREE.SphereGeometry(
        radius,
        40,
        22,
        0,
        Math.PI * 2,
        0,
        Math.PI * 0.54
      );
      capGeometry.scale(1, 0.44, 1);

      const capMaterial = new THREE.MeshStandardMaterial({
        map: capTextures[colorKey],
        color: colors.cap,
        roughness: 0.46,
        metalness: 0.05,
        emissiveMap: capTextures[colorKey],
        emissive: colors.glow,
        emissiveIntensity: 1.25,
        side: THREE.DoubleSide
      });

      const cap = new THREE.Mesh(capGeometry, capMaterial);
      cap.castShadow = true;
      cap.receiveShadow = true;
      capGroup.add(cap);

      const underside = new THREE.Mesh(
        new THREE.CylinderGeometry(
          radius * 0.92,
          radius * 0.2,
          radius * 0.25,
          48,
          1,
          true
        ),
        new THREE.MeshStandardMaterial({
          color: colors.glow,
          roughness: 0.68,
          emissive: colors.glow,
          emissiveIntensity: 0.74,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.86
        })
      );
      underside.position.y = -radius * 0.1;
      capGroup.add(underside);

      addGills(capGroup, radius, radius, colors.glow);
      mushroom.add(capGroup);

      if (light && height > 4) {
        const lamp = new THREE.PointLight(
          colors.glow,
          Math.min(10, radius * 2.4),
          radius * 5.8,
          2
        );
        lamp.position.set(
          leanX,
          height - radius * 0.3,
          leanZ
        );
        mushroom.add(lamp);
      }

      animatedCaps.push({
        group: capGroup,
        material: capMaterial,
        baseScale: capGroup.scale.clone(),
        baseIntensity: capMaterial.emissiveIntensity,
        phase,
        speed: rng.range(0.45, 0.8)
      });

      scene.add(mushroom);
      return mushroom;
    }

    const heroMushrooms = [
      {
        position: new THREE.Vector3(-3.5, 0, -5),
        height: 12.8,
        radius: 4.5,
        colorKey: "teal",
        leanX: 0.8,
        leanZ: 0.2,
        capScaleZ: 0.92
      },
      {
        position: new THREE.Vector3(8.2, 0, -10.5),
        height: 10.2,
        radius: 3.7,
        colorKey: "violet",
        leanX: -0.8,
        leanZ: 0.5,
        capScaleZ: 1.1
      },
      {
        position: new THREE.Vector3(-12.5, 0, 2),
        height: 7.8,
        radius: 3.3,
        colorKey: "amber",
        leanX: 0.6,
        leanZ: -0.3,
        capScaleZ: 0.9
      },
      {
        position: new THREE.Vector3(12, 0, 4),
        height: 8.6,
        radius: 3.1,
        colorKey: "blue",
        leanX: -0.4,
        leanZ: -0.7,
        capScaleZ: 1.06
      },
      {
        position: new THREE.Vector3(-17, 0, -13),
        height: 10.5,
        radius: 3.8,
        colorKey: "violet",
        leanX: 1,
        leanZ: 0.2,
        capScaleZ: 0.94
      },
      {
        position: new THREE.Vector3(18, 0, -17),
        height: 13.4,
        radius: 4.2,
        colorKey: "teal",
        leanX: -1.2,
        leanZ: 0.6,
        capScaleZ: 0.96
      }
    ];

    heroMushrooms.forEach(createMushroom);

    function createToadstoolCluster(
      center,
      count,
      colorKey,
      spread = 3
    ) {
      for (let i = 0; i < count; i++) {
        const angle = rng.range(0, Math.PI * 2);
        const distance = Math.sqrt(rng.next()) * spread;
        const height = rng.range(0.75, 2.5);
        createMushroom({
          position: new THREE.Vector3(
            center.x + Math.cos(angle) * distance,
            0.02,
            center.z + Math.sin(angle) * distance
          ),
          height,
          radius: height * rng.range(0.25, 0.38),
          colorKey,
          leanX: rng.range(-0.22, 0.22),
          leanZ: rng.range(-0.22, 0.22),
          capScaleZ: rng.range(0.82, 1.18),
          light: false
        });
      }
    }

    createToadstoolCluster(
      new THREE.Vector3(-7, 0, 7),
      12,
      "teal",
      3.4
    );
    createToadstoolCluster(
      new THREE.Vector3(8, 0, -1),
      10,
      "amber",
      2.8
    );
    createToadstoolCluster(
      new THREE.Vector3(15, 0, -8),
      13,
      "violet",
      3.8
    );
    createToadstoolCluster(
      new THREE.Vector3(-16, 0, -6),
      9,
      "blue",
      2.7
    );

    function makeBranchCurve(
      start,
      end,
      bend,
      verticalLift = 0
    ) {
      return new THREE.CatmullRomCurve3([
        start,
        new THREE.Vector3(
          THREE.MathUtils.lerp(start.x, end.x, 0.32) + bend.x,
          THREE.MathUtils.lerp(start.y, end.y, 0.32) + verticalLift,
          THREE.MathUtils.lerp(start.z, end.z, 0.32) + bend.z
        ),
        new THREE.Vector3(
          THREE.MathUtils.lerp(start.x, end.x, 0.72) - bend.x * 0.35,
          THREE.MathUtils.lerp(start.y, end.y, 0.72) + verticalLift * 0.5,
          THREE.MathUtils.lerp(start.z, end.z, 0.72) - bend.z * 0.35
        ),
        end
      ]);
    }

    const barkMaterial = new THREE.MeshStandardMaterial({
      map: barkTexture,
      color: 0x242722,
      roughness: 1,
      metalness: 0
    });

    function addBranch(group, curve, radius, segments = 20) {
      const branch = new THREE.Mesh(
        new THREE.TubeGeometry(
          curve,
          segments,
          radius,
          7,
          false
        ),
        barkMaterial
      );
      branch.castShadow = true;
      branch.receiveShadow = true;
      group.add(branch);
      return branch;
    }

    function createTwistedTree(x, z, scale = 1, yaw = 0) {
      const tree = new THREE.Group();
      tree.position.set(x, 0, z);
      tree.rotation.y = yaw;
      tree.scale.setScalar(scale);

      const trunkPoints = [
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0.5, 3.2, 0.25),
        new THREE.Vector3(-0.35, 7.1, -0.1),
        new THREE.Vector3(0.7, 11.2, 0.3),
        new THREE.Vector3(0.2, 15, -0.25)
      ];
      const trunkCurve = new THREE.CatmullRomCurve3(trunkPoints);
      addBranch(tree, trunkCurve, 0.72, 36);

      const branchData = [
        {
          start: new THREE.Vector3(-0.1, 6.8, 0),
          end: new THREE.Vector3(-5.7, 11.2, 0.8),
          bend: new THREE.Vector3(-0.8, 0, 1)
        },
        {
          start: new THREE.Vector3(0.4, 9.3, 0.1),
          end: new THREE.Vector3(5.2, 14.2, -1.3),
          bend: new THREE.Vector3(1.1, 0, -0.5)
        },
        {
          start: new THREE.Vector3(0.3, 12.2, -0.1),
          end: new THREE.Vector3(-3, 17.1, -2.2),
          bend: new THREE.Vector3(-0.8, 0, -0.6)
        },
        {
          start: new THREE.Vector3(0.2, 14.4, -0.2),
          end: new THREE.Vector3(3.1, 18.2, 1.4),
          bend: new THREE.Vector3(0.4, 0, 0.8)
        }
      ];

      branchData.forEach((data, index) => {
        const curve = makeBranchCurve(
          data.start,
          data.end,
          data.bend,
          1.3
        );
        addBranch(
          tree,
          curve,
          0.28 - index * 0.025,
          24
        );

        const twigStart = curve.getPoint(0.68);
        const twigEnd = data.end.clone().add(
          new THREE.Vector3(
            rng.range(-1.8, 1.8),
            rng.range(1.3, 3),
            rng.range(-1.6, 1.6)
          )
        );
        addBranch(
          tree,
          makeBranchCurve(
            twigStart,
            twigEnd,
            new THREE.Vector3(
              rng.range(-0.5, 0.5),
              0,
              rng.range(-0.5, 0.5)
            ),
            0.5
          ),

          const leaflet = new THREE.Mesh(
            leafletGeometry,
            leafMaterial

          leaflet.position.copy(point);
          leaflet.scale.set(
            taper * side,
            taper,
            taper
          );
          leaflet.rotation.x = -0.35;
          leaflet.rotation.y = side * (
            Math.PI * 0.48 + t * 0.35

          leaflet.rotation.z = side * 0.1;

        sway: rng.range(0.018, 0.055)

    function createSporeField(
      count,
      radius,
      height,
      center,
      color = 0x8ffff0

      const positions = new Float32Array(count * 3);
      const phases = new Float32Array(count);
      const speeds = new Float32Array(count);
      const drifts = new Float32Array(count);

      for (let i = 0; i < count; i++) {
        const angle = rng.range(0, Math.PI * 2);
        const distance = Math.sqrt(rng.next()) * radius;
        positions[i * 3] = center.x + Math.cos(angle) * distance;
        positions[i * 3 + 1] = center.y + rng.range(0, height);
        positions[i * 3 + 2] = center.z + Math.sin(angle) * distance;
        phases[i] = rng.range(0, Math.PI * 2);
        speeds[i] = rng.range(0.12, 0.42);
        drifts[i] = rng.range(0.12, 0.5);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(positions, 3)
      );

      const material = new THREE.PointsMaterial({
        map: sporeTexture,
        color,
        size: 0.34,
        transparent: true,
        opacity: 0.72,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        sizeAttenuation: true
      });

      const points = new THREE.Points(geometry, material);
      scene.add(points);

      sporeFields.push({
        points,
        positions,
        phases,
        speeds,
        drifts,
        center,
        radius,
        height
      });
    }

    function animateCaps(elapsed) {
      for (const item of animatedCaps) {
        const amplitude = item.subtle ? 0.015 : 0.035;
        const wave = Math.sin(
          elapsed * item.speed * Math.PI * 2 + item.phase
        );
        const scale = 1 + wave * amplitude;
        item.group.scale.set(
          item.baseScale.x * scale,
          item.baseScale.y * (1 + wave * amplitude * 0.45),
          item.baseScale.z * scale
        );
        item.material.emissiveIntensity =
          item.baseIntensity * (1 + wave * (item.subtle ? 0.1 : 0.24));
      }
    }

    function animateFerns(elapsed) {
      for (const item of animatedFerns) {
        item.group.rotation.z =
          Math.sin(elapsed * item.speed + item.phase) * item.sway;
        item.group.rotation.x =
          Math.cos(elapsed * item.speed * 0.72 + item.phase) *
          item.sway *
          0.38;
      }
    }

    function animateSpores(elapsed, delta) {
      for (const field of sporeFields) {
        const attribute = field.points.geometry.attributes.position;

        for (let i = 0; i < field.speeds.length; i++) {
          const index = i * 3;
          field.positions[index + 1] += field.speeds[i] * delta;
          field.positions[index] +=
            Math.sin(elapsed * 0.8 + field.phases[i]) *
            field.drifts[i] *
            delta *
            0.12;
          field.positions[index + 2] +=
            Math.cos(elapsed * 0.65 + field.phases[i]) *
            field.drifts[i] *
            delta *
            0.1;

          if (
            field.positions[index + 1] >
            field.center.y + field.height
          ) {
            const angle = rng.range(0, Math.PI * 2);
            const distance = Math.sqrt(rng.next()) * field.radius;
            field.positions[index] =
              field.center.x + Math.cos(angle) * distance;
            field.positions[index + 1] =
              field.center.y + rng.range(0, 0.8);
            field.positions[index + 2] =
              field.center.z + Math.sin(angle) * distance;
          }
        }

        attribute.needsUpdate = true;
        field.points.material.opacity =
          0.64 + Math.sin(elapsed * 0.45) * 0.08;
      }
    }

    function animateFireflies(elapsed) {
      for (const firefly of fireflies) {
        const t = elapsed * firefly.speed + firefly.phase;
        firefly.mesh.position.x =
          firefly.origin.x + Math.sin(t) * firefly.orbit;
        firefly.mesh.position.y =
          firefly.origin.y +
          Math.sin(t * 1.7) * firefly.orbit * 0.35;
        firefly.mesh.position.z =
          firefly.origin.z +
          Math.cos(t * 0.83) * firefly.orbit;
        firefly.mesh.material.opacity =
          0.35 + Math.pow(0.5 + Math.sin(t * 2.1) * 0.5, 2) * 0.65;
      }
    }

    function animateWater(elapsed) {
      for (const ripple of waterRipples) {
        const cycle =
          (elapsed * ripple.speed + ripple.phase) % 1;
        const scale = ripple.baseScale + cycle * 3.2;
        ripple.mesh.scale.setScalar(scale);
        ripple.mesh.material.opacity =
          Math.sin(cycle * Math.PI) * 0.16;
      }
    }

    function animateLights(elapsed) {
      centralGlow.intensity =
        18 + Math.sin(elapsed * 1.05) * 2.1;
      violetGlow.intensity =
        13 + Math.sin(elapsed * 0.82 + 2.1) * 1.6;
      amberGlow.intensity =
        11 + Math.sin(elapsed * 0.7 + 4.3) * 1.3;
      moonHalo.material.opacity =
        0.75 + Math.sin(elapsed * 0.22) * 0.08;
    }

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;

      animateCaps(elapsed);
      animateFerns(elapsed);
      animateSpores(elapsed, delta);
      animateFireflies(elapsed);
      animateWater(elapsed);
      animateLights(elapsed);

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
