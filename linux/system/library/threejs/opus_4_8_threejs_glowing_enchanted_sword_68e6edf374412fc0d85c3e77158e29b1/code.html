<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Enchanted Sword</title>
<style>
  html, body { margin: 0; height: 100%; background: #06080b; overflow: hidden; }
  #c { display: block; width: 100vw; height: 100vh; }
  .hint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    color: #6fdfe8; font: 12px/1.4 -apple-system, Segoe UI, Roboto, sans-serif;
    letter-spacing: .12em; text-transform: uppercase; opacity: .5;
    pointer-events: none; user-select: none; text-shadow: 0 0 8px rgba(40,220,255,.5);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">Enchanted Longsword &nbsp;·&nbsp; drag to orbit</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ---------- Renderer ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// ---------- Scene / Camera ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0d11);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.05, 100);
camera.position.set(1.55, 0.55, 2.05);

// Procedural environment for nice metal reflections (no external assets)
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// ---------- Controls ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 1.1;
controls.maxDistance = 6.0;
controls.maxPolarAngle = Math.PI * 0.92;
controls.target.set(0, 0, 0);

// ---------- Lighting ----------
const hemi = new THREE.HemisphereLight(0x35505f, 0x0a0a0c, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xdfefff, 2.3);
key.position.set(2.2, 3.4, 2.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.2;
key.shadow.camera.far = 12;
key.shadow.camera.left = -1.4;
key.shadow.camera.right = 1.4;
key.shadow.camera.top = 1.4;
key.shadow.camera.bottom = -1.4;
key.shadow.bias = -0.0004;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0x8fb4c8, 0.55);
fill.position.set(-2.4, 1.2, 1.6);
scene.add(fill);

const rim = new THREE.DirectionalLight(0x2ff2e0, 1.3);
rim.position.set(-1.6, 2.4, -3.2);
scene.add(rim);

// ---------- Ground (receives shadows only) ----------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.62;
ground.receiveShadow = true;
scene.add(ground);

// ================= THE SWORD =================
const sword = new THREE.Group();
scene.add(sword);

// --- geometry constants ---
const BW = 0.028;          // blade half-width at base
const BLADE_LEN = 0.9;     // blade length
const TAPER = 0.62 * BLADE_LEN;
const FACE_Z = 0.0037;     // just above the flat blade face

// ---------- Steel material ----------
const steelMat = new THREE.MeshStandardMaterial({
  color: 0x3b454e, metalness: 0.92, roughness: 0.3,
  emissive: 0x0a3944, emissiveIntensity: 0.5
});
const guardMat = new THREE.MeshStandardMaterial({
  color: 0x596672, metalness: 1.0, roughness: 0.34,
  emissive: 0x0d6a72, emissiveIntensity: 0.6
});
const gripMat = new THREE.MeshStandardMaterial({
  color: 0x141d1e, metalness: 0.15, roughness: 0.88
});
const cordMat = new THREE.MeshStandardMaterial({
  color: 0x0c1314, metalness: 0.2, roughness: 0.95
});
const gemMat = new THREE.MeshStandardMaterial({
  color: 0x0a3a3e, metalness: 0.0, roughness: 0.18,
  emissive: 0x28e6d4, emissiveIntensity: 2.4
});

// ---------- Blade (extruded, beveled profile) ----------
const bladeShape = new THREE.Shape();
bladeShape.moveTo(-BW, 0);
bladeShape.lineTo(-BW, TAPER);
bladeShape.lineTo(0, BLADE_LEN);        // point
bladeShape.lineTo(BW, TAPER);
bladeShape.lineTo(BW, 0);
bladeShape.lineTo(-BW, 0);

const bladeGeo = new THREE.ExtrudeGeometry(bladeShape, {
  depth: 0.006, bevelEnabled: true, bevelThickness: 0.004,
  bevelSize: 0.004, bevelSegments: 3, steps: 1
});
bladeGeo.translate(0, 0, -0.003);
bladeGeo.computeVertexNormals();
const blade = new THREE.Mesh(bladeGeo, steelMat);
blade.castShadow = true;
blade.receiveShadow = true;
sword.add(blade);

// ---------- Emissive shaders (molten runes / crackling energy) ----------
const runesMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  transparent: true, blending: THREE.AdditiveBlending,
  depthWrite: false, side: THREE.DoubleSide, toneMapped: false,
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
  `,
  fragmentShader: `
    varying vec2 vUv;
    uniform float uTime;
    void main(){
      float u = vUv.x, v = vUv.y;
      float d = abs(u - 0.5) * 2.0;
      float vein = smoothstep(0.55, 0.0, d);
      float segs = 8.0;
      float sf = fract(v * segs);
      float si = floor(v * segs);
      float rune = smoothstep(0.12,0.22,sf) * (1.0 - smoothstep(0.78,0.88,sf));
      float ph = si * 1.7;
      float flick = 0.55 + 0.45 * sin(uTime*4.0 + ph);
      float flow  = 0.7 + 0.3 * sin(v*55.0 - uTime*5.0);
      float body = vein * (0.35 + 0.65*rune) * flick * flow;
      float energ = smoothstep(0.5, 1.0, v);
      body += vein * energ * (0.5 + 0.5*sin(uTime*11.0 + v*80.0));
      vec3 col = mix(vec3(0.15,0.85,1.0), vec3(0.78,1.0,1.0), energ);
      float hdr = 1.7 + energ*2.2;
      gl_FragColor = vec4(col * body * hdr, 1.0);
    }
  `
});

function energyMat(alongIsX) {
  const A = alongIsX ? 'vUv.x' : 'vUv.y';
  return new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    transparent: true, blending: THREE.AdditiveBlending,
    depthWrite: false, side: THREE.DoubleSide, toneMapped: false,
    vertexShader: `
      varying vec2 vUv;
      void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
    `,
    fragmentShader: `
      varying vec2 vUv;
      uniform float uTime;
      void main(){
        float L = ${A};
        float cr = 0.5 + 0.5*sin(L*90.0 - uTime*12.0);
        cr *= 0.6 + 0.4*sin(L*240.0 + uTime*20.0);
        float base = 0.5 + 0.7*cr;
        float energ = smoothstep(0.35, 1.0, L);
        vec3 col = mix(vec3(0.18,0.85,1.0), vec3(0.85,1.0,1.0), energ);
        float hdr = 1.8 + energ*3.2;
        gl_FragColor = vec4(col * base * hdr, 1.0);
      }
    `
  });
}
const spineMat = energyMat(false);  // along = uv.y
const edgeMat  = energyMat(true);   // along = uv.x
const energyMats = [spineMat, edgeMat];

// helper: place a mesh on both faces of the blade
function addFacePair(mesh, z) {
  const front = mesh; front.position.z = z;
  const back = mesh.clone(); back.position.z = -z; back.rotation.y = Math.PI;
  sword.add(front, back);
}

// Fuller runes plate
{
  const g = new THREE.PlaneGeometry(2 * BW * 0.62, 0.46);
  const m = new THREE.Mesh(g, runesMat);
  m.position.y = 0.27;
  addFacePair(m, FACE_Z);
}
// Central molten vein up toward the tip
{
  const g = new THREE.PlaneGeometry(0.006, 0.81);
  const m = new THREE.Mesh(g, spineMat);
  m.position.y = 0.445;
  addFacePair(m, FACE_Z + 0.0004);
}

// ---------- Crackling energized edges (glowing tubes) ----------
function edgeTube(sign) {
  const pts = [
    new THREE.Vector3(sign * BW, 0.03, 0),
    new THREE.Vector3(sign * BW, TAPER * 0.55, 0),
    new THREE.Vector3(sign * BW, TAPER, 0),
    new THREE.Vector3(sign * BW * 0.5, (TAPER + BLADE_LEN) * 0.5, 0),
    new THREE.Vector3(0, BLADE_LEN * 0.995, 0)
  ];
  const curve = new THREE.CatmullRomCurve3(pts);
  const geo = new THREE.TubeGeometry(curve, 120, 0.0016, 6, false);
  return new THREE.Mesh(geo, edgeMat);
}
sword.add(edgeTube(1), edgeTube(-1));

// ---------- Crossguard ----------
const guard = new THREE.Group();
const quillon = new THREE.Mesh(new THREE.CapsuleGeometry(0.016, 0.17, 6, 16), guardMat);
quillon.rotation.z = Math.PI / 2;
quillon.castShadow = true; quillon.receiveShadow = true;
guard.add(quillon);
// small teal end caps
for (const s of [-1, 1]) {
  const cap = new THREE.Mesh(new THREE.IcosahedronGeometry(0.02, 0), guardMat);
  cap.position.x = s * 0.1;
  cap.castShadow = true;
  guard.add(cap);
}
// collar wrapping the blade base
const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.021, 0.024, 0.04, 20), guardMat);
collar.position.y = 0.012;
collar.castShadow = true;
guard.add(collar);
guard.position.y = 0;
sword.add(guard);

// ---------- Grip ----------
const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.013, 0.015, 0.175, 24), gripMat);
grip.position.y = -0.105;
grip.castShadow = true; grip.receiveShadow = true;
sword.add(grip);
// wrap cord rings
for (let i = 0; i < 9; i++) {
  const y = -0.03 - i * 0.018;
  const r = 0.0135 + (i / 9) * 0.0015;
  const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.0024, 8, 20), cordMat);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = y;
  ring.castShadow = true;
  sword.add(ring);
}

// ---------- Pommel ----------
const pommel = new THREE.Mesh(new THREE.IcosahedronGeometry(0.03, 0), guardMat);
pommel.position.y = -0.215;
pommel.scale.y = 0.92;
pommel.castShadow = true;
sword.add(pommel);
const gem = new THREE.Mesh(new THREE.IcosahedronGeometry(0.014, 1), gemMat);
gem.position.y = -0.215;
sword.add(gem);

// ---------- Interior colored glow lights ----------
const bladeGlow = new THREE.PointLight(0x24d4ff, 2.6, 1.1, 2.0);
bladeGlow.position.set(0, 0.5, 0);
sword.add(bladeGlow);
const guardGlow = new THREE.PointLight(0x22e6cc, 1.6, 0.45, 2.0);
guardGlow.position.set(0, 0.0, 0);
sword.add(guardGlow);
const pommelGlow = new THREE.PointLight(0x22e6cc, 1.2, 0.4, 2.0);
pommelGlow.position.set(0, -0.215, 0);
sword.add(pommelGlow);

// ---------- Drifting sparks ----------
function makeSparkTexture() {
  const s = 64;
  const cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0.0, 'rgba(255,255,255,1)');
  g.addColorStop(0.25, 'rgba(160,245,255,0.9)');
  g.addColorStop(0.6, 'rgba(40,180,220,0.25)');
  g.addColorStop(1.0, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const SPARKS = 220;
const sPos = new Float32Array(SPARKS * 3);
const sCol = new Float32Array(SPARKS * 3);
const sVel = new Float32Array(SPARKS);
const sSway = new Float32Array(SPARKS * 2);
const palette = [new THREE.Color(0x69f2ff), new THREE.Color(0x2fd6c8), new THREE.Color(0xd6ffff)];

function seedSpark(i, initial) {
  const a = Math.random() * Math.PI * 2;
  const r = 0.018 + Math.random() * 0.055;
  sPos[i * 3] = Math.cos(a) * r;
  sPos[i * 3 + 2] = Math.sin(a) * r;
  sPos[i * 3 + 1] = initial ? (-0.1 + Math.random() * 1.05) : (-0.12 + Math.random() * 0.12);
  sVel[i] = 0.05 + Math.random() * 0.11;
  sSway[i * 2] = Math.random() * Math.PI * 2;
  sSway[i * 2 + 1] = 0.6 + Math.random() * 1.6;
  const c = palette[(Math.random() * palette.length) | 0];
  sCol[i * 3] = c.r; sCol[i * 3 + 1] = c.g; sCol[i * 3 + 2] = c.b;
}
for (let i = 0; i < SPARKS; i++) seedSpark(i, true);

const sparkGeo = new THREE.BufferGeometry();
sparkGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
sparkGeo.setAttribute('color', new THREE.BufferAttribute(sCol, 3));
const sparkMat = new THREE.PointsMaterial({
  size: 0.02, map: makeSparkTexture(), vertexColors: true,
  transparent: true, opacity: 0.95, depthWrite: false,
  blending: THREE.AdditiveBlending, sizeAttenuation: true, toneMapped: false
});
const sparks = new THREE.Points(sparkGeo, sparkMat);
sparks.frustumCulled = false;
sword.add(sparks);

function updateSparks(dt, t) {
  for (let i = 0; i < SPARKS; i++) {
    sPos[i * 3 + 1] += sVel[i] * dt;
    const amp = 0.006;
    sPos[i * 3]     += Math.sin(t * sSway[i * 2 + 1] + sSway[i * 2]) * amp * dt;
    sPos[i * 3 + 2] += Math.cos(t * sSway[i * 2 + 1] + sSway[i * 2]) * amp * dt;
    if (sPos[i * 3 + 1] > 0.98) seedSpark(i, false);
  }
  sparkGeo.attributes.position.needsUpdate = true;
}

// center the whole sword at the origin
sword.position.y = -0.33;

// ---------- Post-processing (bloom) ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight), 0.9, 0.6, 0.65
);
composer.addPass(bloom);

// ---------- Resize ----------
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  composer.setSize(w, h);
}
window.addEventListener('resize', onResize);

// ---------- Animation ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  runesMat.uniforms.uTime.value = t;
  for (const m of energyMats) m.uniforms.uTime.value = t;

  const hum = 0.5 + 0.5 * Math.sin(t * 3.0);
  steelMat.emissiveIntensity = 0.35 + 0.28 * hum;
  bladeGlow.intensity = 2.4 + 1.3 * hum;
  guardGlow.intensity = 1.5 + 0.6 * Math.sin(t * 2.0 + 1.0);
  pommelGlow.intensity = 1.1 + 0.5 * Math.sin(t * 2.3 + 2.0);
  gemMat.emissiveIntensity = 2.0 + 1.1 * (0.5 + 0.5 * Math.sin(t * 2.3 + 2.0));

  updateSparks(dt, t);
  controls.update();
  composer.render();
}
animate();
</script>
</body>
</html>
