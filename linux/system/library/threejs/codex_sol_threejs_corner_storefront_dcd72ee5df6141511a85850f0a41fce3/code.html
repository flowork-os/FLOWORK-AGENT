<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corner Storefront</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #b9c6ce; }
    canvas { display: block; }
    #label {
      position: fixed;
      left: 18px;
      bottom: 16px;
      color: rgba(255,255,255,.78);
      font: 11px/1.4 system-ui, sans-serif;
      letter-spacing: .16em;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="label">Drag to orbit · Scroll to zoom</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xb8c7cf);
    scene.fog = new THREE.Fog(0xb8c7cf, 24, 55);

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(13, 9, 14);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(-2.7, 2.8, -2.7);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.45;
    controls.minDistance = 9;
    controls.maxDistance = 34;
    controls.maxPolarAngle = Math.PI * 0.48;

    const hemi = new THREE.HemisphereLight(0xdceeff, 0x5b5145, 2.1);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff2d8, 4.2);
    sun.position.set(9, 15, 11);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -14;
    sun.shadow.camera.right = 14;
    sun.shadow.camera.top = 14;
    sun.shadow.camera.bottom = -14;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 40;
    sun.shadow.bias = -0.00025;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x91b9d1, 1.0);
    fill.position.set(-10, 7, -5);
    scene.add(fill);

    const mats = {
      brick: new THREE.MeshStandardMaterial({ color: 0x795346, roughness: 0.9 }),
      brickDark: new THREE.MeshStandardMaterial({ color: 0x60443a, roughness: 0.94 }),
      stone: new THREE.MeshStandardMaterial({ color: 0xc5b9a7, roughness: 0.82 }),
      trim: new THREE.MeshStandardMaterial({ color: 0xede3d2, roughness: 0.72 }),
      metal: new THREE.MeshStandardMaterial({ color: 0x24292a, roughness: 0.34, metalness: 0.62 }),
      brass: new THREE.MeshStandardMaterial({ color: 0xa7762c, roughness: 0.28, metalness: 0.78 }),
      glass: new THREE.MeshPhysicalMaterial({
        color: 0x8eafb3,
        roughness: 0.08,
        metalness: 0.03,
        transparent: true,
        opacity: 0.29,
        transmission: 0.12,
        side: THREE.DoubleSide,
        depthWrite: false
      }),
      doorGlass: new THREE.MeshPhysicalMaterial({
        color: 0x78959a,
        roughness: 0.07,
        transparent: true,
        opacity: 0.38,
        side: THREE.DoubleSide,
        depthWrite: false
      }),
      awningRed: new THREE.MeshStandardMaterial({ color: 0x8f2f2a, roughness: 0.88 }),
      awningCream: new THREE.MeshStandardMaterial({ color: 0xe9d7b9, roughness: 0.9 }),
      interior: new THREE.MeshStandardMaterial({ color: 0xe7d5b5, roughness: 0.8 }),
      darkInterior: new THREE.MeshStandardMaterial({ color: 0x272c2a, roughness: 0.96 }),
      wood: new THREE.MeshStandardMaterial({ color: 0x6f442b, roughness: 0.72 }),
      sidewalk: new THREE.MeshStandardMaterial({ color: 0xa7a5a0, roughness: 0.96 }),
      road: new THREE.MeshStandardMaterial({ color: 0x43484a, roughness: 1 })
    };

    function box(name, size, position, material, rotation = null, cast = true, receive = true) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(...size), material);
      mesh.name = name;
      mesh.position.set(...position);
      if (rotation) mesh.rotation.set(...rotation);
      mesh.castShadow = cast;
      mesh.receiveShadow = receive;
      scene.add(mesh);
      return mesh;
    }

    function cylinder(name, radiusTop, radiusBottom, height, segments, position, material) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments),
        material
      );
      mesh.name = name;
      mesh.position.set(...position);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    box('road', [42, 0.18, 42], [0, -0.18, 0], mats.road, null, false, true);
    box('sidewalk-front', [12, 0.18, 3.8], [-3.1, 0.02, 1.5], mats.sidewalk, null, false, true);
    box('sidewalk-side', [3.8, 0.18, 12], [1.5, 0.02, -3.1], mats.sidewalk, null, false, true);
    box('curb-front', [12, 0.28, 0.25], [-3.1, -0.02, 3.34], mats.stone, null, false, true);
    box('curb-side', [0.25, 0.28, 12], [3.34, -0.02, -3.1], mats.stone, null, false, true);

    for (let i = -8; i <= 2; i += 2) {
      box('paving-joint', [0.025, 0.008, 3.5], [i, 0.116, 1.48], mats.brickDark, null, false, false);
      box('paving-joint', [3.5, 0.008, 0.025], [1.48, 0.116, i], mats.brickDark, null, false, false);
    }

    box('upper-building', [8, 3.4, 8], [-4, 5.35, -4], mats.brick);
    box('roof-cap-front', [8.2, 0.22, 0.36], [-4, 7.12, 0.05], mats.stone);
    box('roof-cap-side', [0.36, 0.22, 8.2], [0.05, 7.12, -4], mats.stone);
    box('parapet-front', [8, 0.55, 0.3], [-4, 7.43, -0.02], mats.brickDark);
    box('parapet-side', [0.3, 0.55, 8], [-0.02, 7.43, -4], mats.brickDark);

    box('front-left-pier', [0.65, 3.72, 0.62], [-7.68, 1.9, -0.18], mats.stone);
    box('side-left-pier', [0.62, 3.72, 0.65], [-0.18, 1.9, -7.68], mats.stone);
    box('front-corner-pier', [0.36, 3.72, 0.52], [-1.52, 1.9, -0.18], mats.stone);
    box('side-corner-pier', [0.52, 3.72, 0.36], [-0.18, 1.9, -1.52], mats.stone);

    box('front-sign-band', [6.5, 0.88, 0.38], [-4.75, 4.25, 0.02], mats.trim);
    box('side-sign-band', [0.38, 0.88, 6.5], [0.02, 4.25, -4.75], mats.trim);
    box('front-sign-shadow', [6.65, 0.12, 0.45], [-4.75, 3.78, 0.05], mats.brickDark);
    box('side-sign-shadow', [0.45, 0.12, 6.65], [0.05, 3.78, -4.75], mats.brickDark);

    for (let y = 4.85; y < 6.85; y += 0.58) {
      box('brick-course-front', [7.65, 0.025, 0.018], [-4, y, 0.202], mats.brickDark, null, false, false);
      box('brick-course-side', [0.018, 0.025, 7.65], [0.202, y, -4], mats.brickDark, null, false, false);
    }
    for (let x = -7.65; x < -0.3; x += 0.75) {
      box('brick-joint-front', [0.018, 1.9, 0.02], [x, 5.85, 0.205], mats.brickDark, null, false, false);
    }
    for (let z = -7.65; z < -0.3; z += 0.75) {
      box('brick-joint-side', [0.02, 1.9, 0.018], [0.205, 5.85, z], mats.brickDark, null, false, false);
    }

    box('interior-floor', [6.5, 0.16, 6.5], [-3.65, 0.31, -3.65], mats.wood);
    box('interior-back-front', [6.2, 3.1, 0.18], [-4.3, 1.95, -3.35], mats.interior);
    box('interior-back-side', [0.18, 3.1, 6.2], [-3.35, 1.95, -4.3], mats.interior);

    const windowY = 1.98;
    const windowH = 2.78;
    box('front-glass', [5.72, windowH, 0.055], [-4.57, windowY, 0.13], mats.glass, null, false, false);
    box('side-glass', [0.055, windowH, 5.72], [0.13, windowY, -4.57], mats.glass, null, false, false);
    box('front-sill', [5.82, 0.22, 0.36], [-4.57, 0.5, 0.04], mats.stone);
    box('side-sill', [0.36, 0.22, 5.82], [0.04, 0.5, -4.57], mats.stone);
    box('front-header-frame', [5.82, 0.11, 0.15], [-4.57, 3.4, 0.16], mats.metal);
    box('side-header-frame', [0.15, 0.11, 5.82], [0.16, 3.4, -4.57], mats.metal);

    [-6.58, -4.62, -2.68].forEach(x => {
      box('front-mullion', [0.075, 2.82, 0.12], [x, windowY, 0.18], mats.metal);
    });
    [-6.58, -4.62, -2.68].forEach(z => {
      box('side-mullion', [0.12, 2.82, 0.075], [0.18, windowY, z], mats.metal);
    });
    box('front-window-rail', [5.76, 0.065, 0.12], [-4.57, 1.27, 0.18], mats.metal);
    box('side-window-rail', [0.12, 0.065, 5.76], [0.18, 1.27, -4.57], mats.metal);

    box('entry-ceiling', [1.8, 0.18, 1.8], [-0.92, 3.5, -0.92], mats.trim, [0, Math.PI / 4, 0]);
    box('entry-step', [1.78, 0.18, 0.82], [-0.79, 0.18, -0.79], mats.stone, [0, Math.PI / 4, 0]);

    const doorGroup = new THREE.Group();
    doorGroup.position.set(-1.04, 1.86, -1.04);
    doorGroup.rotation.y = Math.PI / 4;
    scene.add(doorGroup);

    const doorFrame = new THREE.Mesh(new THREE.BoxGeometry(1.58, 2.94, 0.14), mats.metal);
    doorFrame.castShadow = true;
    doorGroup.add(doorFrame);

    const doorGlass = new THREE.Mesh(new THREE.BoxGeometry(1.35, 2.67, 0.035), mats.doorGlass);
    doorGlass.position.z = 0.081;
    doorGlass.renderOrder = 3;
    doorGroup.add(doorGlass);

    const doorRail = new THREE.Mesh(new THREE.BoxGeometry(1.34, 0.075, 0.07), mats.metal);
    doorRail.position.set(0, -0.72, 0.115);
    doorGroup.add(doorRail);

    const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.72, 12), mats.brass);
    handle.position.set(0.45, 0.05, 0.15);
    handle.castShadow = true;
    doorGroup.add(handle);

    const handleTop = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.13, 10), mats.brass);
    handleTop.rotation.x = Math.PI / 2;
    handleTop.position.set(0.45, 0.39, 0.105);
    doorGroup.add(handleTop);
    const handleBottom = handleTop.clone();
    handleBottom.position.y = -0.29;
    doorGroup.add(handleBottom);

    function addAwningFront() {
      const count = 13;
      const total = 6.5;
      const segment = total / count;
      for (let i = 0; i < count; i++) {
        const x = -8 + segment * 0.5 + i * segment;
        box(
          'front-awning-stripe',
          [segment + 0.012, 0.085, 1.34],
          [x, 3.55, 0.68],
          i % 2 ? mats.awningCream : mats.awningRed,
          [0.18, 0, 0]
        );
        box(
          'front-awning-valance',
          [segment + 0.012, 0.34, 0.07],
          [x, 3.29, 1.34],
          i % 2 ? mats.awningCream : mats.awningRed
        );
      }
      box('front-awning-bar', [6.62, 0.09, 0.09], [-4.75, 3.46, 1.37], mats.metal);
    }

    function addAwningSide() {
      const count = 13;
      const total = 6.5;
      const segment = total / count;
      for (let i = 0; i < count; i++) {
        const z = -8 + segment * 0.5 + i * segment;
        box(
          'side-awning-stripe',
          [1.34, 0.085, segment + 0.012],
          [0.68, 3.55, z],
          i % 2 ? mats.awningCream : mats.awningRed,
          [0, 0, -0.18]
        );
        box(
          'side-awning-valance',
          [0.07, 0.34, segment + 0.012],
          [1.34, 3.29, z],
          i % 2 ? mats.awningCream : mats.awningRed
        );
      }
      box('side-awning-bar', [0.09, 0.09, 6.62], [1.37, 3.46, -4.75], mats.metal);
    }

    addAwningFront();
    addAwningSide();

    function createSignTexture(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 192;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#eee3d0';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#bca88a';
      ctx.lineWidth = 6;
      ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);
      ctx.fillStyle = '#302f2b';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '600 73px Georgia, serif';
      ctx.fillText(text, canvas.width / 2, canvas.height / 2 - 3);
      ctx.font = '24px Arial, sans-serif';
      ctx.letterSpacing = '8px';
      ctx.fillText('GOODS  •  HOME  •  MARKET', canvas.width / 2, 148);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    const signMat = new THREE.MeshStandardMaterial({
      map: createSignTexture('CORNER & CO.'),
      roughness: 0.72
    });
    const frontSign = new THREE.Mesh(new THREE.PlaneGeometry(5.75, 0.72), signMat);
    frontSign.position.set(-4.75, 4.26, 0.218);
    scene.add(frontSign);

    const sideSign = new THREE.Mesh(new THREE.PlaneGeometry(5.75, 0.72), signMat);
    sideSign.position.set(0.218, 4.26, -4.75);
    sideSign.rotation.y = Math.PI / 2;
    scene.add(sideSign);

    function addDisplayTable(x, z, rotation = 0) {
      box('display-top', [1.5, 0.12, 0.62], [x, 1.02, z], mats.wood, [0, rotation, 0]);
      const offset = 0.55;
      if (rotation === 0) {
        box('table-leg', [0.1, 0.72, 0.1], [x - offset, 0.64, z - 0.2], mats.metal);
        box('table-leg', [0.1, 0.72, 0.1], [x + offset, 0.64, z - 0.2], mats.metal);
        box('table-leg', [0.1, 0.72, 0.1], [x - offset, 0.64, z + 0.2], mats.metal);
        box('table-leg', [0.1, 0.72, 0.1], [x + offset, 0.64, z + 0.2], mats.metal);
      } else {
        box('table-leg', [0.1, 0.72, 0.1], [x - 0.2, 0.64, z - offset], mats.metal);
        box('table-leg', [0.1, 0.72, 0.1], [x + 0.2, 0.64, z - offset], mats.metal);
        box('table-leg', [0.1, 0.72, 0.1], [x - 0.2, 0.64, z + offset], mats.metal);
        box('table-leg', [0.1, 0.72, 0.1], [x + 0.2, 0.64, z + offset], mats.metal);
      }
    }

    addDisplayTable(-4.65, -0.75);
    addDisplayTable(-0.75, -4.65, Math.PI / 2);

    const productColors = [
      new THREE.MeshStandardMaterial({ color: 0xc99054, roughness: 0.74 }),
      new THREE.MeshStandardMaterial({ color: 0x486f67, roughness: 0.72 }),
      new THREE.MeshStandardMaterial({ color: 0x9c4b44, roughness: 0.76 }),
      new THREE.MeshStandardMaterial({ color: 0xd1bc8b, roughness: 0.8 })
    ];

    [-5.15, -4.65, -4.15].forEach((x, i) => {
      box('display-product', [0.3, 0.42 + i * 0.08, 0.26], [x, 1.29 + i * 0.04, -0.74], productColors[i]);
    });
    [-5.15, -4.65, -4.15].forEach((z, i) => {
      box('display-product', [0.26, 0.42 + i * 0.08, 0.3], [-0.74, 1.29 + i * 0.04, z], productColors[(i + 1) % 4]);
    });

    function addShelvesOnBack() {
      for (let y = 0.8; y <= 2.6; y += 0.62) {
        box('back-shelf-front', [4.6, 0.08, 0.42], [-4.55, y, -3.15], mats.wood);
        box('back-shelf-side', [0.42, 0.08, 4.6], [-3.15, y, -4.55], mats.wood);
      }
      for (let i = 0; i < 8; i++) {
        const x = -6.45 + i * 0.55;
        const color = productColors[i % productColors.length];
        box('shelf-product-front', [0.28, 0.36, 0.2], [x, 1.03 + (i % 3) * 0.62, -2.91], color);
        const z = -6.45 + i * 0.55;
        box('shelf-product-side', [0.2, 0.36, 0.28], [-2.91, 1.03 + ((i + 1) % 3) * 0.62, z], color);
      }
    }
    addShelvesOnBack();

    cylinder('planter-front', 0.42, 0.34, 0.65, 24, [-6.9, 0.44, 1.8], mats.brickDark);
    cylinder('plant-stem-front', 0.055, 0.07, 1.15, 10, [-6.9, 1.25, 1.8], mats.wood);
    cylinder('plant-crown-front', 0.52, 0.38, 0.72, 10, [-6.9, 1.86, 1.8],
      new THREE.MeshStandardMaterial({ color: 0x496649, roughness: 0.9 }));

    cylinder('planter-side', 0.42, 0.34, 0.65, 24, [1.8, 0.44, -6.9], mats.brickDark);
    cylinder('plant-stem-side', 0.055, 0.07, 1.15, 10, [1.8, 1.25, -6.9], mats.wood);
    cylinder('plant-crown-side', 0.52, 0.38, 0.72, 10, [1.8, 1.86, -6.9],
      new THREE.MeshStandardMaterial({ color: 0x496649, roughness: 0.9 }));

    const interiorLightA = new THREE.PointLight(0xffc77e, 5.5, 8, 2);
    interiorLightA.position.set(-3.3, 2.9, -1.6);
    interiorLightA.castShadow = true;
    interiorLightA.shadow.mapSize.set(512, 512);
    scene.add(interiorLightA);

    const interiorLightB = new THREE.PointLight(0xffc77e, 4.5, 7, 2);
    interiorLightB.position.set(-1.6, 2.9, -3.3);
    scene.add(interiorLightB);

    for (const [x, z] of [[-3.3, -1.6], [-1.6, -3.3]]) {
      cylinder('pendant-cord', 0.012, 0.012, 0.55, 8, [x, 3.25, z], mats.metal);
      const shade = new THREE.Mesh(
        new THREE.ConeGeometry(0.24, 0.25, 20, 1, true),
        new THREE.MeshStandardMaterial({ color: 0x393b37, roughness: 0.45, metalness: 0.35, side: THREE.DoubleSide })
      );
      shade.position.set(x, 2.96, z);
      shade.rotation.x = Math.PI;
      scene.add(shade);
    }

    const clockFace = new THREE.Mesh(
      new THREE.CircleGeometry(0.3, 32),
      new THREE.MeshStandardMaterial({ color: 0xf2ead9, roughness: 0.8 })
    );
    clockFace.position.set(-4.3, 2.55, -3.245);
    scene.add(clockFace);
    cylinder('clock-rim', 0.34, 0.34, 0.06, 32, [-4.3, 2.55, -3.28], mats.metal).rotation.x = Math.PI / 2;

    const pole = cylinder('street-pole', 0.055, 0.075, 3.8, 14, [2.65, 1.95, 2.65], mats.metal);
    const lampArm = box('lamp-arm', [0.08, 0.08, 0.85], [2.65, 3.7, 2.3], mats.metal, [-0.18, 0, 0]);
    lampArm.rotation.y = Math.PI / 4;
    const lamp = new THREE.Mesh(
      new THREE.SphereGeometry(0.23, 20, 12),
      new THREE.MeshStandardMaterial({ color: 0xffe3aa, emissive: 0xffc66b, emissiveIntensity: 1.3, roughness: 0.25 })
    );
    lamp.position.set(2.35, 3.55, 2.35);
    lamp.castShadow = true;
    scene.add(lamp);

    const cornerLight = new THREE.PointLight(0xffd18e, 1.4, 5, 2);
    cornerLight.position.copy(lamp.position);
    scene.add(cornerLight);

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      lamp.material.emissiveIntensity = 1.25 + Math.sin(elapsed * 0.8) * 0.05;
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
