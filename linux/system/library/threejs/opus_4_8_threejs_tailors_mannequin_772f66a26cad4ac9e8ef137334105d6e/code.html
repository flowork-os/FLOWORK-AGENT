<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tailor's Dress Form</title>
<style>
  html, body { margin: 0; height: 100%; background: #1c1c20; overflow: hidden; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------- Renderer ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* ---------- Scene & Camera ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1c1c20);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(1.7, 1.15, 2.5);

/* ---------- Procedural studio environment (reflections only) ---------- */
const pmrem = new THREE.PMREMGenerator(renderer);
const roomEnv = new RoomEnvironment();
scene.environment = pmrem.fromScene(roomEnv, 0.04).texture;
roomEnv.dispose();

/* ---------- Lighting: hemisphere fill + key + fill + rim ---------- */
const hemi = new THREE.HemisphereLight(0xbfd0e0, 0x2a2622, 0.35);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff3e2, 2.1);
key.position.set(3.2, 5.0, 3.6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 14;
key.shadow.camera.left = -2.2;
key.shadow.camera.right = 2.2;
key.shadow.camera.top = 2.6;
key.shadow.camera.bottom = -0.4;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 4;
scene.add(key);
const keyTarget = new THREE.Object3D();
keyTarget.position.set(0, 0.9, 0);
scene.add(keyTarget);
key.target = keyTarget;

const fill = new THREE.DirectionalLight(0xccdcff, 0.5);
fill.position.set(-4.0, 2.2, 2.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 1.3);
rim.position.set(-2.5, 3.4, -4.2);
scene.add(rim);

/* ---------- Materials ---------- */
const fabricMat = new THREE.MeshPhysicalMaterial({
  color: 0xcabfa6,
  roughness: 0.9,
  metalness: 0.0,
  sheen: 1.0,
  sheenRoughness: 0.7,
  sheenColor: new THREE.Color(0xf3ece0),
  clearcoat: 0.0
});

const fabricCapMat = new THREE.MeshPhysicalMaterial({
  color: 0xb2a88f,
  roughness: 0.95,
  metalness: 0.0,
  sheen: 0.8,
  sheenRoughness: 0.8,
  sheenColor: new THREE.Color(0xece4d6)
});

const chromeMat = new THREE.MeshStandardMaterial({
  color: 0xb9bcc4,
  metalness: 1.0,
  roughness: 0.26
});

const brushedMat = new THREE.MeshStandardMaterial({
  color: 0x8b8e94,
  metalness: 0.92,
  roughness: 0.42
});

const castMat = new THREE.MeshStandardMaterial({
  color: 0x2c2c31,
  metalness: 0.75,
  roughness: 0.5
});

/* ---------- Build the mannequin ---------- */
const mannequin = new THREE.Group();
scene.add(mannequin);

const DEPTH = 0.68; // torso is wider (x) than deep (z): elliptical cross-section

// --- Torso: lathed vertical profile, then flattened on z for a realistic body shape ---
const profile2D = [
  [0.150, 0.000],
  [0.166, 0.040],
  [0.168, 0.080],
  [0.158, 0.130],
  [0.138, 0.185],
  [0.122, 0.235],
  [0.116, 0.270],  // waist (narrowest)
  [0.122, 0.305],
  [0.140, 0.355],
  [0.158, 0.400],
  [0.166, 0.430],  // bust
  [0.160, 0.470],
  [0.150, 0.510],
  [0.150, 0.545],
  [0.170, 0.585],  // shoulder rise
  [0.178, 0.605],  // shoulder (widest at top)
  [0.160, 0.632],
  [0.120, 0.660],
  [0.085, 0.685],
  [0.062, 0.708],
  [0.058, 0.725]   // neck opening
].map(p => new THREE.Vector2(p[0], p[1]));

const spline = new THREE.SplineCurve(profile2D);
const latheProfile = spline.getPoints(150);
const torsoGeo = new THREE.LatheGeometry(latheProfile, 96);
torsoGeo.computeVertexNormals();

const TORSO_BASE_Y = 0.72;
const TORSO_TOP_Y = TORSO_BASE_Y + 0.725;

const torso = new THREE.Mesh(torsoGeo, fabricMat);
torso.position.y = TORSO_BASE_Y;
torso.scale.z = DEPTH;
torso.castShadow = true;
torso.receiveShadow = true;
mannequin.add(torso);

// --- Neck: fabric cap disc + thin chrome trim ring ---
const neckCap = new THREE.Mesh(new THREE.CircleGeometry(0.056, 48), fabricCapMat);
neckCap.rotation.x = -Math.PI / 2;
neckCap.position.y = TORSO_TOP_Y - 0.004;
neckCap.scale.z = DEPTH;
neckCap.receiveShadow = true;
mannequin.add(neckCap);

const neckRing = new THREE.Mesh(new THREE.TorusGeometry(0.058, 0.006, 14, 60), chromeMat);
neckRing.rotation.x = -Math.PI / 2;
neckRing.position.y = TORSO_TOP_Y;
neckRing.scale.z = DEPTH;
neckRing.castShadow = true;
mannequin.add(neckRing);

// --- Bottom metal cap / cage plate that closes the hip opening ---
const bottomCap = new THREE.Mesh(new THREE.CylinderGeometry(0.150, 0.138, 0.05, 64), brushedMat);
bottomCap.position.y = TORSO_BASE_Y - 0.012;
bottomCap.scale.z = DEPTH;
bottomCap.castShadow = true;
bottomCap.receiveShadow = true;
mannequin.add(bottomCap);

// --- Central pole ---
const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.66, 32), chromeMat);
pole.position.y = 0.06 + 0.66 / 2;
pole.castShadow = true;
pole.receiveShadow = true;
mannequin.add(pole);

// --- Height-adjustment collar with thumb-screw ---
const collar = new THREE.Group();
collar.position.y = 0.50;
const collarBody = new THREE.Mesh(new THREE.CylinderGeometry(0.027, 0.027, 0.05, 32), brushedMat);
collarBody.castShadow = true;
collar.add(collarBody);
const screwStem = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.007, 0.05, 20), chromeMat);
screwStem.rotation.z = Math.PI / 2;
screwStem.position.set(0.05, 0, 0);
screwStem.castShadow = true;
collar.add(screwStem);
const screwKnob = new THREE.Mesh(new THREE.SphereGeometry(0.014, 20, 16), chromeMat);
screwKnob.position.set(0.078, 0, 0);
screwKnob.castShadow = true;
collar.add(screwKnob);
mannequin.add(collar);

// --- Round weighted base (tiered) ---
const baseBottom = new THREE.Mesh(new THREE.CylinderGeometry(0.215, 0.235, 0.03, 72), castMat);
baseBottom.position.y = 0.015;
baseBottom.castShadow = true;
baseBottom.receiveShadow = true;
mannequin.add(baseBottom);

const baseMid = new THREE.Mesh(new THREE.CylinderGeometry(0.125, 0.165, 0.03, 72), castMat);
baseMid.position.y = 0.045;
baseMid.castShadow = true;
baseMid.receiveShadow = true;
mannequin.add(baseMid);

const baseHub = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.05, 0.045, 40), chromeMat);
baseHub.position.y = 0.0775;
baseHub.castShadow = true;
mannequin.add(baseHub);

/* ---------- Ground plane (receives shadows only) ---------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.35 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0.0;
ground.receiveShadow = true;
scene.add(ground);

/* ---------- Controls ---------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.target.set(0, 0.82, 0);
controls.minDistance = 1.2;
controls.maxDistance = 8;
controls.minPolarAngle = 0.12;
controls.maxPolarAngle = Math.PI / 2 + 0.12;
controls.update();

/* ---------- Resize ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

/* ---------- Render loop ---------- */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
