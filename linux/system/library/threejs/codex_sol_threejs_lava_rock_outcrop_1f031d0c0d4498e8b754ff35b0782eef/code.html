<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lava Rock Outcrop</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0d0e; }
    body { font-family: system-ui, sans-serif; }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 22px;
      bottom: 18px;
      color: rgba(225, 218, 202, 0.72);
      letter-spacing: 0.18em;
      font-size: 11px;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 1px 8px #000;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Volcanic outcrop · drag to orbit</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101315);
    scene.fog = new THREE.FogExp2(0x101315, 0.026);

    const camera = new THREE.PerspectiveCamera(39, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(8.8, 5.4, 10.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.55, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.48;
    controls.minDistance = 7;
    controls.maxDistance = 22;
    controls.maxPolarAngle = Math.PI * 0.48;

    const hemi = new THREE.HemisphereLight(0x8795a1, 0x17100c, 1.25);
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0xffd8ad, 4.2);
    key.position.set(-5, 9, 7);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -9;
    key.shadow.camera.right = 9;
    key.shadow.camera.top = 9;
    key.shadow.camera.bottom = -9;
    key.shadow.camera.near = 0.5;
    key.shadow.camera.far = 30;
    key.shadow.bias = -0.0004;
    key.shadow.normalBias = 0.025;
    scene.add(key);

    const rim = new THREE.DirectionalLight(0x607e99, 1.8);
    rim.position.set(7, 4, -7);
    scene.add(rim);

    const warmBounce = new THREE.PointLight(0xb85d31, 5.5, 13, 2);
    warmBounce.position.set(-4, 1.1, 4);
    scene.add(warmBounce);

    const rockMaterials = [
      new THREE.MeshStandardMaterial({ color: 0x292827, roughness: 0.93, metalness: 0.02, flatShading: true }),
      new THREE.MeshStandardMaterial({ color: 0x34312e, roughness: 0.96, metalness: 0.01, flatShading: true }),
      new THREE.MeshStandardMaterial({ color: 0x201f1f, roughness: 0.9, metalness: 0.035, flatShading: true }),
      new THREE.MeshStandardMaterial({ color: 0x3a3530, roughness: 0.98, metalness: 0.0, flatShading: true })
    ];

    const cavityMaterial = new THREE.MeshStandardMaterial({
      color: 0x070707,
      roughness: 1,
      metalness: 0,
      side: THREE.DoubleSide
    });

    const rimMaterial = new THREE.MeshStandardMaterial({
      color: 0x171616,
      roughness: 1,
      metalness: 0,
      flatShading: true
    });

    let randomState = 927461;
    function random() {
      randomState = (randomState * 1664525 + 1013904223) >>> 0;
      return randomState / 4294967296;
    }

    function signedRandom() {
      return random() * 2 - 1;
    }

    function hashNoise(x, y, z, seed) {
      const a = Math.sin(x * 2.73 + y * 4.19 - z * 3.17 + seed * 1.37);
      const b = Math.sin(x * 6.11 - y * 3.47 + z * 5.03 + seed * 2.11);
      const c = Math.cos(x * 10.7 + y * 8.3 + z * 7.9 - seed);
      return a * 0.52 + b * 0.31 + c * 0.17;
    }

    function surfaceFactor(direction, seed) {
      const n = hashNoise(direction.x, direction.y, direction.z, seed);
      const ridges = Math.abs(Math.sin(
        direction.x * 5.7 + direction.y * 3.1 - direction.z * 4.8 + seed
      ));
      return 1 + n * 0.105 + (ridges - 0.5) * 0.055;
    }

    function createCraterGeometry(radius, depth, segments, seed) {
      const positions = [0, 0, -depth];
      const colors = [0.018, 0.014, 0.012];
      const radii = [];

      for (let i = 0; i < segments; i++) {
        const angle = i / segments * Math.PI * 2;
        const r = radius * (0.84 + 0.18 * Math.sin(angle * 3 + seed) + 0.08 * Math.sin(angle * 7 - seed));
        radii.push(r);
        positions.push(Math.cos(angle) * r, Math.sin(angle) * r, -depth * (0.03 + 0.08 * Math.sin(angle * 5)));
        colors.push(0.055, 0.047, 0.041);
      }

      const indices = [];
      for (let i = 0; i < segments; i++) {
        indices.push(0, 1 + i, 1 + ((i + 1) % segments));
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return { geometry, radii };
    }

    function createIrregularRim(radius, segments, seed) {
      const positions = [];
      const indices = [];

      for (let i = 0; i < segments; i++) {
        const angle = i / segments * Math.PI * 2;
        const wobble = 1 + 0.12 * Math.sin(angle * 3 + seed) + 0.055 * Math.sin(angle * 7 - seed);
        const inner = radius * 0.91 * wobble;
        const outer = radius * (1.11 + 0.07 * Math.sin(angle * 5 + seed * 0.6));
        const z = 0.015 + radius * 0.05 * Math.sin(angle * 4 - seed);
        positions.push(Math.cos(angle) * inner, Math.sin(angle) * inner, z);
        positions.push(Math.cos(angle) * outer, Math.sin(angle) * outer, z - radius * 0.08);
      }

      for (let i = 0; i < segments; i++) {
        const a = i * 2;
        const b = ((i + 1) % segments) * 2;
        indices.push(a, a + 1, b + 1, a, b + 1, b);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    function addCavity(parent, direction, radius, scale, baseRadius, seed) {
      const d = direction.clone().normalize();
      const factor = surfaceFactor(d, seed);
      const position = new THREE.Vector3(
        d.x * scale.x,
        d.y * scale.y,
        d.z * scale.z
      ).multiplyScalar(baseRadius * factor * 1.002);

      const normal = new THREE.Vector3(
        d.x / scale.x,
        d.y / scale.y,
        d.z / scale.z
      ).normalize();

      const holder = new THREE.Group();
      holder.position.copy(position);
      holder.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);

      const craterData = createCraterGeometry(radius, radius * 0.48, 12, seed);
      const crater = new THREE.Mesh(craterData.geometry, cavityMaterial);
      crater.receiveShadow = true;
      holder.add(crater);

      const lip = new THREE.Mesh(createIrregularRim(radius, 12, seed), rimMaterial);
      lip.castShadow = true;
      lip.receiveShadow = true;
      holder.add(lip);

      parent.add(holder);
    }

    function createRock(options) {
      const {
        position, scale, radius, seed, rotation,
        cavities = 4, detail = 2, materialIndex = 0
      } = options;

      const group = new THREE.Group();
      group.position.copy(position);
      group.rotation.set(rotation.x, rotation.y, rotation.z);

      const geometry = new THREE.IcosahedronGeometry(radius, detail);
      const attribute = geometry.attributes.position;
      const vertex = new THREE.Vector3();
      const direction = new THREE.Vector3();

      for (let i = 0; i < attribute.count; i++) {
        vertex.fromBufferAttribute(attribute, i);
        direction.copy(vertex).normalize();
        let factor = surfaceFactor(direction, seed);

        const planeCut = Math.max(
          Math.abs(direction.x * 0.71 + direction.y * 0.24 - direction.z * 0.66),
          Math.abs(direction.x * 0.18 - direction.y * 0.88 + direction.z * 0.43)
        );
        factor *= 0.975 + 0.045 * Math.pow(planeCut, 5);

        vertex.copy(direction).multiplyScalar(radius * factor);
        vertex.x *= scale.x;
        vertex.y *= scale.y;
        vertex.z *= scale.z;
        attribute.setXYZ(i, vertex.x, vertex.y, vertex.z);
      }

      geometry.computeVertexNormals();
      geometry.computeBoundingSphere();

      const mesh = new THREE.Mesh(geometry, rockMaterials[materialIndex % rockMaterials.length]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      group.add(mesh);

      for (let i = 0; i < cavities; i++) {
        const angle = random() * Math.PI * 2;
        const elevation = -0.2 + random() * 1.05;
        const radial = Math.sqrt(Math.max(0, 1 - elevation * elevation));
        const direction = new THREE.Vector3(
          Math.cos(angle) * radial,
          elevation,
          Math.sin(angle) * radial
        );
        const cavityRadius = radius * (0.055 + random() * 0.09);
        addCavity(group, direction, cavityRadius, scale, radius, seed + i * 0.73);
      }

      return group;
    }

    const outcrop = new THREE.Group();
    scene.add(outcrop);

    const formations = [
      { p: [0.05, 1.55, 0.05], s: [1.34, 1.55, 1.12], r: 1.48, rot: [0.08, 0.20, -0.07], c: 12, d: 2 },
      { p: [-1.75, 1.03, 0.35], s: [1.33, 1.03, 1.08], r: 1.26, rot: [-0.14, -0.32, 0.18], c: 8, d: 2 },
      { p: [1.65, 0.98, 0.32], s: [1.22, 1.13, 1.02], r: 1.21, rot: [0.21, 0.38, -0.16], c: 8, d: 2 },
      { p: [0.65, 0.73, 1.35], s: [1.24, 0.85, 1.05], r: 1.08, rot: [-0.22, 0.14, 0.09], c: 7, d: 2 },
      { p: [-0.76, 0.65, -1.12], s: [1.16, 0.82, 1.00], r: 1.05, rot: [0.11, -0.17, -0.21], c: 6, d: 2 },
      { p: [1.13, 2.23, -0.42], s: [0.88, 1.06, 0.82], r: 0.91, rot: [-0.08, 0.47, 0.12], c: 6, d: 2 },
      { p: [-1.02, 2.30, -0.16], s: [0.92, 1.08, 0.86], r: 0.88, rot: [0.18, -0.42, -0.05], c: 6, d: 2 }
    ];

    formations.forEach((f, index) => {
      outcrop.add(createRock({
        position: new THREE.Vector3(...f.p),
        scale: new THREE.Vector3(...f.s),
        radius: f.r,
        seed: 3.7 + index * 2.41,
        rotation: new THREE.Euler(...f.rot),
        cavities: f.c,
        detail: f.d,
        materialIndex: index
      }));
    });

    for (let i = 0; i < 27; i++) {
      const angle = random() * Math.PI * 2;
      const distance = 2.5 + random() * 2.6;
      const radius = 0.16 + random() * 0.34;
      const scale = new THREE.Vector3(
        0.75 + random() * 0.8,
        0.55 + random() * 0.65,
        0.72 + random() * 0.7
      );
      outcrop.add(createRock({
        position: new THREE.Vector3(
          Math.cos(angle) * distance,
          radius * scale.y * 0.67 - 0.04,
          Math.sin(angle) * distance * 0.72
        ),
        scale,
        radius,
        seed: 61 + i * 1.93,
        rotation: new THREE.Euler(random() * 1.5, random() * Math.PI, random() * 1.5),
        cavities: random() > 0.45 ? 1 : 0,
        detail: 1,
        materialIndex: i + 1
      }));
    }

    const groundGeometry = new THREE.PlaneGeometry(45, 45, 48, 48);
    const groundPosition = groundGeometry.attributes.position;
    for (let i = 0; i < groundPosition.count; i++) {
      const x = groundPosition.getX(i);
      const y = groundPosition.getY(i);
      const distance = Math.sqrt(x * x + y * y);
      const height =
        Math.sin(x * 0.77) * Math.cos(y * 0.63) * 0.045 +
        Math.sin(x * 2.1 + y * 1.7) * 0.018 -
        Math.exp(-distance * 0.22) * 0.04;
      groundPosition.setZ(i, height);
    }
    groundGeometry.computeVertexNormals();

    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x171614,
      roughness: 1,
      metalness: 0
    });
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.08;
    ground.receiveShadow = true;
    scene.add(ground);

    const dustGeometry = new THREE.BufferGeometry();
    const dustPositions = [];
    for (let i = 0; i < 160; i++) {
      const angle = random() * Math.PI * 2;
      const distance = 2.3 + random() * 8;
      dustPositions.push(
        Math.cos(angle) * distance,
        0.005 + random() * 0.018,
        Math.sin(angle) * distance
      );
    }
    dustGeometry.setAttribute('position', new THREE.Float32BufferAttribute(dustPositions, 3));
    const dust = new THREE.Points(
      dustGeometry,
      new THREE.PointsMaterial({
        color: 0x6d5c4d,
        size: 0.025,
        transparent: true,
        opacity: 0.32,
        depthWrite: false
      })
    );
    scene.add(dust);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });

    animate();
  </script>
</body>
</html>
