<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arctic Ice Floe Night</title>
<style>
  html,body{margin:0;overflow:hidden;background:#020713}
  canvas{display:block}
  #caption{position:fixed;left:22px;bottom:18px;color:#cbe8f6;font:12px/1.4 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;opacity:.65;pointer-events:none}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="caption">Arctic Ice Floe Night</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x071222, 0.012);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 220);
camera.position.set(17, 11, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.25;
controls.minDistance = 10;
controls.maxDistance = 44;
controls.maxPolarAngle = Math.PI * 0.48;

let seed = 8451923;
function rand() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function range(a, b) { return a + (b - a) * rand(); }
function choice(a) { return a[Math.floor(rand() * a.length)]; }

const sky = new THREE.Mesh(
  new THREE.SphereGeometry(105, 48, 30),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {},
    vertexShader: `varying vec3 vP; void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader: `
      varying vec3 vP;
      void main(){
        float h=normalize(vP).y*.5+.5;
        vec3 low=vec3(.015,.045,.09);
        vec3 mid=vec3(.018,.075,.14);
        vec3 high=vec3(.002,.008,.025);
        vec3 col=mix(low,mid,smoothstep(.12,.48,h));
        col=mix(col,high,smoothstep(.53,1.,h));
        gl_FragColor=vec4(col,1.);
      }`
  })
);
scene.add(sky);

const hemi = new THREE.HemisphereLight(0x6597b8, 0x07111c, 1.3);
scene.add(hemi);

const moonLight = new THREE.DirectionalLight(0xb8dfff, 2.4);
moonLight.position.set(-18, 25, 11);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
moonLight.shadow.camera.left = -28;
moonLight.shadow.camera.right = 28;
moonLight.shadow.camera.top = 28;
moonLight.shadow.camera.bottom = -28;
moonLight.shadow.bias = -0.0003;
scene.add(moonLight);

const moon = new THREE.Mesh(
  new THREE.SphereGeometry(1.35, 32, 20),
  new THREE.MeshBasicMaterial({ color: 0xe4f5ff })
);
moon.position.set(-22, 25, -42);
scene.add(moon);

const waterMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x061524,
  roughness: 0.18,
  metalness: 0.16,
  clearcoat: 0.75,
  clearcoatRoughness: 0.22
});
const water = new THREE.Mesh(new THREE.PlaneGeometry(170, 170, 1, 1), waterMaterial);
water.rotation.x = -Math.PI / 2;
water.position.y = -0.45;
water.receiveShadow = true;
scene.add(water);

const waterLines = new THREE.Group();
scene.add(waterLines);
for (let i = 0; i < 100; i++) {
  const x = range(-65, 65), z = range(-62, 62);
  const length = range(0.4, 3.1);
  const g = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(x - length / 2, -0.425, z),
    new THREE.Vector3(x + length / 2, -0.425, z)
  ]);
  const line = new THREE.Line(g, new THREE.LineBasicMaterial({
    color: choice([0x163d52, 0x1d5970, 0x0d2b3d]),
    transparent: true,
    opacity: range(0.16, 0.42)
  }));
  waterLines.add(line);
}

function canvasTexture(draw, size = 256) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  draw(x, size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const iceTexture = canvasTexture((x, s) => {
  x.fillStyle = '#d9f6ff';
  x.fillRect(0, 0, s, s);
  for (let i = 0; i < 100; i++) {
    x.strokeStyle = `rgba(90,170,205,${range(.03,.14)})`;
    x.lineWidth = range(.3, 1.5);
    x.beginPath();
    x.moveTo(range(0, s), range(0, s));
    x.lineTo(range(0, s), range(0, s));
    x.stroke();
  }
}, 384);
iceTexture.wrapS = iceTexture.wrapT = THREE.RepeatWrapping;
iceTexture.repeat.set(2, 2);

const iceTop = new THREE.MeshStandardMaterial({
  color: 0xd8f6ff,
  map: iceTexture,
  roughness: 0.7,
  metalness: 0.02
});
const iceSide = new THREE.MeshStandardMaterial({
  color: 0x5cb6d7,
  roughness: 0.56,
  metalness: 0.02
});
const iceUnder = new THREE.MeshStandardMaterial({
  color: 0x14628e,
  roughness: 0.48,
  metalness: 0.05
});

function floeGeometry(radius, segments = 10) {
  const shape = new THREE.Shape();
  const pts = [];
  for (let i = 0; i < segments; i++) {
    const a = i / segments * Math.PI * 2;
    const r = radius * range(.76, 1.16);
    pts.push(new THREE.Vector2(Math.cos(a) * r, Math.sin(a) * r * range(.75, 1.02)));
  }
  shape.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) shape.lineTo(pts[i].x, pts[i].y);
  shape.closePath();
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: range(.38, .72),
    bevelEnabled: true,
    bevelSegments: 2,
    bevelSize: .1,
    bevelThickness: .08
  });
  geometry.rotateX(Math.PI / 2);
  geometry.translate(0, 0, 0);
  return geometry;
}

const floes = [];
function createFloe(x, z, radius, rotation = 0) {
  const mesh = new THREE.Mesh(floeGeometry(radius), [iceTop, iceSide, iceUnder]);
  mesh.position.set(x, -0.12, z);
  mesh.rotation.y = rotation;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  floes.push({ mesh, phase: rand() * Math.PI * 2, baseY: -0.12 });
  return mesh;
}

const mainFloe = createFloe(0, 1.2, 5.55, .1);
for (let i = 0; i < 22; i++) {
  const a = range(0, Math.PI * 2);
  const d = range(8, 43);
  createFloe(Math.cos(a) * d, Math.sin(a) * d + 1, range(.55, 3.5), range(0, Math.PI * 2));
}

function addIceberg(x, z, scale) {
  const group = new THREE.Group();
  const geo = new THREE.IcosahedronGeometry(1, 2);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i);
    const f = y > 0 ? range(.82, 1.28) : range(.55, .85);
    pos.setX(i, pos.getX(i) * f);
    pos.setZ(i, pos.getZ(i) * f);
    pos.setY(i, y * range(.85, 1.55));
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  const ice = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color: 0x9fe3f6, roughness: .62, flatShading: true
  }));
  ice.scale.set(scale * 1.25, scale * 2.35, scale);
  ice.position.y = scale * .68 - .45;
  ice.castShadow = true;
  ice.receiveShadow = true;
  group.add(ice);

  const blue = new THREE.Mesh(
    new THREE.CylinderGeometry(scale * .65, scale * .88, scale * .55, 10),
    iceUnder
  );
  blue.position.y = -scale * .15 - .42;
  blue.rotation.y = range(0, Math.PI);
  group.add(blue);
  group.position.set(x, 0, z);
  group.rotation.y = range(0, Math.PI);
  scene.add(group);
}
addIceberg(-11, -12, 3.6);
addIceberg(14, -16, 4.4);
addIceberg(-25, 13, 5.8);
addIceberg(26, 17, 3.1);

function sphere(parent, radius, color, x, y, z, sx = 1, sy = 1, sz = 1) {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(radius, 20, 14),
    new THREE.MeshStandardMaterial({ color, roughness: .76 })
  );
  m.position.set(x, y, z);
  m.scale.set(sx, sy, sz);
  m.castShadow = true;
  parent.add(m);
  return m;
}

function cylinder(parent, r1, r2, h, color, x, y, z, rx = 0, ry = 0, rz = 0) {
  const m = new THREE.Mesh(
    new THREE.CylinderGeometry(r1, r2, h, 12),
    new THREE.MeshStandardMaterial({ color, roughness: .74 })
  );
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  m.castShadow = true;
  parent.add(m);
  return m;
}

function polarBear(x, z, s, cub = false) {
  const g = new THREE.Group();
  const fur = cub ? 0xe7edf0 : 0xf6f6ee;
  const cream = cub ? 0xc5d3d5 : 0xe0e7e4;
  sphere(g, 1, fur, 0, 1.08 * s, 0, 1.3 * s, .72 * s, .7 * s);
  sphere(g, .55, fur, .92 * s, 1.35 * s, .03 * s, 1.12 * s, .78 * s, .74 * s);
  sphere(g, .18, cream, 1.34 * s, 1.24 * s, .03 * s, 1.22 * s, .58 * s, .62 * s);
  sphere(g, .09, 0x17232a, 1.51 * s, 1.27 * s, .03 * s, 1, .75, 1);
  sphere(g, .10, fur, .77 * s, 1.79 * s, -.29 * s);
  sphere(g, .10, fur, .77 * s, 1.79 * s, .29 * s);
  for (const zz of [-.36, .36]) {
    cylinder(g, .14 * s, .17 * s, .76 * s, fur, -.46 * s, .55 * s, zz * s, 0, 0, 0);
    cylinder(g, .14 * s, .17 * s, .76 * s, fur, .47 * s, .55 * s, zz * s, 0, 0, 0);
    sphere(g, .16, 0x21313a, -.46 * s, .18 * s, zz * s, 1.25, .48, 1);
    sphere(g, .16, 0x21313a, .47 * s, .18 * s, zz * s, 1.25, .48, 1);
  }
  const tail = sphere(g, .17, fur, -1.18 * s, 1.12 * s, 0, 1.5, .75, .75);
  tail.rotation.z = -.25;
  g.position.set(x, .18, z);
  g.rotation.y = cub ? -1.2 : .32;
  scene.add(g);
  return g;
}

const adultBear = polarBear(-.55, 1.5, 1.08, false);
const cubBear = polarBear(1.65, .3, .62, true);

const snowMat = new THREE.MeshStandardMaterial({ color: 0xd9f1f5, roughness: .87 });
const igloo = new THREE.Group();
const dome = new THREE.Mesh(
  new THREE.SphereGeometry(2.25, 32, 16, 0, Math.PI * 2, 0, Math.PI * .5),
  snowMat
);
dome.position.y = -.36;
dome.castShadow = true;
igloo.add(dome);

const tunnel = new THREE.Mesh(
  new THREE.CylinderGeometry(.72, .72, 1.65, 20, 1, false, 0, Math.PI),
  snowMat
);
tunnel.rotation.z = Math.PI / 2;
tunnel.rotation.y = Math.PI;
tunnel.position.set(1.95, -.02, .03);
tunnel.castShadow = true;
igloo.add(tunnel);

const doorGlow = new THREE.Mesh(
  new THREE.CircleGeometry(.48, 20),
  new THREE.MeshBasicMaterial({ color: 0xffba61, transparent: true, opacity: .96 })
);
doorGlow.position.set(2.79, .08, 0);
doorGlow.rotation.y = Math.PI / 2;
igloo.add(doorGlow);

for (let ring = 0; ring < 5; ring++) {
  const y = -.2 + ring * .41;
  const r = 2.22 * Math.cos((y + .36) / 2.25 * Math.PI * .5);
  const line = new THREE.Mesh(
    new THREE.TorusGeometry(Math.max(.1, r), .022, 6, 32),
    new THREE.MeshStandardMaterial({ color: 0x94c7d5, roughness: .7 })
  );
  line.rotation.x = Math.PI / 2;
  line.position.y = y;
  igloo.add(line);
}
igloo.position.set(-11, -.05, 6);
igloo.rotation.y = -.48;
scene.add(igloo);

const iglooLamp = new THREE.PointLight(0xffa452, 1.8, 11, 2);
iglooLamp.position.set(-8.8, 1.1, 5);
scene.add(iglooLamp);

function seal(x, z, scale, angle) {
  const g = new THREE.Group();
  const dark = 0x465d66;
  sphere(g, .56, dark, 0, .18, 0, 1.5 * scale, .56 * scale, .76 * scale);
  sphere(g, .31, 0x607984, .72 * scale, .23, 0, .85 * scale, .72 * scale, .75 * scale);
  sphere(g, .045, 0x10191d, .95 * scale, .34, -.16 * scale);
  sphere(g, .045, 0x10191d, .95 * scale, .34, .16 * scale);
  sphere(g, .075, 0x26363d, 1.04 * scale, .18, 0, 1.2, .45, 1);
  g.position.set(x, -.12, z);
  g.rotation.y = angle;
  scene.add(g);
  return g;
}

const breathingHole = new THREE.Mesh(
  new THREE.CircleGeometry(1.15, 32),
  new THREE.MeshBasicMaterial({ color: 0x020b10, transparent: true, opacity: .95 })
);
breathingHole.rotation.x = -Math.PI / 2;
breathingHole.position.set(7.4, -.426, 4.3);
scene.add(breathingHole);

const holeRim = new THREE.Mesh(
  new THREE.TorusGeometry(1.17, .11, 10, 32),
  new THREE.MeshStandardMaterial({ color: 0x8ed7eb, roughness: .52 })
);
holeRim.rotation.x = Math.PI / 2;
holeRim.position.copy(breathingHole.position);
scene.add(holeRim);

const sealA = seal(6.25, 4.2, 1, .2);
const sealB = seal(8.6, 4.85, .78, -2.3);

const starGeo = new THREE.BufferGeometry();
const starPos = [];
const starColors = [];
for (let i = 0; i < 1700; i++) {
  const r = range(55, 91);
  const a = range(0, Math.PI * 2);
  const y = range(5, 62);
  starPos.push(Math.cos(a) * r, y, Math.sin(a) * r);
  const c = new THREE.Color().setHSL(range(.53, .63), range(.25, .65), range(.65, 1));
  starColors.push(c.r, c.g, c.b);
}
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
starGeo.setAttribute('color', new THREE.Float32BufferAttribute(starColors, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
  size: .16, vertexColors: true, transparent: true, opacity: .9, sizeAttenuation: true
}));
scene.add(stars);

const reflectedStars = new THREE.Group();
for (let i = 0; i < 75; i++) {
  const x = range(-38, 38), z = range(-36, 36);
  const sparkle = new THREE.Mesh(
    new THREE.PlaneGeometry(range(.03, .11), range(.32, 1.15)),
    new THREE.MeshBasicMaterial({
      color: choice([0x5ebee3, 0x96dcff, 0x5498c3]),
      transparent: true,
      opacity: range(.18, .52),
      side: THREE.DoubleSide
    })
  );
  sparkle.rotation.x = -Math.PI / 2;
  sparkle.position.set(x, -.414, z);
  reflectedStars.add(sparkle);
}
scene.add(reflectedStars);

const auroraGroup = new THREE.Group();
scene.add(auroraGroup);
const auroraMaterials = [];
function makeAurora(color, offset) {
  const width = 72, bands = 90;
  const vertices = [], uvs = [], indices = [];
  for (let i = 0; i <= bands; i++) {
    const x = -width / 2 + i / bands * width;
    for (let j = 0; j <= 1; j++) {
      vertices.push(x, 11 + j * 18, -34 + offset);
      uvs.push(i / bands, j);
    }
  }
  for (let i = 0; i < bands; i++) {
    const a = i * 2;
    indices.push(a, a + 2, a + 1, a + 2, a + 3, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(indices);
  const mat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending,
    uniforms: { time: { value: 0 }, tint: { value: new THREE.Color(color) }, phase: { value: offset } },
    vertexShader: `
      uniform float time; uniform float phase; varying vec2 vUv;
      void main(){
        vUv=uv;
        vec3 p=position;
        float wave=sin(p.x*.16+time*.33+phase)*2.1+sin(p.x*.055-time*.19)*2.7;
        p.z+=wave*(.25+vUv.y);
        p.y+=sin(p.x*.23+time*.42+phase)*1.5*(1.-vUv.y);
        gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);
      }`,
    fragmentShader: `
      uniform vec3 tint; uniform float time; varying vec2 vUv;
      void main(){
        float curtain=.35+.65*sin(vUv.x*21.+time*.38)*sin(vUv.x*7.-time*.21);
        float edge=smoothstep(0.,.16,vUv.y)*(1.-smoothstep(.68,1.,vUv.y));
        float fade=smoothstep(0.,.05,vUv.x)*(1.-smoothstep(.91,1.,vUv.x));
        gl_FragColor=vec4(tint, edge*fade*curtain*.36);
      }`
  });
  const mesh = new THREE.Mesh(g, mat);
  mesh.rotation.y = offset * .025;
  auroraGroup.add(mesh);
  auroraMaterials.push(mat);
}
makeAurora(0x42e99a, 0);
makeAurora(0x8368e9, 6);
makeAurora(0x61dcae, -7);

const snowflakes = new THREE.Group();
scene.add(snowflakes);
for (let i = 0; i < 180; i++) {
  const flake = new THREE.Mesh(
    new THREE.SphereGeometry(range(.012, .035), 6, 5),
    new THREE.MeshBasicMaterial({ color: 0xcff3ff, transparent: true, opacity: range(.25, .75) })
  );
  flake.position.set(range(-32, 32), range(.5, 18), range(-30, 28));
  flake.userData.speed = range(.08, .28);
  flake.userData.phase = rand() * 10;
  snowflakes.add(flake);
}

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  water.material.roughness = .16 + Math.sin(t * .35) * .035;
  waterLines.children.forEach((line, i) => {
    line.position.y = Math.sin(t * .75 + i * .71) * .012;
    line.material.opacity = .18 + .16 * (Math.sin(t + i) * .5 + .5);
  });

  floes.forEach((f, i) => {
    f.mesh.position.y = f.baseY + Math.sin(t * .52 + f.phase) * .035;
    f.mesh.rotation.z = Math.sin(t * .37 + f.phase) * .006;
    f.mesh.rotation.x = Math.sin(t * .29 + i) * .004;
  });

  adultBear.rotation.z = Math.sin(t * .7) * .012;
  cubBear.position.y = .18 + Math.abs(Math.sin(t * 1.15)) * .035;
  sealA.position.y = -.12 + Math.sin(t * 1.3) * .055;
  sealB.rotation.z = Math.sin(t * 1.55) * .08;

  auroraMaterials.forEach((m, i) => m.uniforms.time.value = t * (1 + i * .13));
  auroraGroup.rotation.y = Math.sin(t * .08) * .09;
  stars.rotation.y = t * .003;
  reflectedStars.children.forEach((s, i) => {
    s.material.opacity = .14 + .24 * (Math.sin(t * 1.7 + i * 1.91) * .5 + .5);
  });

  snowflakes.children.forEach((f) => {
    f.position.y -= f.userData.speed * .025;
    f.position.x += Math.sin(t + f.userData.phase) * .0018;
    if (f.position.y < -.3) {
      f.position.y = 18;
      f.position.x = range(-32, 32);
      f.position.z = range(-30, 28);
    }
  });

  controls.update();
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
