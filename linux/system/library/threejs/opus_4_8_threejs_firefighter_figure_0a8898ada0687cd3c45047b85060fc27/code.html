<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Firefighter in Turnout Gear — three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e0f12; }
  #app { position: fixed; inset: 0; }
  #hint {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: #9aa1ab; letter-spacing: .02em; user-select: none; pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  #hint b { color: #d7dbe0; font-weight: 600; }
</style>
</head>
<body>
<div id="app"></div>
<div id="hint"><b>Firefighter — turnout gear</b> · drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------------------------------------------------------------------
   Renderer
--------------------------------------------------------------------------- */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

/* ---------------------------------------------------------------------------
   Scene + neutral dark studio backdrop
--------------------------------------------------------------------------- */
const scene = new THREE.Scene();

function makeStudioBackground() {
  const c = document.createElement('canvas');
  c.width = 16; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0.0, '#282b31');
  g.addColorStop(0.5, '#181a1e');
  g.addColorStop(1.0, '#0c0d10');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 16, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
scene.background = makeStudioBackground();

/* ---------------------------------------------------------------------------
   Camera + Controls
--------------------------------------------------------------------------- */
const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(2.6, 1.45, 3.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.target.set(0, 1.0, 0);
controls.minDistance = 2.2;
controls.maxDistance = 8.0;
controls.maxPolarAngle = Math.PI * 0.52;
controls.update();

/* ---------------------------------------------------------------------------
   Lighting: hemisphere fill + directional key + fill + rim
--------------------------------------------------------------------------- */
const hemi = new THREE.HemisphereLight(0x9fb3cc, 0x22201d, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2e0, 2.5);
key.position.set(3.2, 5.2, 3.6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 16;
key.shadow.camera.left = -2.2;
key.shadow.camera.right = 2.2;
key.shadow.camera.top = 2.6;
key.shadow.camera.bottom = -0.6;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0x88a0c0, 0.6);
fill.position.set(-4.0, 2.6, 2.2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xbfd0ff, 1.5);
rim.position.set(-2.4, 3.8, -4.2);
scene.add(rim);

const warmAccent = new THREE.PointLight(0xff7a3c, 0.35, 12, 2);
warmAccent.position.set(1.8, 0.7, -2.2);
scene.add(warmAccent);

/* ---------------------------------------------------------------------------
   Ground plane — receives shadows only
--------------------------------------------------------------------------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------------------------------------------------------------------
   Materials
--------------------------------------------------------------------------- */
const coatMat = new THREE.MeshStandardMaterial({ color: 0xc7a367, roughness: 0.86, metalness: 0.04 });
const coatDarkMat = new THREE.MeshStandardMaterial({ color: 0x9c7f4c, roughness: 0.9, metalness: 0.04 });

const limeMat = new THREE.MeshStandardMaterial({
  color: 0xcfe22a, roughness: 0.5, metalness: 0.0,
  emissive: 0x2c3300, emissiveIntensity: 0.55
});
const silverMat = new THREE.MeshStandardMaterial({
  color: 0xe4ebef, roughness: 0.22, metalness: 0.75,
  emissive: 0x1a2230, emissiveIntensity: 0.35
});

const helmetMat = new THREE.MeshPhysicalMaterial({
  color: 0xba1f24, roughness: 0.33, metalness: 0.0,
  clearcoat: 1.0, clearcoatRoughness: 0.18, side: THREE.DoubleSide
});
const helmetDarkMat = new THREE.MeshPhysicalMaterial({
  color: 0x7d1418, roughness: 0.4, metalness: 0.0, clearcoat: 1.0, clearcoatRoughness: 0.25
});
const brassMat = new THREE.MeshStandardMaterial({ color: 0xcf9a2b, roughness: 0.32, metalness: 0.9 });

const gloveMat = new THREE.MeshStandardMaterial({ color: 0x2b2621, roughness: 0.78, metalness: 0.05 });
const bootMat = new THREE.MeshPhysicalMaterial({ color: 0x161619, roughness: 0.45, metalness: 0.1, clearcoat: 0.7, clearcoatRoughness: 0.4 });
const soleMat = new THREE.MeshStandardMaterial({ color: 0x33343a, roughness: 0.85, metalness: 0.05 });

const tankMat = new THREE.MeshStandardMaterial({ color: 0x1f8f96, roughness: 0.3, metalness: 0.85 });
const tankBandMat = new THREE.MeshStandardMaterial({ color: 0xe4c534, roughness: 0.4, metalness: 0.5 });
const metalMat = new THREE.MeshStandardMaterial({ color: 0x8b9096, roughness: 0.35, metalness: 0.9 });
const strapMat = new THREE.MeshStandardMaterial({ color: 0x1c1c1f, roughness: 0.8, metalness: 0.1 });

const skinMat = new THREE.MeshStandardMaterial({ color: 0xc79a75, roughness: 0.72, metalness: 0.0 });
const hoodMat = new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.9, metalness: 0.0 });
const maskGlassMat = new THREE.MeshPhysicalMaterial({ color: 0x0e1114, roughness: 0.12, metalness: 0.2, clearcoat: 1.0, clearcoatRoughness: 0.08 });
const maskRimMat = new THREE.MeshStandardMaterial({ color: 0x101012, roughness: 0.6, metalness: 0.2 });

/* ---------------------------------------------------------------------------
   Geometry helpers
--------------------------------------------------------------------------- */
const capsule = (r, l) => new THREE.CapsuleGeometry(r, l, 10, 24);
const sphere  = (r)    => new THREE.SphereGeometry(r, 30, 22);
const cyl     = (rt, rb, h, open = false) => new THREE.CylinderGeometry(rt, rb, h, 34, 1, open);
const box     = (w, h, d) => new THREE.BoxGeometry(w, h, d);

const figure = new THREE.Group();
scene.add(figure);

function mesh(geo, mat, x = 0, y = 0, z = 0, parent = figure) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

// open-ended cylinder ring hugging a surface
function ring(parent, radius, y, height, mat) {
  const m = new THREE.Mesh(cyl(radius, radius, height, true), mat);
  m.position.y = y;
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

// reflective "triple trim": silver band flanked by two lime edges
function tripleTrim(parent, radius, y) {
  ring(parent, radius * 1.004, y, 0.05, silverMat);
  ring(parent, radius * 1.006, y + 0.037, 0.013, limeMat);
  ring(parent, radius * 1.006, y - 0.037, 0.013, limeMat);
}

/* ---------------------------------------------------------------------------
   TORSO — bulky turnout coat with reflective bands
   Built in a group scaled to an oval (wider than deep); trims inherit scale.
--------------------------------------------------------------------------- */
const torso = new THREE.Group();
torso.position.set(0, 1.16, 0);
torso.scale.set(1.06, 1.0, 0.66);
figure.add(torso);

// coat body (barrel/cone), local center at 0, spans -0.30..+0.30
mesh(cyl(0.205, 0.245, 0.60), coatMat, 0, 0, 0, torso);
// rounded chest / upper bulk
mesh(sphere(0.205), coatMat, 0, 0.30, 0, torso);
// flared hem cap
mesh(cyl(0.245, 0.25, 0.05), coatDarkMat, 0, -0.315, 0, torso);

// reflective bands (chest + hem)  radius r(y) = 0.225 - 0.0667*y
tripleTrim(torso, 0.220, 0.08);
tripleTrim(torso, 0.242, -0.26);

// collar (stand-up)
ring(torso, 0.19, 0.315, 0.10, coatDarkMat);

// storm flap / front closure
mesh(box(0.06, 0.55, 0.045), coatDarkMat, 0, 0.0, 0.205, torso);

// belt + buckle
ring(torso, 0.244, -0.185, 0.06, strapMat);
mesh(box(0.09, 0.05, 0.03), metalMat, 0, -0.185, 0.21, torso);

/* ---------------------------------------------------------------------------
   ARMS — bulky sleeves, cuff trim, thick gloves
--------------------------------------------------------------------------- */
function buildArm(sign) {
  const arm = new THREE.Group();
  mesh(sphere(0.128), coatMat, 0, 0.0, 0, arm);          // shoulder pad
  mesh(capsule(0.098, 0.20), coatMat, 0, -0.19, 0, arm); // upper arm
  mesh(sphere(0.096), coatMat, 0, -0.36, 0, arm);        // elbow
  mesh(capsule(0.088, 0.18), coatMat, 0, -0.52, 0, arm); // forearm

  tripleTrim(arm, 0.093, -0.60);                         // sleeve reflective
  mesh(cyl(0.092, 0.098, 0.05), coatDarkMat, 0, -0.66, 0, arm); // cuff

  // thick glove
  mesh(capsule(0.075, 0.055), gloveMat, 0, -0.735, 0.01, arm);
  mesh(sphere(0.072), gloveMat, 0, -0.80, 0.02, arm);          // knuckles
  mesh(capsule(0.03, 0.045), gloveMat, -sign * 0.055, -0.72, 0.045, arm); // thumb

  arm.position.set(sign * 0.238, 1.40, 0);
  arm.rotation.z = sign * 0.14;
  arm.rotation.x = -0.04;
  return arm;
}
figure.add(buildArm(1));
figure.add(buildArm(-1));

/* ---------------------------------------------------------------------------
   LEGS — turnout pants with cuff trim
--------------------------------------------------------------------------- */
function buildLeg(sign) {
  const leg = new THREE.Group();
  mesh(capsule(0.11, 0.42), coatMat, 0, 0.62, 0, leg);   // thigh -> shin
  mesh(sphere(0.108), coatMat, 0, 0.60, 0, leg);         // knee bulk
  tripleTrim(leg, 0.113, 0.40);                          // cuff reflective
  leg.position.set(sign * 0.12, 0, 0);
  return leg;
}
figure.add(buildLeg(1));
figure.add(buildLeg(-1));

// hip block (mostly hidden by coat)
mesh(box(0.30, 0.16, 0.20), coatMat, 0, 0.93, 0);

/* ---------------------------------------------------------------------------
   BOOTS — heavy rubber boots
--------------------------------------------------------------------------- */
function buildBoot(sign) {
  const boot = new THREE.Group();
  mesh(cyl(0.098, 0.108, 0.26), bootMat, 0, 0.21, 0, boot);   // shaft
  mesh(sphere(0.108), bootMat, 0, 0.09, 0, boot);             // ankle
  mesh(box(0.135, 0.11, 0.24), bootMat, 0, 0.06, 0.075, boot);// foot
  mesh(cyl(0.055, 0.055, 0.135), bootMat, 0, 0.055, 0.195, boot).rotation.z = Math.PI / 2; // rounded toe
  mesh(box(0.15, 0.035, 0.30), soleMat, 0, 0.017, 0.07, boot);// sole
  mesh(box(0.13, 0.05, 0.09), soleMat, 0, 0.045, -0.055, boot);// heel
  boot.position.set(sign * 0.12, 0, 0);
  return boot;
}
figure.add(buildBoot(1));
figure.add(buildBoot(-1));

/* ---------------------------------------------------------------------------
   NECK / HEAD / NOMEX HOOD / SCBA FACE MASK
--------------------------------------------------------------------------- */
mesh(cyl(0.075, 0.085, 0.12), hoodMat, 0, 1.49, 0);   // neck (hood)
mesh(sphere(0.112), skinMat, 0, 1.62, 0);             // head

// nomex hood shrouds back/sides of head
const hood = mesh(sphere(0.122), hoodMat, 0, 1.63, -0.012);
hood.scale.set(1.0, 1.05, 1.02);

// SCBA full-face mask on the front
const mask = mesh(sphere(0.10, 24, 18), maskGlassMat, 0, 1.615, 0.05);
mask.scale.set(1.02, 1.12, 0.72);
const maskRim = mesh(new THREE.TorusGeometry(0.098, 0.014, 14, 30), maskRimMat, 0, 1.615, 0.045);
maskRim.scale.set(1.05, 1.15, 0.8);
// breathing regulator
mesh(cyl(0.032, 0.04, 0.05), maskRimMat, 0, 1.555, 0.115).rotation.x = Math.PI / 2;
mesh(box(0.05, 0.05, 0.04), strapMat, 0, 1.545, 0.14);

/* ---------------------------------------------------------------------------
   HELMET — wide-brim classic fire helmet (lathe) + front shield + crest
--------------------------------------------------------------------------- */
const helmetProfile = [
  [0.000, 0.150],[0.045, 0.147],[0.085, 0.137],[0.115, 0.115],[0.132, 0.088],
  [0.140, 0.055],[0.143, 0.030],[0.150, 0.026],[0.196, 0.012],[0.232, 0.004],[0.242, -0.010]
].map(p => new THREE.Vector2(p[0], p[1]));

const helmetGroup = new THREE.Group();
helmetGroup.position.set(0, 1.662, 0.004);
helmetGroup.scale.set(1.0, 1.03, 1.17); // elongate front-back (beavertail)
figure.add(helmetGroup);

const helmet = mesh(new THREE.LatheGeometry(helmetProfile, 56), helmetMat, 0, 0, 0, helmetGroup);

// dome ribs
for (let i = 0; i < 3; i++) {
  const r = 0.135 - i * 0.028;
  const rib = mesh(new THREE.TorusGeometry(r, 0.006, 10, 40), helmetDarkMat, 0, 0.055 + i * 0.028, 0, helmetGroup);
  rib.rotation.x = Math.PI / 2;
}

// crest ridge over the top (front-to-back arch)
const crest = mesh(new THREE.TorusGeometry(0.108, 0.014, 12, 32, Math.PI), helmetDarkMat, 0, 0.028, 0, helmetGroup);
crest.rotation.y = Math.PI / 2;

// front shield (badge)
const shieldShape = new THREE.Shape();
shieldShape.moveTo(-0.058, 0.072);
shieldShape.lineTo(0.058, 0.072);
shieldShape.lineTo(0.058, -0.02);
shieldShape.quadraticCurveTo(0.058, -0.052, 0.0, -0.082);
shieldShape.quadraticCurveTo(-0.058, -0.052, -0.058, -0.02);
shieldShape.closePath();
const shieldGeo = new THREE.ExtrudeGeometry(shieldShape, { depth: 0.02, bevelEnabled: true, bevelThickness: 0.006, bevelSize: 0.006, bevelSegments: 2 });
const shield = mesh(shieldGeo, brassMat, 0, 0.082, 0.132, helmetGroup);
shield.rotation.x = -0.62;
shield.scale.set(0.95, 0.95, 1);

/* ---------------------------------------------------------------------------
   SCBA OXYGEN TANK + HARNESS on the back
--------------------------------------------------------------------------- */
// backplate
mesh(box(0.30, 0.44, 0.05), strapMat, 0, 1.24, -0.205);

// tank cylinder
const tank = mesh(capsule(0.088, 0.30), tankMat, 0, 1.22, -0.27);
mesh(cyl(0.088, 0.088, 0.06, true), tankBandMat, 0, 1.30, -0.27);      // yellow band
mesh(cyl(0.088, 0.088, 0.06, true), tankBandMat, 0, 1.14, -0.27);

// valve + handwheel
mesh(cyl(0.028, 0.032, 0.06), metalMat, 0, 1.47, -0.27);
const wheel = mesh(new THREE.TorusGeometry(0.045, 0.011, 12, 26), metalMat, 0, 1.50, -0.27);
wheel.rotation.x = Math.PI / 2;

// over-shoulder straps to the tank
mesh(box(0.075, 0.06, 0.34), strapMat, 0.11, 1.44, -0.03);
mesh(box(0.075, 0.06, 0.34), strapMat, -0.11, 1.44, -0.03);

// front harness straps
mesh(box(0.058, 0.42, 0.035), strapMat, 0.115, 1.22, 0.15);
mesh(box(0.058, 0.42, 0.035), strapMat, -0.115, 1.22, 0.15);

// chest regulator + pressure gauge
mesh(box(0.07, 0.08, 0.045), strapMat, 0.115, 1.30, 0.175);
const gauge = mesh(new THREE.TorusGeometry(0.028, 0.01, 12, 24), metalMat, -0.115, 1.27, 0.178);
mesh(cyl(0.024, 0.024, 0.012), silverMat, -0.115, 1.27, 0.178).rotation.x = Math.PI / 2;

/* ---------------------------------------------------------------------------
   Center the figure over the origin
--------------------------------------------------------------------------- */
const bbox = new THREE.Box3().setFromObject(figure);
const center = new THREE.Vector3();
bbox.getCenter(center);
figure.position.x -= center.x;
figure.position.z -= center.z;
controls.target.set(0, (bbox.max.y + bbox.min.y) * 0.5, 0);
controls.update();

/* ---------------------------------------------------------------------------
   Resize + render loop
--------------------------------------------------------------------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
