<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Metro Carriage</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a1017;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
    }
    .caption {
      position: fixed;
      left: 22px;
      bottom: 18px;
      color: #c8d8e6;
      letter-spacing: .12em;
      font-size: 11px;
      text-transform: uppercase;
      opacity: .72;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="caption">METRO SERIES 160 · PROCEDURAL CARRIAGE STUDY</div>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a1017);
    scene.fog = new THREE.Fog(0x0a1017, 28,  seventyFive());

    function seventyFive() {
      return 75;
    }

    const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 160);
    camera.position.set(21, 12.5, 22);
    camera.lookAt(0, 3, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.45;
    controls.target.set(0, 3.25, 0);
    controls.minDistance = 13;
    controls.maxDistance = 53;
    controls.maxPolarAngle = Math.PI * 0.48;

    const palette = {
      body: 0xd9e1e4,
      bodyShade: 0xaebbc1,
      roof: 0xb4c1c6,
      blue: 0x1677a8,
      blueDark: 0x0c4d70,
      glass: 0x091b2a,
      glassGlow: 0x173b4c,
      rubber: 0x11181c,
      metal: 0x5d6a70,
      under: 0x2b363b,
      yellow: 0xf4bb38,
      red: 0xd84a48,
      white: 0xf0f4f2
    };

    const mat = {};
    mat.body = new THREE.MeshStandardMaterial({ color: palette.body, roughness: 0.55, metalness: 0.08 });
    mat.bodyShade = new THREE.MeshStandardMaterial({ color: palette.bodyShade, roughness: 0.65 });
    mat.roof = new THREE.MeshStandardMaterial({ color: palette.roof, roughness: 0.82, metalness: 0.16 });
    mat.blue = new THREE.MeshStandardMaterial({ color: palette.blue, roughness: 0.43, metalness: 0.12 });
    mat.blueDark = new THREE.MeshStandardMaterial({ color: palette.blueDark, roughness: 0.5, metalness: 0.18 });
    mat.glass = new THREE.MeshStandardMaterial({ color: palette.glass, roughness: 0.16, metalness: 0.35 });
    mat.glassGlow = new THREE.MeshStandardMaterial({
      color: palette.glassGlow,
      roughness: 0.1,
      metalness: 0.3,
      emissive: 0x09202d,
      emissiveIntensity: 0.65
    });
    mat.rubber = new THREE.MeshStandardMaterial({ color: palette.rubber, roughness: 0.88 });
    mat.metal = new THREE.MeshStandardMaterial({ color: palette.metal, roughness: 0.38, metalness: 0.72 });
    mat.under = new THREE.MeshStandardMaterial({ color: palette.under, roughness: 0.8, metalness: 0.15 });
    mat.yellow = new THREE.MeshStandardMaterial({ color: palette.yellow, roughness: 0.45 });
    mat.red = new THREE.MeshStandardMaterial({ color: palette.red, roughness: 0.35, emissive: 0x340808, emissiveIntensity: 0.3 });
    mat.white = new THREE.MeshStandardMaterial({ color: palette.white, roughness: 0.32 });
    mat.light = new THREE.MeshStandardMaterial({
      color: 0xeafaff,
      emissive: 0x9ddfff,
      emissiveIntensity: 3.4,
      roughness: 0.18
    });

    function addBox(parent, size, position, material, bevel = false) {
      const geometry = bevel
        ? new RoundedBoxGeometry(size[0], size[1], size[2], Math.min(size[0], size[1], size[2]) * 0.12, 3)
        : new THREE.BoxGeometry(size[0], size[1], size[2]);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(position[0], position[1], position[2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addCylinder(parent, radius, height, position, material, rotation = [0, 0, 0], segments = 24) {
      const geometry = new THREE.CylinderGeometry(radius, radius, height, segments);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(position[0], position[1], position[2]);
      mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    const train = new THREE.Group();
    train.position.y = 0.1;
    scene.add(train);

    const body = addBox(train, [24, 3.85, 3.42], [0, 4.05, 0], mat.body, true);
    body.castShadow = true;

    addBox(train, [23.35, 0.62, 3.52], [0, 2.55, 0], mat.bodyShade, true);
    addBox(train, [23.65, 0.26, 3.54], [0, 3.06, 0], mat.blue);
    addBox(train, [23.7, 0.14, 3.56], [0, 3.42, 0], mat.blueDark);
    addBox(train, [23.1, 0.16, 3.48], [0, 2.25, 0], mat.rubber);

    addBox(train, [22.95, 0.18, 3.45], [0, 5.77, 0], mat.roof);
    addBox(train, [22.45, 0.24, 3.18], [0, 5.94, 0], mat.roof, true);

    for (const side of [-1, 1]) {
      const z = side * 1.735;
      const windowXs = [-10.1, -7.9, -3.9, -1.55, 1.55, 3.9, 7.9, 10.1];

      for (const x of windowXs) {
        addBox(train, [1.92, 1.42, 0.11], [x, 4.48, z], mat.blueDark, true);
        addBox(train, [1.63, 1.12, 0.055], [x, 4.48, z + side * 0.065], mat.glassGlow, true);
        addBox(train, [0.055, 1.0, 0.06], [x - 0.58, 4.48, z + side * 0.105], mat.metal);
        addBox(train, [0.055, 1.0, 0.06], [x + 0.58, 4.48, z + side * 0.105], mat.metal);
      }

      const doorXs = [-5.85, 5.85];
      for (const x of doorXs) {
        addBox(train, [2.25, 2.55, 0.12], [x, 3.98, z + side * 0.015], mat.rubber, true);
        addBox(train, [0.94, 2.38, 0.16], [x - 0.53, 4.0, z + side * 0.09], mat.bodyShade, true);
        addBox(train, [0.94, 2.38, 0.16], [x + 0.53, 4.0, z + side * 0.09], mat.bodyShade, true);
        addBox(train, [0.79, 2.18, 0.07], [x - 0.53, 4.0, z + side * 0.185], mat.glass, true);
        addBox(train, [0.79, 2.18, 0.07], [x + 0.53, 4.0, z + side * 0.185], mat.glass, true);
        addBox(train, [0.07, 2.28, 0.08], [x, 4.0, z + side * 0.21], mat.blue);
        addBox(train, [2.0, 0.09, 0.1], [x, 2.7, z + side * 0.13], mat.yellow);
        addBox(train, [0.08, 0.18, 0.1], [x - 0.06, 4.05, z + side * 0.24], mat.yellow);
      }

      addBox(train, [22.3, 0.09, 0.06], [0, 5.3, z + side * 0.09], mat.metal);
      addBox(train, [22.5, 0.1, 0.07], [0, 2.92, z + side * 0.18], mat.blueDark);
    }

    for (const end of [-1, 1]) {
      const x = end * 12.02;
      addBox(train, [0.12, 2.25, 2.3], [x, 4.3, 0], mat.blueDark, true);
      addBox(train, [0.08, 1.28, 1.62], [x + end * 0.08, 4.62, 0], mat.glass, true);
      addBox(train, [0.1, 0.42, 0.46], [x + end * 0.11, 3.33, -0.82], mat.light, true);
      addBox(train, [0.1, 0.42, 0.46], [x + end * 0.11, 3.33, 0.82], mat.light, true);
      addBox(train, [0.1, 0.26, 0.36], [x + end * 0.12, 4.08, -0.91], mat.red, true);
      addBox(train, [0.1, 0.26, 0.36], [x + end * 0.12, 4.08, 0.91], mat.red, true);
      addBox(train, [0.22, 0.38, 2.25], [x - end * 0.09, 2.62, 0], mat.blue);
    }

    const roofUnits = [-7.4, 0, 7.4];
    for (const x of roofUnits) {
      addBox(train, [4.25, 0.48, 1.58], [x, 6.28, 0], mat.under, true);
      addBox(train, [3.82, 0.18, 1.3], [x, 6.58, 0], mat.roof, true);
      for (const ventX of [-1.3, -0.65, 0, 0.65, 1.3]) {
        addBox(train, [0.13, 0.08, 1.08], [x + ventX, 6.7, 0], mat.metal);
      }
      addCylinder(train, 0.18, 1.48, [x - 1.7, 6.47, 0], mat.metal, [0, 0, Math.PI / 2], 20);
      addCylinder(train, 0.18, 1.48, [x + 1.7, 6.47, 0], mat.metal, [0, 0, Math.PI / 2], 20);
    }

    addBox(train, [4.8, 0.52, 1.35], [-3.1, 6.25, 0], mat.under, true);
    addBox(train, [4.2, 0.14, 1.05], [-3.1, 6.57, 0], mat.blueDark, true);
    addBox(train, [0.15, 0.52, 1.4], [0, 6.35, 0], mat.metal);

    for (const x of [-8.5, -2.8, 2.8, 8.5]) {
      addBox(train, [2.8, 0.75, 1.65], [x, 1.63, 0], mat.under, true);
      addBox(train, [2.15, 0.22, 1.82], [x, 1.22, 0], mat.metal, true);
      addBox(train, [1.15, 0.3, 0.55], [x - 0.6, 1.0, 0], mat.under, true);
      addBox(train, [1.15, 0.3, 0.55], [x + 0.6, 1.0, 0], mat.under, true);
    }

    for (const x of [-8.7, -2.9, 2.9, 8.7]) {
      for (const side of [-1, 1]) {
        addCylinder(train, 0.72, 0.22, [x, 0.86, side * 1.45], mat.rubber, [Math.PI / 2, 0, 0], 32);
        addCylinder(train, 0.37, 0.24, [x, 0.86, side * 1.58], mat.metal, [Math.PI / 2, 0, 0], 24);
        addCylinder(train, 0.12, 0.28, [x, 0.86, side * 1.72], mat.rubber, [Math.PI / 2, 0, 0], 20);
      }
    }

    for (const x of [-9.1, 9.1]) {
      addBox(train, [0.18, 0.72, 2.35], [x, 1.58, 0], mat.metal, true);
      addBox(train, [0.32, 0.18, 2.65], [x, 2.0, 0], mat.rubber);
    }

    addBox(train, [0.32, 0.32, 2.8], [0, 6.45, 0], mat.metal, true);
    addBox(train, [3.0, 0.16, 0.16], [0, 6.82, 0], mat.metal);
    addBox(train, [0.16, 0.16, 1.35], [-1.42, 6.48, 0], mat.metal);
    addBox(train, [0.16, 0.16, 1.35], [1.42, 6.48, 0], mat.metal);

    const rail = addBox(scene, [42, 0.18, 0.18], [0, 0.13, 1.75], mat.metal);
    rail.receiveShadow = true;
    addBox(scene, [42, 0.18, 0.18], [0, 0.13, -1.75], mat.metal);
    addBox(scene, [42, 0.1, 5.5], [0, 0, 0], mat.rubber);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(120, 120),
      new THREE.MeshStandardMaterial({ color: 0x151d23, roughness: 0.93, metalness: 0.05 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.18;
    ground.receiveShadow = true;
    scene.add(ground);

    const hemisphere = new THREE.HemisphereLight(0x9bc4e0, 0x172027, 1.85);
    scene.add(hemisphere);

    const keyLight = new THREE.DirectionalLight(0xffe3bf, 3.5);
    keyLight.position.set(14, 25, 17);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -28;
    keyLight.shadow.camera.right = 28;
    keyLight.shadow.camera.top = 28;
    keyLight.shadow.camera.bottom = -12;
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 75;
    keyLight.shadow.bias = -0.00025;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x579dcc, 2.15);
    rimLight.position.set(-18, 10, -22);
    scene.add(rimLight);

    const frontGlow = new THREE.PointLight(0x6bd9ff, 9, 10, 2);
    frontGlow.position.set(12.4, 3.5, 0);
    scene.add(frontGlow);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
