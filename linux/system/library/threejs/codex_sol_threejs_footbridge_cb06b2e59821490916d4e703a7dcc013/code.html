<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedestrian Footbridge</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #b9d2df; }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 18px;
      bottom: 16px;
      color: rgba(255,255,255,.92);
      font: 12px/1.45 system-ui, sans-serif;
      letter-spacing: .08em;
      text-transform: uppercase;
      text-shadow: 0 1px 4px rgba(0,0,0,.45);
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Lightweight Warren-Truss Footbridge · 30 m span</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xb9d2df);
    scene.fog = new THREE.Fog(0xb9d2df, 48, 105);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 180);
    camera.position.set(24, 16, 25);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 3.1, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.42;
    controls.minDistance = 13;
    controls.maxDistance = 68;
    controls.maxPolarAngle = Math.PI * 0.48;

    const hemi = new THREE.HemisphereLight(0xdcefff, 0x61705a, 2.15);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff3dc, 3.2);
    sun.position.set(-18, 28, 17);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -36;
    sun.shadow.camera.right = 36;
    sun.shadow.camera.top = 27;
    sun.shadow.camera.bottom = -18;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 85;
    sun.shadow.bias = -0.00035;
    sun.shadow.normalBias = 0.025;
    scene.add(sun);

    const materials = {
      steel: new THREE.MeshStandardMaterial({
        color: 0x334c54,
        roughness: 0.38,
        metalness: 0.72
      }),
      steelEdge: new THREE.MeshStandardMaterial({
        color: 0x22383f,
        roughness: 0.32,
        metalness: 0.78
      }),
      galvanized: new THREE.MeshStandardMaterial({
        color: 0x9aa8a8,
        roughness: 0.42,
        metalness: 0.68
      }),
      timber: new THREE.MeshStandardMaterial({
        color: 0x9b6840,
        roughness: 0.78,
        metalness: 0.02
      }),
      timberDark: new THREE.MeshStandardMaterial({
        color: 0x664127,
        roughness: 0.84
      }),
      concrete: new THREE.MeshStandardMaterial({
        color: 0xa8a69b,
        roughness: 0.92,
        metalness: 0
      }),
      concreteDark: new THREE.MeshStandardMaterial({
        color: 0x777a72,
        roughness: 0.94
      }),
      grass: new THREE.MeshStandardMaterial({
        color: 0x5e7650,
        roughness: 1
      }),
      soil: new THREE.MeshStandardMaterial({
        color: 0x665747,
        roughness: 1
      }),
      water: new THREE.MeshPhysicalMaterial({
        color: 0x547f88,
        roughness: 0.2,
        metalness: 0.02,
        transmission: 0.08,
        transparent: true,
        opacity: 0.82,
        clearcoat: 0.65,
        clearcoatRoughness: 0.18,
        side: THREE.DoubleSide
      })
    };

    function addBox(name, size, position, material, parent = scene, cast = true, receive = true) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(size.x, size.y, size.z),
        material
      );
      mesh.name = name;
      mesh.position.copy(position);
      mesh.castShadow = cast;
      mesh.receiveShadow = receive;
      parent.add(mesh);
      return mesh;
    }

    function addBeam(name, start, end, width, depth, material, parent = scene) {
      const direction = new THREE.Vector3().subVectors(end, start);
      const length = direction.length();
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(length, width, depth),
        material
      );
      mesh.name = name;
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(1, 0, 0),
        direction.normalize()
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addCylinder(name, start, end, radius, material, radialSegments = 12, parent = scene) {
      const direction = new THREE.Vector3().subVectors(end, start);
      const length = direction.length();
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, length, radialSegments),
        material
      );
      mesh.name = name;
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function seededRandom(seed) {
      let value = seed >>> 0;
      return () => {
        value = (value * 1664525 + 1013904223) >>> 0;
        return value / 4294967296;
      };
    }

    const random = seededRandom(24731);
    const environment = new THREE.Group();
    environment.name = 'Site';
    scene.add(environment);

    addBox(
      'Ground',
      new THREE.Vector3(82, 0.7, 56),
      new THREE.Vector3(0, -0.6, 0),
      materials.grass,
      environment,
      false,
      true
    );

    const riverBed = addBox(
      'River bed',
      new THREE.Vector3(44, 0.24, 10.5),
      new THREE.Vector3(0, -0.08, 0),
      materials.soil,
      environment,
      false,
      true
    );
    riverBed.rotation.y = 0.035;

    const water = addBox(
      'Water',
      new THREE.Vector3(44, 0.08, 8.4),
      new THREE.Vector3(0, 0.08, 0),
      materials.water,
      environment,
      false,
      true
    );
    water.rotation.y = 0.035;

    for (let i = 0; i < 42; i++) {
      const x = -20 + random() * 40;
      const zSign = random() < 0.5 ? -1 : 1;
      const z = zSign * (4.2 + random() * 2.2);
      const radius = 0.12 + random() * 0.32;
      const stone = new THREE.Mesh(
        new THREE.DodecahedronGeometry(radius, 0),
        new THREE.MeshStandardMaterial({
          color: new THREE.Color().setHSL(0.08, 0.07, 0.38 + random() * 0.18),
          roughness: 1
        })
      );
      stone.position.set(x, 0.12 + radius * 0.35, z);
      stone.scale.set(1.35, 0.65, 0.9);
      stone.rotation.set(random() * 2, random() * 2, random() * 2);
      stone.castShadow = true;
      stone.receiveShadow = true;
      environment.add(stone);
    }

    for (const side of [-1, 1]) {
      addBox(
        'Raised bank',
        new THREE.Vector3(17, 1.15, 56),
        new THREE.Vector3(side * 29.5, 0.28, 0),
        materials.grass,
        environment,
        false,
        true
      );
      addBeam(
        'Sloped bank',
        new THREE.Vector3(side * 20.5, -0.05, -28),
        new THREE.Vector3(side * 21.5, 0.75, -28),
        56,
        8,
        materials.grass,
        environment
      );
    }

    const bridge = new THREE.Group();
    bridge.name = 'Pedestrian Footbridge';
    scene.add(bridge);

    const span = 30;
    const halfSpan = span / 2;
    const deckY = 4.05;
    const deckWidth = 3.2;
    const trussZ = deckWidth / 2 + 0.18;
    const panelCount = 10;
    const panelLength = span / panelCount;
    const lowerY = deckY - 0.48;
    const upperY = deckY + 1.65;

    for (const side of [-1, 1]) {
      const x = side * 15.65;
      addBox(
        'Abutment footing',
        new THREE.Vector3(2.6, 0.55, 6.1),
        new THREE.Vector3(x, 0.4, 0),
        materials.concreteDark,
        bridge
      );
      addBox(
        'Abutment wall',
        new THREE.Vector3(1.15, 4.2, 5.4),
        new THREE.Vector3(x + side * 0.2, 2.05, 0),
        materials.concrete,
        bridge
      );
      addBox(
        'Bearing shelf',
        new THREE.Vector3(1.75, 0.45, 4.5),
        new THREE.Vector3(x - side * 0.46, 3.48, 0),
        materials.concreteDark,
        bridge
      );

      for (const z of [-1.16, 1.16]) {
        addBox(
          'Elastomer bearing',
          new THREE.Vector3(0.46, 0.16, 0.52),
          new THREE.Vector3(side * 14.72, 3.65, z),
          materials.steelEdge,
          bridge
        );
      }

      const approachLength = 5.8;
      addBox(
        'Approach slab',
        new THREE.Vector3(approachLength, 0.28, deckWidth),
        new THREE.Vector3(side * (halfSpan + approachLength / 2), deckY - 0.16, 0),
        materials.concrete,
        bridge
      );
    }

    addBox(
      'Main deck plate',
      new THREE.Vector3(span, 0.24, deckWidth),
      new THREE.Vector3(0, deckY - 0.24, 0),
      materials.steel,
      bridge
    );

    for (const z of [-1.26, 1.26]) {
      addBox(
        'Longitudinal edge girder',
        new THREE.Vector3(span, 0.44, 0.22),
        new THREE.Vector3(0, deckY - 0.43, z),
        materials.steelEdge,
        bridge
      );
    }

    for (let i = 0; i <= panelCount; i++) {
      const x = -halfSpan + i * panelLength;
      addBox(
        'Floor crossbeam',
        new THREE.Vector3(0.2, 0.3, 3.72),
        new THREE.Vector3(x, deckY - 0.48, 0),
        materials.steelEdge,
        bridge
      );
    }

    const plankCount = 75;
    const plankLength = span / plankCount;
    for (let i = 0; i < plankCount; i++) {
      const x = -halfSpan + plankLength * (i + 0.5);
      const plank = addBox(
        'Timber deck plank',
        new THREE.Vector3(plankLength - 0.025, 0.115, deckWidth - 0.18),
        new THREE.Vector3(x, deckY - 0.055, 0),
        i % 7 === 0 ? materials.timberDark : materials.timber,
        bridge
      );
      plank.position.y += (i % 3) * 0.0015;
    }

    for (const zSide of [-1, 1]) {
      const z = zSide * trussZ;

      addBox(
        'Lower truss chord',
        new THREE.Vector3(span, 0.25, 0.2),
        new THREE.Vector3(0, lowerY, z),
        materials.steelEdge,
        bridge
      );

      addBox(
        'Upper truss chord',
        new THREE.Vector3(span, 0.22, 0.18),
        new THREE.Vector3(0, upperY, z),
        materials.steel,
        bridge
      );

      addBeam(
        'Left end post',
        new THREE.Vector3(-halfSpan, lowerY, z),
        new THREE.Vector3(-halfSpan, upperY, z),
        0.22,
        0.2,
        materials.steelEdge,
        bridge
      );
      addBeam(
        'Right end post',
        new THREE.Vector3(halfSpan, lowerY, z),
        new THREE.Vector3(halfSpan, upperY, z),
        0.22,
        0.2,
        materials.steelEdge,
        bridge
      );

      for (let i = 0; i < panelCount; i++) {
        const x0 = -halfSpan + i * panelLength;
        const x1 = x0 + panelLength;
        const lowerPoint = new THREE.Vector3(i % 2 === 0 ? x0 : x1, lowerY, z);
        const upperPoint = new THREE.Vector3(i % 2 === 0 ? x1 : x0, upperY, z);

        addBeam(
          'Warren diagonal',
          lowerPoint,
          upperPoint,
          0.17,
          0.15,
          materials.steel,
          bridge
        );
      }

      for (let i = 0; i <= panelCount; i++) {
        const x = -halfSpan + i * panelLength;
        addBox(
          'Truss gusset',
          new THREE.Vector3(0.42, 0.42, 0.055),
          new THREE.Vector3(x, i % 2 === 0 ? lowerY : upperY, z - zSide * 0.115),
          materials.galvanized,
          bridge
        );
      }

      const handrailZ = zSide * (deckWidth / 2 - 0.03);
      addCylinder(
        'Timber handrail',
        new THREE.Vector3(-halfSpan, deckY + 1.12, handrailZ),
        new THREE.Vector3(halfSpan, deckY + 1.12, handrailZ),
        0.065,
        materials.timberDark,
        14,
        bridge
      );

      addCylinder(
        'Mid rail',
        new THREE.Vector3(-halfSpan, deckY + 0.56, handrailZ),
        new THREE.Vector3(halfSpan, deckY + 0.56, handrailZ),
        0.025,
        materials.galvanized,
        10,
        bridge
      );

      for (let i = 0; i <= panelCount * 2; i++) {
        const x = -halfSpan + i * panelLength / 2;
        addCylinder(
          'Railing post',
          new THREE.Vector3(x, deckY + 0.04, handrailZ),
          new THREE.Vector3(x, deckY + 1.09, handrailZ),
          0.029,
          materials.galvanized,
          10,
          bridge
        );
      }

      for (let i = 0; i < panelCount * 2; i++) {
        const x0 = -halfSpan + i * panelLength / 2;
        const x1 = x0 + panelLength / 2;
        addCylinder(
          'Railing cable',
          new THREE.Vector3(x0, deckY + 0.28, handrailZ),
          new THREE.Vector3(x1, deckY + 0.28, handrailZ),
          0.013,
          materials.galvanized,
          8,
          bridge
        );
        addCylinder(
          'Railing cable',
          new THREE.Vector3(x0, deckY + 0.82, handrailZ),
          new THREE.Vector3(x1, deckY + 0.82, handrailZ),
          0.013,
          materials.galvanized,
          8,
          bridge
        );
      }
    }

    for (let i = 1; i < panelCount; i++) {
      const x = -halfSpan + i * panelLength;
      addBeam(
        'Underdeck lateral brace',
        new THREE.Vector3(x - panelLength, deckY - 0.65, -1.48),
        new THREE.Vector3(x, deckY - 0.65, 1.48),
        0.09,
        0.08,
        materials.steel,
        bridge
      );
      addBeam(
        'Underdeck lateral brace',
        new THREE.Vector3(x - panelLength, deckY - 0.65, 1.48),
        new THREE.Vector3(x, deckY - 0.65, -1.48),
        0.09,
        0.08,
        materials.steel,
        bridge
      );
    }

    for (const side of [-1, 1]) {
      const approachStart = side * halfSpan;
      const approachEnd = side * 20.4;
      for (const z of [-1.52, 1.52]) {
        addCylinder(
          'Approach handrail',
          new THREE.Vector3(approachStart, deckY + 1.12, z),
          new THREE.Vector3(approachEnd, deckY + 1.12, z),
          0.055,
          materials.galvanized,
          12,
          bridge
        );
        for (let i = 0; i <= 3; i++) {
          const x = THREE.MathUtils.lerp(approachStart, approachEnd, i / 3);
          addCylinder(
            'Approach rail post',
            new THREE.Vector3(x, deckY, z),
            new THREE.Vector3(x, deckY + 1.1, z),
            0.035,
            materials.galvanized,
            10,
            bridge
          );
        }
      }
    }

    const pathMaterial = new THREE.MeshStandardMaterial({
      color: 0x958b77,
      roughness: 1
    });
    for (const side of [-1, 1]) {
      addBox(
        'Footpath',
        new THREE.Vector3(22, 0.08, 2.7),
        new THREE.Vector3(side * 31.2, deckY - 0.12, 0),
        pathMaterial,
        environment,
        false,
        true
      );
    }

    for (let i = 0; i < 55; i++) {
      const x = -39 + random() * 78;
      const z = (random() < 0.5 ? -1 : 1) * (7 + random() * 20);
      const height = 0.35 + random() * 0.75;
      const tuft = new THREE.Mesh(
        new THREE.ConeGeometry(0.12 + random() * 0.16, height, 5),
        new THREE.MeshStandardMaterial({
          color: new THREE.Color().setHSL(0.25 + random() * 0.08, 0.35, 0.25 + random() * 0.12),
          roughness: 1
        })
      );
      tuft.position.set(x, height / 2 - 0.17, z);
      tuft.castShadow = true;
      environment.add(tuft);
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      water.position.y = 0.08 + Math.sin(elapsed * 0.7) * 0.012;
      controls.update();
      renderer.render(scene, camera);
    }

    function resize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    }

    window.addEventListener('resize', resize);
    animate();
  </script>
</body>
</html>
