<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Small Apple Orchard</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #b9d9f2; }
  canvas { display: block; }
  #label {
    position: fixed; left: 16px; bottom: 14px; color: rgba(255,255,255,.88);
    font: 600 12px/1.3 system-ui, sans-serif; letter-spacing: .08em;
    text-transform: uppercase; pointer-events: none; text-shadow: 0 1px 3px #355;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="label">Three-tree apple orchard</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xafd7ef);
scene.fog = new THREE.Fog(0xb8d9df, 22, 52);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(9.2, 6.2, 10.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.7, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.32;
controls.minDistance = 6;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.47;

const hemi = new THREE.HemisphereLight(0xdcefff, 0x5c6a35, 2.1);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff4d1, 3.4);
sun.position.set(-7, 11, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -13;
sun.shadow.camera.right = 13;
sun.shadow.camera.top = 13;
sun.shadow.camera.bottom = -13;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 30;
sun.shadow.bias = -0.00025;
scene.add(sun);

const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0x648b43,
  roughness: 0.95,
  metalness: 0
});

function terrainHeight(x, z) {
  return 0.16 * Math.sin(x * 0.52) * Math.cos(z * 0.43)
       + 0.08 * Math.sin(x * 1.27 + z * 0.64)
       + 0.035 * Math.cos(z * 2.1);
}

const groundGeometry = new THREE.PlaneGeometry(30, 26, 120, 104);
groundGeometry.rotateX(-Math.PI / 2);
const groundPosition = groundGeometry.attributes.position;
for (let i = 0; i < groundPosition.count; i++) {
  const x = groundPosition.getX(i);
  const z = groundPosition.getZ(i);
  groundPosition.setY(i, terrainHeight(x, z));
}
groundGeometry.computeVertexNormals();
const ground = new THREE.Mesh(groundGeometry, groundMaterial);
ground.receiveShadow = true;
scene.add(ground);

const soilMaterial = new THREE.MeshStandardMaterial({ color: 0x5b4026, roughness: 1 });
const grassMaterials = [
  new THREE.MeshStandardMaterial({ color: 0x496f31, roughness: 0.95, side: THREE.DoubleSide }),
  new THREE.MeshStandardMaterial({ color: 0x6e9a42, roughness: 0.95, side: THREE.DoubleSide }),
  new THREE.MeshStandardMaterial({ color: 0x88aa52, roughness: 0.95, side: THREE.DoubleSide })
];

const grassGeometry = new THREE.ConeGeometry(0.028, 0.33, 3, 1);
const grass = new THREE.InstancedMesh(grassGeometry, grassMaterials[0], 1150);
grass.castShadow = false;
grass.receiveShadow = true;
const grassMatrix = new THREE.Matrix4();
const grassQuaternion = new THREE.Quaternion();
const grassScale = new THREE.Vector3();
const grassPosition = new THREE.Vector3();
for (let i = 0; i < 1150; i++) {
  const x = -14 + Math.random() * 28;
  const z = -12 + Math.random() * 24;
  const y = terrainHeight(x, z);
  grassPosition.set(x, y + 0.13, z);
  grassQuaternion.setFromEuler(new THREE.Euler(
    (Math.random() - 0.5) * 0.32,
    Math.random() * Math.PI,
    (Math.random() - 0.5) * 0.32
  ));
  const s = 0.55 + Math.random() * 1.2;
  grassScale.set(0.65 + Math.random() * 0.7, s, 0.65 + Math.random() * 0.7);
  grassMatrix.compose(grassPosition, grassQuaternion, grassScale);
  grass.setMatrixAt(i, grassMatrix);
  grass.setColorAt(i, new THREE.Color().setHex([0x496f31, 0x6e9a42, 0x88aa52][i % 3]));
}
grass.instanceColor.needsUpdate = true;
scene.add(grass);

const trunkMaterial = new THREE.MeshStandardMaterial({ color: 0x5a3821, roughness: 0.95 });
const branchMaterial = new THREE.MeshStandardMaterial({ color: 0x654125, roughness: 0.93 });
const leafMaterials = [
  new THREE.MeshStandardMaterial({ color: 0x2f6f36, roughness: 0.82, flatShading: true }),
  new THREE.MeshStandardMaterial({ color: 0x3f8241, roughness: 0.85, flatShading: true }),
  new THREE.MeshStandardMaterial({ color: 0x4a9146, roughness: 0.88, flatShading: true }),
  new THREE.MeshStandardMaterial({ color: 0x285f31, roughness: 0.84, flatShading: true })
];
const appleMaterial = new THREE.MeshStandardMaterial({
  color: 0xb91c20,
  roughness: 0.48,
  metalness: 0.02
});
const appleHighlightMaterial = new THREE.MeshStandardMaterial({
  color: 0xea3940,
  roughness: 0.4
});
const stemMaterial = new THREE.MeshStandardMaterial({ color: 0x49321c, roughness: 0.92 });

function cylinderBetween(a, b, radiusTop, radiusBottom, material) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const length = direction.length();
  const geometry = new THREE.CylinderGeometry(radiusTop, radiusBottom, length, 7, 1);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function makeTree(x, z, seed) {
  const group = new THREE.Group();
  const baseY = terrainHeight(x, z);
  group.position.set(x, baseY, z);

  const soil = new THREE.Mesh(new THREE.CylinderGeometry(1.04, 1.14, 0.055, 24), soilMaterial);
  soil.position.y = 0.025;
  soil.receiveShadow = true;
  group.add(soil);

  const trunkHeight = 2.35 + seed * 0.08;
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.19, 0.28, trunkHeight, 9, 7),
    trunkMaterial
  );
  trunk.position.y = trunkHeight * 0.5;
  trunk.castShadow = true;
  trunk.receiveShadow = true;
  group.add(trunk);

  const branchStarts = [
    [0.65, 0.15], [1.02, 2.25], [1.29, 4.15], [1.56, 5.6], [1.78, 0.9]
  ];
  const branchTips = [];
  branchStarts.forEach((entry, index) => {
    const h = entry[0];
    const angle = entry[1] + seed * 0.55;
    const start = new THREE.Vector3(0, h, 0);
    const tip = new THREE.Vector3(
      Math.cos(angle) * (0.85 + 0.12 * (index % 2)),
      h + 0.62 + 0.1 * (index % 3),
      Math.sin(angle) * (0.85 + 0.12 * (index % 2))
    );
    group.add(cylinderBetween(start, tip, 0.055, 0.115, branchMaterial));
    branchTips.push(tip);
    const fork = tip.clone().add(new THREE.Vector3(
      Math.cos(angle + 0.48) * 0.42,
      0.28,
      Math.sin(angle + 0.48) * 0.42
    ));
    group.add(cylinderBetween(tip, fork, 0.025, 0.052, branchMaterial));
    branchTips.push(fork);
  });

  const leafGeometry = new THREE.IcosahedronGeometry(0.74, 1);
  const canopyCenters = [
    [0, 2.92, 0, 1.28],
    [-0.68, 2.67, 0.12, 0.88],
    [0.66, 2.7, -0.08, 0.92],
    [-0.24, 3.48, 0.06, 0.9],
    [0.42, 3.38, 0.18, 0.85],
    [0.08, 3.83, -0.16, 0.7]
  ];
  canopyCenters.forEach((entry, index) => {
    const leaf = new THREE.Mesh(leafGeometry, leafMaterials[(index + Math.floor(seed * 7)) % leafMaterials.length]);
    leaf.position.set(entry[0], entry[1], entry[2]);
    leaf.scale.set(entry[3] * (1 + seed * 0.04), entry[3] * 0.91, entry[3] * 0.94);
    leaf.rotation.set(seed + index * 0.63, index * 1.41, seed * 0.35);
    leaf.castShadow = true;
    leaf.receiveShadow = true;
    group.add(leaf);
  });

  const apples = [
    [-0.78, 2.83, 0.35], [0.74, 2.84, 0.4], [0.1, 3.7, 0.55],
    [-0.36, 3.32, -0.73], [0.86, 3.21, -0.41], [-0.82, 3.15, -0.32],
    [0.36, 2.55, 0.75]
  ];
  apples.forEach((entry, index) => {
    const apple = new THREE.Mesh(new THREE.SphereGeometry(0.115, 14, 10), index % 3 === 0 ? appleHighlightMaterial : appleMaterial);
    apple.position.set(entry[0], entry[1] + seed * 0.035, entry[2]);
    apple.scale.set(1, 0.94, 1);
    apple.castShadow = true;
    group.add(apple);

    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.018, 0.13, 5), stemMaterial);
    stem.position.copy(apple.position).add(new THREE.Vector3(0.015, 0.125, 0));
    stem.rotation.z = 0.22;
    stem.castShadow = true;
    group.add(stem);
  });

  scene.add(group);
}

makeTree(-4.1, 0.1, 0.12);
makeTree(0, 0, 0.58);
makeTree(4.1, -0.08, 0.91);

const rowPathMaterial = new THREE.MeshStandardMaterial({ color: 0x78984e, roughness: 1 });
const pathGeometry = new THREE.PlaneGeometry(11.4, 1.12, 24, 3);
pathGeometry.rotateX(-Math.PI / 2);
const pathPosition = pathGeometry.attributes.position;
for (let i = 0; i < pathPosition.count; i++) {
  const x = pathPosition.getX(i);
  const z = pathPosition.getZ(i);
  pathPosition.setY(i, terrainHeight(x, z) + 0.008);
}
pathGeometry.computeVertexNormals();
const rowPath = new THREE.Mesh(pathGeometry, rowPathMaterial);
rowPath.position.z = -1.65;
rowPath.receiveShadow = true;
scene.add(rowPath);

const cloudMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, transparent: true, opacity: 0.83 });
function addCloud(x, y, z, scale) {
  const cloud = new THREE.Group();
  const puffGeometry = new THREE.SphereGeometry(1, 16, 12);
  const puffs = [[0,0,0,1.0], [0.8,0.1,0.1,0.72], [-0.8,0.04,0.15,0.68], [0.18,0.45,-0.05,0.7]];
  puffs.forEach((puff) => {
    const mesh = new THREE.Mesh(puffGeometry, cloudMaterial);
    mesh.position.set(puff[0], puff[1], puff[2]);
    mesh.scale.set(puff[3], puff[3] * 0.65, puff[3] * 0.7);
    cloud.add(mesh);
  });
  cloud.position.set(x, y, z);
  cloud.scale.setScalar(scale);
  scene.add(cloud);
}
addCloud(-8, 9, -14, 1.25);
addCloud(7, 10.5, -18, 1.55);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
