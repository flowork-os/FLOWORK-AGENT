<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temple Bell — Reduced-Scale Study</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1c20; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1c20);
scene.fog = new THREE.Fog(0x1a1c20, 14, 30);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.6, 3.2, 6.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// ---------- Lighting ----------
const key = new THREE.DirectionalLight(0xfff2dd, 2.4);
key.position.set(5, 8, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -5;
key.shadow.camera.right = key.shadow.camera.top = 5;
key.shadow.radius = 6;
key.shadow.bias = -0.0004;
scene.add(key);

scene.add(new THREE.HemisphereLight(0x8fa4b8, 0x2c2418, 0.55));
const rim = new THREE.DirectionalLight(0x9fd8ff, 0.9);
rim.position.set(-6, 4, -5);
scene.add(rim);
const fill = new THREE.PointLight(0xffd9a0, 8, 12);
fill.position.set(-2, 1.2, 3);
scene.add(fill);

// ---------- Materials (bronze with greenish patina) ----------
function patinaTexture() {
  const s = 512, c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  g.fillStyle = '#5a6b4e'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 4200; i++) {
    const x = Math.random() * s, y = Math.random() * s, r = 1 + Math.random() * 9;
    const t = Math.random();
    g.fillStyle = t < 0.42 ? 'rgba(96,140,110,0.28)'
              : t < 0.7 ? 'rgba(70,60,38,0.30)'
              : t < 0.9 ? 'rgba(130,160,130,0.20)'
              : 'rgba(150,110,60,0.18)';
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  // vertical streaks (weathering runs)
  for (let i = 0; i < 90; i++) {
    const x = Math.random() * s, y = Math.random() * s * 0.5;
    g.strokeStyle = 'rgba(110,150,120,0.14)';
    g.lineWidth = 1 + Math.random() * 3;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + (Math.random() - 0.5) * 10, y + 60 + Math.random() * 160); g.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const patina = patinaTexture();
const rough = patina.clone(); rough.colorSpace = THREE.NoColorSpace;

const bronzeMat = new THREE.MeshStandardMaterial({
  color: 0x7d8f6a, map: patina, metalness: 0.72, roughness: 0.52,
  roughnessMap: rough
});
const bandMat = new THREE.MeshStandardMaterial({
  color: 0x6e7d55, map: patina, metalness: 0.8, roughness: 0.42
});
const darkBronze = new THREE.MeshStandardMaterial({
  color: 0x4c5a42, metalness: 0.85, roughness: 0.38
});

// ---------- Bell group ----------
const bell = new THREE.Group();
scene.add(bell);

// Bell body — lathe profile: rounded shoulder, gentle waist, flaring thick lip
const pts = [];
const prof = [
  [0.02, 2.30], [0.30, 2.29], [0.62, 2.22], [0.88, 2.06], [1.04, 1.84],
  [1.12, 1.58], [1.16, 1.30], [1.18, 1.00], [1.20, 0.70], [1.24, 0.44],
  [1.32, 0.22], [1.44, 0.06], [1.52, 0.00], [1.50, -0.10], [1.38, -0.12],
  [1.26, -0.06], [1.18, 0.06] // roll under to give the lip visible thickness
];
for (const [x, y] of prof) pts.push(new THREE.Vector2(x, y));
const body = new THREE.Mesh(new THREE.LatheGeometry(pts, 96), bronzeMat);
body.castShadow = body.receiveShadow = true;
bell.add(body);

// Raised horizontal bands
const bandYs = [[1.86, 0.995], [1.30, 1.17], [0.72, 1.20], [0.30, 1.29]];
for (const [y, r] of bandYs) {
  const band = new THREE.Mesh(new THREE.TorusGeometry(r, 0.035, 12, 96), bandMat);
  band.rotation.x = Math.PI / 2;
  band.position.y = y;
  band.castShadow = true;
  bell.add(band);
}

// Bosses (nipples) — rows around the shoulder region
const bossGeo = new THREE.SphereGeometry(0.052, 16, 12);
const bossRows = [[1.72, 1.075, 18], [1.58, 1.125, 18], [1.44, 1.155, 18]];
for (const [y, r, n] of bossRows) {
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + (y * 2.1);
    const boss = new THREE.Mesh(bossGeo, darkBronze);
    boss.position.set(Math.cos(a) * r, y, Math.sin(a) * r);
    boss.castShadow = true;
    bell.add(boss);
  }
}

// Vertical rib panels between mid bands
for (let i = 0; i < 4; i++) {
  const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
  const rib = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.56, 0.05), bandMat);
  rib.position.set(Math.cos(a) * 1.185, 1.01, Math.sin(a) * 1.185);
  rib.lookAt(0, 1.01, 0);
  rib.castShadow = true;
  bell.add(rib);
}

// Striking medallion (round lotus boss)
const medal = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.19, 0.05, 24), darkBronze);
medal.rotation.z = Math.PI / 2;
medal.rotation.y = Math.PI / 2;
medal.position.set(0, 0.52, 1.245);
medal.castShadow = true;
bell.add(medal);

// Crown cap
const cap = new THREE.Mesh(new THREE.SphereGeometry(0.34, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), bandMat);
cap.position.y = 2.26;
cap.scale.y = 0.7;
cap.castShadow = true;
bell.add(cap);

// Dragon-crown suspension loop: arched torus with stylized dragon heads
const loop = new THREE.Mesh(new THREE.TorusGeometry(0.30, 0.075, 14, 40, Math.PI), darkBronze);
loop.position.y = 2.48;
loop.castShadow = true;
bell.add(loop);

function dragonHead(sign) {
  const g = new THREE.Group();
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.115, 16, 12), darkBronze);
  skull.scale.set(1.25, 0.9, 0.9);
  g.add(skull);
  const snout = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.22, 12), darkBronze);
  snout.rotation.z = -sign * Math.PI / 2;
  snout.position.x = sign * 0.17;
  g.add(snout);
  for (const hz of [-0.05, 0.05]) {
    const horn = new THREE.Mesh(new THREE.ConeGeometry(0.028, 0.16, 8), darkBronze);
    horn.position.set(-sign * 0.06, 0.12, hz);
    horn.rotation.z = sign * 0.5;
    g.add(horn);
  }
  g.position.set(sign * 0.30, 2.48, 0);
  g.traverse(o => o.castShadow = true);
  return g;
}
bell.add(dragonHead(1), dragonHead(-1));

// ---------- Suspension beam ----------
const beam = new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.22, 0.34), new THREE.MeshStandardMaterial({ color: 0x5a3d26, roughness: 0.85 }));
beam.position.y = 3.3;
beam.castShadow = beam.receiveShadow = true;
scene.add(beam);

const hookMat = new THREE.MeshStandardMaterial({ color: 0x3b3b3b, metalness: 0.9, roughness: 0.4 });
const shackle = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.03, 10, 28), hookMat);
shackle.position.y = 2.72;
shackle.castShadow = true;
scene.add(shackle);
const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.42, 12), hookMat);
rod.position.y = 2.98;
rod.castShadow = true;
scene.add(rod);

// ---------- Ground ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(9, 64),
  new THREE.MeshStandardMaterial({ color: 0x2b2e33, roughness: 0.95, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.14;
ground.receiveShadow = true;
scene.add(ground);

// soft contact-shadow disc
const shadowCanvas = document.createElement('canvas');
shadowCanvas.width = shadowCanvas.height = 128;
const sg = shadowCanvas.getContext('2d');
const grad = sg.createRadialGradient(64, 64, 8, 64, 64, 64);
grad.addColorStop(0, 'rgba(0,0,0,0.5)');
grad.addColorStop(1, 'rgba(0,0,0,0)');
sg.fillStyle = grad; sg.fillRect(0, 0, 128, 128);
const shadowDisc = new THREE.Mesh(
  new THREE.PlaneGeometry(4.2, 4.2),
  new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(shadowCanvas), transparent: true, depthWrite: false })
);
shadowDisc.rotation.x = -Math.PI / 2;
shadowDisc.position.y = -0.135;
scene.add(shadowDisc);

// ---------- Controls & loop ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.4, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
controls.minDistance = 3;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.52;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  bell.rotation.z = Math.sin(t * 0.7) * 0.008; // barely-perceptible sway
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
