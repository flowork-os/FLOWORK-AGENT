let seed = 943721;
function rand() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function range(a, b) { return a + (b - a) * rand(); }

function cast(mesh, receive = true) {
  mesh.castShadow = true;
  mesh.receiveShadow = receive;
  return mesh;
}

function makeDune(radius, height, x, z, color = 0xc98750) {
  const geo = new THREE.SphereGeometry(radius, 48, 20);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const px = pos.getX(i);
    const py = pos.getY(i);
    const pz = pos.getZ(i);
    const ripple = Math.sin(px * .72 + pz * .17) * .075;
    pos.setY(i, py * height / radius + ripple);
  }
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(
    geo,
    new THREE.MeshStandardMaterial({ color, roughness: 1 })
  );
  mesh.position.set(x, -radius * .56, z);
  mesh.scale.z = range(.65, 1.1);
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

const groundGeo = new THREE.CircleGeometry(112, 96);
const ground = new THREE.Mesh(groundGeo, sandMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -.28;
ground.receiveShadow = true;
scene.add(ground);

for (let i = 0; i < 22; i++) {
  const a = i / 22 * Math.PI * 2 + range(-.12, .12);
  const r = range(39, 72);
  makeDune(
    range(15, 28),
    range(4, 9),
    Math.cos(a) * r,
    Math.sin(a) * r,
    i % 4 ? 0xc18455 : 0xaa6b4c

}

const ridgeMat = new THREE.MeshBasicMaterial({

});
for (let i = 0; i < 32; i++) {

    new THREE.Vector3(-3, .25, .25),
    new THREE.Vector3(3, -.08, -.2),
    new THREE.Vector3(9, 0, 0)

const palms = [];
function makePalm(x, z, s = 1) {
  const group = new THREE.Group();
  group.position.set(x, 0, z);
  const trunk = cast(new THREE.Mesh(
    new THREE.CylinderGeometry(.25 * s, .5 * s, 6.6 * s, 9, 9),
    woodMat
  ));
  trunk.position.y = 3.2 * s;
  const tp = trunk.geometry.attributes.position;
  for (let i = 0; i < tp.count; i++) {
    const y = tp.getY(i);
    tp.setX(i, tp.getX(i) + Math.sin(y * .75) * .12 * s);
    tp.setZ(i, tp.getZ(i) + Math.cos(y * .53) * .08 * s);
  }
  trunk.geometry.computeVertexNormals();
  group.add(trunk);

  for (let n = 0; n < 11; n++) {
    const angle = n / 11 * Math.PI * 2 + range(-.18, .18);
    const length = range(3.2, 4.5) * s;
    const shape = new THREE.Shape();
    shape.moveTo(0, 0);
    shape.quadraticCurveTo(length * .45, .42 * s, length, 0);
    shape.quadraticCurveTo(length * .42, -.34 * s, 0, 0);
    const frond = cast(new THREE.Mesh(
      new THREE.ShapeGeometry(shape, 8),
      leafMat
    ));
    frond.position.set(
      Math.sin(6.6 * .75) * .12 * s,
      6.45 * s,
      Math.cos(6.6 * .53) * .08 * s
    );
    frond.rotation.x = range(-.12, .32);
    frond.rotation.y = -angle;
    frond.rotation.z = range(-.28, .1);
    frond.userData.baseZ = frond.rotation.z;
    group.add(frond);

    for (let d = 0; d < 2; d++) {
      if (n % 2 === d) {
        const date = new THREE.Mesh(
          new THREE.SphereGeometry(.13 * s, 6, 5),
          new THREE.MeshStandardMaterial({
            color: d ? 0x8c3c27 : 0x9f5228,
            roughness: .8
          })
        );
        date.position.set(
          Math.cos(angle) * .55 * s,
          6.05 * s - range(0, .35) * s,
          Math.sin(angle) * .55 * s
        );
        group.add(date);
      }
    }
  }
  scene.add(group);
  palms.push(group);
}

    stem.rotation.z = range(-.12, .12);

    if (i % 2 === 0) {

      );
      head.position.copy(stem.position);
      head.position.y += h / 2;

}

function clothTexture(a, b, stripe) {
  const c = document.createElement('canvas');
  c.width = 256;
  c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = a;
  x.fillRect(0, 0, 256, 256);
  x.fillStyle = b;
  for (let i = -256; i < 512; i += stripe * 2) {
    x.fillRect(i, 0, stripe, 256);
  }
  x.globalAlpha = .16;
  for (let i = 0; i < 900; i++) {
    x.fillStyle = rand() > .5 ? '#fff' : '#24160f';
    x.fillRect(range(0, 256), range(0, 256), 1, 1);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function makeTent(x, z, rot, scale, colors) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = rot;
  g.scale.setScalar(scale);

  const texture = clothTexture(colors[0], colors[1], 30);
  texture.repeat.set(2, 1);
  const mat = new THREE.MeshStandardMaterial({
    map: texture,
    roughness: .92,
    side: THREE.DoubleSide
  });

  const roofGeo = new THREE.BufferGeometry();
  roofGeo.setAttribute('position', new THREE.Float32BufferAttribute([
    -4, 0, -2.6,  0, 3.3, -2.6,  4, 0, -2.6,
    -4, 0,  2.6,  4, 0,  2.6,  0, 3.3,  2.6,
    -4, 0, -2.6, -4, 0,  2.6,  0, 3.3,  2.6,
    -4, 0, -2.6,  0, 3.3,  2.6,  0, 3.3, -2.6,
     0, 3.3, -2.6,  0, 3.3,  2.6,  4, 0,  2.6,
     0, 3.3, -2.6,  4, 0,  2.6,  4, 0, -2.6
  ], 3));
  roofGeo.computeVertexNormals();
  const roof = cast(new THREE.Mesh(roofGeo, mat));
  roof.position.y = .65;
  g.add(roof);

  const back = cast(new THREE.Mesh(
    new THREE.PlaneGeometry(8, 2.1),
    mat
  ));
  back.position.set(0, 1.05, -2.55);
  g.add(back);

  const sideMat = new THREE.MeshStandardMaterial({
    color: 0x38241f,
    roughness: 1,
    side: THREE.DoubleSide
  });
  for (const sx of [-4, 4]) {
    const sideShape = new THREE.Shape();
    sideShape.moveTo(0, 0);
    sideShape.lineTo(0, 2.1);
    sideShape.lineTo(sx < 0 ? 4 : -4, 5.4);
    sideShape.lineTo(sx < 0 ? 8 : -8, 2.1);
    sideShape.lineTo(sx < 0 ? 8 : -8, 0);
    const side = cast(new THREE.Mesh(
      new THREE.ShapeGeometry(sideShape),
      sideMat
    ));
    side.position.set(sx, 0, -2.55);
    side.rotation.y = Math.PI / 2;
    side.scale.set(.5, .5, .5);
    g.add(side);
  }

  for (const px of [-3.8, 0, 3.8]) {
    const pole = cast(new THREE.Mesh(
      new THREE.CylinderGeometry(.055, .075, px === 0 ? 4.05 : 1.75, 7),
      woodMat
    ));
    pole.position.set(px, px === 0 ? 2.05 : .88, 0);
    g.add(pole);
  }

  scene.add(g);
  return g;
}

makeTent(14, 2.2, -.46, 1.05, ['#7e3027', '#d3a054']);
makeTent(14.8, -7.8, -.25, .76, ['#432a31', '#b26647']);

function makeJar(x, z, s, color) {
  const profile = [
    new THREE.Vector2(.18, 0),
    new THREE.Vector2(.5, .12),
    new THREE.Vector2(.68, .65),
    new THREE.Vector2(.53, 1.25),
    new THREE.Vector2(.26, 1.48),
    new THREE.Vector2(.25, 1.72),
    new THREE.Vector2(.38, 1.78)
  ];
  const jar = cast(new THREE.Mesh(
    new THREE.LatheGeometry(profile, 20),
    new THREE.MeshStandardMaterial({
      color,
      roughness: .9
    })
  ));
  jar.position.set(x, .02, z);
  jar.scale.setScalar(s);
  scene.add(jar);

  const handle = new THREE.Mesh(
    new THREE.TorusGeometry(.42 * s, .065 * s, 6, 14, Math.PI),
    new THREE.MeshStandardMaterial({ color, roughness: .9 })
  );
  handle.position.set(x + .38 * s, 1.15 * s, z);
  handle.rotation.y = Math.PI / 2;
  scene.add(handle);
}

function capsuleBetween(a, b, radius, material) {
  const length = a.distanceTo(b);
  const mesh = cast(new THREE.Mesh(
    new THREE.CapsuleGeometry(radius, Math.max(.01, length - radius * 2), 5, 8),
    material
  ));
  mesh.position.copy(a).add(b).multiplyScalar(.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    b.clone().sub(a).normalize()
  );
  return mesh;
}

function makeCamel(x, z, rot, s = 1) {
  const camel = new THREE.Group();
  camel.position.set(x, 0, z);
  camel.rotation.y = rot;
  camel.scale.setScalar(s);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x4b2d25,
    roughness: .96
  });

  const body = cast(new THREE.Mesh(
    new THREE.CapsuleGeometry(.72, 2.5, 7, 12),
    mat
  ));
  body.rotation.z = Math.PI / 2;
  body.position.y = 1.45;
  body.scale.y = 1.15;
  camel.add(body);

  const hump1 = cast(new THREE.Mesh(
    new THREE.SphereGeometry(.72, 14, 10),
    mat
  ));
  hump1.scale.set(1, 1.35, .85);
  hump1.position.set(-.45, 2.05, 0);
  camel.add(hump1);

  const neck = capsuleBetween(
    new THREE.Vector3(1.05, 1.55, 0),
    new THREE.Vector3(1.72, 3.15, 0),
    .28,
    mat
  );
  camel.add(neck);

  const head = cast(new THREE.Mesh(
    new THREE.CapsuleGeometry(.3, .7, 5, 9),
    mat
  ));
  head.rotation.z = Math.PI / 2;
  head.position.set(2.02, 3.26, 0);
  camel.add(head);

  const muzzle = new THREE.Mesh(
    new THREE.SphereGeometry(.25, 9, 7),
    mat
  );
  muzzle.scale.set(1.2, .7, .8);
  muzzle.position.set(2.48, 3.15, 0);
  camel.add(muzzle);

  for (const zz of [-.37, .37]) {
    const fore = capsuleBetween(
      new THREE.Vector3(.65, 1.3, zz),
      new THREE.Vector3(1.75, .22, zz),
      .13,
      mat
    );
    camel.add(fore);
    const hind = capsuleBetween(
      new THREE.Vector3(-1.1, 1.25, zz),
      new THREE.Vector3(-2.0, .22, zz),
      .14,
      mat
    );
    camel.add(hind);
  }

  const tail = capsuleBetween(
    new THREE.Vector3(-1.55, 1.6, 0),
    new THREE.Vector3(-2.05, .95, 0),
    .07,
    mat
  );
  camel.add(tail);

  scene.add(camel);
  return camel;
}
makeCamel(-14.2, 3.1, .6, 1.08);

const basketMat = new THREE.MeshStandardMaterial({
  color: 0x8e6038,
  roughness: 1,
  wireframe: true
});
for (let i = 0; i < 3; i++) {
  const basket = new THREE.Mesh(
    new THREE.CylinderGeometry(.48, .38, .7, 12, 6, true),
    basketMat
  );
  basket.position.set(12 + i * .9, .36, 7.2 + range(-.2, .2));
  scene.add(basket);
}

const foregroundGrass = [];
for (let i = 0; i < 75; i++) {
  const blade = new THREE.Mesh(
    new THREE.ConeGeometry(.025, range(.35, .85), 4),
    new THREE.MeshStandardMaterial({
      color: rand() > .45 ? 0x86763e : 0x5e6534,
      roughness: 1
    })
  );
  const a = range(0, Math.PI * 2);
  const r = range(9, 23);
  blade.position.set(Math.cos(a) * r, blade.geometry.parameters.height / 2, Math.sin(a) * r);
  blade.rotation.z = range(-.25, .25);
  blade.userData.phase = range(0, Math.PI * 2);
  scene.add(blade);
  foregroundGrass.push(blade);
}

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  water.material.roughness = .18 + Math.sin(t * .7) * .025;
  water.position.y = .37 + Math.sin(t * .8) * .012;

  waterLines.forEach((line, i) => {
    line.position.x += Math.sin(t * .45 + line.userData.phase) * .002;
    line.material.opacity = .16 + .18 * (Math.sin(t * 1.2 + i) * .5 + .5);
  });

  palms.forEach((p, pi) => {
    p.children.forEach((child, ci) => {
      if (child.userData.baseZ !== undefined) {
        child.rotation.z = child.userData.baseZ +
          Math.sin(t * .72 + pi + ci * .3) * .035;
      }
    });
  });

  flames.forEach((f, i) => {
    f.scale.y = (1.7 + Math.sin(t * (5.5 + i * .17) + f.userData.phase) * .45);
    f.position.x += Math.sin(t * 3 + f.userData.phase) * .0025;
    f.rotation.z = Math.sin(t * 4.2 + f.userData.phase) * .16;
  });
  fireLight.intensity = 15 + Math.sin(t * 8.3) * 3 + Math.sin(t * 13.7) * 1.5;

  const positions = sparks.geometry.attributes.position;
  for (let i = 0; i < sparkCount; i++) {
    let y = positions.getY(i) + .014 * sparkMeta[i].speed;
    if (y > 5) y = .45;
    positions.setY(i, y);
    positions.setX(i,
      sparkData[i * 3] + Math.sin(t * 1.8 + sparkMeta[i].phase + y) * .22
    );
    positions.setZ(i,
      sparkData[i * 3 + 2] + Math.cos(t * 1.4 + sparkMeta[i].phase + y) * .16
    );
  }
  positions.needsUpdate = true;

  foregroundGrass.forEach((blade, i) => {
    blade.rotation.z = Math.sin(t * .9 + blade.userData.phase + i * .02) * .12;
  });

  stars.material.opacity = .64 + Math.sin(t * .35) * .08;
  sunDisc.lookAt(camera.position);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
