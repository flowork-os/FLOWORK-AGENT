<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Procedural Dump Truck — three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17191c; }
  #info {
    position: fixed; left: 14px; bottom: 12px; z-index: 10;
    font: 12px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: #c9ccd1; letter-spacing: .3px; user-select: none; pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }
  #info b { color: #f2b400; }
</style>
</head>
<body>
<div id="info"><b>Heavy Dump Truck</b> — drag to orbit • scroll to zoom • bed auto-tips</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------------------------------------------------------------- Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// ---------------------------------------------------------------- Scene / Camera
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x191b1e);
scene.fog = new THREE.Fog(0x191b1e, 24, 60);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(10.5, 5.2, 11.5);

// Subtle procedural environment for realistic metal reflections
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.05).texture;

// ---------------------------------------------------------------- Lighting
const hemi = new THREE.HemisphereLight(0xbfd4ea, 0x2a2620, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff3e0, 2.6);
key.position.set(9, 12, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 60;
key.shadow.camera.left = -12;
key.shadow.camera.right = 12;
key.shadow.camera.top = 12;
key.shadow.camera.bottom = -12;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9fb4d0, 0.7);
fill.position.set(-8, 5, 6);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd9a0, 1.1);
rim.position.set(-6, 7, -9);
scene.add(rim);

// ---------------------------------------------------------------- Ground (shadow-only)
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(240, 240),
  new THREE.ShadowMaterial({ opacity: 0.4 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------------------------------------------------------------- Materials
const matYellow    = new THREE.MeshStandardMaterial({ color: 0xf2b100, metalness: 0.55, roughness: 0.42 });
const matYellowDim = new THREE.MeshStandardMaterial({ color: 0xd99700, metalness: 0.5,  roughness: 0.5  });
const matBedInner  = new THREE.MeshStandardMaterial({ color: 0x3a3226, metalness: 0.65, roughness: 0.65 });
const matDark      = new THREE.MeshStandardMaterial({ color: 0x1b1c20, metalness: 0.75, roughness: 0.45 });
const matFrame     = new THREE.MeshStandardMaterial({ color: 0x141517, metalness: 0.8,  roughness: 0.5  });
const matTire      = new THREE.MeshStandardMaterial({ color: 0x121316, metalness: 0.1,  roughness: 0.88 });
const matRim       = new THREE.MeshStandardMaterial({ color: 0x9aa3ab, metalness: 0.95, roughness: 0.32 });
const matHub       = new THREE.MeshStandardMaterial({ color: 0x40454b, metalness: 0.9,  roughness: 0.4  });
const matBolt      = new THREE.MeshStandardMaterial({ color: 0x70787f, metalness: 1.0,  roughness: 0.35 });
const matChrome    = new THREE.MeshStandardMaterial({ color: 0xc9d0d6, metalness: 1.0,  roughness: 0.18 });
const matGlass     = new THREE.MeshPhysicalMaterial({ color: 0x101c22, metalness: 0.1, roughness: 0.08, transmission: 0.35, transparent: true, opacity: 0.85, clearcoat: 1, clearcoatRoughness: 0.06 });
const matLightWarm = new THREE.MeshStandardMaterial({ color: 0xfff0cc, emissive: 0xffcf70, emissiveIntensity: 1.2, roughness: 0.3 });
const matLightRed  = new THREE.MeshStandardMaterial({ color: 0xff5040, emissive: 0xcc1808, emissiveIntensity: 1.0, roughness: 0.4 });

// ---------------------------------------------------------------- Helpers
function box(w, h, d, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function cyl(rt, rb, h, mat, seg = 24) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function put(mesh, x, y, z, parent) { mesh.position.set(x, y, z); parent.add(mesh); return mesh; }

// ---------------------------------------------------------------- Truck root
const truck = new THREE.Group();
scene.add(truck);

// ======================================================= CHASSIS FRAME
const chassis = new THREE.Group();
truck.add(chassis);

for (const z of [0.5, -0.5]) {
  const rail = box(7.9, 0.28, 0.18, matFrame);
  put(rail, -0.25, 1.0, z, chassis);
}
for (const x of [3.0, 1.5, 0.2, -1.5, -3.0, -4.0]) {
  put(box(0.16, 0.2, 1.0, matFrame), x, 1.0, 0, chassis);
}
// front bumper
put(box(0.28, 0.36, 2.35, matDark), 4.02, 0.78, 0, chassis);
// fuel tanks (either side, under frame)
for (const z of [0.78, -0.78]) {
  const tank = cyl(0.33, 0.33, 1.3, matChrome, 24);
  tank.rotation.z = Math.PI / 2;
  put(tank, 0.7, 0.74, z, chassis);
}
// drive shaft
const shaft = cyl(0.06, 0.06, 4.4, matBolt, 12);
shaft.rotation.z = Math.PI / 2;
put(shaft, -0.6, 0.62, 0, chassis);

// ======================================================= WHEELS
const R = 0.62, W = 0.44;

function makeWheel(radius, width) {
  const g = new THREE.Group();

  const tire = cyl(radius, radius, width, matTire, 40);
  tire.rotation.x = Math.PI / 2;
  g.add(tire);

  const inner = cyl(radius * 0.98, radius * 0.98, width * 1.01, matTire, 32);
  inner.rotation.x = Math.PI / 2;
  g.add(inner);

  const rimD = cyl(radius * 0.6, radius * 0.6, width * 1.03, matRim, 30);
  rimD.rotation.x = Math.PI / 2;
  g.add(rimD);

  const hub = cyl(radius * 0.26, radius * 0.26, width * 1.12, matHub, 20);
  hub.rotation.x = Math.PI / 2;
  g.add(hub);

  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    const b = cyl(0.045, 0.045, width * 1.18, matBolt, 8);
    b.rotation.x = Math.PI / 2;
    b.position.set(Math.cos(a) * radius * 0.42, Math.sin(a) * radius * 0.42, 0);
    g.add(b);
  }

  // rugged tread lugs
  const lugs = 26;
  for (let i = 0; i < lugs; i++) {
    const a = (i / lugs) * Math.PI * 2;
    const lug = box(0.11, 0.17, width * 0.9, matTire);
    lug.position.set(Math.cos(a) * radius, Math.sin(a) * radius, 0);
    lug.rotation.z = a;
    g.add(lug);
  }
  return g;
}

function placeWheel(x, z, radius, width) {
  const w = makeWheel(radius, width);
  w.position.set(x, radius, z);
  truck.add(w);
  return w;
}

// front steer axle — single tires
placeWheel(3.2, 1.18, R, W);
placeWheel(3.2, -1.18, R, W);
// rear tandem axles — DUAL tires each side
for (const ax of [-1.5, -2.85]) {
  for (const s of [1, -1]) {
    placeWheel(ax, s * 1.02, R, W);
    placeWheel(ax, s * 1.52, R, W);
  }
}

// axle beams + differentials
const fAxle = cyl(0.1, 0.1, 2.5, matFrame, 16);
fAxle.rotation.x = Math.PI / 2;
put(fAxle, 3.2, 0.62, 0, truck);
for (const ax of [-1.5, -2.85]) {
  const beam = cyl(0.11, 0.11, 3.4, matFrame, 16);
  beam.rotation.x = Math.PI / 2;
  put(beam, ax, 0.62, 0, truck);
  put(new THREE.Mesh(new THREE.SphereGeometry(0.34, 20, 16), matFrame), ax, 0.62, 0, truck)
    .castShadow = true;
}
// mud flaps behind rear wheels
for (const z of [1.28, -1.28]) {
  const flap = box(0.05, 0.55, 1.0, matDark);
  put(flap, -3.55, 0.42, z, truck);
}

// ======================================================= CAB + HOOD
const cab = new THREE.Group();
truck.add(cab);

// engine hood
const hood = box(1.4, 0.98, 2.2, matYellow);
put(hood, 3.2, 1.62, 0, cab);
// hood taper top
put(box(1.2, 0.18, 2.0, matYellowDim), 3.15, 2.18, 0, cab);

// cab body
const cabBody = box(1.12, 1.9, 2.42, matYellow);
put(cabBody, 2.02, 2.07, 0, cab);
// cab roof
put(box(1.1, 0.14, 2.3, matYellowDim), 2.02, 3.05, 0, cab);

// windshield (slanted)
const wind = box(0.07, 0.92, 1.95, matGlass);
wind.position.set(2.5, 2.5, 0);
wind.rotation.z = -0.32;
cab.add(wind);

// side windows
for (const z of [1.22, -1.22]) {
  const sw = box(0.85, 0.72, 0.05, matGlass);
  put(sw, 2.02, 2.45, z, cab);
  // door line
  put(box(0.9, 1.0, 0.04, matYellowDim), 2.02, 1.65, z * 1.005, cab);
}

// grille + headlights + bumper details
put(box(0.06, 0.72, 1.6, matDark), 3.905, 1.62, 0, cab);
for (let i = 0; i < 5; i++) {
  put(box(0.08, 0.05, 1.55, matBolt), 3.92, 1.34 + i * 0.14, 0, cab);
}
for (const z of [0.72, -0.72]) {
  const hl = cyl(0.16, 0.16, 0.12, matLightWarm, 18);
  hl.rotation.z = Math.PI / 2;
  put(hl, 3.94, 1.42, z, cab);
}
// mirrors
for (const z of [1.32, -1.32]) {
  const arm = cyl(0.03, 0.03, 0.5, matDark, 8);
  put(arm, 2.75, 2.4, z, cab);
  const mir = box(0.05, 0.5, 0.2, matDark);
  put(mir, 2.78, 2.5, z + Math.sign(z) * 0.12, cab);
}
// twin exhaust stacks behind cab
for (const z of [1.05, -1.05]) {
  const stack = cyl(0.09, 0.09, 2.0, matChrome, 16);
  put(stack, 1.5, 2.1, z, cab);
  const cap = cyl(0.12, 0.09, 0.14, matChrome, 16);
  put(cap, 1.5, 3.12, z, cab);
}
// steps under doors
for (const z of [1.25, -1.25]) {
  put(box(0.4, 0.05, 0.35, matFrame), 2.3, 1.05, z, cab);
  put(box(0.4, 0.05, 0.35, matFrame), 2.3, 0.68, z, cab);
}
// front fender arches
for (const z of [1.18, -1.18]) {
  const fend = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.09, 10, 20, Math.PI), matYellowDim);
  fend.rotation.y = Math.PI / 2;
  fend.position.set(3.2, 0.72, z);
  fend.castShadow = true;
  cab.add(fend);
}

// ======================================================= DUMP BED (tipper) — pivots at rear
const bedPivot = new THREE.Vector3(-4.1, 1.14, 0);
const bed = new THREE.Group();
bed.position.copy(bedPivot);
truck.add(bed);

// floor (local x: 0 at pivot/rear -> +5.2 at front)
put(box(5.2, 0.16, 2.7, matYellowDim), 2.6, 0.08, 0, bed);
// darker inner liner
put(box(5.0, 0.03, 2.5, matBedInner), 2.6, 0.18, 0, bed);
// side walls
for (const z of [1.3, -1.3]) {
  put(box(5.2, 1.25, 0.12, matYellow), 2.6, 0.79, z, bed);
  // inner wall liner
  put(box(5.0, 1.15, 0.02, matBedInner), 2.6, 0.79, z - Math.sign(z) * 0.07, bed);
  // exterior ribs
  for (let i = 0; i < 5; i++) {
    put(box(0.12, 1.2, 0.08, matYellowDim), 0.7 + i * 1.1, 0.79, z + Math.sign(z) * 0.08, bed);
  }
}
// front headboard / cab guard (taller)
put(box(0.18, 1.75, 2.7, matYellow), 5.12, 1.03, 0, bed);
put(box(0.5, 0.1, 2.6, matYellowDim), 4.9, 1.95, 0, bed);
// tailgate
put(box(0.14, 1.25, 2.7, matYellow), 0.06, 0.79, 0, bed);
for (const z of [0.9, -0.9]) {
  put(box(0.18, 0.2, 0.14, matDark), 0.02, 1.3, z, bed); // hinge caps
}
// rear light cluster
for (const z of [1.1, -1.1]) {
  put(box(0.1, 0.35, 0.25, matLightRed), 0.0, 0.5, z, bed);
}

// hydraulic rams (dynamic, between chassis and bed underside)
const ramBaseL = new THREE.Vector3(0.5, 0.98, 0.42);
const ramBaseR = new THREE.Vector3(0.5, 0.98, -0.42);
const ramAttachL = new THREE.Vector3(3.4, 0.02, 0.42); // local to bed
const ramAttachR = new THREE.Vector3(3.4, 0.02, -0.42);
const yAxis = new THREE.Vector3(0, 1, 0);

function makeRam() {
  const m = cyl(0.075, 0.075, 1, matChrome, 14); // unit height, scaled per frame
  truck.add(m);
  return m;
}
const ramL = makeRam();
const ramR = makeRam();
// fixed ram feet
put(new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 10), matDark), ramBaseL.x, ramBaseL.y, ramBaseL.z, truck);
put(new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 10), matDark), ramBaseR.x, ramBaseR.y, ramBaseR.z, truck);

function orientRam(mesh, a, b) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  mesh.position.copy(a).addScaledVector(dir, 0.5);
  mesh.scale.set(1, len, 1);
  mesh.quaternion.setFromUnitVectors(yAxis, dir.clone().normalize());
}

// ---------------------------------------------------------------- Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.minDistance = 6;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI * 0.495;
controls.target.set(0, 1.7, 0);

// ---------------------------------------------------------------- Animation
const clock = new THREE.Clock();
const MAX_TILT = 0.5; // radians (~28°)
const smooth = t => t * t * (3 - 2 * t);

function bedRaiseFactor(time) {
  const period = 16;
  const p = (time % period) / period;
  if (p < 0.22) return smooth(p / 0.22);
  if (p < 0.55) return 1;
  if (p < 0.8) return 1 - smooth((p - 0.55) / 0.25);
  return 0;
}

const aL = new THREE.Vector3(), aR = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  bed.rotation.z = bedRaiseFactor(t) * MAX_TILT;
  truck.updateMatrixWorld(true);

  aL.copy(ramAttachL).applyMatrix4(bed.matrixWorld);
  aR.copy(ramAttachR).applyMatrix4(bed.matrixWorld);
  orientRam(ramL, ramBaseL, aL);
  orientRam(ramR, ramBaseR, aR);

  controls.update();
  renderer.render(scene, camera);
}
animate();

// ---------------------------------------------------------------- Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});
</script>
</body>
</html>
