<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snow Berm at Plowed Lot Edge</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #b9c8d3; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8c8d4);
scene.fog = new THREE.Fog(0xb8c8d4, 35, 75);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 150);
camera.position.set(17, 10.5, 17);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.15, 3.5);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.2;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 10;
controls.maxDistance = 42;

scene.add(new THREE.HemisphereLight(0xe7f2ff, 0x68737a, 2.1));

const sun = new THREE.DirectionalLight(0xfff8e8, 3.8);
sun.position.set(-14, 24, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -27;
sun.shadow.camera.right = 27;
sun.shadow.camera.top = 27;
sun.shadow.camera.bottom = -22;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 65;
sun.shadow.bias = -0.0004;
scene.add(sun);

const asphaltMat = new THREE.MeshStandardMaterial({
  color: 0x3d4549,
  roughness: 0.96,
  metalness: 0.02
});
const snowMat = new THREE.MeshStandardMaterial({
  color: 0xe8eef0,
  roughness: 0.94,
  metalness: 0
});
const snowShadeMat = new THREE.MeshStandardMaterial({
  color: 0xcbd6da,
  roughness: 1
});
const dirtyMat = new THREE.MeshStandardMaterial({
  color: 0x655e56,
  roughness: 1
});
const wetMat = new THREE.MeshStandardMaterial({
  color: 0x242c2f,
  roughness: 0.88,
  metalness: 0.02
});
const whitePaintMat = new THREE.MeshStandardMaterial({
  color: 0xdce2df,
  roughness: 0.8
});
const yellowPaintMat = new THREE.MeshStandardMaterial({
  color: 0xd0ad42,
  roughness: 0.86
});

function box(w, h, d, x, y, z, material, cast = false) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  mesh.position.set(x, y, z);
  mesh.castShadow = cast;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

box(31, 0.22, 17, 0, -0.12, -1.2, asphaltMat, false);

const snowGroundMat = new THREE.MeshStandardMaterial({ color: 0xdde7e9, roughness: 1 });
box(42, 0.32, 18, 0, -0.27, 10.2, snowGroundMat, false);

function bermProfile(z) {
  const center = 6.0;
  const width = 1.48;
  const t = Math.max(0, 1 - Math.abs(z - center) / width);
  return t * t * (0.94 + 0.06 * Math.sin(z * 4.7));
}

function bermHeight(x, z) {
  const endFade = Math.min(1, Math.max(0, (13.8 - Math.abs(x)) / 1.2));
  const irregular = 0.94 + 0.045 * Math.sin(x * 1.55) + 0.025 * Math.sin(x * 4.2 + z);
  return 0.18 + 2.38 * bermProfile(z) * irregular * endFade;
}

function dirtyHeight(x, z) {
  return 0.1 + 0.43 * bermProfile(z) * (0.95 + 0.04 * Math.sin(x * 2.2));
}

function buildBerm(material, lowerOffset, isSnow) {
  const positions = [];
  const indices = [];
  let vertex = 0;

  function quad(a, b, c, d) {
    positions.push(...a, ...b, ...c, ...d);
    indices.push(vertex, vertex + 1, vertex + 2, vertex, vertex + 2, vertex + 3);
    vertex += 4;
  }

  const nx = 52;
  const nz = 16;
  const xmin = -14;
  const xmax = 14;
  const zmin = 3.72;
  const zmax = 8.32;

  for (let ix = 0; ix < nx; ix++) {
    const x0 = xmin + (xmax - xmin) * ix / nx;
    const x1 = xmin + (xmax - xmin) * (ix + 1) / nx;
    for (let iz = 0; iz < nz; iz++) {
      const z0 = zmin + (zmax - zmin) * iz / nz;
      const z1 = zmin + (zmax - zmin) * (iz + 1) / nz;
      const y00 = (isSnow ? dirtyHeight(x0, z0) + bermHeight(x0, z0) : dirtyHeight(x0, z0)) + lowerOffset;
      const y10 = (isSnow ? dirtyHeight(x1, z0) + bermHeight(x1, z0) : dirtyHeight(x1, z0)) + lowerOffset;
      const y11 = (isSnow ? dirtyHeight(x1, z1) + bermHeight(x1, z1) : dirtyHeight(x1, z1)) + lowerOffset;
      const y01 = (isSnow ? dirtyHeight(x0, z1) + bermHeight(x0, z1) : dirtyHeight(x0, z1)) + lowerOffset;
      quad([x0, y00, z0], [x1, y10, z0], [x1, y11, z1], [x0, y01, z1]);
    }
  }

  if (isSnow) {
    for (let ix = 0; ix < nx; ix++) {
      const x0 = xmin + (xmax - xmin) * ix / nx;
      const x1 = xmin + (xmax - xmin) * (ix + 1) / nx;
      const a = dirtyHeight(x0, zmin) + lowerOffset;
      const b = dirtyHeight(x1, zmin) + lowerOffset;
      quad([x0, a, zmin], [x0, a, zmin], [x1, b, zmin], [x1, b, zmin]);
    }
  }

  for (let ix = 0; ix < nx; ix++) {
    const x0 = xmin + (xmax - xmin) * ix / nx;
    const x1 = xmin + (xmax - xmin) * (ix + 1) / nx;
    const ya0 = isSnow ? dirtyHeight(x0, zmin) + lowerOffset : 0.08;
    const ya1 = isSnow ? dirtyHeight(x1, zmin) + lowerOffset : 0.08;
    const yb0 = isSnow ? dirtyHeight(x0, zmax) + lowerOffset : 0.08;
    const yb1 = isSnow ? dirtyHeight(x1, zmax) + lowerOffset : 0.08;
    const ta0 = (isSnow ? dirtyHeight(x0, zmin) + bermHeight(x0, zmin) : dirtyHeight(x0, zmin)) + lowerOffset;
    const ta1 = (isSnow ? dirtyHeight(x1, zmin) + bermHeight(x1, zmin) : dirtyHeight(x1, zmin)) + lowerOffset;
    const tb0 = (isSnow ? dirtyHeight(x0, zmax) + bermHeight(x0, zmax) : dirtyHeight(x0, zmax)) + lowerOffset;
    const tb1 = (isSnow ? dirtyHeight(x1, zmax) + bermHeight(x1, zmax) : dirtyHeight(x1, zmax)) + lowerOffset;
    quad([x0, ya0, zmin], [x1, ya1, zmin], [x1, ta1, zmin], [x0, ta0, zmin]);
    quad([x1, yb1, zmax], [x0, yb0, zmax], [x0, tb0, zmax], [x1, tb1, zmax]);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = isSnow;
  mesh.receiveShadow = true;
  scene.add(mesh);
}

buildBerm(dirtyMat, 0, false);
buildBerm(snowMat, 0.035, true);

for (let i = 0; i < 34; i++) {
  const x = -13.2 + (i / 33) * 26.4;
  const z = 5.35 + 0.65 * Math.sin(i * 2.17);
  const y = dirtyHeight(x, z) + bermHeight(x, z) + 0.03;
  const size = 0.18 + 0.12 * (0.5 + 0.5 * Math.sin(i * 5.1));
  const chunk = new THREE.Mesh(
    new THREE.DodecahedronGeometry(1, 1),
    i % 3 === 0 ? snowShadeMat : snowMat
  );
  chunk.position.set(x, y, z);
  chunk.scale.set(size * 1.5, size * 0.65, size);
  chunk.rotation.set(i * 0.37, i * 0.81, i * 0.22);
  chunk.castShadow = true;
  chunk.receiveShadow = true;
  scene.add(chunk);
}

box(28, 0.035, 0.12, 0, 0.018, 3.28, yellowPaintMat);
for (let x = -11.5; x <= 11.5; x += 3.8) {
  box(0.095, 0.04, 6.0, x, 0.022, -0.05, whitePaintMat);
}
box(27, 0.04, 0.09, 0, 0.022, -3.05, whitePaintMat);

for (let i = 0; i < 9; i++) {
  const x = -12.5 + i * 3.1;
  box(0.085, 0.025, 1.5, x, 0.019, 2.35, yellowPaintMat);
}

const tireMat = new THREE.MeshBasicMaterial({ color: 0x1f2527, transparent: true, opacity: 0.22 });
for (const side of [-1, 1]) {
  const points = [];
  for (let i = 0; i <= 16; i++) {
    const x = -12 + i * 1.45;
    const z = -4.3 + side * 0.16 * Math.sin(i * 0.8);
    points.push(new THREE.Vector3(x, 0.026, z));
  }
  const curve = new THREE.CatmullRomCurve3(points);
  const track = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, 0.075, 6, false), tireMat);
  track.scale.y = 0.12;
  scene.add(track);
}

const saltMat = new THREE.MeshStandardMaterial({ color: 0xa9a79d, roughness: 1 });
for (let i = 0; i < 55; i++) {
  const x = -13.5 + Math.random() * 27;
  const z = 3.35 + Math.random() * 1.0;
  const s = 0.025 + Math.random() * 0.055;
  const pebble = new THREE.Mesh(new THREE.SphereGeometry(s, 6, 4), saltMat);
  pebble.position.set(x, 0.04 + Math.random() * 0.04, z);
  pebble.scale.y = 0.35;
  pebble.castShadow = true;
  scene.add(pebble);
}

const horizonMat = new THREE.MeshStandardMaterial({ color: 0xcdd9dc, roughness: 1 });
for (let i = 0; i < 11; i++) {
  const x = -25 + i * 5.3;
  const h = 0.55 + (i % 3) * 0.16;
  const mound = new THREE.Mesh(new THREE.SphereGeometry(2.4, 10, 6), horizonMat);
  mound.position.set(x, h - 1.8, 15.5 + (i % 2) * 1.2);
  mound.scale.set(1.5, 0.7, 0.65);
  mound.receiveShadow = true;
  scene.add(mound);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
</body>
</html>
