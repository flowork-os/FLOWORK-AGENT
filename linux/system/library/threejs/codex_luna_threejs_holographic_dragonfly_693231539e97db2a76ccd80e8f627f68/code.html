<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holographic Dragonfly</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030a}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02030a);
scene.fog = new THREE.FogExp2(0x050719, 0.035);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.3, 3.4, 7.5);
camera.lookAt(0, 0.25, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 4;
controls.maxDistance = 13;
controls.target.set(0, 0.15, 0);

scene.add(new THREE.HemisphereLight(0x83aaff, 0x10051e, 1.5));

const keyLight = new THREE.DirectionalLight(0xc5e7ff, 3.2);
keyLight.position.set(4, 7, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
scene.add(keyLight);

const magentaLight = new THREE.PointLight(0xff168d, 18, 12, 2);
magentaLight.position.set(-4, 1.5, 2);
scene.add(magentaLight);

const cyanLight = new THREE.PointLight(0x00d9ff, 20, 14, 2);
cyanLight.position.set(4, 0.5, -3);
scene.add(cyanLight);

const dragonfly = new THREE.Group();
dragonfly.rotation.y = -0.16;
scene.add(dragonfly);

const holoBody = new THREE.MeshPhysicalMaterial({
  color: 0x14212e,
  metalness: 0.84,
  roughness: 0.2,
  iridescence: 1,
  iridescenceIOR: 1.55,
  iridescenceThicknessRange: [120, 720],
  emissive: 0x061629,
  emissiveIntensity: 0.75
});

const darkBody = new THREE.MeshPhysicalMaterial({
  color: 0x07121d,
  metalness: 0.9,
  roughness: 0.24,
  iridescence: 0.85,
  iridescenceIOR: 1.5,
  iridescenceThicknessRange: [160, 620],
  emissive: 0x07162b,
  emissiveIntensity: 0.55
});

const eyeMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x273c5b,
  metalness: 0.35,
  roughness: 0.08,
  iridescence: 1,
  iridescenceIOR: 1.62,
  iridescenceThicknessRange: [220, 900],
  emissive: 0x10296a,
  emissiveIntensity: 1.1
});

const glowMaterial = new THREE.MeshBasicMaterial({
  color: 0x5ff6ff,
  transparent: true,
  opacity: 0.8,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

function addMesh(geometry, material, position, scale) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(position[0], position[1], position[2]);
  if (scale) mesh.scale.set(scale[0], scale[1], scale[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  dragonfly.add(mesh);
  return mesh;
}

function cylinderBetween(a, b, radius, material, radialSegments = 10) {
  const start = new THREE.Vector3(a[0], a[1], a[2]);
  const end = new THREE.Vector3(b[0], b[1], b[2]);
  const direction = new THREE.Vector3().subVectors(end, start);
  const length = direction.length();
  const geometry = new THREE.CylinderGeometry(radius * 0.92, radius, length, radialSegments);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.castShadow = true;
  dragonfly.add(mesh);
  return mesh;
}

addMesh(new THREE.SphereGeometry(0.46, 32, 20), holoBody, [0, 0.35, 0.2], [1.18, 0.9, 1.2]);
addMesh(new THREE.SphereGeometry(0.38, 32, 20), holoBody, [0, 0.52, 0.76], [1.12, 0.94, 1.02]);

const head = addMesh(new THREE.SphereGeometry(0.44, 32, 20), darkBody, [0, 0.5, 1.05], [1.1, 0.94, 1.0]);

for (const side of [-1, 1]) {
  const eye = addMesh(new THREE.SphereGeometry(0.31, 28, 18), eyeMaterial, [side * 0.27, 0.62, 1.08], [1.0, 1.08, 0.9]);
  eye.rotation.z = side * 0.12;
  addMesh(new THREE.SphereGeometry(0.075, 16, 12), glowMaterial, [side * 0.35, 0.78, 1.27], [1, 0.7, 0.45]);
}

const abdomenCount = 12;
for (let i = 0; i < abdomenCount; i++) {
  const z = 0.02 - i * 0.27;
  const radius = 0.2 - i * 0.0105;
  addMesh(new THREE.SphereGeometry(radius, 22, 14), holoBody, [0, 0.24 - i * 0.004, z], [0.82, 0.86, 1.34]);
  if (i < abdomenCount - 1) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(radius * 0.96, 0.026, 8, 24), glowMaterial);
    ring.rotation.x = Math.PI / 2;
    ring.position.set(0, 0.24 - i * 0.004, z - 0.13);
    dragonfly.add(ring);
  }
}

const tailTip = addMesh(new THREE.ConeGeometry(0.12, 0.48, 12), darkBody, [0, 0.19, -3.22]);
tailTip.rotation.x = -Math.PI / 2;

for (const side of [-1, 1]) {
  for (let i = 0; i < 3; i++) {
    const z = 0.18 - i * 0.34;
    const start = [side * 0.27, 0.28 - i * 0.01, z];
    const knee = [side * (0.7 + i * 0.06), 0.04 - i * 0.08, z - 0.16];
    const end = [side * (1.13 + i * 0.12), -0.08 - i * 0.12, z - 0.02];
    cylinderBetween(start, knee, 0.026, darkBody, 7);
    cylinderBetween(knee, end, 0.018, holoBody, 7);
  }
}

const antennaCurveLeft = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-0.18, 0.73, 1.32),
  new THREE.Vector3(-0.34, 1.02, 1.52),
  new THREE.Vector3(-0.64, 1.15, 1.68),
  new THREE.Vector3(-0.95, 1.2, 1.75)
]);
const antennaCurveRight = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0.18, 0.73, 1.32),
  new THREE.Vector3(0.34, 1.02, 1.52),
  new THREE.Vector3(0.64, 1.15, 1.68),
  new THREE.Vector3(0.95, 1.2, 1.75)
]);
for (const curve of [antennaCurveLeft, antennaCurveRight]) {
  const antenna = new THREE.Mesh(new THREE.TubeGeometry(curve, 20, 0.018, 6, false), glowMaterial);
  dragonfly.add(antenna);
}

const wingUniforms = { uTime: { value: 0 } };
const wingMaterial = new THREE.ShaderMaterial({
  uniforms: wingUniforms,
  transparent: true,
  side: THREE.DoubleSide,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    varying vec2 vUv;
    varying vec3 vPos;
    void main(){
      vUv=uv;
      vPos=position;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;
    varying vec3 vPos;
    vec3 hsv2rgb(vec3 c){
      vec4 K=vec4(1.0,2.0/3.0,1.0/3.0,3.0);
      vec3 p=abs(fract(c.xxx+K.xyz)*6.0-K.www);
      return c.z*mix(K.xxx,clamp(p-K.xxx,0.0,1.0),c.y);
    }
    void main(){
      float sweep=sin(uTime*1.25+vUv.x*9.0+vUv.y*5.0)*0.5+0.5;
      float hue=fract(0.58+vUv.x*0.34-vUv.y*0.18+uTime*0.045);
      vec3 color=hsv2rgb(vec3(hue,0.72,0.9));
      float edge=min(min(vUv.x,1.0-vUv.x),min(vUv.y,1.0-vUv.y));
      float glint=pow(max(0.0,sin(vUv.x*38.0-vUv.y*17.0+uTime*4.0)),18.0);
      float alpha=(0.22+0.12*sweep+0.7*glint)*smoothstep(0.0,0.13,edge);
      gl_FragColor=vec4(color+vec3(glint)*1.6,alpha);
    }
  `
});

const veinMaterial = new THREE.LineBasicMaterial({
  color: 0x9beaff,
  transparent: true,
  opacity: 0.62,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

function addWing(side, forward) {
  const offset = forward ? 0.2 : -0.42;
  const points = [
    [0, offset], [0.72, offset + 0.04], [1.65, offset + 0.22],
    [2.55, offset + 0.32], [3.38, offset + 0.16], [3.72, offset - 0.1],
    [3.35, offset - 0.38], [2.5, offset - 0.55], [1.5, offset - 0.45],
    [0.55, offset - 0.23]
  ];
  const shape = new THREE.Shape();
  shape.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) shape.lineTo(points[i][0], points[i][1]);
  shape.closePath();

  const wingGroup = new THREE.Group();
  wingGroup.position.set(side * 0.17, 0.56, forward ? 0.25 : -0.02);
  wingGroup.scale.x = side;
  wingGroup.rotation.x = -Math.PI / 2;
  wingGroup.rotation.y = side * (forward ? -0.08 : 0.08);
  wingGroup.rotation.z = side * 0.035;

  const wing = new THREE.Mesh(new THREE.ShapeGeometry(shape), wingMaterial);
  wing.renderOrder = 2;
  wingGroup.add(wing);

  const veinPoints = [];
  const addVein = (a, b) => {
    veinPoints.push(new THREE.Vector3(a[0], a[1], 0.012), new THREE.Vector3(b[0], b[1], 0.012));
  };
  addVein([0, offset], [3.45, offset - 0.03]);
  addVein([0.28, offset], [1.12, offset + 0.27]);
  addVein([1.12, offset + 0.27], [2.4, offset + 0.3]);
  addVein([0.34, offset], [1.28, offset - 0.34]);
  addVein([1.28, offset - 0.34], [2.5, offset - 0.48]);
  addVein([1.7, offset - 0.02], [2.82, offset - 0.28]);
  addVein([2.24, offset - 0.02], [3.15, offset + 0.11]);
  addVein([0.75, offset + 0.02], [1.0, offset - 0.22]);

  const veins = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(veinPoints), veinMaterial);
  veins.renderOrder = 3;
  wingGroup.add(veins);

  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 8), glowMaterial);
  tip.position.set(3.48, offset - 0.01, 0.02);
  wingGroup.add(tip);

  dragonfly.add(wingGroup);
}

addWing(-1, true);
addWing(1, true);
addWing(-1, false);
addWing(1, false);

const haloMaterial = new THREE.MeshBasicMaterial({
  color: 0x168cff,
  transparent: true,
  opacity: 0.08,
  side: THREE.DoubleSide,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const halo = new THREE.Mesh(new THREE.RingGeometry(2.8, 3.2, 96), haloMaterial);
halo.rotation.x = Math.PI / 2;
halo.position.y = -0.02;
dragonfly.add(halo);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  wingUniforms.uTime.value = clock.getElapsedTime();
  halo.rotation.z += 0.0015;
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
</body>
</html>
