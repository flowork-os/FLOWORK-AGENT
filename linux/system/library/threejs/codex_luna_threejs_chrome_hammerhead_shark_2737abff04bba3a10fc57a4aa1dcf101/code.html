<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Chrome Hammerhead</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a}
canvas{display:block;width:100%;height:100%}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070a);
scene.fog = new THREE.Fog(0x05070a, 9, 18);

const camera = new THREE.PerspectiveCamera(43, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(5.2, 3.1, 3.25);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.72;
controls.enablePan = false;
controls.minDistance = 4.4;
controls.maxDistance = 10;
controls.minPolarAngle = 0.42;
controls.maxPolarAngle = 1.85;
controls.target.set(0.5, 0, 0.02);

const environment = new THREE.Scene();
environment.background = new THREE.Color(0x1a222c);

const envDark = new THREE.MeshBasicMaterial({ color: 0x10151c });
const envMid = new THREE.MeshBasicMaterial({ color: 0x2a333e });
const envBlue = new THREE.MeshBasicMaterial({ color: 0x527a9b });
const envWhite = new THREE.MeshBasicMaterial({ color: 0xeaf5ff });
const envWarm = new THREE.MeshBasicMaterial({ color: 0xffd9b0 });

const envFloor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), envDark);
envFloor.rotation.x = -Math.PI / 2;
envFloor.position.z = -1.42;
environment.add(envFloor);

const envCeiling = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), envMid);
envCeiling.rotation.x = Math.PI / 2;
envCeiling.position.z = 4.5;
environment.add(envCeiling);

const envBack = new THREE.Mesh(new THREE.PlaneGeometry(30, 12), envMid);
envBack.position.set(0, -6, 1.5);
envBack.rotation.x = Math.PI / 2;
environment.add(envBack);

function addEnvironmentBar(size, position, material, rotation) {
  const bar = new THREE.Mesh(new THREE.BoxGeometry(size.x, size.y, size.z), material);
  bar.position.copy(position);
  if (rotation) bar.rotation.set(rotation.x, rotation.y, rotation.z);
  environment.add(bar);
}

addEnvironmentBar(new THREE.Vector3(0.16, 7.5, 0.18), new THREE.Vector3(-3.6, -3.6, 1.25), envWhite, new THREE.Euler(0, 0, -0.12));
addEnvironmentBar(new THREE.Vector3(0.20, 6.4, 0.16), new THREE.Vector3(2.7, 3.4, 1.8), envBlue, new THREE.Euler(0, 0, 0.18));
addEnvironmentBar(new THREE.Vector3(5.5, 0.14, 0.16), new THREE.Vector3(0.3, -2.9, 3.15), envWhite, new THREE.Euler(0, 0, 0));
addEnvironmentBar(new THREE.Vector3(3.5, 0.11, 0.12), new THREE.Vector3(-1.9, 2.5, 3.7), envWarm, new THREE.Euler(0, 0, -0.2));
addEnvironmentBar(new THREE.Vector3(0.12, 4.8, 0.12), new THREE.Vector3(0.4, 4.0, 1.5), envWhite, new THREE.Euler(0.12, 0, 0));
addEnvironmentBar(new THREE.Vector3(0.22, 3.8, 0.14), new THREE.Vector3(-1.8, 1.0, 1.0), envBlue, new THREE.Euler(0, 0, 0.32));

const reflectionTarget = new THREE.WebGLCubeRenderTarget(512, {
  format: THREE.RGBAFormat,
  generateMipmaps: true,
  minFilter: THREE.LinearMipmapLinearFilter
});
const reflectionCamera = new THREE.CubeCamera(0.1, 100, reflectionTarget);
reflectionCamera.position.set(0.25, 0, 0.08);
reflectionCamera.update(renderer, environment);

const chrome = new THREE.MeshPhysicalMaterial({
  color: 0xc7d1d8,
  metalness: 1,
  roughness: 0.075,
  clearcoat: 1,
  clearcoatRoughness: 0.035,
  envMap: reflectionTarget.texture,
  envMapIntensity: 2.35
});

const chromeSoft = new THREE.MeshPhysicalMaterial({
  color: 0x9eabb5,
  metalness: 1,
  roughness: 0.15,
  clearcoat: 1,
  clearcoatRoughness: 0.06,
  envMap: reflectionTarget.texture,
  envMapIntensity: 2.1
});

const darkChrome = new THREE.MeshPhysicalMaterial({
  color: 0x111820,
  metalness: 0.92,
  roughness: 0.12,
  clearcoat: 1,
  clearcoatRoughness: 0.04,
  envMap: reflectionTarget.texture,
  envMapIntensity: 1.8
});

const gillMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x020306,
  metalness: 0.45,
  roughness: 0.22,
  clearcoat: 0.7,
  clearcoatRoughness: 0.08,
  envMap: reflectionTarget.texture,
  envMapIntensity: 0.8
});

const shark = new THREE.Group();
scene.add(shark);

function signedPower(value, exponent) {
  return Math.sign(value) * Math.pow(Math.abs(value), exponent);
}

function createHammerHead() {
  const geometry = new THREE.BufferGeometry();
  const positions = [];
  const uvs = [];
  const indices = [];
  const latitudes = 30;
  const longitudes = 64;
  const centerX = -1.15;
  const radiusX = 0.78;
  const radiusY = 1.34;
  const radiusZ = 0.53;

  for (let i = 0; i <= latitudes; i++) {
    const phi = i / latitudes * Math.PI;
    const sinPhi = Math.sin(phi);
    const cosPhi = Math.cos(phi);

    for (let j = 0; j <= longitudes; j++) {
      const theta = j / longitudes * Math.PI * 2;
      const x = centerX + radiusX * sinPhi * signedPower(Math.cos(theta), 0.34);
      const y = radiusY * sinPhi * signedPower(Math.sin(theta), 0.34);
      const z = 0.06 + radiusZ * signedPower(cosPhi, 0.58);
      positions.push(x, y, z);
      uvs.push(j / longitudes, i / latitudes);
    }
  }

  for (let i = 0; i < latitudes; i++) {
    for (let j = 0; j < longitudes; j++) {
      const a = i * (longitudes + 1) + j;
      const b = a + longitudes + 1;
      indices.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }

  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

function createBody() {
  const geometry = new THREE.BufferGeometry();
  const positions = [];
  const uvs = [];
  const indices = [];
  const rings = [
    { x: -0.62, width: 0.69, height: 0.43 },
    { x: -0.35, width: 0.68, height: 0.47 },
    { x: 0.05, width: 0.61, height: 0.45 },
    { x: 0.55, width: 0.52, height: 0.40 },
    { x: 1.10, width: 0.41, height: 0.33 },
    { x: 1.62, width: 0.29, height: 0.24 },
    { x: 2.13, width: 0.18, height: 0.16 },
    { x: 2.40, width: 0.105, height: 0.105 }
  ];
  const radialSegments = 40;

  for (let i = 0; i < rings.length; i++) {
    const section = rings[i];
    const t = i / (rings.length - 1);

    for (let j = 0; j <= radialSegments; j++) {
      const theta = j / radialSegments * Math.PI * 2;
      const ripple = 1 + 0.035 * Math.sin(section.x * 10.5 + theta * 2.4) * (1 - t * 0.45);
      const y = section.width * Math.cos(theta) * ripple;
      const z = 0.02 + section.height * Math.sin(theta) * ripple + 0.025 * Math.sin(t * Math.PI);
      positions.push(section.x, y, z);
      uvs.push(t, j / radialSegments);
    }
  }

  for (let i = 0; i < rings.length - 1; i++) {
    for (let j = 0; j < radialSegments; j++) {
      const a = i * (radialSegments + 1) + j;
      const b = a + radialSegments + 1;
      indices.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }

  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

function createFin(points, depth, material, vertical) {
  const shape = new THREE.Shape();
  shape.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) shape.lineTo(points[i][0], points[i][1]);
  shape.closePath();

  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth,
    bevelEnabled: true,
    bevelSegments: 3,
    bevelSize: 0.035,
    bevelThickness: 0.035,
    curveSegments: 8
  });

  if (vertical) {
    geometry.rotateX(Math.PI / 2);
    geometry.translate(0, depth / 2, 0);
  } else {
    geometry.translate(0, 0, -depth / 2);
  }

  geometry.computeVertexNormals();
  return new THREE.Mesh(geometry, material);
}

function addTube(points, radius, material, tubularSegments = 28) {
  const curve = new THREE.CatmullRomCurve3(points);
  const geometry = new THREE.TubeGeometry(curve, tubularSegments, radius, 8, false);
  const mesh = new THREE.Mesh(geometry, material);
  shark.add(mesh);
  return mesh;
}

const head = new THREE.Mesh(createHammerHead(), chrome);
head.castShadow = true;
head.receiveShadow = true;
shark.add(head);

const body = new THREE.Mesh(createBody(), chrome);
body.castShadow = true;
body.receiveShadow = true;
shark.add(body);

const dorsal = createFin([
  [-0.27, 0.25],
  [0.68, 0.23],
  [0.40, 1.23],
  [0.23, 0.82],
  [0.03, 0.45]
], 0.13, chrome, true);
dorsal.castShadow = true;
shark.add(dorsal);

const tailUpper = createFin([
  [2.18, 0.03],
  [2.54, 0.25],
  [3.30, 1.18],
  [3.03, 0.53],
  [2.68, 0.23],
  [2.38, 0.08]
], 0.15, chromeSoft, true);
tailUpper.castShadow = true;
shark.add(tailUpper);

const tailLower = createFin([
  [2.18, -0.02],
  [2.54, -0.25],
  [3.30, -1.03],
  [3.02, -0.47],
  [2.68, -0.21],
  [2.38, -0.07]
], 0.15, chromeSoft, true);
tailLower.castShadow = true;
shark.add(tailLower);

const rightPectoral = createFin([
  [-0.27, 0.43],
  [0.38, 0.76],
  [1.42, 1.50],
  [0.80, 0.47],
  [0.17, 0.31]
], 0.105, chromeSoft, false);
rightPectoral.position.z = -0.16;
rightPectoral.castShadow = true;
shark.add(rightPectoral);

const leftPectoral = createFin([
  [-0.27, -0.43],
  [0.38, -0.76],
  [1.42, -1.50],
  [0.80, -0.47],
  [0.17, -0.31]
], 0.105, chromeSoft, false);
leftPectoral.position.z = -0.16;
leftPectoral.castShadow = true;
shark.add(leftPectoral);

const eyeGeometry = new THREE.SphereGeometry(0.16, 24, 16);
const eyeRight = new THREE.Mesh(eyeGeometry, darkChrome);
eyeRight.position.set(-1.18, 1.275, 0.10);
eyeRight.scale.set(1, 0.32, 0.9);
eyeRight.castShadow = true;
shark.add(eyeRight);

const eyeLeft = new THREE.Mesh(eyeGeometry, darkChrome);
eyeLeft.position.set(-1.18, -1.275, 0.10);
eyeLeft.scale.set(1, 0.32, 0.9);
eyeLeft.castShadow = true;
shark.add(eyeLeft);

const eyeRimGeometry = new THREE.TorusGeometry(0.165, 0.022, 10, 28);
const rimRight = new THREE.Mesh(eyeRimGeometry, chromeSoft);
rimRight.rotation.x = Math.PI / 2;
rimRight.position.set(-1.18, 1.315, 0.10);
shark.add(rimRight);

const rimLeft = new THREE.Mesh(eyeRimGeometry, chromeSoft);
rimLeft.rotation.x = Math.PI / 2;
rimLeft.position.set(-1.18, -1.315, 0.10);
shark.add(rimLeft);

addTube([
  new THREE.Vector3(-1.83, 0.02, -0.30),
  new THREE.Vector3(-1.48, 0.02, -0.46),
  new THREE.Vector3(-0.98, 0.02, -0.48),
  new THREE.Vector3(-0.50, 0.02, -0.31)
], 0.027, gillMaterial, 32);

for (let side of [-1, 1]) {
  for (let i = 0; i < 3; i++) {
    const x = -0.22 + i * 0.17;
    addTube([
      new THREE.Vector3(x, side * 0.57, 0.22),
      new THREE.Vector3(x - 0.035, side * 0.64, 0.02),
      new THREE.Vector3(x + 0.045, side * 0.54, -0.25)
    ], 0.018, gillMaterial, 18);
  }
}

for (let side of [-1, 1]) {
  for (let i = 0; i < 3; i++) {
    const z = 0.18 - i * 0.16;
    addTube([
      new THREE.Vector3(-0.25, side * 0.665, z),
      new THREE.Vector3(0.30, side * 0.57, z + 0.025),
      new THREE.Vector3(0.92, side * 0.43, z * 0.82)
    ], 0.014, chromeSoft, 24);
  }
}

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0x080b10,
  metalness: 0.55,
  roughness: 0.26,
  envMap: reflectionTarget.texture,
  envMapIntensity: 0.7
});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.z = -1.43;
floor.receiveShadow = true;
scene.add(floor);

const backGlow = new THREE.Mesh(
  new THREE.PlaneGeometry(18, 9),
  new THREE.MeshBasicMaterial({ color: 0x080d14 })
);
backGlow.position.set(0, -5, 2.2);
backGlow.rotation.x = Math.PI / 2;
scene.add(backGlow);

const hemisphere = new THREE.HemisphereLight(0x9db8d2, 0x07090d, 1.75);
scene.add(hemisphere);

const keyLight = new THREE.DirectionalLight(0xe7f3ff, 4.0);
keyLight.position.set(-4.5, -4.0, 6.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -6;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 20;
keyLight.shadow.bias = -0.00025;
scene.add(keyLight);

const rimLight = new THREE.SpotLight(0x8cc7ff, 520, 18, Math.PI / 5, 0.62, 1.2);
rimLight.position.set(3.0, 4.5, 5.2);
rimLight.target.position.set(0.6, 0, 0.2);
rimLight.castShadow = true;
rimLight.shadow.mapSize.set(1024, 1024);
scene.add(rimLight);
scene.add(rimLight.target);

const warmLight = new THREE.PointLight(0xffb779, 120, 9, 2);
warmLight.position.set(-3.0, -2.5, 1.8);
scene.add(warmLight);

const coolLight = new THREE.PointLight(0x5ca8ff, 150, 10, 2);
coolLight.position.set(2.7, 2.5, 1.7);
scene.add(coolLight);

scene.environment = reflectionTarget.texture;

function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
}

window.addEventListener("resize", resize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
