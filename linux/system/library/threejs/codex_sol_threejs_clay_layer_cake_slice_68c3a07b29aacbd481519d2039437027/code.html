<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claymation Layer Cake Slice</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #eadfcf; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeadfcf);
scene.fog = new THREE.Fog(0xeadfcf, 12, 24);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.2, 5.3, 8.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.target.set(0, 1.55, 0);
controls.minDistance = 6;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.48;

const hemi = new THREE.HemisphereLight(0xfff5e5, 0x735e58, 2.0);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffdfc4, 4.3);
key.position.set(-4.5, 8, 5.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -7;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 22;
key.shadow.bias = -0.0005;
scene.add(key);

const fill = new THREE.DirectionalLight(0xc5d6ff, 1.3);
fill.position.set(6, 4, -4);
scene.add(fill);

const rim = new THREE.PointLight(0xffa776, 28, 13, 2);
rim.position.set(-4, 4, -5);
scene.add(rim);

const clay = (color, roughness = 0.92) => new THREE.MeshStandardMaterial({
  color,
  roughness,
  metalness: 0,
  flatShading: false
});

const spongeMats = [
  clay(0xe9a75d),
  clay(0xf0b669),
  clay(0xe7a057)
];
const creamMat = clay(0xef7f9d);
const creamLightMat = clay(0xf69bb1);
const chocolateMat = clay(0x542a25);
const chocolateLightMat = clay(0x69342c);
const cherryMat = clay(0xa92535, 0.86);
const cherryDarkMat = clay(0x681823, 0.95);
const stemMat = clay(0x385534);
const crumbMat = clay(0xc8753f);

function wedgeShape(scale = 1) {
  const s = new THREE.Shape();
  s.moveTo(-1.73 * scale, -1.55 * scale);
  s.lineTo(1.73 * scale, -1.55 * scale);
  s.quadraticCurveTo(2.02 * scale, -1.54 * scale, 1.87 * scale, -1.26 * scale);
  s.lineTo(0.23 * scale, 2.04 * scale);
  s.quadraticCurveTo(0, 2.32 * scale, -0.23 * scale, 2.04 * scale);
  s.lineTo(-1.87 * scale, -1.26 * scale);
  s.quadraticCurveTo(-2.02 * scale, -1.54 * scale, -1.73 * scale, -1.55 * scale);
  s.closePath();
  return s;
}

function roughen(geometry, amount, seed = 0) {
  const g = geometry.toNonIndexed();
  g.computeVertexNormals();
  const p = g.attributes.position;
  const n = g.attributes.normal;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const wave =
      Math.sin(x * 8.31 + y * 4.77 + seed) *
      Math.sin(z * 11.23 - x * 3.17 + seed * 1.7) * amount +
      Math.sin((x + y + z) * 17.1 + seed * 2.3) * amount * 0.32;
    p.setXYZ(
      i,
      x + n.getX(i) * wave,
      y + n.getY(i) * wave,
      z + n.getZ(i) * wave
    );
  }
  p.needsUpdate = true;
  g.computeVertexNormals();
  return g;
}

function wedgeLayer(height, material, scale, seed, bevel = 0.075) {
  let geo = new THREE.ExtrudeGeometry(wedgeShape(scale), {
    depth: height,
    steps: 2,
    bevelEnabled: true,
    bevelSegments: 3,
    bevelSize: bevel,
    bevelThickness: bevel,
    curveSegments: 3
  });
  geo = roughen(geo, 0.018, seed);
  geo.rotateX(Math.PI / 2);
  const mesh = new THREE.Mesh(geo, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const cake = new THREE.Group();
cake.rotation.y = -0.12;
scene.add(cake);

let y = 0.08;
const layerData = [
  { h: 0.67, mat: spongeMats[0], scale: 1.00, seed: 1.1 },
  { h: 0.21, mat: creamMat, scale: 1.025, seed: 2.4 },
  { h: 0.68, mat: spongeMats[1], scale: 0.995, seed: 3.7 },
  { h: 0.22, mat: creamLightMat, scale: 1.03, seed: 4.9 },
  { h: 0.68, mat: spongeMats[2], scale: 1.00, seed: 6.2 },
  { h: 0.20, mat: chocolateMat, scale: 1.025, seed: 7.4 }
];

for (const d of layerData) {
  const mesh = wedgeLayer(d.h, d.mat, d.scale, d.seed, d.h < 0.3 ? 0.065 : 0.085);
  mesh.position.y = y + d.h;
  mesh.rotation.y = Math.sin(d.seed * 2.1) * 0.008;
  cake.add(mesh);
  y += d.h;
}
const topY = y + 0.04;

function ellipsoid(x, yy, z, sx, sy, sz, material, detail = 20) {
  let geo = new THREE.SphereGeometry(1, detail, Math.max(12, Math.floor(detail * 0.7)));
  geo = roughen(geo, 0.016, x * 3 + yy * 5 + z * 7);
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, yy, z);
  m.scale.set(sx, sy, sz);
  m.castShadow = true;
  m.receiveShadow = true;
  cake.add(m);
  return m;
}

// Squished cream bulges along the exposed front.
[
  [-1.47, 0.82, -1.58, 0.34, 0.12, 0.11],
  [-0.73, 0.81, -1.60, 0.43, 0.13, 0.12],
  [0.14, 0.83, -1.60, 0.38, 0.12, 0.11],
  [0.92, 0.81, -1.59, 0.39, 0.13, 0.12],
  [1.52, 0.84, -1.55, 0.28, 0.11, 0.10],
  [-1.36, 1.72, -1.57, 0.36, 0.12, 0.11],
  [-0.51, 1.70, -1.60, 0.45, 0.13, 0.12],
  [0.39, 1.73, -1.60, 0.43, 0.12, 0.11],
  [1.24, 1.70, -1.57, 0.40, 0.13, 0.11]
].forEach((v, i) => ellipsoid(...v, i < 5 ? creamMat : creamLightMat, 16));

// Side filling squeezes.
[
  [-1.72, 0.82, -1.04, 0.12, 0.12, 0.33],
  [-1.32, 0.81, -0.23, 0.11, 0.13, 0.38],
  [-0.88, 0.83, 0.67, 0.10, 0.12, 0.35],
  [1.73, 1.72, -1.02, 0.12, 0.12, 0.31],
  [1.28, 1.70, -0.13, 0.11, 0.13, 0.37],
  [0.83, 1.72, 0.77, 0.10, 0.12, 0.32]
].forEach((v, i) => ellipsoid(...v, i < 3 ? creamMat : creamLightMat, 15));

// Chocolate drips over the broad cut face.
function drip(x, length, width, z = -1.61) {
  const capsule = new THREE.Mesh(
    roughen(new THREE.CapsuleGeometry(width, length, 6, 12), 0.012, x * 7),
    chocolateMat
  );
  capsule.position.set(x, topY - length * 0.48, z);
  capsule.castShadow = true;
  cake.add(capsule);
  ellipsoid(x, topY - 0.02, z, width * 1.45, 0.15, width * 1.2, chocolateLightMat, 15);
}
drip(-1.45, 0.34, 0.12);
drip(-0.83, 0.53, 0.15);
drip(-0.13, 0.25, 0.11);
drip(0.55, 0.43, 0.14);
drip(1.35, 0.29, 0.12);

// Smaller drips on sloping sides.
[
  [-1.46, topY - 0.19, -0.38, 0.12, 0.30, 0.11, -0.42],
  [-0.84, topY - 0.14, 0.84, 0.10, 0.23, 0.10, -0.42],
  [1.42, topY - 0.16, -0.39, 0.11, 0.27, 0.10, 0.42],
  [0.85, topY - 0.13, 0.76, 0.09, 0.21, 0.09, 0.42]
].forEach(v => {
  const m = ellipsoid(v[0], v[1], v[2], v[3], v[4], v[5], chocolateMat, 15);
  m.rotation.z = v[6];
});

// Sponge pores and thumb-smoothed dimples.
const poreGeo = new THREE.SphereGeometry(1, 10, 7);
const poreMat = clay(0xb96d3e);
const pores = [
  [-1.40, 0.35, -1.61, .055, .035], [-.96, .55, -1.62, .045, .03],
  [-.38, .29, -1.62, .06, .038], [.23, .56, -1.62, .045, .03],
  [.74, .35, -1.62, .06, .038], [1.34, .55, -1.59, .047, .03],
  [-1.18, 1.18, -1.62, .055, .034], [-.63, 1.42, -1.62, .045, .03],
  [.05, 1.16, -1.62, .065, .038], [.67, 1.43, -1.62, .048, .03],
  [1.29, 1.22, -1.59, .055, .034], [-1.30, 2.06, -1.61, .05, .03],
  [-.69, 2.28, -1.62, .06, .036], [.04, 2.04, -1.62, .045, .03],
  [.72, 2.28, -1.62, .055, .034], [1.35, 2.08, -1.59, .047, .03]
];
for (const [x, py, z, sx, sy] of pores) {
  const p = new THREE.Mesh(poreGeo, poreMat);
  p.position.set(x, py, z);
  p.scale.set(sx, sy, 0.018);
  p.castShadow = true;
  cake.add(p);
}

// Small crumbs at the base.
[
  [-1.25, .07, -1.78, .07], [-.72, .045, -1.82, .05],
  [.98, .05, -1.76, .065], [1.43, .055, -1.68, .045],
  [-1.86, .05, -1.12, .055]
].forEach((c, i) => {
  const crumb = new THREE.Mesh(
    roughen(new THREE.IcosahedronGeometry(1, 1), .08, i),
    crumbMat
  );
  crumb.position.set(c[0], c[1], c[2]);
  crumb.scale.setScalar(c[3]);
  crumb.rotation.set(i, i * 1.7, i * .7);
  crumb.castShadow = true;
  cake.add(crumb);
});

// Fingerprinted cherry.
const cherryCenter = new THREE.Vector3(0.34, topY + 0.55, -0.05);
let cherryGeo = new THREE.SphereGeometry(0.48, 32, 22);
cherryGeo = roughen(cherryGeo, 0.026, 12.4);
const cherry = new THREE.Mesh(cherryGeo, cherryMat);
cherry.position.copy(cherryCenter);
cherry.scale.set(1.02, 0.96, 1);
cherry.castShadow = true;
cherry.receiveShadow = true;
cake.add(cherry);

ellipsoid(
  cherryCenter.x - 0.13,
  cherryCenter.y + 0.26,
  cherryCenter.z + 0.38,
  0.09, 0.045, 0.018,
  clay(0xd95760, 0.88), 14
);

function fingerprintArc(radius, verticalScale, start, end, yOffset) {
  const pts = [];
  const R = 0.485;
  for (let i = 0; i <= 30; i++) {
    const t = start + (end - start) * i / 30;
    const dx = Math.cos(t) * radius;
    const dy = Math.sin(t) * radius * verticalScale + yOffset;
    const dz = Math.sqrt(Math.max(0.02, R * R - dx * dx - dy * dy));
    pts.push(new THREE.Vector3(
      cherryCenter.x + dx,
      cherryCenter.y + dy,
      cherryCenter.z + dz + 0.006
    ));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  const groove = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 36, 0.009, 5, false),
    cherryDarkMat
  );
  cake.add(groove);
}
fingerprintArc(0.19, 0.48, 0.35, Math.PI * 1.65, -0.02);
fingerprintArc(0.27, 0.50, 0.45, Math.PI * 1.58, -0.025);
fingerprintArc(0.35, 0.48, 0.55, Math.PI * 1.52, -0.035);

// Bent clay stem.
const stemCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(cherryCenter.x, cherryCenter.y + 0.40, cherryCenter.z),
  new THREE.Vector3(cherryCenter.x + 0.02, cherryCenter.y + 0.66, cherryCenter.z - 0.03),
  new THREE.Vector3(cherryCenter.x + 0.16, cherryCenter.y + 0.85, cherryCenter.z - 0.08),
  new THREE.Vector3(cherryCenter.x + 0.31, cherryCenter.y + 0.90, cherryCenter.z - 0.04)
]);
const stem = new THREE.Mesh(
  new THREE.TubeGeometry(stemCurve, 28, 0.035, 8, false),
  stemMat
);
stem.castShadow = true;
cake.add(stem);

const stemTip = ellipsoid(
  cherryCenter.x + 0.31,
  cherryCenter.y + 0.90,
  cherryCenter.z - 0.04,
  0.045, 0.055, 0.045,
  stemMat, 12
);
stemTip.rotation.z = -0.5;

// Matte clay tabletop.
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(10, 96),
  new THREE.MeshStandardMaterial({
    color: 0xd8c8b3,
    roughness: 1,
    metalness: 0
  })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.055;
ground.receiveShadow = true;
scene.add(ground);

const backdrop = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 18),
  new THREE.MeshBasicMaterial({ color: 0xeadfcf })
);
backdrop.position.set(0, 6, -10);
scene.add(backdrop);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
