<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clay Walrus</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9c7b5}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9c7b5);
scene.fog = new THREE.Fog(0xd9c7b5, 8, 18);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.4, 3.1, 7.8);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.15;
controls.target.set(0,1.25,0);

const hemi = new THREE.HemisphereLight(0xffead8,0x70594d,2.25);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffd7b0,4.0);
key.position.set(-4,7,5);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-5;
key.shadow.camera.right=5;
key.shadow.camera.top=5;
key.shadow.camera.bottom=-3;
scene.add(key);

const fill = new THREE.PointLight(0xb8cfff,1.25,12);
fill.position.set(4,3,4);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xff9c83,1.5);
rim.position.set(4,4,-5);
scene.add(rim);

const clay = new THREE.MeshStandardMaterial({color:0x796052,roughness:0.91,metalness:0});
const clayLight = new THREE.MeshStandardMaterial({color:0x927260,roughness:0.94});
const clayDark = new THREE.MeshStandardMaterial({color:0x59443d,roughness:0.98});
const blush = new THREE.MeshStandardMaterial({color:0xb97872,roughness:0.9});
const muzzleMat = new THREE.MeshStandardMaterial({color:0x685048,roughness:1});
const tuskMat = new THREE.MeshStandardMaterial({color:0xe8dfc6,roughness:0.82});
const noseMat = new THREE.MeshStandardMaterial({color:0x332b2a,roughness:0.96});
const eyeMat = new THREE.MeshStandardMaterial({color:0x171719,roughness:0.7});
const nailMat = new THREE.MeshStandardMaterial({color:0xc7a28d,roughness:0.94});
const holeMat = new THREE.MeshStandardMaterial({color:0x302522,roughness:1});

const walrus = new THREE.Group();
walrus.position.y = 0.07;
scene.add(walrus);

function blob(name, pos, scale, material, detail=2) {
  const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(1,detail), material);
  mesh.name=name;
  mesh.position.set(pos[0],pos[1],pos[2]);
  mesh.scale.set(scale[0],scale[1],scale[2]);
  mesh.rotation.set((Math.random()-.5)*.16,(Math.random()-.5)*.2,(Math.random()-.5)*.16);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  walrus.add(mesh);
  return mesh;
}
function sphere(name,pos,scale,material) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1,24,16),material);
  mesh.name=name;
  mesh.position.set(pos[0],pos[1],pos[2]);
  mesh.scale.set(scale[0],scale[1],scale[2]);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  walrus.add(mesh);
  return mesh;
}
function cylinderBetween(name,a,b,r,material,radial=12) {
  const start=new THREE.Vector3(a[0],a[1],a[2]);
  const end=new THREE.Vector3(b[0],b[1],b[2]);
  const direction=new THREE.Vector3().subVectors(end,start);
  const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r*.86,direction.length(),radial),material);
  mesh.name=name;
  mesh.position.copy(start).add(end).multiplyScalar(.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),direction.normalize());
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  walrus.add(mesh);
  return mesh;
}
function curveTube(name,points,radius,material) {
  const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(p[0],p[1],p[2])));
  const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,16,radius,6,false),material);
  mesh.name=name;
  mesh.castShadow=true;
  walrus.add(mesh);
  return mesh;
}

blob("plump body",[0,1.25,0],[2.02,1.48,1.38],clay,2);
blob("rounded belly",[0,1.04,1.03],[1.45,1.16,.72],clayLight,2);
blob("shoulder mass",[0,2.16,-.03],[1.48,1.03,1.13],clay,2);
blob("head",[0,2.75,.12],[1.38,1.04,1.08],clayLight,2);

sphere("left cheek",[-.72,2.51,.88],[.57,.45,.24],blush);
sphere("right cheek",[.72,2.51,.88],[.57,.45,.24],blush);

sphere("left eye",[-.57,2.94,.99],[.115,.14,.075],eyeMat);
sphere("right eye",[.57,2.94,.99],[.115,.14,.075],eyeMat);
sphere("left eye glint",[-.603,2.984,1.052],[.027,.035,.014],tuskMat);
sphere("right eye glint",[.537,2.984,1.052],[.027,.035,.014],tuskMat);

sphere("left muzzle",[-.43,2.26,1.0],[.72,.57,.46],muzzleMat);
sphere("right muzzle",[.43,2.26,1.0],[.72,.57,.46],muzzleMat);
sphere("nose",[0,2.45,1.42],[.34,.27,.18],noseMat);

const mouthCurve=curveTube("solemn mouth",[
  [-.02,2.27,1.46],[0,2.17,1.49],[.02,2.27,1.46]
],.035,noseMat);
mouthCurve.rotation.z=Math.PI;

const tuskLeft=new THREE.Mesh(new THREE.ConeGeometry(.21,1.22,20),tuskMat);
tuskLeft.name="left ivory tusk";
tuskLeft.position.set(-.55,1.88,1.13);
tuskLeft.rotation.set(.16,0,-.17);
tuskLeft.castShadow=true;
walrus.add(tuskLeft);

const tuskRight=new THREE.Mesh(new THREE.ConeGeometry(.21,1.22,20),tuskMat);
tuskRight.name="right ivory tusk";
tuskRight.position.set(.55,1.88,1.13);
tuskRight.rotation.set(.16,0,.17);
tuskRight.castShadow=true;
walrus.add(tuskRight);

const flipperLeft=blob("left grounded flipper",[-1.45,.63,.18],[.92,.3,.52],clayDark,2);
flipperLeft.rotation.z=-.25;
flipperLeft.rotation.y=.18;
const flipperRight=blob("right grounded flipper",[1.45,.63,.18],[.92,.3,.52],clayDark,2);
flipperRight.rotation.z=.25;
flipperRight.rotation.y=-.18;

for(let i=0;i<5;i++){
  const x=-1.72+i*.18;
  curveTube("left flipper seam",[
    [x,.59,.56],[x+.04,.54,.65],[x+.07,.58,.69]
  ],.026,nailMat);
  const xr=1.72-i*.18;
  curveTube("right flipper seam",[
    [xr,.59,.56],[xr-.04,.54,.65],[xr-.07,.58,.69]
  ],.026,nailMat);
}

const browLeft=curveTube("left brow",[[-.92,3.2,.9],[-.62,3.3,1.02],[-.32,3.2,1.02]],.045,clayDark);
const browRight=curveTube("right brow",[[.32,3.2,1.02],[.62,3.3,1.02],[.92,3.2,.9]],.045,clayDark);

for(let i=0;i<12;i++){
  const angle=(i/12)*Math.PI*2;
  const px=Math.cos(angle)*(.42+.06*(i%2));
  const py=2.18+Math.sin(angle)*(.2+.03*(i%3));
  const pz=1.405+Math.cos(angle*.7)*.015;
  sphere("muzzle tool hole",[px,py,pz],[.045,.055,.018],holeMat);
}

for(let i=0;i<16;i++){
  const angle=(i/16)*Math.PI*2;
  const x=Math.cos(angle)*(.45+.12*(i%3)/2);
  const y=2.18+Math.sin(angle)*(.27+.05*(i%2));
  const z=1.4;
  const tip=[x*1.3,y-.02,1.57+((i%3)-1)*.07];
  cylinderBetween("short muzzle bristle",[x,y,z],tip,.018,nailMat,7);
}

const thumbprintPositions=[
  [-.9,1.25,1.66,.14,.09,.025],[.68,1.05,1.69,.13,.08,.025],
  [-1.18,1.55,1.48,.11,.07,.025],[1.08,1.43,1.5,.1,.07,.025],
  [-.42,.72,1.62,.09,.055,.02],[.37,.78,1.64,.11,.06,.02]
];
for(const p of thumbprintPositions){
  const mark=sphere("soft thumbprint",[p[0],p[1],p[2]],[p[3],p[4],p[5]],clayDark);
  mark.rotation.z=.2;
}

curveTube("belly crease left",[[-1.25,1.65,1.38],[-1.1,1.42,1.65],[-.82,1.23,1.74]],.032,clayDark);
curveTube("belly crease right",[[1.25,1.65,1.38],[1.1,1.42,1.65],[.82,1.23,1.74]],.032,clayDark);

const groundMat=new THREE.MeshStandardMaterial({color:0xb99d89,roughness:1});
const ground=new THREE.Mesh(new THREE.CircleGeometry(7,64),groundMat);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.02;
ground.receiveShadow=true;
scene.add(ground);

const shadow=new THREE.Mesh(
  new THREE.CircleGeometry(2.9,48),
  new THREE.MeshBasicMaterial({color:0x6e5149,transparent:true,opacity:.18,depthWrite:false})
);
shadow.scale.set(1,.42,1);
shadow.rotation.x=-Math.PI/2;
shadow.position.set(0,.005,.2);
scene.add(shadow);

const backdrop=new THREE.Mesh(
  new THREE.PlaneGeometry(30,16),
  new THREE.MeshStandardMaterial({color:0xd9c7b5,roughness:1})
);
backdrop.position.set(0,5,-5);
backdrop.receiveShadow=true;
scene.add(backdrop);

window.addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  walrus.position.y=.07+Math.sin(t*1.6)*.012;
  walrus.rotation.z=Math.sin(t*.8)*.008;
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
