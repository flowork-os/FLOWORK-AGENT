<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harbor Docks at Evening</title>
<style>
html,body{margin:0;overflow:hidden;background:#101722}
canvas{display:block}
#label{position:fixed;left:24px;bottom:20px;color:#d9d0bd;font:12px/1.4 Georgia,serif;letter-spacing:.18em;text-transform:uppercase;opacity:.72;pointer-events:none}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="label">Harbor Docks · Evening</div>
<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x79808a,.0105);
const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,600);
camera.position.set(30,19,34);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.045;
controls.autoRotate=true;
controls.autoRotateSpeed=.28;
controls.target.set(0,5,0);
controls.minDistance=18;
controls.maxDistance=75;
controls.maxPolarAngle=Math.PI*.47;

let seed=71931;
function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function range(a,b){return a+(b-a)*rnd()}
function pick(a){return a[Math.floor(rnd()*a.length)]}
function mat(color,rough=.75,metal=0,emissive=0x000000,ei=0){
  return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal,emissive,emissiveIntensity:ei});
}
const wood=mat(0x46382d,.92);
const darkWood=mat(0x29251f,.95);
const wetWood=mat(0x302a25,.72);
const rust=mat(0x6d3d2a,.82,0);
const rustyMetal=mat(0x624638,.72,.45);
const steel=mat(0x59616a,.58,.75);
const ropeMat=mat(0x987656,1);
const crateMats=[mat(0x765034,.9),mat(0x885b39,.88),mat(0x5d4836,.92),mat(0x9b7048,.9)];
const blue=mat(0x244b59,.82);
const canvasMat=mat(0xb4a48b,.96);
const white=mat(0xd7d2c5,.75);
const black=mat(0x171b1c,.83);
const orange=mat(0xc46a34,.77);
const yellow=mat(0xd39c32,.7,0,0x4b2505,.15);

function box(w,h,d,ma,pos=[0,0,0],rot=[0,0,0]){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),ma);
  m.position.set(...pos);m.rotation.set(...rot);m.castShadow=true;m.receiveShadow=true;return m;
}
function cyl(r,h,ma,pos=[0,0,0],rot=[0,0,0],seg=12){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),ma);
  m.position.set(...pos);m.rotation.set(...rot);m.castShadow=true;m.receiveShadow=true;return m;
}
function sphere(r,ma,pos=[0,0,0],scale=[1,1,1]){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,10),ma);
  m.position.set(...pos);m.scale.set(...scale);m.castShadow=true;m.receiveShadow=true;return m;
}
function line(a,b,ma=ropeMat,width=.035){
  const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...a),new THREE.Vector3(...b)]);
  const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:ma.color,linewidth:width}));
  return l;
}
function groupAdd(g,...items){items.forEach(x=>g.add(x));return g}

function canvasTexture(draw,w=512,h=256){
  const c=document.createElement("canvas");c.width=w;c.height=h;
  const x=c.getContext("2d");draw(x,w,h);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const skyTex=canvasTexture((x,w,h)=>{
  const g=x.createLinearGradient(0,0,0,h);
  g.addColorStop(0,"#202b47");g.addColorStop(.38,"#53647a");g.addColorStop(.67,"#d28c63");g.addColorStop(.82,"#edaa68");g.addColorStop(1,"#53636d");
  x.fillStyle=g;x.fillRect(0,0,w,h);
  for(let i=0;i<70;i++){x.fillStyle=`rgba(255,220,170,${range(.03,.13)})`;x.fillRect(range(0,w),range(45,170),range(20,130),range(1,4))}
},1024,512);
const sky=new THREE.Mesh(new THREE.SphereGeometry(180,32,16),new THREE.MeshBasicMaterial({map:skyTex,side:THREE.BackSide}));
scene.add(sky);

const hemi=new THREE.HemisphereLight(0x9baec2,0x25221f,1.65);
scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffb77b,4.2);
sun.position.set(-42,48,-32);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-55;sun.shadow.camera.right=55;sun.shadow.camera.top=55;sun.shadow.camera.bottom=-35;
sun.shadow.camera.near=1;sun.shadow.camera.far=150;
scene.add(sun);
const moonFill=new THREE.DirectionalLight(0x7892b3,.5);
moonFill.position.set(35,23,24);scene.add(moonFill);
const sunset=new THREE.PointLight(0xff8e4e,30,48,2);
sunset.position.set(-30,9,-20);scene.add(sunset);

const ground=box(110,1.2,90,mat(0x292b2a,1),[0,-.8,0]);
scene.add(ground);
const waterMat=mat(0x234854,.3,.35);
const water=new THREE.Mesh(new THREE.PlaneGeometry(105,76,1,1),waterMat);
water.rotation.x=-Math.PI/2;water.position.set(0,.08,-22);water.receiveShadow=true;scene.add(water);
const reflectionMat=new THREE.MeshBasicMaterial({color:0xe39a59,transparent:true,opacity:.24});
const shimmer=[];
for(let i=0;i<95;i++){
  const z=range(-41,-4), x=range(-31,31), len=range(.4,4.5);
  const r=box(len,.018,range(.025,.12),reflectionMat,[x,.16,z]);
  r.rotation.y=range(-.12,.12);r.userData.phase=range(0,6.28);r.userData.base=x;
  scene.add(r);shimmer.push(r);
}
for(let i=0;i<18;i++){
  const r=box(range(3,10),.035,.12,mat(0x66828a,.4),[range(-38,38),.18,range(-39,-5)]);
  r.rotation.y=range(-.15,.15);scene.add(r);
}

function dockSection(x,z,w,d){
  const g=new THREE.Group();
  g.add(box(w,.65,d,wetWood,[x,.45,z]));
  for(let px=x-w/2+1;px<=x+w/2-1;px+=2.5){
    g.add(cyl(.22,3,darkWood,[px,-.5,z-d/2+.4]));
    g.add(cyl(.22,3,darkWood,[px,-.5,z+d/2-.4]));
  }
  for(let i=0;i<Math.floor(w/2);i++)g.add(box(.11,.68,d+.12,wood,[x-w/2+1.2+i*2.1,.52,z]));
  scene.add(g);return g;
}
dockSection(-9,1,43,6);
dockSection(19,-3,18,5);
dockSection(-22,-8,9,14);

function piling(x,z,h=5){
  const p=cyl(.48,h,wetWood,[x,h/2-1,z],undefined,14);
  scene.add(p);
  scene.add(cyl(.58,.18,steel,[x,h-1.05,z],undefined,14));
  return p;
}
[[-29,-1],[-22,-1],[-8,-1],[7,-1],[27,-5],[12,-5],[-26,-15],[-19,-15],[-22,-3]].forEach(p=>piling(p[0],p[1],range(4.3,6.5)));

function ropeCoil(x,z,scale=1){
  const g=new THREE.Group();
  for(let i=0;i<4;i++){
    const tor=new THREE.Mesh(new THREE.TorusGeometry((.34+i*.13)*scale,.055*scale,7,24),ropeMat);
    tor.rotation.x=Math.PI/2;tor.position.y=.86+i*.018;g.add(tor);
  }
  g.position.set(x,0,z);scene.add(g);return g;
}
function bollard(x,z){
  const g=new THREE.Group();
  g.add(cyl(.22,.8,steel,[x,.98,z],undefined,12));
  g.add(cyl(.4,.14,steel,[x,1.33,z],undefined,12));
  g.add(cyl(.31,.12,steel,[x,.66,z],undefined,12));
  scene.add(g);return g;
}
bollard(-23,-.7);bollard(8,-.7);bollard(25,-4.5);ropeCoil(-20,1.2,1.1);ropeCoil(5,1.1,.8);ropeCoil(-24,-11,1);

function crate(x,y,z,s=1,ma=pick(crateMats),rot=0){
  const g=new THREE.Group();
  g.add(box(1.45*s,1.18*s,1.25*s,ma,[0,.59*s,0],[0,rot,0]));
  const band=mat(0x352b23,.85);
  g.add(box(.09*s,1.2*s,1.28*s,band,[.38*s,.6*s,0],[0,rot,0]));
  g.add(box(.09*s,1.2*s,1.28*s,band,[-.38*s,.6*s,0],[0,rot,0]));
  g.add(box(1.48*s,.08*s,.12*s,band,[0,.35*s,.64*s],[0,rot,0]));
  g.position.set(x,y,z);scene.add(g);return g;
}
[[14,1.05,0,1,0],[15.5,1.05,.1,1,1],[17,1.05,0,1,2],[14.7,2.3,.1,.85,3],[16.2,2.25,.05,.85,1],[-18,1.05,2,1,2],[-16.4,1.05,2,1,0],[-17.2,2.25,2,.85,3]].forEach(a=>crate(...a));

function trap(x,z,rot=0){
  const g=new THREE.Group(), mm=mat(0x3b3026,.9);
  const pts=[[-.65,0,-.45],[.65,0,-.45],[-.65,0,.45],[.65,0,.45],[-.45,1,-.3],[.45,1,-.3],[-.45,1,.3],[.45,1,.3]];
  [[0,1],[1,3],[3,2],[2,0],[4,5],[5,7],[7,6],[6,4],[0,4],[1,5],[2,6],[3,7]].forEach(e=>g.add(line(pts[e[0]],pts[e[1]],mm,.05)));
  g.position.set(x,.9,z);g.rotation.y=rot;scene.add(g);
}
for(let i=0;i<6;i++)trap(-12+i*1.35,3.5+(i%2)*.4,range(-.2,.2));

function trawler(){
  const g=new THREE.Group();
  const hull=box(11,2.2,3.2,mat(0x374148,.68,.25),[0,2.35,0],[0,0,0]);
  hull.scale.set(1,.9,1);g.add(hull);
  const bow=box(3,1.5,3.05,mat(0x43515a,.7,.2),[5.4,2.52,0],[0,0,-.04]);g.add(bow);
  g.add(box(10.8,.25,3.35,black,[0,1.3,0]));
  g.add(box(8,.22,3.42,orange,[.2,3.45,0]));
  g.add(box(3.8,2.1,2.45,blue,[-2.1,4.55,0]));
  g.add(box(3.3,.13,2.55,white,[-2.1,5.66,0]));
  for(let i=0;i<3;i++)g.add(box(.1,.65,2.4,black,[-3.1+i*.8,5.3,0]));
  const windowM=mat(0x172f37,.25,.5);
  for(let i=0;i<4;i++)g.add(box(.42,.48,.04,windowM,[-3.25+i*.72,5.05,1.24]));
  for(let i=0;i<4;i++)g.add(box(.42,.48,.04,windowM,[-3.25+i*.72,5.05,-1.24]));
  g.add(cyl(.13,10,steel,[0,8.3,0]));
  g.add(cyl(.1,7,steel,[3.7,6.8,0]));
  g.add(box(2.8,.12,1.1,canvasMat,[-.1,8.8,0],[0,0,.03]));
  g.add(box(2.2,.1,.9,canvasMat,[3.7,8.1,0],[0,0,-.1]));
  g.add(line([0,13.3,0],[5.8,3.45,0],ropeMat,.025));
  g.add(line([0,13.3,0],[-5.4,3.5,0],ropeMat,.025));
  g.add(line([3.7,10.3,0],[6.3,3.5,0],ropeMat,.025));
  g.add(line([0,12.2,0],[3.7,10.2,0],ropeMat,.025));
  for(let i=0;i<5;i++){
    const net=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,2.1,5,1,true),new THREE.MeshBasicMaterial({color:0x554a3c,wireframe:true}));
    net.rotation.z=Math.PI/2;net.position.set(-4+i*1.1,3.65,1.72);g.add(net);
  }
  g.add(cyl(.16,3.4,black,[4.7,5.2,0],[0,0,Math.PI/2],10));
  g.add(box(1.7,.12,.16,orange,[5.5,3.65,0]));
  const lamp= new THREE.PointLight(0xffc477,2.8,8);
  lamp.position.set(-2.1,5.5,1.3);g.add(lamp);
  g.position.set(-1,0,-.1);g.rotation.y=.04;g.userData.sway=0;
  scene.add(g);
  g.add(line([-5.2,2.1,1.5],[-10,.9,2.2],ropeMat,.045));
  g.add(line([5.6,2.2,-1.35],[7,.9,-.4],ropeMat,.045));
  return g;
}
const boat=trawler();

function warehouse(){
  const g=new THREE.Group();
  g.add(box(17,9,9,mat(0x4e5555,.84),[0,4.5,0]));
  const roof=box(18.4,.45,10,mat(0x252d30,.58,.35),[0,9.15,0]);
  g.add(roof);
  for(let i=-8;i<=8;i+=1.3){
    const rib=box(.08,.22,9.5,steel,[i,9.45,0]);
    g.add(rib);
  }
  g.add(box(5.5,5.3,.18,mat(0x252d2e,.55,.3),[0,2.8,4.58]));
  g.add(box(2.1,4,.25,rust,[0,2.4,4.75]));
  for(let i=0;i<5;i++)g.add(box(.12,4,.07,steel,[-1.7+i*.85,2.4,4.9]));
  g.add(box(10,4,.12,mat(0x667172,.75),[-9,2.8,4.55]));
  for(let i=0;i<7;i++)g.add(box(.12,4,.06,steel,[-13.2+i*1.2,2.8,4.7]));
  g.position.set(24,0,7);scene.add(g);
}
warehouse();

function crane(){
  const g=new THREE.Group(), yellowMetal=mat(0x98723a,.62,.55);
  g.add(box(.65,10,.65,yellowMetal,[0,5,0]));
  g.add(box(5.8,.48,.55,yellowMetal,[2.6,9.5,0],[0,0,-.15]));
  g.add(box(.5,.4,2.8,yellowMetal,[5.2,8.8,0],[0,0,-.15]));
  g.add(cyl(.35,.8,steel,[5.2,8.1,0],[Math.PI/2,0,0]));
  g.add(line([5.2,8.15,0],[5.2,3.3,0],black,.04));
  g.add(line([5.2,3.3,0],[4.65,2.7,0],black,.04));
  g.add(box(1.2,1.3,1.1,rust,[4.6,2.05,0]));
  g.position.set(11,0,4);scene.add(g);
}
crane();

function buoy(x,z,color){
  const g=new THREE.Group();
  g.add(sphere(.42,mat(color,.48),[0,1.1,0],[.8,1.3,.8]));
  g.add(cyl(.08,1.1,white,[0,2.0,0]));
  g.add(box(.35,.12,.35,yellow,[0,2.55,0]));
  g.position.set(x,0,z);scene.add(g);return g;
}
const buoys=[buoy(-13,-6,0xd65d2e),buoy(5,-12,0xe0a331),buoy(22,-15,0x397f7b)];

function gull(x,y,z,rot=0){
  const g=new THREE.Group();
  const wing=mat(0xd9d5c7,.78);
  g.add(new THREE.Mesh(new THREE.CapsuleGeometry(.08,.55,4,8),wing));
  const l=box(.72,.055,.12,wing,[.33,.04,0],[0,0,-.18]);
  const r=box(.72,.055,.12,wing,[-.33,.04,0],[0,0,.18]);
  g.add(l,r);g.position.set(x,y,z);g.rotation.y=rot;scene.add(g);
}
gull(-29,5,-1,.4);gull(27,6,-5,-.3);gull(-22,6,-14,.8);

function lampPost(x,z){
  const g=new THREE.Group();
  g.add(cyl(.13,4.5,steel,[x,3,z]));
  g.add(box(.6,.12,.12,steel,[x+.22,5.1,z]));
  g.add(sphere(.16,yellow,[x+.48,4.98,z]));
  const l=new THREE.PointLight(0xffbc68,3.2,9);l.position.set(x+.48,4.95,z);g.add(l);
  scene.add(g);
}
lampPost(-28,2);lampPost(20,0);lampPost(-18,-6);

function barrel(x,z){
  const g=new THREE.Group();
  g.add(cyl(.58,1.05,mat(0x5d4431,.87),[x,1.45,z],undefined,14));
  for(let y of [1.2,1.7])g.add(new THREE.Mesh(new THREE.TorusGeometry(.59,.045,6,18),new THREE.MeshStandardMaterial({color:0x302a25})));
  scene.add(g);
}
barrel(-26,2.8);barrel(-24,2.8);barrel(8,2.6);

function seagullFar(x,y,z,s){
  const g=new THREE.Group();
  const m=new THREE.LineBasicMaterial({color:0x27313a});
  const pts=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-s,0,0),new THREE.Vector3(0,.18*s,0),new THREE.Vector3(s,0,0)]);
  g.add(new THREE.Line(pts,m));g.position.set(x,y,z);g.rotation.y=range(0,6.28);scene.add(g);
}
for(let i=0;i<9;i++)seagullFar(range(-30,34),range(12,19),range(-15,5),range(.4,1.1));

const timeClock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=timeClock.getElapsedTime();
  boat.rotation.z=Math.sin(t*.52)*.012;
  boat.rotation.x=Math.sin(t*.37+1.2)*.009;
  boat.position.y=Math.sin(t*.75)*.025;
  buoys.forEach((b,i)=>{
    b.position.y=Math.sin(t*(.9+i*.13)+i)*.13;
    b.rotation.z=Math.sin(t*.8+i)*.08;
  });
  shimmer.forEach((r,i)=>{
    r.position.x=r.userData.base+Math.sin(t*.6+r.userData.phase)*.18;
    r.material.opacity=.12+.15*(.5+.5*Math.sin(t*1.7+r.userData.phase));
  });
  controls.update();
  renderer.render(scene,camera);
}
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
});
animate();
</script>
</body>
</html>
