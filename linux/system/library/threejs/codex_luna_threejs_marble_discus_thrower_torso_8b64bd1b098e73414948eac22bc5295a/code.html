<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marble Sundial Column</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #c8c2b8; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc8c2b8);
scene.fog = new THREE.Fog(0xc8c2b8, 12, 28);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(7.2, 6.4, 8.2);
camera.lookAt(0, 3.0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 5;
controls.maxDistance = 15;
controls.target.set(0, 3.0, 0);

const marble = new THREE.MeshStandardMaterial({
  color: 0xe8e5dc,
  roughness: 0.31,
  metalness: 0.02
});
const marbleDark = new THREE.MeshStandardMaterial({
  color: 0xc8c4b9,
  roughness: 0.4,
  metalness: 0.02
});
const veinMaterial = new THREE.MeshStandardMaterial({
  color: 0x77756f,
  roughness: 0.46,
  metalness: 0.03
});
const bronze = new THREE.MeshStandardMaterial({
  color: 0x765333,
  roughness: 0.3,
  metalness: 0.78
});
const bronzeDark = new THREE.MeshStandardMaterial({
  color: 0x34261c,
  roughness: 0.4,
  metalness: 0.7
});
const numeralMaterial = new THREE.MeshStandardMaterial({
  color: 0x37342f,
  roughness: 0.48,
  metalness: 0.2
});

const objectGroup = new THREE.Group();
scene.add(objectGroup);

function addCylinder(radiusTop, radiusBottom, height, y, material, segments = 64) {
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments),
    material
  );
  mesh.position.y = y;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  objectGroup.add(mesh);
  return mesh;
}

addCylinder(1.02, 1.15, 0.28, 0.14, marbleDark);
addCylinder(0.82, 0.92, 0.20, 0.38, marble);
addCylinder(0.70, 0.76, 0.25, 0.60, marbleDark);
addCylinder(0.60, 0.60, 0.16, 0.80, marble);

const shaft = addCylinder(0.48, 0.58, 2.75, 2.24, marble, 48);

for (let i = 0; i < 16; i++) {
  const angle = (i / 16) * Math.PI * 2;
  const flute = new THREE.Mesh(
    new THREE.CylinderGeometry(0.065, 0.075, 2.62, 12),
    marbleDark
  );
  flute.position.set(Math.cos(angle) * 0.505, 2.24, Math.sin(angle) * 0.505);
  flute.castShadow = true;
  flute.receiveShadow = true;
  objectGroup.add(flute);
}

function addVein(points, radius = 0.012) {
  const curve = new THREE.CatmullRomCurve3(points);
  const tube = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 28, radius, 6, false),
    veinMaterial
  );
  tube.castShadow = true;
  objectGroup.add(tube);
}

addVein([
  new THREE.Vector3(-0.47, 1.08, 0.16),
  new THREE.Vector3(-0.53, 1.65, -0.08),
  new THREE.Vector3(-0.49, 2.25, 0.19),
  new THREE.Vector3(-0.52, 2.85, -0.10),
  new THREE.Vector3(-0.40, 3.36, 0.06)
], 0.010);

addVein([
  new THREE.Vector3(0.42, 1.20, -0.20),
  new THREE.Vector3(0.50, 1.72, -0.28),
  new THREE.Vector3(0.48, 2.25, -0.12),
  new THREE.Vector3(0.51, 2.80, -0.28),
  new THREE.Vector3(0.38, 3.32, -0.19)
], 0.008);

addVein([
  new THREE.Vector3(-0.12, 1.04, 0.50),
  new THREE.Vector3(0.04, 1.62, 0.50),
  new THREE.Vector3(-0.08, 2.30, 0.49),
  new THREE.Vector3(0.12, 2.96, 0.48)
], 0.006);

addCylinder(0.68, 0.72, 0.16, 3.67, marbleDark);
addCylinder(0.76, 0.68, 0.18, 3.82, marble);
addCylinder(0.84, 0.84, 0.14, 3.97, marbleDark);

function makeLeaf() {
  const shape = new THREE.Shape();
  shape.moveTo(0, -0.34);
  shape.bezierCurveTo(-0.25, -0.12, -0.27, 0.20, 0, 0.43);
  shape.bezierCurveTo(0.27, 0.20, 0.25, -0.12, 0, -0.34);
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: 0.055,
    bevelEnabled: true,
    bevelSegments: 2,
    bevelSize: 0.018,
    bevelThickness: 0.018
  });
  geometry.center();
  return new THREE.Mesh(geometry, marbleDark);
}

for (let i = 0; i < 12; i++) {
  const angle = (i / 12) * Math.PI * 2;
  const leaf = makeLeaf();
  leaf.position.set(Math.cos(angle) * 0.78, 4.12, Math.sin(angle) * 0.78);
  leaf.rotation.set(0.18 * Math.cos(angle), Math.PI / 2 - angle, 0.15);
  leaf.scale.set(0.72, 1.0 + 0.10 * Math.sin(angle * 3), 1);
  leaf.castShadow = true;
  leaf.receiveShadow = true;
  objectGroup.add(leaf);

  const rib = new THREE.Mesh(
    new THREE.BoxGeometry(0.018, 0.32, 0.018),
    veinMaterial
  );
  rib.position.copy(leaf.position);
  rib.rotation.set(0.18 * Math.cos(angle), Math.PI / 2 - angle, 0.15);
  rib.castShadow = true;
  objectGroup.add(rib);
}

addCylinder(0.62, 0.72, 0.18, 4.34, marble);
addCylinder(0.58, 0.62, 0.18, 4.52, marbleDark);

const dialGroup = new THREE.Group();
dialGroup.position.set(0, 4.70, 0);
dialGroup.rotation.x = -0.38;
objectGroup.add(dialGroup);

const dial = new THREE.Mesh(
  new THREE.CylinderGeometry(1.62, 1.62, 0.18, 96),
  marble
);
dial.castShadow = true;
dial.receiveShadow = true;
dialGroup.add(dial);

const dialInset = new THREE.Mesh(
  new THREE.CylinderGeometry(1.43, 1.43, 0.035, 96),
  new THREE.MeshStandardMaterial({ color: 0xd9d5ca, roughness: 0.38 })
);
dialInset.position.y = 0.105;
dialInset.receiveShadow = true;
dialGroup.add(dialInset);

const rim = new THREE.Mesh(
  new THREE.TorusGeometry(1.52, 0.105, 12, 96),
  bronze
);
rim.rotation.x = Math.PI / 2;
rim.position.y = 0.16;
rim.castShadow = true;
dialGroup.add(rim);

const centerRing = new THREE.Mesh(
  new THREE.TorusGeometry(0.18, 0.025, 8, 40),
  bronze
);
centerRing.rotation.x = Math.PI / 2;
centerRing.position.y = 0.14;
dialGroup.add(centerRing);

function makeStroke(x1, z1, x2, z2, width = 0.035, depth = 0.025) {
  const dx = x2 - x1;
  const dz = z2 - z1;
  const length = Math.sqrt(dx * dx + dz * dz);
  const stroke = new THREE.Mesh(
    new THREE.BoxGeometry(length, depth, width),
    numeralMaterial
  );
  stroke.position.set((x1 + x2) / 2, 0.145, (z1 + z2) / 2);
  stroke.rotation.y = -Math.atan2(dz, dx);
  stroke.castShadow = true;
  dialGroup.add(stroke);
}

const glyphs = {
  I: [[0, -0.22, 0, 0.22]],
  V: [[-0.16, 0.22, 0, -0.22], [0, -0.22, 0.16, 0.22]],
  X: [[-0.16, -0.22, 0.16, 0.22], [-0.16, 0.22, 0.16, -0.22]]
};

function addNumeral(char, angle) {
  const radius = 1.13;
  const group = new THREE.Group();
  group.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
  group.rotation.y = angle + Math.PI / 2;
  const segments = glyphs[char];
  for (const segment of segments) {
    makeStroke(
      group.position.x + 0,
      group.position.z + 0,
      group.position.x + 0,
      group.position.z + 0
    );
  }
  dialGroup.remove(group);

  const numeral = new THREE.Group();
  numeral.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
  numeral.rotation.y = angle + Math.PI / 2;
  for (const segment of segments) {
    const x1 = segment[0] * 0.72;
    const z1 = segment[1] * 0.72;
    const x2 = segment[2] * 0.72;
    const z2 = segment[3] * 0.72;
    const dx = x2 - x1;
    const dz = z2 - z1;
    const length = Math.sqrt(dx * dx + dz * dz);
    const stroke = new THREE.Mesh(
      new THREE.BoxGeometry(length, 0.026, 0.042),
      numeralMaterial
    );
    stroke.position.set((x1 + x2) / 2, 0.145, (z1 + z2) / 2);
    stroke.rotation.y = -Math.atan2(dz, dx);
    stroke.castShadow = true;
    numeral.add(stroke);
  }
  dialGroup.add(numeral);
}

const numeralChars = ["XII", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI"];
const numeralAngles = [];
for (let i = 0; i < 12; i++) numeralAngles.push((i / 12) * Math.PI * 2);
for (let i = 0; i < 12; i++) {
  const text = numeralChars[i];
  const angle = numeralAngles[i];
  const spacing = 0.20;
  const start = -((text.length - 1) * spacing) / 2;
  for (let j = 0; j < text.length; j++) {
    const charAngle = angle;
    const radius = 1.13 + (start + j * spacing) * 0.02;
    const numeral = new THREE.Group();
    numeral.position.set(Math.cos(charAngle) * radius, 0, Math.sin(charAngle) * radius);
    numeral.rotation.y = charAngle + Math.PI / 2;
    const segments = glyphs[text[j]];
    for (const segment of segments) {
      const x1 = segment[0] * 0.54 + (start + j * spacing);
      const z1 = segment[1] * 0.54;
      const x2 = segment[2] * 0.54 + (start + j * spacing);
      const z2 = segment[3] * 0.54;
      const dx = x2 - x1;
      const dz = z2 - z1;
      const length = Math.sqrt(dx * dx + dz * dz);
      const stroke = new THREE.Mesh(
        new THREE.BoxGeometry(length, 0.024, 0.040),
        numeralMaterial
      );
      stroke.position.set((x1 + x2) / 2, 0.145, (z1 + z2) / 2);
      stroke.rotation.y = -Math.atan2(dz, dx);
      stroke.castShadow = true;
      numeral.add(stroke);
    }
    dialGroup.add(numeral);
  }
}

const gnomonGeometry = new THREE.BufferGeometry();
const gnomonPositions = new Float32Array([
  -0.055, 0.14, -0.68,  -0.055, 0.14, 0.68,  -0.055, 1.02, 0,
   0.055, 0.14, -0.68,   0.055, 0.14, 0.68,   0.055, 1.02, 0
]);
const gnomonIndices = [
  0, 1, 2, 5, 4, 3,
  0, 3, 4, 0, 4, 1,
  1, 4, 5, 1, 5, 2,
  2, 5, 3, 2, 3, 0
];
gnomonGeometry.setAttribute("position", new THREE.BufferAttribute(gnomonPositions, 3));
gnomonGeometry.setIndex(gnomonIndices);
gnomonGeometry.computeVertexNormals();

const gnomon = new THREE.Mesh(gnomonGeometry, bronze);
gnomon.castShadow = true;
gnomon.receiveShadow = true;
dialGroup.add(gnomon);

const gnomonFoot = new THREE.Mesh(
  new THREE.CylinderGeometry(0.17, 0.17, 0.08, 32),
  bronzeDark
);
gnomonFoot.position.y = 0.145;
gnomonFoot.castShadow = true;
dialGroup.add(gnomonFoot);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(13, 96),
  new THREE.MeshStandardMaterial({ color: 0xb6afa3, roughness: 0.8 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.02;
ground.receiveShadow = true;
scene.add(ground);

const hemi = new THREE.HemisphereLight(0xf5f1e8, 0x665b4e, 2.0);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xffe4bd, 4.2);
keyLight.position.set(-5, 10, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 10;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xd4e1ff, 0.8);
fillLight.position.set(5, 5, -6);
scene.add(fillLight);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
