const controls = new OrbitControls(camera, renderer.domElement);

let randomState = 184731;
function rand() {
  randomState = (randomState * 1664525 + 1013904223) >>> 0;
  return randomState / 4294967296;
}
function range(min, max) {
  return min + (max - min) * rand();
}
function choose(items) {
  return items[Math.floor(rand() * items.length)];
}
function textureFromCanvas(size, painter, repeatX = 1, repeatY = 1) {
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext("2d");
  painter(ctx, size);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(repeatX, repeatY);
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return texture;
}

const cobbleTexture = textureFromCanvas(512, (ctx, s) => {
  ctx.fillStyle = "#777069";
  ctx.fillRect(0, 0, s, s);
  for (let row = 0; row < 14; row++) {
    const y = row * 38;
    const offset = row % 2 ? 19 : 0;
    for (let col = -1; col < 15; col++) {
      const x = col * 40 + offset;
      const hue = 94 + Math.floor(rand() * 27);
      ctx.fillStyle = `hsl(25, ${hue - 65}%, ${hue - 47}%)`;
      ctx.beginPath();
      ctx.roundRect(x + 2, y + 3, 35, 30, 7);
      ctx.fill();
      ctx.strokeStyle = "rgba(47,43,42,.68)";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.10)";
      ctx.beginPath();
      ctx.roundRect(x + 5, y + 5, 28, 5, 4);
      ctx.fill();
    }
  }
}, 7, 10);

const roofTexture = textureFromCanvas(256, (ctx, s) => {
  ctx.fillStyle = "#423a3e";
  ctx.fillRect(0, 0, s, s);
  for (let y = 0; y < s; y += 28) {
    for (let x = (y / 28 % 2) * -19; x < s; x += 38) {
      ctx.fillStyle = choose(["#5e4c47", "#4b4143", "#67524c"]);
      ctx.fillRect(x + 1, y + 2, 35, 25);
      ctx.strokeStyle = "#2f2a31";
      ctx.strokeRect(x + 1, y + 2, 35, 25);
    }
  }
}, 2, 3);

const wallTexture = textureFromCanvas(256, (ctx, s) => {
  ctx.fillStyle = "#d3bd9d";
  ctx.fillRect(0, 0, s, s);
  for (let y = 0; y < s; y += 18) {
    for (let x = (y / 18 % 2) * -21; x < s; x += 42) {
      ctx.fillStyle = "rgba(110,70,48,.16)";
      ctx.fillRect(x, y, 40, 16);
      ctx.strokeStyle = "rgba(105,74,56,.18)";
      ctx.strokeRect(x, y, 40, 16);
    }
  }
}, 2, 2);

function mesh(geometry, material, position, parent = scene) {
  const object = new THREE.Mesh(geometry, material);
  object.position.copy(position);
  object.castShadow = true;
  object.receiveShadow = true;
  parent.add(object);
  return object;
}
function box(width, height, depth, material, x, y, z, parent = scene) {
  return mesh(new THREE.BoxGeometry(width, height, depth), material, new THREE.Vector3(x, y, z), parent);
}
function cylinder(radiusTop, radiusBottom, height, material, x, y, z, parent = scene, segments = 12) {
  return mesh(new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments), material, new THREE.Vector3(x, y, z), parent);
}
function sphere(radius, material, x, y, z, parent = scene) {
  return mesh(new THREE.SphereGeometry(radius, 14, 10), material, new THREE.Vector3(x, y, z), parent);
}

const skyTexture = textureFromCanvas(512, (ctx, s) => {
  const gradient = ctx.createLinearGradient(0, 0, 0, s);
  gradient.addColorStop(0, "#303957");
  gradient.addColorStop(0.43, "#ae7d77");
  gradient.addColorStop(0.66, "#d9a775");
  gradient.addColorStop(1, "#4c3f4a");
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 65; i++) {
    ctx.fillStyle = `rgba(255,210,160,${range(.03,.12)})`;
    ctx.beginPath();
    ctx.arc(rand() * s, rand() * s * .5, range(1, 3), 0, Math.PI * 2);
    ctx.fill();
  }
});

function createBuilding(side, z, width, height, facadeColor, accentColor) {
  const group = new THREE.Group();
  scene.add(group);
  const centerX = side * 10.1;
  const streetFace = side * 8.25;
  const depth = 3.7;
  const facade = new THREE.MeshStandardMaterial({
    color: facadeColor, map: wallTexture, roughness: 0.86
  });
  const accent = new THREE.MeshStandardMaterial({ color: accentColor, roughness: 0.62 });
  const plaster = box(depth, height, width, facade, centerX, height / 2, z, group);
  plaster.castShadow = true;
  const roof = box(depth + 0.25, 0.35, width + 0.35, darkMetal, centerX, height + 0.14, z, group);
  roof.material = new THREE.MeshStandardMaterial({ color: 0x463d42, map: roofTexture, roughness: 0.87 });
  const cornice = box(0.36, 0.3, width + 0.14, accent, streetFace, height - 0.4, z, group);

  const floorCount = height > 7 ? 3 : 2;
  const windowRows = [];
  for (let floor = 0; floor < floorCount; floor++) {
    windowRows.push(2.05 + floor * 2.0);
  }
  for (const y of windowRows) {
    for (const offset of [-width * 0.24, width * 0.24]) {
      const wx = streetFace - side * 0.055;
      const wz = z + offset;
      const frame = box(0.12, 1.24, 1.07, darkMetal, wx, y, wz, group);
      frame.castShadow = false;
      const pane = box(0.13, 1.04, 0.87, glassMaterial, streetFace - side * 0.12, y, wz, group);
      pane.castShadow = false;
      box(0.15, 0.06, 0.92, accent, streetFace - side * 0.19, y, wz, group).castShadow = false;
      box(0.15, 1.10, 0.045, accent, streetFace - side * 0.19, y, wz, group).castShadow = false;

      if (y > 2.8 && rand() > 0.35) {
        const balconyY = y - 0.73;
        const railX = streetFace - side * 0.52;
        box(0.74, 0.08, 1.42, blackMaterial, railX, balconyY, wz, group);
        for (let k = -2; k <= 2; k++) {
          cylinder(0.025, 0.025, 0.55, blackMaterial, railX, balconyY + 0.29, wz + k * 0.25, group, 8);
        }
        box(0.05, 0.06, 1.45, blackMaterial, railX, balconyY + 0.56, wz, group);
      }
    }
  }

  const doorZ = z - width * 0.22;
  box(0.18, 2.08, 1.12, darkMetal, streetFace - side * 0.10, 1.16, doorZ, group);
  box(0.13, 1.75, 0.84, woodMaterial, streetFace - side * 0.20, 1.10, doorZ, group);
  sphere(0.05, creamMaterial, streetFace - side * 0.28, 1.12, doorZ + 0.28, group).castShadow = false;

  const shopZ = z + width * 0.24;
  box(0.17, 1.78, 1.45, darkMetal, streetFace - side * 0.08, 1.25, shopZ, group);
  box(0.14, 1.50, 1.20, warmGlass, streetFace - side * 0.18, 1.25, shopZ, group).castShadow = false;
  const awning = box(0.92, 0.16, 1.72, accent, streetFace - side * 0.47, 2.23, shopZ, group);
  awning.rotation.z = side * 0.22;
  awnings.push(awning);
  for (let stripe = -0.65; stripe <= 0.65; stripe += 0.33) {
    const stripeBox = box(0.94, 0.18, 0.10, creamMaterial, streetFace - side * 0.49, 2.23, shopZ + stripe, group);
    stripeBox.rotation.z = side * 0.22;
    awnings.push(stripeBox);
  }

  const flowerBox = box(0.42, 0.25, 1.20, woodMaterial, streetFace - side * 0.36, 1.37, z + width * 0.24, group);
  for (let i = -4; i <= 4; i++) {
    sphere(0.11, leafMaterial, streetFace - side * 0.43, 1.55 + rand() * 0.1, z + width * 0.24 + i * 0.11, group);
    if (i % 2 === 0) sphere(0.06, flowerMaterial, streetFace - side * 0.53, 1.65, z + width * 0.24 + i * 0.11, group);
  }
  return group;
}

function addWire(points, radius = 0.025) {
  const curve = new THREE.CatmullRomCurve3(points, false, "catmullrom", 0.35);
  const tube = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 96, radius, 6, false),
    new THREE.MeshStandardMaterial({ color: 0x26242a, roughness: 0.5, metalness: 0.82 })
  );
  tube.castShadow = true;
  overhead.add(tube);
}
for (let z = -30; z <= 24; z += 12) {
  for (const x of [-6.8, 6.8]) {
    const pole = cylinder(0.13, 0.18, 7.1, darkMetal, x, 3.55, z, overhead, 10);
    pole.castShadow = true;
    cylinder(0.23, 0.31, 0.20, darkMetal, x, 0.12, z, overhead, 10);
    const crossbar = box(13.8, 0.10, 0.10, darkMetal, 0, 6.76, z, overhead);
    crossbar.castShadow = true;
    sphere(0.10, new THREE.MeshStandardMaterial({ color: 0xe6ddbd, roughness: 0.55 }), x, 6.52, z, overhead);
  }
  addWire([
    new THREE.Vector3(-6.8, 6.72, z),
    new THREE.Vector3(-3.6, 6.41, z),
    new THREE.Vector3(0, 6.14, z),
    new THREE.Vector3(3.6, 6.41, z),
    new THREE.Vector3(6.8, 6.72, z)
  ], 0.019);
}
addWire([

  new THREE.Vector3(0, 5.93, -25),

  new THREE.Vector3(0, 5.93, -8),

    new THREE.Vector3(side * 6.8, 6.48, 18),
    new THREE.Vector3(side * 6.8, 6.72, 31)
  ], 0.018);
}

const lampLights = [];
function createStreetLamp(x, z) {
  const lampGroup = new THREE.Group();
  lampGroup.position.set(x, 0, z);
  scene.add(lampGroup);
  cylinder(0.18, 0.26, 0.18, darkMetal, 0, 0.09, 0, lampGroup, 12);
  cylinder(0.075, 0.10, 3.4, darkMetal, 0, 1.82, 0, lampGroup, 10);
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 3.28, 0),
    new THREE.Vector3(-Math.sign(x) * 0.08, 3.78, 0),
    new THREE.Vector3(-Math.sign(x) * 0.42, 3.86, 0),
    new THREE.Vector3(-Math.sign(x) * 0.62, 3.64, 0)
  ]);
  const hook = new THREE.Mesh(new THREE.TubeGeometry(curve, 16, 0.048, 8, false), darkMetal);
  lampGroup.add(hook);
  const lanternX = -Math.sign(x) * 0.62;
  box(0.50, 0.54, 0.50, darkMetal, lanternX, 3.47, 0, lampGroup);
  box(0.42, 0.38, 0.42, warmGlass, lanternX, 3.47, 0, lampGroup).castShadow = false;
  const cap = cylinder(0.37, 0.27, 0.20, darkMetal, lanternX, 3.84, 0, lampGroup, 6);
  const glow = new THREE.PointLight(0xffb35d, 1.75, 10, 2);
  glow.position.set(lanternX, 3.42, 0);
  lampGroup.add(glow);
  lampLights.push(glow);
}

  dome.rotation.z = Math.PI / 2;

}

function createCafeTable(x, z) {
  const table = new THREE.Group();
  table.position.set(x, 0, z);
  scene.add(table);
  cylinder(0.44, 0.44, 0.09, paleWood, 0, 1.05, 0, table, 18);
  cylinder(0.06, 0.08, 1.0, darkMetal, 0, 0.55, 0, table, 10);
  cylinder(0.32, 0.24, 0.06, darkMetal, 0, 0.08, 0, table, 10);
  for (const side of [-1, 1]) {
    const chair = box(0.45, 0.09, 0.43, paleWood, side * 0.72, 0.48, 0.02, table);
    const back = box(0.45, 0.48, 0.06, paleWood, side * 0.72, 0.72, 0.20, table);
    chair.rotation.y = side * 0.15;
    back.rotation.y = side * 0.15;
    for (const dz of [-0.14, 0.14]) {
      cylinder(0.025, 0.025, 0.46, darkMetal, side * 0.72, 0.23, dz, table, 8);
    }
  }
  const cup = cylinder(0.09, 0.075, 0.12, creamMaterial, 0.12, 1.15, 0.08, table, 10);
  cup.castShadow = false;
}
createCafeTable(5.8, 8.3);
createCafeTable(5.4, 11.2);
createCafeTable(-5.5, 16.0);

const pigeons = [];
function createPigeon(x, z, scale = 1) {
  const pigeon = new THREE.Group();
  pigeon.position.set(x, 0.22, z);
  pigeon.scale.setScalar(scale);
  scene.add(pigeon);
  const body = sphere(0.16, new THREE.MeshStandardMaterial({ color: 0x59606a, roughness: 0.8 }), 0, 0.15, 0, pigeon);
  body.scale.set(1.1, 0.8, 1.5);
  sphere(0.10, new THREE.MeshStandardMaterial({ color: 0x6f7781, roughness: 0.8 }), 0.04, 0.29, 0.13, pigeon);
  const beak = new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.12, 5), new THREE.MeshStandardMaterial({ color: 0xc48349 }));
  beak.rotation.x = Math.PI / 2;
  beak.position.set(0.04, 0.29, 0.23);
  pigeon.add(beak);
  for (const sx of [-0.06, 0.06]) {
    cylinder(0.012, 0.012, 0.14, new THREE.MeshStandardMaterial({ color: 0x9e5c4c }), sx, 0.04, 0.03, pigeon, 6);
  }
  pigeon.userData.phase = rand() * Math.PI * 2;
  pigeons.push(pigeon);
}
createPigeon(-3.4, 7.3, 1.0);
createPigeon(-2.7, 7.7, 0.82);
createPigeon(3.7, 11.0, 0.92);
createPigeon(4.35, 10.8, 0.78);
createPigeon(-4.8, -9.6, 0.86);

for (let i = 0; i < 24; i++) {
  const x = range(-6.7, 6.7);
  const z = range(-29, 21);
  const leaf = new THREE.Mesh(
    new THREE.CircleGeometry(range(0.035, 0.075), 7),
    new THREE.MeshStandardMaterial({ color: choose([0x85504a, 0xb36d42, 0x6d5932]), side: THREE.DoubleSide, roughness: 1 })
  );
  leaf.rotation.x = -Math.PI / 2;
  leaf.rotation.z = rand() * Math.PI;
  leaf.position.set(x, 0.15, z);
  leaf.receiveShadow = true;
  scene.add(leaf);
}

const distantFacade = new THREE.Group();
scene.add(distantFacade);
for (let i = -3; i <= 3; i++) {
  const h = range(5.5, 9);
  const b = box(4.4, h, 1.8, new THREE.MeshStandardMaterial({ color: choose([0x79616a, 0x6d6873, 0x80685c]), roughness: 0.9 }), i * 4.15, h / 2, -38.5, distantFacade);
  b.castShadow = false;
  for (let y = 1.8; y < h - 0.8; y += 1.7) {
    box(0.92, 0.85, 0.07, glassMaterial, i * 4.15, y, -37.57, distantFacade).castShadow = false;
  }
}

const clock = new THREE.Group();
clock.position.set(-8.35, 5.9, -12.8);
scene.add(clock);
const clockFace = cylinder(0.48, 0.48, 0.11, creamMaterial, 0, 0, 0, clock, 20);
clockFace.rotation.x = Math.PI / 2;
const clockRim = new THREE.Mesh(new THREE.TorusGeometry(0.49, 0.05, 8, 24), darkMetal);
clockRim.rotation.x = Math.PI / 2;
clock.add(clockRim);
const handA = box(0.055, 0.25, 0.035, darkMetal, 0.08, 0.12, -0.08, clock);
handA.rotation.z = -0.5;
const handB = box(0.035, 0.34, 0.035, darkMetal, -0.11, -0.07, -0.09, clock);
handB.rotation.z = 1.1;

const clockGlow = new THREE.PointLight(0xffb368, 1.3, 7);
clockGlow.position.copy(clock.position).add(new THREE.Vector3(0, 0, 0.8));
scene.add(clockGlow);

const clockStart = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const time = (now - clockStart) * 0.001;

  tramCar.position.y = Math.sin(time * 0.75) * 0.018;
  tramCar.rotation.z = Math.sin(time * 0.42) * 0.004;
  tramInteriorLight.intensity = 4.65 + Math.sin(time * 2.2) * 0.38;

  for (let i = 0; i < tramWindowMaterials.length; i++) {
    tramWindowMaterials[i].emissiveIntensity = 1.17 + Math.sin(time * 1.8 + i * 0.9) * 0.16;
  }
  for (let i = 0; i < awnings.length; i++) {
    awnings[i].rotation.z += Math.sin(time * 1.1 + i * 0.36) * 0.00035;
  }
  for (let i = 0; i < pigeons.length; i++) {
    const bird = pigeons[i];
    bird.position.y = 0.22 + Math.abs(Math.sin(time * 2.3 + bird.userData.phase)) * 0.035;
    bird.rotation.y = Math.sin(time * 0.75 + bird.userData.phase) * 0.35;
  }
  for (let i = 0; i < lampLights.length; i++) {
    lampLights[i].intensity = 1.62 + Math.sin(time * 3.1 + i * 1.7) * 0.12 + Math.sin(time * 11 + i) * 0.035;
  }
  clockGlow.intensity = 1.2 + Math.sin(time * 2.6) * 0.12;

  controls.update();
  renderer.render(scene, camera);
}
animate(performance.now());

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
