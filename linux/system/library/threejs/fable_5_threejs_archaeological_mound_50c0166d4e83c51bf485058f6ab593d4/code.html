<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Archaeological Mound</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#b8b2a3}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8b2a3);
scene.fog = new THREE.Fog(0xb8b2a3, 60, 140);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 300);
camera.position.set(26, 14, 26);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 12;
controls.maxDistance = 80;

// Lighting
scene.add(new THREE.HemisphereLight(0xdfd8c8, 0x6b6152, 0.75));
const sun = new THREE.DirectionalLight(0xfff2dd, 1.6);
sun.position.set(22, 30, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30; sun.shadow.camera.bottom = -30;
sun.shadow.camera.far = 90;
sun.shadow.bias = -0.0005;
scene.add(sun);

// Ground plane with subtle grid
const groundTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#9a9078'; g.fillRect(0,0,512,512);
  g.strokeStyle = 'rgba(70,62,48,0.28)'; g.lineWidth = 1;
  for (let i = 0; i <= 512; i += 32) {
    g.beginPath(); g.moveTo(i,0); g.lineTo(i,512); g.stroke();
    g.beginPath(); g.moveTo(0,i); g.lineTo(512,i); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(10,10);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(160, 160),
  new THREE.MeshStandardMaterial({ map: groundTex, roughness: 1 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// Mound: broad low rounded earth mound (~24 m wide, ~5 m tall)
const R = 12, H = 5;
const hash = (x, z) => {
  const s = Math.sin(x*127.1 + z*311.7) * 43758.5453;
  return s - Math.floor(s);
};
const noise = (x, z) => {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x-xi, zf = z-zi;
  const u = xf*xf*(3-2*xf), v = zf*zf*(3-2*zf);
  return hash(xi,zi)*(1-u)*(1-v) + hash(xi+1,zi)*u*(1-v) + hash(xi,zi+1)*(1-u)*v + hash(xi+1,zi+1)*u*v;
};

// Two worn footpaths spiral gently up opposite sides
const paths = [
  { a0: 0.4, twist: 1.5 },
  { a0: 0.4 + Math.PI, twist: -1.3 }
];
const pathFactor = (x, z) => { // 0..1, 1 = on path
  const r = Math.hypot(x, z), ang = Math.atan2(z, x);
  const t = 1 - r/R; // 0 at edge, 1 at center
  let f = 0;
  if (r > 1.2 && r < R*0.98) {
    for (const p of paths) {
      const target = p.a0 + p.twist * t;
      let d = ang - target;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      const w = d * r; // arc distance in meters
      f = Math.max(f, Math.exp(-(w*w)/(2*0.55*0.55)));
    }
  }
  return f;
};

const moundGeo = new THREE.PlaneGeometry(R*2, R*2, 140, 140);
moundGeo.rotateX(-Math.PI/2);
const pos = moundGeo.attributes.position;
const colors = new Float32Array(pos.count * 3);
const cEarth = new THREE.Color(0x8a7355);
const cGrass = new THREE.Color(0x7c7a53);
const cPath = new THREE.Color(0xa8906c);
const col = new THREE.Color();
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i), z = pos.getZ(i);
  const r = Math.hypot(x, z);
  let h = 0;
  if (r < R) {
    const t = r / R;
    h = H * Math.pow(Math.cos(t * Math.PI/2), 1.35); // rounded profile
    h += (noise(x*0.55+9, z*0.55+3) - 0.5) * 0.5 * (1 - t*t); // gentle irregularity
    const pf = pathFactor(x, z);
    h -= pf * 0.22; // worn depression
    col.lerpColors(cEarth, cGrass, Math.min(1, h/H + noise(x*1.3, z*1.3)*0.35));
    col.lerp(cPath, pf * 0.85);
    h = Math.max(0, h);
  } else {
    col.copy(cGrass).lerp(cEarth, 0.4);
  }
  pos.setY(i, h);
  colors[i*3] = col.r; colors[i*3+1] = col.g; colors[i*3+2] = col.b;
}
moundGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
moundGeo.computeVertexNormals();

const mound = new THREE.Mesh(
  moundGeo,
  new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0 })
);
mound.castShadow = true;
mound.receiveShadow = true;
scene.add(mound);

// Height sampler for placing posts
const heightAt = (x, z) => {
  const r = Math.hypot(x, z);
  if (r >= R) return 0;
  const t = r/R;
  let h = H * Math.pow(Math.cos(t*Math.PI/2), 1.35);
  h += (noise(x*0.55+9, z*0.55+3) - 0.5) * 0.5 * (1 - t*t);
  h -= pathFactor(x, z) * 0.22;
  return Math.max(0, h);
};

// Slender marker posts on top
const postMat = new THREE.MeshStandardMaterial({ color: 0x5e4f3a, roughness: 0.85 });
const capMat = new THREE.MeshStandardMaterial({ color: 0xc4b48e, roughness: 0.6 });
const postGeo = new THREE.CylinderGeometry(0.045, 0.06, 1.5, 8);
const capGeo = new THREE.CylinderGeometry(0.055, 0.045, 0.08, 8);
[[0.4, 0.3], [-1.6, 1.1], [1.3, -1.5], [-0.7, -2.2], [2.4, 1.7]].forEach(([x, z], i) => {
  const post = new THREE.Mesh(postGeo, postMat);
  const y = heightAt(x, z);
  post.position.set(x, y + 0.72, z);
  post.rotation.set((noise(x,z)-0.5)*0.12, 0, (noise(z,x)-0.5)*0.12);
  post.castShadow = true;
  scene.add(post);
  const cap = new THREE.Mesh(capGeo, capMat);
  cap.position.y = 0.79;
  post.add(cap);
});

// A few half-buried stones near the base
const stoneMat = new THREE.MeshStandardMaterial({ color: 0x847d70, roughness: 0.9, flatShading: true });
[[8.5, 4.2, 0.5], [-7.8, -6.1, 0.4], [5.2, -9.0, 0.35], [-9.9, 3.4, 0.45]].forEach(([x, z, s]) => {
  const stone = new THREE.Mesh(new THREE.IcosahedronGeometry(s, 0), stoneMat);
  stone.position.set(x, heightAt(x, z) + s*0.35, z);
  stone.rotation.set(noise(x,z)*3, noise(z,x)*3, 0);
  stone.scale.y = 0.7;
  stone.castShadow = true; stone.receiveShadow = true;
  scene.add(stone);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
