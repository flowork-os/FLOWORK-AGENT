<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Pangolin</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #b7ab91; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8ad96);
scene.fog = new THREE.Fog(0xb8ad96, 8, 18);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.1, 2.7, 5.4);
camera.lookAt(0.25, 0.95, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 3;
controls.maxDistance = 9;
controls.target.set(0.25, 0.95, 0);

scene.add(new THREE.HemisphereLight(0xf4ead3, 0x554a39, 2.2));

const key = new THREE.DirectionalLight(0xffe2b5, 4.0);
key.position.set(-4, 7, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 5;
key.shadow.camera.bottom = -3;
key.shadow.bias = -0.0004;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9daed0, 1.35);
fill.position.set(4, 3, -5);
scene.add(fill);

const armorColors = [0x665b32, 0x78683a, 0x887345, 0x5c522f, 0x967d47, 0x706039];
const armorMats = armorColors.map((color, i) => new THREE.MeshStandardMaterial({
  color,
  roughness: 0.84 - i * 0.025,
  metalness: 0.03,
  flatShading: true,
  side: THREE.DoubleSide
}));
const edgeMat = new THREE.LineBasicMaterial({ color: 0xc69a4e, transparent: true, opacity: 0.6 });
const scratchMat = new THREE.LineBasicMaterial({ color: 0x3f3923, transparent: true, opacity: 0.7 });
const skinMat = new THREE.MeshStandardMaterial({ color: 0x9b817b, roughness: 0.96, flatShading: true });
const skinDarkMat = new THREE.MeshStandardMaterial({ color: 0x695b57, roughness: 1, flatShading: true });
const noseMat = new THREE.MeshStandardMaterial({ color: 0x292521, roughness: 0.72 });
const eyeMat = new THREE.MeshStandardMaterial({ color: 0x070605, roughness: 0.22 });

const pangolin = new THREE.Group();
pangolin.position.set(-0.25, 0, 0);
scene.add(pangolin);

function ellipsoid(geometry, material, position, scale, parent = pangolin) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(position);
  mesh.scale.copy(scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function basisQuaternion(xAxis, yAxis, zAxis) {
  const matrix = new THREE.Matrix4().makeBasis(xAxis, yAxis, zAxis);
  return new THREE.Quaternion().setFromRotationMatrix(matrix);
}

function cylinderBetween(a, b, radius, material, parent = pangolin, radialSegments = 10) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const length = direction.length();
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius * 1.08, length, radialSegments), material);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function shieldGeometry(width, length, thickness) {
  const w = width * 0.5;
  const vertices = new Float32Array([
    -w, 0, 0,
     w, 0, 0,
     w * 0.43, length * 0.72, thickness,
     0, length, thickness * 1.7,
    -w * 0.43, length * 0.72, thickness
  ]);
  const indices = [
    0, 1, 2,
    0, 2, 4,
    4, 2, 3
  ];
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(vertices, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

function addScale(position, xAxis, yAxis, zAxis, width, length, material, scratched = false) {
  const geometry = shieldGeometry(width, length, width * 0.08);
  const quaternion = basisQuaternion(xAxis, yAxis, zAxis);
  const scale = new THREE.Mesh(geometry, material);
  scale.position.copy(position).addScaledVector(zAxis, 0.018);
  scale.quaternion.copy(quaternion);
  scale.castShadow = true;
  scale.receiveShadow = true;
  pangolin.add(scale);

  const outline = new THREE.LineSegments(new THREE.EdgesGeometry(geometry), edgeMat);
  outline.position.copy(scale.position);
  outline.quaternion.copy(quaternion);
  pangolin.add(outline);

  if (scratched) {
    const scratchGeometry = new THREE.BufferGeometry();
    const scratchPositions = new Float32Array([
      -width * 0.15, length * 0.34, width * 0.095,
       width * 0.02, length * 0.55, width * 0.095,
       width * 0.10, length * 0.60, width * 0.095,
       width * 0.20, length * 0.76, width * 0.095
    ]);
    scratchGeometry.setAttribute("position", new THREE.BufferAttribute(scratchPositions, 3));
    const scratches = new THREE.LineSegments(scratchGeometry, scratchMat);
    scratches.position.copy(scale.position);
    scratches.quaternion.copy(quaternion);
    pangolin.add(scratches);
  }
}

const body = ellipsoid(
  new THREE.SphereGeometry(1, 32, 20),
  new THREE.MeshStandardMaterial({ color: 0x50482d, roughness: 0.92, flatShading: true }),
  new THREE.Vector3(0, 1.18, 0),
  new THREE.Vector3(1.36, 0.69, 0.76)
);

ellipsoid(
  new THREE.SphereGeometry(1, 28, 18),
  new THREE.MeshStandardMaterial({ color: 0xa18b7d, roughness: 1, flatShading: true }),
  new THREE.Vector3(-0.03, 0.94, 0),
  new THREE.Vector3(1.02, 0.36, 0.62)
);

const neck = ellipsoid(
  new THREE.SphereGeometry(1, 24, 16),
  armorMats[2],
  new THREE.Vector3(-1.05, 1.25, 0),
  new THREE.Vector3(0.58, 0.58, 0.59)
);

const head = ellipsoid(
  new THREE.SphereGeometry(1, 28, 18),
  skinMat,
  new THREE.Vector3(-1.43, 1.16, 0),
  new THREE.Vector3(0.59, 0.43, 0.43)
);

const muzzle = ellipsoid(
  new THREE.SphereGeometry(1, 24, 14),
  skinMat,
  new THREE.Vector3(-1.79, 1.04, 0),
  new THREE.Vector3(0.52, 0.25, 0.27)
);

ellipsoid(
  new THREE.SphereGeometry(1, 16, 10),
  noseMat,
  new THREE.Vector3(-2.17, 1.06, 0),
  new THREE.Vector3(0.14, 0.13, 0.19)
);

for (const side of [-1, 1]) {
  ellipsoid(
    new THREE.SphereGeometry(1, 12, 8),
    eyeMat,
    new THREE.Vector3(-1.67, 1.34, side * 0.345),
    new THREE.Vector3(0.052, 0.058, 0.045)
  );
  ellipsoid(
    new THREE.SphereGeometry(1, 10, 6),
    skinDarkMat,
    new THREE.Vector3(-1.98, 1.1, side * 0.17),
    new THREE.Vector3(0.035, 0.018, 0.075)
  );
}

for (const side of [-1, 1]) {
  const ear = ellipsoid(
    new THREE.SphereGeometry(1, 14, 8),
    skinDarkMat,
    new THREE.Vector3(-1.23, 1.32, side * 0.41),
    new THREE.Vector3(0.11, 0.16, 0.045)
  );
  ear.rotation.x = side * 0.25;
}

const bodyRows = 7;
const thetaValues = [0.25, 0.58, 0.91, 1.24, 1.57, 1.90, 2.23, 2.56, 2.88];

for (let row = 0; row < bodyRows; row++) {
  const x = -0.91 + row * 0.34;
  const ry = 0.63 * (1 - 0.11 * Math.abs(x) / 1.3);
  const rz = 0.72 * (1 - 0.14 * Math.abs(x) / 1.3);
  for (let j = 0; j < thetaValues.length; j++) {
    if (row < 2 && (j === 0 || j === 8)) continue;
    const theta = thetaValues[j] + (row % 2 ? 0.055 : 0);
    const sin = Math.sin(theta);
    const cos = Math.cos(theta);
    const position = new THREE.Vector3(x, 1.18 + ry * sin, rz * cos);
    const normal = new THREE.Vector3(0, sin / ry, cos / rz).normalize();
    const lateral = new THREE.Vector3(0, cos, -sin).normalize();
    const tangent = new THREE.Vector3(1, 0, 0);
    const width = 0.36 + 0.045 * sin;
    const length = 0.31 + 0.035 * sin;
    const material = armorMats[(row * 3 + j) % armorMats.length];
    addScale(position, lateral, tangent, normal, width, length, material, (row + j) % 4 === 0);
  }
}

for (let i = 0; i < 5; i++) {
  const x = -1.28 + i * 0.22;
  const y = 1.45 + 0.06 * Math.cos(i);
  const z = 0.25 * Math.sin(i * 1.4);
  const normal = new THREE.Vector3(0, 0.9, z > 0 ? 0.35 : -0.35).normalize();
  const lateral = new THREE.Vector3(0, -normal.z, normal.y).normalize();
  addScale(
    new THREE.Vector3(x, y, z),
    lateral,
    new THREE.Vector3(1, 0, 0),
    normal,
    0.3,
    0.25,
    armorMats[(i + 2) % armorMats.length],
    i % 2 === 0
  );
}

const legPositions = [
  { x: -0.78, z: 0.49, front: true },
  { x:  0.78, z: 0.49, front: false },
  { x: -0.78, z: -0.49, front: true },
  { x:  0.78, z: -0.49, front: false }
];

for (let i = 0; i < legPositions.length; i++) {
  const p = legPositions[i];
  const upper = new THREE.Vector3(p.x, 0.92, p.z);
  const elbow = new THREE.Vector3(p.x - (p.front ? 0.08 : -0.08), 0.49, p.z * 1.04);
  const wrist = new THREE.Vector3(p.x - (p.front ? 0.16 : -0.10), 0.19, p.z * 1.07);
  cylinderBetween(upper, elbow, 0.16, skinMat);
  cylinderBetween(elbow, wrist, 0.13, skinMat);
  ellipsoid(new THREE.SphereGeometry(1, 12, 8), skinDarkMat, elbow, new THREE.Vector3(0.17, 0.14, 0.15));

  const foot = ellipsoid(
    new THREE.SphereGeometry(1, 14, 9),
    skinMat,
    wrist,
    new THREE.Vector3(0.22, 0.12, 0.19)
  );

  for (let c = -1; c <= 1; c++) {
    const clawStart = wrist.clone().add(new THREE.Vector3(-0.05, -0.02, c * 0.09));
    const clawEnd = clawStart.clone().add(new THREE.Vector3(-0.13, -0.08, c * 0.11));
    cylinderBetween(clawStart, clawEnd, 0.027, noseMat, pangolin, 7);
  }

  for (let r = 0; r < 3; r++) {
    const wrinkle = new THREE.Mesh(
      new THREE.TorusGeometry(0.14 - r * 0.018, 0.009, 5, 14, Math.PI * 1.25),
      skinDarkMat
    );
    wrinkle.position.copy(wrist).add(new THREE.Vector3(0, 0.025 + r * 0.025, 0));
    wrinkle.rotation.x = Math.PI * 0.5;
    wrinkle.rotation.z = 0.3;
    wrinkle.scale.z = 0.65;
    pangolin.add(wrinkle);
  }
}

const tailPoints = [
  new THREE.Vector3(1.13, 1.2, 0),
  new THREE.Vector3(1.55, 1.14, 0.03),
  new THREE.Vector3(1.93, 1.02, 0.17),
  new THREE.Vector3(2.25, 0.78, 0.42),
  new THREE.Vector3(2.32, 0.55, 0.72),
  new THREE.Vector3(2.12, 0.39, 0.89),
  new THREE.Vector3(1.78, 0.32, 0.86),
  new THREE.Vector3(1.53, 0.36, 0.68)
];
const tailCurve = new THREE.CatmullRomCurve3(tailPoints);
const tailGroup = new THREE.Group();
pangolin.add(tailGroup);

for (let i = 0; i < tailPoints.length - 1; i++) {
  const radius = 0.30 * (1 - i / (tailPoints.length + 1) * 0.72);
  cylinderBetween(tailPoints[i], tailPoints[i + 1], radius, armorMats[(i + 1) % armorMats.length], tailGroup, 12);
  ellipsoid(
    new THREE.SphereGeometry(1, 14, 9),
    armorMats[(i + 1) % armorMats.length],
    tailPoints[i + 1],
    new THREE.Vector3(radius, radius, radius),
    tailGroup
  );
}

for (let i = 1; i < 15; i++) {
  const t = i / 15;
  const position = tailCurve.getPointAt(t);
  const tangent = tailCurve.getTangentAt(t).normalize();
  const worldUp = new THREE.Vector3(0, 1, 0);
  let side = new THREE.Vector3().crossVectors(tangent, worldUp).normalize();
  if (side.lengthSq() < 0.01) side.set(0, 0, 1);
  const radial = new THREE.Vector3().crossVectors(side, tangent).normalize();
  const angle = (i % 5) * (Math.PI * 2 / 5) + 0.24;
  const outward = radial.clone().multiplyScalar(Math.cos(angle)).addScaledVector(side, Math.sin(angle)).normalize();
  const around = new THREE.Vector3().crossVectors(tangent, outward).normalize();
  const radius = 0.28 * (1 - t * 0.66);
  const scalePosition = position.clone().addScaledVector(outward, radius * 0.92);
  addScale(
    scalePosition,
    around,
    tangent,
    outward,
    0.31 * (1 - t * 0.35),
    0.34 * (1 - t * 0.25),
    armorMats[(i + 3) % armorMats.length],
    i % 3 === 0
  );
}

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(12, 64),
  new THREE.MeshStandardMaterial({ color: 0x94866e, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.015;
ground.receiveShadow = true;
scene.add(ground);

const softShadow = new THREE.Mesh(
  new THREE.CircleGeometry(2.5, 48),
  new THREE.MeshBasicMaterial({ color: 0x4e4638, transparent: true, opacity: 0.18, depthWrite: false })
);
softShadow.rotation.x = -Math.PI / 2;
softShadow.scale.set(1.2, 0.55, 1);
softShadow.position.set(0.18, 0.002, 0.12);
scene.add(softShadow);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
</body>
</html>
