<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------------------------------------------------------------------
   Renderer
--------------------------------------------------------------------------- */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

/* ---------------------------------------------------------------------------
   Scene & camera
--------------------------------------------------------------------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111318);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(5.6, 3.4, 6.6);

// Studio environment for believable metal reflections (procedural, no assets)
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ---------------------------------------------------------------------------
   Lighting: hemisphere + directional key / fill / rim
--------------------------------------------------------------------------- */
const hemi = new THREE.HemisphereLight(0x9fb4d6, 0x2a2016, 0.55);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xfff1dc, 2.4);
keyLight.position.set(6, 9, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 30;
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.radius = 4;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x89a7ff, 0.7);
fillLight.position.set(-7, 3, 4);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffcf8a, 1.5);
rimLight.position.set(-4, 6, -7);
scene.add(rimLight);

/* ---------------------------------------------------------------------------
   Ground plane that only receives shadows
--------------------------------------------------------------------------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------------------------------------------------------------------
   Materials — aged, patinated brass & copper family
--------------------------------------------------------------------------- */
const brass      = new THREE.MeshStandardMaterial({ color: 0xb08a44, metalness: 1.0, roughness: 0.40 });
const brassLite  = new THREE.MeshStandardMaterial({ color: 0xc9a256, metalness: 1.0, roughness: 0.32 });
const brassDark  = new THREE.MeshStandardMaterial({ color: 0x7d5f2c, metalness: 1.0, roughness: 0.52 });
const copper     = new THREE.MeshStandardMaterial({ color: 0xb06a44, metalness: 1.0, roughness: 0.38 });
const copperDark = new THREE.MeshStandardMaterial({ color: 0x8a4f30, metalness: 1.0, roughness: 0.50 });
const steel      = new THREE.MeshStandardMaterial({ color: 0x8b8f96, metalness: 1.0, roughness: 0.34 });
const steelDark  = new THREE.MeshStandardMaterial({ color: 0x35363a, metalness: 0.85, roughness: 0.55 });
const patina     = new THREE.MeshStandardMaterial({ color: 0x4f8f7c, metalness: 0.55, roughness: 0.70 });
const woodBase   = new THREE.MeshStandardMaterial({ color: 0x3a2417, metalness: 0.2, roughness: 0.75 });
const irisBlade  = new THREE.MeshStandardMaterial({ color: 0x9a9ea6, metalness: 1.0, roughness: 0.28 });

const eyeGlow    = new THREE.MeshStandardMaterial({
  color: 0xffa53a, emissive: 0xff6a00, emissiveIntensity: 1.4, metalness: 0.0, roughness: 0.5
});
const glass = new THREE.MeshPhysicalMaterial({
  color: 0xffc98a, metalness: 0.0, roughness: 0.05,
  transmission: 0.9, transparent: true, thickness: 0.4, ior: 1.5,
  emissive: 0xff7a1a, emissiveIntensity: 0.25, clearcoat: 1.0, clearcoatRoughness: 0.05
});

[brass, brassLite, brassDark, copper, copperDark, steel].forEach(m => m.envMapIntensity = 1.15);

/* ---------------------------------------------------------------------------
   Helper builders
--------------------------------------------------------------------------- */
function hexBolt(r, h, mat = steel) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 6), mat);
  m.castShadow = true;
  return m;
}

// Radial bolt on a facing panel (points toward +z)
function faceBolt(x, y, z, r = 0.03, h = 0.05, mat = steel) {
  const b = hexBolt(r, h, mat);
  b.rotation.x = Math.PI / 2;
  b.position.set(x, y, z);
  return b;
}

// Procedural gear: extruded toothed shape + hub + optional spokes
function createGear(teeth, rootR, tipR, holeR, thickness, mat, spokes = 0) {
  const shape = new THREE.Shape();
  const step = (Math.PI * 2) / teeth;
  const p = (ang, rad) => [Math.cos(ang) * rad, Math.sin(ang) * rad];
  for (let i = 0; i < teeth; i++) {
    const a = i * step;
    let pt = p(a, rootR);
    if (i === 0) shape.moveTo(pt[0], pt[1]); else shape.lineTo(pt[0], pt[1]);
    pt = p(a + step * 0.20, tipR); shape.lineTo(pt[0], pt[1]);
    pt = p(a + step * 0.30, tipR); shape.lineTo(pt[0], pt[1]);
    pt = p(a + step * 0.50, rootR); shape.lineTo(pt[0], pt[1]);
  }
  shape.closePath();
  const hole = new THREE.Path();
  hole.absarc(0, 0, holeR, 0, Math.PI * 2, true);
  shape.holes.push(hole);

  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: thickness, bevelEnabled: true,
    bevelThickness: thickness * 0.2, bevelSize: tipR * 0.025, bevelSegments: 1, steps: 1
  });
  geo.translate(0, 0, -thickness / 2);
  geo.computeVertexNormals();

  const g = new THREE.Group();
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true; mesh.receiveShadow = true;
  g.add(mesh);

  const hub = new THREE.Mesh(new THREE.CylinderGeometry(holeR * 1.7, holeR * 1.7, thickness * 1.25, 16), mat);
  hub.rotation.x = Math.PI / 2; hub.castShadow = true;
  g.add(hub);
  const axle = new THREE.Mesh(new THREE.CylinderGeometry(holeR * 0.6, holeR * 0.6, thickness * 1.6, 12), steelDark);
  axle.rotation.x = Math.PI / 2;
  g.add(axle);

  for (let s = 0; s < spokes; s++) {
    const a = (s / spokes) * Math.PI * 2;
    const spoke = new THREE.Mesh(new THREE.BoxGeometry(rootR * 1.5, tipR * 0.11, thickness * 0.7), mat);
    spoke.rotation.z = a; spoke.castShadow = true;
    g.add(spoke);
  }
  g.userData.speed = 0;
  return g;
}

// Feather / plate shape (base at origin, tip toward +y)
function featherShape(len, wid) {
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.quadraticCurveTo(wid, len * 0.30, wid * 0.28, len);
  s.quadraticCurveTo(0, len * 1.05, -wid * 0.28, len);
  s.quadraticCurveTo(-wid, len * 0.30, 0, 0);
  return s;
}

function makeFeather(len, wid, mat) {
  const geo = new THREE.ExtrudeGeometry(featherShape(len, wid), {
    depth: 0.05, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 1, steps: 1
  });
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true; m.receiveShadow = true;
  const rib = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, len * 0.9, 6), brassDark);
  rib.position.set(0, len * 0.46, 0.06);
  m.add(rib);
  for (let k = 0; k < 3; k++) {
    const b = faceBolt(0, len * (0.28 + k * 0.26), 0.07, 0.02, 0.03, brassLite);
    m.add(b);
  }
  return m;
}

/* ---------------------------------------------------------------------------
   OWL — assembled group
--------------------------------------------------------------------------- */
const owl = new THREE.Group();
scene.add(owl);

const gears = [];               // animated chest gears
const eyeLights = [];           // subtle glow lights

// Body geometry parameters
const bodyC = new THREE.Vector3(0, 1.72, 0);
const bs = { x: 1.06, y: 1.12, z: 1.00 };

const headC = new THREE.Vector3(0, 3.02, 0);
const hs = { x: 1.04, y: 0.94, z: 0.98 };
const headR = 0.86;

/* ---------- Base with decorative rim ---------- */
(function buildBase() {
  const g = new THREE.Group();

  const disc = new THREE.Mesh(new THREE.CylinderGeometry(1.42, 1.55, 0.22, 48), woodBase);
  disc.position.y = 0.11; disc.castShadow = true; disc.receiveShadow = true;
  g.add(disc);

  const rim = new THREE.Mesh(new THREE.CylinderGeometry(1.46, 1.46, 0.09, 48), brass);
  rim.position.y = 0.235; rim.castShadow = true; rim.receiveShadow = true;
  g.add(rim);

  const topPlate = new THREE.Mesh(new THREE.CylinderGeometry(1.28, 1.34, 0.06, 48), brassDark);
  topPlate.position.y = 0.29; topPlate.receiveShadow = true;
  g.add(topPlate);

  // bolts around rim
  for (let i = 0; i < 20; i++) {
    const a = (i / 20) * Math.PI * 2;
    const b = hexBolt(0.05, 0.09, steel);
    b.position.set(Math.cos(a) * 1.46, 0.25, Math.sin(a) * 1.46);
    g.add(b);
  }
  // little engraved plaque
  const plaque = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.14, 0.03), copper);
  plaque.position.set(0, 0.19, 1.44); plaque.castShadow = true;
  g.add(plaque);

  owl.add(g);
})();

/* ---------- Feet with clawed toes ---------- */
function createToe() {
  const g = new THREE.Group();
  const a = new THREE.Mesh(new THREE.CylinderGeometry(0.062, 0.078, 0.24, 8), brass);
  a.rotation.x = Math.PI / 2; a.position.z = 0.12; a.castShadow = true;
  g.add(a);
  const knuckle = new THREE.Mesh(new THREE.SphereGeometry(0.062, 12, 10), steel);
  knuckle.position.z = 0.24; g.add(knuckle);
  const b = new THREE.Mesh(new THREE.CylinderGeometry(0.046, 0.062, 0.17, 8), brass);
  b.rotation.x = Math.PI / 2 + 0.55; b.position.set(0, -0.03, 0.30); b.castShadow = true;
  g.add(b);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.13, 8), steelDark);
  tip.rotation.x = Math.PI / 2 + 1.5; tip.position.set(0, -0.10, 0.37); tip.castShadow = true;
  g.add(tip);
  return g;
}

function createFoot() {
  const g = new THREE.Group();
  const ankle = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.14, 0.42, 14), brass);
  ankle.position.y = 0.30; ankle.castShadow = true;
  g.add(ankle);
  // hydraulic piston detail
  const piston = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.3, 10), steel);
  piston.position.set(0.11, 0.34, -0.02); piston.rotation.z = 0.2; piston.castShadow = true;
  g.add(piston);
  const joint = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 14), steel);
  joint.position.y = 0.08; joint.castShadow = true;
  g.add(joint);

  const spread = [-0.62, 0, 0.62];
  spread.forEach(a => {
    const t = createToe();
    t.rotation.y = a; t.position.y = 0.04;
    g.add(t);
  });
  const back = createToe();
  back.rotation.y = Math.PI; back.scale.setScalar(0.82); back.position.y = 0.04;
  g.add(back);
  return g;
}

[-0.44, 0.44].forEach(x => {
  const f = createFoot();
  f.position.set(x, 0.32, 0.12);
  owl.add(f);
});

/* ---------- Body ---------- */
(function buildBody() {
  const bodyGeo = new THREE.SphereGeometry(1, 56, 44);
  const body = new THREE.Mesh(bodyGeo, brass);
  body.scale.set(bs.x, bs.y, bs.z);
  body.position.copy(bodyC);
  body.castShadow = true; body.receiveShadow = true;
  owl.add(body);

  // copper breast plate (front lower belly)
  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.72, 40, 28, 0, Math.PI * 2, 0, Math.PI * 0.55), copper);
  belly.scale.set(1.05, 1.1, 0.55);
  belly.rotation.x = Math.PI * 0.5;
  belly.position.set(0, 1.15, 0.78);
  belly.castShadow = true;
  owl.add(belly);

  // patina patches
  for (let i = 0; i < 5; i++) {
    const th = Math.random() * Math.PI * 2;
    const ph = 0.6 + Math.random() * 1.4;
    const patch = new THREE.Mesh(new THREE.CircleGeometry(0.12 + Math.random() * 0.1, 16), patina);
    const x = Math.sin(ph) * Math.cos(th), y = Math.cos(ph), z = Math.sin(ph) * Math.sin(th);
    patch.position.set(bodyC.x + x * bs.x * 1.001, bodyC.y + y * bs.y * 1.001, bodyC.z + z * bs.z * 1.001);
    patch.lookAt(bodyC.x + x * 3, bodyC.y + y * 3, bodyC.z + z * 3);
    owl.add(patch);
  }
})();

// Horizontal plate seams + rivet rings on the body
function bodySeam(yw, tube, mat) {
  const yl = (yw - bodyC.y) / bs.y;
  const cross = Math.sqrt(Math.max(0, 1 - yl * yl));
  const avg = (bs.x + bs.z) / 2;
  const R = cross * avg;
  const t = new THREE.Mesh(new THREE.TorusGeometry(R, tube, 10, 48), mat);
  t.rotation.x = Math.PI / 2;
  t.scale.set(bs.x / avg, bs.z / avg, 1);
  t.position.set(bodyC.x, yw, bodyC.z);
  t.castShadow = true; t.receiveShadow = true;
  owl.add(t);
}
function bodyRivets(yw, count, r) {
  const yl = (yw - bodyC.y) / bs.y;
  const cross = Math.sqrt(Math.max(0, 1 - yl * yl));
  for (let i = 0; i < count; i++) {
    const th = (i / count) * Math.PI * 2;
    const b = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), steel);
    b.position.set(bodyC.x + Math.cos(th) * cross * bs.x,
                   yw,
                   bodyC.z + Math.sin(th) * cross * bs.z);
    b.castShadow = true;
    owl.add(b);
  }
}
bodySeam(1.05, 0.035, brassDark); bodyRivets(1.05, 22, 0.045);
bodySeam(2.30, 0.035, brassDark); bodyRivets(2.30, 20, 0.045);
bodySeam(2.62, 0.045, brass);     bodyRivets(2.62, 16, 0.05); // collar / neck

/* ---------- Exposed clockwork on chest ---------- */
(function buildChest() {
  const g = new THREE.Group();
  g.position.set(0, 1.46, 0);

  // recessed housing on the curved chest
  const back = new THREE.Mesh(new THREE.CircleGeometry(0.62, 40), steelDark);
  back.position.z = 0.86;
  g.add(back);
  const bezel = new THREE.Mesh(new THREE.TorusGeometry(0.60, 0.075, 14, 44), brass);
  bezel.position.z = 0.90; bezel.castShadow = true;
  g.add(bezel);
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2;
    g.add(faceBolt(Math.cos(a) * 0.60, Math.sin(a) * 0.60, 0.94, 0.028, 0.05, steel));
  }

  const gA = createGear(15, 0.42, 0.50, 0.11, 0.10, brassLite, 4);
  gA.position.set(0.02, 0.06, 0.98); gA.userData.speed = 0.55;
  const gB = createGear(11, 0.29, 0.35, 0.08, 0.09, copper, 0);
  gB.position.set(0.43, -0.30, 1.00); gB.userData.speed = -0.95;
  const gC = createGear(9, 0.21, 0.26, 0.06, 0.08, steel, 0);
  gC.position.set(-0.40, -0.31, 1.00); gC.userData.speed = 1.35;
  const gD = createGear(19, 0.30, 0.35, 0.07, 0.07, brassDark, 5);
  gD.position.set(-0.30, 0.36, 0.95); gD.userData.speed = -0.42;

  [gA, gB, gC, gD].forEach(gr => { g.add(gr); gears.push(gr); });
  owl.add(g);
})();

// Wind-up key on the back
(function buildKey() {
  const g = new THREE.Group();
  g.position.set(0, 1.75, -0.98);
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.4, 12), steel);
  shaft.rotation.x = Math.PI / 2; shaft.position.z = -0.2; shaft.castShadow = true;
  g.add(shaft);
  const handle = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.045, 12, 28), brass);
  handle.position.z = -0.42; handle.castShadow = true;
  g.add(handle);
  const bar = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.05, 0.05), brass);
  bar.position.z = -0.42; g.add(bar);
  owl.add(g);
})();

/* ---------- Wings (hinged brass feather plates) ---------- */
function createWing(side) {
  const g = new THREE.Group();

  const pauldron = new THREE.Mesh(new THREE.SphereGeometry(0.32, 22, 16, 0, Math.PI * 2, 0, Math.PI * 0.62), brass);
  pauldron.rotation.z = side * -0.4;
  pauldron.castShadow = true;
  g.add(pauldron);
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 6), steel);
    b.position.set(Math.cos(a) * 0.24, 0.1, Math.sin(a) * 0.24);
    g.add(b);
  }
  const hinge = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.4, 14), steel);
  hinge.rotation.z = Math.PI / 2; hinge.position.y = -0.02;
  hinge.castShadow = true;
  g.add(hinge);

  const mats = [brass, copper, brassDark, brassLite, copperDark, brass];
  const n = 6;
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const f = makeFeather(1.05 - i * 0.075, 0.17 - i * 0.009, mats[i]);
    f.position.set(side * (0.02 + i * 0.015), -0.08, i * 0.01);
    f.rotation.x = Math.PI;               // point downward
    f.rotation.y = side * (-0.35 + t * 1.0); // fan front to back
    f.rotation.z = side * 0.14;
    g.add(f);
  }
  return g;
}
(function placeWings() {
  const yl = (2.12 - bodyC.y) / bs.y;
  const cross = Math.sqrt(Math.max(0, 1 - yl * yl));
  [-1, 1].forEach(side => {
    const w = createWing(side);
    w.position.set(side * cross * bs.x * 0.98, 2.12, -0.04);
    w.rotation.y = side * 0.25;
    w.rotation.z = side * -0.12;
    owl.add(w);
  });
})();

/* ---------- Head ---------- */
(function buildHead() {
  const head = new THREE.Mesh(new THREE.SphereGeometry(headR, 48, 40), brass);
  head.scale.set(hs.x, hs.y, hs.z);
  head.position.copy(headC);
  head.castShadow = true; head.receiveShadow = true;
  owl.add(head);

  // head seam + rivets
  const seam = new THREE.Mesh(new THREE.TorusGeometry(headR * 0.99, 0.03, 10, 44), brassDark);
  seam.rotation.x = Math.PI / 2; seam.scale.set(hs.x, hs.z, 1);
  seam.position.copy(headC);
  owl.add(seam);
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), steel);
    b.position.set(headC.x + Math.cos(a) * headR * hs.x,
                   headC.y,
                   headC.z + Math.sin(a) * headR * hs.z);
    owl.add(b);
  }

  // top hatch with a valve
  const hatch = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.24, 0.1, 20), brassDark);
  hatch.position.set(0, headC.y + headR * hs.y - 0.02, 0);
  hatch.castShadow = true;
  owl.add(hatch);
  const valve = new THREE.Mesh(new THREE.TorusGeometry(0.11, 0.03, 10, 20), steel);
  valve.rotation.x = Math.PI / 2;
  valve.position.set(0, headC.y + headR * hs.y + 0.04, 0);
  owl.add(valve);

  // brow ridges above the eyes
  [-1, 1].forEach(side => {
    const brow = new THREE.Mesh(new THREE.TorusGeometry(0.30, 0.05, 12, 20, Math.PI), brassDark);
    brow.position.set(side * 0.36, headC.y + 0.30, 0.66);
    brow.rotation.z = side * 0.25;
    brow.castShadow = true;
    owl.add(brow);
  });
})();

/* ---------- Eyes: glass lens + iris aperture ---------- */
function createEye() {
  const g = new THREE.Group();

  const bezel = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.085, 16, 34), brass);
  bezel.castShadow = true;
  g.add(bezel);
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2;
    g.add(faceBolt(Math.cos(a) * 0.34, Math.sin(a) * 0.34, 0.055, 0.028, 0.05, steel));
  }

  const back = new THREE.Mesh(new THREE.CircleGeometry(0.33, 36), steelDark);
  back.position.z = -0.01;
  g.add(back);

  const glow = new THREE.Mesh(new THREE.CircleGeometry(0.27, 36), eyeGlow);
  glow.position.z = 0.005;
  g.add(glow);

  // iris aperture blades
  const nb = 9;
  for (let i = 0; i < nb; i++) {
    const a = (i / nb) * Math.PI * 2;
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.26, 0.02), irisBlade);
    blade.position.set(Math.cos(a) * 0.16, Math.sin(a) * 0.16, 0.03);
    blade.rotation.z = a + Math.PI / 2 + 0.55;
    blade.castShadow = true;
    g.add(blade);
  }

  const pupil = new THREE.Mesh(new THREE.CircleGeometry(0.075, 24),
    new THREE.MeshStandardMaterial({ color: 0x0a0500, metalness: 0.3, roughness: 0.6 }));
  pupil.position.z = 0.045;
  g.add(pupil);

  // convex glass lens
  const lensGeo = new THREE.SphereGeometry(0.31, 36, 24, 0, Math.PI * 2, 0, Math.PI * 0.5);
  const lens = new THREE.Mesh(lensGeo, glass);
  lens.scale.set(1, 0.55, 1);
  lens.rotation.x = Math.PI / 2;
  lens.position.z = 0.05;
  g.add(lens);

  // internal glow light
  const light = new THREE.PointLight(0xff8a2a, 0.6, 2.2, 2.0);
  light.position.z = 0.15;
  g.add(light);
  eyeLights.push(light);

  return g;
}
[-1, 1].forEach(side => {
  const eye = createEye();
  eye.position.set(side * 0.37, headC.y + 0.02, 0.74);
  eye.rotation.y = side * -0.16;
  owl.add(eye);
});

/* ---------- Beak ---------- */
(function buildBeak() {
  const beak = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.42, 5), copperDark);
  beak.rotation.x = Math.PI * 0.56;
  beak.position.set(0, headC.y - 0.26, 0.82);
  beak.castShadow = true;
  owl.add(beak);
  const nostril = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 6), steelDark);
  nostril.position.set(0, headC.y - 0.12, 0.88);
  owl.add(nostril);
})();

/* ---------- Ear tufts (clusters of small feather plates) ---------- */
[-1, 1].forEach(side => {
  const tuft = new THREE.Group();
  tuft.position.set(side * 0.5, headC.y + 0.6, -0.05);
  tuft.rotation.z = side * -0.5;
  tuft.rotation.x = -0.3;
  for (let i = 0; i < 3; i++) {
    const f = makeFeather(0.5 - i * 0.06, 0.08, [brass, copper, brassDark][i]);
    f.rotation.z = (i - 1) * 0.28;
    f.rotation.x = 0.1;
    f.position.x = (i - 1) * 0.04;
    tuft.add(f);
  }
  owl.add(tuft);
});

/* ---------- Copper pipes along the back ---------- */
(function buildPipes() {
  [-1, 1].forEach(side => {
    const g = new THREE.Group();
    const lower = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, 1.1, 12), copper);
    lower.position.set(side * 0.5, 1.6, -0.82);
    lower.rotation.x = 0.15;
    lower.castShadow = true;
    g.add(lower);
    const elbow = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.065, 12, 20, Math.PI * 0.6), copper);
    elbow.position.set(side * 0.5, 2.18, -0.72);
    elbow.rotation.y = Math.PI / 2;
    elbow.rotation.z = -0.6;
    g.add(elbow);
    const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.55, 12), copper);
    upper.position.set(side * 0.44, 2.5, -0.6);
    upper.rotation.x = -0.5;
    upper.castShadow = true;
    g.add(upper);
    // couplings
    [1.35, 1.9].forEach(y => {
      const c = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.085, 0.09, 12), brass);
      c.position.set(side * 0.5, y, -0.82);
      c.rotation.x = 0.15;
      g.add(c);
    });
    owl.add(g);
  });
})();

/* ---------------------------------------------------------------------------
   Center the assembled owl & aim controls
--------------------------------------------------------------------------- */
const bbox = new THREE.Box3().setFromObject(owl);
const center = bbox.getCenter(new THREE.Vector3());
owl.position.x -= center.x;
owl.position.z -= center.z; // keep it grounded on Y, centered on X/Z

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.enablePan = false;
controls.minDistance = 4.5;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.9;
controls.target.set(0, 1.95, 0);
controls.update();

/* ---------------------------------------------------------------------------
   Animation loop
--------------------------------------------------------------------------- */
const clock = new THREE.Clock();
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  t += dt;

  for (const gr of gears) gr.rotation.z += gr.userData.speed * dt;

  const pulse = 1.2 + Math.sin(t * 1.6) * 0.35;
  eyeGlow.emissiveIntensity = pulse;
  for (const l of eyeLights) l.intensity = 0.45 + Math.sin(t * 1.6) * 0.2;

  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ---------------------------------------------------------------------------
   Resize handling
--------------------------------------------------------------------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
