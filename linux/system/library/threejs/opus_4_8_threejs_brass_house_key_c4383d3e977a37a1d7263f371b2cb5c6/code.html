<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Brass House Key</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cccccc; }
  #app { width: 100vw; height: 100vh; display: block; }
</style>

<!-- three.js + addons via ES module importmap (jsDelivr CDN, three@0.160.0) -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="app"></canvas>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ------------------------------------------------------------------ *
 *  Units: 1 three.js unit = 1 centimetre.  A real house key is a
 *  small piece of hardware ~5.8 cm long, ~2 mm thick.  The key lies
 *  flat on the ground (its broad stamped face pointing up).
 * ------------------------------------------------------------------ */

// ------------------------------------------------------------------
// Renderer
// ------------------------------------------------------------------
const canvas = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// ------------------------------------------------------------------
// Scene + neutral studio background
// ------------------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcacbcd);

// Procedural studio environment so the polished brass has something
// realistic to reflect (metals appear black without an environment).
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// ------------------------------------------------------------------
// Camera
// ------------------------------------------------------------------
const camera = new THREE.PerspectiveCamera(
  38, window.innerWidth / window.innerHeight, 0.1, 1000
);

// ------------------------------------------------------------------
// Lighting
// ------------------------------------------------------------------
// Sky/ground hemisphere fill
const hemi = new THREE.HemisphereLight(0xffffff, 0x9a8f80, 0.55);
scene.add(hemi);

// Directional key light (casts the contact shadow)
const key = new THREE.DirectionalLight(0xfff4e6, 2.4);
key.position.set(4.5, 8.0, 5.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 40;
key.shadow.camera.left = -8;
key.shadow.camera.right = 8;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -8;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 4;
scene.add(key);

// Subtle cool fill from the opposite side
const fill = new THREE.DirectionalLight(0xdce6ff, 0.5);
fill.position.set(-6, 3.5, -4);
scene.add(fill);

// ------------------------------------------------------------------
// Procedural worn-brass textures (CanvasTexture)
// ------------------------------------------------------------------
function makeBrassTextures() {
  const S = 512;

  // ---- Colour / albedo map: warm brass with patina + wear ----
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');

  // base warm brass gradient
  const grad = g.createLinearGradient(0, 0, S, S);
  grad.addColorStop(0.0, '#b9902f');
  grad.addColorStop(0.5, '#d8b24a');
  grad.addColorStop(1.0, '#a87f28');
  g.fillStyle = grad;
  g.fillRect(0, 0, S, S);

  // mottled patina blotches (darker, aged spots)
  for (let i = 0; i < 900; i++) {
    const x = Math.random() * S, y = Math.random() * S;
    const r = 2 + Math.random() * 14;
    const dark = Math.random() < 0.55;
    g.globalAlpha = 0.04 + Math.random() * 0.10;
    g.fillStyle = dark ? '#6e5015' : '#e8cf7a';
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    g.fill();
  }

  // fine directional scratches from handling / wear
  g.globalAlpha = 0.10;
  for (let i = 0; i < 260; i++) {
    const x = Math.random() * S, y = Math.random() * S;
    const len = 6 + Math.random() * 40;
    const ang = (Math.random() - 0.5) * 0.5; // mostly lengthwise
    g.strokeStyle = Math.random() < 0.5 ? '#8a6a20' : '#f0dc95';
    g.lineWidth = 0.5 + Math.random();
    g.beginPath();
    g.moveTo(x, y);
    g.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
    g.stroke();
  }
  g.globalAlpha = 1;

  const colorTex = new THREE.CanvasTexture(c);
  colorTex.colorSpace = THREE.SRGBColorSpace;
  colorTex.wrapS = colorTex.wrapT = THREE.RepeatWrapping;
  colorTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

  // ---- Roughness map: worn/polished areas are shinier (darker) ----
  const r = document.createElement('canvas');
  r.width = r.height = S;
  const rg = r.getContext('2d');
  rg.fillStyle = '#8a8a8a'; // mid roughness base
  rg.fillRect(0, 0, S, S);
  // patina = rougher (lighter), polished wear = smoother (darker)
  for (let i = 0; i < 1100; i++) {
    const x = Math.random() * S, y = Math.random() * S;
    const rad = 2 + Math.random() * 16;
    rg.globalAlpha = 0.06 + Math.random() * 0.14;
    rg.fillStyle = Math.random() < 0.5 ? '#c8c8c8' : '#4a4a4a';
    rg.beginPath();
    rg.arc(x, y, rad, 0, Math.PI * 2);
    rg.fill();
  }
  rg.globalAlpha = 1;
  const roughTex = new THREE.CanvasTexture(r);
  roughTex.wrapS = roughTex.wrapT = THREE.RepeatWrapping;

  return { colorTex, roughTex };
}

const { colorTex, roughTex } = makeBrassTextures();

// Main worn-brass material
const brassMat = new THREE.MeshStandardMaterial({
  color: 0xcaa53a,          // warm brass tint
  map: colorTex,
  roughnessMap: roughTex,
  metalness: 1.0,
  roughness: 0.45,
  envMapIntensity: 1.1,
});

// Polished-brass ring around the keyring hole (rubbed shiny by a keyring)
const polishedMat = new THREE.MeshStandardMaterial({
  color: 0xe0c05a,
  metalness: 1.0,
  roughness: 0.22,
  envMapIntensity: 1.3,
});

// ------------------------------------------------------------------
// KEY GEOMETRY
// Build the flat key outline (bow + blade + cutting grooves) as a 2D
// Shape, then extrude it to give the stamped metal its thickness.
// ------------------------------------------------------------------
const keyGroup = new THREE.Group();
keyGroup.name = 'BrassHouseKey';

// -- shared dimensions --
const BOW_CX = -1.9, BOW_CY = 0.0, BOW_R = 1.05; // rounded head
const HALF_H = 0.38;                              // blade half-height
const HOLE_X = -2.30, HOLE_Y = 0.0, HOLE_R = 0.32;

// Shoulder angle where the straight blade meets the round bow
const shAng = Math.asin(HALF_H / BOW_R);          // ~0.37 rad
const shX = BOW_CX + Math.cos(shAng) * BOW_R;     // shoulder x (~-0.92)

const shape = new THREE.Shape();

// Start at the top shoulder, run the straight top edge to the tip
shape.moveTo(shX, HALF_H);
shape.lineTo(2.85, HALF_H);
shape.lineTo(2.98, 0.20);   // slightly pointed blade tip
shape.lineTo(2.98, -0.20);
shape.lineTo(2.85, -HALF_H);

// Bottom cutting edge (tip -> shoulder) with a few shallow worn grooves
const bottomEdge = [
  [2.60, -HALF_H], [2.50, -0.16], [2.40, -HALF_H], // groove 1 (shallow)
  [2.20, -HALF_H], [2.08, -0.08], [1.96, -HALF_H], // groove 2 (deeper)
  [1.75, -HALF_H], [1.63, -0.20], [1.50, -HALF_H], // groove 3
  [1.30, -HALF_H], [1.15, -0.12], [1.00, -HALF_H], // groove 4
  [0.75, -HALF_H], [0.60, -0.24], [0.45, -HALF_H], // groove 5 (shallow)
  [shX,  -HALF_H],                                  // run into shoulder
];
bottomEdge.forEach(p => shape.lineTo(p[0], p[1]));

// Sweep the major arc of the bow back up to the top shoulder
shape.absarc(BOW_CX, BOW_CY, BOW_R, -shAng, shAng, true);

// Keyring hole punched through the bow
const holePath = new THREE.Path();
holePath.absarc(HOLE_X, HOLE_Y, HOLE_R, 0, Math.PI * 2, false);
shape.holes.push(holePath);

// Extrude into a thin stamped plate (~2.2 mm) with a soft milled bevel
const THICK = 0.22;
const keyGeo = new THREE.ExtrudeGeometry(shape, {
  depth: THICK,
  bevelEnabled: true,
  bevelThickness: 0.025,
  bevelSize: 0.025,
  bevelSegments: 2,
  curveSegments: 32,
});
// Lay the key flat: extrude runs along +Z, rotate so thickness is vertical
keyGeo.rotateX(-Math.PI / 2);
keyGeo.computeBoundingBox();
const gbb = keyGeo.boundingBox;
const yMid = (gbb.min.y + gbb.max.y) / 2;

const keyMesh = new THREE.Mesh(keyGeo, brassMat);
keyMesh.name = 'keyBody';           // bow + blade + grooves (one stamped part)
keyMesh.castShadow = true;
keyMesh.receiveShadow = true;
keyGroup.add(keyMesh);

// Polished wear ring lining the keyring hole (shows edge wear)
const ringGeo = new THREE.TorusGeometry(HOLE_R, 0.05, 16, 40);
ringGeo.rotateX(Math.PI / 2);       // axis vertical, wrapping the hole
const ring = new THREE.Mesh(ringGeo, polishedMat);
ring.name = 'holeWearRing';
ring.position.set(HOLE_X, yMid, -HOLE_Y); // shape (x,y) -> world (x, ., -y)
ring.castShadow = true;
ring.receiveShadow = true;
keyGroup.add(ring);

// Centre the key at the origin and rest it on the ground plane (y = 0)
keyGroup.position.x = -(gbb.min.x + gbb.max.x) / 2;
keyGroup.position.z = -(gbb.min.z + gbb.max.z) / 2;
keyGroup.position.y = -gbb.min.y;
scene.add(keyGroup);

// ------------------------------------------------------------------
// Ground / soft contact-shadow plane
// ------------------------------------------------------------------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: 0xd4d4d6, roughness: 0.95, metalness: 0.0 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

// ------------------------------------------------------------------
// OrbitControls + auto-framed camera
// ------------------------------------------------------------------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 3;
controls.maxDistance = 40;
controls.maxPolarAngle = Math.PI * 0.495; // stay above the ground

// Frame the camera to the key's world bounding box
const box = new THREE.Box3().setFromObject(keyGroup);
const size = box.getSize(new THREE.Vector3());
const center = box.getCenter(new THREE.Vector3());
const maxDim = Math.max(size.x, size.y, size.z);
const fovRad = camera.fov * Math.PI / 180;
let dist = (maxDim / 2) / Math.tan(fovRad / 2);
dist *= 1.7; // padding around the object

camera.position.set(center.x + dist * 0.55, center.y + dist * 0.55, center.z + dist * 0.75);
camera.lookAt(center);
controls.target.copy(center);
controls.update();

// ------------------------------------------------------------------
// Resize handling
// ------------------------------------------------------------------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ------------------------------------------------------------------
// Render loop
// ------------------------------------------------------------------
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
