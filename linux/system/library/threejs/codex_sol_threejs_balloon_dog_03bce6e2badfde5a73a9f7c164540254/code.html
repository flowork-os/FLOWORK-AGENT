<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrome Magenta Balloon Dog</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #08060c;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x09070d);
  scene.fog = new THREE.FogExp2(0x09070d, 0.022);

  const camera = new THREE.PerspectiveCamera(
    38,
    window.innerWidth / window.innerHeight,
    0.1,
    100
  );
  camera.position.set(9.2, 5.7, 11.5);

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance'
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const pmremGenerator = new THREE.PMREMGenerator(renderer);
  pmremGenerator.compileEquirectangularShader();
  const roomEnvironment = new RoomEnvironment(renderer);
  const environmentTarget = pmremGenerator.fromScene(roomEnvironment, 0.045);
  scene.environment = environmentTarget.texture;
  roomEnvironment.dispose();
  pmremGenerator.dispose();

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(-0.15, 3.15, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.65;
  controls.enablePan = false;
  controls.minDistance = 8;
  controls.maxDistance = 21;
  controls.minPolarAngle = 0.72;
  controls.maxPolarAngle = 1.48;

  const chrome = new THREE.MeshPhysicalMaterial({
    color: new THREE.Color(0xe41482),
    metalness: 1,
    roughness: 0.055,
    clearcoat: 1,
    clearcoatRoughness: 0.04,
    envMapIntensity: 2.25
  });

  const dog = new THREE.Group();
  dog.rotation.y = -0.08;
  scene.add(dog);

  const up = new THREE.Vector3(0, 1, 0);

  function addCapsule(start, end, radius, material = chrome, radialSegments = 32) {
    const a = new THREE.Vector3(...start);
    const b = new THREE.Vector3(...end);
    const direction = new THREE.Vector3().subVectors(b, a);
    const length = direction.length();

    const geometry = new THREE.CapsuleGeometry(
      radius,
      length,
      12,
      radialSegments
    );
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.copy(a).add(b).multiplyScalar(0.5);
    mesh.quaternion.setFromUnitVectors(up, direction.normalize());
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    dog.add(mesh);
    return mesh;
  }

  function addBubble(position, radius, scale = [1, 1, 1], material = chrome) {
    const geometry = new THREE.SphereGeometry(radius, 48, 32);
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(...position);
    mesh.scale.set(...scale);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    dog.add(mesh);
    return mesh;
  }

  addCapsule([-1.05, 3.05, 0], [1.05, 3.05, 0], 0.78);
  addBubble([-1.03, 3.03, 0], 0.74, [1.02, 1, 1.04]);
  addBubble([1.03, 3.03, 0], 0.74, [1.02, 1, 1.04]);

  addCapsule([-1.16, 0.48, 0.48], [-1.02, 2.52, 0.46], 0.39);
  addCapsule([-1.11, 0.48, -0.48], [-0.98, 2.51, -0.46], 0.39);
  addCapsule([1.10, 0.48, 0.48], [1.00, 2.52, 0.46], 0.39);
  addCapsule([1.15, 0.48, -0.48], [1.04, 2.51, -0.46], 0.39);

  addBubble([-1.16, 0.45, 0.48], 0.39, [1.08, 0.78, 1.06]);
  addBubble([-1.11, 0.45, -0.48], 0.39, [1.08, 0.78, 1.06]);
  addBubble([1.10, 0.45, 0.48], 0.39, [1.08, 0.78, 1.06]);
  addBubble([1.15, 0.45, -0.48], 0.39, [1.08, 0.78, 1.06]);

  addCapsule([-1.10, 3.28, 0], [-1.50, 4.48, 0], 0.53);
  addBubble([-1.28, 3.76, 0], 0.55, [0.98, 1.12, 1]);

  addCapsule([-1.64, 4.68, 0], [-2.35, 4.68, 0], 0.59);
  addBubble([-1.62, 4.68, 0], 0.58, [1, 1.02, 1.02]);
  addBubble([-2.34, 4.66, 0], 0.55, [1.05, 0.96, 0.98]);

  addCapsule([-2.36, 4.57, 0], [-2.94, 4.43, 0], 0.39);
  addBubble([-3.12, 4.39, 0], 0.31, [1.22, 0.88, 0.92]);

  addBubble([-3.36, 4.39, 0], 0.18, [1.22, 0.86, 0.86]);
  addBubble([-3.22, 4.56, 0.12], 0.16, [1.05, 0.75, 0.82]);
  addBubble([-3.22, 4.25, -0.10], 0.16, [1.05, 0.75, 0.82]);

  addCapsule([-1.78, 5.04, 0.25], [-1.37, 6.35, 0.46], 0.32);
  addCapsule([-1.98, 5.03, -0.25], [-2.34, 6.25, -0.43], 0.32);
  addBubble([-1.76, 5.06, 0.24], 0.34, [1, 0.86, 1]);
  addBubble([-1.99, 5.04, -0.24], 0.34, [1, 0.86, 1]);

  addBubble([1.55, 3.30, 0], 0.36, [1.05, 1, 1]);
  addCapsule([1.56, 3.34, 0], [2.28, 4.28, 0.03], 0.27);
  addCapsule([2.25, 4.24, 0.03], [2.62, 4.84, 0.04], 0.19);
  addBubble([2.68, 4.94, 0.04], 0.15, [0.92, 1.15, 0.92]);

  const floorMaterial = new THREE.MeshPhysicalMaterial({
    color: 0x17131d,
    metalness: 0.18,
    roughness: 0.3,
    clearcoat: 0.55,
    clearcoatRoughness: 0.2,
    envMapIntensity: 0.65
  });
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 40),
    floorMaterial
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = 0;
  floor.receiveShadow = true;
  scene.add(floor);

  const keyLight = new THREE.SpotLight(0xffe5f3, 1150, 30, 0.55, 0.65, 1.6);
  keyLight.position.set(-5, 10, 7);
  keyLight.target.position.set(-0.4, 3, 0);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  keyLight.shadow.camera.near = 1;
  keyLight.shadow.camera.far = 25;
  keyLight.shadow.bias = -0.00008;
  keyLight.shadow.normalBias = 0.025;
  scene.add(keyLight, keyLight.target);

  const rimLight = new THREE.SpotLight(0x8d64ff, 900, 28, 0.6, 0.75, 1.8);
  rimLight.position.set(6, 7, -7);
  rimLight.target.position.set(0.3, 3.4, 0);
  scene.add(rimLight, rimLight.target);

  const frontLight = new THREE.PointLight(0xff4eb1, 190, 16, 2);
  frontLight.position.set(-5, 4.8, 6);
  scene.add(frontLight);

  const hemisphereLight = new THREE.HemisphereLight(0xd9d5ff, 0x241327, 1.35);
  scene.add(hemisphereLight);

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const elapsed = clock.getElapsedTime();
    dog.position.y = Math.sin(elapsed * 0.8) * 0.012;
    controls.update();
    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
