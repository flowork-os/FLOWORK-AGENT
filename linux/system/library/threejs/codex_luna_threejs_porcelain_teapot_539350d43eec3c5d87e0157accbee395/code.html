<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blue and White Porcelain Teapot</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #dfe9ef;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe9ef);
scene.fog = new THREE.Fog(0xdfe9ef, 7, 13);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.8, 3.5, 6.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 4.2;
controls.maxDistance = 10;
controls.target.set(0, 1.55, 0);

const porcelain = new THREE.MeshPhysicalMaterial({
  color: 0xf8fbfa,
  roughness: 0.16,
  metalness: 0,
  clearcoat: 0.8,
  clearcoatRoughness: 0.08,
  sheen: 0.12
});

const cobalt = new THREE.MeshPhysicalMaterial({
  color: 0x123b91,
  roughness: 0.2,
  metalness: 0,
  clearcoat: 0.65,
  clearcoatRoughness: 0.1
});

const deepBlue = new THREE.MeshPhysicalMaterial({
  color: 0x08245f,
  roughness: 0.18,
  clearcoat: 0.7
});

const gold = new THREE.MeshPhysicalMaterial({
  color: 0xc9a54b,
  roughness: 0.24,
  metalness: 0.35,
  clearcoat: 0.5
});

const teapot = new THREE.Group();
scene.add(teapot);

function mesh(geometry, material, position = [0, 0, 0], scale = [1, 1, 1]) {
  const object = new THREE.Mesh(geometry, material);
  object.position.set(...position);
  object.scale.set(...scale);
  object.castShadow = true;
  object.receiveShadow = true;
  teapot.add(object);
  return object;
}

const body = mesh(
  new THREE.SphereGeometry(1, 96, 64),
  porcelain,
  [0, 1.58, 0],
  [1.62, 1.2, 1.25]
);

mesh(
  new THREE.TorusGeometry(1.42, 0.065, 18, 96),
  cobalt,
  [0, 1.32, 0],
  [1, 1, 0.82]
).rotation.x = Math.PI / 2;

mesh(
  new THREE.TorusGeometry(1.46, 0.055, 18, 96),
  cobalt,
  [0, 1.84, 0],
  [1, 1, 0.82]
).rotation.x = Math.PI / 2;

mesh(
  new THREE.CylinderGeometry(0.68, 0.78, 0.16, 64),
  porcelain,
  [0, 0.47, 0],
  [1, 1, 0.82]
);

mesh(
  new THREE.TorusGeometry(0.62, 0.075, 20, 64),
  cobalt,
  [0, 0.39, 0],
  [1, 1, 0.82]
).rotation.x = Math.PI / 2;

const lidBase = mesh(
  new THREE.TorusGeometry(0.92, 0.105, 24, 96),
  cobalt,
  [0, 2.68, 0],
  [1, 1, 0.86]
);
lidBase.rotation.x = Math.PI / 2;

mesh(
  new THREE.SphereGeometry(0.96, 80, 48, 0, Math.PI * 2, 0, Math.PI / 2),
  porcelain,
  [0, 2.66, 0],
  [1, 0.52, 0.86]
);

mesh(
  new THREE.TorusGeometry(0.68, 0.035, 14, 64),
  cobalt,
  [0, 2.74, 0],
  [1, 1, 0.86]
).rotation.x = Math.PI / 2;

mesh(
  new THREE.SphereGeometry(0.2, 40, 24),
  porcelain,
  [0, 3.21, 0],
  [1, 1.18, 1]
);

mesh(
  new THREE.TorusGeometry(0.17, 0.025, 12, 48),
  cobalt,
  [0, 3.19, 0],
  [1, 1, 1]
).rotation.x = Math.PI / 2;

const spoutCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-1.22, 1.78, 0),
  new THREE.Vector3(-1.62, 1.88, 0),
  new THREE.Vector3(-2.02, 2.18, 0),
  new THREE.Vector3(-2.22, 2.62, 0),
  new THREE.Vector3(-2.18, 2.9, 0)
]);
const spout = new THREE.Mesh(
  new THREE.TubeGeometry(spoutCurve, 64, 0.23, 28, false),
  porcelain
);
spout.castShadow = true;
spout.receiveShadow = true;
teapot.add(spout);

const spoutBandCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-2.21, 2.55, 0),
  new THREE.Vector3(-2.22, 2.64, 0),
  new THREE.Vector3(-2.2, 2.73, 0)
]);
const spoutBand = new THREE.Mesh(
  new THREE.TubeGeometry(spoutBandCurve, 20, 0.245, 28, false),
  cobalt
);
spoutBand.castShadow = true;
teapot.add(spoutBand);

const handleCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(1.18, 2.18, 0),
  new THREE.Vector3(1.92, 2.7, 0),
  new THREE.Vector3(2.48, 2.03, 0),
  new THREE.Vector3(2.38, 1.2, 0),
  new THREE.Vector3(1.42, 0.94, 0)
]);
const handle = new THREE.Mesh(
  new THREE.TubeGeometry(handleCurve, 96, 0.15, 32, false),
  porcelain
);
handle.castShadow = true;
handle.receiveShadow = true;
teapot.add(handle);

const handleAccent = new THREE.Mesh(
  new THREE.TubeGeometry(handleCurve, 96, 0.172, 32, false),
  cobalt
);
handleAccent.scale.set(1, 1, 0.72);
handleAccent.position.z = 0.012;
handleAccent.material = new THREE.MeshBasicMaterial({
  color: 0x123b91,
  transparent: true,
  opacity: 0.7
});
teapot.add(handleAccent);

function frontDepth(x, y) {
  const dx = x / 1.62;
  const dy = (y - 1.58) / 1.2;
  return 1.25 * Math.sqrt(Math.max(0.18, 1 - dx * dx - dy * dy));
}

function createFlower(x, y, size) {
  const group = new THREE.Group();
  const z = frontDepth(x, y) + 0.035;
  group.position.set(x, y, z);

  const center = new THREE.Mesh(
    new THREE.SphereGeometry(0.105 * size, 24, 16),
    gold
  );
  center.scale.set(1, 0.7, 0.42);
  center.castShadow = true;
  group.add(center);

  for (let i = 0; i < 6; i++) {
    const angle = i * Math.PI / 3;
    const petal = new THREE.Mesh(
      new THREE.SphereGeometry(0.18 * size, 28, 20),
      cobalt
    );
    petal.position.set(
      Math.cos(angle) * 0.18 * size,
      Math.sin(angle) * 0.18 * size,
      0
    );
    petal.scale.set(0.62, 1.08, 0.22);
    petal.rotation.z = angle;
    petal.castShadow = true;
    group.add(petal);
  }

  teapot.add(group);
}

createFlower(-0.52, 1.72, 1.05);
createFlower(0.54, 1.45, 0.84);
createFlower(-0.05, 1.02, 0.68);
createFlower(0.72, 2.05, 0.52);

function addLeaf(x, y, angle, size) {
  const z = frontDepth(x, y) + 0.045;
  const leaf = new THREE.Mesh(
    new THREE.SphereGeometry(0.18 * size, 24, 16),
    cobalt
  );
  leaf.position.set(x, y, z);
  leaf.scale.set(0.32, 0.9, 0.16);
  leaf.rotation.z = angle;
  leaf.castShadow = true;
  teapot.add(leaf);
}

addLeaf(-0.95, 1.45, -0.8, 0.8);
addLeaf(-0.78, 1.25, 0.55, 0.75);
addLeaf(0.02, 1.82, 0.9, 0.65);
addLeaf(0.25, 1.15, -0.7, 0.65);
addLeaf(0.95, 1.78, 0.5, 0.45);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(8, 96),
  new THREE.MeshStandardMaterial({ color: 0xcbd7dc, roughness: 0.82 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0.28;
ground.receiveShadow = true;
scene.add(ground);

scene.add(new THREE.HemisphereLight(0xf4f8ff, 0x78909c, 2.2));

const key = new THREE.DirectionalLight(0xffffff, 4.2);
key.position.set(-4, 7, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 6;
key.shadow.camera.bottom = -2;
key.shadow.bias = -0.0005;
scene.add(key);

const rim = new THREE.DirectionalLight(0x9fc8ff, 2.2);
rim.position.set(4, 4, -5);
scene.add(rim);

const fill = new THREE.PointLight(0xffffff, 1.3, 8);
fill.position.set(0, 4, 4);
scene.add(fill);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
