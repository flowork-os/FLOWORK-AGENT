function makeFabricTexture(base, fleck, seed) {
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const context = canvas.getContext('2d');
  context.fillStyle = base;
  context.fillRect(0, 0, size, size);

  let state = seed >>> 0;
  const random = () => {
    state = (state * 1664525 + 1013904223) >>> 0;
    return state / 4294967296;
  };

  for (let i = 0; i < 12500; i++) {
    const x = random() * size;
    const y = random() * size;
    const length = 0.5 + random() * 2.8;
    context.globalAlpha = 0.025 + random() * 0.12;
    context.strokeStyle = random() > 0.45 ? fleck : '#ffffff';
    context.lineWidth = 0.3 + random() * 0.8;
    context.beginPath();
    context.moveTo(x, y);
    context.lineTo(x + (random() - 0.5) * length, y + (random() - 0.5) * length);
    context.stroke();
  }

  context.globalAlpha = 1;
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(3, 3);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return texture;
}

    ...extra
  });
}

function prepare(mesh) {
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function tube(points, radius, material, segments = 40, radial = 7) {
  const curve = new THREE.CatmullRomCurve3(points);
  return prepare(new THREE.Mesh(new THREE.TubeGeometry(curve, segments, radius, radial, false), material));
}

function capsuleBetween(a, b, radius, material, capSegments = 8) {
  const distance = a.distanceTo(b);
  const geometry = new THREE.CapsuleGeometry(radius, Math.max(0.01, distance - radius * 2), capSegments, 16);
  const mesh = prepare(new THREE.Mesh(geometry, material));
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
  return mesh;
}

function cylinderBetween(a, b, radiusTop, radiusBottom, material, radial = 14) {
  const direction = b.clone().sub(a);
  const mesh = prepare(new THREE.Mesh(
    new THREE.CylinderGeometry(radiusTop, radiusBottom, direction.length(), radial, 1, false),
    material
  ));
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  return mesh;
}

function makeStarGeometry(outer = 1, inner = 0.45, depth = 0.08) {
  const shape = new THREE.Shape();
  for (let i = 0; i < 10; i++) {
    const angle = Math.PI / 2 + i * Math.PI / 5;
    const radius = i % 2 === 0 ? outer : inner;
    const x = Math.cos(angle) * radius;
    const y = Math.sin(angle) * radius;
    if (i === 0) shape.moveTo(x, y);
    else shape.lineTo(x, y);
  }
  shape.closePath();
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth,
    bevelEnabled: true,
    bevelSegments: 2,
    steps: 1,
    bevelSize: depth * 0.42,
    bevelThickness: depth * 0.35
  });
  geometry.center();
  return geometry;
}

function addStar(parent, position, scale, rotation = 0, material = goldMaterial) {
  const star = prepare(new THREE.Mesh(makeStarGeometry(1, 0.45, 0.1), material));
  star.position.copy(position);
  star.scale.setScalar(scale);
  star.rotation.z = rotation;
  parent.add(star);
  return star;
}

function addStitchLine(parent, points, colorMaterial, count = 14, dashLength = 0.12, radius = 0.018) {
  const curve = new THREE.CatmullRomCurve3(points);
  for (let i = 0; i < count; i++) {
    const t = (i + 0.5) / count;
    const center = curve.getPoint(t);
    const tangent = curve.getTangent(t).normalize();
    const start = center.clone().addScaledVector(tangent, -dashLength * 0.5);
    const end = center.clone().addScaledVector(tangent, dashLength * 0.5);
    parent.add(capsuleBetween(start, end, radius, colorMaterial, 4));
  }
}

function bentConeGeometry() {
  const rings = 15;
  const sides = 40;
  const positions = [];
  const indices = [];

  for (let j = 0; j <= rings; j++) {
    const t = j / rings;
    const y = t * 2.85;
    const centerX = -0.17 * t * t;
    const centerZ = 0.12 * t + 0.7 * Math.pow(t, 2.7);
    const radius = Math.max(0.018, 0.92 * Math.pow(1 - t, 0.78));
    for (let i = 0; i < sides; i++) {
      const angle = i / sides * Math.PI * 2;
      const squash = 1 - 0.12 * t;
      positions.push(
        centerX + Math.cos(angle) * radius,
        y,
        centerZ + Math.sin(angle) * radius * squash
      );
    }
  }

  for (let j = 0; j < rings; j++) {
    for (let i = 0; i < sides; i++) {
      const next = (i + 1) % sides;
      const a = j * sides + i;
      const b = j * sides + next;
      const c = (j + 1) * sides + next;
      const d = (j + 1) * sides + i;
      indices.push(a, b, d, b, c, d);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

  wizard.position.y = Math.sin(elapsed * 1.25) * 0.025;
  wandStar.rotation.z = 0.18 + Math.sin(elapsed * 1.7) * 0.035;
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
