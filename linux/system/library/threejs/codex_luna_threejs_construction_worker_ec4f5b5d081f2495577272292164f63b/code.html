<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Construction Worker</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #9fb5c1;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .caption {
      position: fixed;
      left: 24px;
      bottom: 20px;
      color: rgba(255,255,255,.88);
      font: 600 12px/1.4 Arial, sans-serif;
      letter-spacing: .16em;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 2px 6px rgba(0,0,0,.4);
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="caption">Site safety · Ready for work</div>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9fb4bf);
    scene.fog = new THREE.Fog(0x9fb4bf, 12, 28);

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(5.9, 3.7, 8.2);
    camera.lookAt(0, 2.8, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.2;
    controls.target.set(0, 2.75, 0);
    controls.minDistance = 5;
    controls.maxDistance = 13;
    controls.maxPolarAngle = Math.PI * 0.49;

    const hemi = new THREE.HemisphereLight(0xdceeff, 0x4a4038, 2.1);
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0xfff0d5, 4.2);
    key.position.set(-5, 9, 6);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -6;
    key.shadow.camera.right = 6;
    key.shadow.camera.top = 10;
    key.shadow.camera.bottom = -2;
    key.shadow.bias = -0.00025;
    scene.add(key);

    const fill = new THREE.DirectionalLight(0x9cc8ff, 1.25);
    fill.position.set(5, 5, -4);
    scene.add(fill);

    const warm = new THREE.PointLight(0xffb36b, 1.1, 10);
    warm.position.set(-3, 3, 3);
    scene.add(warm);

    const mat = {
      skin: new THREE.MeshStandardMaterial({ color: 0xb97858, roughness: 0.82 }),
      skinLight: new THREE.MeshStandardMaterial({ color: 0xc98969, roughness: 0.8 }),
      shirt: new THREE.MeshStandardMaterial({ color: 0x31506a, roughness: 0.78 }),
      shirtDark: new THREE.MeshStandardMaterial({ color: 0x20394e, roughness: 0.82 }),
      vest: new THREE.MeshStandardMaterial({ color: 0xf28b16, roughness: 0.64 }),
      vestBright: new THREE.MeshStandardMaterial({ color: 0xffb51b, roughness: 0.58 }),
      reflective: new THREE.MeshStandardMaterial({
        color: 0xe8eee5,
        roughness: 0.32,
        metalness: 0.08,
        emissive: 0x333d32,
        emissiveIntensity: 0.12
      }),
      pants: new THREE.MeshStandardMaterial({ color: 0x394758, roughness: 0.9 }),
      pantsLight: new THREE.MeshStandardMaterial({ color: 0x4d5b68, roughness: 0.88 }),
      boot: new THREE.MeshStandardMaterial({ color: 0x202429, roughness: 0.7, metalness: 0.15 }),
      sole: new THREE.MeshStandardMaterial({ color: 0x111416, roughness: 0.92 }),
      steel: new THREE.MeshStandardMaterial({ color: 0xaeb6b9, roughness: 0.33, metalness: 0.72 }),
      hat: new THREE.MeshStandardMaterial({ color: 0xf2b51b, roughness: 0.5 }),
      hatDark: new THREE.MeshStandardMaterial({ color: 0xc88d0c, roughness: 0.58 }),
      glass: new THREE.MeshStandardMaterial({ color: 0x88bed0, roughness: 0.16, metalness: 0.18, transparent: true, opacity: 0.72 }),
      black: new THREE.MeshStandardMaterial({ color: 0x14191c, roughness: 0.6 }),
      badge: new THREE.MeshStandardMaterial({ color: 0x234967, roughness: 0.45, metalness: 0.2 })
    };

    function mesh(geometry, material, position, scale, rotation) {
      const object = new THREE.Mesh(geometry, material);
      if (position) object.position.set(position[0], position[1], position[2]);
      if (scale) object.scale.set(scale[0], scale[1], scale[2]);
      if (rotation) object.rotation.set(rotation[0], rotation[1], rotation[2]);
      object.castShadow = true;
      object.receiveShadow = true;
      return object;
    }

    function box(material, size, position, rotation) {
      return mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), material, position, null, rotation);
    }

    function cylinder(material, radiusTop, radiusBottom, height, position, radialSegments = 32, rotation) {
      return mesh(new THREE.CylinderGeometry(radiusTop, radiusBottom, height, radialSegments), material, position, null, rotation);
    }

    function sphere(material, radius, position, scale) {
      return mesh(new THREE.SphereGeometry(radius, 32, 20), material, position, scale);
    }

    function limb(material, radius, length, position, rotation) {
      return cylinder(material, radius, radius * 1.08, length, position, 24, rotation);
    }

    const worker = new THREE.Group();
    worker.position.y = 0.05;
    scene.add(worker);

    const feetZ = 0.02;

    const leftBoot = new THREE.Group();
    leftBoot.position.set(-0.34, 0.22, 0.08);
    leftBoot.rotation.y = -0.035;
    leftBoot.add(mesh(new THREE.BoxGeometry(0.58, 0.4, 0.92), mat.boot, [0, 0, 0.08], [1, 1, 1], [0, 0, 0]));
    leftBoot.add(mesh(new THREE.BoxGeometry(0.61, 0.11, 0.98), mat.sole, [0, -0.22, 0.08]));
    leftBoot.add(mesh(new THREE.BoxGeometry(0.42, 0.2, 0.12), mat.steel, [0, 0.02, 0.51]));
    worker.add(leftBoot);

    const rightBoot = leftBoot.clone();
    rightBoot.position.x = 0.34;
    rightBoot.rotation.y = 0.035;
    worker.add(rightBoot);

    worker.add(limb(mat.pants, 0.24, 1.55, [-0.34, 1.05, 0], [0.015, 0, -0.018]));
    worker.add(limb(mat.pants, 0.24, 1.55, [0.34, 1.05, 0], [-0.01, 0, 0.018]));
    worker.add(sphere(mat.pantsLight, 0.34, [0, 1.75, 0], [1.25, 0.85, 0.9]));

    const torso = new THREE.Group();
    torso.position.set(0, 2.65, 0);
    torso.add(mesh(new THREE.CylinderGeometry(0.57, 0.7, 1.55, 8), mat.shirt, [0, 0, 0], [1, 1, 0.7], [0, 0, 0]));
    torso.add(box(mat.shirtDark, [0.12, 1.23, 0.06], [0, 0, 0.44]));
    torso.add(box(mat.vestBright, [1.13, 1.42, 0.16], [-0.44, 0.01, 0.18], [0, 0, -0.025]));
    torso.add(box(mat.vestBright, [1.13, 1.42, 0.16], [0.44, 0.01, 0.18], [0, 0, 0.025]));
    torso.add(box(mat.reflective, [0.14, 1.3, 0.18], [-0.42, 0.02, 0.29], [0, 0, -0.025]));
    torso.add(box(mat.reflective, [0.14, 1.3, 0.18], [0.42, 0.02, 0.29], [0, 0, 0.025]));
    torso.add(box(mat.reflective, [0.98, 0.14, 0.18], [0, -0.38, 0.47]));
    torso.add(box(mat.badge, [0.26, 0.31, 0.025], [0.19, 0.22, 0.55]));
    worker.add(torso);

    const shoulderY = 3.15;
    worker.add(limb(mat.shirt, 0.25, 0.74, [-0.82, shoulderY - 0.16, 0], [0, 0, -0.12]));
    worker.add(limb(mat.shirt, 0.25, 0.74, [0.82, shoulderY - 0.16, 0], [0, 0, 0.12]));
    worker.add(limb(mat.skin, 0.18, 0.9, [-1.05, 2.45, 0], [0, 0, -0.07]));
    worker.add(limb(mat.skin, 0.18, 0.9, [1.05, 2.45, 0], [0, 0, 0.07]));
    worker.add(sphere(mat.skinLight, 0.2, [-1.1, 1.98, 0.03], [1, 0.8, 0.85]));
    worker.add(sphere(mat.skinLight, 0.2, [1.1, 1.98, 0.03], [1, 0.8, 0.85]));
    worker.add(box(mat.reflective, [0.18, 0.12, 0.2], [-0.93, 2.75, 0.1], [0, 0, -0.12]));
    worker.add(box(mat.reflective, [0.18, 0.12, 0.2], [0.93, 2.75, 0.1], [0, 0, 0.12]));

    worker.add(cylinder(mat.skin, 0.2, 0.22, 0.32, [0, 3.55, 0], 24));
    worker.add(sphere(mat.skinLight, 0.47, [0, 3.98, 0], [0.9, 1.08, 0.88]));
    worker.add(sphere(mat.skin, 0.055, [-0.2, 4.08, 0.405], [1, 1, 0.5]));
    worker.add(sphere(mat.skin, 0.055, [0.2, 4.08, 0.405], [1, 1, 0.5]));
    worker.add(box(mat.black, [0.1, 0.065, 0.035], [-0.16, 4.1, 0.405]));
    worker.add(box(mat.black, [0.1, 0.065, 0.035], [0.16, 4.1, 0.405]));
    worker.add(box(mat.black, [0.29, 0.025, 0.025], [0, 4.105, 0.407]));
    worker.add(sphere(mat.skin, 0.055, [0, 3.89, 0.425], [0.75, 1, 0.65]));
    worker.add(box(mat.skin, [0.18, 0.05, 0.035], [0, 3.75, 0.41]));

    const hat = new THREE.Group();
    hat.position.set(0, 4.45, 0);
    hat.add(sphere(mat.hat, 0.59, [0, 0, 0], [1, 0.68, 0.88]));
    hat.add(cylinder(mat.hat, 0.72, 0.72, 0.09, [0, -0.22, 0], 40));
    hat.add(box(mat.hatDark, [0.12, 0.65, 0.08], [0, -0.02, 0.5]));
    hat.add(box(mat.hatDark, [0.1, 0.65, 0.08], [0, -0.02, -0.5]));
    worker.add(hat);

    worker.add(cylinder(mat.black, 0.045, 0.045, 0.5, [-0.61, 4.13, 0], 16, [0, 0, Math.PI / 2]));
    worker.add(cylinder(mat.black, 0.045, 0.045, 0.5, [0.61, 4.13, 0], 16, [0, 0, Math.PI / 2]));
    worker.add(sphere(mat.black, 0.12, [-0.59, 4.08, 0]));
    worker.add(sphere(mat.black, 0.12, [0.59, 4.08, 0]));

    const ground = mesh(new THREE.CylinderGeometry(4.9, 5.1, 0.28, 64), new THREE.MeshStandardMaterial({ color: 0x59636a, roughness: 0.86 }), [0, -0.28, 0]);
    ground.receiveShadow = true;
    scene.add(ground);

    const platformTop = mesh(new THREE.CylinderGeometry(3.3, 3.3, 0.08, 64), new THREE.MeshStandardMaterial({ color: 0x7d8587, roughness: 0.94 }), [0, -0.1, 0]);
    platformTop.receiveShadow = true;
    scene.add(platformTop);

    const stripe = mesh(new THREE.TorusGeometry(3.12, 0.035, 10, 96), mat.reflective, [0, -0.04, 0]);
    stripe.rotation.x = Math.PI / 2;
    scene.add(stripe);

    const backWall = box(new THREE.MeshStandardMaterial({ color: 0x71848d, roughness: 1 }), [24, 12, 0.3], [0, 5, -4.8]);
    backWall.receiveShadow = true;
    scene.add(backWall);

    const beam = box(new THREE.MeshStandardMaterial({ color: 0x4f5e64, roughness: 0.92 }), [10, 0.18, 0.24], [0, 5.75, -4.55]);
    beam.castShadow = true;
    scene.add(beam);

    const smallLight = new THREE.PointLight(0xffd28c, 0.7, 5);
    smallLight.position.set(-2, 4.5, 2);
    scene.add(smallLight);

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", onResize);

    const clock = new THREE.Clock();

    function animate() {
      const elapsed = clock.getElapsedTime();
      worker.position.y = 0.05 + Math.sin(elapsed * 1.4) * 0.008;
      controls.update();
      renderer.render(scene, camera);
    }

    renderer.setAnimationLoop(animate);
  </script>
</body>
</html>
