<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marble Griffin — Procedural three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111318; }
  #app { position: fixed; inset: 0; }
  .caption {
    position: fixed; left: 0; right: 0; bottom: 14px;
    text-align: center; color: #b9bcc6; font: 13px/1.4 "Georgia", serif;
    letter-spacing: 0.06em; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.6);
    opacity: .82;
  }
  .caption small { display:block; font-size:11px; letter-spacing:.12em; color:#7d818c; margin-top:3px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="caption">MARBLE GRIFFIN — sejant, carved in veined white marble<small>drag to orbit · scroll to zoom</small></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------------------------------------------------------------------
   Renderer
--------------------------------------------------------------------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('app').appendChild(renderer.domElement);

/* ---------------------------------------------------------------------------
   Scene, background, environment
--------------------------------------------------------------------------- */
const scene = new THREE.Scene();

// Neutral dark studio backdrop (soft radial gradient)
scene.background = (function () {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(256, 210, 40, 256, 300, 520);
  g.addColorStop(0, '#2b2e36');
  g.addColorStop(0.55, '#191b21');
  g.addColorStop(1, '#0c0d11');
  x.fillStyle = g; x.fillRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
scene.fog = new THREE.Fog(0x14161b, 9, 20);

// Subtle real-time environment for polished-stone reflections
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.05).texture;

/* ---------------------------------------------------------------------------
   Camera + Controls
--------------------------------------------------------------------------- */
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(2.7, 1.55, 3.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.target.set(0, 1.0, 0);
controls.minDistance = 2.4;
controls.maxDistance = 9;
controls.maxPolarAngle = Math.PI * 0.52;

/* ---------------------------------------------------------------------------
   Lighting : hemisphere + key + fill + rim
--------------------------------------------------------------------------- */
const hemi = new THREE.HemisphereLight(0xbcc4d6, 0x2a2620, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff3e2, 2.5);
key.position.set(4.2, 6.2, 4.8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 22;
key.shadow.camera.left = -3.2;
key.shadow.camera.right = 3.2;
key.shadow.camera.top = 3.6;
key.shadow.camera.bottom = -1.2;
key.shadow.bias = -0.0002;
key.shadow.normalBias = 0.02;
key.shadow.radius = 5;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9fb2e8, 0.7);
fill.position.set(-5, 3, 2.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffe9ef, 1.6);
rim.position.set(-2.5, 4.5, -6);
scene.add(rim);

const faceGlow = new THREE.PointLight(0xfff0e0, 6, 6, 2);
faceGlow.position.set(1.2, 2.2, 2.4);
scene.add(faceGlow);

/* ---------------------------------------------------------------------------
   Procedural marble textures (veining colour map + chisel tool-mark bump)
--------------------------------------------------------------------------- */
function makeMarbleColor(size) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d');
  x.fillStyle = '#ecebe3'; x.fillRect(0, 0, size, size);

  // soft tonal clouds
  for (let i = 0; i < 70; i++) {
    const r = size * (0.05 + Math.random() * 0.28);
    const gx = Math.random() * size, gy = Math.random() * size;
    const g = x.createRadialGradient(gx, gy, 0, gx, gy, r);
    const light = Math.random() < 0.5;
    const tone = light ? '245,243,236' : '221,218,208';
    g.addColorStop(0, `rgba(${tone},${(0.05 + Math.random() * 0.08).toFixed(3)})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g;
    x.beginPath(); x.arc(gx, gy, r, 0, Math.PI * 2); x.fill();
  }

  // recursive turbulent grey veins
  function vein(sx, sy, ang, steps, w, alpha) {
    x.beginPath(); x.moveTo(sx, sy);
    let px = sx, py = sy, a = ang;
    const step = size * 0.012;
    for (let s = 0; s < steps; s++) {
      a += (Math.random() - 0.5) * 0.55;
      px += Math.cos(a) * step;
      py += Math.sin(a) * step;
      x.lineTo(px, py);
      if (steps > 10 && Math.random() < 0.035) {
        vein(px, py, a + (Math.random() - 0.5) * 1.3, (steps * 0.4) | 0, w * 0.6, alpha * 0.7);
      }
    }
    x.strokeStyle = `rgba(96,98,104,${alpha})`;
    x.lineWidth = w; x.lineJoin = 'round'; x.lineCap = 'round';
    x.stroke();
  }
  for (let i = 0; i < 15; i++)
    vein(Math.random() * size, Math.random() * size, Math.random() * 7, 55 + Math.random() * 70, 0.6 + Math.random() * 1.7, 0.11 + Math.random() * 0.13);
  for (let i = 0; i < 45; i++)
    vein(Math.random() * size, Math.random() * size, Math.random() * 7, 18 + Math.random() * 28, 0.35 + Math.random() * 0.5, 0.04 + Math.random() * 0.06);

  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

function makeToolBump(size) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d');
  x.fillStyle = '#808080'; x.fillRect(0, 0, size, size);
  // fine chisel strokes in drifting clusters -> "sculptor's tool marks"
  for (let cl = 0; cl < 60; cl++) {
    const cx = Math.random() * size, cy = Math.random() * size;
    const baseAng = Math.random() * Math.PI;
    for (let i = 0; i < 48; i++) {
      const gx = cx + (Math.random() - 0.5) * size * 0.16;
      const gy = cy + (Math.random() - 0.5) * size * 0.16;
      const ang = baseAng + (Math.random() - 0.5) * 0.5;
      const len = 4 + Math.random() * 15;
      x.strokeStyle = Math.random() < 0.5 ? 'rgba(255,255,255,0.11)' : 'rgba(0,0,0,0.11)';
      x.lineWidth = 0.7 + Math.random() * 1.1;
      x.beginPath();
      x.moveTo(gx, gy);
      x.lineTo(gx + Math.cos(ang) * len, gy + Math.sin(ang) * len);
      x.stroke();
    }
  }
  // micro speckle
  for (let i = 0; i < 9000; i++) {
    x.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
    x.fillRect(Math.random() * size, Math.random() * size, 1, 1);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(2, 2);
  return t;
}

const marbleColor = makeMarbleColor(1024);
const toolBump = makeToolBump(512);

const marble = new THREE.MeshPhysicalMaterial({
  map: marbleColor, bumpMap: toolBump, bumpScale: 0.006,
  color: 0xffffff, roughness: 0.36, metalness: 0.0,
  clearcoat: 0.55, clearcoatRoughness: 0.38, envMapIntensity: 0.55,
});

const stoneDark = new THREE.MeshPhysicalMaterial({
  map: marbleColor, bumpMap: toolBump, bumpScale: 0.006,
  color: 0x565a61, roughness: 0.28, metalness: 0.0,
  clearcoat: 0.6, clearcoatRoughness: 0.3, envMapIntensity: 0.8,
});

const plinthMat = new THREE.MeshPhysicalMaterial({
  map: marbleColor, bumpMap: toolBump, bumpScale: 0.012,
  color: 0xdcd8cd, roughness: 0.55, metalness: 0.0,
  clearcoat: 0.18, clearcoatRoughness: 0.6, envMapIntensity: 0.4,
});

/* ---------------------------------------------------------------------------
   Shared geometry
--------------------------------------------------------------------------- */
const SPH = new THREE.SphereGeometry(1, 48, 32);

// carved feather (leaf shape, bevelled -> crisp sculpted edge). Tip at +Y.
const featherGeo = (function () {
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.bezierCurveTo(0.17, 0.10, 0.15, 0.68, 0.0, 1.0);
  s.bezierCurveTo(-0.15, 0.68, -0.17, 0.10, 0.0, 0.0);
  const g = new THREE.ExtrudeGeometry(s, {
    depth: 0.05, bevelEnabled: true, bevelThickness: 0.02,
    bevelSize: 0.025, bevelSegments: 2, steps: 1,
  });
  g.translate(0, 0, -0.03);
  return g;
})();

// claw : cone, tip along +Z
const clawGeo = (function () {
  const g = new THREE.ConeGeometry(0.032, 0.14, 12);
  g.rotateX(Math.PI / 2);
  g.translate(0, 0, 0.07);
  return g;
})();

/* helpers */
function m(geo, mat, px, py, pz) {
  const o = new THREE.Mesh(geo, mat);
  o.position.set(px || 0, py || 0, pz || 0);
  o.castShadow = true; o.receiveShadow = true;
  return o;
}
function feather(mat, px, py, pz, rx, ry, rz, len, wide) {
  const f = new THREE.Mesh(featherGeo, mat);
  f.position.set(px, py, pz);
  f.rotation.set(rx || 0, ry || 0, rz || 0);
  f.scale.set(len * (wide || 0.55), len, len * (wide || 0.55));
  f.castShadow = true; f.receiveShadow = true;
  return f;
}

/* ---------------------------------------------------------------------------
   Build the griffin  (feet rest at local y = 0, faces +Z)
--------------------------------------------------------------------------- */
const griffin = new THREE.Group();

/* --- Lion body core (blended spheres) --- */
function scaled(px, py, pz, sx, sy, sz, mat) {
  const o = m(SPH, mat || marble, px, py, pz);
  o.scale.set(sx, sy, sz);
  return o;
}
griffin.add(scaled(0, 0.52, -0.32, 0.58, 0.54, 0.55));   // rump
griffin.add(scaled(0, 0.52, 0.02, 0.52, 0.52, 0.58));    // belly
griffin.add(scaled(0, 0.86, 0.30, 0.52, 0.58, 0.48));    // chest
griffin.add(scaled(0, 0.70, 0.00, 0.55, 0.60, 0.58));    // back saddle

/* --- Rear haunches, hind legs & paws (seated) --- */
for (const side of [-1, 1]) {
  griffin.add(scaled(side * 0.5, 0.52, -0.06, 0.35, 0.44, 0.56)); // thigh
  const shin = scaled(side * 0.45, 0.10, 0.20, 0.17, 0.14, 0.42); // lower leg forward
  griffin.add(shin);
  const paw = scaled(side * 0.44, 0.07, 0.47, 0.19, 0.12, 0.22);  // hind paw
  griffin.add(paw);
  for (let t = -1; t <= 1; t++) {
    const claw = m(clawGeo, stoneDark, side * 0.44 + t * 0.085, 0.045, 0.62);
    claw.rotation.x = 0.55;
    claw.scale.setScalar(0.8);
    griffin.add(claw);
  }
}

/* --- Shoulders + front legs + clawed forepaws --- */
for (const side of [-1, 1]) {
  griffin.add(scaled(side * 0.42, 0.90, 0.28, 0.23, 0.27, 0.30)); // shoulder

  const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.12, 0.9, 22), marble);
  leg.position.set(side * 0.29, 0.48, 0.52);
  leg.rotation.x = -0.14;
  leg.castShadow = true; leg.receiveShadow = true;
  griffin.add(leg);

  // paw pad
  const pad = scaled(side * 0.29, 0.06, 0.66, 0.20, 0.12, 0.26);
  griffin.add(pad);
  // toes + claws
  for (let t = -1; t <= 1; t++) {
    griffin.add(scaled(side * 0.29 + t * 0.10, 0.055, 0.80, 0.07, 0.065, 0.10));
    const claw = m(clawGeo, stoneDark, side * 0.29 + t * 0.10, 0.045, 0.88);
    claw.rotation.x = 0.62;
    griffin.add(claw);
  }
}

/* --- Feathered eagle neck (tube core + hackle ruff) --- */
const neckCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 1.02, 0.30),
  new THREE.Vector3(0, 1.22, 0.42),
  new THREE.Vector3(0, 1.42, 0.47),
  new THREE.Vector3(0, 1.54, 0.50),
]);
const neckCore = new THREE.Mesh(new THREE.TubeGeometry(neckCurve, 26, 0.145, 18, false), marble);
neckCore.castShadow = true; neckCore.receiveShadow = true;
griffin.add(neckCore);

// ruff of small overlapping feathers around lower/mid neck (bib)
for (let ring = 0; ring < 3; ring++) {
  const u = 0.12 + ring * 0.26;
  const p = neckCurve.getPoint(u);
  const rad = 0.17 - ring * 0.02;
  const size = 0.16 - ring * 0.02;
  for (let i = 0; i < 11; i++) {
    const ang = -1.45 + (i / 10) * 2.9; // front-facing bib
    const fx = p.x + Math.sin(ang) * rad;
    const fz = p.z + Math.cos(ang) * rad * 0.9;
    const f = feather(marble, fx, p.y + 0.02, fz, Math.PI * 1.02, ang, 0, size, 0.6);
    f.rotation.order = 'YXZ';
    griffin.add(f);
  }
}

/* --- Eagle head --- */
const head = new THREE.Group();
head.position.set(0, 1.62, 0.52);
head.rotation.x = -0.05;
griffin.add(head);

const skull = m(SPH, marble, 0, 0, 0); skull.scale.set(0.20, 0.22, 0.24); head.add(skull);

// upper beak (hooked)
const upperBeak = new THREE.Mesh(new THREE.ConeGeometry(0.095, 0.30, 16), marble);
upperBeak.geometry.rotateX(Math.PI / 2);
upperBeak.position.set(0, 0.0, 0.20);
upperBeak.castShadow = true;
head.add(upperBeak);
const hook = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.13, 14), marble);
hook.geometry.rotateX(Math.PI * 0.5);
hook.position.set(0, -0.05, 0.33);
hook.rotation.x = 1.15; // curl down
hook.castShadow = true;
head.add(hook);
// lower beak
const lowerBeak = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.22, 14), marble);
lowerBeak.geometry.rotateX(Math.PI / 2);
lowerBeak.position.set(0, -0.06, 0.17);
lowerBeak.castShadow = true;
head.add(lowerBeak);

// eyes + fierce brow ridges
for (const side of [-1, 1]) {
  const eye = m(SPH, stoneDark, side * 0.10, 0.03, 0.13);
  eye.scale.setScalar(0.045); head.add(eye);
  const brow = m(SPH, marble, side * 0.11, 0.09, 0.11);
  brow.scale.set(0.10, 0.045, 0.09);
  brow.rotation.z = -side * 0.5;
  head.add(brow);
}

// crown / ear tufts (feathers pointing up & back)
for (const side of [-1, 1]) {
  for (let i = 0; i < 3; i++) {
    const f = feather(marble, side * (0.05 + i * 0.02), 0.14, -0.02 - i * 0.03,
      -0.7 - i * 0.12, side * 0.25, side * 0.15, 0.16 - i * 0.02, 0.5);
    head.add(f);
  }
}
// nape feathers running down the back of the head
for (let i = 0; i < 5; i++) {
  const f = feather(marble, 0, 0.10 - i * 0.05, -0.12 - i * 0.02, -2.4, 0, 0, 0.13, 0.55);
  head.add(f);
}

/* --- Folded feathered wings along each flank --- */
function buildWing(side) {
  const wing = new THREE.Group();
  // solid wing mass (folded shell) hugging the body side
  const shell = scaled(side * 0.52, 0.78, -0.10, 0.17, 0.5, 0.6);
  shell.rotation.y = side * 0.22;
  wing.add(shell);

  const rows = [
    { n: 6, len: 0.30, y: 1.06, ro: 0.00 },  // upper coverts
    { n: 7, len: 0.46, y: 0.92, ro: 0.02 },  // secondaries
    { n: 8, len: 0.66, y: 0.78, ro: 0.05 },  // long primaries (drape lowest)
  ];
  rows.forEach((row, ri) => {
    for (let i = 0; i < row.n; i++) {
      const t = i / (row.n - 1);                 // 0 front(+z) .. 1 back(-z)
      const bell = Math.sin(t * Math.PI);
      const z = 0.30 - t * 0.82;
      const x = side * (0.5 + row.ro + bell * 0.05);
      const y = row.y - bell * 0.04;
      const len = row.len * (0.82 + 0.32 * bell);
      const f = feather(marble, x, y, z, 0, 0, 0, len, 0.5);
      f.rotation.order = 'ZYX';
      f.rotation.z = side * 0.28;                 // splay outward
      f.rotation.x = -2.5 - t * 0.5 - ri * 0.05;  // tip down & swept back
      f.rotation.y = side * 0.12;
      wing.add(f);
    }
  });
  return wing;
}
griffin.add(buildWing(1));
griffin.add(buildWing(-1));

/* --- Lion tail curling to one side, tufted tip --- */
const tailCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0.0, 0.55, -0.52),
  new THREE.Vector3(0.12, 0.38, -0.78),
  new THREE.Vector3(0.38, 0.20, -0.82),
  new THREE.Vector3(0.56, 0.28, -0.56),
  new THREE.Vector3(0.58, 0.50, -0.36),
]);
const tail = new THREE.Mesh(new THREE.TubeGeometry(tailCurve, 40, 0.055, 12, false), marble);
tail.castShadow = true; tail.receiveShadow = true;
griffin.add(tail);
// tuft
const tip = tailCurve.getPoint(1);
for (let i = 0; i < 7; i++) {
  const a = (i / 7) * Math.PI * 2;
  const f = feather(marble, tip.x + Math.cos(a) * 0.02, tip.y, tip.z + Math.sin(a) * 0.02,
    -0.4 + Math.cos(a) * 0.6, a, Math.sin(a) * 0.6, 0.17, 0.45);
  griffin.add(f);
}

/* ---------------------------------------------------------------------------
   Plinth (carved base) + assemble sculpture
--------------------------------------------------------------------------- */
const sculpture = new THREE.Group();

const plinthBase = new THREE.Mesh(new THREE.CylinderGeometry(1.18, 1.28, 0.18, 56), plinthMat);
plinthBase.position.y = 0.09;
plinthBase.castShadow = true; plinthBase.receiveShadow = true;
sculpture.add(plinthBase);

const plinthTop = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.12, 0.12, 56), plinthMat);
plinthTop.position.y = 0.24;
plinthTop.castShadow = true; plinthTop.receiveShadow = true;
sculpture.add(plinthTop);

griffin.position.y = 0.30; // seat the griffin on the plinth top
sculpture.add(griffin);

sculpture.position.y = 0.0;
scene.add(sculpture);

/* ---------------------------------------------------------------------------
   Shadow-catching ground plane (invisible except for shadows)
--------------------------------------------------------------------------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.ShadowMaterial({ opacity: 0.38 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0.0;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------------------------------------------------------------------
   Resize + render loop
--------------------------------------------------------------------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
