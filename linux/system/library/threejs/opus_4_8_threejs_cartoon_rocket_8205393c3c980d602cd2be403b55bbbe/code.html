<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cartoon Rocket Ship</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14161c; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  .hint {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 12px; letter-spacing: .04em; color: #9aa3b2; opacity: .65;
    user-select: none; pointer-events: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="hint">drag to orbit &middot; scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------------------------------------------------------------------
   Renderer
--------------------------------------------------------------------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

/* ---------------------------------------------------------------------------
   Scene & camera
--------------------------------------------------------------------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161c);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(6.2, 3.4, 8.2);

// subtle studio reflections for the glossy paint
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ---------------------------------------------------------------------------
   Lighting: hemisphere fill + directional key + rim
--------------------------------------------------------------------------- */
const hemi = new THREE.HemisphereLight(0xbcd0ff, 0x2a2416, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2e0, 2.4);
key.position.set(5.5, 8.5, 6.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 30;
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 6;
key.shadow.camera.bottom = -3;
key.shadow.bias = -0.0004;
key.shadow.radius = 4;
key.target.position.set(0, 1.6, 0);
scene.add(key);
scene.add(key.target);

const fill = new THREE.DirectionalLight(0x88a4ff, 0.5);
fill.position.set(-6, 3, 3);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd9a8, 1.2);
rim.position.set(-4, 5.5, -6);
scene.add(rim);

/* ---------------------------------------------------------------------------
   Ground plane (shadow only)
--------------------------------------------------------------------------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.56;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------------------------------------------------------------------
   Material helpers
--------------------------------------------------------------------------- */
function paint(color) {
  return new THREE.MeshPhysicalMaterial({
    color, roughness: 0.34, metalness: 0.0,
    clearcoat: 1.0, clearcoatRoughness: 0.16, envMapIntensity: 0.9
  });
}
const matRed   = paint(0xe4382f);
const matWhite = paint(0xf3efe6);
const matGold  = new THREE.MeshStandardMaterial({ color: 0xf6c454, metalness: 1.0, roughness: 0.28, envMapIntensity: 1.1 });
const matMetal = new THREE.MeshStandardMaterial({ color: 0x474c56, metalness: 0.9, roughness: 0.38, envMapIntensity: 1.0 });
const matGlass = new THREE.MeshPhysicalMaterial({
  color: 0x37a6d8, roughness: 0.06, metalness: 0.0,
  clearcoat: 1.0, clearcoatRoughness: 0.04, envMapIntensity: 1.3,
  emissive: 0x0b3a56, emissiveIntensity: 0.3
});

/* ---------------------------------------------------------------------------
   Lathe helper (smooth via Catmull-Rom)
--------------------------------------------------------------------------- */
function latheGeom(ctrl, segments = 96, res = 130) {
  const pts3 = ctrl.map(p => new THREE.Vector3(p[0], p[1], 0));
  const curve = new THREE.CatmullRomCurve3(pts3, false, 'catmullrom', 0.5);
  const pts = curve.getPoints(res).map(p => new THREE.Vector2(Math.max(0.0001, p.x), p.y));
  return new THREE.LatheGeometry(pts, segments);
}
function addSolid(parent, geom, mat) {
  const m = new THREE.Mesh(geom, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

/* ---------------------------------------------------------------------------
   Build the rocket
--------------------------------------------------------------------------- */
const rocket = new THREE.Group();

// lower body (red)
addSolid(rocket, latheGeom([
  [0.00, -0.05], [0.50, -0.02], [0.72, 0.06], [0.90, 0.30],
  [0.99, 0.65], [1.00, 1.05], [1.00, 1.25]
]), matRed);

// upper body (white)
addSolid(rocket, latheGeom([
  [1.00, 1.15], [1.00, 1.70], [0.97, 2.20],
  [0.90, 2.60], [0.78, 2.90], [0.72, 3.05]
]), matWhite);

// nose cone (red, pointed)
addSolid(rocket, latheGeom([
  [0.74, 2.95], [0.70, 3.15], [0.58, 3.50],
  [0.42, 3.85], [0.22, 4.15], [0.06, 4.35], [0.00, 4.42]
]), matRed);

// gold trim ring where red meets white
const ring1 = addSolid(rocket, new THREE.TorusGeometry(1.005, 0.05, 20, 80), matGold);
ring1.rotation.x = Math.PI / 2;
ring1.position.y = 1.2;

// gold trim ring where body meets nose
const ring2 = addSolid(rocket, new THREE.TorusGeometry(0.735, 0.045, 20, 72), matGold);
ring2.rotation.x = Math.PI / 2;
ring2.position.y = 2.98;

/* -------- Porthole window (rim + convex glass) -------- */
const porthole = new THREE.Group();
const rim3 = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.09, 24, 56), matGold);
rim3.castShadow = true; rim3.receiveShadow = true;
porthole.add(rim3);
const glass = new THREE.Mesh(new THREE.SphereGeometry(0.32, 40, 28), matGlass);
glass.scale.set(1, 1, 0.42);
glass.position.z = 0.05;
glass.castShadow = false;
porthole.add(glass);
porthole.position.set(0, 2.05, 0.86);
porthole.rotation.x = -0.12;
rocket.add(porthole);

/* -------- Three curved swept fins -------- */
const finShape = new THREE.Shape();
finShape.moveTo(0, 1.05);
finShape.lineTo(0, 0.0);
finShape.quadraticCurveTo(0.35, -0.52, 0.98, -0.55);
finShape.quadraticCurveTo(0.60, 0.05, 0.14, 0.95);
finShape.lineTo(0, 1.05);

const finGeom = new THREE.ExtrudeGeometry(finShape, {
  depth: 0.17, bevelEnabled: true, bevelThickness: 0.035,
  bevelSize: 0.035, bevelSegments: 3, steps: 1
});
finGeom.translate(0, 0, -0.085);

for (let i = 0; i < 3; i++) {
  const pivot = new THREE.Group();
  const fin = new THREE.Mesh(finGeom, matRed);
  fin.castShadow = true; fin.receiveShadow = true;
  fin.position.set(0.82, 0.0, 0);
  pivot.add(fin);
  pivot.rotation.y = Math.PI / 3 + i * (Math.PI * 2 / 3);
  rocket.add(pivot);
}

/* -------- Nozzle -------- */
const nozzle = addSolid(rocket, new THREE.CylinderGeometry(0.50, 0.62, 0.30, 44), matMetal);
nozzle.position.y = -0.12;
const nozzleLip = addSolid(rocket, new THREE.TorusGeometry(0.60, 0.06, 16, 44), matMetal);
nozzleLip.rotation.x = Math.PI / 2;
nozzleLip.position.y = -0.26;

/* -------- Flame (animated puff) -------- */
const flameGroup = new THREE.Group();
flameGroup.position.y = -0.18;

function flameMat(emissive, intensity, opacity) {
  return new THREE.MeshStandardMaterial({
    color: 0x000000, emissive, emissiveIntensity: intensity,
    roughness: 1.0, metalness: 0.0, transparent: true, opacity,
    depthWrite: false
  });
}
const flameGeom = latheGeom([
  [0.00, 0.02], [0.26, -0.04], [0.33, -0.16],
  [0.26, -0.27], [0.13, -0.33], [0.00, -0.37]
], 48, 60);

const flameOuter = new THREE.Mesh(flameGeom, flameMat(0xff5a1f, 2.2, 0.85));
const flameMid   = new THREE.Mesh(flameGeom, flameMat(0xffa01e, 2.7, 0.95));
const flameInner = new THREE.Mesh(flameGeom, flameMat(0xffe89a, 3.2, 1.0));
flameMid.scale.setScalar(0.72);
flameInner.scale.setScalar(0.46);
flameGroup.add(flameOuter, flameMid, flameInner);
rocket.add(flameGroup);

// glow light from the flame
const flameLight = new THREE.PointLight(0xff8a3a, 3.0, 4.0, 2.0);
flameLight.position.set(0, -0.4, 0);
rocket.add(flameLight);

scene.add(rocket);

/* ---------------------------------------------------------------------------
   Controls
--------------------------------------------------------------------------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.enablePan = false;
controls.minDistance = 5;
controls.maxDistance = 20;
controls.minPolarAngle = 0.15;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 1.6, 0);
controls.update();

/* ---------------------------------------------------------------------------
   Resize
--------------------------------------------------------------------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------------------------------------------------------------------------
   Animation loop
--------------------------------------------------------------------------- */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // flame puffing / flicker
  const puff = 1 + 0.20 * Math.sin(t * 9.0) + 0.06 * Math.sin(t * 23.0);
  const wob  = 1 + 0.08 * Math.sin(t * 12.0);
  flameGroup.scale.set(wob, puff, wob);
  const flick = 0.85 + 0.25 * Math.sin(t * 18.0) + 0.1 * Math.sin(t * 31.0);
  flameOuter.material.emissiveIntensity = 2.2 * flick;
  flameMid.material.emissiveIntensity   = 2.7 * flick;
  flameInner.material.emissiveIntensity = 3.2 * flick;
  flameLight.intensity = 2.4 + 1.1 * flick;

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
