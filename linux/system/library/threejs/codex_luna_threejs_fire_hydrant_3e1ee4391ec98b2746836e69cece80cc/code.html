<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cast Iron Fire Hydrant</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101316}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1114);
scene.fog = new THREE.Fog(0x0d1114, 8, 18);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.6, 3.35, 5.4);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.target.set(0, 1.75, 0);

const red = new THREE.MeshStandardMaterial({color:0x8f1715, roughness:0.72, metalness:0.48});
const redDark = new THREE.MeshStandardMaterial({color:0x55100f, roughness:0.86, metalness:0.42});
const edgeRed = new THREE.MeshStandardMaterial({color:0xb3221d, roughness:0.65, metalness:0.42});
const iron = new THREE.MeshStandardMaterial({color:0x25282a, roughness:0.82, metalness:0.82});
const bare = new THREE.MeshStandardMaterial({color:0x67615a, roughness:0.68, metalness:0.9});
const dark = new THREE.MeshStandardMaterial({color:0x111315, roughness:0.9, metalness:0.65});
const brass = new THREE.MeshStandardMaterial({color:0x9b6b32, roughness:0.46, metalness:0.78});

function mesh(geometry, material, position=[0,0,0], rotation=[0,0,0]) {
  const item = new THREE.Mesh(geometry, material);
  item.position.set(...position);
  item.rotation.set(...rotation);
  item.castShadow = true;
  item.receiveShadow = true;
  scene.add(item);
  return item;
}

function cylinder(radius, height, material, position, radial=32, rotation=[0,0,0], topRadius=radius) {
  return mesh(new THREE.CylinderGeometry(topRadius, radius, height, radial), material, position, rotation);
}

function torus(major, minor, material, position, rotation=[0,0,0]) {
  return mesh(new THREE.TorusGeometry(major, minor, 12, 40), material, position, rotation);
}

cylinder(1.12, 0.22, iron, [0,0.17,0], 48);
cylinder(1.34, 0.18, red, [0,0.31,0], 48);
cylinder(1.08, 0.26, red, [0,0.49,0], 48);
torus(1.08, 0.07, edgeRed, [0,0.59,0]);
cylinder(0.79, 2.12, red, [0,1.59,0], 48);
torus(0.79, 0.075, redDark, [0,0.69,0]);
torus(0.79, 0.075, edgeRed, [0,2.54,0]);

cylinder(0.9, 0.2, red, [0,2.68,0], 48);
torus(0.78, 0.075, bare, [0,2.77,0]);
const dome = new THREE.Mesh(new THREE.SphereGeometry(0.81, 48, 24, 0, Math.PI*2, 0, Math.PI/2), red);
dome.position.y = 2.77;
dome.castShadow = true;
dome.receiveShadow = true;
scene.add(dome);
torus(0.73, 0.055, redDark, [0,3.31,0]);

cylinder(0.22, 0.2, iron, [0,3.57,0], 5);
cylinder(0.17, 0.11, bare, [0,3.72,0], 5);
cylinder(0.27, 0.045, redDark, [0,3.48,0], 5);

function nozzle(axis, y, radius, length, capRadius) {
  const rot = axis === 'z' ? [Math.PI/2,0,0] : [0,0,Math.PI/2];
  const side = axis === 'z' ? [0,y,-0.82] : [axis,y,0];
  const sign = axis === 'z' ? -1 : Math.sign(axis);
  const bodyPos = axis === 'z' ? [0,y,-0.83] : [sign*0.83,y,0];
  cylinder(radius, length, red, bodyPos, 40, rot, radius*0.92);
  const outer = axis === 'z' ? [0,y,-1.04] : [sign*1.04,y,0];
  torus(radius*0.9, 0.065, bare, outer, rot);
  const cap = axis === 'z' ? [0,y,-1.13] : [sign*1.13,y,0];
  cylinder(capRadius, 0.19, redDark, cap, 32, rot);
  cylinder(capRadius*0.83, 0.2, iron, cap, 32, rot);
  torus(capRadius*0.88, 0.035, edgeRed, cap, rot);
  for(let i=0;i<6;i++){
    const a=i*Math.PI/3;
    const bx=axis==='z'?Math.cos(a)*capRadius*0.68:sign*1.13;
    const by=y+Math.sin(a)*capRadius*0.68;
    const bz=axis==='z'?-1.255:Math.cos(a)*capRadius*0.68;
    const boltRot=axis==='z'?[Math.PI/2,0,0]:[0,0,Math.PI/2];
    cylinder(0.035,0.025,brass,[bx,by,bz],8,boltRot,0.035);
  }
  return cap;
}

nozzle('z',1.53,0.42,0.42,0.46);
nozzle(-1,1.98,0.285,0.36,0.31);
nozzle(1,1.98,0.285,0.36,0.31);

function addLink(position, rotation) {
  const link = new THREE.Mesh(new THREE.TorusGeometry(0.075,0.019,10,18), brass);
  link.position.set(...position);
  link.rotation.set(...rotation);
  link.castShadow = true;
  scene.add(link);
}

for(let i=0;i<6;i++){
  addLink([0.35+i*0.055,1.28-i*0.11,-1.29], [i%2?Math.PI/2:0,0,i%2?0:Math.PI/2]);
}
for(let i=0;i<5;i++){
  addLink([1.27,1.96-i*0.105,0.08+i*0.015], [i%2?Math.PI/2:0,Math.PI/2,0]);
}
for(let i=0;i<5;i++){
  addLink([-1.27,1.96-i*0.105,-0.08-i*0.015], [i%2?Math.PI/2:0,Math.PI/2,0]);
}

function chip(theta, y, w, h, material) {
  const shape = new THREE.Shape();
  shape.moveTo(-w*0.52,-h*0.15);
  shape.lineTo(-w*0.2,-h*0.58);
  shape.lineTo(w*0.42,-h*0.45);
  shape.lineTo(w*0.55,h*0.12);
  shape.lineTo(w*0.12,h*0.58);
  shape.lineTo(-w*0.5,h*0.38);
  shape.closePath();
  const patch = new THREE.Mesh(new THREE.ShapeGeometry(shape), material);
  patch.position.set(0.792*Math.sin(theta), y, 0.792*Math.cos(theta));
  patch.rotation.y = theta;
  patch.castShadow = true;
  scene.add(patch);
}

chip(0.28,1.08,0.16,0.28,bare);
chip(0.6,1.72,0.11,0.2,bare);
chip(1.03,2.08,0.18,0.1,iron);
chip(2.0,1.28,0.13,0.24,bare);
chip(2.35,2.18,0.2,0.12,bare);
chip(3.15,1.48,0.15,0.3,iron);
chip(3.8,0.94,0.2,0.12,bare);
chip(4.3,1.94,0.12,0.23,bare);
chip(5.18,1.22,0.18,0.16,iron);
chip(5.72,2.26,0.15,0.1,bare);

for(let i=0;i<18;i++){
  const theta = (i*2.399)% (Math.PI*2);
  const y = 0.82 + ((i*37)%145)/100;
  const w = 0.035 + ((i*17)%25)/1000;
  const h = 0.035 + ((i*23)%32)/1000;
  chip(theta,y,w,h,i%3===0?bare:redDark);
}

const ground = new THREE.Mesh(
  new THREE.CylinderGeometry(6.5,6.5,0.12,64),
  new THREE.MeshStandardMaterial({color:0x24292b,roughness:0.94,metalness:0.05})
);
ground.position.y = -0.02;
ground.receiveShadow = true;
scene.add(ground);

const hemi = new THREE.HemisphereLight(0x9db4c8,0x171313,2.1);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffe0bd,4.2);
key.position.set(-4,7,5);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 6;
key.shadow.camera.bottom = -2;
scene.add(key);

const rim = new THREE.PointLight(0xb23a27,18,9,2);
rim.position.set(3.5,3.8,-3.5);
rim.castShadow = true;
scene.add(rim);

const fill = new THREE.PointLight(0x486b91,10,8,2);
fill.position.set(-4,2,2);
scene.add(fill);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
