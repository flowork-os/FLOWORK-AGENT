<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timber Pagoda</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #dfe8ee; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe8ee);
scene.fog = new THREE.Fog(0xdfe8ee, 28, 60);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(9, 6.5, 11);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.2, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.0;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 5;
controls.maxDistance = 30;

// ---------- Lighting ----------
scene.add(new THREE.HemisphereLight(0xcfe4f5, 0x8b7a5e, 0.55));

const sun = new THREE.DirectionalLight(0xfff2dd, 1.6);
sun.position.set(8, 12, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -8;
sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8;
sun.shadow.camera.bottom = -8;
sun.shadow.camera.near = 2;
sun.shadow.camera.far = 30;
sun.shadow.bias = -0.0004;
sun.shadow.radius = 4;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xbfd4e8, 0.35);
fill.position.set(-6, 4, -8);
scene.add(fill);

// ---------- Ground ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(30, 64),
  new THREE.MeshStandardMaterial({ color: 0xb9c4a6, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// soft radial contact shadow
const shadowCanvas = document.createElement('canvas');
shadowCanvas.width = shadowCanvas.height = 256;
const sctx = shadowCanvas.getContext('2d');
const grad = sctx.createRadialGradient(128, 128, 20, 128, 128, 128);
grad.addColorStop(0, 'rgba(40,35,25,0.42)');
grad.addColorStop(1, 'rgba(40,35,25,0)');
sctx.fillStyle = grad;
sctx.fillRect(0, 0, 256, 256);
const softShadow = new THREE.Mesh(
  new THREE.PlaneGeometry(8.5, 8.5),
  new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(shadowCanvas), transparent: true, depthWrite: false })
);
softShadow.rotation.x = -Math.PI / 2;
softShadow.position.y = 0.01;
scene.add(softShadow);

// ---------- Materials ----------
const timber = new THREE.MeshStandardMaterial({ color: 0x9a6b45, roughness: 0.75, metalness: 0.0 });
const timberDark = new THREE.MeshStandardMaterial({ color: 0x74502f, roughness: 0.8 });
const roofMat = new THREE.MeshStandardMaterial({ color: 0x5c4630, roughness: 0.65, side: THREE.DoubleSide });
const stoneMat = new THREE.MeshStandardMaterial({ color: 0xa8a094, roughness: 0.95 });
const accentMat = new THREE.MeshStandardMaterial({ color: 0xc9a24b, roughness: 0.4, metalness: 0.35 });

const pagoda = new THREE.Group();
scene.add(pagoda);

function mesh(geo, mat, x, y, z) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  pagoda.add(m);
  return m;
}

// ---------- Upturned roof tier (lathe profile, square via 4-sided extrude look) ----------
function roofTier(halfWidth, baseY, thickness) {
  const g = new THREE.Group();
  // Build one quadrant-symmetric roof using a custom BufferGeometry:
  // square pyramid-ish surface with concave (upturned) profile.
  const seg = 14;
  const overhang = halfWidth;
  const rise = halfWidth * 0.62;
  const positions = [];
  const profile = t => {
    // t: 0 (eave edge) -> 1 (peak). Concave curve => upturned eaves.
    const y = rise * (t * t * 0.85 + t * 0.15);
    return y;
  };
  // Build 4 sides; each side is a fan of quads from eave line to ridge point line.
  for (let s = 0; s < 4; s++) {
    const rot = s * Math.PI / 2;
    const cos = Math.cos(rot), sin = Math.sin(rot);
    for (let i = 0; i < seg; i++) {
      const t0 = i / seg, t1 = (i + 1) / seg;
      const r0 = overhang * (1 - t0), r1 = overhang * (1 - t1);
      const y0 = profile(t0), y1 = profile(t1);
      // corners lifted extra at the eave -> upturned corners
      const lift = t => Math.pow(1 - t, 3) * rise * 0.38;
      // each side spans x in [-r, r] at depth z = r (before rotation)
      const quad = (x0a, z0a, ya, x1a, z1a, yb, x0b, z0b, yc, x1b, z1b, yd) => {
        positions.push(x0a, ya, z0a, x1a, yb, z1a, x0b, yc, z0b);
        positions.push(x1a, yb, z1a, x1b, yd, z1b, x0b, yc, z0b);
      };
      const sub = 8;
      for (let j = 0; j < sub; j++) {
        const u0 = j / sub - 0.5, u1 = (j + 1) / sub - 0.5;
        const cornerLift = u => Math.pow(Math.abs(u) * 2, 2.2);
        const yA = y0 + lift(t0) * cornerLift(u0);
        const yB = y0 + lift(t0) * cornerLift(u1);
        const yC = y1 + lift(t1) * cornerLift(u0 * (r1 / Math.max(r0, 1e-4)) * 1 || 0);
        const yD = y1 + lift(t1) * cornerLift(u1);
        const xa0 = u0 * 2 * r0, xa1 = u1 * 2 * r0;
        const xb0 = u0 * 2 * r1, xb1 = u1 * 2 * r1;
        // rotate into place
        const R = (x, z) => [x * cos - z * sin, x * sin + z * cos];
        const [Xa0, Za0] = R(xa0, r0), [Xa1, Za1] = R(xa1, r0);
        const [Xb0, Zb0] = R(xb0, r1), [Xb1, Zb1] = R(xb1, r1);
        quad(Xa0, Za0, yA, Xa1, Za1, yB, Xb0, Zb0, yC, Xb1, Zb1, yD);
      }
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.computeVertexNormals();
  const top = new THREE.Mesh(geo, roofMat);
  top.castShadow = true;
  top.receiveShadow = true;
  g.add(top);

  // underside slab for visual thickness
  const under = top.clone();
  under.position.y = -thickness;
  under.material = timberDark;
  g.add(under);

  // eave fascia band around the rim
  const fascia = new THREE.Mesh(
    new THREE.BoxGeometry(overhang * 2 + 0.02, thickness, 0.06),
    timberDark
  );
  for (let s = 0; s < 4; s++) {
    const f = fascia.clone();
    f.castShadow = true;
    const rot = s * Math.PI / 2;
    f.rotation.y = rot;
    f.position.set(Math.sin(rot) * overhang, -thickness / 2 + 0.02, Math.cos(rot) * overhang);
    g.add(f);
  }

  // small corner finial knobs at upturned tips
  for (let s = 0; s < 4; s++) {
    const a = s * Math.PI / 2 + Math.PI / 4;
    const knob = new THREE.Mesh(new THREE.SphereGeometry(0.055, 12, 10), accentMat);
    const d = overhang * Math.SQRT2 * 0.985;
    knob.position.set(Math.cos(a) * d * 0.72, rise * 0.36, Math.sin(a) * d * 0.72);
    knob.castShadow = true;
    g.add(knob);
  }

  g.position.y = baseY;
  pagoda.add(g);
  return { rise, group: g };
}

// ---------- Bracket cluster (dougong-inspired, restrained) ----------
function bracket(x, y, z, rotY) {
  const g = new THREE.Group();
  const arm1 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.08, 0.1), timberDark);
  arm1.position.y = 0.0;
  const arm2 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.08, 0.1), timberDark);
  arm2.position.y = -0.12;
  const block = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.09, 0.12), timber);
  block.position.y = -0.2;
  [arm1, arm2, block].forEach(m => { m.castShadow = true; m.receiveShadow = true; g.add(m); });
  g.position.set(x, y, z);
  g.rotation.y = rotY;
  pagoda.add(g);
}

function bracketRing(halfWidth, y) {
  const n = 3; // per side
  for (let s = 0; s < 4; s++) {
    const rot = s * Math.PI / 2;
    for (let i = 0; i < n; i++) {
      const u = (i / (n - 1) - 0.5) * (halfWidth * 1.5);
      const x = Math.cos(rot) * u + Math.sin(rot) * halfWidth;
      const z = -Math.sin(rot) * u + Math.cos(rot) * halfWidth;
      bracket(x, y, z, rot);
    }
  }
}

// ---------- Structure ----------
// Stone base platform
mesh(new THREE.BoxGeometry(5.4, 0.35, 5.4), stoneMat, 0, 0.175, 0);
mesh(new THREE.BoxGeometry(4.8, 0.3, 4.8), stoneMat, 0, 0.5, 0);

// Timber deck
mesh(new THREE.BoxGeometry(4.4, 0.16, 4.4), timber, 0, 0.73, 0);

// Story builder: posts + beams + wall core
function story(halfWidth, baseY, height, postR) {
  // corner posts
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const p = mesh(
      new THREE.CylinderGeometry(postR, postR * 1.12, height, 12),
      timber, sx * halfWidth, baseY + height / 2, sz * halfWidth
    );
    p.castShadow = true;
  }
  // ring beams top & bottom
  for (const yOff of [0.08, height - 0.08]) {
    for (let s = 0; s < 4; s++) {
      const rot = s * Math.PI / 2;
      const b = mesh(
        new THREE.BoxGeometry(halfWidth * 2 + postR * 2, 0.14, 0.14),
        timberDark, 0, baseY + yOff, 0
      );
      b.rotation.y = rot;
      b.position.set(Math.sin(rot) * halfWidth, baseY + yOff, Math.cos(rot) * halfWidth);
    }
  }
  // recessed wall core
  mesh(new THREE.BoxGeometry(halfWidth * 1.55, height - 0.3, halfWidth * 1.55),
    new THREE.MeshStandardMaterial({ color: 0xe7dcc8, roughness: 0.9 }),
    0, baseY + height / 2, 0);
  // simple lattice slats on each face
  for (let s = 0; s < 4; s++) {
    const rot = s * Math.PI / 2;
    for (let k = -2; k <= 2; k++) {
      const slat = mesh(new THREE.BoxGeometry(0.05, height - 0.5, 0.03), timberDark, 0, 0, 0);
      const off = halfWidth * 0.78;
      slat.rotation.y = rot;
      slat.position.set(
        Math.cos(rot) * k * 0.22 + Math.sin(rot) * off,
        baseY + height / 2,
        -Math.sin(rot) * k * 0.22 + Math.cos(rot) * off
      );
    }
  }
}

// Tier 1
story(1.9, 0.81, 2.0, 0.11);
bracketRing(1.9, 2.86);
roofTier(2.9, 3.02, 0.09);

// Tier 2
story(1.45, 3.55, 1.5, 0.09);
bracketRing(1.45, 5.1);
roofTier(2.25, 5.26, 0.08);

// Tier 3
story(1.05, 5.6, 1.25, 0.075);
bracketRing(1.05, 6.9);
const topRoof = roofTier(1.7, 7.06, 0.07);

// ---------- Finial spire ----------
const finial = new THREE.Group();
finial.position.y = 7.06 + topRoof.rise * 0.9;
const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 1.15, 10), accentMat);
pole.position.y = 0.55;
pole.castShadow = true;
finial.add(pole);
[0.22, 0.5, 0.75].forEach((y, i) => {
  const disc = new THREE.Mesh(new THREE.TorusGeometry(0.19 - i * 0.05, 0.028, 10, 24), accentMat);
  disc.rotation.x = Math.PI / 2;
  disc.position.y = y;
  disc.castShadow = true;
  finial.add(disc);
});
const orb = new THREE.Mesh(new THREE.SphereGeometry(0.09, 14, 12), accentMat);
orb.position.y = 1.15;
orb.castShadow = true;
finial.add(orb);
pagoda.add(finial);

// ---------- Resize & animate ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
