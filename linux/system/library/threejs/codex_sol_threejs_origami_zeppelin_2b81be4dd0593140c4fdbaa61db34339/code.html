<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Origami Zeppelin</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #e8e1d3;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe8e1d3);
  scene.fog = new THREE.Fog(0xe8e1d3, 17, 28);

  const camera = new THREE.PerspectiveCamera(
    34,
    window.innerWidth / window.innerHeight,
    0.1,
    100
  );
  camera.position.set(9.4, 5.7, 10.8);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.7;
  controls.enablePan = false;
  controls.minDistance = 8;
  controls.maxDistance = 24;
  controls.target.set(0, -0.15, 0);

  const paperMaterials = [
    new THREE.MeshStandardMaterial({
      color: 0xf5eedc,
      roughness: 0.9,
      metalness: 0,
      flatShading: true,
      side: THREE.DoubleSide
    }),
    new THREE.MeshStandardMaterial({
      color: 0xe9dfc8,
      roughness: 0.94,
      metalness: 0,
      flatShading: true,
      side: THREE.DoubleSide
    }),
    new THREE.MeshStandardMaterial({
      color: 0xfff8e9,
      roughness: 0.87,
      metalness: 0,
      flatShading: true,
      side: THREE.DoubleSide
    }),
    new THREE.MeshStandardMaterial({
      color: 0xded2b9,
      roughness: 0.96,
      metalness: 0,
      flatShading: true,
      side: THREE.DoubleSide
    })
  ];

  const creaseMaterial = new THREE.LineBasicMaterial({
    color: 0x756b58,
    transparent: true,
    opacity: 0.25,
    depthWrite: false
  });

  const zeppelin = new THREE.Group();
  zeppelin.position.y = 0.45;
  scene.add(zeppelin);

  function createHull() {
    const sideCount = 14;
    const rings = [
      { x: -5.05, r: 0.63, sy: 0.92 },
      { x: -4.20, r: 1.14, sy: 0.96 },
      { x: -2.80, r: 1.48, sy: 1.00 },
      { x: -0.80, r: 1.65, sy: 1.00 },
      { x:  1.25, r: 1.57, sy: 0.98 },
      { x:  3.05, r: 1.25, sy: 0.94 },
      { x:  4.28, r: 0.72, sy: 0.88 }
    ];
    const nose = new THREE.Vector3(-5.72, 0, 0);
    const tail = new THREE.Vector3(5.32, 0, 0);
    const ringPoints = [];

    for (let i = 0; i < rings.length; i++) {
      const ring = [];
      const phase = i % 2 === 0 ? 0 : Math.PI / sideCount;
      for (let j = 0; j < sideCount; j++) {
        const a = (j / sideCount) * Math.PI * 2 + phase;
        ring.push(new THREE.Vector3(
          rings[i].x,
          Math.cos(a) * rings[i].r * rings[i].sy,
          Math.sin(a) * rings[i].r
        ));
      }
      ringPoints.push(ring);
    }

    const positions = [];
    const groups = [];
    let vertexCursor = 0;

    function triangle(a, b, c, materialIndex) {
      positions.push(
        a.x, a.y, a.z,
        b.x, b.y, b.z,
        c.x, c.y, c.z
      );
      groups.push({ start: vertexCursor, count: 3, materialIndex });
      vertexCursor += 3;
    }

    for (let j = 0; j < sideCount; j++) {
      const next = (j + 1) % sideCount;
      triangle(
        nose,
        ringPoints[0][next],
        ringPoints[0][j],
        (j + 1) % paperMaterials.length
      );
    }

    for (let i = 0; i < ringPoints.length - 1; i++) {
      for (let j = 0; j < sideCount; j++) {
        const next = (j + 1) % sideCount;
        const a = ringPoints[i][j];
        const b = ringPoints[i][next];
        const c = ringPoints[i + 1][j];
        const d = ringPoints[i + 1][next];

        if ((i + j) % 2 === 0) {
          triangle(a, d, b, (i + j) % paperMaterials.length);
          triangle(a, c, d, (i + j + 1) % paperMaterials.length);
        } else {
          triangle(a, c, b, (i + j + 2) % paperMaterials.length);
          triangle(b, c, d, (i + j + 3) % paperMaterials.length);
        }
      }
    }

    const lastRing = ringPoints[ringPoints.length - 1];
    for (let j = 0; j < sideCount; j++) {
      const next = (j + 1) % sideCount;
      triangle(
        lastRing[j],
        lastRing[next],
        tail,
        (j + 2) % paperMaterials.length
      );
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute(
      'position',
      new THREE.Float32BufferAttribute(positions, 3)
    );
    groups.forEach(group => {
      geometry.addGroup(group.start, group.count, group.materialIndex);
    });
    geometry.computeVertexNormals();
    geometry.computeBoundingSphere();

    const mesh = new THREE.Mesh(geometry, paperMaterials);
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    const creasePositions = [];

    function crease(a, b) {
      creasePositions.push(a.x, a.y, a.z, b.x, b.y, b.z);
    }

    for (let i = 0; i < ringPoints.length; i++) {
      for (let j = 0; j < sideCount; j++) {
        crease(ringPoints[i][j], ringPoints[i][(j + 1) % sideCount]);
      }
    }

    for (let j = 0; j < sideCount; j++) {
      crease(nose, ringPoints[0][j]);
      for (let i = 0; i < ringPoints.length - 1; i++) {
        crease(ringPoints[i][j], ringPoints[i + 1][j]);
      }
      crease(lastRing[j], tail);
    }

    for (let i = 0; i < ringPoints.length - 1; i++) {
      for (let j = 0; j < sideCount; j++) {
        if ((i + j) % 2 === 0) {
          crease(
            ringPoints[i][j],
            ringPoints[i + 1][(j + 1) % sideCount]
          );
        }
      }
    }

    const creaseGeometry = new THREE.BufferGeometry();
    creaseGeometry.setAttribute(
      'position',
      new THREE.Float32BufferAttribute(creasePositions, 3)
    );
    const creases = new THREE.LineSegments(creaseGeometry, creaseMaterial);
    creases.renderOrder = 2;

    const group = new THREE.Group();
    group.add(mesh, creases);
    return group;
  }

  zeppelin.add(createHull());

  function createTriangularPrism(pointsFront, pointsBack, materialOffset = 0) {
    const positions = [];
    const groups = [];
    let cursor = 0;

    function addTriangle(a, b, c, materialIndex) {
      positions.push(
        a.x, a.y, a.z,
        b.x, b.y, b.z,
        c.x, c.y, c.z
      );
      groups.push({
        start: cursor,
        count: 3,
        materialIndex: materialIndex % paperMaterials.length
      });
      cursor += 3;
    }

    addTriangle(pointsFront[0], pointsFront[1], pointsFront[2], materialOffset);
    addTriangle(pointsBack[2], pointsBack[1], pointsBack[0], materialOffset + 1);

    for (let i = 0; i < 3; i++) {
      const next = (i + 1) % 3;
      addTriangle(
        pointsFront[i],
        pointsBack[i],
        pointsBack[next],
        materialOffset + i + 1
      );
      addTriangle(
        pointsFront[i],
        pointsBack[next],
        pointsFront[next],
        materialOffset + i + 2
      );
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute(
      'position',
      new THREE.Float32BufferAttribute(positions, 3)
    );
    groups.forEach(group => {
      geometry.addGroup(group.start, group.count, group.materialIndex);
    });
    geometry.computeVertexNormals();

    const mesh = new THREE.Mesh(geometry, paperMaterials);
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(geometry, 12),
      creaseMaterial
    );

    const group = new THREE.Group();
    group.add(mesh, edges);
    return group;
  }

  const topFin = createTriangularPrism(
    [
      new THREE.Vector3(3.25, 0.72, -0.075),
      new THREE.Vector3(5.08, 0.16, -0.075),
      new THREE.Vector3(4.28, 2.72, -0.075)
    ],
    [
      new THREE.Vector3(3.25, 0.72, 0.075),
      new THREE.Vector3(5.08, 0.16, 0.075),
      new THREE.Vector3(4.28, 2.72, 0.075)
    ],
    0
  );
  zeppelin.add(topFin);

  const lowerFin = createTriangularPrism(
    [
      new THREE.Vector3(3.42, -0.67, -0.07),
      new THREE.Vector3(5.10, -0.14, -0.07),
      new THREE.Vector3(4.37, -2.08, -0.07)
    ],
    [
      new THREE.Vector3(3.42, -0.67, 0.07),
      new THREE.Vector3(5.10, -0.14, 0.07),
      new THREE.Vector3(4.37, -2.08, 0.07)
    ],
    1
  );
  zeppelin.add(lowerFin);

  const farFin = createTriangularPrism(
    [
      new THREE.Vector3(3.36, -0.065, -0.67),
      new THREE.Vector3(5.10, -0.065, -0.12),
      new THREE.Vector3(4.20, -0.065, -2.05)
    ],
    [
      new THREE.Vector3(3.36, 0.065, -0.67),
      new THREE.Vector3(5.10, 0.065, -0.12),
      new THREE.Vector3(4.20, 0.065, -2.05)
    ],
    2
  );
  zeppelin.add(farFin);

  const nearFin = createTriangularPrism(
    [
      new THREE.Vector3(3.36, 0.065, 0.67),
      new THREE.Vector3(5.10, 0.065, 0.12),
      new THREE.Vector3(4.20, 0.065, 2.05)
    ],
    [
      new THREE.Vector3(3.36, -0.065, 0.67),
      new THREE.Vector3(5.10, -0.065, 0.12),
      new THREE.Vector3(4.20, -0.065, 2.05)
    ],
    1
  );
  zeppelin.add(nearFin);

  function createGondola() {
    const vertices = [
      new THREE.Vector3(-1.35, -1.66, -0.42),
      new THREE.Vector3( 1.15, -1.66, -0.42),
      new THREE.Vector3(-1.35, -1.66,  0.42),
      new THREE.Vector3( 1.15, -1.66,  0.42),
      new THREE.Vector3(-1.04, -2.43, -0.29),
      new THREE.Vector3( 0.82, -2.43, -0.29),
      new THREE.Vector3(-1.04, -2.43,  0.29),
      new THREE.Vector3( 0.82, -2.43,  0.29),
      new THREE.Vector3(-1.56, -1.91, 0),
      new THREE.Vector3( 1.34, -1.91, 0)
    ];

    const faces = [
      [0, 1, 9], [0, 9, 8],
      [2, 8, 9], [2, 9, 3],
      [0, 8, 4], [8, 6, 4],
      [2, 6, 8],
      [1, 5, 9], [9, 5, 7],
      [3, 9, 7],
      [4, 5, 7], [4, 7, 6],
      [0, 4, 5], [0, 5, 1],
      [2, 3, 7], [2, 7, 6]
    ];

    const positions = [];
    const geometry = new THREE.BufferGeometry();

    faces.forEach(face => {
      for (const index of face) {
        const v = vertices[index];
        positions.push(v.x, v.y, v.z);
      }
    });

    geometry.setAttribute(
      'position',
      new THREE.Float32BufferAttribute(positions, 3)
    );

    faces.forEach((face, index) => {
      geometry.addGroup(index * 3, 3, (index + 1) % paperMaterials.length);
    });

    geometry.computeVertexNormals();

    const mesh = new THREE.Mesh(geometry, paperMaterials);
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(geometry, 10),
      creaseMaterial
    );

    const diagonalPositions = [];
    function diagonal(a, b) {
      diagonalPositions.push(
        vertices[a].x, vertices[a].y, vertices[a].z,
        vertices[b].x, vertices[b].y, vertices[b].z
      );
    }
    diagonal(0, 5);
    diagonal(2, 7);
    diagonal(8, 5);
    diagonal(8, 7);

    const diagonalGeometry = new THREE.BufferGeometry();
    diagonalGeometry.setAttribute(
      'position',
      new THREE.Float32BufferAttribute(diagonalPositions, 3)
    );
    const diagonals = new THREE.LineSegments(
      diagonalGeometry,
      creaseMaterial
    );

    const group = new THREE.Group();
    group.add(mesh, edges, diagonals);
    return group;
  }

  zeppelin.add(createGondola());

  function createFoldedStrut(start, end, width, materialIndex) {
    const midpoint = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
    midpoint.z += start.z >= 0 ? 0.08 : -0.08;

    const direction = new THREE.Vector3().subVectors(end, start);
    const side = new THREE.Vector3(0, 0, 1)
      .cross(direction)
      .normalize()
      .multiplyScalar(width);

    const a = start.clone().add(side);
    const b = start.clone().sub(side);
    const c = midpoint.clone().add(side.multiplyScalar(0.7));
    const d = midpoint.clone().sub(
      new THREE.Vector3().subVectors(c, midpoint)
    );
    const e = end.clone().add(
      new THREE.Vector3().subVectors(c, midpoint).multiplyScalar(0.75)
    );
    const f = end.clone().sub(
      new THREE.Vector3().subVectors(c, midpoint).multiplyScalar(0.75)
    );

    const positions = [
      a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z,
      b.x, b.y, b.z, d.x, d.y, d.z, c.x, c.y, c.z,
      c.x, c.y, c.z, d.x, d.y, d.z, e.x, e.y, e.z,
      d.x, d.y, d.z, f.x, f.y, f.z, e.x, e.y, e.z
    ];

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute(
      'position',
      new THREE.Float32BufferAttribute(positions, 3)
    );
    geometry.computeVertexNormals();
    geometry.addGroup(0, 6, materialIndex);
    geometry.addGroup(6, 6, (materialIndex + 1) % paperMaterials.length);

    const mesh = new THREE.Mesh(geometry, paperMaterials);
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(geometry, 5),
      creaseMaterial
    );

    const group = new THREE.Group();
    group.add(mesh, edges);
    return group;
  }

  zeppelin.add(
    createFoldedStrut(
      new THREE.Vector3(-0.82, -1.03, 0.27),
      new THREE.Vector3(-0.75, -1.67, 0.32),
      0.08,
      0
    ),
    createFoldedStrut(
      new THREE.Vector3(0.63, -1.00, 0.27),
      new THREE.Vector3(0.55, -1.67, 0.32),
      0.08,
      1
    ),
    createFoldedStrut(
      new THREE.Vector3(-0.82, -1.03, -0.27),
      new THREE.Vector3(-0.75, -1.67, -0.32),
      0.08,
      2
    ),
    createFoldedStrut(
      new THREE.Vector3(0.63, -1.00, -0.27),
      new THREE.Vector3(0.55, -1.67, -0.32),
      0.08,
      0
    )
  );

  const ambient = new THREE.HemisphereLight(0xfffbef, 0x8c8273, 2.15);
  scene.add(ambient);

  const keyLight = new THREE.DirectionalLight(0xfff4dc, 4.3);
  keyLight.position.set(-6, 10, 8);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  keyLight.shadow.camera.left = -9;
  keyLight.shadow.camera.right = 9;
  keyLight.shadow.camera.top = 7;
  keyLight.shadow.camera.bottom = -7;
  keyLight.shadow.camera.near = 1;
  keyLight.shadow.camera.far = 30;
  keyLight.shadow.bias = -0.0003;
  keyLight.shadow.normalBias = 0.025;
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0xcbd8e2, 1.15);
  fillLight.position.set(7, 2, -8);
  scene.add(fillLight);

  const rimLight = new THREE.DirectionalLight(0xffe5bb, 1.4);
  rimLight.position.set(4, 7, -4);
  scene.add(rimLight);

  const groundMaterial = new THREE.ShadowMaterial({
    color: 0x625a50,
    opacity: 0.19
  });
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 40),
    groundMaterial
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -3.05;
  ground.receiveShadow = true;
  scene.add(ground);

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  });
</script>
</body>
</html>
