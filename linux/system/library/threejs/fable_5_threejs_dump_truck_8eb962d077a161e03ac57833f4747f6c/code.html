<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dump Truck</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#cfe0ea}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe0ea);
scene.fog = new THREE.Fog(0xcfe0ea, 32, 60);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 120);
camera.position.set(9.5, 5.2, 9.5);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
controls.minDistance = 5; controls.maxDistance = 30;
controls.maxPolarAngle = 1.45;

// Lights
scene.add(new THREE.HemisphereLight(0xbfd8ea, 0x6b5f48, 0.9));
const sun = new THREE.DirectionalLight(0xfff1dc, 2.4);
sun.position.set(9, 13, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -9;
sun.shadow.camera.right = sun.shadow.camera.top = 9;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 40;
sun.shadow.bias = -0.0004; sun.shadow.radius = 5;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xd8e4ee, 0.35);
fill.position.set(-7, 5, -6);
scene.add(fill);

// Materials
const M = (c,r,m)=>new THREE.MeshStandardMaterial({color:c, roughness:r, metalness:m});
const yellow  = M(0xf0a400, 0.5, 0.25);
const yellow2 = M(0xd8920a, 0.6, 0.25);
const dark    = M(0x23262a, 0.85, 0.2);
const steel   = M(0x8f969c, 0.4, 0.8);
const rubber  = M(0x151515, 0.95, 0.0);
const glass   = M(0x2b3f4a, 0.12, 0.7);
const orange  = new THREE.MeshStandardMaterial({color:0xff7a00, emissive:0xff5500, emissiveIntensity:0.6, roughness:0.4});

// Helpers
const box = (w,h,d,m,x,y,z,p)=>{ const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m); o.position.set(x,y,z); o.castShadow=o.receiveShadow=true; p.add(o); return o; };
const cyl = (r,h,m,x,y,z,p,rx=0,rz=0,seg=24,flat=false)=>{ const g=new THREE.CylinderGeometry(r,r,h,seg); const mm=flat?m.clone():m; if(flat)mm.flatShading=true; const o=new THREE.Mesh(g,mm); o.rotation.set(rx,0,rz); o.position.set(x,y,z); o.castShadow=o.receiveShadow=true; p.add(o); return o; };

// Rough ground
const gGeo = new THREE.CircleGeometry(16, 80).rotateX(-Math.PI/2);
const pos = gGeo.attributes.position;
for(let i=0;i<pos.count;i++){
  const x=pos.getX(i), z=pos.getZ(i), d=Math.hypot(x,z);
  const f=Math.min(1, Math.max(0,(d-2.6)/3));
  pos.setY(i, f*(Math.sin(x*1.4)*Math.cos(z*1.7)*0.13 + Math.sin(x*3.6+z*2.8)*0.06 + Math.random()*0.045));
}
gGeo.computeVertexNormals();
const ground = new THREE.Mesh(gGeo, M(0x93866f, 1.0, 0.0));
ground.receiveShadow = true;
scene.add(ground);
for(let i=0;i<16;i++){
  const a=Math.random()*Math.PI*2, r=4.2+Math.random()*10, s=0.08+Math.random()*0.22;
  const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0), M(0x7d7264,1,0));
  rock.position.set(Math.cos(a)*r, s*0.4, Math.sin(a)*r);
  rock.rotation.set(Math.random()*3, Math.random()*3, Math.random()*3);
  rock.castShadow=rock.receiveShadow=true;
  scene.add(rock);
}

// ---- Truck (front = +x) ----
const truck = new THREE.Group();
scene.add(truck);

// Chassis frame
for(const s of [-1,1]) box(6.7, 0.2, 0.14, dark, -0.25, 1.0, 0.45*s, truck);
for(const x of [2.6, 0.9, -0.9, -2.9]) box(0.14, 0.16, 0.9, dark, x, 1.0, 0, truck);
cyl(0.06, 3.4, steel, -1.0, 0.72, 0, truck, 0, Math.PI/2, 12); // driveshaft

// Axles + wheels
const makeWheel = ()=>{
  const g = new THREE.Group();
  cyl(0.62, 0.45, rubber, 0,0,0, g, Math.PI/2, 0, 28);
  cyl(0.645, 0.28, rubber, 0,0,0, g, Math.PI/2, 0, 14, true); // chunky tread band
  cyl(0.30, 0.47, yellow2, 0,0,0, g, Math.PI/2, 0, 20);
  cyl(0.11, 0.50, dark, 0,0,0, g, Math.PI/2, 0, 12);
  return g;
};
const wheelPos = [[2.3,1.16],[2.3,-1.16]];
for(const x of [-1.55,-2.75]) for(const z of [0.78,1.28,-0.78,-1.28]) wheelPos.push([x,z]);
for(const [x,z] of wheelPos){ const w=makeWheel(); w.position.set(x,0.62,z); w.rotation.z=Math.random()*0.5; truck.add(w); }
for(const x of [2.3,-1.55,-2.75]) cyl(0.08, 2.3, dark, x, 0.62, 0, truck, Math.PI/2, 0, 12);

// Cab
box(1.5, 1.85, 2.4, yellow, 2.35, 2.02, 0, truck);
box(0.06, 0.82, 2.0, glass, 3.13, 2.5, 0, truck);                    // windshield
for(const s of [-1,1]) box(1.0, 0.7, 0.05, glass, 2.5, 2.5, 1.22*s, truck); // side windows
box(0.08, 0.7, 2.0, dark, 3.13, 1.62, 0, truck);                     // grille
box(0.3, 0.4, 2.5, dark, 3.35, 0.72, 0, truck);                      // bumper
for(const s of [-1,1]) box(0.1, 0.22, 0.35, orange, 3.17, 1.2, 0.85*s, truck); // headlights
for(const s of [-1,1]) box(0.55, 0.08, 0.28, dark, 2.35, 0.95, 1.28*s, truck); // steps
box(0.6, 0.06, 0.34, dark, 2.35, 2.98, 0, truck);                    // roof bar
cyl(0.07, 0.12, orange, 2.35, 3.06, 0, truck);                       // beacon
cyl(0.07, 1.6, steel, 1.48, 2.0, -1.0, truck, 0, 0, 12);             // exhaust stack
cyl(0.28, 1.1, steel, 1.0, 0.78, 1.15, truck, 0, Math.PI/2, 18);     // fuel tank

// Tipper bed (pivot at rear)
const bedPivot = new THREE.Group();
bedPivot.position.set(-3.05, 1.32, 0);
truck.add(bedPivot);
const bed = new THREE.Group();
bedPivot.add(bed);
box(4.4, 0.14, 2.6, yellow2, 2.2, 0.07, 0, bed);                     // floor
for(const s of [-1,1]) box(4.4, 1.14, 0.1, yellow, 2.2, 0.71, 1.25*s, bed); // side walls
box(0.12, 1.6, 2.6, yellow, 4.35, 0.94, 0, bed);                     // headboard
box(1.25, 0.1, 2.6, yellow, 5.0, 1.79, 0, bed);                      // cab-protector canopy
for(const s of [-1,1]) for(const x of [0.7,1.7,2.7,3.7]) box(0.14, 1.2, 0.08, yellow2, x, 0.7, 1.33*s, bed); // ribs
const gate = new THREE.Group();
gate.position.set(0.05, 1.28, 0);
bed.add(gate);
box(0.1, 1.2, 2.56, yellow, 0, -0.6, 0, gate);                       // tailgate

// Telescopic hoist rams
const up = new THREE.Vector3(0,1,0), A = new THREE.Vector3(), B = new THREE.Vector3(), D = new THREE.Vector3();
const rams = [];
for(const s of [-1,1]){
  const base = new THREE.Object3D(); base.position.set(1.1, 0.55, 0.42*s); truck.add(base);
  const top  = new THREE.Object3D(); top.position.set(3.2, 0.08, 0.42*s); bed.add(top);
  const g = new THREE.Group(); truck.add(g);
  const geo = new THREE.CylinderGeometry(1,1,1,14).translate(0,0.5,0);
  const outer = new THREE.Mesh(geo, steel); outer.scale.set(0.09,1.05,0.09); outer.castShadow=true;
  const rod   = new THREE.Mesh(geo, steel.clone()); rod.material.color.set(0xc9ced2); rod.scale.set(0.05,1,0.05); rod.castShadow=true;
  g.add(outer, rod);
  rams.push({g, rod, base, top});
}

// Animate
const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();
  const s = (Math.sin(t*0.45 - 1.4)+1)/2, e = s*s*(3-2*s);
  const angle = 0.48*e;
  bedPivot.rotation.z = angle;
  gate.rotation.z = -Math.min(angle*1.5, 0.9);
  for(const r of rams){
    r.base.getWorldPosition(A); r.top.getWorldPosition(B);
    D.subVectors(B, A); const len = D.length();
    r.g.position.copy(A);
    r.g.quaternion.setFromUnitVectors(up, D.normalize());
    r.rod.scale.y = len;
  }
  controls.update();
  renderer.render(scene, camera);
}
tick();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
