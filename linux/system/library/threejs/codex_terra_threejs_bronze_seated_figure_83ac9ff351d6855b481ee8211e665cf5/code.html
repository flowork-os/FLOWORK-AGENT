<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seated Bronze Memorial</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#101312}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111716);
scene.fog = new THREE.FogExp2(0x111716, 0.055);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.4, 4.9, 8.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.05, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.34;
controls.minDistance = 4.5;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.48;

const bronze = new THREE.MeshStandardMaterial({
  color: 0x3a3023, roughness: 0.34, metalness: 0.86,
  envMapIntensity: 1.2
});
const darkBronze = new THREE.MeshStandardMaterial({
  color: 0x201e18, roughness: 0.42, metalness: 0.78
});
const patina = new THREE.MeshStandardMaterial({
  color: 0x294039, roughness: 0.48, metalness: 0.64
});
const stone = new THREE.MeshStandardMaterial({
  color: 0x3a3d37, roughness: 0.8, metalness: 0.04
});
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x202724, roughness: 0.92, metalness: 0
});

function mesh(geometry, material, position, rotation, scale, parent = scene) {
  const m = new THREE.Mesh(geometry, material);
  if (position) m.position.copy(position);
  if (rotation) m.rotation.set(rotation.x, rotation.y, rotation.z);
  if (scale) m.scale.copy(scale);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function ellipsoid(r, position, scale, material = bronze, parent) {
  return mesh(new THREE.SphereGeometry(r, 32, 20), material, position, null, scale, parent);
}

function tubeBetween(a, b, radius, material = bronze, parent = scene, radial = 18) {
  const start = new THREE.Vector3().copy(a), end = new THREE.Vector3().copy(b);
  const delta = new THREE.Vector3().subVectors(end, start);
  const length = delta.length();
  const g = new THREE.CylinderGeometry(radius * 0.93, radius, length, radial, 1, false);
  const m = new THREE.Mesh(g, material);
  m.position.copy(start).add(end).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), delta.normalize());
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}

function roundedSegment(a, b, r, material = bronze, parent = scene) {
  tubeBetween(a, b, r, material, parent);
  ellipsoid(r, a, new THREE.Vector3(1,1,1), material, parent);
  ellipsoid(r, b, new THREE.Vector3(1,1,1), material, parent);
}

function curvedStrip(points, radius, material, parent) {
  const curve = new THREE.CatmullRomCurve3(points);
  const g = new THREE.TubeGeometry(curve, 48, radius, 12, false);
  return mesh(g, material, null, null, null, parent);
}

const root = new THREE.Group();
scene.add(root);

/* plinth */
mesh(new THREE.CylinderGeometry(3.32, 3.48, 0.22, 64), stone, new THREE.Vector3(0, 0.02, 0));
mesh(new THREE.CylinderGeometry(2.95, 3.12, 0.27, 64), darkBronze, new THREE.Vector3(0, 0.26, 0));
mesh(new THREE.CylinderGeometry(2.72, 2.76, 0.14, 64), stone, new THREE.Vector3(0, 0.45, 0));

/* bench */
const bench = new THREE.Group();
root.add(bench);
mesh(new THREE.BoxGeometry(5.15, 0.18, 0.62), darkBronze, new THREE.Vector3(0, 1.48, 0.18), null, null, bench);
mesh(new THREE.BoxGeometry(5.15, 0.18, 0.54), bronze, new THREE.Vector3(0, 2.60, 0.67), new THREE.Euler(-0.10,0,0), null, bench);
mesh(new THREE.BoxGeometry(5.15, 0.11, 0.12), patina, new THREE.Vector3(0, 2.15, 0.61), new THREE.Euler(-0.10,0,0), null, bench);
for (const x of [-2.23, 2.23]) {
  roundedSegment(new THREE.Vector3(x, 0.57, 0.09), new THREE.Vector3(x, 1.42, 0.11), 0.12, darkBronze, bench);
  roundedSegment(new THREE.Vector3(x, 1.38, 0.11), new THREE.Vector3(x, 2.52, 0.62), 0.10, darkBronze, bench);
}
for (const x of [-1.55, 1.55]) {
  roundedSegment(new THREE.Vector3(x, 0.58, 0.08), new THREE.Vector3(x, 1.42, 0.15), 0.09, darkBronze, bench);
}

/* seated figure, slightly turned toward viewer */
const figure = new THREE.Group();
figure.rotation.y = -0.08;
root.add(figure);

/* shoes and bent legs */
ellipsoid(1, new THREE.Vector3(-0.72,0.75,0.73), new THREE.Vector3(0.43,0.22,0.71), darkBronze, figure);
ellipsoid(1, new THREE.Vector3(0.72,0.75,0.73), new THREE.Vector3(0.43,0.22,0.71), darkBronze, figure);
roundedSegment(new THREE.Vector3(-0.67,1.02,0.27), new THREE.Vector3(-0.67,1.49,0.17), 0.27, bronze, figure);
roundedSegment(new THREE.Vector3(0.67,1.02,0.27), new THREE.Vector3(0.67,1.49,0.17), 0.27, bronze, figure);
ellipsoid(1, new THREE.Vector3(-0.67,1.58,0.10), new THREE.Vector3(0.43,0.30,0.40), bronze, figure);
ellipsoid(1, new THREE.Vector3(0.67,1.58,0.10), new THREE.Vector3(0.43,0.30,0.40), bronze, figure);
roundedSegment(new THREE.Vector3(-0.67,1.64,0.05), new THREE.Vector3(-0.73,1.78,-0.48), 0.33, bronze, figure);
roundedSegment(new THREE.Vector3(0.67,1.64,0.05), new THREE.Vector3(0.73,1.78,-0.48), 0.33, bronze, figure);

/* low lap and draped coat */
ellipsoid(1, new THREE.Vector3(0,1.72,-0.10), new THREE.Vector3(1.26,0.40,0.56), bronze, figure);
ellipsoid(1, new THREE.Vector3(0,2.27,-0.39), new THREE.Vector3(1.15,0.90,0.56), bronze, figure);
ellipsoid(1, new THREE.Vector3(0,2.82,-0.54), new THREE.Vector3(0.98,0.93,0.55), bronze, figure);
ellipsoid(1, new THREE.Vector3(-0.73,2.38,-0.32), new THREE.Vector3(0.38,0.78,0.47), bronze, figure);
ellipsoid(1, new THREE.Vector3(0.73,2.38,-0.32), new THREE.Vector3(0.38,0.78,0.47), bronze, figure);

/* coat tails and folds */
curvedStrip([
  new THREE.Vector3(-0.72,2.53,-0.82), new THREE.Vector3(-0.95,2.15,-0.80),
  new THREE.Vector3(-0.82,1.62,-0.60), new THREE.Vector3(-0.58,1.37,-0.18)
], 0.075, darkBronze, figure);
curvedStrip([
  new THREE.Vector3(0.71,2.53,-0.82), new THREE.Vector3(0.91,2.12,-0.80),
  new THREE.Vector3(0.74,1.61,-0.59), new THREE.Vector3(0.48,1.36,-0.18)
], 0.075, darkBronze, figure);
for (const x of [-0.43, -0.14, 0.18, 0.49]) {
  curvedStrip([
    new THREE.Vector3(x,2.73,-1.00),
    new THREE.Vector3(x*1.1,2.22,-1.03),
    new THREE.Vector3(x*1.35,1.72,-0.69)
  ], 0.036, patina, figure);
}

/* shoulders, stooped neck, head */
ellipsoid(1, new THREE.Vector3(0,3.18,-0.62), new THREE.Vector3(1.08,0.46,0.55), bronze, figure);
roundedSegment(new THREE.Vector3(0,3.32,-0.60), new THREE.Vector3(0.03,3.57,-0.48), 0.23, darkBronze, figure);
ellipsoid(1, new THREE.Vector3(0.04,3.88,-0.40), new THREE.Vector3(0.48,0.59,0.44), bronze, figure);
ellipsoid(1, new THREE.Vector3(0.04,4.34,-0.43), new THREE.Vector3(0.49,0.18,0.46), darkBronze, figure);
ellipsoid(1, new THREE.Vector3(0.04,3.86,-0.82), new THREE.Vector3(0.32,0.28,0.10), darkBronze, figure);
ellipsoid(1, new THREE.Vector3(-0.47,3.88,-0.40), new THREE.Vector3(0.07,0.15,0.11), bronze, figure);
ellipsoid(1, new THREE.Vector3(0.55,3.88,-0.40), new THREE.Vector3(0.07,0.15,0.11), bronze, figure);

/* arms, elbows close to body, hands in lap */
roundedSegment(new THREE.Vector3(-0.87,3.12,-0.64), new THREE.Vector3(-1.00,2.40,-0.91), 0.20, bronze, figure);
roundedSegment(new THREE.Vector3(-1.00,2.40,-0.91), new THREE.Vector3(-0.55,1.95,-1.00), 0.17, bronze, figure);
roundedSegment(new THREE.Vector3(0.87,3.12,-0.64), new THREE.Vector3(1.00,2.40,-0.91), 0.20, bronze, figure);
roundedSegment(new THREE.Vector3(1.00,2.40,-0.91), new THREE.Vector3(0.47,1.98,-1.02), 0.17, bronze, figure);

ellipsoid(1, new THREE.Vector3(-0.37,1.91,-1.08), new THREE.Vector3(0.26,0.14,0.19), bronze, figure);
ellipsoid(1, new THREE.Vector3(0.34,1.91,-1.08), new THREE.Vector3(0.26,0.14,0.19), bronze, figure);
for (const x of [-0.49,-0.39,-0.29,0.22,0.32,0.42]) {
  roundedSegment(new THREE.Vector3(x,1.93,-1.21), new THREE.Vector3(x+(x<0?0.05:-0.05),1.82,-1.28), 0.032, darkBronze, figure);
}

/* subtle collar and weathering accents */
curvedStrip([
  new THREE.Vector3(-0.55,3.15,-1.00), new THREE.Vector3(0,2.80,-1.13),
  new THREE.Vector3(0.55,3.15,-1.00)
], 0.052, darkBronze, figure);
ellipsoid(1, new THREE.Vector3(-0.80,2.99,-1.00), new THREE.Vector3(0.10,0.20,0.04), patina, figure);
ellipsoid(1, new THREE.Vector3(0.70,2.56,-1.02), new THREE.Vector3(0.12,0.28,0.04), patina, figure);
ellipsoid(1, new THREE.Vector3(-0.25,4.29,-0.72), new THREE.Vector3(0.18,0.045,0.09), patina, figure);

/* ground */
mesh(new THREE.CircleGeometry(18, 96), groundMat, new THREE.Vector3(0,-0.10,0), new THREE.Euler(-Math.PI/2,0,0));

const hemi = new THREE.HemisphereLight(0xa6c3b6, 0x1b1813, 1.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffd8a4, 4.0);
key.position.set(4.5, 7.5, 5.5);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -4;
key.shadow.bias = -0.0003;
scene.add(key);

const rim = new THREE.DirectionalLight(0x789f95, 2.1);
rim.position.set(-5, 4, -5);
scene.add(rim);

const warm = new THREE.PointLight(0xd49454, 16, 10, 2);
warm.position.set(-2.7, 3.8, 3.2);
scene.add(warm);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
