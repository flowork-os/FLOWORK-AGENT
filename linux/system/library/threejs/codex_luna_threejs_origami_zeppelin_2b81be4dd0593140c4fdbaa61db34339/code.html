<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Origami Zeppelin</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9d2c4}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9d2c4);
scene.fog = new THREE.Fog(0xd9d2c4, 16, 30);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(9.5, 5.2, 10.5);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 7;
controls.maxDistance = 22;
controls.target.set(0, 0, 0);

scene.add(new THREE.HemisphereLight(0xfff8e9, 0x766d61, 2.2));

const key = new THREE.DirectionalLight(0xfff3d8, 4.2);
key.position.set(5, 9, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -10;
key.shadow.camera.right = 10;
key.shadow.camera.top = 10;
key.shadow.camera.bottom = -10;
key.shadow.camera.near = 1;
key.shadow.camera.far = 30;
key.shadow.bias = -0.00025;
scene.add(key);

const rim = new THREE.DirectionalLight(0xb6c9d6, 1.35);
rim.position.set(-8, 4, -8);
scene.add(rim);

const paper = [
  new THREE.MeshStandardMaterial({color:0xf3ead7, roughness:0.82, metalness:0, side:THREE.DoubleSide}),
  new THREE.MeshStandardMaterial({color:0xe7dbc5, roughness:0.86, metalness:0, side:THREE.DoubleSide}),
  new THREE.MeshStandardMaterial({color:0xf8f0df, roughness:0.8, metalness:0, side:THREE.DoubleSide}),
  new THREE.MeshStandardMaterial({color:0xd8c9b0, roughness:0.9, metalness:0, side:THREE.DoubleSide}),
  new THREE.MeshStandardMaterial({color:0xc7b79e, roughness:0.92, metalness:0, side:THREE.DoubleSide})
];

function meshFromTriangles(triangles, materials = paper) {
  const positions = [];
  for (const t of triangles) {
    positions.push(
      t[0].x,t[0].y,t[0].z,
      t[1].x,t[1].y,t[1].z,
      t[2].x,t[2].y,t[2].z
    );
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.computeVertexNormals();
  triangles.forEach((t,i) => geometry.addGroup(i * 3, 3, t[3] ?? (i % materials.length)));
  const mesh = new THREE.Mesh(geometry, materials);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function v(x,y,z){ return new THREE.Vector3(x,y,z); }

function makeHull() {
  const xs = [-4.85,-4.48,-3.65,-2.2,0,2.0,3.45,4.35,4.8];
  const rs = [0.05,0.72,1.23,1.54,1.66,1.61,1.38,0.78,0.05];
  const sides = 8;
  const rings = [];
  for (let i=0;i<xs.length;i++) {
    const ring = [];
    for (let j=0;j<sides;j++) {
      const a = Math.PI/8 + j * Math.PI*2/sides;
      ring.push(v(xs[i], Math.cos(a)*rs[i], Math.sin(a)*rs[i]*0.92));
    }
    rings.push(ring);
  }

  const tris = [];
  for (let i=0;i<rings.length-1;i++) {
    for (let j=0;j<sides;j++) {
      const a = rings[i][j];
      const b = rings[i][(j+1)%sides];
      const c = rings[i+1][(j+1)%sides];
      const d = rings[i+1][j];
      const shade = (j + i * 2) % 5;
      if ((i+j)%2===0) {
        tris.push([a,b,c,shade], [a,c,d,(shade+1)%5]);
      } else {
        tris.push([a,b,d,(shade+1)%5], [b,c,d,shade]);
      }
    }
  }

  const front = v(xs[0],0,0);
  const rear = v(xs[xs.length-1],0,0);
  for (let j=0;j<sides;j++) {
    tris.push([front,rings[0][(j+1)%sides],rings[0][j],2]);
    tris.push([rear,rings[rings.length-1][j],rings[rings.length-1][(j+1)%sides],1]);
  }
  return meshFromTriangles(tris);
}

const airship = new THREE.Group();
airship.add(makeHull());

function makeTailFin(axis, sign) {
  const s = sign;
  let tris;
  if (axis === "vertical") {
    const a=v(-4.35,0.34*s,0);
    const b=v(-3.2,0.66*s,0);
    const tip=v(-4.72,2.15*s,0);
    const ridge=v(-4.25,1.02*s,0.075*s);
    tris=[
      [a,b,ridge,1],[b,tip,ridge,2],[tip,a,ridge,0],
      [a,ridge,tip,3],[a,tip,b,1]
    ];
  } else {
    const a=v(-4.35,0,0.34*s);
    const b=v(-3.2,0,0.66*s);
    const tip=v(-4.72,0,2.15*s);
    const ridge=v(-4.25,0,1.02*s);
    tris=[
      [a,b,ridge,1],[b,tip,ridge,2],[tip,a,ridge,0],
      [a,ridge,tip,3],[a,tip,b,1]
    ];
  }
  return meshFromTriangles(tris);
}

airship.add(makeTailFin("vertical",1));
airship.add(makeTailFin("vertical",-1));
airship.add(makeTailFin("horizontal",1));
airship.add(makeTailFin("horizontal",-1));

function beamBetween(a,b,width,depth,material) {
  const mid = a.clone().add(b).multiplyScalar(0.5);
  const len = a.distanceTo(b);
  const geom = new THREE.BoxGeometry(width, len, depth);
  const m = new THREE.Mesh(geom, material);
  m.position.copy(mid);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), b.clone().sub(a).normalize());
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

function makeGondola() {
  const A=v(-1.48,-1.52,-0.48), B=v(1.28,-1.52,-0.48);
  const C=v(1.05,-2.22,-0.36), D=v(-1.12,-2.22,-0.36);
  const E=v(-1.48,-1.52,0.48), F=v(1.28,-1.52,0.48);
  const G=v(1.05,-2.22,0.36), H=v(-1.12,-2.22,0.36);
  const roof=v(-0.1,-1.34,0);
  const tris=[
    [A,B,roof,2],[B,F,roof,0],[F,E,roof,1],[E,A,roof,2],
    [A,D,C,1],[A,C,B,0],
    [E,F,G,2],[E,G,H,1],
    [A,E,H,3],[A,H,D,1],
    [B,C,G,0],[B,G,F,2],
    [D,H,G,3],[D,G,C,4]
  ];
  return meshFromTriangles(tris);
}

const gondola = makeGondola();
airship.add(gondola);

const supportMaterial = new THREE.MeshStandardMaterial({
  color:0xd8c9b1, roughness:0.86, side:THREE.DoubleSide
});

airship.add(beamBetween(v(-1.05,-1.02,-0.72),v(-0.93,-1.55,-0.36),0.085,0.12,supportMaterial));
airship.add(beamBetween(v(0.92,-1.02,-0.72),v(0.83,-1.55,-0.36),0.085,0.12,supportMaterial));
airship.add(beamBetween(v(-1.05,-1.02,0.72),v(-0.93,-1.55,0.36),0.085,0.12,supportMaterial));
airship.add(beamBetween(v(0.92,-1.02,0.72),v(0.83,-1.55,0.36),0.085,0.12,supportMaterial));

function makeWindow(z, x, y, scaleX) {
  const mat = new THREE.MeshStandardMaterial({
    color:0x6f6251, roughness:0.72, metalness:0, side:THREE.DoubleSide
  });
  const geom = new THREE.PlaneGeometry(scaleX,0.22);
  const w = new THREE.Mesh(geom,mat);
  w.position.set(x,y,z);
  w.rotation.x = Math.PI/2;
  w.rotation.y = z > 0 ? 0 : Math.PI;
  w.castShadow = true;
  return w;
}
airship.add(makeWindow(0.486,-0.66,-1.78,0.38));
airship.add(makeWindow(0.486,0.05,-1.78,0.38));
airship.add(makeWindow(0.486,0.76,-1.78,0.34));
airship.add(makeWindow(-0.486,-0.66,-1.78,0.38));
airship.add(makeWindow(-0.486,0.05,-1.78,0.38));
airship.add(makeWindow(-0.486,0.76,-1.78,0.34));

const creaseMat = new THREE.LineBasicMaterial({color:0x9b8b72, transparent:true, opacity:0.48});
function crease(a,b) {
  const g = new THREE.BufferGeometry().setFromPoints([a,b]);
  const l = new THREE.Line(g,creaseMat);
  airship.add(l);
}
crease(v(-4.47,0.52,0),v(-4.47,-0.52,0));
crease(v(-1.2,1.57,0),v(0,1.68,0));
crease(v(0,1.68,0),v(1.25,1.57,0));
crease(v(-1.45,-1.52,0),v(-0.1,-1.34,0));
crease(v(-0.1,-1.34,0),v(1.28,-1.52,0));

airship.rotation.y = -0.12;
scene.add(airship);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(15,64),
  new THREE.MeshStandardMaterial({color:0xc7bfb1,roughness:1})
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -2.55;
ground.receiveShadow = true;
scene.add(ground);

const shadowDisc = new THREE.Mesh(
  new THREE.CircleGeometry(3.8,64),
  new THREE.MeshBasicMaterial({color:0x8f877c,transparent:true,opacity:0.12})
);
shadowDisc.rotation.x = -Math.PI/2;
shadowDisc.position.set(0,-2.535,0);
shadowDisc.scale.set(1.55,0.38,1);
scene.add(shadowDisc);

window.addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  airship.position.y = Math.sin(t*0.8)*0.055;
  airship.rotation.z = Math.sin(t*0.55)*0.008;
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
