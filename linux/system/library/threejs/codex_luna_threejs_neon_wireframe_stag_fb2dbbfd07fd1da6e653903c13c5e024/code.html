<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Wireframe Stag</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010005);
scene.fog = new THREE.FogExp2(0x010005, 0.018);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8.2, 4.6, 10.8);
camera.lookAt(0, 3.05, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 6;
controls.maxDistance = 18;
controls.target.set(-0.15, 3.05, 0);

scene.add(new THREE.HemisphereLight(0x26052f, 0x000008, 0.42));

const magenta = new THREE.MeshStandardMaterial({
  color: 0xff168f,
  emissive: 0xd50078,
  emissiveIntensity: 3.6,
  roughness: 0.28,
  metalness: 0.35
});
const cyan = new THREE.MeshStandardMaterial({
  color: 0x10efff,
  emissive: 0x00cce8,
  emissiveIntensity: 4.8,
  roughness: 0.22,
  metalness: 0.35
});
const violet = new THREE.MeshStandardMaterial({
  color: 0xa82cff,
  emissive: 0x6814e8,
  emissiveIntensity: 4.0,
  roughness: 0.25,
  metalness: 0.3
});
const whiteNode = new THREE.MeshBasicMaterial({ color: 0xffd9fa });
const cyanNode = new THREE.MeshBasicMaterial({ color: 0xbfffff });
const glowMagenta = new THREE.MeshBasicMaterial({
  color: 0xff008c,
  transparent: true,
  opacity: 0.075,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const glowCyan = new THREE.MeshBasicMaterial({
  color: 0x00dfff,
  transparent: true,
  opacity: 0.095,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const stag = new THREE.Group();
scene.add(stag);

const up = new THREE.Vector3(0, 1, 0);
const nodeGeometry = new THREE.SphereGeometry(0.052, 8, 6);
const glowNodeGeometry = new THREE.SphereGeometry(0.135, 8, 6);

function addNode(point, accent = false, size = 1) {
  const core = new THREE.Mesh(accent ? new THREE.SphereGeometry(0.058 * size, 8, 6) : nodeGeometry, accent ? cyanNode : whiteNode);
  core.position.copy(point);
  stag.add(core);
  const aura = new THREE.Mesh(accent ? new THREE.SphereGeometry(0.16 * size, 8, 6) : glowNodeGeometry, accent ? glowCyan : glowMagenta);
  aura.position.copy(point);
  stag.add(aura);
}

function addTube(a, b, material = magenta, radius = 0.026, accent = false) {
  const start = new THREE.Vector3().copy(a);
  const end = new THREE.Vector3().copy(b);
  const delta = new THREE.Vector3().subVectors(end, start);
  const length = delta.length();
  if (length < 0.001 || !Number.isFinite(length)) return;
  const midpoint = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
  const direction = delta.normalize();

  const halo = new THREE.Mesh(
    new THREE.CylinderGeometry(radius * 2.8, radius * 2.8, length, 8, 1, false),
    accent ? glowCyan : glowMagenta
  );
  halo.position.copy(midpoint);
  halo.quaternion.setFromUnitVectors(up, direction);
  stag.add(halo);

  const tube = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, length, 7, 1, false),
    material
  );
  tube.position.copy(midpoint);
  tube.quaternion.setFromUnitVectors(up, direction);
  tube.castShadow = true;
  stag.add(tube);
}

function connect(a, b, accent = false, radius = 0.026) {
  addTube(a, b, accent ? cyan : magenta, radius, accent);
}

function addChain(points, accent = false, radius = 0.03, makeNodes = true) {
  for (let i = 0; i < points.length - 1; i++) connect(points[i], points[i + 1], accent, radius);
  if (makeNodes) for (const point of points) addNode(point, accent, 1);
}

function ringCage(center, radiusY, radiusZ, count, accent = false) {
  const points = [];
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2;
    points.push(new THREE.Vector3(
      center.x,
      center.y + Math.cos(angle) * radiusY,
      center.z + Math.sin(angle) * radiusZ
    ));
  }
  for (let i = 0; i < count; i++) {
    connect(points[i], points[(i + 1) % count], accent, 0.025);
  }
  return points;
}

const bodyRings = [
  { x: -0.92, y: 2.86, ry: 0.64, rz: 0.58 },
  { x: -0.36, y: 2.86, ry: 0.83, rz: 0.74 },
  { x: 0.48, y: 2.88, ry: 0.78, rz: 0.72 },
  { x: 1.22, y: 2.91, ry: 0.57, rz: 0.56 }
];
const bodyPoints = bodyRings.map(r => ringCage(new THREE.Vector3(r.x, r.y, 0), r.ry, r.rz, 8));
for (let r = 0; r < bodyPoints.length - 1; r++) {
  for (let i = 0; i < 8; i++) connect(bodyPoints[r][i], bodyPoints[r + 1][i], false, 0.027);
}
for (let i = 0; i < 8; i++) {
  connect(bodyPoints[0][i], bodyPoints[2][(i + 1) % 8], false, 0.018);
  connect(bodyPoints[1][i], bodyPoints[3][(i + 1) % 8], false, 0.018);
}
for (const ring of bodyPoints) for (const point of ring) addNode(point, false, 0.8);

const spine = [
  new THREE.Vector3(-1.18, 3.42, 0),
  new THREE.Vector3(-0.48, 3.63, 0),
  new THREE.Vector3(0.28, 3.61, 0),
  new THREE.Vector3(1.0, 3.45, 0),
  new THREE.Vector3(1.48, 3.19, 0)
];
addChain(spine, true, 0.041, true);

const ribs = [
  [new THREE.Vector3(-0.83, 3.38, -0.54), new THREE.Vector3(-0.83, 2.43, -0.54)],
  [new THREE.Vector3(-0.2, 3.62, -0.71), new THREE.Vector3(-0.2, 2.16, -0.68)],
  [new THREE.Vector3(0.48, 3.58, -0.68), new THREE.Vector3(0.48, 2.22, -0.66)],
  [new THREE.Vector3(1.08, 3.4, -0.5), new THREE.Vector3(1.08, 2.45, -0.5)]
];
for (const rib of ribs) connect(rib[0], rib[1], true, 0.018);

const legs = [
  [new THREE.Vector3(-0.72, 2.46, 0.48), new THREE.Vector3(-0.78, 1.38, 0.51), new THREE.Vector3(-0.95, 0.27, 0.48)],
  [new THREE.Vector3(-0.45, 2.38, -0.49), new THREE.Vector3(-0.28, 1.34, -0.52), new THREE.Vector3(-0.42, 0.25, -0.5)],
  [new THREE.Vector3(0.9, 2.47, 0.49), new THREE.Vector3(1.18, 1.32, 0.51), new THREE.Vector3(1.05, 0.24, 0.48)],
  [new THREE.Vector3(1.16, 2.4, -0.47), new THREE.Vector3(1.45, 1.28, -0.5), new THREE.Vector3(1.36, 0.24, -0.48)]
];
for (const leg of legs) {
  addChain(leg, true, 0.041, true);
  const knee = leg[1];
  const hoof = leg[2];
  connect(new THREE.Vector3(hoof.x - 0.18, hoof.y, hoof.z), new THREE.Vector3(hoof.x + 0.18, hoof.y, hoof.z), false, 0.035);
}

const neckRings = [
  { center: new THREE.Vector3(-0.86, 3.47, 0), rx: 0.42, rz: 0.48 },
  { center: new THREE.Vector3(-1.17, 4.02, 0), rx: 0.38, rz: 0.4 },
  { center: new THREE.Vector3(-1.43, 4.55, 0), rx: 0.31, rz: 0.34 },
  { center: new THREE.Vector3(-1.58, 4.86, 0), rx: 0.27, rz: 0.29 }
];
const neckPoints = [];
for (const ring of neckRings) {
  const ringPoints = [
    new THREE.Vector3(ring.center.x - ring.rx, ring.center.y, -ring.rz),
    new THREE.Vector3(ring.center.x + ring.rx, ring.center.y, -ring.rz),
    new THREE.Vector3(ring.center.x + ring.rx, ring.center.y, ring.rz),
    new THREE.Vector3(ring.center.x - ring.rx, ring.center.y, ring.rz)
  ];
  neckPoints.push(ringPoints);
  for (let i = 0; i < 4; i++) connect(ringPoints[i], ringPoints[(i + 1) % 4], false, 0.03);
  for (const point of ringPoints) addNode(point, false, 0.85);
}
for (let r = 0; r < neckPoints.length - 1; r++) {
  for (let i = 0; i < 4; i++) connect(neckPoints[r][i], neckPoints[r + 1][i], false, 0.03);
  connect(neckPoints[r][0], neckPoints[r + 1][2], false, 0.019);
  connect(neckPoints[r][1], neckPoints[r + 1][3], false, 0.019);
}

const head = [
  new THREE.Vector3(-1.84, 4.9, -0.3),
  new THREE.Vector3(-2.45, 4.77, -0.28),
  new THREE.Vector3(-2.72, 4.52, -0.2),
  new THREE.Vector3(-2.35, 4.34, -0.29),
  new THREE.Vector3(-1.77, 4.54, -0.32),
  new THREE.Vector3(-1.84, 4.9, 0.3),
  new THREE.Vector3(-2.45, 4.77, 0.28),
  new THREE.Vector3(-2.72, 4.52, 0.2),
  new THREE.Vector3(-2.35, 4.34, 0.29),
  new THREE.Vector3(-1.77, 4.54, 0.32)
];
const headEdges = [[0,1],[1,2],[2,3],[3,4],[4,0],[5,6],[6,7],[7,8],[8,9],[9,5],[0,5],[1,6],[2,7],[3,8],[4,9],[0,6],[1,7],[2,8],[3,9]];
for (const edge of headEdges) connect(head[edge[0]], head[edge[1]], false, 0.027);
for (let i = 0; i < head.length; i++) addNode(head[i], i === 2 || i === 7, 0.95);
addTube(new THREE.Vector3(-2.57, 4.68, -0.25), new THREE.Vector3(-2.57, 4.68, 0.25), cyan, 0.035, true);
addNode(new THREE.Vector3(-2.55, 4.7, -0.3), true, 1.25);
addNode(new THREE.Vector3(-2.55, 4.7, 0.3), true, 1.25);

const earNear = [
  new THREE.Vector3(-1.7, 4.92, -0.27),
  new THREE.Vector3(-1.52, 5.42, -0.25),
  new THREE.Vector3(-1.9, 5.15, -0.25)
];
const earFar = earNear.map(p => new THREE.Vector3(p.x, p.y, -p.z));
addChain(earNear, false, 0.026, true);
addChain(earFar, false, 0.026, true);

function antler(side) {
  const z = side * 0.28;
  const base = new THREE.Vector3(-1.72, 4.97, z);
  const crown = [
    base,
    new THREE.Vector3(-1.48, 5.45, z),
    new THREE.Vector3(-1.23, 5.92, z),
    new THREE.Vector3(-1.18, 6.48, z),
    new THREE.Vector3(-0.96, 6.92, z),
    new THREE.Vector3(-0.57, 7.24, z)
  ];
  addChain(crown, false, 0.034, true);

  const branches = [
    [crown[1], new THREE.Vector3(-1.78, 5.72, z), new THREE.Vector3(-2.04, 6.12, z), new THREE.Vector3(-2.02, 6.48, z)],
    [crown[2], new THREE.Vector3(-1.64, 6.1, z), new THREE.Vector3(-1.96, 6.47, z), new THREE.Vector3(-2.28, 6.65, z)],
    [crown[3], new THREE.Vector3(-1.48, 6.7, z), new THREE.Vector3(-1.7, 7.11, z), new THREE.Vector3(-1.98, 7.37, z)],
    [crown[4], new THREE.Vector3(-1.0, 7.15, z), new THREE.Vector3(-1.16, 7.54, z), new THREE.Vector3(-1.37, 7.78, z)],
    [crown[4], new THREE.Vector3(-0.46, 7.43, z), new THREE.Vector3(-0.26, 7.72, z), new THREE.Vector3(0.02, 7.86, z)]
  ];
  for (const branch of branches) addChain(branch, false, 0.027, true);

  const inner = crown.map(p => new THREE.Vector3(p.x + 0.13, p.y - 0.13, -z));
  for (let i = 0; i < inner.length - 1; i++) connect(inner[i], inner[i + 1], true, 0.018);
  for (let i = 0; i < crown.length; i += 2) connect(crown[i], inner[i], true, 0.018);

  const crossPairs = [
    [new THREE.Vector3(-1.78, 5.72, z), new THREE.Vector3(-1.62, 5.7, -z)],
    [new THREE.Vector3(-1.64, 6.1, z), new THREE.Vector3(-1.49, 6.08, -z)],
    [new THREE.Vector3(-1.48, 6.7, z), new THREE.Vector3(-1.33, 6.68, -z)],
    [new THREE.Vector3(-1.0, 7.15, z), new THREE.Vector3(-0.87, 7.13, -z)],
    [new THREE.Vector3(-0.46, 7.43, z), new THREE.Vector3(-0.33, 7.41, -z)]
  ];
  for (const pair of crossPairs) connect(pair[0], pair[1], true, 0.016);
}
antler(-1);
antler(1);

const antlerBridge = [
  new THREE.Vector3(-1.72, 5.05, -0.28),
  new THREE.Vector3(-1.45, 5.5, -0.28),
  new THREE.Vector3(-1.23, 5.92, -0.28),
  new THREE.Vector3(-1.0, 6.35, -0.28)
];
for (let i = 0; i < antlerBridge.length; i++) {
  const point = antlerBridge[i];
  const opposite = new THREE.Vector3(point.x, point.y, -point.z);
  connect(point, opposite, true, 0.017);
}

const rimLight = new THREE.PointLight(0xff087d, 8, 8, 2);
rimLight.position.set(-2.5, 5.6, 2.2);
scene.add(rimLight);

const cyanLight = new THREE.PointLight(0x00cfff, 7, 7, 2);
cyanLight.position.set(1.2, 2.4, -2.4);
scene.add(cyanLight);

const violetLight = new THREE.PointLight(0x651cff, 5, 9, 2);
violetLight.position.set(1.5, 5.5, 1.5);
scene.add(violetLight);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  stag.position.y = Math.sin(elapsed * 1.15) * 0.025;
  controls.update();
  renderer.render(scene, camera);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
