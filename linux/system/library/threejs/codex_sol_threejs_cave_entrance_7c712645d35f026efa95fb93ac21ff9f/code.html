<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Cave Entrance</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101514; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17201e);
scene.fog = new THREE.FogExp2(0x17201e, 0.024);

const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 120);
camera.position.set(10.5, 6.4, 16.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.7, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.32;
controls.minDistance = 8;
controls.maxDistance = 31;
controls.maxPolarAngle = Math.PI * 0.48;

let seed = 17341;
function random() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function range(a, b) {
  return a + (b - a) * random();
}

const rockMaterials = [
  new THREE.MeshStandardMaterial({ color: 0x4f5147, roughness: 0.79, metalness: 0.02 }),
  new THREE.MeshStandardMaterial({ color: 0x5d5b4f, roughness: 0.74, metalness: 0.015 }),
  new THREE.MeshStandardMaterial({ color: 0x414740, roughness: 0.68, metalness: 0.025 }),
  new THREE.MeshStandardMaterial({ color: 0x656054, roughness: 0.82, metalness: 0.01 })
];
const dampRockMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x303b37,
  roughness: 0.38,
  metalness: 0.02,
  clearcoat: 0.24,
  clearcoatRoughness: 0.34
});
const deepRockMaterial = new THREE.MeshStandardMaterial({
  color: 0x202824,
  roughness: 0.61,
  metalness: 0.01
});

function makeRockGeometry(detail = 1, irregularity = 0.18) {
  const geometry = new THREE.IcosahedronGeometry(1, detail);
  const position = geometry.attributes.position;
  const direction = new THREE.Vector3();

  for (let i = 0; i < position.count; i++) {
    direction.fromBufferAttribute(position, i).normalize();
    const wave =
      Math.sin(direction.x * 5.3 + direction.y * 2.1) * 0.045 +
      Math.sin(direction.z * 7.1 - direction.x * 2.7) * 0.035;
    const factor = 1 + range(-irregularity, irregularity) + wave;
    position.setXYZ(
      i,
      position.getX(i) * factor,
      position.getY(i) * factor,
      position.getZ(i) * factor
    );
  }

  position.needsUpdate = true;
  geometry.computeVertexNormals();
  geometry.computeBoundingSphere();
  return geometry;
}

const rockGeometryFine = makeRockGeometry(2, 0.12);
const rockGeometryRough = makeRockGeometry(1, 0.19);
const rubbleGeometry = makeRockGeometry(1, 0.24);

function createRock(x, y, z, sx, sy, sz, material, rough = false) {
  const mesh = new THREE.Mesh(rough ? rockGeometryRough : rockGeometryFine, material);
  mesh.position.set(x, y, z);
  mesh.scale.set(sx, sy, sz);
  mesh.rotation.set(range(-0.28, 0.28), range(-Math.PI, Math.PI), range(-0.22, 0.22));
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function openingHalfWidth(y) {
  if (y <= 1.45) return 2.22;
  if (y >= 4.45) return 0;
  const t = (y - 1.45) / 3.0;
  return 2.22 * Math.sqrt(Math.max(0, 1 - t * t));
}

const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0x31382f,
  roughness: 0.91,
  metalness: 0
});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 70, 1, 1), groundMaterial);
ground.rotation.x = -Math.PI / 2;
ground.position.set(0, -0.08, 1.5);
ground.receiveShadow = true;
scene.add(ground);

const approachMaterial = new THREE.MeshStandardMaterial({
  color: 0x4b493c,
  roughness: 0.96,
  metalness: 0
});
const approach = new THREE.Mesh(new THREE.PlaneGeometry(7.5, 14), approachMaterial);
approach.rotation.x = -Math.PI / 2;
approach.position.set(0, -0.065, 3.4);
approach.receiveShadow = true;
scene.add(approach);

const cliffBack = new THREE.Mesh(
  new THREE.BoxGeometry(16, 8.7, 2.4),
  new THREE.MeshStandardMaterial({ color: 0x40443d, roughness: 0.92 })
);
cliffBack.position.set(0, 4.15, -1.15);
cliffBack.receiveShadow = true;
cliffBack.castShadow = true;
scene.add(cliffBack);

for (let row = 0; row < 7; row++) {
  const y = 0.55 + row * 1.13;
  for (let col = -6; col <= 6; col++) {
    const x = col * 1.18 + (row % 2 ? 0.52 : 0) + range(-0.25, 0.25);
    if (Math.abs(x) < openingHalfWidth(y) + 0.62 && y < 5.05) continue;

    const edge = Math.abs(x) > 5.6;
    const sx = range(0.68, 1.15) * (edge ? 1.15 : 1);
    const sy = range(0.55, 0.95);
    const sz = range(0.68, 1.28);
    const mat = rockMaterials[Math.floor(random() * rockMaterials.length)];
    createRock(x, y + range(-0.18, 0.18), range(-0.05, 0.35), sx, sy, sz, mat, true);
  }
}

for (let i = 0; i < 24; i++) {
  const side = random() < 0.5 ? -1 : 1;
  createRock(
    side * range(5.8, 8.4),
    range(0.25, 7.6),
    range(-0.55, 0.8),
    range(0.9, 1.65),
    range(0.7, 1.4),
    range(0.8, 1.6),
    rockMaterials[Math.floor(random() * rockMaterials.length)],
    true
  );
}

function makeOpeningShape(width, springY, topY) {
  const shape = new THREE.Shape();
  shape.moveTo(-width, 0);
  shape.lineTo(-width, springY);
  shape.bezierCurveTo(-width, springY + 1.35, -width * 0.58, topY, 0, topY);
  shape.bezierCurveTo(width * 0.58, topY, width, springY + 1.35, width, springY);
  shape.lineTo(width, 0);
  shape.closePath();
  return shape;
}

const openingShape = makeOpeningShape(2.18, 1.45, 4.42);
const openingGeometry = new THREE.ShapeGeometry(openingShape, 36);
const openingMaterial = new THREE.MeshBasicMaterial({
  color: 0x030706,
  side: THREE.DoubleSide,
  fog: false
});
const opening = new THREE.Mesh(openingGeometry, openingMaterial);
opening.position.z = 0.46;
scene.add(opening);

const innerOpening = new THREE.Mesh(
  new THREE.ShapeGeometry(makeOpeningShape(1.8, 1.35, 3.88), 32),
  new THREE.MeshBasicMaterial({ color: 0x000201, side: THREE.DoubleSide, fog: false })
);
innerOpening.position.set(0, 0.02, -0.05);
scene.add(innerOpening);

const tunnelFloor = new THREE.Mesh(
  new THREE.PlaneGeometry(4.25, 7.5),
  new THREE.MeshStandardMaterial({ color: 0x161b17, roughness: 0.74 })
);
tunnelFloor.rotation.x = -Math.PI / 2;
tunnelFloor.position.set(0, 0.015, -2.4);
tunnelFloor.receiveShadow = true;
scene.add(tunnelFloor);

function makeArchBand(innerRx, innerRy, thickness, springY, segments, depthOffset, material) {
  const positions = [];
  const colors = [];
  const indices = [];
  const color = new THREE.Color();
  const inner = [];
  const outer = [];

  for (let i = 0; i <= segments; i++) {
    const angle = Math.PI - (i / segments) * Math.PI;
    const noise = Math.sin(i * 2.37) * 0.035 + Math.sin(i * 0.91) * 0.025;
    const ix = Math.cos(angle) * innerRx * (1 + noise);
    const iy = springY + Math.sin(angle) * innerRy * (1 + noise * 0.6);
    const ox = Math.cos(angle) * (innerRx + thickness) * (1 + noise * 0.55);
    const oy = springY + Math.sin(angle) * (innerRy + thickness * 0.72);
    inner.push(new THREE.Vector3(ix, iy, depthOffset + range(-0.025, 0.025)));
    outer.push(new THREE.Vector3(ox, oy, depthOffset + range(-0.025, 0.025)));
  }

  for (let i = 0; i <= segments; i++) {
    positions.push(inner[i].x, inner[i].y, inner[i].z);
    positions.push(outer[i].x, outer[i].y, outer[i].z);
    const shade = 0.74 + 0.2 * Math.sin((i / segments) * Math.PI);
    color.setRGB(0.29 * shade, 0.31 * shade, 0.28 * shade);
    colors.push(color.r, color.g, color.b, color.r * 1.06, color.g * 1.04, color.b);
  }

  for (let i = 0; i < segments; i++) {
    const a = i * 2;
    const b = a + 1;
    const c = a + 2;
    const d = a + 3;
    indices.push(a, b, c, b, d, c);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();

  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

const bandMaterialOuter = new THREE.MeshStandardMaterial({
  vertexColors: true,
  roughness: 0.67,
  metalness: 0.015,
  side: THREE.DoubleSide
});
const bandMaterialWet = new THREE.MeshPhysicalMaterial({
  vertexColors: true,
  roughness: 0.34,
  metalness: 0.02,
  clearcoat: 0.3,
  clearcoatRoughness: 0.28,
  side: THREE.DoubleSide
});

makeArchBand(2.18, 2.95, 0.52, 1.45, 36, 0.58, bandMaterialWet);
makeArchBand(2.68, 3.28, 0.6, 1.42, 36, 0.38, bandMaterialOuter);
makeArchBand(3.22, 3.63, 0.58, 1.38, 36, 0.17, bandMaterialOuter);

for (const side of [-1, 1]) {
  for (let i = 0; i < 5; i++) {
    const y = 0.42 + i * 0.7;
    createRock(
      side * range(2.18, 2.45),
      y,
      range(0.5, 0.82),
      range(0.48, 0.72),
      range(0.48, 0.7),
      range(0.5, 0.86),
      i < 3 ? dampRockMaterial : deepRockMaterial,
      true
    );
  }
}

createRock(-1.55, 4.55, 0.86, 1.65, 0.52, 1.25, rockMaterials[2], true);
createRock(0.05, 4.72, 1.08, 2.0, 0.5, 1.48, dampRockMaterial, true);
createRock(1.65, 4.52, 0.9, 1.55, 0.48, 1.3, rockMaterials[2], true);
createRock(-0.7, 5.13, 0.38, 1.65, 0.7, 1.1, rockMaterials[0], true);
createRock(1.1, 5.12, 0.32, 1.5, 0.72, 1.08, rockMaterials[1], true);

for (let i = 0; i < 48; i++) {
  const angle = range(0, Math.PI * 2);
  const distance = range(2.35, 7.8);
  let x = Math.cos(angle) * distance;
  let z = Math.sin(angle) * distance + 2.2;

  if (z < 0.7 && Math.abs(x) < 2.0) {
    x += x < 0 ? -1.8 : 1.8;
  }

  const size = range(0.11, 0.38);
  const rubble = new THREE.Mesh(
    rubbleGeometry,
    rockMaterials[Math.floor(random() * rockMaterials.length)]
  );
  rubble.position.set(x, size * range(0.55, 0.9), z);
  rubble.scale.set(size * range(0.8, 1.5), size * range(0.45, 0.9), size * range(0.75, 1.35));
  rubble.rotation.set(range(-0.6, 0.6), range(-Math.PI, Math.PI), range(-0.5, 0.5));
  rubble.castShadow = true;
  rubble.receiveShadow = true;
  scene.add(rubble);
}

createRock(-3.05, 0.48, 1.02, 0.9, 0.55, 0.78, rockMaterials[1], true);
createRock(3.35, 0.55, 0.55, 1.12, 0.68, 0.92, rockMaterials[0], true);
createRock(-4.25, 0.72, 2.25, 1.28, 0.82, 1.05, rockMaterials[2], true);
createRock(2.55, 0.32, 3.1, 0.72, 0.38, 0.62, rockMaterials[3], true);

const puddleMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x263d38,
  roughness: 0.12,
  metalness: 0.02,
  transmission: 0.08,
  transparent: true,
  opacity: 0.82,
  clearcoat: 1,
  clearcoatRoughness: 0.08,
  depthWrite: false
});

function createPuddle(x, z, sx, sz) {
  const puddle = new THREE.Mesh(new THREE.CircleGeometry(1, 40), puddleMaterial);
  puddle.rotation.x = -Math.PI / 2;
  puddle.position.set(x, -0.035, z);
  puddle.scale.set(sx, sz, 1);
  puddle.receiveShadow = true;
  scene.add(puddle);
}
createPuddle(-1.12, 2.1, 0.78, 0.34);
createPuddle(1.48, 3.65, 1.05, 0.42);
createPuddle(-2.55, 4.9, 0.66, 0.25);

for (let i = 0; i < 30; i++) {
  const blade = new THREE.Mesh(
    new THREE.ConeGeometry(range(0.025, 0.055), range(0.18, 0.42), 5),
    new THREE.MeshStandardMaterial({
      color: random() < 0.5 ? 0x263d29 : 0x34472e,
      roughness: 0.9
    })
  );
  const side = random() < 0.5 ? -1 : 1;
  blade.position.set(side * range(2.7, 7), range(0.08, 0.16), range(0.2, 5.5));
  blade.rotation.z = range(-0.22, 0.22);
  blade.castShadow = true;
  scene.add(blade);
}

const hemisphere = new THREE.HemisphereLight(0x9eb4ac, 0x1d211b, 1.3);
scene.add(hemisphere);

const keyLight = new THREE.DirectionalLight(0xe3d5b5, 3.2);
keyLight.position.set(-7, 11, 9);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -11;
keyLight.shadow.camera.right = 11;
keyLight.shadow.camera.top = 12;
keyLight.shadow.camera.bottom = -5;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 35;
keyLight.shadow.bias = -0.00035;
keyLight.shadow.normalBias = 0.035;
scene.add(keyLight);

const coolFill = new THREE.DirectionalLight(0x7fa49e, 0.65);
coolFill.position.set(8, 6, 5);
scene.add(coolFill);

const entranceBounce = new THREE.PointLight(0x8ca59b, 0.42, 7, 2);
entranceBounce.position.set(0, 2.2, 2.8);
scene.add(entranceBounce);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  entranceBounce.intensity = 0.4 + Math.sin(elapsed * 0.7) * 0.025;
  controls.update();
  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});
</script>
</body>
</html>
