<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Low Poly Scorpion</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #18100d; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x18100d);
scene.fog = new THREE.Fog(0x18100d, 18, 34);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8.8, 6.3, 11.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.target.set(0, 1.8, 0);

scene.add(new THREE.HemisphereLight(0xffd8a0, 0x25100b, 2.0));

const keyLight = new THREE.DirectionalLight(0xffd2a0, 4.2);
keyLight.position.set(-6, 11, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -11;
keyLight.shadow.camera.right = 11;
keyLight.shadow.camera.top = 11;
keyLight.shadow.camera.bottom = -11;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

const rimLight = new THREE.PointLight(0xd86b32, 18, 24, 2);
rimLight.position.set(5, 5, -7);
scene.add(rimLight);

const colors = {
  burnt: 0xa94722,
  burntDark: 0x6f2418,
  burntLight: 0xd56d32,
  sand: 0xc08a52,
  sandLight: 0xe0b878,
  leg: 0x87311e,
  joint: 0x5e2118,
  black: 0x24100d,
  ground: 0x241614
};

function mat(color, roughness = 0.88) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness,
    metalness: 0.02,
    flatShading: true
  });
}

const shellMats = [
  mat(colors.burnt),
  mat(colors.burntLight),
  mat(colors.sand),
  mat(colors.sandLight),
  mat(colors.burntDark),
  mat(0x9c4727)
];
const darkMat = mat(colors.leg);
const jointMat = mat(colors.joint);
const blackMat = mat(colors.black);

function mesh(geometry, material, parent = scene) {
  const object = new THREE.Mesh(geometry, material);
  object.castShadow = true;
  object.receiveShadow = true;
  parent.add(object);
  return object;
}

function box(parent, size, position, material, rotation = [0, 0, 0]) {
  const object = mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), material, parent);
  object.position.set(position[0], position[1], position[2]);
  object.rotation.set(rotation[0], rotation[1], rotation[2]);
  return object;
}

function beam(parent, a, b, width, material) {
  const start = new THREE.Vector3(...a);
  const end = new THREE.Vector3(...b);
  const delta = end.clone().sub(start);
  const object = mesh(new THREE.BoxGeometry(width, width, delta.length()), material, parent);
  object.position.copy(start).add(end).multiplyScalar(0.5);
  object.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), delta.normalize());
  return object;
}

function joint(parent, position, radius = 0.18) {
  const object = mesh(new THREE.IcosahedronGeometry(radius, 0), jointMat, parent);
  object.position.set(...position);
  return object;
}

function lowPolyEllipsoid(parent, position, scale, materialSet) {
  const object = mesh(new THREE.IcosahedronGeometry(1, 1), materialSet, parent);
  object.position.set(...position);
  object.scale.set(...scale);
  return object;
}

const scorpion = new THREE.Group();
scorpion.position.y = 0.02;
scene.add(scorpion);

const body = new THREE.Group();
scorpion.add(body);

const carapace = lowPolyEllipsoid(body, [0, 1.55, 0], [2.35, 0.78, 2.45], shellMats);
carapace.rotation.y = 0.12;

const thorax = lowPolyEllipsoid(body, [0, 1.13, -0.8], [1.55, 0.48, 1.55], shellMats);
thorax.rotation.y = -0.12;

const abdomen = lowPolyEllipsoid(body, [0, 1.3, 1.62], [1.45, 0.57, 1.4], shellMats);
abdomen.rotation.y = 0.08;

const ridge = box(body, [1.15, 0.22, 2.1], [0, 2.05, 0.25], shellMats[2], [0.1, 0.15, 0]);
ridge.scale.set(1, 1, 1);

for (let i = -2; i <= 2; i++) {
  const plate = mesh(new THREE.BoxGeometry(0.19, 0.26, 1.2), shellMats[(i + 3) % shellMats.length], body);
  plate.position.set(i * 0.45, 1.93, 0.9);
  plate.rotation.z = i * 0.12;
  plate.rotation.x = 0.25;
}

const eyeMat = mat(0x100806, 0.35);
for (const x of [-0.55, 0.55]) {
  const eye = mesh(new THREE.IcosahedronGeometry(0.11, 0), eyeMat, body);
  eye.position.set(x, 1.88, -2.05);
}

const legData = [
  [[-1.35, 1.22, -1.25], [-2.35, 0.85, -1.75], [-3.25, 0.28, -1.45]],
  [[-1.75, 1.15, -0.45], [-2.85, 0.75, -0.45], [-3.65, 0.28, -0.05]],
  [[-1.8, 1.15, 0.45], [-2.95, 0.65, 0.75], [-3.7, 0.28, 1.35]],
  [[-1.35, 1.22, 1.35], [-2.25, 0.68, 1.75], [-2.85, 0.28, 2.45]],
  [[1.35, 1.22, -1.25], [2.35, 0.85, -1.75], [3.25, 0.28, -1.45]],
  [[1.75, 1.15, -0.45], [2.85, 0.75, -0.45], [3.65, 0.28, -0.05]],
  [[1.8, 1.15, 0.45], [2.95, 0.65, 0.75], [3.7, 0.28, 1.35]],
  [[1.35, 1.22, 1.35], [2.25, 0.68, 1.75], [2.85, 0.28, 2.45]]
];

for (const points of legData) {
  beam(scorpion, points[0], points[1], 0.24, darkMat);
  beam(scorpion, points[1], points[2], 0.19, darkMat);
  joint(scorpion, points[1], 0.17);
  const foot = mesh(new THREE.ConeGeometry(0.13, 0.42, 4), jointMat, scorpion);
  foot.position.set(points[2][0], 0.18, points[2][2]);
  foot.rotation.z = Math.PI;
  foot.rotation.x = 0.18;
}

function addArm(side) {
  const arm = new THREE.Group();
  scorpion.add(arm);

  const s = side;
  const shoulder = [s * 1.48, 1.48, -1.05];
  const elbow = [s * 2.15, 1.25, -2.25];
  const wrist = [s * 1.7, 1.05, -3.35];

  beam(arm, shoulder, elbow, 0.42, shellMats[0]);
  beam(arm, elbow, wrist, 0.34, shellMats[2]);
  joint(arm, elbow, 0.27);
  joint(arm, wrist, 0.23);

  const palm = mesh(new THREE.BoxGeometry(0.72, 0.56, 1.0), shellMats[1], arm);
  palm.position.set(s * 1.7, 1.04, -3.72);
  palm.rotation.y = s * 0.12;

  const clawBase = [s * 1.7, 1.03, -4.16];
  const upperTip = [s * 1.28, 1.34, -4.95];
  const lowerTip = [s * 1.28, 0.73, -4.95];
  beam(arm, clawBase, upperTip, 0.25, shellMats[3]);
  beam(arm, clawBase, lowerTip, 0.25, shellMats[0]);
  const upper = mesh(new THREE.ConeGeometry(0.22, 0.72, 4), shellMats[3], arm);
  upper.position.set(...upperTip);
  upper.rotation.z = s * Math.PI / 2.5;
  const lower = mesh(new THREE.ConeGeometry(0.22, 0.72, 4), shellMats[0], arm);
  lower.position.set(...lowerTip);
  lower.rotation.z = s * Math.PI / 1.55;
}

addArm(-1);
addArm(1);

const tailPoints = [
  [0, 1.42, 2.65],
  [0, 1.95, 3.45],
  [0, 2.75, 4.05],
  [0, 3.65, 4.15],
  [0, 4.45, 3.65],
  [0, 5.15, 2.75],
  [0, 5.45, 1.65],
  [0, 5.48, 0.55]
];

const tailRadii = [0.78, 0.7, 0.64, 0.58, 0.5, 0.41, 0.31, 0.22];

for (let i = 0; i < tailPoints.length; i++) {
  const current = new THREE.Vector3(...tailPoints[i]);
  const next = new THREE.Vector3(...tailPoints[Math.min(i + 1, tailPoints.length - 1)]);
  const previous = new THREE.Vector3(...tailPoints[Math.max(i - 1, 0)]);
  const direction = next.clone().sub(previous).normalize();
  const length = i === tailPoints.length - 1 ? 0.68 : current.distanceTo(next) * 0.9;
  const segment = mesh(
    new THREE.CylinderGeometry(tailRadii[i] * 0.78, tailRadii[i], length, 5, 1, false),
    shellMats[(i + 1) % shellMats.length],
    scorpion
  );
  segment.position.copy(current);
  segment.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
  if (i > 0) {
    const ring = mesh(new THREE.CylinderGeometry(tailRadii[i] * 1.03, tailRadii[i] * 1.03, 0.18, 5), shellMats[4], scorpion);
    ring.position.copy(current).add(direction.clone().multiplyScalar(-length * 0.4));
    ring.quaternion.copy(segment.quaternion);
  }
}

const stinger = mesh(new THREE.ConeGeometry(0.38, 1.35, 5), blackMat, scorpion);
stinger.position.set(0, 5.3, -0.2);
stinger.rotation.x = Math.PI * 0.72;

const ground = mesh(new THREE.CircleGeometry(15, 64), mat(colors.ground), scene);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.03;
ground.receiveShadow = true;

const shadowDisc = mesh(new THREE.CircleGeometry(4.5, 48), new THREE.MeshBasicMaterial({
  color: 0x120a08,
  transparent: true,
  opacity: 0.34,
  depthWrite: false
}), scene);
shadowDisc.rotation.x = -Math.PI / 2;
shadowDisc.position.y = -0.015;
shadowDisc.scale.set(1.05, 0.68, 1);

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
