<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Houseplant in Pot with Saucer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e8e4dc; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Units: 1 unit = 1 cm. A ~16 cm pot, matching saucer, plant to ~45 cm tall.
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8e4dc);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 500);
camera.position.set(38, 32, 48);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.HemisphereLight(0xfff5e8, 0x8a8578, 0.55));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(30, 55, 25);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -35;
sun.shadow.camera.right = sun.shadow.camera.top = 35;
sun.shadow.camera.far = 150;
sun.shadow.bias = -0.0005;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xdde8ff, 0.5);
fill.position.set(-35, 20, -25);
scene.add(fill);

// Ground (soft shadow catcher)
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(120, 64),
  new THREE.ShadowMaterial({ opacity: 0.22 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const groundTint = new THREE.Mesh(
  new THREE.CircleGeometry(120, 64),
  new THREE.MeshStandardMaterial({ color: 0xe8e4dc, roughness: 1 })
);
groundTint.rotation.x = -Math.PI / 2;
groundTint.position.y = -0.02;
scene.add(groundTint);

const plant = new THREE.Group();
scene.add(plant);

// Terracotta material shared by pot + saucer
const terracotta = new THREE.MeshStandardMaterial({ color: 0xb8613f, roughness: 0.85, metalness: 0.0 });
const terracottaIn = new THREE.MeshStandardMaterial({ color: 0x8f4a30, roughness: 0.9, side: THREE.BackSide });

// --- Saucer: 18 cm diameter, 2.2 cm tall, sits on ground ---
const saucerPts = [];
saucerPts.push(new THREE.Vector2(0, 0));
saucerPts.push(new THREE.Vector2(7.6, 0));
saucerPts.push(new THREE.Vector2(8.6, 0.5));
saucerPts.push(new THREE.Vector2(9.0, 1.6));
saucerPts.push(new THREE.Vector2(9.1, 2.2));
saucerPts.push(new THREE.Vector2(8.7, 2.2));
saucerPts.push(new THREE.Vector2(8.5, 1.4));
saucerPts.push(new THREE.Vector2(7.9, 0.55));
saucerPts.push(new THREE.Vector2(0, 0.5));
const saucer = new THREE.Mesh(new THREE.LatheGeometry(saucerPts, 48), terracotta);
saucer.castShadow = saucer.receiveShadow = true;
plant.add(saucer);

// --- Pot: tapered, 16 cm rim diameter, 14 cm tall, rests inside saucer ---
const potBase = 0.55; // sits on saucer floor
const potPts = [];
potPts.push(new THREE.Vector2(5.6, 0));
potPts.push(new THREE.Vector2(7.6, 11.2));
potPts.push(new THREE.Vector2(7.7, 11.4));
potPts.push(new THREE.Vector2(8.1, 11.5)); // rim flare out
potPts.push(new THREE.Vector2(8.1, 14.0));
potPts.push(new THREE.Vector2(7.75, 14.0)); // rim top
const potOuter = new THREE.Mesh(new THREE.LatheGeometry(potPts, 48), terracotta);
potOuter.position.y = potBase;
potOuter.castShadow = potOuter.receiveShadow = true;
plant.add(potOuter);
// Pot inner wall
const potInPts = [
  new THREE.Vector2(7.75, 14.0),
  new THREE.Vector2(7.3, 12.6),
  new THREE.Vector2(6.9, 12.5)
];
const potInner = new THREE.Mesh(new THREE.LatheGeometry(potInPts, 48), terracottaIn);
potInner.position.y = potBase;
plant.add(potInner);

// --- Soil: slightly domed disc just below the rim ---
const soil = new THREE.Mesh(
  new THREE.SphereGeometry(7.35, 40, 12, 0, Math.PI * 2, 0, Math.PI * 0.28),
  new THREE.MeshStandardMaterial({ color: 0x3a2a1c, roughness: 1 })
);
soil.scale.y = 0.28;
soil.position.y = potBase + 12.5 - 7.35 * 0.28 * Math.cos(Math.PI * 0.28) + 0.35;
soil.castShadow = soil.receiveShadow = true;
plant.add(soil);
const soilTop = potBase + 12.85;

// --- Foliage: bushy cluster of broad leaves on arching stems ---
const stemMat = new THREE.MeshStandardMaterial({ color: 0x4a7a35, roughness: 0.7 });
const leafMats = [0x3d7a2f, 0x4f9440, 0x2f6626, 0x5aa04a].map(c =>
  new THREE.MeshStandardMaterial({ color: c, roughness: 0.55, side: THREE.DoubleSide })
);

// Broad leaf shape (~unit length), extruded slightly for thickness
function makeLeafGeo() {
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.bezierCurveTo(0.28, 0.12, 0.42, 0.45, 0.34, 0.72);
  s.bezierCurveTo(0.26, 0.94, 0.08, 1.0, 0, 1.0);
  s.bezierCurveTo(-0.08, 1.0, -0.26, 0.94, -0.34, 0.72);
  s.bezierCurveTo(-0.42, 0.45, -0.28, 0.12, 0, 0);
  const g = new THREE.ExtrudeGeometry(s, { depth: 0.02, bevelEnabled: false });
  // Curl the leaf: bend along its length
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i), x = pos.getX(i);
    pos.setZ(i, pos.getZ(i) + Math.sin(y * Math.PI) * -0.12 + Math.abs(x) * 0.18);
  }
  g.computeVertexNormals();
  return g;
}
const leafGeo = makeLeafGeo();

// Seeded pseudo-random for stable arrangement
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

function addStemWithLeaf(angle, lean, height, leafLen) {
  const g = new THREE.Group();
  // Arching stem via curve
  const dir = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle));
  const top = dir.clone().multiplyScalar(lean * height).setY(height);
  const mid = dir.clone().multiplyScalar(lean * height * 0.35).setY(height * 0.55);
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(dir.x * 0.8, 0, dir.z * 0.8), mid, top
  ]);
  const stem = new THREE.Mesh(new THREE.TubeGeometry(curve, 12, 0.28, 6), stemMat);
  stem.castShadow = true;
  g.add(stem);
  // Leaf at stem tip, oriented outward and drooping
  const leaf = new THREE.Mesh(leafGeo, leafMats[Math.floor(rnd() * leafMats.length)]);
  leaf.scale.setScalar(leafLen);
  leaf.position.copy(top);
  leaf.rotation.order = 'YXZ';
  leaf.rotation.y = -angle + Math.PI / 2 + (rnd() - 0.5) * 0.5;
  leaf.rotation.x = -Math.PI / 2 + 0.55 + lean * 0.9 + (rnd() - 0.5) * 0.3;
  leaf.rotation.z = (rnd() - 0.5) * 0.4;
  leaf.castShadow = true;
  g.add(leaf);
  g.position.y = soilTop - 0.3;
  plant.add(g);
}

// Outer ring: taller arching stems with big leaves
for (let i = 0; i < 11; i++) {
  const a = (i / 11) * Math.PI * 2 + rnd() * 0.5;
  addStemWithLeaf(a, 0.45 + rnd() * 0.25, 16 + rnd() * 8, 11 + rnd() * 4);
}
// Middle ring
for (let i = 0; i < 9; i++) {
  const a = (i / 9) * Math.PI * 2 + 0.35 + rnd() * 0.5;
  addStemWithLeaf(a, 0.28 + rnd() * 0.2, 20 + rnd() * 9, 10 + rnd() * 4);
}
// Inner cluster: more upright, younger leaves
for (let i = 0; i < 7; i++) {
  const a = (i / 7) * Math.PI * 2 + 0.7 + rnd() * 0.6;
  addStemWithLeaf(a, 0.1 + rnd() * 0.15, 22 + rnd() * 10, 8 + rnd() * 3.5);
}

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 16, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 20;
controls.maxDistance = 150;
controls.maxPolarAngle = Math.PI * 0.52;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
