<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Firefighter</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #101820;
    }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 20px;
      bottom: 18px;
      color: rgba(235, 242, 245, 0.72);
      font: 12px/1.4 system-ui, sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Turnout Firefighter · Drag to orbit</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101820);
    scene.fog = new THREE.FogExp2(0x101820, 0.027);

    const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(9.2, 5.7, 11.5);
    camera.lookAt(0, 3.45, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 3.45, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.enablePan = false;
    controls.minDistance = 7;
    controls.maxDistance = 22;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.65;

    const mat = {
      turnout: new THREE.MeshPhysicalMaterial({
        color: 0x8b6330, roughness: 0.83, metalness: 0.02, clearcoat: 0.05
      }),
      turnoutDark: new THREE.MeshStandardMaterial({
        color: 0x5b3d20, roughness: 0.9
      }),
      seam: new THREE.MeshStandardMaterial({
        color: 0x2d2419, roughness: 0.88
      }),
      reflective: new THREE.MeshStandardMaterial({
        color: 0xd9dfb4, roughness: 0.4, metalness: 0.15,
        emissive: 0xa8b16e, emissiveIntensity: 0.18
      }),
      reflectiveEdge: new THREE.MeshStandardMaterial({
        color: 0xd8b91e, roughness: 0.55, emissive: 0x665000, emissiveIntensity: 0.16
      }),
      boot: new THREE.MeshStandardMaterial({
        color: 0x17191a, roughness: 0.72, metalness: 0.05
      }),
      rubber: new THREE.MeshStandardMaterial({
        color: 0x242829, roughness: 0.62
      }),
      helmet: new THREE.MeshPhysicalMaterial({
        color: 0xe6b41e, roughness: 0.34, clearcoat: 0.58, clearcoatRoughness: 0.24
      }),
      helmetDark: new THREE.MeshStandardMaterial({
        color: 0x403619, roughness: 0.58
      }),
      skin: new THREE.MeshStandardMaterial({
        color: 0xb97954, roughness: 0.78
      }),
      glass: new THREE.MeshPhysicalMaterial({
        color: 0x97bed0, roughness: 0.16, metalness: 0.05,
        transparent: true, opacity: 0.48, transmission: 0.18,
        depthWrite: false
      }),
      metal: new THREE.MeshStandardMaterial({
        color: 0x737c80, roughness: 0.34, metalness: 0.74
      }),
      tank: new THREE.MeshPhysicalMaterial({
        color: 0xb5bec1, roughness: 0.27, metalness: 0.72, clearcoat: 0.15
      }),
      red: new THREE.MeshStandardMaterial({
        color: 0x9e1c19, roughness: 0.48, emissive: 0x260000, emissiveIntensity: 0.3
      }),
      black: new THREE.MeshStandardMaterial({
        color: 0x101314, roughness: 0.58
      })
    };

    function addMesh(parent, geometry, material, position, rotation, scale) {
      const object = new THREE.Mesh(geometry, material);
      if (position) object.position.set(...position);
      if (rotation) object.rotation.set(...rotation);
      if (scale) object.scale.set(...scale);
      parent.add(object);
      return object;
    }

    function cylinderBetween(parent, a, b, radius, material, radialSegments = 16) {
      const start = new THREE.Vector3(...a);
      const end = new THREE.Vector3(...b);
      const delta = end.clone().sub(start);
      const object = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius * 1.03, delta.length(), radialSegments, 1),
        material
      );
      object.position.copy(start).add(end).multiplyScalar(0.5);
      object.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), delta.normalize());
      parent.add(object);
      return object;
    }

    function bandBetween(parent, center, direction, length, radius, material) {
      const d = new THREE.Vector3(...direction).normalize().multiplyScalar(length * 0.5);
      const c = new THREE.Vector3(...center);
      return cylinderBetween(
        parent,
        c.clone().sub(d).toArray(),
        c.clone().add(d).toArray(),
        radius,
        material,
        18
      );
    }

    const firefighter = new THREE.Group();
    firefighter.rotation.y = -0.08;
    scene.add(firefighter);

    const torso = addMesh(
      firefighter,
      new THREE.CylinderGeometry(0.92, 1.12, 2.55, 12, 3, false),
      mat.turnout,
      [0, 4.16, 0],
      null,
      [1, 1, 0.68]
    );

    addMesh(
      firefighter,
      new THREE.CylinderGeometry(0.925, 1.08, 0.17, 12),
      mat.reflectiveEdge,
      [0, 3.34, 0],
      null,
      [1.01, 1, 0.69]
    );
    addMesh(
      firefighter,
      new THREE.CylinderGeometry(0.93, 1.07, 0.105, 12),
      mat.reflective,
      [0, 3.34, 0],
      null,
      [1.015, 1, 0.695]
    );

    addMesh(
      firefighter,
      new THREE.BoxGeometry(0.1, 2.28, 0.08),
      mat.seam,
      [0, 4.18, 0.647]
    );

    addMesh(
      firefighter,
      new THREE.BoxGeometry(0.14, 2.15, 0.055),
      mat.reflectiveEdge,
      [-0.12, 4.2, 0.685]
    );
    addMesh(
      firefighter,
      new THREE.BoxGeometry(0.07, 2.11, 0.061),
      mat.reflective,
      [-0.12, 4.2, 0.692]
    );

    for (const x of [-0.58, 0.58]) {
      const pocket = addMesh(
        firefighter,
        new THREE.BoxGeometry(0.62, 0.52, 0.19),
        mat.turnoutDark,
        [x, 3.62, 0.62],
        [-0.05, 0, 0]
      );
      addMesh(
        pocket,
        new THREE.BoxGeometry(0.66, 0.12, 0.22),
        mat.turnout,
        [0, 0.24, 0.01]
      );
    }

    addMesh(
      firefighter,
      new THREE.TorusGeometry(0.67, 0.16, 10, 24, Math.PI),
      mat.turnoutDark,
      [0, 5.39, 0.02],
      [Math.PI / 2, 0, 0]
    );

    const shoulders = [
      { side: -1, shoulder: [-0.91, 5.03, 0], elbow: [-1.24, 4.05, 0.06], wrist: [-1.19, 3.08, 0.22] },
      { side: 1, shoulder: [0.91, 5.03, 0], elbow: [1.24, 4.05, 0.06], wrist: [1.19, 3.08, 0.22] }
    ];

    for (const arm of shoulders) {
      cylinderBetween(firefighter, arm.shoulder, arm.elbow, 0.34, mat.turnout, 18);
      cylinderBetween(firefighter, arm.elbow, arm.wrist, 0.31, mat.turnout, 18);

      const lowerDirection = new THREE.Vector3(...arm.wrist).sub(new THREE.Vector3(...arm.elbow));
      const bandCenter = new THREE.Vector3(...arm.elbow).lerp(new THREE.Vector3(...arm.wrist), 0.58);
      bandBetween(
        firefighter,
        bandCenter.toArray(),
        lowerDirection.toArray(),
        0.2,
        0.322,
        mat.reflectiveEdge
      );
      bandBetween(
        firefighter,
        bandCenter.toArray(),
        lowerDirection.toArray(),
        0.115,
        0.329,
        mat.reflective
      );

      addMesh(
        firefighter,
        new THREE.SphereGeometry(0.34, 18, 12),
        mat.rubber,
        [arm.wrist[0], 2.86, arm.wrist[2] + 0.03],
        [0, 0, arm.side * 0.08],
        [0.9, 1.18, 0.78]
      );
      addMesh(
        firefighter,
        new THREE.BoxGeometry(0.34, 0.12, 0.39),
        mat.boot,
        [arm.wrist[0], 2.76, arm.wrist[2] + 0.12],
        [0.05, 0, arm.side * 0.05]
      );
    }

    for (const side of [-1, 1]) {
      const x = side * 0.45;

      addMesh(
        firefighter,
        new THREE.CylinderGeometry(0.4, 0.43, 2.08, 12),
        mat.turnout,
        [x, 1.94, -0.01],
        [0, 0, side * 0.018],
        [1, 1, 0.9]
      );

      addMesh(
        firefighter,
        new THREE.CylinderGeometry(0.415, 0.432, 0.2, 12),
        mat.reflectiveEdge,
        [x, 1.35, 0],
        [0, 0, side * 0.018],
        [1, 1, 0.91]
      );
      addMesh(
        firefighter,
        new THREE.CylinderGeometry(0.421, 0.438, 0.115, 12),
        mat.reflective,
        [x, 1.35, 0],
        [0, 0, side * 0.018],
        [1, 1, 0.915]
      );

      addMesh(
        firefighter,
        new THREE.BoxGeometry(0.78, 0.8, 1.04),
        mat.boot,
        [x, 0.58, 0.18],
        [0, side * 0.045, 0],
        [1, 1, 1]
      );
      addMesh(
        firefighter,
        new THREE.BoxGeometry(0.84, 0.18, 1.18),
        mat.black,
        [x, 0.16, 0.25],
        [0, side * 0.045, 0]
      );
      addMesh(
        firefighter,
        new THREE.BoxGeometry(0.72, 0.11, 0.16),
        mat.rubber,
        [x, 0.45, 0.715],
        [0, side * 0.045, 0]
      );
    }

    addMesh(
      firefighter,
      new THREE.SphereGeometry(0.49, 24, 18),
      mat.skin,
      [0, 5.94, 0.13],
      null,
      [0.91, 1.08, 0.87]
    );

    addMesh(
      firefighter,
      new THREE.CylinderGeometry(0.5, 0.55, 0.23, 24),
      mat.helmetDark,
      [0, 5.59, 0]
    );

    addMesh(
      firefighter,
      new THREE.CylinderGeometry(0.82, 0.88, 0.13, 32),
      mat.helmet,
      [0, 6.29, 0],
      null,
      [1.08, 1, 1]
    );
    addMesh(
      firefighter,
      new THREE.CylinderGeometry(0.53, 0.65, 0.54, 28),
      mat.helmet,
      [0, 6.57, -0.02]
    );
    addMesh(
      firefighter,
      new THREE.SphereGeometry(0.535, 28, 16, 0, Math.PI * 2, 0, Math.PI / 2),
      mat.helmet,
      [0, 6.84, -0.02]
    );

    addMesh(
      firefighter,
      new THREE.BoxGeometry(0.52, 0.53, 0.08),
      mat.helmetDark,
      [0, 6.58, 0.56],
      [-0.08, 0, 0]
    );
    addMesh(
      firefighter,
      new THREE.BoxGeometry(0.34, 0.36, 0.035),
      mat.red,
      [0, 6.58, 0.609],
      [-0.08, 0, 0]
    );
    addMesh(
      firefighter,
      new THREE.BoxGeometry(0.08, 0.26, 0.025),
      mat.reflective,
      [0, 6.58, 0.631],
      [-0.08, 0, 0]
    );
    addMesh(
      firefighter,
      new THREE.BoxGeometry(0.25, 0.065, 0.026),
      mat.reflective,
      [0, 6.58, 0.633],
      [-0.08, 0, 0]
    );

    addMesh(
      firefighter,
      new THREE.SphereGeometry(0.035, 12, 8),
      mat.black,
      [-0.17, 6.03, 0.535],
      null,
      [1, 0.62, 0.45]
    );
    addMesh(
      firefighter,
      new THREE.SphereGeometry(0.035, 12, 8),
      mat.black,
      [0.17, 6.03, 0.535],
      null,
      [1, 0.62, 0.45]
    );

    addMesh(
      firefighter,
      new THREE.SphereGeometry(0.09, 14, 10),
      mat.skin,
      [0, 5.91, 0.557],
      null,
      [0.72, 1, 0.72]
    );

    addMesh(
      firefighter,
      new THREE.CylinderGeometry(0.52, 0.46, 0.48, 24, 1, true, -1.2, 2.4),
      mat.glass,
      [0, 5.92, 0.28],
      [0, Math.PI, 0]
    );

    addMesh(
      firefighter,
      new THREE.BoxGeometry(1.18, 1.92, 0.23),
      mat.black,
      [0, 4.35, -0.7]
    );

    addMesh(
      firefighter,
      new THREE.CylinderGeometry(0.45, 0.45, 1.88, 24),
      mat.tank,
      [0, 4.28, -1.03]
    );
    addMesh(
      firefighter,
      new THREE.SphereGeometry(0.45, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2),
      mat.tank,
      [0, 5.22, -1.03]
    );
    addMesh(
      firefighter,
      new THREE.SphereGeometry(0.45, 24, 12, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2),
      mat.tank,
      [0, 3.34, -1.03]
    );
    addMesh(
      firefighter,
      new THREE.CylinderGeometry(0.17, 0.2, 0.25, 16),
      mat.metal,
      [0, 5.57, -1.03]
    );
    addMesh(
      firefighter,
      new THREE.TorusGeometry(0.48, 0.045, 8, 24),
      mat.black,
      [0, 4.02, -1.03],
      [Math.PI / 2, 0, 0]
    );

    for (const side of [-1, 1]) {
      const strapCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(side * 0.39, 5.23, -0.62),
        new THREE.Vector3(side * 0.72, 4.82, -0.48),
        new THREE.Vector3(side * 0.72, 4.08, -0.48),
        new THREE.Vector3(side * 0.47, 3.58, -0.61)
      ]);
      addMesh(
        firefighter,
        new THREE.TubeGeometry(strapCurve, 24, 0.075, 8, false),
        mat.black
      );
    }

    addMesh(
      firefighter,
      new THREE.CylinderGeometry(0.18, 0.18, 0.17, 18),
      mat.black,
      [0.48, 4.7, 0.68],
      [Math.PI / 2, 0, 0]
    );
    addMesh(
      firefighter,
      new THREE.CylinderGeometry(0.12, 0.12, 0.19, 18),
      mat.glass,
      [0.48, 4.7, 0.78],
      [Math.PI / 2, 0, 0]
    );

    const hoseCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0.48, 4.7, 0.67),
      new THREE.Vector3(0.88, 4.86, 0.5),
      new THREE.Vector3(1.03, 5.43, 0.05),
      new THREE.Vector3(0.67, 5.78, -0.52),
      new THREE.Vector3(0.25, 5.58, -0.94)
    ]);
    addMesh(
      firefighter,
      new THREE.TubeGeometry(hoseCurve, 44, 0.055, 10, false),
      mat.black
    );

    firefighter.traverse(object => {
      if (object.isMesh) {
        object.castShadow = true;
        object.receiveShadow = true;
      }
    });

    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x1c292d,
      roughness: 0.92,
      metalness: 0.03
    });
    const ground = new THREE.Mesh(new THREE.CircleGeometry(18, 96), groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0.04;
    ground.receiveShadow = true;
    scene.add(ground);

    const platform = new THREE.Mesh(
      new THREE.CylinderGeometry(2.2, 2.38, 0.16, 64),
      new THREE.MeshStandardMaterial({ color: 0x253337, roughness: 0.72, metalness: 0.18 })
    );
    platform.position.y = 0.02;
    platform.receiveShadow = true;
    scene.add(platform);

    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(2.22, 0.025, 8, 80),
      new THREE.MeshBasicMaterial({ color: 0xd19c2b, transparent: true, opacity: 0.55 })
    );
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 0.115;
    scene.add(ring);

    const hemiLight = new THREE.HemisphereLight(0x9bc2d6, 0x20150d, 2.05);
    scene.add(hemiLight);

    const key = new THREE.DirectionalLight(0xffe2ba, 5.2);
    key.position.set(6, 10, 7);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -6;
    key.shadow.camera.right = 6;
    key.shadow.camera.top = 9;
    key.shadow.camera.bottom = -2;
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 25;
    key.shadow.bias = -0.0004;
    scene.add(key);

    const rim = new THREE.DirectionalLight(0x5caee0, 3.3);
    rim.position.set(-7, 6, -7);
    scene.add(rim);

    const warm = new THREE.PointLight(0xff6b20, 24, 12, 2);
    warm.position.set(-4.2, 2.2, 3.2);
    scene.add(warm);

    const cool = new THREE.PointLight(0x4aa8d8, 13, 11, 2);
    cool.position.set(4.5, 5.8, -4.5);
    scene.add(cool);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      warm.intensity = 23 + Math.sin(t * 4.7) * 1.7 + Math.sin(t * 8.9) * 0.8;
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
