<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jazz Lounge Stage</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #08070b;
    }
    canvas {
      display: block;
    }
    #title {
      position: fixed;
      left: 28px;
      bottom: 24px;
      color: rgba(255, 224, 171, 0.75);
      font: 11px/1.4 Georgia, serif;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 2px 12px #000;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="title">The Blue Hour · Jazz Lounge</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x090911);
    scene.fog = new THREE.FogExp2(0x0b0b13, 0.027);

    const camera = new THREE.PerspectiveCamera(
      42,
      window.innerWidth / window.innerHeight,
      0.1,
      120
    );
    camera.position.set(15, 9, 22);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 3.5, -2);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.22;
    controls.minDistance = 13;
    controls.maxDistance = 35;
    controls.maxPolarAngle = Math.PI * 0.48;

    let seed = 19370421;
    function random() {
      seed |= 0;
      seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }

    function range(a, b) {
      return a + (b - a) * random();
    }

    const mats = {
      black: new THREE.MeshStandardMaterial({
        color: 0x08080a,
        roughness: 0.22,
        metalness: 0.55
      }),
      piano: new THREE.MeshPhysicalMaterial({
        color: 0x09090b,
        roughness: 0.17,
        metalness: 0.34,
        clearcoat: 1,
        clearcoatRoughness: 0.12
      }),
      ebony: new THREE.MeshStandardMaterial({
        color: 0x111013,
        roughness: 0.28,
        metalness: 0.12
      }),
      ivory: new THREE.MeshStandardMaterial({
        color: 0xe4d9bd,
        roughness: 0.38
      }),
      brass: new THREE.MeshStandardMaterial({
        color: 0xc28a2a,
        roughness: 0.22,
        metalness: 0.9
      }),
      oldBrass: new THREE.MeshStandardMaterial({
        color: 0x8f641d,
        roughness: 0.34,
        metalness: 0.78
      }),
      chrome: new THREE.MeshStandardMaterial({
        color: 0xb6bec5,
        roughness: 0.18,
        metalness: 0.95
      }),
      bassWood: new THREE.MeshPhysicalMaterial({
        color: 0x7e2f14,
        roughness: 0.3,
        metalness: 0.05,
        clearcoat: 0.65,
        clearcoatRoughness: 0.22
      }),
      bassDark: new THREE.MeshStandardMaterial({
        color: 0x28100b,
        roughness: 0.3
      }),
      drumRed: new THREE.MeshPhysicalMaterial({
        color: 0x381017,
        roughness: 0.28,
        metalness: 0.28,
        clearcoat: 0.8
      }),
      drumSkin: new THREE.MeshStandardMaterial({
        color: 0xd9d0bb,
        roughness: 0.64
      }),
      velvet: new THREE.MeshStandardMaterial({
        color: 0x430c24,
        roughness: 0.92
      }),
      velvetDark: new THREE.MeshStandardMaterial({
        color: 0x170711,
        roughness: 1
      }),
      wood: new THREE.MeshStandardMaterial({
        color: 0x26130f,
        roughness: 0.55
      }),
      redLeather: new THREE.MeshPhysicalMaterial({
        color: 0x4b1118,
        roughness: 0.48,
        clearcoat: 0.3
      }),
      gold: new THREE.MeshStandardMaterial({
        color: 0xb88931,
        roughness: 0.3,
        metalness: 0.82
      })
    };

    function mesh(geometry, material, parent = scene) {
      const object = new THREE.Mesh(geometry, material);
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }

    function box(parent, size, position, material, rotation = null) {
      const object = mesh(
        new THREE.BoxGeometry(size[0], size[1], size[2]),
        material,
        parent
      );
      object.position.set(position[0], position[1], position[2]);
      if (rotation) {
        object.rotation.set(rotation[0], rotation[1], rotation[2]);
      }
      return object;
    }

    function cylinder(
      parent,
      radiusTop,
      radiusBottom,
      height,
      segments,
      position,
      material,
      rotation = null
    ) {
      const object = mesh(
        new THREE.CylinderGeometry(
          radiusTop,
          radiusBottom,
          height,
          segments
        ),
        material,
        parent
      );
      object.position.set(position[0], position[1], position[2]);
      if (rotation) {
        object.rotation.set(rotation[0], rotation[1], rotation[2]);
      }
      return object;
    }

    function canvasTexture(size, painter) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const context = canvas.getContext('2d');
      painter(context, size);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    const carpetTexture = canvasTexture(512, (ctx, s) => {
      ctx.fillStyle = '#160c16';
      ctx.fillRect(0, 0, s, s);
      ctx.strokeStyle = 'rgba(171,113,45,.20)';
      ctx.lineWidth = 4;
      for (let y = -s; y < s * 2; y += 96) {
        for (let x = -s; x < s * 2; x += 96) {
          ctx.beginPath();
          ctx.moveTo(x, y + 48);
          ctx.lineTo(x + 48, y);
          ctx.lineTo(x + 96, y + 48);
          ctx.lineTo(x + 48, y + 96);
          ctx.closePath();
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(x + 48, y + 48, 12, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
      for (let i = 0; i < 8000; i++) {
        const v = Math.floor(range(0, 35));
        ctx.fillStyle = `rgba(${v + 30},${v + 8},${v + 20},.16)`;
        ctx.fillRect(range(0, s), range(0, s), 1, 1);
      }
    });
    carpetTexture.repeat.set(7, 9);

    const wallTexture = canvasTexture(512, (ctx, s) => {
      const grad = ctx.createLinearGradient(0, 0, 0, s);
      grad.addColorStop(0, '#17131d');
      grad.addColorStop(1, '#09080e');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, s, s);
      ctx.strokeStyle = 'rgba(182,139,66,.17)';
      ctx.lineWidth = 5;
      for (let x = 0; x <= s; x += 128) {
        ctx.beginPath();
        ctx.moveTo(x, s);
        ctx.lineTo(x + 64, s * 0.62);
        ctx.lineTo(x + 128, s);
        ctx.stroke();
      }
      ctx.strokeRect(8, 8, s - 16, s - 16);
    });
    wallTexture.repeat.set(5, 2);

    const floor = mesh(
      new THREE.PlaneGeometry(42, 48),
      new THREE.MeshStandardMaterial({
        map: carpetTexture,
        color: 0x6f5260,
        roughness: 0.92
      })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(0, 0, 4);

    const rearWall = mesh(
      new THREE.PlaneGeometry(38, 17),
      new THREE.MeshStandardMaterial({
        map: wallTexture,
        color: 0x615568,
        roughness: 0.9
      })
    );
    rearWall.position.set(0, 8.5, -10.5);

    const leftWall = mesh(
      new THREE.PlaneGeometry(40, 17),
      new THREE.MeshStandardMaterial({
        color: 0x11101a,
        roughness: 0.95
      })
    );
    leftWall.rotation.y = Math.PI / 2;
    leftWall.position.set(-19, 8.5, 2);

    const rightWall = leftWall.clone();
    rightWall.position.x = 19;
    rightWall.rotation.y = -Math.PI / 2;
    scene.add(rightWall);

    const stage = new THREE.Group();
    scene.add(stage);

    box(stage, [21, 0.75, 8.6], [0, 0.38, -5.3], mats.wood);
    box(stage, [21.6, 0.24, 8.9], [0, 0.82, -5.3], mats.gold);
    box(stage, [20.9, 0.18, 8.4], [0, 0.98, -5.3], mats.black);

    for (let i = 0; i < 3; i++) {
      box(
        stage,
        [4.8 - i * 0.65, 0.25, 0.72],
        [0, 0.12 + i * 0.18, -0.65 - i * 0.56],
        mats.wood
      );
    }

    function makeCurtain() {
      const curtain = new THREE.Group();
      curtain.position.set(0, 1, -10.05);
      scene.add(curtain);

      for (let i = 0; i < 34; i++) {
        const x = -10.55 + i * 0.64;
        const radius = i % 2 ? 0.32 : 0.42;
        const fold = cylinder(
          curtain,
          radius,
          radius * 1.08,
          10.2,
          16,
          [x, 5.2, 0],
          i % 2 ? mats.velvetDark : mats.velvet
        );
        fold.scale.z = 0.55;
      }

      const pelmet = box(
        curtain,
        [22.2, 1.55, 0.8],
        [0, 10.1, 0.15],
        mats.velvet
      );

      for (let i = 0; i < 15; i++) {
        const swag = mesh(
          new THREE.TorusGeometry(0.73, 0.12, 10, 24, Math.PI),
          mats.gold,
          curtain
        );
        swag.position.set(-9.8 + i * 1.4, 9.5, 0.6);
        swag.rotation.z = Math.PI;
      }

      return { curtain, pelmet };
    }

    makeCurtain();

    function createArtDecoPanels() {
      const group = new THREE.Group();
      group.position.z = -10.25;
      scene.add(group);

      for (const side of [-1, 1]) {
        const x = side * 13.4;
        box(group, [5.2, 11.5, 0.28], [x, 6.1, 0], mats.black);
        box(group, [4.7, 11.05, 0.16], [x, 6.1, 0.18], mats.wood);

        for (let i = 0; i < 4; i++) {
          const bar = box(
            group,
            [0.12, 8.2 - i * 1.3, 0.12],
            [x + side * (i - 1.5) * 0.6, 5.8, 0.34],
            mats.gold
          );
          bar.rotation.z = side * (i - 1.5) * 0.07;
        }

        const fan = new THREE.Group();
        fan.position.set(x, 2.0, 0.45);
        group.add(fan);

        for (let i = -3; i <= 3; i++) {
          box(
            fan,
            [0.09, 3.2, 0.09],
            [0, 1.5, 0],
            mats.gold,
            [0, 0, i * 0.2]
          );
        }
      }
    }

    createArtDecoPanels();

    function createBass() {
      const bass = new THREE.Group();
      bass.position.set(-6.2, 1.05, -5.8);
      bass.rotation.y = 0.18;
      stage.add(bass);

      const lowerL = mesh(
        new THREE.SphereGeometry(1.18, 32, 24),
        mats.bassWood,
        bass
      );
      lowerL.scale.set(0.82, 1.05, 0.34);
      lowerL.position.set(-0.46, 1.63, 0);

      const lowerR = lowerL.clone();
      lowerR.position.x = 0.46;
      bass.add(lowerR);

      const upperL = mesh(
        new THREE.SphereGeometry(0.8, 28, 20),
        mats.bassWood,
        bass
      );
      upperL.scale.set(0.72, 1.0, 0.34);
      upperL.position.set(-0.38, 2.95, 0);

      const upperR = upperL.clone();
      upperR.position.x = 0.38;
      bass.add(upperR);

      const waist = mesh(
        new THREE.SphereGeometry(0.68, 24, 18),
        mats.bassWood,
        bass
      );
      waist.scale.set(0.78, 1.35, 0.39);
      waist.position.set(0, 2.3, 0);

      cylinder(
        bass,
        0.11,
        0.14,
        2.15,
        16,
        [0, 4.45, 0],
        mats.bassDark
      );

      const fingerboard = box(
        bass,
        [0.32, 3.0, 0.12],
        [0, 3.8, 0.34],
        mats.ebony,
        [-0.04, 0, 0]
      );
      fingerboard.scale.x = 1.08;

      box(bass, [0.22, 0.5, 0.2], [0, 5.65, 0], mats.bassDark);
      cylinder(
        bass,
        0.19,
        0.25,
        0.5,
        16,
        [0, 5.95, 0],
        mats.bassWood
      );

      const scroll = mesh(
        new THREE.TorusGeometry(0.2, 0.075, 10, 22, Math.PI * 1.7),
        mats.bassWood,
        bass
      );
      scroll.position.set(0.05, 6.25, 0);
      scroll.rotation.x = Math.PI / 2;

      const bridge = box(
        bass,
        [0.75, 0.08, 0.13],
        [0, 2.17, 0.46],
        mats.ivory
      );

      for (const x of [-0.16, -0.055, 0.055, 0.16]) {
        cylinder(
          bass,
          0.009,
          0.009,
          4.12,
          6,
          [x, 3.58, 0.5],
          mats.chrome
        );
      }

      for (const side of [-1, 1]) {
        const fHole = mesh(
          new THREE.TorusGeometry(0.33, 0.035, 7, 20, Math.PI * 1.15),
          mats.bassDark,
          bass
        );
        fHole.position.set(side * 0.5, 2.27, 0.52);
        fHole.rotation.set(0, 0, side * 0.25);
        fHole.scale.y = 1.7;
      }

      cylinder(
        bass,
        0.035,
        0.035,
        0.85,
        8,
        [0, 0.38, 0],
        mats.chrome
      );

      const endPin = cylinder(
        bass,
        0.11,
        0.04,
        0.18,
        12,
        [0, -0.02, 0],
        mats.black
      );

      bass.rotation.z = -0.035;
      return bass;
    }

    const bass = createBass();

    function pianoShape() {
      const shape = new THREE.Shape();
      shape.moveTo(-2.8, -1.15);
      shape.lineTo(1.8, -1.15);
      shape.bezierCurveTo(3.4, -1.05, 3.55, 0.45, 2.15, 1.3);
      shape.bezierCurveTo(0.9, 1.95, -0.4, 1.55, -2.8, 1.15);
      shape.lineTo(-2.8, -1.15);
      return shape;
    }

    function createPiano() {
      const piano = new THREE.Group();
      piano.position.set(2.3, 2.05, -6.6);
      piano.rotation.y = -0.16;
      stage.add(piano);

      const bodyGeometry = new THREE.ExtrudeGeometry(pianoShape(), {
        depth: 0.72,
        bevelEnabled: true,
        bevelSize: 0.08,
        bevelThickness: 0.06,
        bevelSegments: 3,
        curveSegments: 24
      });
      bodyGeometry.rotateX(Math.PI / 2);
      bodyGeometry.translate(0, 0.36, 0);

      const body = mesh(bodyGeometry, mats.piano, piano);
      body.scale.set(0.9, 0.9, 0.9);

      const rimGeometry = new THREE.ExtrudeGeometry(pianoShape(), {
        depth: 0.1,
        bevelEnabled: true,
        bevelSize: 0.06,
        bevelThickness: 0.04,
        bevelSegments: 2,
        curveSegments: 24
      });
      rimGeometry.rotateX(Math.PI / 2);

      const lid = mesh(rimGeometry, mats.piano, piano);
      lid.scale.set(0.91, 0.91, 0.91);
      lid.position.set(0.12, 1.18, 0.34);
      lid.rotation.z = -0.11;
      lid.rotation.x = -0.32;

      cylinder(
        piano,
        0.045,
        0.045,
        2.3,
        10,
        [1.95, 1.85, 0.2],
        mats.oldBrass,
        [0, 0, -0.54]
      );

      box(piano, [5.3, 0.25, 1.08], [-2.4, 0.5, 0], mats.piano);
      box(piano, [5.1, 0.08, 0.92], [-2.42, 0.69, 0], mats.ivory);

      const whiteCount = 24;
      for (let i = 0; i < whiteCount; i++) {
        const key = box(
          piano,
          [0.185, 0.08, 0.82],
          [-4.55 + i * 0.19, 0.76, 0],
          mats.ivory
        );
        key.position.z = 0.05;
      }

      const blackPattern = [0, 1, 3, 4, 5];
      for (let octave = 0; octave < 4; octave++) {
        for (const n of blackPattern) {
          const x = -4.46 + (octave * 7 + n) * 0.19;
          box(
            piano,
            [0.11, 0.13, 0.49],
            [x, 0.84, -0.13],
            mats.ebony
          );
        }
      }

      for (const p of [
        [-4.35, -0.95, -0.35],
        [1.65, -0.95, -0.55],
        [1.8, -0.95, 0.55]
      ]) {
        cylinder(
          piano,
          0.1,
          0.15,
          3.0,
          14,
          p,
          mats.piano
        );
        cylinder(
          piano,
          0.17,
          0.2,
          0.12,
          14,
          [p[0], p[1] - 1.5, p[2]],
          mats.gold
        );
      }

      const pedalSupport = box(
        piano,
        [0.2, 1.55, 0.18],
        [-1.3, -0.66, 0.2],
        mats.piano
      );
      pedalSupport.rotation.z = -0.2;

      for (const x of [-1.45, -1.2]) {
        box(
          piano,
          [0.38, 0.06, 0.13],
          [x, -1.47, 0.15],
          mats.brass,
          [0, 0, -0.15]
        );
      }

      const bench = new THREE.Group();
      bench.position.set(-5.3, -1.1, 0.9);
      piano.add(bench);
      box(bench, [2.0, 0.32, 0.82], [0, 0.65, 0], mats.redLeather);

      for (const x of [-0.72, 0.72]) {
        for (const z of [-0.25, 0.25]) {
          cylinder(
            bench,
            0.07,
            0.09,
            1.3,
            10,
            [x, 0, z],
            mats.black
          );
        }
      }

      return piano;
    }

    createPiano();

    function createDrum(parent, radius, depth, position, rotation = null) {
      const drum = new THREE.Group();
      drum.position.set(position[0], position[1], position[2]);
      if (rotation) {
        drum.rotation.set(rotation[0], rotation[1], rotation[2]);
      }
      parent.add(drum);

      cylinder(
        drum,
        radius,
        radius,
        depth,
        28,
        [0, 0, 0],
        mats.drumRed
      );
      cylinder(
        drum,
        radius * 1.02,
        radius * 1.02,
        0.05,
        28,
        [0, depth * 0.51, 0],
        mats.drumSkin
      );
      cylinder(
        drum,
        radius * 1.04,
        radius * 1.04,
        0.06,
        28,
        [0, -depth * 0.51, 0],
        mats.chrome
      );

      for (let i = 0; i < 8; i++) {
        const a = i / 8 * Math.PI * 2;
        cylinder(
          drum,
          0.025,
          0.025,
          depth,
          6,
          [Math.cos(a) * radius, 0, Math.sin(a) * radius],
          mats.chrome
        );
      }
      return drum;
    }

    function createCymbal(parent, radius, position) {
      const cymbalGroup = new THREE.Group();
      cymbalGroup.position.set(position[0], position[1], position[2]);
      parent.add(cymbalGroup);

      cylinder(
        cymbalGroup,
        0.035,
        0.045,
        position[1],
        9,
        [0, -position[1] * 0.5, 0],
        mats.chrome
      );

      const cymbal = mesh(
        new THREE.CylinderGeometry(
          radius * 0.18,
          radius,
          0.055,
          40,
          1
        ),
        mats.brass,
        cymbalGroup
      );
      cymbal.scale.y = 0.5;
      cymbal.rotation.z = 0.04;

      const bell = mesh(
        new THREE.SphereGeometry(radius * 0.2, 18, 8, 0, Math.PI * 2, 0, Math.PI / 2),
        mats.brass,
        cymbalGroup
      );
      bell.scale.y = 0.45;
      bell.position.y = 0.03;

      return cymbal;
    }

    function createDrumKit() {
      const kit = new THREE.Group();
      kit.position.set(6.5, 1.05, -5.6);
      kit.rotation.y = -0.18;
      stage.add(kit);

      const bassDrum = createDrum(
        kit,
        1.15,
        0.8,
        [0, 1.15, 0],
        [Math.PI / 2, 0, 0]
      );

      const frontSkin = mesh(
        new THREE.CircleGeometry(1.03, 40),
        new THREE.MeshStandardMaterial({
          color: 0x151116,
          roughness: 0.68
        }),
        bassDrum
      );
      frontSkin.rotation.x = -Math.PI / 2;
      frontSkin.position.y = -0.44;

      const logo = mesh(
        new THREE.TorusGeometry(0.36, 0.035, 10, 40),
        mats.gold,
        frontSkin
      );
      logo.position.z = 0.015;

      createDrum(
        kit,
        0.72,
        0.55,
        [-1.25, 1.65, 0.1],
        [0, 0, 0.12]
      );
      createDrum(
        kit,
        0.62,
        0.7,
        [-0.55, 2.42, -0.18],
        [0.12, 0, -0.16]
      );
      createDrum(
        kit,
        0.56,
        0.65,
        [0.6, 2.5, -0.18],
        [0.12, 0, 0.15]
      );
      createDrum(
        kit,
        0.82,
        0.72,
        [1.42, 1.15, 0.2],
        [0, 0, -0.05]
      );

      const cymbalA = createCymbal(kit, 0.92, [-1.65, 3.65, -0.2]);
      const cymbalB = createCymbal(kit, 1.05, [1.55, 3.8, -0.35]);
      const hiHat = createCymbal(kit, 0.62, [-2.0, 2.85, 0.5]);

      const hiHatTop = mesh(
        new THREE.CylinderGeometry(0.12, 0.62, 0.045, 32),
        mats.brass,
        hiHat.parent
      );
      hiHatTop.position.copy(hiHat.position);
      hiHatTop.position.y += 0.11;

      const stool = new THREE.Group();
      stool.position.set(0, 0.1, -1.2);
      kit.add(stool);
      cylinder(stool, 0.6, 0.55, 0.22, 24, [0, 1.1, 0], mats.redLeather);
      cylinder(stool, 0.08, 0.08, 1.1, 10, [0, 0.5, 0], mats.chrome);

      return { kit, cymbalA, cymbalB, hiHat };
    }

    const drums = createDrumKit();

    function createMicrophone() {
      const mic = new THREE.Group();
      mic.position.set(-0.8, 1.05, -2.6);
      stage.add(mic);

      cylinder(mic, 0.62, 0.72, 0.13, 28, [0, 0.07, 0], mats.black);
      cylinder(mic, 0.34, 0.5, 0.09, 24, [0, 0.17, 0], mats.gold);
      cylinder(mic, 0.055, 0.075, 3.75, 14, [0, 2.05, 0], mats.chrome);

      const collar = cylinder(
        mic,
        0.12,
        0.12,
        0.18,
        14,
        [0, 3.86, 0],
        mats.oldBrass
      );

      const head = mesh(
        new THREE.CapsuleGeometry(0.38, 0.62, 12, 24),
        new THREE.MeshStandardMaterial({
          color: 0x85775e,
          roughness: 0.34,
          metalness: 0.82
        }),
        mic
      );
      head.position.set(0, 4.45, 0);
      head.scale.z = 0.68;

      for (let i = -3; i <= 3; i++) {
        const rib = mesh(
          new THREE.TorusGeometry(
            0.39,
            0.018,
            6,
            30,
            Math.PI
          ),
          mats.chrome,
          mic
        );
        rib.position.set(0, 4.45 + i * 0.12, -0.02);
        rib.rotation.y = Math.PI / 2;
      }

      for (const x of [-0.24, 0, 0.24]) {
        box(
          mic,
          [0.025, 0.92, 0.04],
          [x, 4.45, 0.36],
          mats.chrome
        );
      }

      return { mic, head, collar };
    }

    const microphone = createMicrophone();

    const candleLights = [];
    const candleFlames = [];
    const tableGroups = [];

    function createChair(parent, position, angle) {
      const chair = new THREE.Group();
      chair.position.set(position[0], position[1], position[2]);
      chair.rotation.y = angle;
      parent.add(chair);

      cylinder(chair, 0.72, 0.68, 0.22, 24, [0, 1.1, 0], mats.redLeather);
      box(chair, [1.35, 1.45, 0.2], [0, 2.0, 0.47], mats.redLeather);

      for (const x of [-0.48, 0.48]) {
        for (const z of [-0.34, 0.34]) {
          cylinder(
            chair,
            0.045,
            0.065,
            1.1,
            8,
            [x, 0.53, z],
            mats.black
          );
        }
      }

      const trim = mesh(
        new THREE.TorusGeometry(0.56, 0.035, 8, 28, Math.PI),
        mats.gold,
        chair
      );
      trim.position.set(0, 2.27, 0.59);
      trim.rotation.z = Math.PI;
    }

    function createTable(x, z, scale = 1) {
      const table = new THREE.Group();
      table.position.set(x, 0, z);
      table.scale.setScalar(scale);
      scene.add(table);
      tableGroups.push(table);

      cylinder(table, 1.42, 1.42, 0.16, 36, [0, 2.15, 0], mats.wood);
      cylinder(table, 1.47, 1.47, 0.045, 36, [0, 2.26, 0], mats.gold);
      cylinder(table, 0.11, 0.14, 2.05, 14, [0, 1.05, 0], mats.black);
      cylinder(table, 0.72, 0.9, 0.12, 28, [0, 0.08, 0], mats.black);

      const lampBase = cylinder(
        table,
        0.22,
        0.27,
        0.11,
        20,
        [0, 2.39, 0],
        mats.oldBrass
      );

      cylinder(
        table,
        0.035,
        0.035,
        0.43,
        10,
        [0, 2.63, 0],
        mats.oldBrass
      );

      const shadeMaterial = new THREE.MeshPhysicalMaterial({
        color: 0x7e201e,
        emissive: 0xff3e15,
        emissiveIntensity: 1.35,
        roughness: 0.62,
        transparent: true,
        opacity: 0.9,
        side: THREE.DoubleSide
      });

      const shade = mesh(
        new THREE.CylinderGeometry(0.27, 0.49, 0.48, 24, 1, true),
        shadeMaterial,
        table
      );
      shade.position.y = 2.92;

      const flame = mesh(
        new THREE.SphereGeometry(0.065, 10, 8),
        new THREE.MeshBasicMaterial({
          color: 0xffd37a
        }),
        table
      );
      flame.scale.set(0.7, 1.5, 0.7);
      flame.position.y = 2.85;
      candleFlames.push(flame);

      const light = new THREE.PointLight(0xff7c38, 1.45, 5.5, 2);
      light.position.set(0, 3.0, 0);
      table.add(light);
      candleLights.push(light);

      createChair(
        table,
        [-1.6, 0, 0.8],
        Math.atan2(1.6, 0.8) - Math.PI / 2
      );
      createChair(
        table,
        [1.6, 0, 0.8],
        Math.atan2(-1.6, 0.8) - Math.PI / 2
      );

      return table;
    }

    createTable(-6.8, 3.2, 0.92);
    createTable(0.2, 4.8, 0.9);
    createTable(7.1, 3.3, 0.92);
    createTable(-10.4, 9.2, 0.88);
    createTable(-3.6, 10.8, 0.9);
    createTable(4.1, 10.7, 0.9);
    createTable(10.5, 9.0, 0.88);

    function makeGlass(parent, x, z) {
      const glassMaterial = new THREE.MeshPhysicalMaterial({
        color: 0x9ec3c4,
        roughness: 0.1,
        transmission: 0.62,
        thickness: 0.2,
        transparent: true,
        opacity: 0.42
      });
      const glass = mesh(
        new THREE.CylinderGeometry(0.16, 0.13, 0.42, 16, 1, true),
        glassMaterial,
        parent
      );
      glass.position.set(x, 2.5, z);
      cylinder(
        parent,
        0.13,
        0.13,
        0.12,
        16,
        [x, 2.34, z],
        new THREE.MeshStandardMaterial({
          color: 0x6d2816,
          roughness: 0.3
        })
      );
    }

    for (const table of tableGroups) {
      makeGlass(table, -0.65, 0.3);
      makeGlass(table, 0.66, 0.2);
    }

    function createSconce(x, y, side) {
      const group = new THREE.Group();
      group.position.set(x, y, -10.05);
      scene.add(group);

      box(group, [0.18, 1.7, 0.18], [0, 0, 0], mats.gold);
      box(group, [1.1, 0.12, 0.16], [0, 0.62, 0], mats.gold);

      const globe = mesh(
        new THREE.SphereGeometry(0.32, 20, 14),
        new THREE.MeshStandardMaterial({
          color: 0xffc878,
          emissive: 0xff7a24,
          emissiveIntensity: 1.8,
          roughness: 0.45
        }),
        group
      );
      globe.position.set(0, 0.95, 0.3);

      const light = new THREE.PointLight(0xff7b32, 1.3, 6);
      light.position.set(0, 0.95, 0.7);
      group.add(light);

      for (const a of [-0.55, 0.55]) {
        const ray = box(
          group,
          [0.08, 1.4, 0.08],
          [0, 1.55, 0.05],
          mats.gold
        );
        ray.rotation.z = a;
      }

      group.rotation.y = side * 0.02;
    }

    createSconce(-15.2, 6.0, 1);
    createSconce(15.2, 6.0, -1);

    const ambient = new THREE.HemisphereLight(0x35405d, 0x17080a, 0.44);
    scene.add(ambient);

    const stageWarm = new THREE.PointLight(0xff8040, 18, 18, 2);
    stageWarm.position.set(0, 7, -8);
    stageWarm.castShadow = true;
    stageWarm.shadow.mapSize.set(1024, 1024);
    scene.add(stageWarm);

    const pianoFill = new THREE.PointLight(0x4f65c9, 11, 15, 2);
    pianoFill.position.set(6, 5, -3);
    scene.add(pianoFill);

    const bassFill = new THREE.PointLight(0xb62651, 9, 13, 2);
    bassFill.position.set(-7, 4, -3);
    scene.add(bassFill);

    const spotlightData = [];

    function createSpotlight(source, color, intensity, targetBase, phase) {
      const target = new THREE.Object3D();
      target.position.copy(targetBase);
      scene.add(target);

      const light = new THREE.SpotLight(
        color,
        intensity,
        31,
        Math.PI * 0.12,
        0.72,
        1.35
      );
      light.position.copy(source);
      light.target = target;
      light.castShadow = true;
      light.shadow.mapSize.set(1024, 1024);
      light.shadow.camera.near = 1;
      light.shadow.camera.far = 34;
      light.shadow.bias = -0.0002;
      scene.add(light);

      const housing = new THREE.Group();
      housing.position.copy(source);
      scene.add(housing);

      const can = cylinder(
        housing,
        0.5,
        0.7,
        1.2,
        20,
        [0, 0, 0],
        mats.black,
        [Math.PI / 2, 0, 0]
      );
      cylinder(
        housing,
        0.56,
        0.56,
        0.12,
        20,
        [0, -0.62, 0],
        mats.gold,
        [Math.PI / 2, 0, 0]
      );

      const beamMaterial = new THREE.MeshBasicMaterial({
        color,
        transparent: true,
        opacity: 0.085,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide
      });
      const beamGeometry = new THREE.ConeGeometry(
        4.4,
        20,
        32,
        1,
        true
      );
      beamGeometry.translate(0, -10, 0);
      const beam = new THREE.Mesh(beamGeometry, beamMaterial);
      beam.position.copy(source);
      beam.renderOrder = 1;
      scene.add(beam);

      spotlightData.push({
        light,
        target,
        beam,
        housing,
        source: source.clone(),
        base: targetBase.clone(),
        phase
      });
    }

    createSpotlight(
      new THREE.Vector3(-10, 13.5, -5),
      0x5486ff,
      65,
      new THREE.Vector3(4.5, 1, -5.5),
      0
    );
    createSpotlight(
      new THREE.Vector3(10, 13.5, -5),
      0xff476f,
      58,
      new THREE.Vector3(-4.5, 1, -5.3),
      Math.PI
    );
    createSpotlight(
      new THREE.Vector3(0, 14.5, -8),
      0xffc36b,
      48,
      new THREE.Vector3(-0.5, 1, -2.6),
      Math.PI * 0.5
    );

    function aimBeam(data) {
      const direction = new THREE.Vector3()
        .subVectors(data.target.position, data.source)
        .normalize();
      const length = data.source.distanceTo(data.target.position);
      data.beam.scale.set(
        length / 20,
        length / 20,
        length / 20
      );
      data.beam.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, -1, 0),
        direction
      );
      data.housing.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, -1, 0),
        direction
      );
    }

    spotlightData.forEach(aimBeam);

    const haze = new THREE.Group();
    scene.add(haze);

    const hazeMaterial = new THREE.MeshBasicMaterial({
      color: 0x8892b6,
      transparent: true,
      opacity: 0.055,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    for (let i = 0; i < 95; i++) {
      const puff = mesh(
        new THREE.SphereGeometry(range(0.08, 0.3), 8, 6),
        hazeMaterial.clone(),
        haze
      );
      puff.position.set(
        range(-12, 12),
        range(1.2, 10),
        range(-9, 9)
      );
      puff.material.opacity = range(0.018, 0.07);
      puff.userData.speed = range(0.05, 0.16);
      puff.userData.drift = range(-0.16, 0.16);
      puff.userData.phase = range(0, Math.PI * 2);
    }

    const dustGeometry = new THREE.BufferGeometry();
    const dustPositions = [];
    for (let i = 0; i < 750; i++) {
      dustPositions.push(
        range(-16, 16),
        range(0.8, 14),
        range(-10, 14)
      );
    }
    dustGeometry.setAttribute(
      'position',
      new THREE.Float32BufferAttribute(dustPositions, 3)
    );
    const dust = new THREE.Points(
      dustGeometry,
      new THREE.PointsMaterial({
        color: 0xe5cda9,
        size: 0.035,
        transparent: true,
        opacity: 0.34,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      })
    );
    scene.add(dust);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      for (let i = 0; i < spotlightData.length; i++) {
        const data = spotlightData[i];
        data.target.position.x =
          data.base.x + Math.sin(time * 0.19 + data.phase) * 2.2;
        data.target.position.z =
          data.base.z + Math.cos(time * 0.15 + data.phase) * 1.25;
        aimBeam(data);
        data.beam.material.opacity =
          0.07 + Math.sin(time * 0.7 + data.phase) * 0.012;
      }

      for (let i = 0; i < candleLights.length; i++) {
        const flutter =
          Math.sin(time * 7.0 + i * 1.7) * 0.11 +
          Math.sin(time * 13.0 + i * 2.1) * 0.06;
        candleLights[i].intensity = 1.42 + flutter;
        candleFlames[i].scale.y = 1.45 + flutter * 0.8;
        candleFlames[i].position.x =
          Math.sin(time * 5 + i) * 0.012;
      }

      drums.cymbalA.rotation.z =
        0.018 * Math.sin(time * 1.45);
      drums.cymbalB.rotation.x =
        0.014 * Math.sin(time * 1.2 + 1.5);
      drums.hiHat.rotation.z =
        0.01 * Math.sin(time * 2.1 + 0.7);

      microphone.head.rotation.z =
        0.018 * Math.sin(time * 0.72);
      bass.rotation.z =
        -0.035 + 0.006 * Math.sin(time * 0.45);

      haze.children.forEach((puff) => {
        puff.position.y += puff.userData.speed * 0.01;
        puff.position.x +=
          Math.sin(time * 0.18 + puff.userData.phase) *
          puff.userData.drift *
          0.004;
        if (puff.position.y > 11) {
          puff.position.y = 1.2;
        }
      });

      dust.rotation.y = time * 0.008;
      dust.position.y = Math.sin(time * 0.16) * 0.08;

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    animate();
  </script>
</body>
</html>
