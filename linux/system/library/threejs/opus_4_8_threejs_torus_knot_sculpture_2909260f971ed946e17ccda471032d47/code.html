<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Torus-Knot Sculpture — (3,2)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0d10; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  .caption {
    position: fixed;
    left: 22px;
    bottom: 18px;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(220, 224, 232, 0.55);
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="caption">(3,2) Torus Knot &nbsp;·&nbsp; Polished Steel</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------------------------------------------------------------------------
// Renderer
// ---------------------------------------------------------------------------
const container = document.getElementById('app');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// ---------------------------------------------------------------------------
// Scene & Camera
// ---------------------------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111114);

const camera = new THREE.PerspectiveCamera(
  42, window.innerWidth / window.innerHeight, 0.1, 100
);
camera.position.set(4.3, 2.7, 5.6);

// ---------------------------------------------------------------------------
// Environment map (for the mirror-polished reflections)
// ---------------------------------------------------------------------------
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTex;

// ---------------------------------------------------------------------------
// Lighting: hemisphere ambient + key / fill / rim directionals
// ---------------------------------------------------------------------------
const hemi = new THREE.HemisphereLight(0xbfd0e8, 0x1a1a20, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffffff, 2.6);
key.position.set(5.5, 8.5, 6.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 30;
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 6;
key.shadow.camera.bottom = -6;
key.shadow.bias = -0.0003;
key.shadow.normalBias = 0.02;
key.shadow.radius = 6;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9fb4d6, 0.7);
fill.position.set(-6.5, 3.5, 3.0);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 1.7);
rim.position.set(-3.5, 5.0, -6.5);
scene.add(rim);

// ---------------------------------------------------------------------------
// (3,2) Torus-knot curve (three.js standard parametric form)
// ---------------------------------------------------------------------------
class TorusKnotCurve extends THREE.Curve {
  constructor(radius = 1.05, p = 3, q = 2) {
    super();
    this.radius = radius;
    this.p = p;
    this.q = q;
  }
  getPoint(t, target = new THREE.Vector3()) {
    const { p, q, radius } = this;
    const u = t * p * Math.PI * 2;
    const cu = Math.cos(u), su = Math.sin(u);
    const quOverP = (q / p) * u;
    const cs = Math.cos(quOverP);
    const x = radius * (2 + cs) * 0.5 * cu;
    const y = radius * (2 + cs) * 0.5 * su;
    const z = radius * Math.sin(quOverP) * 0.5;
    return target.set(x, y, z);
  }
}

// Sweep a flat rectangular cross-section along the curve => a polished ribbon.
function buildRibbon(curve, segments, width, thickness) {
  const frames = curve.computeFrenetFrames(segments, true);
  const positions = [];
  const indices = [];
  const P = new THREE.Vector3();
  const N = new THREE.Vector3();
  const B = new THREE.Vector3();
  const v = new THREE.Vector3();
  const hw = width * 0.5, ht = thickness * 0.5;

  // cross-section corners as offsets along (Normal, Binormal)
  const corners = [
    [ ht,  hw],
    [ ht, -hw],
    [-ht, -hw],
    [-ht,  hw],
  ];

  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    P.copy(curve.getPointAt(t));
    N.copy(frames.normals[i]);
    B.copy(frames.binormals[i]);
    for (const [n, b] of corners) {
      v.copy(P).addScaledVector(N, n).addScaledVector(B, b);
      positions.push(v.x, v.y, v.z);
    }
  }

  for (let i = 0; i < segments; i++) {
    const a = i * 4;
    const c = (i + 1) * 4;
    for (let j = 0; j < 4; j++) {
      const j2 = (j + 1) % 4;
      indices.push(a + j, a + j2, c + j2, a + j, c + j2, c + j);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  geo.computeBoundingBox();
  return geo;
}

// ---------------------------------------------------------------------------
// The single centered sculpture (knot ribbon + pedestal)
// ---------------------------------------------------------------------------
const sculpture = new THREE.Group();
scene.add(sculpture);

// --- pedestal ---
const pedestalMat = new THREE.MeshStandardMaterial({
  color: 0x17181c,
  metalness: 0.35,
  roughness: 0.55,
  envMapIntensity: 0.6,
});

const baseH = 0.30, topH = 0.14;
const pedBase = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.22, baseH, 96), pedestalMat);
pedBase.position.y = baseH / 2;
pedBase.castShadow = true;
pedBase.receiveShadow = true;
sculpture.add(pedBase);

const pedTop = new THREE.Mesh(new THREE.CylinderGeometry(0.98, 1.02, topH, 96), pedestalMat);
pedTop.position.y = baseH + topH / 2;
pedTop.castShadow = true;
pedTop.receiveShadow = true;
sculpture.add(pedTop);

const pedestalTopY = baseH + topH;

// --- polished knot ribbon ---
const knotCurve = new TorusKnotCurve(1.05, 3, 2);
const knotGeo = buildRibbon(knotCurve, 760, 0.55, 0.05);

const knotMat = new THREE.MeshStandardMaterial({
  color: 0xf2f4f8,
  metalness: 1.0,
  roughness: 0.06,
  envMapIntensity: 1.35,
  side: THREE.DoubleSide,
});

const knot = new THREE.Mesh(knotGeo, knotMat);
knot.castShadow = true;
knot.receiveShadow = true;
// rest the lowest point of the knot on the pedestal top
knot.position.y = pedestalTopY - knotGeo.boundingBox.min.y;
sculpture.add(knot);

const knotHeight = knotGeo.boundingBox.max.y - knotGeo.boundingBox.min.y;
const sculptureCenterY = pedestalTopY + knotHeight * 0.5;

// ---------------------------------------------------------------------------
// Shadow-catcher ground plane
// ---------------------------------------------------------------------------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

// ---------------------------------------------------------------------------
// Controls
// ---------------------------------------------------------------------------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 3.4;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, sculptureCenterY, 0);
controls.update();

// ---------------------------------------------------------------------------
// Resize
// ---------------------------------------------------------------------------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

// ---------------------------------------------------------------------------
// Render loop
// ---------------------------------------------------------------------------
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
