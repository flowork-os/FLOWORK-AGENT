<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Lava Lamp</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #08030d;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08030d);
scene.fog = new THREE.FogExp2(0x08030d, 0.045);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.1, 3.2, 9.2);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.22;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.enablePan = false;
controls.minDistance = 7;
controls.maxDistance = 17;
controls.minPolarAngle = Math.PI * 0.25;
controls.maxPolarAngle = Math.PI * 0.67;
controls.target.set(0, -0.1, 0);

const world = new THREE.Group();
world.rotation.y = -0.18;
scene.add(world);

scene.add(new THREE.HemisphereLight(0x6b4c92, 0x170a0a, 0.7));

const key = new THREE.DirectionalLight(0xffb774, 2.2);
key.position.set(4, 7, 5);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -5;
key.shadow.bias = -0.0003;
scene.add(key);

const rim = new THREE.DirectionalLight(0x795dff, 2.4);
rim.position.set(-5, 3, -4);
scene.add(rim);

const glowLight = new THREE.PointLight(0xff3c13, 18, 7, 1.8);
glowLight.position.set(0, -0.4, 0);
world.add(glowLight);

const upperGlow = new THREE.PointLight(0xffa52a, 7, 4.5, 2);
upperGlow.position.set(0, 1.45, 0.1);
world.add(upperGlow);

const metal = new THREE.MeshStandardMaterial({
  color: 0x8d6039,
  metalness: 0.88,
  roughness: 0.24
});

const darkMetal = new THREE.MeshStandardMaterial({
  color: 0x27161b,
  metalness: 0.9,
  roughness: 0.2
});

const trimMetal = new THREE.MeshStandardMaterial({
  color: 0xd69a52,
  metalness: 0.93,
  roughness: 0.18
});

function lathe(profile, material, segments = 96) {
  const geometry = new THREE.LatheGeometry(
    profile.map(([r, y]) => new THREE.Vector2(r, y)),
    segments
  );
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const baseProfile = [
  [0.00, -3.18], [0.78, -3.18], [0.92, -3.12], [1.10, -2.93],
  [1.28, -2.55], [1.38, -2.17], [1.38, -2.05], [1.27, -1.91],
  [1.06, -1.84], [0.88, -1.82], [0.00, -1.82]
];
const base = lathe(baseProfile, metal);
world.add(base);

const baseInset = lathe([
  [0.00, -3.19], [0.73, -3.19], [0.90, -3.12],
  [0.98, -3.04], [0.00, -3.04]
], darkMetal);
world.add(baseInset);

const lowerTrim = new THREE.Mesh(
  new THREE.TorusGeometry(1.325, 0.055, 16, 96),
  trimMetal
);
lowerTrim.rotation.x = Math.PI / 2;
lowerTrim.position.y = -2.09;
lowerTrim.castShadow = true;
world.add(lowerTrim);

const glassMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xffc6a6,
  roughness: 0.06,
  metalness: 0,
  transmission: 0.94,
  thickness: 0.22,
  ior: 1.46,
  transparent: true,
  opacity: 0.32,
  clearcoat: 1,
  clearcoatRoughness: 0.05,
  side: THREE.DoubleSide,
  depthWrite: false
});

const glassProfile = [
  [0.87, -1.88],
  [1.00, -1.60],
  [1.13, -1.08],
  [1.22, -0.45],
  [1.25, 0.28],
  [1.19, 0.98],
  [1.05, 1.62],
  [0.91, 2.02]
];
const glass = lathe(glassProfile, glassMaterial, 128);
glass.castShadow = false;
glass.renderOrder = 5;
world.add(glass);

const liquidMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x5a061e,
  emissive: 0x5e0710,
  emissiveIntensity: 0.5,
  roughness: 0.18,
  transmission: 0.45,
  thickness: 1.7,
  ior: 1.34,
  transparent: true,
  opacity: 0.65,
  side: THREE.DoubleSide,
  depthWrite: false
});

const liquidProfile = [
  [0.00, -1.78], [0.81, -1.78], [0.94, -1.48], [1.06, -0.96],
  [1.14, -0.38], [1.16, 0.26], [1.10, 0.91], [0.98, 1.48],
  [0.87, 1.88], [0.00, 1.88]
];
const liquid = lathe(liquidProfile, liquidMaterial, 128);
liquid.castShadow = false;
liquid.renderOrder = 1;
world.add(liquid);

const capProfile = [
  [0.00, 1.91], [0.91, 1.91], [0.98, 2.02], [0.91, 2.22],
  [0.76, 2.54], [0.60, 2.75], [0.42, 2.87], [0.00, 2.87]
];
const cap = lathe(capProfile, metal);
world.add(cap);

const capBand = new THREE.Mesh(
  new THREE.TorusGeometry(0.925, 0.045, 14, 96),
  trimMetal
);
capBand.rotation.x = Math.PI / 2;
capBand.position.y = 2.02;
capBand.castShadow = true;
world.add(capBand);

const topDisk = new THREE.Mesh(
  new THREE.CylinderGeometry(0.43, 0.43, 0.055, 64),
  darkMetal
);
topDisk.position.y = 2.875;
topDisk.castShadow = true;
world.add(topDisk);

const waxMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xff5423,
  emissive: 0xff2108,
  emissiveIntensity: 1.75,
  roughness: 0.2,
  metalness: 0,
  transmission: 0.36,
  thickness: 1.15,
  ior: 1.42,
  transparent: true,
  opacity: 0.9,
  clearcoat: 0.55,
  clearcoatRoughness: 0.16
});

const waxCoreMaterial = new THREE.MeshBasicMaterial({
  color: 0xffa32f,
  transparent: true,
  opacity: 0.28,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

function makeBlob(seed, scale, position) {
  const group = new THREE.Group();
  group.position.copy(position);

  const geometry = new THREE.SphereGeometry(1, 48, 36);
  const pos = geometry.attributes.position;
  const v = new THREE.Vector3();

  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const nx = v.x;
    const ny = v.y;
    const nz = v.z;
    const wave =
      1 +
      0.075 * Math.sin(ny * 5.2 + seed) +
      0.055 * Math.sin(nx * 4.1 + nz * 3.3 + seed * 1.7) +
      0.035 * Math.cos(nz * 6.0 - ny * 2.4 + seed);
    const leanX = 0.11 * ny * ny * Math.sin(seed * 1.9);
    const leanZ = 0.08 * ny * ny * Math.cos(seed * 1.3);
    pos.setXYZ(
      i,
      v.x * wave + leanX,
      v.y * (1 + 0.04 * Math.sin(seed + v.x * 3)),
      v.z * wave + leanZ
    );
  }
  geometry.computeVertexNormals();

  const shell = new THREE.Mesh(geometry, waxMaterial);
  shell.scale.copy(scale);
  shell.castShadow = true;
  shell.receiveShadow = true;
  shell.renderOrder = 3;
  group.add(shell);

  const core = new THREE.Mesh(new THREE.SphereGeometry(0.72, 32, 24), waxCoreMaterial);
  core.scale.copy(scale);
  core.renderOrder = 4;
  group.add(core);

  group.userData.seed = seed;
  group.userData.origin = position.clone();
  group.userData.speed = 0.22 + seed * 0.018;
  group.userData.phase = seed * 1.43;
  return group;
}

const blobs = [
  makeBlob(1.1, new THREE.Vector3(0.64, 0.93, 0.61), new THREE.Vector3(-0.26, -1.28, 0.04)),
  makeBlob(2.3, new THREE.Vector3(0.43, 0.69, 0.43), new THREE.Vector3(0.43, -0.22, 0.15)),
  makeBlob(3.8, new THREE.Vector3(0.56, 0.78, 0.50), new THREE.Vector3(-0.30, 0.78, -0.10)),
  makeBlob(5.2, new THREE.Vector3(0.31, 0.46, 0.31), new THREE.Vector3(0.38, 1.43, 0.06))
];
blobs.forEach(blob => world.add(blob));

const heaterGlow = new THREE.Mesh(
  new THREE.CylinderGeometry(0.72, 0.86, 0.18, 64),
  new THREE.MeshBasicMaterial({
    color: 0xff5a16,
    transparent: true,
    opacity: 0.72,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
heaterGlow.position.y = -1.79;
world.add(heaterGlow);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(7.5, 128),
  new THREE.MeshStandardMaterial({
    color: 0x130b17,
    roughness: 0.58,
    metalness: 0.16
  })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -3.205;
floor.receiveShadow = true;
scene.add(floor);

const halo = new THREE.Mesh(
  new THREE.RingGeometry(1.0, 4.2, 128),
  new THREE.MeshBasicMaterial({
    color: 0x6e1835,
    transparent: true,
    opacity: 0.16,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
halo.rotation.x = -Math.PI / 2;
halo.position.y = -3.195;
scene.add(halo);

const backdropGlow = new THREE.Mesh(
  new THREE.CircleGeometry(4.2, 96),
  new THREE.MeshBasicMaterial({
    color: 0x38103f,
    transparent: true,
    opacity: 0.12,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
backdropGlow.position.set(0, 0.2, -3.2);
scene.add(backdropGlow);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  blobs.forEach((blob, index) => {
    const u = t * blob.userData.speed + blob.userData.phase;
    const range = 2.95;
    const cycle = ((u % range) + range) % range;
    const baseY = -1.25 + cycle;
    const pause = 0.12 * Math.sin(u * 2.1 + index);
    blob.position.y = THREE.MathUtils.clamp(baseY + pause, -1.35, 1.65);
    blob.position.x = blob.userData.origin.x + Math.sin(t * 0.44 + index * 1.7) * 0.13;
    blob.position.z = blob.userData.origin.z + Math.cos(t * 0.37 + index * 1.3) * 0.11;
    blob.rotation.x = Math.sin(t * 0.32 + index) * 0.12;
    blob.rotation.y = t * (0.10 + index * 0.018);
    blob.rotation.z = Math.cos(t * 0.28 + index * 0.7) * 0.1;

    const pulse = 1 + Math.sin(t * 0.85 + index * 1.9) * 0.035;
    blob.scale.set(pulse, 1 / pulse, pulse);
  });

  glowLight.intensity = 17.5 + Math.sin(t * 1.7) * 1.4;
  upperGlow.intensity = 6.7 + Math.sin(t * 1.15 + 1.2) * 0.8;
  heaterGlow.material.opacity = 0.68 + Math.sin(t * 1.9) * 0.08;
  halo.material.opacity = 0.14 + Math.sin(t * 1.1) * 0.025;

  controls.update();
  renderer.render(scene, camera);
}

animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
</body>
</html>
