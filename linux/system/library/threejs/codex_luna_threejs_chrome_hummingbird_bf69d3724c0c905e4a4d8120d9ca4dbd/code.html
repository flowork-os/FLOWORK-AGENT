<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid Chrome Hummingbird</title>
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #02050a; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02050a);
scene.fog = new THREE.FogExp2(0x02050a, 0.075);

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3.7, 1.7, 4.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.25;
controls.minDistance = 2.3;
controls.maxDistance = 8;
controls.target.set(0, 0.05, 0);

const chrome = new THREE.MeshPhysicalMaterial({
  color: 0xb8c6d0,
  metalness: 1,
  roughness: 0.075,
  clearcoat: 1,
  clearcoatRoughness: 0.045,
  reflectivity: 1
});

const darkChrome = new THREE.MeshPhysicalMaterial({
  color: 0x101820,
  metalness: 1,
  roughness: 0.12,
  clearcoat: 1,
  clearcoatRoughness: 0.05
});

const bird = new THREE.Group();
scene.add(bird);

const body = new THREE.Mesh(new THREE.SphereGeometry(0.62, 64, 40), chrome);
body.scale.set(1.42, 0.76, 0.7);
body.position.set(-0.18, 0, 0);
body.castShadow = true;
bird.add(body);

const chest = new THREE.Mesh(new THREE.SphereGeometry(0.48, 56, 36), chrome);
chest.scale.set(0.9, 1.12, 0.88);
chest.position.set(0.3, 0.08, 0);
chest.castShadow = true;
bird.add(chest);

const head = new THREE.Mesh(new THREE.SphereGeometry(0.43, 56, 36), chrome);
head.scale.set(1.05, 0.98, 0.95);
head.position.set(0.58, 0.38, 0);
head.castShadow = true;
bird.add(head);

const throat = new THREE.Mesh(new THREE.SphereGeometry(0.3, 48, 32), chrome);
throat.scale.set(0.8, 1.28, 0.86);
throat.position.set(0.42, 0.09, 0);
throat.castShadow = true;
bird.add(throat);

const bill = new THREE.Mesh(new THREE.ConeGeometry(0.115, 1.52, 40, 1), chrome);
bill.rotation.z = Math.PI / 2;
bill.position.set(1.25, 0.38, 0);
bill.castShadow = true;
bird.add(bill);

const eyeGeometry = new THREE.SphereGeometry(0.048, 24, 16);
for (const side of [-1, 1]) {
  const eye = new THREE.Mesh(eyeGeometry, darkChrome);
  eye.position.set(0.79, 0.5, side * 0.34);
  bird.add(eye);
}

function createWing(side) {
  const rows = 18;
  const cols = 12;
  const positions = [];
  const indices = [];

  for (let row = 0; row <= rows; row++) {
    const u = row / rows;
    const centerX = -0.18 - 0.68 * u;
    const centerY = 0.16 + 0.28 * Math.sin(Math.PI * u);
    const centerZ = side * (0.25 + 1.22 * u);
    const width = (0.11 + 0.48 * Math.sin(Math.PI * u) * (1 - 0.18 * u)) * (1 - 0.32 * u);

    for (let col = 0; col <= cols; col++) {
      const v = col / cols;
      const across = v * 2 - 1;
      const taper = Math.sin(Math.PI * u);
      const x = centerX + across * width * 0.8;
      const y = centerY + across * width * 0.56 + 0.08 * Math.sin(Math.PI * u) * (1 - across * across);
      const z = centerZ + side * across * width * 0.36;
      positions.push(x, y, z);
    }
  }

  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const a = row * (cols + 1) + col;
      const b = a + 1;
      const c = a + cols + 1;
      const d = c + 1;
      indices.push(a, c, b, b, c, d);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();

  const mesh = new THREE.Mesh(geometry, chrome);
  mesh.side = THREE.DoubleSide;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

bird.add(createWing(-1));
bird.add(createWing(1));

function createRibbon(points, startWidth, endWidth) {
  const curve = new THREE.CatmullRomCurve3(points);
  const segments = 28;
  const vertices = [];
  const faces = [];

  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const p = curve.getPointAt(t);
    const tangent = curve.getTangentAt(t).normalize();
    let across = new THREE.Vector3(0, 1, 0).cross(tangent).normalize();
    if (across.lengthSq() < 0.01) across.set(0, 0, 1);
    const width = THREE.MathUtils.lerp(startWidth, endWidth, t);
    const left = p.clone().addScaledVector(across, width);
    const right = p.clone().addScaledVector(across, -width);
    vertices.push(left.x, left.y, left.z, right.x, right.y, right.z);
  }

  for (let i = 0; i < segments; i++) {
    const a = i * 2;
    const b = a + 1;
    const c = a + 2;
    const d = a + 3;
    faces.push(a, c, b, b, c, d);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setIndex(faces);
  geometry.computeVertexNormals();

  const mesh = new THREE.Mesh(geometry, chrome);
  mesh.side = THREE.DoubleSide;
  mesh.castShadow = true;
  return mesh;
}

bird.add(createRibbon([
  new THREE.Vector3(-0.78, -0.12, -0.08),
  new THREE.Vector3(-1.2, -0.18, -0.14),
  new THREE.Vector3(-1.72, -0.12, -0.48),
  new THREE.Vector3(-2.15, 0.02, -0.72)
], 0.19, 0.025));

bird.add(createRibbon([
  new THREE.Vector3(-0.82, -0.18, 0.02),
  new THREE.Vector3(-1.3, -0.3, 0.1),
  new THREE.Vector3(-1.78, -0.5, 0.4),
  new THREE.Vector3(-2.22, -0.38, 0.62)
], 0.17, 0.018));

bird.add(createRibbon([
  new THREE.Vector3(-0.76, -0.1, 0.05),
  new THREE.Vector3(-1.16, -0.03, 0.28),
  new THREE.Vector3(-1.62, 0.2, 0.72),
  new THREE.Vector3(-2.02, 0.42, 0.92)
], 0.13, 0.012));

const hemi = new THREE.HemisphereLight(0x9cb9d5, 0x05070b, 1.8);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xd8efff, 4.2);
key.position.set(3, 5, 4);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.near = 0.1;
key.shadow.camera.far = 20;
key.shadow.camera.left = -4;
key.shadow.camera.right = 4;
key.shadow.camera.top = 4;
key.shadow.camera.bottom = -4;
scene.add(key);

const rim = new THREE.DirectionalLight(0x4e9cff, 5);
rim.position.set(-4, 2, -5);
scene.add(rim);

const warm = new THREE.PointLight(0xffc78b, 8, 8, 2);
warm.position.set(2, -1, 3);
scene.add(warm);

const cool = new THREE.PointLight(0x79bfff, 10, 9, 2);
cool.position.set(-2, 2, -3);
scene.add(cool);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();
  bird.position.y = Math.sin(time * 1.7) * 0.045;
  bird.rotation.z = Math.sin(time * 1.1) * 0.012;
  controls.update();
  renderer.render(scene, camera);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

animate();
</script>
</body>
</html>
