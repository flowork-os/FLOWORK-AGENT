<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Victorian Greenhouse Conservatory</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#9db6c5}
  canvas{display:block}
  #label{position:fixed;left:18px;bottom:16px;color:#e9f3e6;font:12px Georgia,serif;letter-spacing:.16em;text-transform:uppercase;text-shadow:0 1px 4px #16231f;pointer-events:none}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="label">The Fernery · Victorian Conservatory</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x91b7c9);
scene.fog = new THREE.FogExp2(0x9ebdc0, 0.018);

const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 150);
camera.position.set(13.5, 8.2, 16.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.22;
controls.minDistance = 8;
controls.maxDistance = 26;
controls.maxPolarAngle = Math.PI * 0.49;

let seed = 17491;
const rand = () => {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
};
const range = (a,b) => a + (b-a) * rand();
const pick = a => a[Math.floor(rand() * a.length)];

const clock = new THREE.Clock();
const animatedLeaves = [];
const hangingPlants = [];
const dust = [];

const mat = (color, rough=.65, metal=0) => new THREE.MeshStandardMaterial({
  color, roughness:rough, metalness:metal
});
const iron = mat(0x182d2d, .35, .86);
const agedIron = mat(0x28413b, .5, .72);
const brass = mat(0x9d7733, .3, .84);
const soil = mat(0x251a10, 1, 0);
const terracotta = mat(0x9f4b2c, .86, .02);
const brick = mat(0x70402d, .91, .01);
const grout = mat(0x97806b, .98, 0);
const wood = mat(0x563c25, .72, .02);
const darkWood = mat(0x2a2118, .75, .03);
const stone = mat(0x69766d, .72, .05);
const waterMat = new THREE.MeshPhysicalMaterial({
  color:0x4d9a9d, metalness:.03, roughness:.09,
  transmission:.2, transparent:true, opacity:.84, clearcoat:1
});
const glass = new THREE.MeshPhysicalMaterial({
  color:0xb9e3dc, roughness:.08, metalness:.03,
  transmission:.36, transparent:true, opacity:.22,
  side:THREE.DoubleSide, depthWrite:false
});
const leafMats = [
  mat(0x295d37,.7), mat(0x3f7a43,.72), mat(0x598d43,.76),
  mat(0x1e482e,.73), mat(0x71994b,.75)
];
const cream = mat(0xd4c39c,.88,.02);

function group(){ const g=new THREE.Group(); scene.add(g); return g; }
function box(parent,w,h,d,material,x=0,y=0,z=0){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; parent.add(m); return m;
}
function cyl(parent,r1,r2,h,material,x=0,y=0,z=0,radial=12){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,radial),material);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; parent.add(m); return m;
}
function sphere(parent,r,material,x=0,y=0,z=0){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),material);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; parent.add(m); return m;
}
function rod(parent,a,b,r,material){
  const v=new THREE.Vector3().subVectors(b,a);
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,v.length(),8),material);
  m.position.copy(a).add(b).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v.normalize());
  m.castShadow=true; parent.add(m); return m;
}
function canvasTexture(draw,w=256,h=256){
  const c=document.createElement('canvas'); c.width=w;c.height=h;
  const x=c.getContext('2d'); draw(x,w,h);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
}

const groundTex = canvasTexture((x,w,h)=>{
  x.fillStyle='#546651';x.fillRect(0,0,w,h);
  for(let i=0;i<2200;i++){
    const c=range(55,115)|0;
    x.fillStyle=`rgba(${c},${c+18},${c-8},${range(.04,.17)})`;
    x.fillRect(rand()*w,rand()*h,range(1,3),range(1,3));
  }
});
groundTex.repeat.set(12,12);
const groundMat = new THREE.MeshStandardMaterial({map:groundTex,roughness:1});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(50,50),groundMat);
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);

const skyGeo = new THREE.SphereGeometry(70,32,16);
const skyMat = new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false,
  uniforms:{top:{value:new THREE.Color(0x6e9bb4)},bottom:{value:new THREE.Color(0xe0d4b1)}},
  vertexShader:'varying vec3 vP; void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'uniform vec3 top;uniform vec3 bottom;varying vec3 vP;void main(){float f=smoothstep(-20.0,26.0,vP.y);gl_FragColor=vec4(mix(bottom,top,f),1.0);}'
});
scene.add(new THREE.Mesh(skyGeo,skyMat));

const building = group();
const W=10.5, D=13.5, wallH=5.0, ridgeH=8.7;
function ironBar(a,b,r=.045,material=iron){ return rod(building,a,b,r,material); }
function glassPanel(a,b,c,d){
  const shape=new THREE.Shape();
  shape.moveTo(a.x,a.y);shape.lineTo(b.x,b.y);shape.lineTo(c.x,c.y);shape.lineTo(d.x,d.y);shape.closePath();
  const geo=new THREE.ShapeGeometry(shape);
  const mesh=new THREE.Mesh(geo,glass);
  mesh.position.z=a.z; mesh.castShadow=false; building.add(mesh);
}

for(const x of [-W/2,-W/4,0,W/4,W/2]){
  ironBar(new THREE.Vector3(x,0,-D/2),new THREE.Vector3(x,wallH,-D/2),.065);
  ironBar(new THREE.Vector3(x,0,D/2),new THREE.Vector3(x,wallH,D/2),.065);
}
for(const z of [-D/2,-D/4,0,D/4,D/2]){
  ironBar(new THREE.Vector3(-W/2,0,z),new THREE.Vector3(-W/2,wallH,z),.065);
  ironBar(new THREE.Vector3(W/2,0,z),new THREE.Vector3(W/2,wallH,z),.065);
}
for(const x of [-W/2,-W/4,0,W/4,W/2]){
  ironBar(new THREE.Vector3(x,wallH,-D/2),new THREE.Vector3(x,ridgeH,0),.052);
  ironBar(new THREE.Vector3(x,wallH,D/2),new THREE.Vector3(x,ridgeH,0),.052);
}
for(const z of [-D/2,-D/4,0,D/4,D/2]){
  ironBar(new THREE.Vector3(-W/2,wallH,z),new THREE.Vector3(W/2,wallH,z),.052);
  ironBar(new THREE.Vector3(-W/2+(W/2)*Math.abs(z)/(D/2),ridgeH,0),new THREE.Vector3(W/2-(W/2)*Math.abs(z)/(D/2),ridgeH,0),.052);
}
for(const y of [0,.15,wallH]){
  ironBar(new THREE.Vector3(-W/2,y,-D/2),new THREE.Vector3(W/2,y,-D/2),.065);
  ironBar(new THREE.Vector3(-W/2,y,D/2),new THREE.Vector3(W/2,y,D/2),.065);
  ironBar(new THREE.Vector3(-W/2,y,-D/2),new THREE.Vector3(-W/2,y,D/2),.065);
  ironBar(new THREE.Vector3(W/2,y,-D/2),new THREE.Vector3(W/2,y,D/2),.065);
}
ironBar(new THREE.Vector3(-W/2,ridgeH,0),new THREE.Vector3(W/2,ridgeH,0),.075,agedIron);

for(const z of [-D/2+1.68,-D/2+5.05,-D/2+8.4]){
  for(const side of [-1,1]){
    const p1=new THREE.Vector3(side*W/2,0,z-1.55);
    const p2=new THREE.Vector3(side*W/2,wallH,z-1.55);
    const p3=new THREE.Vector3(side*W/2,wallH,z+1.55);
    const p4=new THREE.Vector3(side*W/2,0,z+1.55);
    glassPanel(p1,p2,p3,p4);
  }
}
for(const x of [-W/2+1.31,-W/4+.0,W/4, W/2-1.31]){
  for(const half of [-1,1]){
    const z1=0, z2=half*D/2;
    const a=new THREE.Vector3(x, ridgeH, z1);
    const b=new THREE.Vector3(x, wallH, z2);
    const c=new THREE.Vector3(x+W/4*.88, wallH, z2);
    const d=new THREE.Vector3(x+W/4*.88, ridgeH, z1);
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute([
      a.x,a.y,a.z,b.x,b.y,b.z,c.x,c.y,c.z, a.x,a.y,a.z,c.x,c.y,c.z,d.x,d.y,d.z
    ],3));
    g.computeVertexNormals(); const m=new THREE.Mesh(g,glass); building.add(m);
  }
}
for(const x of [-W/2,W/2]){
  for(const z of [-D/2+1.7,-D/2+5.1,-D/2+8.5]){
    const a=new THREE.Vector3(x,0,z),b=new THREE.Vector3(x,wallH,z);
    const c=new THREE.Vector3(x,wallH,z+3.25),d=new THREE.Vector3(x,0,z+3.25);
    glassPanel(a,b,c,d);
  }
}

const door = new THREE.Group(); building.add(door);
door.position.set(0,0,-D/2-.018);
box(door,1.6,4.15,.07,iron,0,2.08,0);
const doorway = new THREE.Mesh(new THREE.BoxGeometry(1.33,3.85,.08),glass);
door.add(doorway);doorway.position.y=2.0;
box(door,.055,3.9,.10,agedIron,0,2.0,.02);
box(door,1.55,.055,.10,agedIron,0,2.0,.02);
sphere(door,.09,brass,.56,2.05,-.1);

const path = new THREE.Group(); scene.add(path);
for(let z=-6.2;z<=6.2;z+=.62){
  for(let x=-1.16;x<=1.16;x+=.58){
    const b=new THREE.Mesh(new THREE.BoxGeometry(.54,.07,.56),brick);
    b.position.set(x+(z%1?-.02:.02),.045,z);
    b.rotation.y=range(-.025,.025); b.receiveShadow=true;b.castShadow=true;path.add(b);
  }
}
for(const x of [-1.5,1.5]) box(path,.12,.045,13.4,grout,x,.035,0);

function makeBench(x,z,length){
  const g=new THREE.Group(); scene.add(g);
  for(const h of [.65,1.5]){
    box(g,1.55,.12,length,wood,x,h,z);
    box(g,1.65,.05,length+.12,darkWood,x,h-.12,z);
  }
  for(const dz of [-length/2+.25,length/2-.25]){
    for(const dx of [-.64,.64]) rod(g,new THREE.Vector3(x+dx,0,z+dz),new THREE.Vector3(x+dx,1.52,z+dz),.055,agedIron);
  }
  return g;
}
makeBench(-3.45,-.45,11.1);
makeBench(3.45,-.45,11.1);

function leafShape(color,scale=1){
  const shape=new THREE.Shape();
  shape.moveTo(0,0);
  shape.bezierCurveTo(-.36,.17,-.5,.72,0,1.2);
  shape.bezierCurveTo(.5,.72,.36,.17,0,0);
  const geo=new THREE.ShapeGeometry(shape);
  const m=new THREE.MeshStandardMaterial({color,roughness:.72,side:THREE.DoubleSide});
  const leaf=new THREE.Mesh(geo,m);
  leaf.scale.setScalar(scale); leaf.castShadow=true;
  return leaf;
}
function pot(x,y,z,size=.42){
  const g=new THREE.Group();scene.add(g);g.position.set(x,y,z);
  cyl(g,size*.78,size, size*.78, terracotta,0,size*.39,0,14);
  cyl(g,size*.92,size*.92,.10,terracotta,0,size*.77,0,14);
  cyl(g,size*.69,size*.69,.06,soil,0,size*.83,0,14);
  return g;
}
function palm(x,y,z,s=1){
  const g=pot(x,y,z,.38*s);
  const crown=new THREE.Group();g.add(crown); crown.position.y=.72*s;
  const stem=cyl(crown,.065*s,.09*s,1.65*s,mat(0x644c27,.8),0,.72*s,0,8);
  stem.rotation.z=range(-.09,.09);
  for(let i=0;i<10;i++){
    const arm=new THREE.Group(); crown.add(arm); arm.rotation.y=i*Math.PI*2/10+range(-.14,.14);
    arm.rotation.z=range(.32,.62); arm.position.y=1.37*s;
    const frond=new THREE.Group();arm.add(frond);
    for(let j=0;j<8;j++){
      const l=leafShape(pick(leafMats).color, .26*s);
      l.position.set(0.08+j*.105*s,0,0); l.rotation.z=-Math.PI/2;
      l.rotation.y=(j-3.5)*.055; frond.add(l);
    }
    animatedLeaves.push({object:arm,phase:rand()*6.28,amp:range(.025,.07),base:arm.rotation.z});
  }
  return g;
}
function fern(x,y,z,s=1){
  const g=pot(x,y,z,.32*s);
  const crown=new THREE.Group();g.add(crown);crown.position.y=.59*s;
  for(let i=0;i<17;i++){
    const branch=new THREE.Group();crown.add(branch);
    branch.rotation.y=i*2.399+range(-.15,.15);branch.rotation.z=range(.24,.57);
    for(let j=0;j<5;j++){
      const l=leafShape(pick(leafMats).color,.15*s*(1-j*.045));
      l.position.x=j*.12*s;l.rotation.z=-1.55;l.rotation.y=(j%2?-.28:.28);branch.add(l);
    }
    animatedLeaves.push({object:branch,phase:rand()*6.28,amp:range(.035,.09),base:branch.rotation.z});
  }
  return g;
}
function broadLeaf(x,y,z,s=1){
  const g=pot(x,y,z,.42*s);
  const crown=new THREE.Group();g.add(crown);crown.position.y=.58*s;
  for(let i=0;i<9;i++){
    const arm=new THREE.Group(); crown.add(arm);
    arm.rotation.y=i*2.4;arm.rotation.z=range(.2,.55);
    const l=leafShape(pick(leafMats).color,.62*s);
    l.rotation.z=-1.05;l.rotation.y=range(-.22,.22);arm.add(l);
    animatedLeaves.push({object:arm,phase:rand()*6.28,amp:range(.018,.052),base:arm.rotation.z});
  }
  return g;
}

for(const side of [-1,1]){
  for(let z=-5.15;z<=4.85;z+=1.42){
    const x=side*range(2.86,3.95);
    const y=rand()>.48?.75:1.6;
    const r=rand();
    if(r<.34) palm(x,y,z,range(.65,.95));
    else if(r<.72) fern(x,y,z,range(.75,1.05));
    else broadLeaf(x,y,z,range(.68,.94));
  }
}
for(let z=-5.6;z<=5.4;z+=1.5){
  broadLeaf(-4.72,.04,z,range(.7,.95));
  fern(4.72,.04,z+.25,range(.85,1.1));
}

function hangingBasket(x,z,s=1){
  const g=new THREE.Group();scene.add(g);g.position.set(x,5.8,z);
  for(let i=0;i<3;i++){
    const a=i*Math.PI*2/3;
    rod(g,new THREE.Vector3(0,0,0),new THREE.Vector3(Math.cos(a)*.28*s,-.76*s,Math.sin(a)*.28*s),.018,brass);
  }
  cyl(g,.37*s,.27*s,.28*s,wood,0,-.88*s,0,14);
  const plant=new THREE.Group();g.add(plant);plant.position.y=-.95*s;
  for(let i=0;i<16;i++){
    const arm=new THREE.Group();plant.add(arm);arm.rotation.y=i*.8;arm.rotation.z=range(.15,.62);
    const l=leafShape(pick(leafMats).color,.36*s);l.rotation.z=-1.1;arm.add(l);
    animatedLeaves.push({object:arm,phase:rand()*6.28,amp:.035,base:arm.rotation.z});
  }
  hangingPlants.push({object:g,phase:rand()*6.28,x});
}
hangingBasket(-3.35,-3.4,.9);
hangingBasket(3.35,-.3,1.05);
hangingBasket(-3.4,3.5,.95);

const fountain=new THREE.Group();scene.add(fountain);
fountain.position.set(0,0,1.0);
cyl(fountain,1.25,1.42,.32,stone,0,.16,0,24);
cyl(fountain,1.08,1.08,.09,waterMat,0,.35,0,24);
cyl(fountain,.42,.55,.68,cream,0,.62,0,18);
cyl(fountain,.68,.4,.15,cream,0,.96,0,18);
const fountainLight=new THREE.PointLight(0xaee9dd,1.1,5,2);
fountainLight.position.set(0,1.45,0);fountain.add(fountainLight);
const streams=new THREE.Group();fountain.add(streams);
for(let i=0;i<10;i++){
  const a=i*Math.PI*2/10;
  const arc=new THREE.Mesh(new THREE.TorusGeometry(.27,.018,6,18,Math.PI*.75),waterMat);
  arc.position.set(Math.cos(a)*.35,1.23,Math.sin(a)*.35);
  arc.rotation.set(Math.PI/2,0,a);streams.add(arc);
}
const ripple=new THREE.Mesh(new THREE.RingGeometry(.22,.78,32),new THREE.MeshBasicMaterial({color:0xa5e4df,transparent:true,opacity:.42,side:THREE.DoubleSide}));
ripple.rotation.x=-Math.PI/2;ripple.position.y=.405;fountain.add(ripple);

const tools=new THREE.Group();scene.add(tools);tools.position.set(1.95,.06,-4.95);
const canBody=new THREE.Mesh(new THREE.SphereGeometry(.36,16,12),mat(0x5b7f71,.34,.7));
canBody.scale.set(1.1,.82,1);canBody.position.y=.36;canBody.castShadow=true;tools.add(canBody);
const handle=new THREE.Mesh(new THREE.TorusGeometry(.29,.045,8,18,Math.PI),agedIron);
handle.rotation.z=Math.PI/2;handle.position.set(0,.57,0);tools.add(handle);
rod(tools,new THREE.Vector3(.29,.42,0),new THREE.Vector3(.82,.54,0),.1,agedIron);
cyl(tools,.15,.08,.26,agedIron,.91,.55,0,10);tools.children.at(-1).rotation.z=Math.PI/2;
rod(tools,new THREE.Vector3(-.6,.04,.1),new THREE.Vector3(-.15,1.0,.1),.025,wood);
const trowel=new THREE.Mesh(new THREE.ConeGeometry(.13,.42,10),mat(0x87928a,.4,.55));
trowel.position.set(-.63,.16,.1);trowel.rotation.z=-2.7;trowel.castShadow=true;tools.add(trowel);

for(let i=0;i<16;i++){
  const mote=new THREE.Mesh(new THREE.SphereGeometry(.018+rand()*.022,6,5),new THREE.MeshBasicMaterial({color:0xfff4c7,transparent:true,opacity:range(.25,.7)}));
  mote.position.set(range(-4.5,4.5),range(1.0,7.3),range(-5.8,5.8));scene.add(mote);
  dust.push({object:mote,phase:rand()*6.28,drift:range(.08,.22),base:mote.position.clone()});
}

const sun = new THREE.DirectionalLight(0xffe5ae,4.1);
sun.position.set(-7,13,-5);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-11;sun.shadow.camera.right=11;
sun.shadow.camera.top=11;sun.shadow.camera.bottom=-11;
sun.shadow.camera.near=.5;sun.shadow.camera.far=35;
sun.shadow.bias=-.00025;scene.add(sun);
scene.add(new THREE.HemisphereLight(0xb9d7e6,0x455233,1.6));
const warm = new THREE.PointLight(0xffc976,1.0,13,2);
warm.position.set(-2.8,5.2,-1.4);scene.add(warm);

const shaftMat = new THREE.MeshBasicMaterial({color:0xffedb0,transparent:true,opacity:.055,depthWrite:false,side:THREE.DoubleSide});
for(const p of [[-2.7,6.2,-2.5],[2.6,6.4,2.2],[.4,6.4,-4.4]]){
  const cone=new THREE.Mesh(new THREE.ConeGeometry(1.5,7.5,16,1,true),shaftMat);
  cone.position.set(...p);cone.rotation.z=Math.PI;scene.add(cone);
}

function addExteriorTrees(){
  for(let i=0;i<18;i++){
    const a=rand()*Math.PI*2,r=range(10,18);
    const g=new THREE.Group();scene.add(g);g.position.set(Math.cos(a)*r,0,Math.sin(a)*r);
    cyl(g,.16,.28,range(2.4,4.3),mat(0x3d3d26,.95),0,1.5,0,8);
    for(let j=0;j<4;j++) sphere(g,range(.85,1.55),mat(pick([0x31563b,0x496642,0x587246]),.95),range(-.7,.7),range(2.7,4.7),range(-.7,.7));
  }
}
addExteriorTrees();

function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  for(const a of animatedLeaves) a.object.rotation.z=a.base+Math.sin(t*.85+a.phase)*a.amp;
  for(const h of hangingPlants){
    h.object.rotation.z=Math.sin(t*.48+h.phase)*.035;
    h.object.position.x=h.x+Math.sin(t*.32+h.phase)*.05;
  }
  streams.rotation.y=t*.18;
  ripple.scale.setScalar(1+Math.sin(t*2.2)*.08);
  ripple.material.opacity=.28+Math.sin(t*2.2)*.1;
  for(const d of dust){
    d.object.position.x=d.base.x+Math.sin(t*d.drift+d.phase)*.45;
    d.object.position.y=d.base.y+Math.sin(t*.7+d.phase)*.2;
    d.object.position.z=d.base.z+Math.cos(t*d.drift*.8+d.phase)*.28;
  }
  controls.update();
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
});
animate();
</script>
</body>
</html>
