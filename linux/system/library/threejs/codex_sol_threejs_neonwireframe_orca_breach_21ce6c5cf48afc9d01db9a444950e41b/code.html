<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Wireframe Orca</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #010208;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010208);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8.4, 4.2, 10.5);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.enablePan = false;
controls.minDistance = 7;
controls.maxDistance = 22;
controls.target.set(0, 0.25, 0);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  1.2,
  0.58,
  0.12
);
bloomPass.threshold = 0.08;
bloomPass.strength = 1.15;
bloomPass.radius = 0.72;
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

const cyanColor = new THREE.Color(0x19dfff).multiplyScalar(3.2);
const cyanSoftColor = new THREE.Color(0x087a9c).multiplyScalar(1.7);
const magentaColor = new THREE.Color(0xff20c8).multiplyScalar(3.4);
const magentaSoftColor = new THREE.Color(0x9e176f).multiplyScalar(2.0);

function glowingMaterial(color, opacity = 0.95) {
  return new THREE.MeshBasicMaterial({
    color,
    transparent: true,
    opacity,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    toneMapped: false
  });
}

const cyan = glowingMaterial(cyanColor);
const cyanSoft = glowingMaterial(cyanSoftColor, 0.6);
const magenta = glowingMaterial(magentaColor);
const magentaSoft = glowingMaterial(magentaSoftColor, 0.72);

const orca = new THREE.Group();
orca.rotation.z = -THREE.MathUtils.degToRad(17);
orca.rotation.x = THREE.MathUtils.degToRad(4);
orca.position.y = 0.05;
scene.add(orca);

function tube(points, radius, material, closed = false, radialSegments = 7) {
  if (points.length < 2) return null;
  const curve = new THREE.CatmullRomCurve3(points, closed, 'centripetal', 0.5);
  const tubularSegments = Math.max(16, points.length * 5);
  const geometry = new THREE.TubeGeometry(
    curve,
    tubularSegments,
    radius,
    radialSegments,
    closed
  );
  const mesh = new THREE.Mesh(geometry, material);
  orca.add(mesh);
  return mesh;
}

function interpolateProfile(x, values) {
  if (x <= values[0][0]) return values[0][1];
  if (x >= values[values.length - 1][0]) return values[values.length - 1][1];

  for (let i = 0; i < values.length - 1; i++) {
    const a = values[i];
    const b = values[i + 1];
    if (x >= a[0] && x <= b[0]) {
      let t = (x - a[0]) / (b[0] - a[0]);
      t = t * t * (3 - 2 * t);
      return THREE.MathUtils.lerp(a[1], b[1], t);
    }
  }
  return values[values.length - 1][1];
}

const verticalProfile = [
  [-3.28, 0.42],
  [-2.94, 0.79],
  [-2.35, 1.02],
  [-1.42, 1.17],
  [-0.35, 1.12],
  [0.65, 0.93],
  [1.55, 0.67],
  [2.28, 0.39],
  [2.88, 0.16]
];

const depthProfile = [
  [-3.28, 0.54],
  [-2.94, 0.93],
  [-2.25, 1.17],
  [-1.25, 1.25],
  [-0.15, 1.12],
  [0.82, 0.86],
  [1.62, 0.61],
  [2.30, 0.32],
  [2.88, 0.13]
];

function centerY(x) {
  const u = THREE.MathUtils.clamp((x + 3.28) / 6.16, 0, 1);
  return 0.06 + 0.13 * Math.sin(u * Math.PI) - 0.12 * u;
}

function radiusY(x) {
  return interpolateProfile(x, verticalProfile);
}

function radiusZ(x) {
  return interpolateProfile(x, depthProfile);
}

function bodyPoint(x, angle, scale = 1) {
  return new THREE.Vector3(
    x,
    centerY(x) + Math.cos(angle) * radiusY(x) * scale,
    Math.sin(angle) * radiusZ(x) * scale
  );
}

const ribCount = 18;
for (let i = 0; i < ribCount; i++) {
  const t = i / (ribCount - 1);
  const x = THREE.MathUtils.lerp(-3.22, 2.72, t);
  const points = [];
  const segments = 36;

  for (let j = 0; j < segments; j++) {
    const angle = j / segments * Math.PI * 2;
    const organicScale =
      1 +
      0.018 * Math.sin(angle * 3 + x * 1.8) +
      0.008 * Math.cos(angle * 5 - x);
    points.push(bodyPoint(x, angle, organicScale));
  }

  const emphasized = i === 1 || i === 4 || i === 8 || i === 12 || i === 16;
  tube(points, emphasized ? 0.032 : 0.022, emphasized ? cyan : cyanSoft, true);
}

const longitudeCount = 12;
for (let i = 0; i < longitudeCount; i++) {
  const angle = i / longitudeCount * Math.PI * 2;
  const points = [];

  for (let j = 0; j <= 32; j++) {
    const t = j / 32;
    const x = THREE.MathUtils.lerp(-3.28, 2.88, t);
    points.push(bodyPoint(x, angle));
  }

  const isSilhouette =
    i === 0 ||
    i === 3 ||
    i === 6 ||
    i === 9;

  tube(points, isSilhouette ? 0.035 : 0.024, isSilhouette ? cyan : cyanSoft);
}

for (let i = 0; i < 6; i++) {
  const angle = i / 6 * Math.PI * 2;
  const points = [
    bodyPoint(-3.28, angle, 0.98),
    new THREE.Vector3(
      -3.48,
      centerY(-3.28) + Math.cos(angle) * 0.27,
      Math.sin(angle) * 0.35
    ),
    new THREE.Vector3(
      -3.56,
      centerY(-3.28) + Math.cos(angle) * 0.12,
      Math.sin(angle) * 0.16
    )
  ];
  tube(points, 0.024, cyanSoft);
}

const snoutLoop = [];
for (let i = 0; i < 32; i++) {
  const angle = i / 32 * Math.PI * 2;
  snoutLoop.push(new THREE.Vector3(
    -3.55,
    centerY(-3.28) + Math.cos(angle) * 0.13,
    Math.sin(angle) * 0.17
  ));
}
tube(snoutLoop, 0.028, cyan, true);

function createDorsal() {
  const front = [
    bodyPoint(-0.72, 0),
    new THREE.Vector3(-0.52, 1.66, 0.08),
    new THREE.Vector3(-0.18, 2.64, 0.045),
    new THREE.Vector3(0.10, 3.18, 0),
    new THREE.Vector3(0.34, 2.55, -0.015),
    new THREE.Vector3(0.67, 1.70, -0.035),
    bodyPoint(0.92, 0)
  ];

  tube(front, 0.038, cyan);

  const back = front.map((p, index) => {
    const q = p.clone();
    if (index > 0 && index < front.length - 1) q.z -= 0.13;
    return q;
  });
  tube(back, 0.024, cyanSoft);

  for (let i = 1; i <= 4; i++) {
    const t = i / 5;
    const baseX = THREE.MathUtils.lerp(-0.58, 0.72, t);
    const base = bodyPoint(baseX, 0);
    const spine = front[Math.min(front.length - 2, i)].clone();
    spine.y -= 0.08;
    tube([base, spine], 0.018, cyanSoft);
  }

  tube([
    new THREE.Vector3(-0.5, 1.62, 0.08),
    new THREE.Vector3(-0.18, 1.92, 0.04),
    new THREE.Vector3(0.43, 1.77, -0.02),
    new THREE.Vector3(0.72, 1.46, -0.03)
  ], 0.018, cyanSoft);
}

createDorsal();

function createFlipper(side) {
  const s = side;
  const rootFront = bodyPoint(-1.65, s > 0 ? Math.PI * 0.5 : Math.PI * 1.5);
  const rootBack = bodyPoint(-0.68, s > 0 ? Math.PI * 0.5 : Math.PI * 1.5);

  const outline = [
    rootFront,
    new THREE.Vector3(-1.20, -0.58, s * 1.42),
    new THREE.Vector3(-0.48, -1.52, s * 2.13),
    new THREE.Vector3(0.05, -2.08, s * 2.02),
    new THREE.Vector3(-0.07, -1.67, s * 1.58),
    new THREE.Vector3(-0.34, -0.81, s * 1.07),
    rootBack
  ];

  tube(outline, side > 0 ? 0.033 : 0.025, side > 0 ? cyan : cyanSoft);

  tube([
    rootFront.clone().lerp(rootBack, 0.35),
    new THREE.Vector3(-0.75, -0.91, s * 1.44),
    new THREE.Vector3(-0.02, -1.95, s * 1.95)
  ], 0.019, cyanSoft);

  tube([
    rootFront.clone().lerp(rootBack, 0.65),
    new THREE.Vector3(-0.38, -1.02, s * 1.38),
    new THREE.Vector3(-0.08, -1.67, s * 1.58)
  ], 0.017, cyanSoft);

  tube([rootFront, rootBack], 0.025, cyanSoft);
}

createFlipper(1);
createFlipper(-1);

function createFluke(side) {
  const s = side;
  const root = new THREE.Vector3(2.80, centerY(2.80), s * 0.07);
  const outline = [
    root,
    new THREE.Vector3(3.15, -0.03, s * 0.52),
    new THREE.Vector3(3.58, 0.04, s * 1.35),
    new THREE.Vector3(3.69, 0.14, s * 2.14),
    new THREE.Vector3(3.36, 0.08, s * 2.42),
    new THREE.Vector3(2.91, -0.03, s * 1.77),
    new THREE.Vector3(2.73, -0.12, s * 0.93),
    root
  ];

  tube(outline, 0.034, cyan);

  const veinTargets = [
    new THREE.Vector3(3.55, 0.08, s * 1.30),
    new THREE.Vector3(3.62, 0.12, s * 1.88),
    new THREE.Vector3(3.20, 0.02, s * 1.93),
    new THREE.Vector3(2.80, -0.08, s * 1.02)
  ];

  for (let i = 0; i < veinTargets.length; i++) {
    const target = veinTargets[i];
    const mid = root.clone().lerp(target, 0.52);
    mid.x += 0.12;
    mid.y += 0.04;
    tube([root, mid, target], 0.018, cyanSoft);
  }
}

createFluke(1);
createFluke(-1);

tube([
  new THREE.Vector3(2.25, centerY(2.25) + 0.18, 0),
  new THREE.Vector3(2.72, centerY(2.72) + 0.06, 0),
  new THREE.Vector3(3.02, centerY(2.88), 0)
], 0.034, cyan);

tube([
  new THREE.Vector3(2.25, centerY(2.25) - 0.18, 0),
  new THREE.Vector3(2.72, centerY(2.72) - 0.06, 0),
  new THREE.Vector3(3.02, centerY(2.88), 0)
], 0.025, cyanSoft);

function eyePatch(side) {
  const points = [];
  const s = side;

  for (let i = 0; i < 40; i++) {
    const a = i / 40 * Math.PI * 2;
    const x = -2.48 + Math.cos(a) * 0.58;
    const yOffset = 0.34 + Math.sin(a) * 0.25;
    const ry = radiusY(x);
    const rz = radiusZ(x);
    const normalizedY = THREE.MathUtils.clamp(yOffset / ry, -0.92, 0.92);
    const z = s * rz * Math.sqrt(Math.max(0.05, 1 - normalizedY * normalizedY)) * 1.012;

    points.push(new THREE.Vector3(
      x,
      centerY(x) + yOffset,
      z
    ));
  }

  tube(points, side > 0 ? 0.042 : 0.03, side > 0 ? magenta : magentaSoft, true);

  const inner = points.filter((point, index) => index % 5 === 0).map((point) => {
    const p = point.clone();
    p.x = THREE.MathUtils.lerp(p.x, -2.48, 0.36);
    p.y = THREE.MathUtils.lerp(p.y, centerY(p.x) + 0.34, 0.36);
    p.z *= 1.006;
    return p;
  });
  tube(inner, 0.016, magentaSoft, true);
}

eyePatch(1);
eyePatch(-1);

function bellyStripe(angle, material, radius) {
  const points = [];

  for (let i = 0; i <= 28; i++) {
    const t = i / 28;
    const x = THREE.MathUtils.lerp(-2.62, 1.18, t);
    points.push(bodyPoint(x, angle, 1.014));
  }

  tube(points, radius, material);
}

bellyStripe(Math.PI - 0.42, magenta, 0.034);
bellyStripe(Math.PI + 0.42, magentaSoft, 0.028);

function bellyArc(x) {
  const points = [];

  for (let i = 0; i <= 18; i++) {
    const t = i / 18;
    const angle = THREE.MathUtils.lerp(Math.PI - 0.42, Math.PI + 0.42, t);
    points.push(bodyPoint(x, angle, 1.018));
  }

  tube(points, 0.028, magenta);
}

bellyArc(-2.61);
bellyArc(1.17);

tube([
  bodyPoint(-2.20, Math.PI - 0.42, 1.015),
  bodyPoint(-1.82, Math.PI, 1.018),
  bodyPoint(-1.42, Math.PI + 0.42, 1.015)
], 0.019, magentaSoft);

tube([
  bodyPoint(-0.94, Math.PI - 0.42, 1.015),
  bodyPoint(-0.56, Math.PI, 1.018),
  bodyPoint(-0.17, Math.PI + 0.42, 1.015)
], 0.019, magentaSoft);

const ambient = new THREE.AmbientLight(0x07334b, 0.35);
scene.add(ambient);

const cyanLight = new THREE.PointLight(0x00ccff, 12, 18, 2);
cyanLight.position.set(-2, 3, 5);
scene.add(cyanLight);

const magentaLight = new THREE.PointLight(0xff008f, 8, 14, 2);
magentaLight.position.set(-3, -2, 3);
scene.add(magentaLight);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const elapsed = clock.getElapsedTime();
  orca.position.y = 0.05 + Math.sin(elapsed * 0.62) * 0.045;
  bloomPass.strength = 1.12 + Math.sin(elapsed * 1.25) * 0.045;

  controls.update();
  composer.render();
}

function resize() {
  const width = innerWidth;
  const height = innerHeight;
  const pixelRatio = Math.min(devicePixelRatio, 2);

  camera.aspect = width / height;
  camera.updateProjectionMatrix();

  renderer.setPixelRatio(pixelRatio);
  renderer.setSize(width, height);
  composer.setPixelRatio(pixelRatio);
  composer.setSize(width, height);
  bloomPass.resolution.set(width * pixelRatio, height * pixelRatio);
}

window.addEventListener('resize', resize);
resize();
animate();
</script>
</body>
</html>
