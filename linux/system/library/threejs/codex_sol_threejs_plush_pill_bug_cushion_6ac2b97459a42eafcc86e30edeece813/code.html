<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plush Pill Bug</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #e8e2dc; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8e2dc);
scene.fog = new THREE.Fog(0xe8e2dc, 12, 23);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.4, 5.1, 8.7);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.35, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 6;
controls.maxDistance = 15;
controls.maxPolarAngle = Math.PI * 0.52;

scene.add(new THREE.HemisphereLight(0xfffaf3, 0x8c8293, 2.25));

const keyLight = new THREE.DirectionalLight(0xfff1dc, 4.2);
keyLight.position.set(5.5, 8, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -7;
keyLight.shadow.camera.right = 7;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -5;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 22;
keyLight.shadow.bias = -0.0004;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xbfc9e5, 1.45);
fillLight.position.set(-6, 3.5, -4);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0xffd5bd, 14, 15, 2);
rimLight.position.set(-4, 4, 5);
scene.add(rimLight);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(9, 96),
  new THREE.MeshStandardMaterial({
    color: 0xd8d0ca,
    roughness: 1,
    metalness: 0
  })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1.32;
floor.receiveShadow = true;
scene.add(floor);

const bug = new THREE.Group();
bug.position.y = 0.08;
bug.rotation.y = -0.08;
scene.add(bug);

const shellColors = [
  0xaaaeb4, 0xb0b3b9, 0xa8acb2, 0xb2b5bb,
  0xa9adb3, 0xb1b4ba, 0xa7abb1, 0xadb1b7
];

const shellMaterials = shellColors.map(color => new THREE.MeshPhysicalMaterial({
  color,
  roughness: 0.91,
  metalness: 0,
  sheen: 0.62,
  sheenColor: new THREE.Color(0xe8e5e2),
  sheenRoughness: 0.82,
  clearcoat: 0
}));

const bellyMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xa795b0,
  roughness: 0.94,
  metalness: 0,
  sheen: 0.5,
  sheenColor: new THREE.Color(0xd8c7dc),
  sheenRoughness: 0.9
});

const stitchMaterial = new THREE.MeshStandardMaterial({
  color: 0xf1dfbd,
  roughness: 0.8,
  metalness: 0
});

const eyeMaterial = new THREE.MeshStandardMaterial({
  color: 0x242127,
  roughness: 0.98,
  metalness: 0
});

const legMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x87778f,
  roughness: 0.96,
  sheen: 0.3,
  sheenColor: new THREE.Color(0xc9b8ce)
});

const seamShadowMaterial = new THREE.MeshStandardMaterial({
  color: 0x858990,
  roughness: 1
});

function makePuckeredSphere(phase) {
  const geometry = new THREE.SphereGeometry(1, 38, 26);
  const position = geometry.attributes.position;
  const vector = new THREE.Vector3();

  for (let i = 0; i < position.count; i++) {
    vector.fromBufferAttribute(position, i);
    const azimuth = Math.atan2(vector.z, vector.y);
    const edgeAmount = Math.pow(Math.abs(vector.x), 3.2);
    const softWrinkle = Math.sin(azimuth * 10 + phase) * edgeAmount * 0.022;
    const fleeceWobble =
      Math.sin(vector.x * 17 + vector.z * 11 + phase) *
      Math.sin(vector.y * 13 - phase) * 0.006;
    vector.multiplyScalar(1 + softWrinkle + fleeceWobble);
    position.setXYZ(i, vector.x, vector.y, vector.z);
  }

  geometry.computeVertexNormals();
  return geometry;
}

const segmentData = [];
const segmentGroups = [];
const segmentCount = 8;

for (let i = 0; i < segmentCount; i++) {
  const x = (i - 3.5) * 0.77;
  const normalizedX = x / 2.75;
  const y = 0.32 + 0.58 * (1 - normalizedX * normalizedX);
  const slope = -0.42 * normalizedX;
  const rotation = Math.atan(slope);
  const group = new THREE.Group();
  group.position.set(x, y, 0);
  group.rotation.z = rotation;
  bug.add(group);

  const shell = new THREE.Mesh(makePuckeredSphere(i * 0.71), shellMaterials[i]);
  const endFactor = i === 0 || i === segmentCount - 1 ? 0.94 : 1;
  shell.scale.set(0.56, 0.91 * endFactor, 1.19 * endFactor);
  shell.castShadow = true;
  shell.receiveShadow = true;
  group.add(shell);

  const belly = new THREE.Mesh(
    makePuckeredSphere(i * 0.47 + 2),
    bellyMaterial
  );
  belly.position.set(0, -0.64, 0);
  belly.scale.set(0.48, 0.38, 0.91);
  belly.castShadow = true;
  belly.receiveShadow = true;
  group.add(belly);

  segmentData.push({ x, y, rotation });
  segmentGroups.push(group);
}

const stitchGeometry = new THREE.CylinderGeometry(0.026, 0.026, 0.135, 8, 1, false);
const puckerGeometry = new THREE.SphereGeometry(0.036, 9, 7);
const upAxis = new THREE.Vector3(0, 1, 0);

for (let i = 0; i < segmentCount; i++) {
  const group = segmentGroups[i];
  const seamX = i === segmentCount - 1 ? 0.30 : 0.41;

  for (let j = 0; j < 15; j++) {
    const angle = -1.34 + j * (2.68 / 14);
    const y = 0.87 * Math.cos(angle);
    const z = 1.145 * Math.sin(angle);
    const tangent = new THREE.Vector3(
      0,
      -0.87 * Math.sin(angle),
      1.145 * Math.cos(angle)
    ).normalize();

    const stitch = new THREE.Mesh(stitchGeometry, stitchMaterial);
    stitch.position.set(seamX + 0.038, y, z);
    stitch.quaternion.setFromUnitVectors(upAxis, tangent);
    stitch.castShadow = true;
    group.add(stitch);

    if (j % 2 === 0) {
      const pucker = new THREE.Mesh(puckerGeometry, seamShadowMaterial);
      pucker.position.set(seamX + 0.012, y * 0.982, z * 0.982);
      pucker.scale.set(0.42, 1.1, 1.1);
      group.add(pucker);
    }
  }
}

const headGroup = segmentGroups[segmentCount - 1];
const eyeGeometry = new THREE.SphereGeometry(1, 20, 14);

for (const z of [-0.39, 0.39]) {
  const eye = new THREE.Mesh(eyeGeometry, eyeMaterial);
  eye.position.set(0.536, 0.20, z);
  eye.scale.set(0.068, 0.125, 0.125);
  eye.castShadow = true;
  headGroup.add(eye);

  const threadRing = new THREE.Mesh(
    new THREE.TorusGeometry(0.105, 0.013, 7, 24),
    eyeMaterial
  );
  threadRing.position.set(0.586, 0.20, z);
  threadRing.rotation.y = Math.PI / 2;
  threadRing.scale.y = 0.92;
  headGroup.add(threadRing);
}

const legGeometry = new THREE.ConeGeometry(0.105, 0.58, 9, 1, false);
const jointGeometry = new THREE.SphereGeometry(0.12, 14, 10);
const legDirection = new THREE.Vector3();
const legQuaternion = new THREE.Quaternion();

for (let i = 0; i < 7; i++) {
  const data = segmentData[i + 1];
  for (const side of [-1, 1]) {
    const legRoot = new THREE.Vector3(
      data.x - 0.06,
      data.y - 0.66,
      side * 0.78
    );
    const legTip = new THREE.Vector3(
      data.x - 0.10,
      data.y - 1.06,
      side * 1.15
    );

    legDirection.subVectors(legTip, legRoot);
    const legLength = legDirection.length();
    const leg = new THREE.Mesh(legGeometry, legMaterial);
    leg.position.copy(legRoot).addScaledVector(legDirection, 0.5);
    leg.scale.y = legLength / 0.58;
    legQuaternion.setFromUnitVectors(upAxis, legDirection.clone().normalize());
    leg.quaternion.copy(legQuaternion);
    leg.castShadow = true;
    bug.add(leg);

    const joint = new THREE.Mesh(jointGeometry, legMaterial);
    joint.position.copy(legRoot);
    joint.scale.set(0.9, 0.75, 0.9);
    joint.castShadow = true;
    bug.add(joint);
  }
}

let randomState = 184729;
function seededRandom() {
  randomState = (randomState * 1664525 + 1013904223) >>> 0;
  return randomState / 4294967296;
}

const fiberPositions = [];
const localPoint = new THREE.Vector3();
const worldPoint = new THREE.Vector3();
const normal = new THREE.Vector3();
const rotatedNormal = new THREE.Vector3();

for (let i = 0; i < segmentCount; i++) {
  const data = segmentData[i];
  const sx = 0.56;
  const sy = 0.91 * ((i === 0 || i === segmentCount - 1) ? 0.94 : 1);
  const sz = 1.19 * ((i === 0 || i === segmentCount - 1) ? 0.94 : 1);

  for (let f = 0; f < 82; f++) {
    const theta = 0.18 + seededRandom() * 2.42;
    const phi = seededRandom() * Math.PI * 2;
    const sinTheta = Math.sin(theta);

    localPoint.set(
      sx * Math.cos(theta),
      sy * sinTheta * Math.cos(phi),
      sz * sinTheta * Math.sin(phi)
    );

    normal.set(
      localPoint.x / (sx * sx),
      localPoint.y / (sy * sy),
      localPoint.z / (sz * sz)
    ).normalize();

    worldPoint.copy(localPoint);
    worldPoint.applyAxisAngle(new THREE.Vector3(0, 0, 1), data.rotation);
    worldPoint.x += data.x;
    worldPoint.y += data.y;

    rotatedNormal.copy(normal);
    rotatedNormal.applyAxisAngle(new THREE.Vector3(0, 0, 1), data.rotation);

    const length = 0.018 + seededRandom() * 0.045;
    fiberPositions.push(worldPoint.x, worldPoint.y, worldPoint.z);
    fiberPositions.push(
      worldPoint.x + rotatedNormal.x * length,
      worldPoint.y + rotatedNormal.y * length,
      worldPoint.z + rotatedNormal.z * length
    );
  }
}

const fiberGeometry = new THREE.BufferGeometry();
fiberGeometry.setAttribute(
  'position',
  new THREE.Float32BufferAttribute(fiberPositions, 3)
);

const fibers = new THREE.LineSegments(
  fiberGeometry,
  new THREE.LineBasicMaterial({
    color: 0xd2d3d4,
    transparent: true,
    opacity: 0.44,
    depthWrite: false
  })
);
fibers.renderOrder = 2;
bug.add(fibers);

const bellyFiberPositions = [];
for (let i = 1; i < segmentCount - 1; i++) {
  const data = segmentData[i];

  for (let f = 0; f < 18; f++) {
    const angle = seededRandom() * Math.PI * 2;
    const radius = Math.sqrt(seededRandom());
    const point = new THREE.Vector3(
      data.x + (seededRandom() - 0.5) * 0.38,
      data.y - 0.89 + Math.cos(angle) * radius * 0.12,
      Math.sin(angle) * radius * 0.72
    );
    bellyFiberPositions.push(point.x, point.y, point.z);
    bellyFiberPositions.push(
      point.x,
      point.y - 0.018 - seededRandom() * 0.022,
      point.z
    );
  }
}

const bellyFiberGeometry = new THREE.BufferGeometry();
bellyFiberGeometry.setAttribute(
  'position',
  new THREE.Float32BufferAttribute(bellyFiberPositions, 3)
);
bug.add(new THREE.LineSegments(
  bellyFiberGeometry,
  new THREE.LineBasicMaterial({
    color: 0xd1bfd5,
    transparent: true,
    opacity: 0.36,
    depthWrite: false
  })
));

const shadow = new THREE.Mesh(
  new THREE.CircleGeometry(3.55, 64),
  new THREE.MeshBasicMaterial({
    color: 0x7b7073,
    transparent: true,
    opacity: 0.11,
    depthWrite: false
  })
);
shadow.rotation.x = -Math.PI / 2;
shadow.scale.set(1, 0.34, 1);
shadow.position.set(0, -1.305, 0.05);
scene.add(shadow);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
