<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Warehouse Forklift — procedural three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17191c; }
  #app { position: fixed; inset: 0; }
  .hint {
    position: fixed; left: 14px; bottom: 12px; z-index: 10;
    font: 12px/1.4 system-ui, sans-serif; color: #8b9099;
    letter-spacing: .02em; user-select: none; pointer-events: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="hint">drag to orbit · scroll to zoom · auto-rotating</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------------------------------------------------------- Renderer */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

/* ------------------------------------------------------------------- Scene */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1d21);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ------------------------------------------------------------------ Camera */
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4.4, 2.7, 4.9);

/* ------------------------------------------------------------------- Lights */
scene.add(new THREE.HemisphereLight(0x9fb4d0, 0x181a1c, 0.55));
scene.add(new THREE.AmbientLight(0xffffff, 0.08));

const key = new THREE.DirectionalLight(0xffffff, 2.3);
key.position.set(5.5, 7.5, 5.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 30;
key.shadow.camera.left = -4.5;
key.shadow.camera.right = 4.5;
key.shadow.camera.top = 4.5;
key.shadow.camera.bottom = -4.5;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbfd4ff, 0.55);
fill.position.set(-6, 3.5, -1.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xfff0dd, 1.1);
rim.position.set(-4, 4.5, -6);
scene.add(rim);

/* ------------------------------------------------------------------ Ground */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.38 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* --------------------------------------------------------------- Materials */
const bodyMat    = new THREE.MeshStandardMaterial({ color: 0xf0a81e, metalness: 0.35, roughness: 0.5 });
const darkTrim   = new THREE.MeshStandardMaterial({ color: 0x25272b, metalness: 0.45, roughness: 0.6 });
const mastMat    = new THREE.MeshStandardMaterial({ color: 0x44474d, metalness: 0.85, roughness: 0.4 });
const mastMat2   = new THREE.MeshStandardMaterial({ color: 0x36393e, metalness: 0.85, roughness: 0.45 });
const forkMat    = new THREE.MeshStandardMaterial({ color: 0x5d6066, metalness: 0.9, roughness: 0.33 });
const guardMat   = new THREE.MeshStandardMaterial({ color: 0x2d3035, metalness: 0.7, roughness: 0.5 });
const tireMat    = new THREE.MeshStandardMaterial({ color: 0x131417, metalness: 0.0, roughness: 0.92 });
const rimMat     = new THREE.MeshStandardMaterial({ color: 0x303236, metalness: 0.8, roughness: 0.45 });
const hubMat     = new THREE.MeshStandardMaterial({ color: 0x9a9da2, metalness: 0.9, roughness: 0.3 });
const seatMat    = new THREE.MeshStandardMaterial({ color: 0x1a1b1e, metalness: 0.1, roughness: 0.85 });
const hydMat     = new THREE.MeshStandardMaterial({ color: 0xb9bdc4, metalness: 0.95, roughness: 0.18 });
const lightMat   = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, emissive: 0xfff2d0, emissiveIntensity: 1.3, roughness: 0.4 });
const beaconMat  = new THREE.MeshStandardMaterial({ color: 0x5a2600, emissive: 0xff7a00, emissiveIntensity: 1.6, roughness: 0.4, transparent: true, opacity: 0.9 });

/* --------------------------------------------------------------- Helpers */
function box(w, h, d, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  return m;
}
function cyl(rt, rb, h, mat, seg = 24) {
  return new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
}
// tube between two Vector3 points
function tube(p1, p2, radius, mat) {
  const v = new THREE.Vector3().subVectors(p2, p1);
  const len = v.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, len, 14), mat);
  m.position.copy(p1).add(p2).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), v.clone().normalize());
  return m;
}
// extrude a side profile (points as [z, y]) across width X, centered on X=0
function extrudeBody(points, width, mat) {
  const shape = new THREE.Shape();
  shape.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) shape.lineTo(points[i][0], points[i][1]);
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth: width, bevelEnabled: false, steps: 1 });
  const m = new THREE.Mesh(geo, mat);
  m.rotation.y = -Math.PI / 2;
  m.position.x = width / 2;
  return m;
}
function makeWheel(radius, width) {
  const g = new THREE.Group();
  const tire = cyl(radius, radius, width, tireMat, 32);
  tire.rotation.z = Math.PI / 2;
  g.add(tire);
  const rim = cyl(radius * 0.55, radius * 0.55, width * 1.02, rimMat, 24);
  rim.rotation.z = Math.PI / 2;
  g.add(rim);
  const hub = cyl(radius * 0.17, radius * 0.17, width * 1.08, hubMat, 12);
  hub.rotation.z = Math.PI / 2;
  g.add(hub);
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2;
    const lug = cyl(0.017, 0.017, width * 1.06, hubMat, 8);
    lug.rotation.z = Math.PI / 2;
    lug.position.set(0, Math.cos(a) * radius * 0.33, Math.sin(a) * radius * 0.33);
    g.add(lug);
  }
  return g;
}

/* --------------------------------------------------- Build the forklift */
const forklift = new THREE.Group();

/* --- Lower body / counterweight / hood (single extruded silhouette) --- */
const BODY_W = 0.90;
const bodyProfile = [
  [ 0.58, 0.20], [ 0.58, 0.48], [ 0.50, 0.66], [ 0.46, 0.98],
  [ 0.30, 0.98], [ 0.28, 0.60], [ 0.05, 0.56], [-0.02, 0.60],
  [-0.06, 0.78], [-0.55, 0.82], [-0.60, 0.86], [-0.92, 0.90],
  [-1.06, 0.84], [-1.14, 0.66], [-1.15, 0.30], [-1.13, 0.20]
];
forklift.add(extrudeBody(bodyProfile, BODY_W, bodyMat));

// dark chassis sill / frame beneath the yellow body
forklift.add(box(0.94, 0.11, 1.48, darkTrim, 0, 0.185, -0.28));
// rear counterweight bumper accent
forklift.add(box(0.92, 0.22, 0.08, darkTrim, 0, 0.32, -1.16));
// footwell floor plate (operator compartment)
forklift.add(box(0.66, 0.03, 0.34, darkTrim, 0, 0.565, 0.16));

/* --- Wheels --- */
const fw = 0.30, rw = 0.22;
[[-0.48, 0.38], [0.48, 0.38]].forEach(([x, z]) => {
  const w = makeWheel(fw, 0.22);
  w.position.set(x, fw, z);
  forklift.add(w);
});
[[-0.40, -0.92], [0.40, -0.92]].forEach(([x, z]) => {
  const w = makeWheel(rw, 0.16);
  w.position.set(x, rw, z);
  forklift.add(w);
});

/* --- Seat --- */
const seat = new THREE.Group();
seat.add(box(0.44, 0.10, 0.42, seatMat, 0, 0.90, -0.28));      // cushion
const back = box(0.44, 0.38, 0.10, seatMat, 0, 1.08, -0.48);   // backrest
back.rotation.x = -0.14;
seat.add(back);
forklift.add(seat);

/* --- Dashboard controls + steering wheel --- */
// control levers
[-0.09, 0.09].forEach(x => {
  const lever = cyl(0.014, 0.014, 0.18, mastMat, 10);
  lever.position.set(x, 1.02, 0.30);
  lever.rotation.x = 0.5;
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.03, 12, 10), darkTrim);
  knob.position.set(x, 1.10, 0.34);
  forklift.add(lever, knob);
});
// steering column + wheel
const colB = new THREE.Vector3(0.00, 0.74, 0.34);
const colT = new THREE.Vector3(0.00, 1.04, 0.28);
forklift.add(tube(colB, colT, 0.028, mastMat));
const dir = colT.clone().sub(colB).normalize();
const sw = new THREE.Group();
const wheelRing = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.018, 12, 28), darkTrim);
sw.add(wheelRing);
for (let i = 0; i < 3; i++) {
  const a = (i / 3) * Math.PI * 2;
  const spoke = box(0.24, 0.014, 0.014, darkTrim);
  spoke.rotation.z = a;
  sw.add(spoke);
}
sw.add(cyl(0.028, 0.028, 0.05, mastMat, 12));
sw.children[sw.children.length - 1].rotation.x = Math.PI / 2;
sw.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir);
sw.position.copy(colT);
forklift.add(sw);

/* --- Overhead safety guard cage --- */
const guard = new THREE.Group();
function post(x, z, y0, y1) {
  guard.add(box(0.05, y1 - y0, 0.05, guardMat, x, (y0 + y1) / 2, z));
}
post(-0.42, 0.45, 0.55, 2.05);
post( 0.42, 0.45, 0.55, 2.05);
post(-0.42, -0.58, 0.82, 2.05);
post( 0.42, -0.58, 0.82, 2.05);
// roof perimeter rails
guard.add(box(0.05, 0.05, 1.03, guardMat, -0.42, 2.03, -0.065));
guard.add(box(0.05, 0.05, 1.03, guardMat,  0.42, 2.03, -0.065));
guard.add(box(0.89, 0.05, 0.05, guardMat, 0, 2.03,  0.45));
guard.add(box(0.89, 0.05, 0.05, guardMat, 0, 2.03, -0.58));
// roof grid slats
for (let i = 0; i < 4; i++) {
  const z = 0.30 - i * 0.27;
  guard.add(box(0.84, 0.035, 0.05, guardMat, 0, 2.03, z));
}
// warning beacon
const bBase = cyl(0.04, 0.04, 0.05, hubMat, 12);
bBase.position.set(0.30, 2.09, -0.45);
const beacon = cyl(0.045, 0.05, 0.08, beaconMat, 14);
beacon.position.set(0.30, 2.15, -0.45);
guard.add(bBase, beacon);
// side mirror
guard.add(tube(new THREE.Vector3(0.42, 1.86, 0.45), new THREE.Vector3(0.62, 1.98, 0.55), 0.012, mastMat));
guard.add(box(0.03, 0.14, 0.20, hydMat, 0.64, 2.00, 0.57));
forklift.add(guard);

/* --- Vertical mast + hydraulics --- */
const mast = new THREE.Group();
const railH = 1.82, railY0 = 0.14;
[-0.28, 0.28].forEach(x => {
  mast.add(box(0.06, railH, 0.12, mastMat, x, railY0 + railH / 2, 0.60));       // outer rail
  mast.add(box(0.05, railH * 0.94, 0.08, mastMat2, x, railY0 + railH * 0.94 / 2, 0.665)); // inner rail
});
mast.add(box(0.68, 0.08, 0.11, mastMat, 0, railY0 + railH, 0.60));   // top crossbar
mast.add(box(0.68, 0.11, 0.13, mastMat, 0, 0.24, 0.60));             // bottom crossbar
// central lift cylinder (chrome)
const lift = cyl(0.04, 0.04, 1.5, hydMat, 16);
lift.position.set(0, 1.02, 0.60);
mast.add(lift);
mast.add(cyl(0.055, 0.055, 0.10, mastMat, 16)).position?.set?.(0,0,0);
const liftTop = cyl(0.06, 0.06, 0.06, mastMat, 14);
liftTop.position.set(0, 1.78, 0.60);
mast.add(liftTop);
// tilt cylinders from chassis to mast base
[-0.24, 0.24].forEach(x => {
  mast.add(tube(new THREE.Vector3(x, 0.55, 0.34), new THREE.Vector3(x, 0.32, 0.55), 0.03, hydMat));
});
forklift.add(mast);

/* --- Fork carriage + forks --- */
const carriage = new THREE.Group();
carriage.add(box(0.60, 0.62, 0.05, forkMat, 0, 0.14 + 0.31, 0.705));  // backplate
carriage.add(box(0.62, 0.06, 0.04, mastMat, 0, 0.70, 0.705));         // upper carriage bar
carriage.add(box(0.62, 0.06, 0.04, mastMat, 0, 0.22, 0.705));         // lower carriage bar
[-0.20, 0.20].forEach(x => {
  carriage.add(box(0.10, 0.58, 0.05, forkMat, x, 0.10 + 0.29, 0.72)); // heel (vertical)
  carriage.add(box(0.10, 0.05, 0.95, forkMat, x, 0.075, 0.72 + 0.475)); // blade (horizontal)
  // tapered fork tip
  const tip = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.05, 0.14), forkMat);
  tip.position.set(x, 0.062, 0.72 + 0.95 + 0.05);
  tip.scale.set(1, 0.5, 1);
  carriage.add(tip);
});
forklift.add(carriage);

/* --- Front headlights --- */
[-0.30, 0.30].forEach(x => {
  const l = cyl(0.05, 0.05, 0.04, lightMat, 16);
  l.rotation.x = Math.PI / 2;
  l.position.set(x, 0.55, 0.585);
  forklift.add(l);
});

/* --- Exhaust stack (rear side) --- */
forklift.add(tube(new THREE.Vector3(0.38, 0.85, -0.70), new THREE.Vector3(0.38, 1.15, -0.70), 0.03, darkTrim));

/* --- Shadows on every mesh --- */
forklift.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

/* --- Center the object horizontally, keep wheels on the ground --- */
const bbox = new THREE.Box3().setFromObject(forklift);
const c = bbox.getCenter(new THREE.Vector3());
forklift.position.x -= c.x;
forklift.position.z -= c.z;
scene.add(forklift);

/* --------------------------------------------------------------- Controls */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 3.2;
controls.maxDistance = 12;
controls.maxPolarAngle = 1.54;
controls.target.set(0, 0.92, 0);
controls.update();

/* ---------------------------------------------------------------- Resize */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

/* ------------------------------------------------------------------ Loop */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
