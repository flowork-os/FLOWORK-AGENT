<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crocheted Sea Otter</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #c9e3e1;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc9e3e1);
scene.fog = new THREE.Fog(0xc9e3e1, 11, 19);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0.35, 0.35, 10.7);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.62;
controls.enablePan = false;
controls.minDistance = 7;
controls.maxDistance = 15;
controls.target.set(0, 0.05, 0);

scene.add(new THREE.HemisphereLight(0xf5ffff, 0x796554, 2.45));

const key = new THREE.DirectionalLight(0xfff3dc, 4.3);
key.position.set(-4.5, 7, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -7;
key.shadow.bias = -0.0005;
scene.add(key);

const rim = new THREE.DirectionalLight(0x84c7cf, 2.5);
rim.position.set(5, 2, -4);
scene.add(rim);

const fill = new THREE.PointLight(0xffcdb0, 1.7, 15);
fill.position.set(3.5, -3, 5);
scene.add(fill);

const otter = new THREE.Group();
otter.rotation.z = -0.055;
otter.rotation.x = -0.035;
scene.add(otter);

const colors = {
  cocoa: 0x6e402e,
  cocoaDark: 0x4a291e,
  cocoaLight: 0x8a5740,
  cream: 0xe9cba5,
  creamLight: 0xf2dcc0,
  peach: 0xe9a78d,
  nose: 0x2a1715,
  black: 0x090706
};

function yarnMaterial(color, roughness = 0.96) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness,
    metalness: 0,
    flatShading: false
  });
}

const stitchGeometry = new THREE.TorusGeometry(1, 0.235, 6, 12);
const tmpPos = new THREE.Vector3();
const tmpNorm = new THREE.Vector3();
const tmpQuat = new THREE.Quaternion();
const tmpScale = new THREE.Vector3();
const tmpMatrix = new THREE.Matrix4();
const zAxis = new THREE.Vector3(0, 0, 1);

function hash(n) {
  return (Math.sin(n * 91.733) * 43758.5453) % 1;
}

function crochetEllipsoid({
  radii,
  color,
  stitchColor = color,
  rows = 12,
  stitchSize = 0.13,
  squash = 1,
  seed = 1,
  baseSegments = 40
}) {
  const group = new THREE.Group();
  const geometry = new THREE.SphereGeometry(1, baseSegments, Math.floor(baseSegments * 0.75));
  geometry.scale(radii.x, radii.y, radii.z);
  const base = new THREE.Mesh(geometry, yarnMaterial(color));
  base.castShadow = true;
  base.receiveShadow = true;
  group.add(base);

  const data = [];
  for (let j = 1; j < rows; j++) {
    const theta = Math.PI * j / rows;
    const ringFactor = Math.sin(theta);
    const circumferenceRadius = Math.sqrt(
      Math.pow(radii.x * ringFactor, 2) +
      Math.pow(radii.z * ringFactor, 2)
    );
    const count = Math.max(5, Math.round(circumferenceRadius * Math.PI * 2 / (stitchSize * 2.12)));
    const spiralOffset = (j % 2) * Math.PI / count + j * 0.075;

    for (let i = 0; i < count; i++) {
      const jitter = (hash(seed * 1000 + j * 71 + i * 13) - 0.5) * 0.035;
      const phi = i / count * Math.PI * 2 + spiralOffset + jitter;
      const st = Math.sin(theta);
      const ct = Math.cos(theta);

      tmpPos.set(
        radii.x * st * Math.cos(phi),
        radii.y * ct,
        radii.z * st * Math.sin(phi)
      );

      tmpNorm.set(
        tmpPos.x / (radii.x * radii.x),
        tmpPos.y / (radii.y * radii.y),
        tmpPos.z / (radii.z * radii.z)
      ).normalize();

      tmpPos.addScaledVector(tmpNorm, stitchSize * 0.23);
      tmpQuat.setFromUnitVectors(zAxis, tmpNorm);

      const roll = phi * 0.18 + (j % 2 ? 0.12 : -0.12);
      const rollQuat = new THREE.Quaternion().setFromAxisAngle(tmpNorm, roll);
      tmpQuat.premultiply(rollQuat);

      const variation = 0.93 + Math.abs(hash(seed * 311 + j * 19 + i * 7)) * 0.1;
      tmpScale.set(
        stitchSize * 0.82 * variation,
        stitchSize * 1.18 * variation * squash,
        stitchSize * 0.78
      );
      tmpMatrix.compose(tmpPos, tmpQuat, tmpScale);
      data.push(tmpMatrix.clone());
    }
  }

  const stitches = new THREE.InstancedMesh(
    stitchGeometry,
    yarnMaterial(stitchColor, 1),
    data.length
  );
  data.forEach((matrix, index) => stitches.setMatrixAt(index, matrix));
  stitches.instanceMatrix.needsUpdate = true;
  stitches.castShadow = true;
  stitches.receiveShadow = true;
  group.add(stitches);
  return group;
}

function addPart(parent, part, position, rotation = [0, 0, 0]) {
  part.position.set(position[0], position[1], position[2]);
  part.rotation.set(rotation[0], rotation[1], rotation[2]);
  parent.add(part);
  return part;
}

function sphereMesh(radius, material, position, scale = [1, 1, 1]) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(radius, 32, 24),
    material
  );
  mesh.position.set(...position);
  mesh.scale.set(...scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// Tail, tucked behind the body.
const tailCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0.18, -1.65, -0.42),
  new THREE.Vector3(1.05, -2.12, -0.52),
  new THREE.Vector3(1.65, -2.68, -0.38),
  new THREE.Vector3(1.45, -3.2, -0.12)
]);
const tail = new THREE.Mesh(
  new THREE.TubeGeometry(tailCurve, 48, 0.35, 12, false),
  yarnMaterial(colors.cocoaDark)
);
tail.castShadow = true;
tail.receiveShadow = true;
otter.add(tail);

const tailCap = crochetEllipsoid({
  radii: new THREE.Vector3(0.32, 0.46, 0.3),
  color: colors.cocoaDark,
  stitchColor: 0x5a3023,
  rows: 7,
  stitchSize: 0.085,
  seed: 19
});
addPart(otter, tailCap, [1.45, -3.18, -0.1], [0, 0, 0.18]);

const tailRingGeometry = new THREE.TorusGeometry(0.355, 0.045, 6, 16);
const tailRings = new THREE.InstancedMesh(
  tailRingGeometry,
  yarnMaterial(0x7d4a34),
  17
);
for (let i = 0; i < 17; i++) {
  const t = 0.06 + i * 0.052;
  const p = tailCurve.getPointAt(t);
  const tangent = tailCurve.getTangentAt(t).normalize();
  tmpQuat.setFromUnitVectors(zAxis, tangent);
  const taper = 1 - t * 0.3;
  tmpScale.set(taper, taper, taper);
  tmpMatrix.compose(p, tmpQuat, tmpScale);
  tailRings.setMatrixAt(i, tmpMatrix);
}
tailRings.castShadow = true;
otter.add(tailRings);

// Plump torso.
const body = crochetEllipsoid({
  radii: new THREE.Vector3(1.52, 2.18, 1.05),
  color: colors.cocoa,
  stitchColor: colors.cocoaLight,
  rows: 15,
  stitchSize: 0.145,
  seed: 4
});
addPart(otter, body, [0, -0.48, -0.05], [0.015, 0, 0.015]);

// Soft belly panel.
const belly = crochetEllipsoid({
  radii: new THREE.Vector3(1.02, 1.42, 0.18),
  color: 0x9b684d,
  stitchColor: 0xb17a5b,
  rows: 12,
  stitchSize: 0.115,
  squash: 1.12,
  seed: 8
});
addPart(otter, belly, [0.03, -0.56, 0.99], [0, 0, -0.025]);

// Head, intentionally slightly lopsided.
const head = crochetEllipsoid({
  radii: new THREE.Vector3(1.28, 1.18, 0.94),
  color: colors.cocoa,
  stitchColor: colors.cocoaLight,
  rows: 12,
  stitchSize: 0.12,
  seed: 13
});
addPart(otter, head, [-0.09, 1.9, 0.13], [0.02, -0.05, 0.085]);

// Ears.
const leftEar = crochetEllipsoid({
  radii: new THREE.Vector3(0.43, 0.48, 0.27),
  color: colors.cocoaDark,
  stitchColor: colors.cocoaLight,
  rows: 7,
  stitchSize: 0.08,
  seed: 30
});
addPart(otter, leftEar, [-1.05, 2.65, -0.02], [0.08, -0.1, -0.42]);

const rightEar = crochetEllipsoid({
  radii: new THREE.Vector3(0.39, 0.43, 0.26),
  color: colors.cocoaDark,
  stitchColor: colors.cocoaLight,
  rows: 7,
  stitchSize: 0.075,
  seed: 31
});
addPart(otter, rightEar, [0.89, 2.64, -0.04], [-0.05, 0.08, 0.38]);

otter.add(sphereMesh(0.27, yarnMaterial(colors.peach), [-1.05, 2.67, 0.18], [1, 1.05, 0.34]));
otter.add(sphereMesh(0.25, yarnMaterial(colors.peach), [0.9, 2.66, 0.17], [1, 1.05, 0.34]));

// Cream muzzle lobes.
const muzzleLeft = crochetEllipsoid({
  radii: new THREE.Vector3(0.58, 0.47, 0.28),
  color: colors.cream,
  stitchColor: colors.creamLight,
  rows: 7,
  stitchSize: 0.077,
  seed: 41
});
addPart(otter, muzzleLeft, [-0.39, 1.62, 1.02], [0.03, 0, -0.08]);

const muzzleRight = crochetEllipsoid({
  radii: new THREE.Vector3(0.6, 0.49, 0.29),
  color: colors.cream,
  stitchColor: colors.creamLight,
  rows: 7,
  stitchSize: 0.077,
  seed: 42
});
addPart(otter, muzzleRight, [0.34, 1.61, 1.02], [-0.02, 0, 0.07]);

const chin = crochetEllipsoid({
  radii: new THREE.Vector3(0.56, 0.33, 0.21),
  color: colors.cream,
  stitchColor: colors.creamLight,
  rows: 6,
  stitchSize: 0.07,
  seed: 43
});
addPart(otter, chin, [-0.03, 1.31, 0.94]);

// Safety eyes.
const eyeMaterial = new THREE.MeshPhysicalMaterial({
  color: colors.black,
  roughness: 0.08,
  metalness: 0.05,
  clearcoat: 1,
  clearcoatRoughness: 0.06
});
const leftEye = sphereMesh(0.205, eyeMaterial, [-0.56, 2.13, 1.03], [1, 1.08, 0.58]);
const rightEye = sphereMesh(0.205, eyeMaterial, [0.47, 2.16, 1.02], [1, 1.08, 0.58]);
otter.add(leftEye, rightEye);

const glintMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
otter.add(
  sphereMesh(0.045, glintMaterial, [-0.615, 2.215, 1.155]),
  sphereMesh(0.045, glintMaterial, [0.415, 2.245, 1.145])
);

// Nose and tiny mouth.
const nose = sphereMesh(0.23, yarnMaterial(colors.nose, 0.55), [-0.035, 1.77, 1.33], [1.25, 0.78, 0.6]);
nose.rotation.z = -0.04;
otter.add(nose);

const mouthMaterial = yarnMaterial(0x3b211d);
const mouthCurveL = new THREE.QuadraticBezierCurve3(
  new THREE.Vector3(-0.035, 1.6, 1.34),
  new THREE.Vector3(-0.18, 1.46, 1.31),
  new THREE.Vector3(-0.34, 1.5, 1.25)
);
const mouthCurveR = new THREE.QuadraticBezierCurve3(
  new THREE.Vector3(-0.035, 1.6, 1.34),
  new THREE.Vector3(0.11, 1.45, 1.31),
  new THREE.Vector3(0.28, 1.5, 1.25)
);
for (const curve of [mouthCurveL, mouthCurveR]) {
  const line = new THREE.Mesh(new THREE.TubeGeometry(curve, 12, 0.025, 7, false), mouthMaterial);
  line.castShadow = true;
  otter.add(line);
}

// Short yarn whiskers.
const whiskerMaterial = yarnMaterial(0x5d392e);
const whiskers = [
  [[-0.42, 1.72, 1.25], [-0.88, 1.78, 1.28], [-1.22, 1.9, 1.16]],
  [[-0.43, 1.59, 1.27], [-0.9, 1.52, 1.26], [-1.25, 1.54, 1.12]],
  [[0.39, 1.7, 1.27], [0.83, 1.76, 1.29], [1.18, 1.87, 1.15]],
  [[0.4, 1.58, 1.27], [0.84, 1.5, 1.25], [1.19, 1.51, 1.1]]
];
for (const points of whiskers) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
  const whisker = new THREE.Mesh(new THREE.TubeGeometry(curve, 12, 0.012, 5, false), whiskerMaterial);
  whisker.castShadow = true;
  otter.add(whisker);
}

// Hind feet splayed outward.
function makeFoot(side) {
  const footGroup = new THREE.Group();
  const foot = crochetEllipsoid({
    radii: new THREE.Vector3(0.58, 0.86, 0.43),
    color: colors.cocoaDark,
    stitchColor: colors.cocoaLight,
    rows: 9,
    stitchSize: 0.09,
    seed: side < 0 ? 51 : 52
  });
  footGroup.add(foot);

  const pad = crochetEllipsoid({
    radii: new THREE.Vector3(0.4, 0.56, 0.12),
    color: colors.peach,
    stitchColor: 0xf0b6a0,
    rows: 7,
    stitchSize: 0.07,
    seed: side < 0 ? 53 : 54
  });
  pad.position.z = 0.43;
  pad.position.y = -0.04;
  footGroup.add(pad);

  for (let i = -1; i <= 1; i++) {
    const toe = sphereMesh(
      0.095,
      yarnMaterial(0xf0b6a0),
      [i * 0.19, 0.42, 0.55],
      [0.9, 1.1, 0.45]
    );
    footGroup.add(toe);
  }

  footGroup.position.set(side * 1.04, -2.23, 0.22);
  footGroup.rotation.set(-0.06, side * 0.08, side * -0.63);
  otter.add(footGroup);
}
makeFoot(-1);
makeFoot(1);

// Forepaws pressed together over the belly.
function makeForepaw(side) {
  const pawGroup = new THREE.Group();
  const arm = crochetEllipsoid({
    radii: new THREE.Vector3(0.43, 0.93, 0.37),
    color: colors.cocoaDark,
    stitchColor: colors.cocoaLight,
    rows: 9,
    stitchSize: 0.087,
    seed: side < 0 ? 61 : 62
  });
  pawGroup.add(arm);

  const pad = crochetEllipsoid({
    radii: new THREE.Vector3(0.29, 0.48, 0.11),
    color: colors.peach,
    stitchColor: 0xf2baa3,
    rows: 6,
    stitchSize: 0.06,
    seed: side < 0 ? 63 : 64
  });
  pad.position.set(0, 0.2, 0.37);
  pawGroup.add(pad);

  for (let i = -1; i <= 1; i++) {
    const bean = sphereMesh(
      0.075,
      yarnMaterial(0xf5c2ae),
      [i * 0.13, 0.51, 0.48],
      [0.82, 1.05, 0.42]
    );
    pawGroup.add(bean);
  }

  pawGroup.position.set(side * 0.47, 0.05, 1.26);
  pawGroup.rotation.set(-0.09, side * -0.1, side * -0.42);
  otter.add(pawGroup);
}
makeForepaw(-1);
makeForepaw(1);

// A few loose yarn fibers for handmade softness.
const fiberMaterial = new THREE.MeshStandardMaterial({
  color: 0xa36f53,
  roughness: 1,
  metalness: 0
});
const fiberCurves = [
  [[-1.22, -0.1, 0.72], [-1.36, 0.02, 0.78], [-1.3, 0.16, 0.74]],
  [[1.18, -0.62, 0.74], [1.34, -0.54, 0.78], [1.31, -0.4, 0.73]],
  [[-0.72, 2.73, 0.63], [-0.77, 2.88, 0.66], [-0.66, 2.94, 0.6]]
];
for (const points of fiberCurves) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
  const fiber = new THREE.Mesh(new THREE.TubeGeometry(curve, 8, 0.012, 5, false), fiberMaterial);
  fiber.castShadow = true;
  otter.add(fiber);
}

// Soft contact shadow beneath the floating figure.
const shadow = new THREE.Mesh(
  new THREE.CircleGeometry(2.7, 64),
  new THREE.MeshBasicMaterial({
    color: 0x527f7c,
    transparent: true,
    opacity: 0.14,
    depthWrite: false
  })
);
shadow.scale.set(1.1, 0.28, 1);
shadow.position.set(0, -3.65, -0.75);
shadow.renderOrder = -1;
otter.add(shadow);

otter.scale.setScalar(0.91);
otter.position.y = 0.18;

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
