</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8c8b1);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 50);

controls.enableDamping = true;
controls.dampingFactor = 0.055;

key.position.set(-5, 9, 7);

key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -3;
key.shadow.camera.near = 1;
key.shadow.camera.far = 22;
key.shadow.bias = -0.00035;

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xbca98f,
  roughness: 0.94,
  metalness: 0
});
const floor = new THREE.Mesh(new THREE.CircleGeometry(11, 96), floorMaterial);
floor.rotation.x = -Math.PI / 2;

floor.receiveShadow = true;
scene.add(floor);

const orangutan = new THREE.Group();
orangutan.rotation.y = -0.08;
scene.add(orangutan);

const furMaterial = new THREE.MeshStandardMaterial({
  color: 0xa8461f,
  roughness: 0.91,
  metalness: 0
});
const furDarkMaterial = new THREE.MeshStandardMaterial({
  color: 0x713019,
  roughness: 0.96,
  metalness: 0
});
const furLightMaterial = new THREE.MeshStandardMaterial({
  color: 0xc45e2a,
  roughness: 0.9,
  metalness: 0
});
const faceMaterial = new THREE.MeshStandardMaterial({
  color: 0xd2ad7c,
  roughness: 0.93,
  metalness: 0
});
const muzzleMaterial = new THREE.MeshStandardMaterial({
  color: 0xb9895e,
  roughness: 0.96,
  metalness: 0
});
const eyeMaterial = new THREE.MeshStandardMaterial({
  color: 0x17100d,
  roughness: 0.38,
  metalness: 0.02
});
const seamMaterial = new THREE.MeshStandardMaterial({
  color: 0x7f321a,
  roughness: 0.97,
  metalness: 0
});

function claySphere(name, position, scale, material, seed = 1, roughness = 0.035, detail = 4) {
  const geometry = new THREE.IcosahedronGeometry(1, detail);
  const p = geometry.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const n =
      Math.sin(v.x * 10.7 + seed * 1.9) *
      Math.sin(v.y * 13.1 - seed * 0.7) *
      Math.sin(v.z * 11.3 + seed * 2.3);
    const broad = Math.sin(v.x * 4.1 + v.y * 3.7 + seed) * 0.35;
    const factor = 1 + roughness * (n + broad);
    p.setXYZ(i, v.x * factor, v.y * factor, v.z * factor);
  }
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, material);
  mesh.name = name;
  mesh.position.copy(position);
  mesh.scale.copy(scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  orangutan.add(mesh);
  return mesh;
}

function clayLimb(name, a, b, radiusA, radiusB, material, seed = 1) {
  const length = a.distanceTo(b);
  const geometry = new THREE.CylinderGeometry(radiusB, radiusA, length, 18, 7, false);
  const p = geometry.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const phase = Math.sin(v.y * 7.3 + seed) * 0.018 + Math.sin(i * 1.71 + seed) * 0.012;
    p.setXYZ(i, v.x * (1 + phase), v.y, v.z * (1 + phase));
  }
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, material);
  mesh.name = name;
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  orangutan.add(mesh);
  return mesh;
}

function addTube(points, radius, material, parent = orangutan) {
  const curve = new THREE.CatmullRomCurve3(points);
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 18, radius, 6, false), material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function addFingerprint(position, rotation, scale = 1) {
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.115 * scale, 0.016 * scale, 6, 18),
    seamMaterial
  );
  ring.position.copy(position);
  ring.rotation.set(rotation.x, rotation.y, rotation.z);
  ring.scale.y = 0.72;
  ring.castShadow = true;
  orangutan.add(ring);

  const inner = new THREE.Mesh(
    new THREE.TorusGeometry(0.065 * scale, 0.011 * scale, 5, 16),
    seamMaterial
  );
  inner.position.copy(position);
  inner.rotation.copy(ring.rotation);
  inner.scale.y = 0.72;
  orangutan.add(inner);
}

claySphere('body', new THREE.Vector3(0, 2.65, 0), new THREE.Vector3(1.42, 1.75, 0.92), furMaterial, 2, 0.045);
claySphere('belly', new THREE.Vector3(0.03, 2.38, 0.67), new THREE.Vector3(1.08, 1.3, 0.43), furLightMaterial, 5, 0.025);

claySphere('neck', new THREE.Vector3(0, 3.83, 0), new THREE.Vector3(0.78, 0.68, 0.65), furMaterial, 7, 0.04);
claySphere('head', new THREE.Vector3(-0.03, 4.55, 0.03), new THREE.Vector3(1.12, 1.18, 0.82), furMaterial, 9, 0.042);
claySphere('head tuft left', new THREE.Vector3(-0.5, 5.42, -0.05), new THREE.Vector3(0.42, 0.42, 0.34), furLightMaterial, 10, 0.05);
claySphere('head tuft right', new THREE.Vector3(0.3, 5.5, -0.08), new THREE.Vector3(0.46, 0.39, 0.35), furLightMaterial, 11, 0.05);
claySphere('left ear', new THREE.Vector3(-1.02, 4.55, 0.08), new THREE.Vector3(0.27, 0.39, 0.18), muzzleMaterial, 12, 0.02);
claySphere('right ear', new THREE.Vector3(0.98, 4.55, 0.08), new THREE.Vector3(0.27, 0.38, 0.18), muzzleMaterial, 13, 0.02);

claySphere('face pad', new THREE.Vector3(-0.01, 4.48, 0.72), new THREE.Vector3(0.91, 0.97, 0.32), faceMaterial, 15, 0.012);
claySphere('left cheek', new THREE.Vector3(-0.45, 4.3, 0.94), new THREE.Vector3(0.49, 0.55, 0.24), faceMaterial, 16, 0.01);
claySphere('right cheek', new THREE.Vector3(0.43, 4.3, 0.94), new THREE.Vector3(0.5, 0.55, 0.24), faceMaterial, 17, 0.01);
claySphere('muzzle', new THREE.Vector3(0, 4.13, 1.09), new THREE.Vector3(0.56, 0.4, 0.3), muzzleMaterial, 18, 0.014);
claySphere('nose', new THREE.Vector3(0, 4.31, 1.31), new THREE.Vector3(0.24, 0.16, 0.13), furDarkMaterial, 19, 0.01);

const leftEye = claySphere('left bead eye', new THREE.Vector3(-0.32, 4.68, 1.045), new THREE.Vector3(0.09, 0.095, 0.075), eyeMaterial, 20, 0);
const rightEye = claySphere('right bead eye', new THREE.Vector3(0.31, 4.68, 1.045), new THREE.Vector3(0.09, 0.095, 0.075), eyeMaterial, 21, 0);
leftEye.castShadow = true;
rightEye.castShadow = true;

addTube([
  new THREE.Vector3(-0.3, 4.01, 1.36),
  new THREE.Vector3(0, 3.96, 1.4),
  new THREE.Vector3(0.31, 4.01, 1.36)
], 0.026, furDarkMaterial);

addTube([
  new THREE.Vector3(-0.5, 4.85, 1.0),
  new THREE.Vector3(-0.32, 4.92, 1.07),
  new THREE.Vector3(-0.13, 4.85, 1.01)
], 0.025, muzzleMaterial);
addTube([
  new THREE.Vector3(0.13, 4.85, 1.01),
  new THREE.Vector3(0.31, 4.92, 1.07),
  new THREE.Vector3(0.5, 4.85, 1.0)
], 0.025, muzzleMaterial);

const leftHip = new THREE.Vector3(-0.62, 1.72, 0.03);
const leftKnee = new THREE.Vector3(-1.55, 1.12, 0.78);
const leftAnkle = new THREE.Vector3(-1.48, 0.32, 1.27);
clayLimb('left thigh', leftHip, leftKnee, 0.65, 0.58, furMaterial, 22);
claySphere('left knee', leftKnee, new THREE.Vector3(0.63, 0.58, 0.61), furMaterial, 23, 0.04);
clayLimb('left shin', leftKnee, leftAnkle, 0.48, 0.37, furMaterial, 24);
claySphere('left foot', new THREE.Vector3(-1.42, 0.22, 1.62), new THREE.Vector3(0.52, 0.25, 0.72), furDarkMaterial, 25, 0.025);

const rightHip = new THREE.Vector3(0.62, 1.69, 0);
const rightKnee = new THREE.Vector3(1.42, 0.83, 0.47);
const rightAnkle = new THREE.Vector3(1.28, 0.24, 1.36);
clayLimb('right thigh', rightHip, rightKnee, 0.64, 0.56, furMaterial, 26);
claySphere('right knee', rightKnee, new THREE.Vector3(0.61, 0.55, 0.58), furMaterial, 27, 0.04);
clayLimb('right shin', rightKnee, rightAnkle, 0.46, 0.36, furMaterial, 28);
claySphere('right foot', new THREE.Vector3(1.31, 0.2, 1.72), new THREE.Vector3(0.54, 0.24, 0.7), furDarkMaterial, 29, 0.025);

for (let i = 0; i < 4; i++) {
  claySphere(
    'left toe',
    new THREE.Vector3(-1.68 + i * 0.17, 0.23, 2.16 + Math.abs(i - 1.5) * -0.025),
    new THREE.Vector3(0.11, 0.1, 0.25),
    furDarkMaterial,
    40 + i,
    0.01,
    3
  );
  claySphere(
    'right toe',
    new THREE.Vector3(1.05 + i * 0.17, 0.21, 2.2 + Math.abs(i - 1.5) * -0.025),
    new THREE.Vector3(0.11, 0.1, 0.25),
    furDarkMaterial,
    50 + i,
    0.01,
    3
  );
}

const drapeShoulder = new THREE.Vector3(-1.03, 3.68, 0.04);
const drapeElbow = new THREE.Vector3(-1.73, 2.38, 0.38);
const drapeWrist = new THREE.Vector3(-1.44, 1.38, 1.02);
claySphere('draped shoulder', drapeShoulder, new THREE.Vector3(0.58, 0.66, 0.58), furMaterial, 31, 0.05);
clayLimb('draped upper arm', drapeShoulder, drapeElbow, 0.46, 0.39, furMaterial, 32);
claySphere('draped elbow', drapeElbow, new THREE.Vector3(0.45, 0.48, 0.43), furMaterial, 33, 0.045);
clayLimb('draped forearm', drapeElbow, drapeWrist, 0.39, 0.29, furMaterial, 34);
claySphere('draped hand', new THREE.Vector3(-1.36, 1.22, 1.17), new THREE.Vector3(0.34, 0.47, 0.27), furDarkMaterial, 35, 0.025);

for (let i = 0; i < 4; i++) {
  clayLimb(
    'draped finger',
    new THREE.Vector3(-1.54 + i * 0.105, 1.18, 1.34),
    new THREE.Vector3(-1.52 + i * 0.105, 0.88, 1.34),
    0.055,
    0.045,
    furDarkMaterial,
    60 + i
  );
}

const chinShoulder = new THREE.Vector3(1.02, 3.67, 0.01);
const chinElbow = new THREE.Vector3(1.64, 2.35, 0.38);
const chinWrist = new THREE.Vector3(0.7, 3.83, 0.82);

clayLimb('supporting upper arm', chinShoulder, chinElbow, 0.47, 0.39, furMaterial, 37);
claySphere('supporting elbow', chinElbow, new THREE.Vector3(0.46, 0.48, 0.43), furMaterial, 38, 0.04);
clayLimb('supporting forearm', chinElbow, chinWrist, 0.4, 0.28, furMaterial, 39);
claySphere('chin palm', new THREE.Vector3(0.5, 3.96, 0.98), new THREE.Vector3(0.38, 0.44, 0.25), furDarkMaterial, 40, 0.02);

for (let i = 0; i < 4; i++) {
  const x = 0.28 + i * 0.13;
  clayLimb(
    'chin finger',
    new THREE.Vector3(x, 3.98, 1.08),
    new THREE.Vector3(x - 0.035, 4.24 + Math.sin(i * 1.2) * 0.035, 1.12),
    0.052,
    0.043,
    furDarkMaterial,
    70 + i
  );
}

const shoulderSeam = new THREE.Mesh(
  new THREE.TorusGeometry(0.55, 0.025, 7, 38),
  seamMaterial
);

shoulderSeam.rotation.set(0.15, 0.28, 0.94);
shoulderSeam.scale.set(1, 1.08, 1);

orangutan.add(shoulderSeam);

const striationCurves = [
  [[-0.76,3.35,0.78],[-0.43,3.55,0.9],[-0.06,3.58,0.94]],
  [[0.1,3.48,0.94],[0.43,3.4,0.89],[0.77,3.18,0.76]],
  [[-0.88,2.88,0.86],[-0.48,3.02,1.01],[-0.12,2.95,1.08]],
  [[0.14,2.88,1.08],[0.52,2.83,0.98],[0.93,2.64,0.78]],
  [[-0.95,2.34,0.78],[-0.54,2.44,1.02],[-0.13,2.39,1.1]],
  [[0.11,2.29,1.1],[0.54,2.26,0.98],[0.99,2.08,0.7]],
  [[-0.83,1.86,0.54],[-0.42,1.95,0.78],[-0.08,1.92,0.86]],
  [[-0.61,5.2,0.6],[-0.35,5.32,0.71],[-0.08,5.34,0.73]],
  [[0.1,5.34,0.72],[0.38,5.28,0.67],[0.65,5.12,0.54]]
];

for (const curve of striationCurves) {
  addTube(curve.map(p => new THREE.Vector3(p[0], p[1], p[2])), 0.018, furDarkMaterial);
}

addTube([
  new THREE.Vector3(-1.25, 3.42, 0.45),
  new THREE.Vector3(-1.48, 3.05, 0.62),
  new THREE.Vector3(-1.62, 2.68, 0.62)
], 0.017, furDarkMaterial);
addTube([
  new THREE.Vector3(1.25, 3.4, 0.44),
  new THREE.Vector3(1.46, 3.06, 0.58),
  new THREE.Vector3(1.57, 2.7, 0.55)
], 0.017, furDarkMaterial);

addFingerprint(new THREE.Vector3(-0.72, 2.65, 1.025), new THREE.Vector3(0.05, -0.17, 0), 0.82);
addFingerprint(new THREE.Vector3(0.7, 3.05, 0.9), new THREE.Vector3(0.04, 0.18, 0), 0.72);
addFingerprint(new THREE.Vector3(-0.48, 5.2, 0.7), new THREE.Vector3(0.05, -0.12, 0), 0.58);
addFingerprint(new THREE.Vector3(-1.6, 2.65, 0.68), new THREE.Vector3(0.1, -0.55, -0.1), 0.62);
addFingerprint(new THREE.Vector3(1.52, 2.62, 0.64), new THREE.Vector3(0.08, 0.55, 0.1), 0.58);

const tinyClayBits = [
  [-0.98, 3.08, 0.7, 0.045],
  [0.91, 2.82, 0.76, 0.035],
  [-0.64, 1.93, 0.83, 0.04],
  [0.55, 2.03, 0.98, 0.035],
  [-0.69, 5.02, 0.63, 0.032],
  [0.68, 5.05, 0.56, 0.038]
];
for (let i = 0; i < tinyClayBits.length; i++) {
  const b = tinyClayBits[i];
  claySphere(
    'clay fleck',
    new THREE.Vector3(b[0], b[1], b[2]),
    new THREE.Vector3(b[3], b[3] * 0.7, b[3] * 0.35),
    furLightMaterial,
    90 + i,
    0.01,
    2
  );
}

orangutan.position.y = 0.02;

const shadowPatch = new THREE.Mesh(
  new THREE.CircleGeometry(2.7, 64),
  new THREE.MeshBasicMaterial({
    color: 0x5e4432,
    transparent: true,
    opacity: 0.11,
    depthWrite: false
  })
);
shadowPatch.rotation.x = -Math.PI / 2;
shadowPatch.position.set(0, -0.025, 0.48);
shadowPatch.scale.set(1.2, 0.72, 1);
scene.add(shadowPatch);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  orangutan.position.y = 0.02 + Math.sin(t * 1.1) * 0.006;
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
