<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartoon Venus Flytrap</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #b9e8ed; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb9e8ed);
scene.fog = new THREE.Fog(0xb9e8ed, 8, 16);

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.2, 4.2, 7.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.target.set(0, 2.25, 0);
controls.minDistance = 4.5;
controls.maxDistance = 10;

scene.add(new THREE.HemisphereLight(0xd9ffff, 0x7d563c, 2.1));

const key = new THREE.DirectionalLight(0xfff4d5, 4.2);
key.position.set(-4, 7, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -2;
scene.add(key);

const fill = new THREE.PointLight(0x8bdfff, 1.2, 8);
fill.position.set(3, 3, 3);
scene.add(fill);

const green = new THREE.MeshPhysicalMaterial({
  color: 0x38c95a,
  roughness: 0.25,
  metalness: 0.02,
  clearcoat: 0.8,
  clearcoatRoughness: 0.18
});
const lightGreen = new THREE.MeshPhysicalMaterial({
  color: 0x83ed5c,
  roughness: 0.23,
  clearcoat: 0.9,
  clearcoatRoughness: 0.12
});
const innerGreen = new THREE.MeshPhysicalMaterial({
  color: 0xd2f65c,
  roughness: 0.3,
  clearcoat: 0.7
});
const mouthRed = new THREE.MeshPhysicalMaterial({
  color: 0xe94a45,
  roughness: 0.3,
  clearcoat: 0.5
});
const toothMat = new THREE.MeshPhysicalMaterial({
  color: 0xfffbe4,
  roughness: 0.18,
  clearcoat: 0.9
});
const potMat = new THREE.MeshPhysicalMaterial({
  color: 0xb85b35,
  roughness: 0.65,
  clearcoat: 0.15
});
const rimMat = new THREE.MeshPhysicalMaterial({
  color: 0xd87845,
  roughness: 0.48,
  clearcoat: 0.25
});
const soilMat = new THREE.MeshStandardMaterial({ color: 0x4c281d, roughness: 1 });
const darkMat = new THREE.MeshStandardMaterial({ color: 0x301b17, roughness: 0.7 });
const eyeMat = new THREE.MeshPhysicalMaterial({ color: 0xffd84a, roughness: 0.24, clearcoat: 0.8 });
const pupilMat = new THREE.MeshStandardMaterial({ color: 0x251514, roughness: 0.4 });

function shadow(mesh) {
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const ground = shadow(new THREE.Mesh(
  new THREE.CircleGeometry(12, 64),
  new THREE.MeshStandardMaterial({ color: 0x91d2c0, roughness: 0.9 })
));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.02;
scene.add(ground);

const pot = new THREE.Group();
scene.add(pot);

const potProfile = [
  new THREE.Vector2(0.68, 0),
  new THREE.Vector2(0.83, 0.08),
  new THREE.Vector2(0.91, 0.25),
  new THREE.Vector2(0.94, 1.02),
  new THREE.Vector2(0.88, 1.20),
  new THREE.Vector2(0.72, 1.29)
];
const potBody = shadow(new THREE.Mesh(new THREE.LatheGeometry(potProfile, 64), potMat));
potBody.position.y = 0.05;
pot.add(potBody);

const rim = shadow(new THREE.Mesh(new THREE.TorusGeometry(0.79, 0.14, 18, 64), rimMat));
rim.rotation.x = Math.PI / 2;
rim.position.y = 1.29;
pot.add(rim);

const soil = shadow(new THREE.Mesh(new THREE.CylinderGeometry(0.72, 0.72, 0.12, 64), soilMat));
soil.position.y = 1.31;
pot.add(soil);

for (let i = 0; i < 8; i++) {
  const pebble = shadow(new THREE.Mesh(
    new THREE.SphereGeometry(0.055 + (i % 3) * 0.015, 12, 8),
    new THREE.MeshStandardMaterial({ color: i % 2 ? 0x68402b : 0x3a2119, roughness: 1 })
  ));
  const a = i * 1.9;
  pebble.scale.set(1.5, 0.65, 1);
  pebble.position.set(Math.cos(a) * 0.45, 1.4, Math.sin(a) * 0.45);
  pot.add(pebble);
}

function makeStem(points, radius = 0.105) {
  const curve = new THREE.CatmullRomCurve3(points);
  return shadow(new THREE.Mesh(new THREE.TubeGeometry(curve, 32, radius, 12, false), green));
}

const plant = new THREE.Group();
scene.add(plant);

const leftStem = new THREE.Group();
leftStem.add(makeStem([
  new THREE.Vector3(-0.12, 1.35, 0),
  new THREE.Vector3(-0.28, 1.85, 0.03),
  new THREE.Vector3(-0.54, 2.27, 0.02),
  new THREE.Vector3(-0.62, 2.62, 0)
]));
plant.add(leftStem);

const rightStem = new THREE.Group();
rightStem.add(makeStem([
  new THREE.Vector3(0.12, 1.35, 0.02),
  new THREE.Vector3(0.27, 1.83, 0),
  new THREE.Vector3(0.56, 2.25, -0.02),
  new THREE.Vector3(0.69, 2.62, 0)
]));
plant.add(rightStem);

function leafShape() {
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.bezierCurveTo(-0.48, 0.13, -0.83, 0.62, -0.82, 1.10);
  s.bezierCurveTo(-0.80, 1.62, -0.47, 1.92, 0, 1.98);
  s.bezierCurveTo(0.47, 1.92, 0.80, 1.62, 0.82, 1.10);
  s.bezierCurveTo(0.83, 0.62, 0.48, 0.13, 0, 0);
  return s;
}

function addTeeth(group, upper = false) {
  const cone = new THREE.ConeGeometry(0.105, 0.30, 8);
  const positions = [-0.61, -0.40, -0.19, 0, 0.19, 0.40, 0.61];
  positions.forEach((x, i) => {
    const tooth = shadow(new THREE.Mesh(cone, toothMat));
    tooth.position.set(x, 1.73 + Math.abs(x) * 0.12, 0.17);
    tooth.rotation.z = upper ? Math.PI : 0;
    tooth.rotation.x = upper ? -0.05 : 0.05;
    tooth.scale.set(0.78 + (i % 2) * 0.16, 1, 0.78 + (i % 2) * 0.16);
    group.add(tooth);
  });
}

function makeJaw(material, upper = false) {
  const jaw = new THREE.Group();
  const body = shadow(new THREE.Mesh(
    new THREE.ExtrudeGeometry(leafShape(), {
      depth: 0.20,
      bevelEnabled: true,
      bevelSegments: 3,
      bevelSize: 0.045,
      bevelThickness: 0.035,
      curveSegments: 16
    }),
    material
  ));
  body.position.z = -0.10;
  jaw.add(body);

  const inner = shadow(new THREE.Mesh(new THREE.ShapeGeometry(leafShape(), 24), upper ? mouthRed : innerGreen));
  inner.position.z = 0.115;
  inner.scale.set(0.83, 0.86, 1);
  inner.position.y = 0.10;
  jaw.add(inner);

  const centralVein = shadow(new THREE.Mesh(
    new THREE.CapsuleGeometry(0.035, 1.42, 6, 10),
    upper ? darkMat : new THREE.MeshStandardMaterial({ color: 0x57bb45, roughness: 0.55 })
  ));
  centralVein.rotation.z = Math.PI / 2;
  centralVein.scale.set(1, 0.7, 0.5);
  centralVein.position.set(0, 0.82, 0.14);
  jaw.add(centralVein);

  addTeeth(jaw, upper);
  return jaw;
}

function addEyes(jaw) {
  [-0.28, 0.28].forEach((x, i) => {
    const eye = shadow(new THREE.Mesh(new THREE.SphereGeometry(0.16, 24, 16), eyeMat));
    eye.position.set(x, 1.47, 0.27);
    jaw.add(eye);

    const pupil = shadow(new THREE.Mesh(new THREE.SphereGeometry(0.072, 20, 14), pupilMat));
    pupil.position.set(x + (i ? -0.025 : 0.025), 1.49, 0.405);
    jaw.add(pupil);
  });
}

const openTrap = new THREE.Group();
openTrap.position.set(-0.62, 2.62, 0);
openTrap.rotation.z = -0.16;
const lowerJaw = makeJaw(lightGreen, false);
lowerJaw.rotation.x = -0.30;
openTrap.add(lowerJaw);

const upperJaw = makeJaw(green, true);
upperJaw.rotation.x = 0.92;
upperJaw.position.z = 0.03;
openTrap.add(upperJaw);
addEyes(upperJaw);
plant.add(openTrap);

const closedTrap = new THREE.Group();
closedTrap.position.set(0.69, 2.62, 0);
closedTrap.rotation.z = 0.18;
const closedLower = makeJaw(lightGreen, false);
closedLower.rotation.x = -0.035;
closedTrap.add(closedLower);
const closedUpper = makeJaw(green, true);
closedUpper.rotation.x = 0.16;
closedUpper.position.z = 0.025;
closedTrap.add(closedUpper);
plant.add(closedTrap);

const cheek = shadow(new THREE.Mesh(
  new THREE.SphereGeometry(0.11, 16, 12),
  new THREE.MeshStandardMaterial({ color: 0xff7d65, roughness: 0.55 })
));
cheek.position.set(-1.12, 2.98, 0.35);
plant.add(cheek);

const cheek2 = cheek.clone();
cheek2.position.x = -0.12;
plant.add(cheek2);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  leftStem.rotation.z = Math.sin(t * 1.8) * 0.025;
  rightStem.rotation.z = Math.sin(t * 1.7 + 1.5) * 0.025;
  openTrap.rotation.z = -0.16 + Math.sin(t * 1.5) * 0.025;
  closedTrap.rotation.z = 0.18 + Math.sin(t * 1.4 + 0.8) * 0.018;
  openTrap.position.y = 2.62 + Math.sin(t * 2.1) * 0.025;
  plant.rotation.y = Math.sin(t * 0.7) * 0.035;
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
</body>
</html>
