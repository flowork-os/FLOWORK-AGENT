<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plush Teddy Bear</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #d9cfc4; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9cfc4);
scene.fog = new THREE.Fog(0xd9cfc4, 8, 15);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.2, 2.8, 6.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 4.5;
controls.maxDistance = 10;
controls.target.set(0, 0.35, 0);

scene.add(new THREE.HemisphereLight(0xfff5e8, 0x766b68, 2.1));

const keyLight = new THREE.DirectionalLight(0xffe4c4, 3.2);
keyLight.position.set(-4, 7, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -4;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xb7caff, 0.9);
fillLight.position.set(4, 3, -4);
scene.add(fillLight);

const bear = new THREE.Group();
bear.position.y = 0.05;
scene.add(bear);

const fur = new THREE.MeshStandardMaterial({
  color: 0x9a6048,
  roughness: 0.92,
  metalness: 0
});
const furLight = new THREE.MeshStandardMaterial({
  color: 0xb77a5a,
  roughness: 0.95
});
const muzzleMat = new THREE.MeshStandardMaterial({
  color: 0xd7a17b,
  roughness: 0.96
});
const bellyMat = new THREE.MeshStandardMaterial({
  color: 0xc8906b,
  roughness: 0.98
});
const threadMat = new THREE.MeshStandardMaterial({
  color: 0x613b32,
  roughness: 0.9
});
const eyeMat = new THREE.MeshStandardMaterial({
  color: 0x160e0d,
  roughness: 0.22,
  metalness: 0.05
});
const noseMat = new THREE.MeshStandardMaterial({
  color: 0x3b211c,
  roughness: 0.42
});
const highlightMat = new THREE.MeshBasicMaterial({ color: 0xfff6e9 });

const sphereGeometry = new THREE.SphereGeometry(1, 36, 24);

function plushSphere(material, position, dimensions, parent = bear) {
  const mesh = new THREE.Mesh(sphereGeometry, material);
  mesh.position.set(position[0], position[1], position[2]);
  mesh.scale.set(dimensions[0], dimensions[1], dimensions[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function tube(points, radius, material, parent = bear) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(p[0], p[1], p[2])));
  const geometry = new THREE.TubeGeometry(curve, 32, radius, 8, false);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  parent.add(mesh);
  return mesh;
}

function torus(position, major, minor, scale, material, rotation = [0, 0, 0]) {
  const mesh = new THREE.Mesh(new THREE.TorusGeometry(major, minor, 8, 48), material);
  mesh.position.set(position[0], position[1], position[2]);
  mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
  mesh.scale.set(scale[0], scale[1], scale[2]);
  mesh.castShadow = true;
  bear.add(mesh);
  return mesh;
}

function tuft(position, dimensions, rotation, material = furLight) {
  const mesh = plushSphere(material, position, dimensions);
  mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
  return mesh;
}

plushSphere(fur, [0, -0.45, 0], [1.48, 1.68, 1.02]);
plushSphere(bellyMat, [0, -0.48, 0.91], [0.94, 1.16, 0.13]);
torus([0, -0.48, 1.035], 1, 0.018, [0.86, 1.16, 1], threadMat);

plushSphere(fur, [0, 1.42, 0.02], [1.22, 1.11, 1.04]);
plushSphere(muzzleMat, [0, 1.17, 0.91], [0.72, 0.47, 0.25]);
plushSphere(muzzleMat, [0, 1.39, 0.89], [0.57, 0.39, 0.22]);

plushSphere(fur, [-0.98, 1.72, -0.01], [0.53, 0.62, 0.32]);
plushSphere(fur, [0.98, 1.72, -0.01], [0.53, 0.62, 0.32]);
plushSphere(muzzleMat, [-0.98, 1.72, 0.29], [0.34, 0.4, 0.1]);
plushSphere(muzzleMat, [0.98, 1.72, 0.29], [0.34, 0.4, 0.1]);
torus([-0.98, 1.72, 0.3], 0.43, 0.022, [1, 1.15, 1], threadMat);
torus([0.98, 1.72, 0.3], 0.43, 0.022, [1, 1.15, 1], threadMat);

plushSphere(eyeMat, [-0.43, 1.63, 0.88], [0.105, 0.13, 0.09]);
plushSphere(eyeMat, [0.43, 1.63, 0.88], [0.105, 0.13, 0.09]);
plushSphere(highlightMat, [-0.46, 1.68, 0.962], [0.027, 0.035, 0.018]);
plushSphere(highlightMat, [0.40, 1.68, 0.962], [0.027, 0.035, 0.018]);

plushSphere(noseMat, [0, 1.36, 1.18], [0.22, 0.16, 0.13]);
tube([[-0.02, 1.27, 1.19], [0, 1.19, 1.2], [0.02, 1.15, 1.19]], 0.018, threadMat);
tube([[0, 1.19, 1.2], [-0.17, 1.11, 1.17], [-0.26, 1.13, 1.13]], 0.014, threadMat);
tube([[0, 1.19, 1.2], [0.17, 1.11, 1.17], [0.26, 1.13, 1.13]], 0.014, threadMat);

plushSphere(fur, [-1.43, -0.22, 0.02], [0.48, 1.16, 0.54]);
plushSphere(fur, [1.43, -0.22, 0.02], [0.48, 1.16, 0.54]);
plushSphere(furLight, [-1.48, -0.94, 0.38], [0.53, 0.43, 0.61]);
plushSphere(furLight, [1.48, -0.94, 0.38], [0.53, 0.43, 0.61]);
torus([-1.46, -0.92, 0.82], 0.43, 0.025, [1, 0.88, 1], threadMat, [Math.PI / 2, 0, 0]);
torus([1.46, -0.92, 0.82], 0.43, 0.025, [1, 0.88, 1], threadMat, [Math.PI / 2, 0, 0]);

plushSphere(fur, [-0.78, -1.65, 0.08], [0.82, 0.72, 0.7]);
plushSphere(fur, [0.78, -1.65, 0.08], [0.82, 0.72, 0.7]);
plushSphere(furLight, [-0.82, -2.02, 0.5], [0.84, 0.43, 0.78]);
plushSphere(furLight, [0.82, -2.02, 0.5], [0.84, 0.43, 0.78]);

for (const x of [-0.82, 0.82]) {
  for (const toe of [-0.28, 0, 0.28]) {
    plushSphere(threadMat, [x + toe * 0.42, -2.12, 1.19], [0.045, 0.075, 0.025]);
  }
}

for (let i = 0; i < 11; i++) {
  const angle = -Math.PI * 0.82 + i * (Math.PI * 1.64 / 10);
  const x = Math.cos(angle) * 0.92;
  const y = -0.48 + Math.sin(angle) * 1.2;
  const stitch = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.035, 0.035), threadMat);
  stitch.position.set(x, y, 1.065);
  stitch.rotation.z = angle + Math.PI / 2;
  stitch.castShadow = true;
  bear.add(stitch);
}

for (let i = 0; i < 18; i++) {
  const a = i / 18 * Math.PI * 2;
  tuft([Math.cos(a) * 1.12, 1.42 + Math.sin(a) * 1.01, 0.02], [0.045, 0.12, 0.045], [0, 0, -a * 0.45]);
}
for (let i = 0; i < 16; i++) {
  const a = i / 16 * Math.PI * 2;
  tuft([Math.cos(a) * 1.39, -0.42 + Math.sin(a) * 1.54, 0], [0.05, 0.15, 0.05], [0, 0, a * 0.4]);
}

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(7, 64),
  new THREE.MeshStandardMaterial({ color: 0xc8bbae, roughness: 1 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -2.47;
floor.receiveShadow = true;
scene.add(floor);

const softShadow = new THREE.Mesh(
  new THREE.CircleGeometry(2.5, 64),
  new THREE.MeshBasicMaterial({ color: 0x806e68, transparent: true, opacity: 0.16 })
);
softShadow.rotation.x = -Math.PI / 2;
softShadow.scale.set(1.35, 0.55, 1);
softShadow.position.set(0, -2.455, 0.18);
scene.add(softShadow);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
