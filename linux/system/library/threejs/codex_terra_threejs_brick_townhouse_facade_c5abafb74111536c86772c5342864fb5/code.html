<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Procedural Brick Townhouse</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #b8c9d1; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8c9d1);
scene.fog = new THREE.Fog(0xb8c9d1, 20, 48);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(10.5, 8.5, 15.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 5.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.42;
controls.minDistance = 8;
controls.maxDistance = 28;
controls.maxPolarAngle = Math.PI * 0.49;

const house = new THREE.Group();
scene.add(house);

const materials = {
  mortar: new THREE.MeshStandardMaterial({ color: 0x8a7569, roughness: 0.96 }),
  brickA: new THREE.MeshStandardMaterial({ color: 0x8d3329, roughness: 0.88 }),
  brickB: new THREE.MeshStandardMaterial({ color: 0xa64532, roughness: 0.9 }),
  brickC: new THREE.MeshStandardMaterial({ color: 0x713027, roughness: 0.92 }),
  stone: new THREE.MeshStandardMaterial({ color: 0xbaa992, roughness: 0.82 }),
  stoneDark: new THREE.MeshStandardMaterial({ color: 0x8f806e, roughness: 0.86 }),
  door: new THREE.MeshStandardMaterial({ color: 0x18313a, roughness: 0.44, metalness: 0.12 }),
  doorInset: new THREE.MeshStandardMaterial({ color: 0x0d1f26, roughness: 0.35, metalness: 0.18 }),
  glass: new THREE.MeshStandardMaterial({ color: 0x7197a6, roughness: 0.16, metalness: 0.15, transparent: true, opacity: 0.83 }),
  frame: new THREE.MeshStandardMaterial({ color: 0xe0d7c6, roughness: 0.62 }),
  metal: new THREE.MeshStandardMaterial({ color: 0x443b32, roughness: 0.32, metalness: 0.74 }),
  step: new THREE.MeshStandardMaterial({ color: 0x68625c, roughness: 0.88 })
};

function box(width, height, depth, material, x, y, z) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function addBrickWall(yStart, yEnd, openings) {
  const facadeZ = 0;
  const brickW = 0.78;
  const brickH = 0.275;
  const gap = 0.028;
  const halfWidth = 3.15;
  const rows = Math.ceil((yEnd - yStart) / (brickH + gap));

  function blocked(x, y) {
    return openings.some((opening) =>
      x > opening.minX && x < opening.maxX &&
      y > opening.minY && y < opening.maxY
    );
  }

  for (let row = 0; row < rows; row++) {
    const y = yStart + row * (brickH + gap) + brickH * 0.5;
    if (y > yEnd - brickH * 0.35) continue;
    const offset = row % 2 === 0 ? 0 : brickW * 0.5;
    const count = Math.ceil((halfWidth * 2 + brickW) / brickW);
    for (let i = 0; i < count; i++) {
      const x = -halfWidth - brickW * 0.5 + i * brickW + offset;
      if (x < -halfWidth - brickW * 0.45 || x > halfWidth + brickW * 0.45) continue;
      if (!blocked(x, y)) {
        const tint = (row * 11 + i * 7) % 9;
        const material = tint < 2 ? materials.brickC : tint > 6 ? materials.brickB : materials.brickA;
        const brick = box(brickW - gap, brickH, 0.34, material, x, y, facadeZ);
        brick.position.z += ((row + i) % 3) * 0.004;
        house.add(brick);
      }
    }
  }
}

const doorOpening = { minX: -1.4, maxX: 1.4, minY: 0.2, maxY: 3.72 };
const windowOpenings = [
  { minX: -2.24, maxX: 0.1, minY: 4.55, maxY: 7.4 },
  { minX: -2.24, maxX: 0.1, minY: 8.2, maxY: 11.05 },
  { minX: 0.62, maxX: 2.62, minY: 8.2, maxY: 11.05 }
];

addBrickWall(0, 12.2, [doorOpening, ...windowOpenings]);

house.add(box(6.5, 12.25, 0.18, materials.mortar, 0, 6.12, 0.2));

const openingMask = box(6.8, 12.5, 0.05, new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0 }), 0, 6.2, 0.34);
openingMask.visible = false;
house.add(openingMask);

function addWindow(x, y, width, height) {
  const z = -0.12;
  const recess = box(width + 0.15, height + 0.18, 0.25, materials.doorInset, x, y, z);
  house.add(recess);

  const outerFrame = box(width + 0.24, height + 0.24, 0.17, materials.frame, x, y, -0.28);
  house.add(outerFrame);

  const glass = box(width - 0.18, height - 0.18, 0.08, materials.glass, x, y, -0.39);
  house.add(glass);

  const muntinV = box(0.10, height - 0.12, 0.12, materials.frame, x, y, -0.47);
  const muntinH = box(width - 0.12, 0.10, 0.12, materials.frame, x, y, -0.48);
  house.add(muntinV, muntinH);

  const topLintel = box(width + 0.52, 0.25, 0.42, materials.stoneDark, x, y + height * 0.5 + 0.15, -0.19);
  const sill = box(width + 0.42, 0.18, 0.66, materials.stone, x, y - height * 0.5 - 0.11, -0.35);
  const sillLip = box(width + 0.58, 0.08, 0.76, materials.stoneDark, x, y - height * 0.5 - 0.20, -0.40);
  house.add(topLintel, sill, sillLip);
}

addWindow(-1.07, 5.98, 2.08, 2.5);
addWindow(-1.07, 9.63, 2.08, 2.5);
addWindow(1.62, 9.63, 1.76, 2.5);

const doorRecess = box(2.75, 3.55, 0.46, materials.doorInset, 0, 1.95, -0.06);
const doorPanel = box(2.4, 3.25, 0.16, materials.door, 0, 1.86, -0.34);
house.add(doorRecess, doorPanel);

const doorFrameLeft = box(0.18, 3.58, 0.3, materials.stoneDark, -1.38, 1.94, -0.23);
const doorFrameRight = box(0.18, 3.58, 0.3, materials.stoneDark, 1.38, 1.94, -0.23);
const doorLintel = box(2.95, 0.28, 0.38, materials.stoneDark, 0, 3.78, -0.23);
house.add(doorFrameLeft, doorFrameRight, doorLintel);

const doorUpperGlass = box(1.84, 0.68, 0.055, materials.glass, 0, 2.89, -0.45);
const doorRail = box(1.94, 0.10, 0.11, materials.frame, 0, 2.54, -0.5);
const doorMuntin = box(0.08, 0.72, 0.11, materials.frame, 0, 2.89, -0.5);
const panelTop = box(1.76, 0.54, 0.06, materials.doorInset, 0, 1.86, -0.46);
const panelBottom = box(1.76, 0.54, 0.06, materials.doorInset, 0, 1.15, -0.46);
house.add(doorUpperGlass, doorRail, doorMuntin, panelTop, panelBottom);

const handle = new THREE.Mesh(new THREE.SphereGeometry(0.075, 16, 12), materials.metal);
handle.position.set(0.91, 1.9, -0.57);
handle.castShadow = true;
house.add(handle);

const threshold = box(2.8, 0.16, 0.78, materials.stone, 0, 0.14, -0.42);
const frontStep = box(3.45, 0.26, 1.15, materials.step, 0, -0.07, -0.85);
const lowerStep = box(4.05, 0.20, 1.52, materials.step, 0, -0.28, -1.13);
house.add(threshold, frontStep, lowerStep);

function addStringCourse(y) {
  const band = box(6.62, 0.23, 0.52, materials.stoneDark, 0, y, -0.16);
  const lowerLip = box(6.76, 0.08, 0.62, materials.stone, 0, y - 0.13, -0.21);
  house.add(band, lowerLip);
}
addStringCourse(4.18);
addStringCourse(7.82);

const parapetBand = box(6.65, 0.46, 0.55, materials.stoneDark, 0, 12.22, -0.12);
const parapetCap = box(6.95, 0.19, 0.77, materials.stone, 0, 12.53, -0.22);
const parapetTop = box(6.48, 0.42, 0.36, materials.brickC, 0, 12.76, 0.04);
house.add(parapetBand, parapetCap, parapetTop);

const sideWall = box(0.32, 12.4, 1.3, materials.brickC, 3.22, 6.15, 0.54);
house.add(sideWall);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(50, 50),
  new THREE.MeshStandardMaterial({ color: 0x6f7670, roughness: 0.97 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.39;
ground.receiveShadow = true;
scene.add(ground);

const sun = new THREE.DirectionalLight(0xffefd4, 3.3);
sun.position.set(-7, 13, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -12;
sun.shadow.camera.right = 12;
sun.shadow.camera.top = 15;
sun.shadow.camera.bottom = -4;
sun.shadow.bias = -0.00035;
scene.add(sun);

const fill = new THREE.HemisphereLight(0xcce8ff, 0x4c4035, 2.15);
scene.add(fill);

const warmLight = new THREE.PointLight(0xffbb73, 20, 8, 2);
warmLight.position.set(0, 3.8, -2.4);
scene.add(warmLight);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();
  warmLight.intensity = 16 + Math.sin(time * 1.2) * 2;
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
