<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brick Knight</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #cbd3dc;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcbd3dc);
scene.fog = new THREE.Fog(0xcbd3dc, 22, 38);

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
camera.position.set(12, 9.5, 16);
camera.lookAt(0, 4.2, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4.15, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.72;
controls.minDistance = 10;
controls.maxDistance = 28;
controls.maxPolarAngle = Math.PI * 0.49;

const hemi = new THREE.HemisphereLight(0xf4f8ff, 0x53616d, 2.15);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffffff, 4.3);
key.position.set(7, 13, 9);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -9;
key.shadow.camera.right = 9;
key.shadow.camera.top = 13;
key.shadow.camera.bottom = -5;
key.shadow.camera.near = 1;
key.shadow.camera.far = 32;
key.shadow.bias = -0.00015;
key.shadow.normalBias = 0.025;
scene.add(key);

const rim = new THREE.DirectionalLight(0x8db7ff, 2.4);
rim.position.set(-9, 8, -8);
scene.add(rim);

const warm = new THREE.PointLight(0xffc890, 23, 22, 2);
warm.position.set(5, 6, 7);
scene.add(warm);

const makeMaterial = (color, roughness = 0.24, metalness = 0.02) =>
  new THREE.MeshStandardMaterial({
    color,
    roughness,
    metalness,
    envMapIntensity: 0.6
  });

const blue = makeMaterial(0x234f88, 0.2);
const blueDark = makeMaterial(0x17355e, 0.23);
const steel = makeMaterial(0x89929b, 0.19, 0.56);
const steelDark = makeMaterial(0x424a52, 0.22, 0.48);
const silver = makeMaterial(0xbcc4ca, 0.16, 0.67);
const edgeSteel = makeMaterial(0x68727a, 0.22, 0.58);
const black = makeMaterial(0x11161b, 0.3);
const gold = makeMaterial(0xd5a62d, 0.19, 0.47);
const leather = makeMaterial(0x4c2c1b, 0.34);
const yellow = makeMaterial(0xe9b92e, 0.2);
const red = makeMaterial(0x9e2630, 0.27);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0xb6bec7,
  roughness: 0.72,
  metalness: 0
});

const knight = new THREE.Group();
knight.rotation.y = -0.08;
scene.add(knight);

function mesh(geometry, material, parent = knight) {
  const object = new THREE.Mesh(geometry, material);
  object.castShadow = true;
  object.receiveShadow = true;
  parent.add(object);
  return object;
}

function roundedBox(w, h, d, radius, material, x, y, z, parent = knight) {
  const object = mesh(new RoundedBoxGeometry(w, h, d, 4, radius), material, parent);
  object.position.set(x, y, z);
  return object;
}

function cylinder(radiusTop, radiusBottom, height, segments, material, x, y, z, parent = knight) {
  const object = mesh(
    new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments),
    material,
    parent
  );
  object.position.set(x, y, z);
  return object;
}

function stud(x, y, z, material, radius = 0.31, height = 0.18, parent = knight) {
  const object = cylinder(radius, radius, height, 32, material, x, y, z, parent);
  const top = mesh(
    new THREE.CircleGeometry(radius * 0.84, 32),
    material,
    parent
  );
  top.rotation.x = -Math.PI / 2;
  top.position.set(x, y + height * 0.505, z);
  return object;
}

function extrudedShape(shape, depth, bevel, material, parent = knight) {
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth,
    bevelEnabled: true,
    bevelSegments: 3,
    steps: 1,
    bevelSize: bevel,
    bevelThickness: bevel
  });
  geometry.center();
  return mesh(geometry, material, parent);
}

const ground = new THREE.Mesh(
  new THREE.CylinderGeometry(8.4, 8.8, 0.48, 96),
  groundMat
);
ground.position.y = -0.3;
ground.receiveShadow = true;
scene.add(ground);

const groundRing = new THREE.Mesh(
  new THREE.TorusGeometry(7.5, 0.055, 10, 96),
  new THREE.MeshStandardMaterial({ color: 0xd5dbe1, roughness: 0.5 })
);
groundRing.rotation.x = Math.PI / 2;
groundRing.position.y = -0.045;
groundRing.receiveShadow = true;
scene.add(groundRing);

const legLeft = roundedBox(1.08, 2.35, 1.25, 0.12, blueDark, -0.64, 1.25, 0);
const legRight = roundedBox(1.08, 2.35, 1.25, 0.12, blueDark, 0.64, 1.25, 0);

roundedBox(1.18, 0.55, 1.65, 0.12, blueDark, -0.64, 0.24, 0.2);
roundedBox(1.18, 0.55, 1.65, 0.12, blueDark, 0.64, 0.24, 0.2);
stud(-0.64, 2.48, 0, blueDark, 0.3, 0.15);
stud(0.64, 2.48, 0, blueDark, 0.3, 0.15);

roundedBox(2.72, 0.68, 1.38, 0.15, blue, 0, 2.66, 0);
stud(-0.72, 3.07, 0, blue, 0.3, 0.17);
stud(0.72, 3.07, 0, blue, 0.3, 0.17);

const torsoShape = new THREE.Shape();
torsoShape.moveTo(-1.22, -1.45);
torsoShape.lineTo(1.22, -1.45);
torsoShape.lineTo(1.46, 1.4);
torsoShape.lineTo(-1.46, 1.4);
torsoShape.closePath();
const torso = extrudedShape(torsoShape, 1.35, 0.09, blue);
torso.position.set(0, 4.43, -0.02);

const neck = cylinder(0.45, 0.45, 0.32, 32, yellow, 0, 6.04, 0);
stud(-0.85, 5.94, 0, blue, 0.31, 0.18);
stud(0.85, 5.94, 0, blue, 0.31, 0.18);

const plateShape = new THREE.Shape();
plateShape.moveTo(-1.02, -1.18);
plateShape.lineTo(1.02, -1.18);
plateShape.lineTo(1.18, 1.02);
plateShape.lineTo(0.56, 1.2);
plateShape.lineTo(0.3, 0.86);
plateShape.lineTo(-0.3, 0.86);
plateShape.lineTo(-0.56, 1.2);
plateShape.lineTo(-1.18, 1.02);
plateShape.closePath();
const chestPlate = extrudedShape(plateShape, 0.09, 0.025, steel);
chestPlate.position.set(0, 4.45, 0.735);

const chestInset = new THREE.Shape();
chestInset.moveTo(-0.52, -0.64);
chestInset.lineTo(0.52, -0.64);
chestInset.lineTo(0.66, 0.5);
chestInset.lineTo(0, 0.82);
chestInset.lineTo(-0.66, 0.5);
chestInset.closePath();
const chestField = extrudedShape(chestInset, 0.035, 0.012, steelDark);
chestField.position.set(0, 4.42, 0.818);

const crestShape = new THREE.Shape();
crestShape.moveTo(0, -0.46);
crestShape.lineTo(0.36, -0.18);
crestShape.lineTo(0.27, 0.36);
crestShape.lineTo(0, 0.55);
crestShape.lineTo(-0.27, 0.36);
crestShape.lineTo(-0.36, -0.18);
crestShape.closePath();
const crest = extrudedShape(crestShape, 0.025, 0.008, gold);
crest.scale.setScalar(0.78);
crest.position.set(0, 4.48, 0.86);

const belt = roundedBox(2.54, 0.29, 1.46, 0.055, leather, 0, 3.18, 0.05);
roundedBox(0.47, 0.42, 1.51, 0.06, gold, 0, 3.18, 0.08);

function makeArm(side) {
  const arm = new THREE.Group();
  arm.position.set(side * 1.7, 5.1, 0);
  arm.rotation.z = side * -0.075;
  knight.add(arm);

  const shoulder = mesh(
    new THREE.CylinderGeometry(0.58, 0.58, 0.64, 32),
    steel,
    arm
  );
  shoulder.rotation.z = Math.PI / 2;
  shoulder.position.y = 0.38;

  const shoulderStud = mesh(
    new THREE.CylinderGeometry(0.25, 0.25, 0.16, 28),
    steel,
    arm
  );
  shoulderStud.position.set(side * 0.39, 0.38, 0);

  const upper = roundedBox(0.72, 1.62, 0.9, 0.16, blue, 0, -0.55, 0, arm);
  upper.rotation.z = side * 0.035;

  const cuff = cylinder(0.43, 0.43, 0.42, 32, steelDark, 0, -1.48, 0, arm);
  return arm;
}

const leftArm = makeArm(-1);
const rightArm = makeArm(1);

function makeClip(parent, y, rotationZ = 0) {
  const clip = mesh(
    new THREE.TorusGeometry(0.34, 0.135, 14, 38, Math.PI * 1.48),
    steelDark,
    parent
  );
  clip.position.set(0, y, 0);
  clip.rotation.z = rotationZ - Math.PI * 0.74;
  clip.rotation.x = Math.PI / 2;
  return clip;
}

makeClip(leftArm, -1.92, -0.1);
makeClip(rightArm, -1.92, 0.1);

const head = cylinder(0.78, 0.78, 1.18, 48, yellow, 0, 6.7, 0);
const headTop = cylinder(0.67, 0.78, 0.18, 48, yellow, 0, 7.38, 0);
const faceBand = roundedBox(1.26, 0.18, 0.05, 0.025, black, 0, 6.77, 0.765);
roundedBox(0.18, 0.14, 0.045, 0.025, yellow, 0, 6.77, 0.798);

const helmetShell = cylinder(0.98, 0.98, 1.02, 48, steel, 0, 7.48, 0);
const helmetDome = mesh(
  new THREE.SphereGeometry(0.98, 48, 24, 0, Math.PI * 2, 0, Math.PI * 0.54),
  steel
);
helmetDome.position.set(0, 7.99, 0);
helmetDome.castShadow = true;

const helmetRim = cylinder(1.07, 1.07, 0.22, 48, steelDark, 0, 7.02, 0);
const helmetStud = cylinder(0.28, 0.31, 0.24, 32, steelDark, 0, 8.93, 0);
stud(0, 9.08, 0, steelDark, 0.23, 0.12);

const visor = new THREE.Group();
visor.position.set(0, 7.55, 0.89);
knight.add(visor);
roundedBox(1.86, 0.27, 0.18, 0.06, steelDark, 0, 0.18, 0, visor);
roundedBox(1.82, 0.17, 0.17, 0.05, steelDark, 0, -0.22, 0.02, visor);
for (let i = -3; i <= 3; i++) {
  const bar = roundedBox(0.105, 0.53, 0.15, 0.025, steelDark, i * 0.23, -0.02, 0.02, visor);
  bar.rotation.z = i * 0.018;
}
const hingeL = cylinder(0.22, 0.22, 0.2, 28, steelDark, -1.02, 7.62, 0);
hingeL.rotation.z = Math.PI / 2;
const hingeR = cylinder(0.22, 0.22, 0.2, 28, steelDark, 1.02, 7.62, 0);
hingeR.rotation.z = Math.PI / 2;

const plumeStem = cylinder(0.13, 0.18, 0.68, 24, gold, 0, 9.48, 0);
plumeStem.rotation.z = -0.14;
const plumeShape = new THREE.Shape();
plumeShape.moveTo(0, -0.65);
plumeShape.bezierCurveTo(0.55, -0.45, 0.68, 0.14, 0.44, 0.7);
plumeShape.bezierCurveTo(0.18, 0.44, -0.18, 0.25, -0.35, 0.02);
plumeShape.bezierCurveTo(-0.18, -0.15, -0.08, -0.42, 0, -0.65);
const plume = extrudedShape(plumeShape, 0.16, 0.035, red);
plume.position.set(0.04, 9.93, -0.02);
plume.rotation.y = -0.22;

const swordGroup = new THREE.Group();
swordGroup.position.set(-2.05, 3.02, 0.05);
swordGroup.rotation.z = -0.12;
swordGroup.rotation.x = -0.03;
knight.add(swordGroup);

const swordGrip = cylinder(0.15, 0.15, 1.0, 24, leather, 0, 1.0, 0, swordGroup);
const swordPommel = mesh(new THREE.SphereGeometry(0.25, 24, 16), gold, swordGroup);
swordPommel.position.set(0, 0.43, 0);
const guard = roundedBox(1.15, 0.19, 0.28, 0.07, gold, 0, 1.5, 0, swordGroup);
guard.rotation.z = 0.02;

const bladeShape = new THREE.Shape();
bladeShape.moveTo(-0.22, -1.45);
bladeShape.lineTo(-0.3, 0.85);
bladeShape.lineTo(0, 1.55);
bladeShape.lineTo(0.3, 0.85);
bladeShape.lineTo(0.22, -1.45);
bladeShape.closePath();
const blade = extrudedShape(bladeShape, 0.14, 0.025, silver, swordGroup);
blade.position.set(0, 3.0, 0);
const bladeRidge = roundedBox(0.065, 2.35, 0.18, 0.02, edgeSteel, 0, 2.88, 0.08, swordGroup);
bladeRidge.rotation.z = 0.002;

const shieldGroup = new THREE.Group();
shieldGroup.position.set(2.23, 4.0, 0.65);
shieldGroup.rotation.y = -0.19;
shieldGroup.rotation.z = 0.08;
knight.add(shieldGroup);

const shieldShape = new THREE.Shape();
shieldShape.moveTo(0, -1.75);
shieldShape.bezierCurveTo(0.95, -1.3, 1.28, -0.35, 1.22, 1.34);
shieldShape.lineTo(0.65, 1.62);
shieldShape.lineTo(-0.65, 1.62);
shieldShape.lineTo(-1.22, 1.34);
shieldShape.bezierCurveTo(-1.28, -0.35, -0.95, -1.3, 0, -1.75);
shieldShape.closePath();
const shield = extrudedShape(shieldShape, 0.24, 0.09, steel, shieldGroup);

const shieldInner = new THREE.Shape();
shieldInner.moveTo(0, -1.37);
shieldInner.bezierCurveTo(0.69, -1.0, 0.91, -0.22, 0.88, 1.06);
shieldInner.lineTo(0.45, 1.27);
shieldInner.lineTo(-0.45, 1.27);
shieldInner.lineTo(-0.88, 1.06);
shieldInner.bezierCurveTo(-0.91, -0.22, -0.69, -1.0, 0, -1.37);
shieldInner.closePath();
const shieldPanel = extrudedShape(shieldInner, 0.055, 0.025, blueDark, shieldGroup);
shieldPanel.position.z = 0.16;

const shieldCrossV = roundedBox(0.29, 2.15, 0.08, 0.055, silver, 0, 0.02, 0.21, shieldGroup);
const shieldCrossH = roundedBox(1.45, 0.29, 0.08, 0.055, silver, 0, 0.36, 0.21, shieldGroup);
const shieldBoss = cylinder(0.33, 0.33, 0.16, 32, gold, 0, 0.36, 0.31, shieldGroup);
shieldBoss.rotation.x = Math.PI / 2;

for (const [x, y] of [[-0.78, 1.08], [0.78, 1.08], [-0.63, -0.74], [0.63, -0.74]]) {
  const rivet = mesh(new THREE.SphereGeometry(0.095, 18, 12), gold, shieldGroup);
  rivet.position.set(x, y, 0.25);
}

const shieldHandle = roundedBox(0.27, 1.15, 0.23, 0.08, leather, 0, 0.05, -0.26, shieldGroup);
shieldHandle.rotation.z = 0.12;

knight.traverse(object => {
  if (object.isMesh) {
    object.castShadow = true;
    object.receiveShadow = true;
  }
});

const contactShadow = new THREE.Mesh(
  new THREE.CircleGeometry(3.05, 64),
  new THREE.MeshBasicMaterial({
    color: 0x26323d,
    transparent: true,
    opacity: 0.14,
    depthWrite: false
  })
);
contactShadow.rotation.x = -Math.PI / 2;
contactShadow.position.y = -0.045;
contactShadow.scale.set(1, 0.58, 1);
scene.add(contactShadow);

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  plume.rotation.z = Math.sin(elapsed * 1.35) * 0.018;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
