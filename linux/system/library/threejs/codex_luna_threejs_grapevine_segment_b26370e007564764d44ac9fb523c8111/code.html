<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural Grapevine</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10150f}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x11170f);
scene.fog = new THREE.Fog(0x11170f, 8, 18);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.3, 3.8, 7.3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.target.set(0, 1.7, 0);

const vine = new THREE.Group();
scene.add(vine);

const barkMat = new THREE.MeshStandardMaterial({
  color: 0x513b26,
  roughness: 0.92,
  metalness: 0
});
const barkLightMat = new THREE.MeshStandardMaterial({
  color: 0x806044,
  roughness: 0.88
});
const barkDarkMat = new THREE.MeshStandardMaterial({
  color: 0x302218,
  roughness: 0.95
});
const youngStemMat = new THREE.MeshStandardMaterial({
  color: 0x586b38,
  roughness: 0.82
});

function makeTube(points, radius, material, tubularSegments = 28, radialSegments = 9) {
  const curve = new THREE.CatmullRomCurve3(points);
  const geometry = new THREE.TubeGeometry(curve, tubularSegments, radius, radialSegments, false);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  vine.add(mesh);
  return mesh;
}

const trunkPoints = [
  new THREE.Vector3(-0.45, -1.7, 0.08),
  new THREE.Vector3(-0.38, -0.95, -0.02),
  new THREE.Vector3(-0.05, -0.25, 0.16),
  new THREE.Vector3(0.18, 0.5, -0.04),
  new THREE.Vector3(0.00, 1.18, 0.12),
  new THREE.Vector3(0.28, 1.83, -0.05),
  new THREE.Vector3(0.12, 2.55, 0.11),
  new THREE.Vector3(0.42, 3.14, 0.03),
  new THREE.Vector3(0.25, 3.68, 0.18)
];
makeTube(trunkPoints, 0.235, barkMat, 64, 14);

const trunkRidgeA = [
  new THREE.Vector3(-0.53, -1.45, 0.19),
  new THREE.Vector3(-0.45, -0.66, 0.18),
  new THREE.Vector3(-0.13, 0.08, 0.28),
  new THREE.Vector3(0.13, 0.81, 0.15),
  new THREE.Vector3(-0.02, 1.48, 0.29),
  new THREE.Vector3(0.22, 2.15, 0.14),
  new THREE.Vector3(0.16, 2.82, 0.27),
  new THREE.Vector3(0.31, 3.43, 0.23)
];
makeTube(trunkRidgeA, 0.035, barkLightMat, 42, 5);

const trunkRidgeB = [
  new THREE.Vector3(-0.28, -1.55, -0.18),
  new THREE.Vector3(-0.20, -0.85, -0.22),
  new THREE.Vector3(0.06, -0.08, -0.12),
  new THREE.Vector3(0.26, 0.63, -0.19),
  new THREE.Vector3(0.13, 1.37, -0.13),
  new THREE.Vector3(0.40, 2.08, -0.17),
  new THREE.Vector3(0.25, 2.72, -0.11),
  new THREE.Vector3(0.49, 3.28, -0.08)
];
makeTube(trunkRidgeB, 0.025, barkDarkMat, 42, 5);

const branchSpecs = [
  {
    points: [new THREE.Vector3(-0.12,0.58,0),new THREE.Vector3(-0.72,0.94,0.12),new THREE.Vector3(-1.35,1.12,0.02),new THREE.Vector3(-1.86,1.48,0.22)],
    r:0.11
  },
  {
    points: [new THREE.Vector3(0.18,1.35,0.02),new THREE.Vector3(0.74,1.64,-0.06),new THREE.Vector3(1.25,1.94,0.08),new THREE.Vector3(1.76,2.05,-0.05)],
    r:0.105
  },
  {
    points: [new THREE.Vector3(0.20,2.08,0.04),new THREE.Vector3(-0.42,2.30,0.18),new THREE.Vector3(-0.96,2.65,0.08),new THREE.Vector3(-1.36,2.95,0.21)],
    r:0.09
  },
  {
    points: [new THREE.Vector3(0.27,2.76,0.05),new THREE.Vector3(0.78,3.00,-0.02),new THREE.Vector3(1.19,3.34,0.13),new THREE.Vector3(1.47,3.70,0.03)],
    r:0.075
  }
];

for (const branch of branchSpecs) {
  makeTube(branch.points, branch.r, barkMat, 34, 9);
  const highlight = branch.points.map((p, i) => p.clone().add(new THREE.Vector3(0.02, 0.018, 0.02)));
  makeTube(highlight, branch.r * 0.19, barkLightMat, 30, 5);
}

function makePeelingStrip(points, width, material) {
  const curve = new THREE.CatmullRomCurve3(points);
  const geometry = new THREE.TubeGeometry(curve, 24, width, 5, false);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  vine.add(mesh);
}

makePeelingStrip([
  new THREE.Vector3(-0.49,-0.95,0.20),
  new THREE.Vector3(-0.34,-0.50,0.27),
  new THREE.Vector3(-0.16,-0.08,0.31),
  new THREE.Vector3(-0.21,0.30,0.27)
], 0.06, barkLightMat);

makePeelingStrip([
  new THREE.Vector3(0.20,0.82,-0.20),
  new THREE.Vector3(0.36,1.12,-0.26),
  new THREE.Vector3(0.27,1.45,-0.24),
  new THREE.Vector3(0.42,1.73,-0.17)
], 0.052, barkDarkMat);

makePeelingStrip([
  new THREE.Vector3(0.18,2.23,0.23),
  new THREE.Vector3(0.02,2.46,0.28),
  new THREE.Vector3(0.14,2.75,0.31)
], 0.044, barkLightMat);

function addTendril(points, radius = 0.018, color = 0x6a7d3e) {
  const material = new THREE.MeshStandardMaterial({
    color,
    roughness: 0.78
  });
  const curve = new THREE.CatmullRomCurve3(points);
  const geometry = new THREE.TubeGeometry(curve, 42, radius, 6, false);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  vine.add(mesh);
}

addTendril([
  new THREE.Vector3(-1.28,1.12,0.03),
  new THREE.Vector3(-1.62,1.04,0.11),
  new THREE.Vector3(-1.92,0.83,0.06),
  new THREE.Vector3(-2.02,0.52,0.16),
  new THREE.Vector3(-1.88,0.31,0.22),
  new THREE.Vector3(-1.58,0.35,0.17),
  new THREE.Vector3(-1.48,0.58,0.10),
  new THREE.Vector3(-1.62,0.72,0.03)
], 0.021);

addTendril([
  new THREE.Vector3(1.22,1.94,0.08),
  new THREE.Vector3(1.55,1.82,0.18),
  new THREE.Vector3(1.82,1.60,0.12),
  new THREE.Vector3(1.93,1.31,0.22),
  new THREE.Vector3(1.78,1.10,0.28),
  new THREE.Vector3(1.52,1.16,0.20),
  new THREE.Vector3(1.46,1.39,0.10),
  new THREE.Vector3(1.63,1.50,0.04)
], 0.019);

addTendril([
  new THREE.Vector3(-0.89,2.63,0.10),
  new THREE.Vector3(-1.12,2.46,0.25),
  new THREE.Vector3(-1.30,2.20,0.26),
  new THREE.Vector3(-1.25,1.98,0.18),
  new THREE.Vector3(-1.04,1.89,0.11),
  new THREE.Vector3(-0.88,2.03,0.04)
], 0.017);

const leafMaterials = [
  new THREE.MeshStandardMaterial({ color: 0x5c762e, roughness: 0.82, side: THREE.DoubleSide }),
  new THREE.MeshStandardMaterial({ color: 0x789342, roughness: 0.8, side: THREE.DoubleSide }),
  new THREE.MeshStandardMaterial({ color: 0x9a9c43, roughness: 0.84, side: THREE.DoubleSide }),
  new THREE.MeshStandardMaterial({ color: 0x3f632d, roughness: 0.84, side: THREE.DoubleSide })
];
const veinMaterial = new THREE.LineBasicMaterial({ color: 0xb2ad5a, transparent: true, opacity: 0.72 });

function createLeaf(position, direction, scale, rotation, materialIndex) {
  const group = new THREE.Group();
  group.position.copy(position);

  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.lineTo(0.17, 0.12);
  shape.lineTo(0.45, 0.19);
  shape.lineTo(0.31, 0.38);
  shape.lineTo(0.64, 0.51);
  shape.lineTo(0.40, 0.70);
  shape.lineTo(0.70, 0.84);
  shape.lineTo(0.44, 1.03);
  shape.lineTo(0.58, 1.25);
  shape.lineTo(0.25, 1.39);
  shape.lineTo(0, 1.60);
  shape.lineTo(-0.25, 1.39);
  shape.lineTo(-0.58, 1.25);
  shape.lineTo(-0.44, 1.03);
  shape.lineTo(-0.70, 0.84);
  shape.lineTo(-0.40, 0.70);
  shape.lineTo(-0.64, 0.51);
  shape.lineTo(-0.31, 0.38);
  shape.lineTo(-0.45, 0.19);
  shape.lineTo(-0.17, 0.12);
  shape.closePath();

  const geometry = new THREE.ShapeGeometry(shape, 2);
  const positions = geometry.attributes.position;
  for (let i = 0; i < positions.count; i++) {
    const x = positions.getX(i);
    const y = positions.getY(i);
    positions.setZ(i, 0.035 * Math.sin(y * 4.2) * (1 - Math.min(1, Math.abs(x) * 1.4)));
  }
  positions.needsUpdate = true;
  geometry.computeVertexNormals();

  const leaf = new THREE.Mesh(geometry, leafMaterials[materialIndex % leafMaterials.length]);
  leaf.scale.setScalar(scale);
  leaf.rotation.z = rotation;
  leaf.castShadow = true;
  leaf.receiveShadow = true;
  group.add(leaf);

  const axis = new THREE.Vector3(0, 1, 0);
  const target = direction.clone().normalize();
  group.quaternion.setFromUnitVectors(axis, target);

  const veinPoints = [];
  veinPoints.push(new THREE.Vector3(0, 0.03, 0.055), new THREE.Vector3(0, 1.53, 0.055));
  const veinGeometry = new THREE.BufferGeometry().setFromPoints(veinPoints);
  const centralVein = new THREE.Line(veinGeometry, veinMaterial);
  centralVein.scale.setScalar(scale);
  centralVein.rotation.z = rotation;
  group.add(centralVein);

  const branchVeinData = [
    [-0.42,0.47,-0.17,0.58],
    [0.42,0.47,0.17,0.58],
    [-0.48,0.78,-0.20,0.88],
    [0.48,0.78,0.20,0.88],
    [-0.35,1.08,-0.14,1.20],
    [0.35,1.08,0.14,1.20]
  ];
  for (const vein of branchVeinData) {
    const branchGeometry = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, vein[1], 0.052),
      new THREE.Vector3(vein[0], vein[1], 0.052),
      new THREE.Vector3(vein[2], vein[3], 0.052)
    ]);
    const branchLine = new THREE.Line(branchGeometry, veinMaterial);
    branchLine.scale.setScalar(scale);
    branchLine.rotation.z = rotation;
    group.add(branchLine);
  }

  vine.add(group);
}

createLeaf(new THREE.Vector3(-1.28,1.12,0.12), new THREE.Vector3(-0.65,0.36,0.25), 1.08, -0.16, 1);
createLeaf(new THREE.Vector3(1.18,1.92,0.04), new THREE.Vector3(0.48,0.75,-0.05), 1.14, 0.18, 0);
createLeaf(new THREE.Vector3(-0.93,2.65,0.14), new THREE.Vector3(-0.30,0.92,0.12), 0.96, -0.24, 2);
createLeaf(new THREE.Vector3(1.42,3.32,0.08), new THREE.Vector3(0.45,0.88,0.18), 0.82, 0.28, 3);
createLeaf(new THREE.Vector3(-0.68,0.88,0.17), new THREE.Vector3(-0.78,-0.05,0.20), 0.72, 0.35, 3);
createLeaf(new THREE.Vector3(0.66,2.97,-0.06), new THREE.Vector3(0.12,0.98,-0.22), 0.68, -0.20, 1);

const grapeStemMat = new THREE.MeshStandardMaterial({ color: 0x4b5a28, roughness: 0.86 });
addTendril([
  new THREE.Vector3(1.72,2.05,-0.05),
  new THREE.Vector3(1.90,1.76,-0.02),
  new THREE.Vector3(1.87,1.48,0.02),
  new THREE.Vector3(1.74,1.28,0.05)
], 0.027, 0x4b5a28);

const grapeTop = new THREE.Vector3(1.74,1.30,0.05);
makeTube([
  grapeTop.clone(),
  new THREE.Vector3(1.73,1.06,0.06),
  new THREE.Vector3(1.78,0.86,0.04)
], 0.035, grapeStemMat, 20, 6);

const grapeColors = [0x4e285c,0x63336b,0x742f63,0x45234e];
const grapeMats = grapeColors.map(color => new THREE.MeshStandardMaterial({
  color,
  roughness: 0.46,
  metalness: 0.03
}));

const grapePositions = [
  [1.78,0.72,0.04],
  [1.60,0.77,0.00],
  [1.96,0.78,0.02],
  [1.49,0.57,0.03],
  [1.72,0.53,0.05],
  [1.96,0.56,0.03],
  [2.12,0.59,0.01],
  [1.58,0.32,0.05],
  [1.82,0.34,0.02],
  [2.04,0.35,0.04],
  [1.72,0.12,0.07],
  [1.91,0.16,0.04]
];

for (let i = 0; i < grapePositions.length; i++) {
  const p = grapePositions[i];
  const radius = i < 3 ? 0.145 : (i < 7 ? 0.16 : 0.15);
  const grape = new THREE.Mesh(new THREE.SphereGeometry(radius, 20, 14), grapeMats[i % grapeMats.length]);
  grape.position.set(p[0], p[1], p[2]);
  grape.scale.set(1, 1.05, 0.95);
  grape.castShadow = true;
  grape.receiveShadow = true;
  vine.add(grape);
}

const berryHighlight = new THREE.MeshStandardMaterial({
  color: 0xb281aa,
  roughness: 0.34,
  transparent: true,
  opacity: 0.55
});
for (const p of [[1.60,0.78,0.14],[1.72,0.53,0.18],[1.82,0.34,0.17],[1.72,0.12,0.18]]) {
  const glint = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 6), berryHighlight);
  glint.position.set(p[0], p[1], p[2]);
  vine.add(glint);
}

const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0x1b2416,
  roughness: 1
});
const ground = new THREE.Mesh(new THREE.CircleGeometry(6, 64), groundMaterial);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.94;
ground.receiveShadow = true;
scene.add(ground);

const hemi = new THREE.HemisphereLight(0xb9c99e, 0x1d2516, 2.0);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffe4b5, 3.0);
key.position.set(-4, 7, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 6;
key.shadow.camera.bottom = -4;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 20;
scene.add(key);

const rim = new THREE.PointLight(0x8aa8ff, 1.8, 9, 2);
rim.position.set(3.5, 4.5, -3.5);
scene.add(rim);

const warmFill = new THREE.PointLight(0xd99555, 0.7, 7, 2);
warmFill.position.set(-3, 1.5, 3);
scene.add(warmFill);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
</body>
</html>
