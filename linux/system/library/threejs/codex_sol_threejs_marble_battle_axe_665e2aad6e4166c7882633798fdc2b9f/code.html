<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marble Ceremonial Battle Axe</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #15171a;
}
canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17191d);
scene.fog = new THREE.FogExp2(0x17191d, 0.035);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.4, 3.5, 7.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.55, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 5;
controls.maxDistance = 13;
controls.maxPolarAngle = Math.PI * 0.76;

const marble = new THREE.MeshStandardMaterial({
  color: 0xb7b9b8,
  roughness: 0.27,
  metalness: 0.04
});

marble.onBeforeCompile = shader => {
  shader.vertexShader = shader.vertexShader
    .replace(
      '#include <common>',
      `#include <common>
       varying vec3 vMarblePos;
       varying vec3 vMarbleNormal;`
    )
    .replace(
      '#include <worldpos_vertex>',
      `#include <worldpos_vertex>
       vMarblePos = (modelMatrix * vec4(transformed, 1.0)).xyz;
       vMarbleNormal = normalize(mat3(modelMatrix) * objectNormal);`
    );

  shader.fragmentShader = shader.fragmentShader
    .replace(
      '#include <common>',
      `#include <common>
       varying vec3 vMarblePos;
       varying vec3 vMarbleNormal;

       float marbleHash(vec3 p) {
         p = fract(p * 0.3183099 + vec3(0.11, 0.17, 0.23));
         p *= 17.0;
         return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
       }

       float marbleNoise(vec3 p) {
         vec3 i = floor(p);
         vec3 f = fract(p);
         f = f * f * (3.0 - 2.0 * f);
         return mix(
           mix(mix(marbleHash(i), marbleHash(i + vec3(1,0,0)), f.x),
               mix(marbleHash(i + vec3(0,1,0)), marbleHash(i + vec3(1,1,0)), f.x), f.y),
           mix(mix(marbleHash(i + vec3(0,0,1)), marbleHash(i + vec3(1,0,1)), f.x),
               mix(marbleHash(i + vec3(0,1,1)), marbleHash(i + vec3(1,1,1)), f.x), f.y),
           f.z
         );
       }

       float marbleFbm(vec3 p) {
         float sum = 0.0;
         float amp = 0.52;
         for (int i = 0; i < 5; i++) {
           sum += amp * marbleNoise(p);
           p = p * 2.03 + vec3(1.7, 2.9, 4.1);
           amp *= 0.5;
         }
         return sum;
       }`
    )
    .replace(
      '#include <color_fragment>',
      `#include <color_fragment>
       vec3 p = vMarblePos;
       float warpA = marbleFbm(p * 0.92);
       float warpB = marbleFbm(p * 1.75 + vec3(7.4, 1.2, 3.8));
       float strata = p.y * 2.65 + p.x * 0.72 + p.z * 1.45;
       float wave = sin(strata + warpA * 8.5 + sin(p.x * 3.2) * 0.7);
       float fineWave = sin(strata * 2.2 + warpB * 10.0);
       float broadVein = 1.0 - smoothstep(0.04, 0.22, abs(wave));
       float fineVein = 1.0 - smoothstep(0.025, 0.11, abs(fineWave));
       float mottling = marbleFbm(p * 2.15);
       vec3 baseStone = mix(vec3(0.57, 0.59, 0.59), vec3(0.78, 0.79, 0.77), mottling);
       vec3 veinStone = vec3(0.23, 0.27, 0.29);
       vec3 warmVein = vec3(0.46, 0.43, 0.39);
       baseStone = mix(baseStone, warmVein, fineVein * 0.13);
       baseStone = mix(baseStone, veinStone, broadVein * (0.26 + warpB * 0.34));
       float facing = pow(1.0 - abs(dot(normalize(vMarbleNormal), vec3(0.0, 0.0, 1.0))), 3.0);
       baseStone += facing * 0.035;
       diffuseColor.rgb *= baseStone;`
    );
};

const darkMarble = marble.clone();
darkMarble.color.set(0x747779);
darkMarble.roughness = 0.34;

const axe = new THREE.Group();
axe.rotation.z = -0.025;
scene.add(axe);

function prepareGeometry(geometry) {
  geometry.computeVertexNormals();
  return geometry;
}

function addMesh(geometry, material = marble, cast = true) {
  const mesh = new THREE.Mesh(prepareGeometry(geometry), material);
  mesh.castShadow = cast;
  mesh.receiveShadow = true;
  axe.add(mesh);
  return mesh;
}

function makeBlade(side) {
  const s = side;
  const shape = new THREE.Shape();
  shape.moveTo(s * 0.18, 1.82);
  shape.bezierCurveTo(s * 0.42, 2.02, s * 0.80, 2.28, s * 1.42, 2.36);
  shape.bezierCurveTo(s * 1.70, 2.39, s * 1.92, 2.32, s * 2.08, 2.18);
  shape.bezierCurveTo(s * 1.82, 1.89, s * 1.72, 1.50, s * 1.94, 1.11);
  shape.bezierCurveTo(s * 1.69, 0.99, s * 1.42, 0.98, s * 1.12, 1.08);
  shape.bezierCurveTo(s * 0.68, 1.21, s * 0.38, 1.42, s * 0.18, 1.58);
  shape.lineTo(s * 0.18, 1.82);

  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: 0.28,
    bevelEnabled: true,
    bevelThickness: 0.075,
    bevelSize: 0.075,
    bevelSegments: 5,
    curveSegments: 32
  });
  geometry.translate(0, 0, -0.14);
  return addMesh(geometry);
}

makeBlade(1);
makeBlade(-1);

const coreShape = new THREE.Shape();
coreShape.moveTo(-0.31, 1.28);
coreShape.bezierCurveTo(-0.37, 1.48, -0.36, 1.98, -0.27, 2.12);
coreShape.bezierCurveTo(-0.14, 2.29, 0.14, 2.29, 0.27, 2.12);
coreShape.bezierCurveTo(0.36, 1.98, 0.37, 1.48, 0.31, 1.28);
coreShape.lineTo(0.20, 1.14);
coreShape.lineTo(-0.20, 1.14);
coreShape.closePath();

const coreGeo = new THREE.ExtrudeGeometry(coreShape, {
  depth: 0.40,
  bevelEnabled: true,
  bevelThickness: 0.07,
  bevelSize: 0.065,
  bevelSegments: 5,
  curveSegments: 20
});
coreGeo.translate(0, 0, -0.20);
addMesh(coreGeo);

function lathe(points, segments = 48) {
  return new THREE.LatheGeometry(points.map(p => new THREE.Vector2(p[0], p[1])), segments);
}

const haftProfile = [
  [0.00, -2.45],
  [0.14, -2.42],
  [0.21, -2.31],
  [0.22, -2.18],
  [0.17, -2.08],
  [0.145, -1.90],
  [0.135, -1.25],
  [0.15, -0.55],
  [0.14, 0.18],
  [0.16, 0.82],
  [0.19, 1.23],
  [0.00, 1.35]
];
addMesh(lathe(haftProfile, 64));

function addBand(y, radius, height, material = marble) {
  const band = addMesh(new THREE.CylinderGeometry(radius, radius, height, 48, 1, false), material);
  band.position.y = y;
  return band;
}

addBand(1.13, 0.255, 0.18);
addBand(0.84, 0.192, 0.095);
addBand(-1.72, 0.175, 0.095);
addBand(-2.08, 0.215, 0.13);
addBand(-2.31, 0.245, 0.10);

const pommel = addMesh(new THREE.SphereGeometry(0.245, 48, 24));
pommel.scale.set(1, 0.74, 1);
pommel.position.y = -2.43;

function tubeFromPoints(points, radius, material = darkMarble, tubularSegments = 80) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
  return addMesh(new THREE.TubeGeometry(curve, tubularSegments, radius, 10, false), material);
}

for (const z of [0.153, -0.153]) {
  const zLift = z > 0 ? 0.012 : -0.012;
  tubeFromPoints([
    new THREE.Vector3(-0.105, 0.92, z + zLift),
    new THREE.Vector3(0.105, 0.68, z + zLift),
    new THREE.Vector3(-0.105, 0.42, z + zLift),
    new THREE.Vector3(0.105, 0.16, z + zLift),
    new THREE.Vector3(-0.105, -0.12, z + zLift),
    new THREE.Vector3(0.105, -0.40, z + zLift),
    new THREE.Vector3(-0.105, -0.69, z + zLift),
    new THREE.Vector3(0.105, -0.98, z + zLift),
    new THREE.Vector3(-0.105, -1.27, z + zLift),
    new THREE.Vector3(0.10, -1.56, z + zLift)
  ], 0.027, darkMarble, 120);

  tubeFromPoints([
    new THREE.Vector3(0.105, 0.92, z + zLift),
    new THREE.Vector3(-0.105, 0.68, z + zLift),
    new THREE.Vector3(0.105, 0.42, z + zLift),
    new THREE.Vector3(-0.105, 0.16, z + zLift),
    new THREE.Vector3(0.105, -0.12, z + zLift),
    new THREE.Vector3(-0.105, -0.40, z + zLift),
    new THREE.Vector3(0.105, -0.69, z + zLift),
    new THREE.Vector3(-0.105, -0.98, z + zLift),
    new THREE.Vector3(0.105, -1.27, z + zLift),
    new THREE.Vector3(-0.10, -1.56, z + zLift)
  ], 0.027, darkMarble, 120);
}

function bladeRelief(side, z) {
  const s = side;
  tubeFromPoints([
    new THREE.Vector3(s * 0.32, 1.75, z),
    new THREE.Vector3(s * 0.72, 2.05, z),
    new THREE.Vector3(s * 1.28, 2.18, z),
    new THREE.Vector3(s * 1.72, 2.16, z)
  ], 0.025, darkMarble, 72);

  tubeFromPoints([
    new THREE.Vector3(s * 0.34, 1.60, z),
    new THREE.Vector3(s * 0.74, 1.40, z),
    new THREE.Vector3(s * 1.23, 1.23, z),
    new THREE.Vector3(s * 1.62, 1.23, z)
  ], 0.025, darkMarble, 72);

  tubeFromPoints([
    new THREE.Vector3(s * 0.56, 1.75, z),
    new THREE.Vector3(s * 0.84, 1.96, z),
    new THREE.Vector3(s * 1.10, 1.75, z),
    new THREE.Vector3(s * 0.84, 1.50, z),
    new THREE.Vector3(s * 0.56, 1.75, z)
  ], 0.031, darkMarble, 84);

  tubeFromPoints([
    new THREE.Vector3(s * 1.03, 1.77, z),
    new THREE.Vector3(s * 1.29, 1.98, z),
    new THREE.Vector3(s * 1.53, 1.76, z),
    new THREE.Vector3(s * 1.28, 1.49, z),
    new THREE.Vector3(s * 1.03, 1.77, z)
  ], 0.031, darkMarble, 84);
}

bladeRelief(1, 0.223);
bladeRelief(-1, 0.223);
bladeRelief(1, -0.223);
bladeRelief(-1, -0.223);

const medallionFront = addMesh(new THREE.TorusGeometry(0.185, 0.035, 12, 48), darkMarble);
medallionFront.position.set(0, 1.74, 0.245);
const medallionBack = medallionFront.clone();
medallionBack.position.z = -0.245;
axe.add(medallionBack);

const gemFront = addMesh(new THREE.SphereGeometry(0.102, 32, 16), marble);
gemFront.scale.z = 0.35;
gemFront.position.set(0, 1.74, 0.245);
const gemBack = gemFront.clone();
gemBack.position.z = -0.245;
axe.add(gemBack);

const edgeMaterial = marble.clone();
edgeMaterial.color.set(0xe0e0dc);
edgeMaterial.roughness = 0.19;

for (const side of [-1, 1]) {
  const s = side;
  tubeFromPoints([
    new THREE.Vector3(s * 2.04, 2.16, 0),
    new THREE.Vector3(s * 1.87, 1.91, 0),
    new THREE.Vector3(s * 1.77, 1.61, 0),
    new THREE.Vector3(s * 1.84, 1.31, 0),
    new THREE.Vector3(s * 1.94, 1.12, 0)
  ], 0.036, edgeMaterial, 70);
}

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0x25272a,
  roughness: 0.9,
  metalness: 0
});
const floor = new THREE.Mesh(new THREE.CircleGeometry(7, 96), floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -2.65;
floor.receiveShadow = true;
scene.add(floor);

const ambient = new THREE.HemisphereLight(0xbfc9d8, 0x25201c, 1.45);
scene.add(ambient);

const key = new THREE.DirectionalLight(0xfff1df, 4.1);
key.position.set(-4.5, 7.5, 5.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 6;
key.shadow.camera.bottom = -6;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 20;
key.shadow.bias = -0.00015;
key.shadow.normalBias = 0.035;
scene.add(key);

const fill = new THREE.DirectionalLight(0xaac9ff, 1.75);
fill.position.set(5, 2.5, 4);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xd7c3ff, 2.3);
rim.position.set(2, 4, -6);
scene.add(rim);

const warmBounce = new THREE.PointLight(0xffc994, 1.2, 9, 2);
warmBounce.position.set(-3.2, -1.2, 3.2);
scene.add(warmBounce);

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
}
addEventListener('resize', resize);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  warmBounce.intensity = 1.12 + Math.sin(t * 0.7) * 0.08;
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
