<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let seed = 817263;
function rand(){
  seed |= 0;
  seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
const rr=(a,b)=>a+(b-a)*rand();
const pick=a=>a[Math.floor(rand()*a.length)];

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9097ad);
scene.fog=new THREE.FogExp2(0x788295,0.014);

const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,180);
camera.position.set(20,12.5,25);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,4,-5);
controls.enableDamping=true;
controls.dampingFactor=.045;
controls.autoRotate=true;
controls.autoRotateSpeed=.24;
controls.minDistance=12;
controls.maxDistance=48;
controls.maxPolarAngle=Math.PI*.48;

function canvasTexture(size,paint,repeatX=1,repeatY=1){
  const c=document.createElement('canvas');
  c.width=c.height=size;
  const x=c.getContext('2d');
  paint(x,size);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(repeatX,repeatY);
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return t;
}

const cobbleTex=canvasTexture(512,(g,s)=>{
  g.fillStyle='#706e70';g.fillRect(0,0,s,s);
  const rows=12,h=s/rows;
  for(let y=-1;y<rows+1;y++){
    const off=(y&1)*s/24;
    for(let x=-1;x<13;x++){
      const w=s/12-3;
      const xx=x*s/12+off;
      const yy=y*h;
      const q=85+Math.floor(rr(-16,18));
      g.fillStyle=`rgb(${q},${q-2},${q-1})`;
      g.beginPath();
      g.roundRect(xx+2,yy+2,w,h-4,7);
      g.fill();
      g.strokeStyle='rgba(34,31,35,.55)';
      g.lineWidth=3;g.stroke();
      g.strokeStyle='rgba(220,215,202,.12)';
      g.lineWidth=1;
      g.beginPath();g.moveTo(xx+7,yy+6);g.lineTo(xx+w-3,yy+5);g.stroke();
    }
  }
},3,14);

const pavementTex=canvasTexture(256,(g,s)=>{
  g.fillStyle='#9b9488';g.fillRect(0,0,s,s);
  for(let i=0;i<180;i++){
    const q=Math.floor(rr(100,180));
    g.fillStyle=`rgba(${q},${q},${q},${rr(.05,.2)})`;
    g.fillRect(rr(0,s),rr(0,s),rr(1,4),rr(1,4));
  }
  g.strokeStyle='rgba(55,50,46,.35)';g.lineWidth=4;
  for(let i=0;i<=4;i++){
    g.beginPath();g.moveTo(0,i*s/4);g.lineTo(s,i*s/4);g.stroke();
  }
},2,12);

const plasterTex=canvasTexture(256,(g,s)=>{
  g.fillStyle='#d8cab3';g.fillRect(0,0,s,s);
  for(let i=0;i<700;i++){
    const a=rr(.015,.07);
    g.fillStyle=`rgba(70,55,42,${a})`;
    g.fillRect(rr(0,s),rr(0,s),rr(1,3),rr(1,3));
  }
},2,3);

const roofTex=canvasTexture(256,(g,s)=>{
  g.fillStyle='#6a4039';g.fillRect(0,0,s,s);
  for(let y=0;y<10;y++)for(let x=-1;x<9;x++){
    const xx=x*34+(y&1)*17,yy=y*27;
    g.fillStyle=pick(['#79483e','#874f43','#663c36']);
    g.fillRect(xx+2,yy+2,31,24);
    g.strokeStyle='#422c2a';g.strokeRect(xx+2,yy+2,31,24);
  }
},3,2);

function mat(color,rough=.72,metal=.05,emissive=0,intensity=0){
  return new THREE.MeshStandardMaterial({
    color,roughness:rough,metalness:metal,
    emissive,emissiveIntensity:intensity
  });
}
const dark=mat(0x24252a,.45,.5);
const iron=mat(0x17191d,.36,.75);
const brass=mat(0x8d6935,.3,.75);
const cream=mat(0xe7d5ae,.68,.03);
const red=mat(0x8d2925,.56,.08);
const warm=mat(0xffd085,.5,0,0xffa84d,2.2);
const glass=new THREE.MeshPhysicalMaterial({
  color:0x7692a0,roughness:.16,metalness:.05,
  transmission:.2,transparent:true,opacity:.58
});

function mesh(geo,material,parent=scene,cast=true,receive=true){
  const o=new THREE.Mesh(geo,material);
  o.castShadow=cast;o.receiveShadow=receive;
  parent.add(o);return o;
}
function box(w,h,d,material,parent=scene,x=0,y=0,z=0){
  const o=mesh(new THREE.BoxGeometry(w,h,d),material,parent);
  o.position.set(x,y,z);return o;
}
function cyl(r1,r2,h,material,parent=scene,x=0,y=0,z=0,segments=12){
  const o=mesh(new THREE.CylinderGeometry(r1,r2,h,segments),material,parent);
  o.position.set(x,y,z);return o;
}
function sphere(r,material,parent=scene,x=0,y=0,z=0,sx=1,sy=1,sz=1){
  const o=mesh(new THREE.SphereGeometry(r,16,10),material,parent);
  o.position.set(x,y,z);o.scale.set(sx,sy,sz);return o;
}
function lineTube(points,r,material,parent=scene){
  const curve=new THREE.CatmullRomCurve3(points);
  return mesh(new THREE.TubeGeometry(curve,32,r,6,false),material,parent);
}

const hemi=new THREE.HemisphereLight(0xb8c9e3,0x514032,1.55);
scene.add(hemi);

const sun=new THREE.DirectionalLight(0xffc990,3.1);
sun.position.set(-22,30,20);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-32;
sun.shadow.camera.right=32;
sun.shadow.camera.top=36;
sun.shadow.camera.bottom=-36;
sun.shadow.camera.near=1;
sun.shadow.camera.far=90;
sun.shadow.bias=-.00025;
scene.add(sun);

const skyGeo=new THREE.SphereGeometry(100,32,16);
const skyMat=new THREE.ShaderMaterial({
  side:THREE.BackSide,
  uniforms:{
    top:{value:new THREE.Color(0x394664)},
    middle:{value:new THREE.Color(0xc48b79)},
    bottom:{value:new THREE.Color(0xf1bf8d)}
  },
  vertexShader:`varying vec3 v;void main(){v=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 v;uniform vec3 top,middle,bottom;
  void main(){float h=normalize(v).y;vec3 c=mix(bottom,middle,smoothstep(-.18,.18,h));
  c=mix(c,top,smoothstep(.12,.82,h));gl_FragColor=vec4(c,1.);}`
});
scene.add(new THREE.Mesh(skyGeo,skyMat));

const groundMat=new THREE.MeshStandardMaterial({
  map:cobbleTex,color:0xb5aea5,roughness:.93,metalness:.02
});
const ground=box(14,.25,74,groundMat,scene,0,-.12,-8);
ground.receiveShadow=true;

const walkMat=new THREE.MeshStandardMaterial({
  map:pavementTex,color:0xc9bbab,roughness:.9
});
box(3.1,.3,74,walkMat,scene,-8.55,.02,-8);
box(3.1,.3,74,walkMat,scene,8.55,.02,-8);

for(const x of [-5.8,5.8]){
  box(.22,.23,74,mat(0x77716a,.85),scene,x,.13,-8);
}

function rail(x){
  const railMat=mat(0x4b4b4b,.22,.9);
  box(.105,.09,74,railMat,scene,x,.17,-8);
  for(let z=-44;z<29;z+=1.7){
    box(.25,.06,.13,mat(0x4a4038,.9),scene,x,.11,z);
  }
}
rail(-1.02);rail(1.02);

function makeWindow(parent,x,y,z,w=1.25,h=1.65,lit=false,side=1){
  const frame=box(w+.18,h+.18,.15,dark,parent,x,y,z);
  const paneMat=lit?warm:glass;
  const pane=box(w,h,.17,paneMat,parent,x,y,z+side*.03);
  box(.08,h,.2,dark,parent,x,y,z+side*.08);
  box(w,.07,.2,dark,parent,x,y,z+side*.08);
  return pane;
}

function awning(parent,x,y,z,w,color,side){
  const group=new THREE.Group();parent.add(group);
  group.position.set(x,y,z);
  const cloth=new THREE.MeshStandardMaterial({
    color,roughness:.8,side:THREE.DoubleSide
  });
  const canopy=box(w,.11,1.45,cloth,group,0,0,side*.63);
  canopy.rotation.x=side*.16;
  for(let i=-2;i<=2;i++){
    box(.12,.13,1.46,cream,group,i*w/5,0.01,side*.63);
  }
  box(w+.1,.34,.08,cloth,group,0,-.18,side*1.33);
  group.userData.canopy=canopy;
  animatedAwnings.push(group);
}

const animatedAwnings=[];
const facadeColors=[0xd2b38d,0xb87968,0x9bad9b,0xd0c79e,0x9ca6b7,0xd6a88c];
const signColors=[0x264a46,0x713838,0x344b68,0x74552f];

function building(side,z,w,h,depth,index){
  const g=new THREE.Group();
  scene.add(g);
  const x=side*(7.15+depth/2);
  const facadeMat=new THREE.MeshStandardMaterial({
    color:facadeColors[index%facadeColors.length],
    map:plasterTex,roughness:.87
  });
  box(depth,h,w,facadeMat,g,x,h/2+.18,z);
  box(depth+.25,.28,w+.24,mat(0x5d4840,.85),g,x,h+.3,z);

  const roof=box(depth+.5,2,w+.55,new THREE.MeshStandardMaterial({
    color:0x8e5a4c,map:roofTex,roughness:.86
  }),g,x,h+1.25,z);
  roof.rotation.z=side*.28;

  const frontX=side*6.98;
  const frontOffset=side>0?-.03:.03;
  const floorCount=Math.max(2,Math.floor((h-2)/2.25));
  for(let f=0;f<floorCount;f++){
    const yy=3.25+f*2.25;
    const cols=Math.max(1,Math.floor(w/2.05));
    for(let c=0;c<cols;c++){
      const zz=z+(c-(cols-1)/2)*(w/(cols));
      const lit=(index+c+f)%3===0;
      const wg=new THREE.Group();g.add(wg);
      wg.rotation.y=side>0?-Math.PI/2:Math.PI/2;
      makeWindow(wg,side*frontX,yy,side*zz,1.05,1.35,lit,side);
    }
  }

  const shop=box(.18,2.25,w*.84,mat(pick(signColors),.68),g,frontX,1.38,z);
  const doorZ=z+w*.24;
  const door=box(.22,2.05,.95,dark,g,frontX-side*.05,1.28,doorZ);
  const doorGlass=box(.24,1.12,.68,glass,g,frontX-side*.08,1.55,doorZ);

  const displayZ=z-w*.14;
  const display=box(.24,1.45,w*.35,dark,g,frontX-side*.06,1.42,displayZ);
  box(.26,1.24,w*.29,warm,g,frontX-side*.1,1.48,displayZ);

  const sign=box(.28,.72,w*.72,mat(pick(signColors),.72),g,frontX-side*.13,2.82,z);
  for(let n=0;n<Math.floor(w*2);n++){
    sphere(.045,brass,g,frontX-side*.31,2.82,z-w*.28+n*.32);
  }

  if(index%2===0)awning(g,frontX-side*.25,2.75,z,w*.8,pick([0x9a3f36,0x3f665e,0xb58745]),-side);

  if(index%3!==1){
    const balconyY=5.1;
    box(1.05,.16,w*.72,mat(0x79736c,.75),g,frontX-side*.52,balconyY,z);
    for(let q=-3;q<=3;q++){
      cyl(.035,.035,.75,iron,g,frontX-side*1.02,balconyY+.42,z+q*w*.09,8)
        .rotation.z=Math.PI/2;
    }
    box(.08,.1,w*.75,iron,g,frontX-side*1.02,balconyY+.82,z);
    const planter=box(.32,.34,w*.48,mat(0x704333,.82),g,frontX-side*1.08,balconyY+.18,z);
    for(let q=0;q<7;q++){
      const pz=z+rr(-w*.2,w*.2);
      sphere(.12,mat(pick([0xb73d4f,0xf1b65e,0xe7ddd0,0x8c4b9e]),.9),g,
        frontX-side*1.28,balconyY+.46,pz,1,1.15,1);
      sphere(.15,mat(0x477047,.9),g,
        frontX-side*1.24,balconyY+.35,pz,1.2,.7,1);
    }
  }

  const chimney=box(.5,1.4,.55,mat(0x68514b,.88),g,x-side*.55,h+2.1,z+w*.22);
  return g;
}

let z=-35,index=0;
while(z<27){
  const w=rr(5.1,7.4);
  const h=rr(8.8,13.5);
  building(-1,z,w,h,rr(3.2,4.4),index++);
  z+=w+.25;
}
z=-36;index=2;
while(z<28){
  const w=rr(5,7);
  const h=rr(9.2,14);
  building(1,z,w,h,rr(3.2,4.5),index++);
  z+=w+.25;
}

function makeTram(){
  const g=new THREE.Group();
  scene.add(g);
  g.position.set(0,.05,-5);

  box(3.65,.48,11.8,dark,g,0,.75,0);
  box(3.72,1.25,11.65,red,g,0,1.45,0);
  box(3.58,2.35,11.45,cream,g,0,3.2,0);
  box(3.72,.62,11.55,red,g,0,4.48,0);
  box(3.5,.25,11.8,dark,g,0,4.94,0);

  const roof=mesh(new THREE.CylinderGeometry(2.02,2.02,11.8,18,1,false,0,Math.PI),
    mat(0x4b514f,.67,.2),g);
  roof.rotation.x=Math.PI/2;
  roof.rotation.z=Math.PI/2;
  roof.scale.y=.28;
  roof.position.y=4.9;

  for(const side of [-1,1]){
    const x=side*1.82;
    for(let i=0;i<6;i++){
      const zz=-4.55+i*1.82;
      box(.08,1.48,1.26,dark,g,x,3.45,zz);
      box(.1,1.25,1.02,warm,g,x+side*.025,3.47,zz);
      box(.12,.08,1.05,dark,g,x+side*.07,3.43,zz);
    }
    box(.1,.14,10.7,brass,g,x+side*.05,2.42,0);
  }

  for(const end of [-1,1]){
    const zz=end*5.82;
    box(3.55,3.65,.16,cream,g,0,3.15,zz);
    box(3.66,.75,.19,red,g,0,1.5,zz+end*.02);
    for(const x of [-1.05,0,1.05]){
      box(.84,1.25,.19,warm,g,x,3.55,zz+end*.05);
    }
    box(2.35,.46,.22,dark,g,0,4.6,zz+end*.08);
    for(const x of [-1.28,1.28]){
      sphere(.24,warm,g,x,1.42,zz+end*.18,1,1,.4);
      sphere(.3,brass,g,x,1.42,zz+end*.13,1,1,.35);
    }
    box(4,.22,.45,dark,g,0,.72,zz+end*.3);
  }

  for(const side of [-1,1])for(const zz of [-3.55,3.55]){
    const wheel=cyl(.56,.56,.28,iron,g,side*1.72,.55,zz,18);
    wheel.rotation.z=Math.PI/2;
    cyl(.23,.23,.33,brass,g,side*1.75,.55,zz,16).rotation.z=Math.PI/2;
  }

  const pantograph=new THREE.Group();g.add(pantograph);
  pantograph.position.y=5.2;
  for(const sx of [-1,1]){
    const a=lineTube([
      new THREE.Vector3(sx*.65,0,-.8),
      new THREE.Vector3(-sx*.35,1.25,0),
      new THREE.Vector3(sx*.55,2.2,.4)
    ],.055,iron,pantograph);
  }
  box(1.65,.08,.12,iron,pantograph,0,2.22,.4);

  for(let i=0;i<5;i++){
    const lamp=new THREE.PointLight(0xffb764,.55,5.5,2);
    lamp.position.set(0,3.75,-3.6+i*1.8);
    g.add(lamp);
  }

  return g;
}
const tram=makeTram();

const lampLights=[];
function streetLamp(x,z){
  const g=new THREE.Group();scene.add(g);
  cyl(.22,.34,.35,iron,g,x,.28,z,12);
  cyl(.09,.13,4.25,iron,g,x,2.48,z,12);
  cyl(.18,.1,.45,iron,g,x,4.72,z,10);
  const cap=mesh(new THREE.ConeGeometry(.52,.35,10),iron,g);
  cap.position.set(x,5.18,z);
  const lantern=box(.72,.88,.72,glass,g,x,4.69,z);
  const glow=sphere(.17,warm,g,x,4.68,z,1,1.2,1);
  const light=new THREE.PointLight(0xffae61,2.3,8,2);
  light.position.set(x,4.7,z);light.castShadow=false;g.add(light);
  lampLights.push({light,glow,phase:rr(0,10)});
}
for(let zz=-31;zz<27;zz+=10){
  streetLamp(-5.15,zz);
  if((Math.floor(zz/10)&1)===0)streetLamp(5.15,zz+4.5);
}

function mailbox(x,z){

  g.position.set(x,0,z);

  top.rotation.x=Math.PI/2;top.rotation.z=Math.PI/2;

mailbox(7.15,6.2);

  cyl(.08,.1,.72,iron,g,0,.38,0,8);

cafeTable(-7.1,7.5);
cafeTable(-7.1,11.2);
cafeTable(7.05,-15);

const pigeons=[];
function pigeon(x,z,rot){
  const g=new THREE.Group();scene.add(g);
  g.position.set(x,.3,z);g.rotation.y=rot;
  const feather=mat(pick([0x626771,0x555d66,0x747177]),.82);
  sphere(.25,feather,g,0,.23,0,1,1.15,1.45);
  sphere(.17,feather,g,0,.48,-.18,1,1,1);
  const beak=mesh(new THREE.ConeGeometry(.055,.18,6),mat(0xc7944f,.8),g);
  beak.rotation.x=-Math.PI/2;beak.position.set(0,.47,-.36);
  const wingL=mesh(new THREE.SphereGeometry(.2,10,6),feather,g);
  wingL.scale.set(.35,.8,1.25);wingL.position.set(-.2,.27,.04);
  const wingR=wingL.clone();wingR.position.x=.2;g.add(wingR);
  for(const xx of [-.07,.07]){
    cyl(.018,.018,.22,mat(0xa45f4b,.8),g,xx,.08,.03,6);
  }
  g.userData={wingL,wingR,phase:rr(0,Math.PI*2)};
  pigeons.push(g);
}
for(let i=0;i<9;i++){
  let x=rr(-4.7,4.7);
  if(Math.abs(x)<1.6)x+=Math.sign(x||1)*1.8;
  pigeon(x,rr(-22,20),rr(0,Math.PI*2));
}

const wireMat=mat(0x24272b,.35,.82);
const catenary=[];
for(const x of [-3.95,3.95]){
  for(let zz=-39;zz<29;zz+=9){
    cyl(.1,.14,8.2,iron,scene,x,4.2,zz,10);
    const arm=box(4.1,.08,.08,iron,scene,x>0?x-2.0:x+2.0,7.8,zz);
    for(const ax of [0,1.95,3.85]){
      cyl(.025,.025,.65,iron,scene,x>0?x-ax:x+ax,7.46,zz,6);
    }
  }
}
for(let zz=-39;zz<29;zz+=9){
  const wire=lineTube([
    new THREE.Vector3(-4,7.65,zz),
    new THREE.Vector3(0,7.3,zz),
    new THREE.Vector3(4,7.65,zz)
  ],.025,wireMat);
  catenary.push(wire);
}
for(const x of [-.42,.32]){
  const pts=[];
  for(let zz=-42;zz<=31;zz+=4.5){
    pts.push(new THREE.Vector3(x,7.35-((Math.floor((zz+42)/4.5)&1)?.16:0),zz));
  }
  catenary.push(lineTube(pts,.035,wireMat));
}
for(let zz=-36;zz<28;zz+=9){
  lineTube([
    new THREE.Vector3(-4,7.7,zz),
    new THREE.Vector3(0,9.1,zz+rr(-.6,.6)),
    new THREE.Vector3(4,7.7,zz)
  ],.018,wireMat);
}

function bollard(x,z){
  cyl(.12,.17,.8,iron,scene,x,.48,z,10);
  sphere(.16,iron,scene,x,.92,z);
}
for(let zz=-28;zz<24;zz+=5.5){
  bollard(-5.65,zz);
  bollard(5.65,zz+2.6);
}

function crate(x,z){
  const g=new THREE.Group();scene.add(g);
  g.position.set(x,.2,z);
  box(1,.7,.75,mat(0x765337,.85),g,0,.35,0);
  for(const xx of [-.44,.44])box(.08,.74,.8,dark,g,xx,.35,0);
  for(let i=0;i<6;i++){
    sphere(.13,mat(pick([0xa64230,0xd49e41,0x718d43]),.9),g,
      rr(-.38,.38),rr(.75,.95),rr(-.27,.27));
  }
}
crate(6.8,18);
crate(-6.9,-17);

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();

  tram.position.y=.05+Math.sin(t*1.05)*.015;

  for(const p of pigeons){
    const ph=p.userData.phase;
    p.position.y=.3+Math.sin(t*2.1+ph)*.025;
    p.userData.wingL.rotation.z=.08+Math.sin(t*1.7+ph)*.08;
    p.userData.wingR.rotation.z=-.08-Math.sin(t*1.7+ph)*.08;
    p.rotation.y+=Math.sin(t*.8+ph)*.00045;
  }

  for(const l of lampLights){
    const flicker=.94+.04*Math.sin(t*6.2+l.phase)+.025*Math.sin(t*17+l.phase);
    l.light.intensity=2.3*flicker;
    l.glow.scale.setScalar(.96+.05*Math.sin(t*4+l.phase));
  }

  for(let i=0;i<animatedAwnings.length;i++){
    const a=animatedAwnings[i];
    a.userData.canopy.rotation.z=Math.sin(t*1.25+i)*.008;
    a.userData.canopy.position.y=Math.sin(t*1.8+i*.7)*.012;
  }

  catenary.forEach((w,i)=>{
    w.rotation.z=Math.sin(t*.45+i*.8)*.0007;
  });

  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
</script>
</body>
</html>
