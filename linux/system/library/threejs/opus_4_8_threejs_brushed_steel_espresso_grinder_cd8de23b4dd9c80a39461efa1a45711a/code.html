<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   Renderer / Scene / Camera
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171a);
scene.fog = new THREE.Fog(0x15171a, 1.05, 3.2);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.01, 100);
camera.position.set(0.40, 0.30, 0.52);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.minDistance = 0.28;
controls.maxDistance = 1.6;
controls.target.set(0, 0.115, 0);
controls.maxPolarAngle = Math.PI * 0.52;

/* ============================================================
   Procedural textures  (brushed grain, knurl, walnut)
   ============================================================ */

// --- tiny deterministic value-noise helpers -----------------
function hash2(x, y) {
  let h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return h - Math.floor(h);
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi);
  const c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function fbm(x, y, oct) {
  let s = 0, amp = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { s += amp * vnoise(x * f, y * f); f *= 2.03; amp *= 0.5; }
  return s;
}

/**
 * Circumferential brushed grain: fine streaks running AROUND the cylinder.
 * On a lathe-turned body UVs run u = around, v = up, so the streaks are
 * strongly stretched in u and tightly banded in v.
 */
function makeBrushedMaps(w = 1024, h = 1024, opts = {}) {
  const streakDensity = opts.streakDensity ?? 340;
  const contrast      = opts.contrast ?? 1.0;

  const cRough = document.createElement('canvas'); cRough.width = w; cRough.height = h;
  const cNorm  = document.createElement('canvas'); cNorm.width = w; cNorm.height = h;
  const gR = cRough.getContext('2d');
  const gN = cNorm.getContext('2d');
  const imgR = gR.createImageData(w, h);
  const imgN = gN.createImageData(w, h);

  // height field first (grain), then derive roughness + normal
  const height = new Float32Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const u = x / w, v = y / h;
      // long horizontal streaks: high frequency vertically, very low horizontally
      let s = 0;
      s += 0.55 * vnoise(u * 7.0, v * streakDensity);
      s += 0.28 * vnoise(u * 3.0 + 11.3, v * streakDensity * 2.13);
      s += 0.17 * vnoise(u * 19.0 + 4.7, v * streakDensity * 0.47);
      // very faint broad mottling (satin variation, not glare)
      s += 0.10 * (fbm(u * 5.0 + 21.0, v * 5.0 + 3.0, 3) - 0.5);
      height[y * w + x] = s;
    }
  }

  // roughness map
  for (let i = 0; i < w * h; i++) {
    let n = (height[i] - 0.5) * contrast;
    // satin steel: mid roughness, narrow spread (no polished glare)
    let r = 0.30 + n * 0.16;
    r = Math.max(0.13, Math.min(0.62, r));
    const c = Math.round(r * 255);
    imgR.data[i * 4 + 0] = c;
    imgR.data[i * 4 + 1] = c;
    imgR.data[i * 4 + 2] = c;
    imgR.data[i * 4 + 3] = 255;
  }
  gR.putImageData(imgR, 0, 0);

  // normal map from height (sobel-lite)
  const strength = opts.normalStrength ?? 2.2;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const xl = (x - 1 + w) % w, xr = (x + 1) % w;
      const yu = (y - 1 + h) % h, yd = (y + 1) % h;
      const dx = (height[y * w + xr] - height[y * w + xl]) * strength;
      const dy = (height[yd * w + x] - height[yu * w + x]) * strength;
      let nx = -dx, ny = -dy, nz = 1.0;
      const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
      nx /= len; ny /= len; nz /= len;
      const i = (y * w + x) * 4;
      imgN.data[i + 0] = Math.round((nx * 0.5 + 0.5) * 255);
      imgN.data[i + 1] = Math.round((ny * 0.5 + 0.5) * 255);
      imgN.data[i + 2] = Math.round((nz * 0.5 + 0.5) * 255);
      imgN.data[i + 3] = 255;
    }
  }
  gN.putImageData(imgN, 0, 0);

  const texR = new THREE.CanvasTexture(cRough);
  const texN = new THREE.CanvasTexture(cNorm);
  for (const t of [texR, texN]) {
    t.wrapS = THREE.RepeatWrapping;
    t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    t.needsUpdate = true;
  }
  texR.colorSpace = THREE.NoColorSpace;
  texN.colorSpace = THREE.NoColorSpace;
  return { roughnessMap: texR, normalMap: texN };
}

/** Diamond knurl pattern: crossed helical ridges -> normal + roughness. */
function makeKnurlMaps(w = 1024, h = 512, cells = 60, rows = 14) {
  const cN = document.createElement('canvas'); cN.width = w; cN.height = h;
  const cR = document.createElement('canvas'); cR.width = w; cR.height = h;
  const gN = cN.getContext('2d'), gR = cR.getContext('2d');
  const imgN = gN.createImageData(w, h), imgR = gR.createImageData(w, h);

  const height = new Float32Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const u = x / w, v = y / h;
      const a = Math.abs(((u * cells + v * rows) % 1.0) - 0.5) * 2.0; // 0..1 ridge
      const b = Math.abs(((u * cells - v * rows) % 1.0) - 0.5) * 2.0;
      // pyramid tips where both ridges peak
      let hgt = Math.min(a, b);
      hgt = Math.pow(hgt, 0.85);
      // micro grain on the knurl faces
      hgt += 0.06 * (vnoise(u * 400, v * 400) - 0.5);
      height[y * w + x] = hgt;
    }
  }

  const strength = 5.0;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const xl = (x - 1 + w) % w, xr = (x + 1) % w;
      const yu = (y - 1 + h) % h, yd = (y + 1) % h;
      const dx = (height[y * w + xr] - height[y * w + xl]) * strength;
      const dy = (height[yd * w + x] - height[yu * w + x]) * strength;
      let nx = -dx, ny = -dy, nz = 1.0;
      const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
      nx /= len; ny /= len; nz /= len;
      const i = (y * w + x) * 4;
      imgN.data[i + 0] = Math.round((nx * 0.5 + 0.5) * 255);
      imgN.data[i + 1] = Math.round((ny * 0.5 + 0.5) * 255);
      imgN.data[i + 2] = Math.round((nz * 0.5 + 0.5) * 255);
      imgN.data[i + 3] = 255;

      // valleys of the knurl read rougher/darker (dirt + tooling)
      const hh = height[y * w + x];
      let r = 0.52 - hh * 0.20;
      r = Math.max(0.20, Math.min(0.75, r));
      const c = Math.round(r * 255);
      imgR.data[i + 0] = c; imgR.data[i + 1] = c; imgR.data[i + 2] = c; imgR.data[i + 3] = 255;
    }
  }
  gN.putImageData(imgN, 0, 0);
  gR.putImageData(imgR, 0, 0);

  const texN = new THREE.CanvasTexture(cN);
  const texR = new THREE.CanvasTexture(cR);
  for (const t of [texN, texR]) {
    t.wrapS = THREE.RepeatWrapping;
    t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    t.colorSpace = THREE.NoColorSpace;
    t.needsUpdate = true;
  }
  return { normalMap: texN, roughnessMap: texR };
}

/** Walnut wood: color + roughness + subtle normal. */
function makeWalnutMaps(w = 512, h = 512) {
  const cC = document.createElement('canvas'); cC.width = w; cC.height = h;
  const cR = document.createElement('canvas'); cR.width = w; cR.height = h;
  const cN = document.createElement('canvas'); cN.width = w; cN.height = h;
  const gC = cC.getContext('2d'), gR = cR.getContext('2d'), gN = cN.getContext('2d');
  const imgC = gC.createImageData(w, h), imgR = gR.createImageData(w, h), imgN = gN.createImageData(w, h);

  const height = new Float32Array(w * h);
  const dark = new THREE.Color(0x3a2216);
  const mid  = new THREE.Color(0x6b4128);
  const lite = new THREE.Color(0x8a5c39);
  const tmp  = new THREE.Color();

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const u = x / w, v = y / h;
      // growth rings warped by noise, running along one axis
      const warp = fbm(u * 3.0, v * 3.0, 4) * 1.35;
      let rings = Math.sin((v * 13.0 + warp * 2.6) * Math.PI * 2.0) * 0.5 + 0.5;
      rings = Math.pow(rings, 1.5);
      // fine pore streaks along the grain
      const pores = vnoise(u * 260.0, v * 26.0);
      let t = rings * 0.72 + pores * 0.28;
      t = Math.max(0, Math.min(1, t));
      height[y * w + x] = t;

      if (t < 0.5) tmp.copy(dark).lerp(mid, t / 0.5);
      else tmp.copy(mid).lerp(lite, (t - 0.5) / 0.5);

      const i = (y * w + x) * 4;
      imgC.data[i + 0] = Math.round(Math.pow(tmp.r, 1 / 2.2) * 255);
      imgC.data[i + 1] = Math.round(Math.pow(tmp.g, 1 / 2.2) * 255);
      imgC.data[i + 2] = Math.round(Math.pow(tmp.b, 1 / 2.2) * 255);
      imgC.data[i + 3] = 255;

      // oiled walnut: satin, darker latewood slightly glossier
      const rv = 0.46 - t * 0.12;
      const rc = Math.round(Math.max(0.22, Math.min(0.7, rv)) * 255);
      imgR.data[i + 0] = rc; imgR.data[i + 1] = rc; imgR.data[i + 2] = rc; imgR.data[i + 3] = 255;
    }
  }
  gC.putImageData(imgC, 0, 0);
  gR.putImageData(imgR, 0, 0);

  const strength = 1.1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const xl = (x - 1 + w) % w, xr = (x + 1) % w;
      const yu = (y - 1 + h) % h, yd = (y + 1) % h;
      const dx = (height[y * w + xr] - height[y * w + xl]) * strength;
      const dy = (height[yd * w + x] - height[yu * w + x]) * strength;
      let nx = -dx, ny = -dy, nz = 1.0;
      const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
      nx /= len; ny /= len; nz /= len;
      const i = (y * w + x) * 4;
      imgN.data[i + 0] = Math.round((nx * 0.5 + 0.5) * 255);
      imgN.data[i + 1] = Math.round((ny * 0.5 + 0.5) * 255);
      imgN.data[i + 2] = Math.round((nz * 0.5 + 0.5) * 255);
      imgN.data[i + 3] = 255;
    }
  }
  gN.putImageData(imgN, 0, 0);

  const texC = new THREE.CanvasTexture(cC);
  const texR = new THREE.CanvasTexture(cR);
  const texN = new THREE.CanvasTexture(cN);
  for (const t of [texC, texR, texN]) {
    t.wrapS = THREE.RepeatWrapping;
    t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    t.needsUpdate = true;
  }
  texC.colorSpace = THREE.SRGBColorSpace;
  texR.colorSpace = THREE.NoColorSpace;
  texN.colorSpace = THREE.NoColorSpace;
  return { map: texC, roughnessMap: texR, normalMap: texN };
}

const brushed      = makeBrushedMaps(1024, 1024, { streakDensity: 300, contrast: 1.0, normalStrength: 1.8 });
const brushedFine  = makeBrushedMaps(512, 512,  { streakDensity: 420, contrast: 0.8, normalStrength: 1.2 });
const knurl        = makeKnurlMaps(1024, 256, 74, 9);
const walnut       = makeWalnutMaps(512, 512);

/* ============================================================
   Environment (procedural studio softbox reflections)
   ============================================================ */
function makeStudioEnv() {
  const envScene = new THREE.Scene();
  envScene.background = new THREE.Color(0x1b1e22);

  const mk = (w, h, color, intensity, pos, lookAt) => {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(intensity), side: THREE.DoubleSide })
    );
    m.position.set(pos[0], pos[1], pos[2]);
    m.lookAt(new THREE.Vector3(lookAt[0], lookAt[1], lookAt[2]));
    envScene.add(m);
  };

  // big soft key softbox
  mk(6, 9, 0xffffff, 2.6, [-5, 4.0, 3.5], [0, 0, 0]);
  // cool fill panel
  mk(5, 7, 0xbcd2ea, 0.85, [6, 2.0, -1.5], [0, 0, 0]);
  // warm rim strip
  mk(1.4, 8, 0xffd9ad, 2.0, [1.5, 2.5, -6], [0, 0.5, 0]);
  // dark gradient floor + ceiling bounce
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 40),
    new THREE.MeshBasicMaterial({ color: 0x0d0e10 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -3;
  envScene.add(floor);

  const ceil = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 40),
    new THREE.MeshBasicMaterial({ color: 0x40474f })
  );
  ceil.rotation.x = Math.PI / 2;
  ceil.position.y = 8;
  envScene.add(ceil);

  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  const rt = pmrem.fromScene(envScene, 0.04);
  pmrem.dispose();
  envScene.traverse(o => {
    if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); }
  });
  return rt.texture;
}
const envMap = makeStudioEnv();
scene.environment = envMap;

/* ============================================================
   Geometry helpers
   ============================================================ */

/** Build a lathe geometry from a profile array of [x, y] pairs. */
function lathe(profile, segments = 192) {
  const pts = profile.map(p => new THREE.Vector2(Math.max(p[0], 1e-5), p[1]));
  const g = new THREE.LatheGeometry(pts, segments);
  g.computeVertexNormals();
  return g;
}

/**
 * Resample a coarse silhouette into a smooth profile using rounded corners.
 * Input: array of [x,y]; returns densified array.
 */
function smoothProfile(pts, subdiv = 4) {
  const curve = new THREE.CatmullRomCurve3(
    pts.map(p => new THREE.Vector3(p[0], p[1], 0)),
    false, 'catmullrom', 0.0
  );
  const n = Math.max(pts.length * subdiv, 24);
  const out = [];
  for (let i = 0; i <= n; i++) {
    const v = curve.getPoint(i / n);
    out.push([Math.max(v.x, 0.0), v.y]);
  }
  return out;
}

/** UV remap for lathe geometry so v maps linearly to world height (grain scale). */
function retileLatheUV(geo, uRepeat, vScale) {
  const uv = geo.attributes.uv;
  const pos = geo.attributes.position;
  let minY = Infinity, maxY = -Infinity;
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i);
    if (y < minY) minY = y;
    if (y > maxY) maxY = y;
  }
  const span = Math.max(maxY - minY, 1e-6);
  for (let i = 0; i < uv.count; i++) {
    const u = uv.getX(i);
    const y = pos.getY(i);
    uv.setXY(i, u * uRepeat, ((y - minY) / span) * vScale);
  }
  uv.needsUpdate = true;
  return geo;
}

/* ============================================================
   THE GRINDER
   Real-world scale (metres). Body ~52mm dia, ~180mm tall assembled.
   ============================================================ */
const grinder = new THREE.Group();
scene.add(grinder);

const R = 0.026;           // main body radius (52 mm dia)
const CUP_BOTTOM = 0.0;    // sits on ground

/* ---------- Catch cup (lower vessel) ---------- */
const cupProfile = smoothProfile([
  [0.000, 0.0000],
  [0.014, 0.0000],
  [0.0225, 0.0005],
  [0.0245, 0.0035],
  [R - 0.0012, 0.010],
  [R - 0.0008, 0.030],
  [R - 0.0008, 0.056],
  [R - 0.0010, 0.066],
], 6);
// add the top lip + inner wall back down (closed shell)
const cupFull = cupProfile.concat([
  [R - 0.0010, 0.0695],
  [R - 0.0030, 0.0710],
  [R - 0.0042, 0.0700],
  [R - 0.0042, 0.006],
  [0.000, 0.005],
]);
const cupGeo = retileLatheUV(lathe(cupFull, 200), 4.0, 3.4);
const cup = new THREE.Mesh(cupGeo, matBodySteel);
cup.castShadow = true; cup.receiveShadow = true;
grinder.add(cup);

// faint machined rings near the cup base (turning marks)
for (let i = 0; i < 3; i++) {
  const y = 0.0135 + i * 0.0042;
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(R - 0.0011, 0.00035, 8, 180),
    matBead
  );
  ring.rotation.x = Math.PI / 2;
  ring.position.y = y;
  ring.castShadow = true; ring.receiveShadow = true;
  grinder.add(ring);
}

/* ---------- Threaded collar joining cup to body ---------- */

const collarGroup = new THREE.Group();
collarGroup.position.y = COLLAR_Y;
grinder.add(collarGroup);

// collar body: slightly proud of the tube, chamfered top & bottom

  [R - 0.0009, 0.000],
  [R + 0.0004, 0.0016],
  [R + 0.0011, 0.0040],
  [R + 0.0011, 0.0125],
  [R + 0.0004, 0.0150],
  [R - 0.0009, 0.0166],
], 5);
const collarShell = collarProfile.concat([
  [R - 0.0034, 0.0166],
  [R - 0.0034, 0.000],
]);
const collar = new THREE.Mesh(retileLatheUV(lathe(collarShell, 200), 3.0, 0.7), matSteelDark);
collar.castShadow = true; collar.receiveShadow = true;
collarGroup.add(collar);

// fine axial serrations on the collar (grip flutes) — thin boxes around
const serrCount = 72;
const serrGeo = new THREE.BoxGeometry(0.00075, 0.0104, 0.0016);
const serrMesh = new THREE.InstancedMesh(serrGeo, matSteelDark, serrCount);
serrMesh.castShadow = true; serrMesh.receiveShadow = true;
{
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion();
  const s = new THREE.Vector3(1, 1, 1);
  const p = new THREE.Vector3();

    q.setFromEuler(e);
    m.compose(p, q, s);
    serrMesh.setMatrixAt(i, m);

// inner arm segment: from hub out to the fold hinge
function makeArmBar(len, w0, w1, thick) {
  // tapered flat bar built as an extruded rounded rectangle along +X
  const shape = new THREE.Shape();
  const h = thick / 2;
  const r = Math.min(h * 0.9, 0.0009);
  shape.moveTo(-h + r, -0.5);
  shape.lineTo(h - r, -0.5);
  shape.quadraticCurveTo(h, -0.5, h, -0.5 + r);
  shape.lineTo(h, 0.5 - r);
  shape.quadraticCurveTo(h, 0.5, h - r, 0.5);
  shape.lineTo(-h + r, 0.5);
  shape.quadraticCurveTo(-h, 0.5, -h, 0.5 - r);
  shape.lineTo(-h, -0.5 + r);
  shape.quadraticCurveTo(-h, -0.5, -h + r, -0.5);

  // We build a custom tapered bar instead of extrusion for width taper:
  const segs = 40;
  const pos = [], idx = [], nor = [], uvs = [];
  const ring = [];
  const RN = 16;
  for (let i = 0; i < RN; i++) {
    const a = (i / RN) * Math.PI * 2;
    // rounded rectangle cross-section (superellipse)
    const ca = Math.cos(a), sa = Math.sin(a);
    const p = 4.0;
    const sx = Math.sign(ca) * Math.pow(Math.abs(ca), 2 / p);
    const sy = Math.sign(sa) * Math.pow(Math.abs(sa), 2 / p);
    ring.push([sx, sy]);
  }
  for (let s = 0; s <= segs; s++) {
    const t = s / segs;
    const x = t * len;
    const wHalf = (w0 + (w1 - w0) * t) / 2;
    const tHalf = thick / 2;
    for (let i = 0; i < RN; i++) {
      const [sx, sy] = ring[i];
      // slight upward arc of the arm
      const lift = Math.sin(t * Math.PI) * 0.0012;
      pos.push(x, sy * tHalf + lift, sx * wHalf);
      nor.push(0, sy, sx);
      uvs.push(t, i / RN);
    }
  }
  for (let s = 0; s < segs; s++) {
    for (let i = 0; i < RN; i++) {
      const a0 = s * RN + i;
      const a1 = s * RN + ((i + 1) % RN);
      const b0 = (s + 1) * RN + i;
      const b1 = (s + 1) * RN + ((i + 1) % RN);
      idx.push(a0, b0, b1, a0, b1, a1);
    }
  }
  // caps
  const capStartCenter = pos.length / 3;
  pos.push(0, 0, 0); nor.push(-1, 0, 0); uvs.push(0, 0);
  for (let i = 0; i < RN; i++) {
    const a0 = i, a1 = (i + 1) % RN;
    idx.push(capStartCenter, a1, a0);
  }
  const capEndCenter = pos.length / 3;
  pos.push(len, Math.sin(Math.PI) * 0.0012, 0); nor.push(1, 0, 0); uvs.push(1, 1);
  const base = segs * RN;
  for (let i = 0; i < RN; i++) {
    const a0 = base + i, a1 = base + ((i + 1) % RN);
    idx.push(capEndCenter, a0, a1);
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

  const tex = new THREE.CanvasTexture(c);

}

/* ============================================================
   Resize + render loop
   ============================================================ */
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
