<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rooftop HVAC Package Unit</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #aeb8bd; }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 24px;
      top: 20px;
      color: #eef3f3;
      font: 600 14px/1.4 Arial, sans-serif;
      letter-spacing: .16em;
      text-transform: uppercase;
      text-shadow: 0 2px 5px rgba(0,0,0,.35);
      pointer-events: none;
    }
    .sub {
      display: block;
      margin-top: 5px;
      color: #d0d9da;
      font-size: 10px;
      letter-spacing: .12em;
      font-weight: 400;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">RTU-4800 <span class="sub">Rooftop packaged air conditioner</span></div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xaeb8bd);
    scene.fog = new THREE.Fog(0xaeb8bd, 15, 32);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(8.2, -8.5, 6.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.7;
    controls.target.set(0, 0, 2.0);
    controls.minDistance = 6;
    controls.maxDistance = 15;
    controls.maxPolarAngle = Math.PI * 0.48;

    const materials = {
      roof: new THREE.MeshStandardMaterial({ color: 0x737d80, roughness: 0.88, metalness: 0.12 }),
      curb: new THREE.MeshStandardMaterial({ color: 0x596367, roughness: 0.78, metalness: 0.45 }),
      body: new THREE.MeshStandardMaterial({ color: 0x8d9899, roughness: 0.72, metalness: 0.6 }),
      bodyLight: new THREE.MeshStandardMaterial({ color: 0xaab3b2, roughness: 0.68, metalness: 0.55 }),
      panel: new THREE.MeshStandardMaterial({ color: 0x768284, roughness: 0.7, metalness: 0.7 }),
      trim: new THREE.MeshStandardMaterial({ color: 0x4a5558, roughness: 0.58, metalness: 0.82 }),
      dark: new THREE.MeshStandardMaterial({ color: 0x1d2527, roughness: 0.48, metalness: 0.7 }),
      grille: new THREE.MeshStandardMaterial({ color: 0x303a3c, roughness: 0.52, metalness: 0.8 }),
      warning: new THREE.MeshStandardMaterial({ color: 0xc38d35, roughness: 0.6, metalness: 0.35 }),
      white: new THREE.MeshStandardMaterial({ color: 0xe0e4df, roughness: 0.6, metalness: 0.25 })
    };

    function box(parent, sx, sy, sz, x, y, z, material, edge = false) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), material);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      if (edge) {
        const outline = new THREE.LineSegments(
          new THREE.EdgesGeometry(mesh.geometry),
          new THREE.LineBasicMaterial({ color: 0x394346, transparent: true, opacity: 0.62 })
        );
        outline.position.copy(mesh.position);
        parent.add(outline);
      }
      return mesh;
    }

    function cylinder(parent, radius, height, x, y, z, material, radial = 32) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, height, radial), material);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function frontPanel(parent, x, z, width, height) {
      box(parent, width, 0.075, height, x, -1.548, z, materials.panel, true);
      box(parent, width - 0.18, 0.025, height - 0.18, x, -1.592, z, materials.bodyLight);
      box(parent, 0.045, 0.09, height - 0.28, x + width * 0.38, -1.65, z, materials.trim);
      box(parent, 0.045, 0.09, height - 0.28, x - width * 0.38, -1.65, z, materials.trim);
      box(parent, 0.24, 0.08, 0.06, x + width * 0.31, -1.66, z + height * 0.31, materials.dark);
    }

    function sidePanel(parent, x, y, z, width, height) {
      box(parent, 0.075, width, height, x, y, z, materials.panel, true);
      box(parent, 0.025, width - 0.18, height - 0.18, x + (x > 0 ? 0.045 : -0.045), y, z, materials.bodyLight);
      box(parent, 0.09, 0.045, height - 0.28, x + (x > 0 ? 0.07 : -0.07), y - width * 0.34, z, materials.trim);
      box(parent, 0.09, 0.045, height - 0.28, x + (x > 0 ? 0.07 : -0.07), y + width * 0.34, z, materials.trim);
      box(parent, 0.08, 0.24, 0.06, x + (x > 0 ? 0.08 : -0.08), y + width * 0.27, z + height * 0.3, materials.dark);
    }

    function frontLouver(parent, x, z, width, height) {
      const frameMat = materials.trim;
      box(parent, width, 0.12, 0.08, x, -1.68, z + height / 2, frameMat);
      box(parent, width, 0.12, 0.08, x, -1.68, z - height / 2, frameMat);
      box(parent, 0.08, 0.12, height, x - width / 2, -1.68, z, frameMat);
      box(parent, 0.08, 0.12, height, x + width / 2, -1.68, z, frameMat);
      for (let i = 0; i < 8; i++) {
        const zz = z - height / 2 + 0.14 + i * 0.16;
        const slat = box(parent, width - 0.13, 0.07, 0.055, x, -1.735, zz, materials.grille);
        slat.rotation.x = -0.2;
      }
    }

    function sideLouver(parent, x, y, z, width, height) {
      box(parent, 0.12, width, 0.08, x, y, z + height / 2, materials.trim);
      box(parent, 0.12, width, 0.08, x, y, z - height / 2, materials.trim);
      box(parent, 0.12, 0.08, height, x, y - width / 2, z, materials.trim);
      box(parent, 0.12, 0.08, height, x, y + width / 2, z, materials.trim);
      for (let i = 0; i < 9; i++) {
        const yy = y - width / 2 + 0.12 + i * 0.145;
        const slat = box(parent, 0.07, width - 0.12, 0.055, x, yy, z, materials.grille);
        slat.rotation.z = x > 0 ? 0.18 : -0.18;
      }
    }

    const unit = new THREE.Group();
    scene.add(unit);

    box(unit, 5.35, 3.45, 0.34, 0, 0, 0.25, materials.curb, true);
    box(unit, 4.85, 2.95, 0.16, 0, 0, 0.49, materials.trim);
    box(unit, 5.05, 3.15, 2.95, 0, 0, 2.02, materials.body, true);

    box(unit, 4.94, 3.04, 0.16, 0, 0, 3.53, materials.bodyLight, true);
    box(unit, 5.12, 0.12, 0.14, 0, -1.57, 3.35, materials.trim);
    box(unit, 5.12, 0.12, 0.14, 0, 1.57, 3.35, materials.trim);
    box(unit, 0.12, 3.12, 0.14, -2.48, 0, 3.35, materials.trim);
    box(unit, 0.12, 3.12, 0.14, 2.48, 0, 3.35, materials.trim);

    frontPanel(unit, -1.42, 2.38, 1.9, 1.72);
    frontPanel(unit, 0.62, 2.38, 1.85, 1.72);
    frontLouver(unit, -1.42, 1.08, 1.72, 1.16);
    frontLouver(unit, 0.62, 1.08, 1.67, 1.16);

    sidePanel(unit, 2.558, 0, 2.36, 2.25, 1.78);
    sideLouver(unit, 2.63, 0, 1.07, 2.28, 1.12);

    box(unit, 0.11, 2.92, 0.12, -2.58, 0, 1.35, materials.trim);
    box(unit, 0.11, 2.92, 0.12, 2.58, 0, 1.35, materials.trim);

    const topFan = new THREE.Group();
    unit.add(topFan);
    cylinder(topFan, 1.18, 0.07, 0, 0.05, 3.66, materials.dark, 48);
    const fanRing = new THREE.Mesh(
      new THREE.TorusGeometry(1.16, 0.075, 10, 48),
      materials.trim
    );
    fanRing.position.set(0, 0.05, 3.72);
    fanRing.rotation.x = 0;
    fanRing.castShadow = true;
    topFan.add(fanRing);

    for (let i = 0; i < 8; i++) {
      const angle = i * Math.PI / 8;
      const bar = box(topFan, 2.18, 0.045, 0.06, 0, 0.05, 3.74, materials.grille);
      bar.rotation.z = angle;
    }

    cylinder(topFan, 0.22, 0.16, 0, 0.05, 3.79, materials.trim, 32);
    cylinder(topFan, 0.1, 0.19, 0, 0.05, 3.86, materials.dark, 24);

    const electrical = new THREE.Group();
    unit.add(electrical);
    box(electrical, 0.65, 0.07, 0.92, -1.95, -1.64, 1.05, materials.dark, true);
    box(electrical, 0.42, 0.035, 0.08, -1.95, -1.69, 1.28, materials.warning);
    box(electrical, 0.12, 0.035, 0.17, -2.12, -1.69, 0.92, materials.warning);
    box(electrical, 0.12, 0.035, 0.17, -1.78, -1.69, 0.92, materials.warning);

    const bolts = [
      [-2.25, -1.68, 3.08], [-0.6, -1.68, 3.08],
      [0.0, -1.68, 3.08], [1.35, -1.68, 3.08],
      [-2.25, -1.68, 1.56], [-0.6, -1.68, 1.56],
      [0.0, -1.68, 1.56], [1.35, -1.68, 1.56]
    ];
    for (const bolt of bolts) {
      cylinder(unit, 0.045, 0.025, bolt[0], bolt[1], bolt[2], materials.white, 16).rotation.x = Math.PI / 2;
    }

    const roof = box(scene, 28, 28, 0.18, 0, 0, -0.12, materials.roof);
    roof.receiveShadow = true;

    const roofLines = new THREE.Group();
    scene.add(roofLines);
    for (let i = -12; i <= 12; i++) {
      const line = new THREE.Mesh(
        new THREE.BoxGeometry(0.018, 28, 0.012),
        new THREE.MeshBasicMaterial({ color: 0x697478, transparent: true, opacity: 0.3 })
      );
      line.position.set(i, 0, -0.015);
      roofLines.add(line);
    }
    for (let i = -12; i <= 12; i++) {
      const line = new THREE.Mesh(
        new THREE.BoxGeometry(28, 0.018, 0.012),
        new THREE.MeshBasicMaterial({ color: 0x697478, transparent: true, opacity: 0.3 })
      );
      line.position.set(0, i, -0.01);
      roofLines.add(line);
    }

    const ambient = new THREE.HemisphereLight(0xdce7ea, 0x536064, 2.2);
    scene.add(ambient);

    const key = new THREE.DirectionalLight(0xfff1d5, 3.8);
    key.position.set(-6, -8, 11);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -10;
    key.shadow.camera.right = 10;
    key.shadow.camera.top = 10;
    key.shadow.camera.bottom = -10;
    key.shadow.bias = -0.00025;
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xbad7e9, 1.4);
    fill.position.set(8, 5, 7);
    scene.add(fill);

    const rim = new THREE.PointLight(0x9bc6d7, 20, 15, 2);
    rim.position.set(-4, 4, 6);
    scene.add(rim);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
