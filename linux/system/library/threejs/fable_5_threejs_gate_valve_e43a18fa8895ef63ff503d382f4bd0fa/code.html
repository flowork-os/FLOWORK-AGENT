<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Industrial Gate Valve</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1d21; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --- Renderer / Scene / Camera ---
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1d21);
scene.fog = new THREE.Fog(0x1a1d21, 18, 40);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6.5, 4.5, 8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.2, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 4;
controls.maxDistance = 25;
controls.maxPolarAngle = Math.PI * 0.52;

// --- Lights ---
const key = new THREE.DirectionalLight(0xfff2e0, 2.6);
key.position.set(6, 10, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -8;
key.shadow.camera.right = key.shadow.camera.top = 8;
key.shadow.radius = 6;
key.shadow.bias = -0.0004;
scene.add(key);
scene.add(new THREE.DirectionalLight(0x8fb8ff, 0.8).translateOnAxis(new THREE.Vector3(-1, 0.4, -0.8).normalize(), 10));
scene.add(new THREE.HemisphereLight(0x9db4c8, 0x2a2622, 0.55));

// --- Materials (cast-metal look) ---
const bodyMat  = new THREE.MeshStandardMaterial({ color: 0x4a5560, metalness: 0.85, roughness: 0.55 });
const darkMat  = new THREE.MeshStandardMaterial({ color: 0x353c44, metalness: 0.85, roughness: 0.6 });
const steelMat = new THREE.MeshStandardMaterial({ color: 0xb8bcc2, metalness: 0.95, roughness: 0.3 });
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x7a2020, metalness: 0.4,  roughness: 0.5 });
const boltMat  = new THREE.MeshStandardMaterial({ color: 0x8a9098, metalness: 0.9,  roughness: 0.4 });

// --- Valve assembly ---
const valve = new THREE.Group();
scene.add(valve);
const cast = (g, m) => { const mesh = new THREE.Mesh(g, m); mesh.castShadow = mesh.receiveShadow = true; return mesh; };

const BODY_Y = 1.5; // pipe centerline height

// Central body: sphere-ish hub + horizontal pipe barrel
const hub = cast(new THREE.SphereGeometry(1.15, 40, 30), bodyMat);
hub.position.y = BODY_Y;
hub.scale.set(1, 1.12, 0.92);
valve.add(hub);

const barrel = cast(new THREE.CylinderGeometry(0.72, 0.72, 4.6, 36), bodyMat);
barrel.rotation.z = Math.PI / 2;
barrel.position.y = BODY_Y;
valve.add(barrel);

// Wedge-guide ribs on the body
for (const s of [-1, 1]) {
  const rib = cast(new THREE.BoxGeometry(0.16, 1.9, 1.5), darkMat);
  rib.position.set(s * 0.55, BODY_Y + 0.15, 0);
  valve.add(rib);
}

// Flanges with bolt-hole rings
function flange(x, dir) {
  const g = new THREE.Group();
  const disc = cast(new THREE.CylinderGeometry(1.45, 1.45, 0.34, 48), steelMat);
  disc.rotation.z = Math.PI / 2;
  g.add(disc);
  const face = cast(new THREE.CylinderGeometry(1.0, 1.0, 0.42, 48), steelMat); // raised face
  face.rotation.z = Math.PI / 2;
  face.position.x = dir * 0.03;
  g.add(face);
  const neck = cast(new THREE.CylinderGeometry(0.74, 0.9, 0.5, 36), bodyMat); // taper into barrel
  neck.rotation.z = -dir * Math.PI / 2;
  neck.position.x = -dir * 0.35;
  g.add(neck);
  const bore = cast(new THREE.CylinderGeometry(0.5, 0.5, 0.1, 32), darkMat);
  bore.rotation.z = Math.PI / 2;
  bore.position.x = dir * 0.18;
  g.add(bore);
  // Bolt ring: bolts + hex nuts
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + Math.PI / 8;
    const r = 1.2;
    const bolt = cast(new THREE.CylinderGeometry(0.07, 0.07, 0.62, 12), boltMat);
    bolt.rotation.z = Math.PI / 2;
    bolt.position.set(0, Math.cos(a) * r, Math.sin(a) * r);
    g.add(bolt);
    const nut = cast(new THREE.CylinderGeometry(0.13, 0.13, 0.12, 6), boltMat);
    nut.rotation.z = Math.PI / 2;
    nut.position.set(dir * 0.24, Math.cos(a) * r, Math.sin(a) * r);
    g.add(nut);
  }
  g.position.set(x, BODY_Y, 0);
  return g;
}
valve.add(flange(-2.3, -1), flange(2.3, 1));

// Bonnet flange pair (body-to-bonnet bolted joint)
const bodyTopFl = cast(new THREE.CylinderGeometry(0.95, 1.05, 0.22, 36), bodyMat);
bodyTopFl.position.y = BODY_Y + 1.18;
valve.add(bodyTopFl);
const bonnetFl = cast(new THREE.CylinderGeometry(0.95, 0.95, 0.2, 36), bodyMat);
bonnetFl.position.y = BODY_Y + 1.4;
valve.add(bonnetFl);
for (let i = 0; i < 6; i++) {
  const a = (i / 6) * Math.PI * 2;
  const stud = cast(new THREE.CylinderGeometry(0.06, 0.06, 0.55, 10), boltMat);
  stud.position.set(Math.cos(a) * 0.78, BODY_Y + 1.28, Math.sin(a) * 0.78);
  valve.add(stud);
  const nut = cast(new THREE.CylinderGeometry(0.11, 0.11, 0.11, 6), boltMat);
  nut.position.set(Math.cos(a) * 0.78, BODY_Y + 1.55, Math.sin(a) * 0.78);
  valve.add(nut);
}

// Bonnet (rising spindle housing)
const bonnet = cast(new THREE.CylinderGeometry(0.42, 0.82, 1.5, 32), bodyMat);
bonnet.position.y = BODY_Y + 2.2;
valve.add(bonnet);
const yoke = cast(new THREE.CylinderGeometry(0.5, 0.42, 0.35, 32), darkMat); // yoke nut boss
yoke.position.y = BODY_Y + 3.05;
valve.add(yoke);
const gland = cast(new THREE.CylinderGeometry(0.26, 0.3, 0.3, 20), steelMat); // packing gland
gland.position.y = BODY_Y + 3.28;
valve.add(gland);

// Rising stem with thread hint
const stem = cast(new THREE.CylinderGeometry(0.13, 0.13, 2.5, 16), steelMat);
stem.position.y = BODY_Y + 4.1;
valve.add(stem);
for (let i = 0; i < 9; i++) {
  const thread = cast(new THREE.TorusGeometry(0.135, 0.02, 8, 20), steelMat);
  thread.rotation.x = Math.PI / 2;
  thread.position.y = BODY_Y + 3.45 + i * 0.13;
  valve.add(thread);
}

// Handwheel: rim + spokes + hub nut
const wheel = new THREE.Group();
const WHEEL_Y = BODY_Y + 5.1;
const rim = cast(new THREE.TorusGeometry(1.15, 0.11, 16, 60), wheelMat);
rim.rotation.x = Math.PI / 2;
wheel.add(rim);
for (let i = 0; i < 5; i++) {
  const a = (i / 5) * Math.PI * 2;
  const spoke = cast(new THREE.CylinderGeometry(0.055, 0.08, 1.12, 10), wheelMat);
  spoke.rotation.z = Math.PI / 2;
  spoke.rotation.y = -a;
  spoke.position.set(Math.cos(a) * 0.56, 0, Math.sin(a) * 0.56);
  wheel.add(spoke);
}
const whub = cast(new THREE.CylinderGeometry(0.24, 0.28, 0.3, 20), wheelMat);
wheel.add(whub);
const stemNut = cast(new THREE.CylinderGeometry(0.15, 0.15, 0.16, 6), boltMat);
stemNut.position.y = 0.22;
wheel.add(stemNut);
wheel.position.y = WHEEL_Y;
valve.add(wheel);

// --- Ground with soft shadow ---
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(20, 64),
  new THREE.MeshStandardMaterial({ color: 0x23272c, metalness: 0.1, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const glow = new THREE.Mesh(
  new THREE.CircleGeometry(4.5, 48),
  new THREE.MeshBasicMaterial({ color: 0x2e343b, transparent: true, opacity: 0.6 })
);
glow.rotation.x = -Math.PI / 2;
glow.position.y = 0.005;
scene.add(glow);

// --- Loop / Resize ---
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  wheel.rotation.y = clock.getElapsedTime() * 0.15; // slow handwheel turn
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
