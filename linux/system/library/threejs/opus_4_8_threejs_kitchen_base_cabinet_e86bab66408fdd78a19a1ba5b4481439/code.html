<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contemporary Kitchen Base Cabinet</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #eceef0; }
  #app { width: 100vw; height: 100vh; display: block; }
</style>

<!-- three.js + OrbitControls via ES-module importmap (jsDelivr CDN, three@0.160.0) -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="app"></canvas>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------------------
// Renderer
// ---------------------------------------------------------------------------
const canvas   = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace     = THREE.SRGBColorSpace;
renderer.toneMapping          = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure  = 1.05;
renderer.shadowMap.enabled    = true;
renderer.shadowMap.type       = THREE.PCFSoftShadowMap;

// ---------------------------------------------------------------------------
// Scene & neutral studio background
// ---------------------------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeceef0);

// ---------------------------------------------------------------------------
// Camera
// ---------------------------------------------------------------------------
const camera = new THREE.PerspectiveCamera(
  42, window.innerWidth / window.innerHeight, 0.01, 100
);

// ---------------------------------------------------------------------------
// Lighting: hemisphere fill + directional key (shadows) + subtle fill
// ---------------------------------------------------------------------------
const hemi = new THREE.HemisphereLight(0xffffff, 0xb2b2ae, 0.65);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xfff6ec, 2.3);
keyLight.position.set(2.2, 3.2, 2.4);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.bias = -0.0004;
keyLight.shadow.normalBias = 0.02;
keyLight.shadow.camera.near = 0.1;
keyLight.shadow.camera.far  = 20;
keyLight.shadow.camera.left   = -1.6;
keyLight.shadow.camera.right  =  1.6;
keyLight.shadow.camera.top    =  1.8;
keyLight.shadow.camera.bottom = -0.4;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xdfe8ff, 0.55);
fillLight.position.set(-2.6, 1.6, -1.4);
scene.add(fillLight);

// ---------------------------------------------------------------------------
// Soft ground / contact-shadow plane the cabinet rests on
// ---------------------------------------------------------------------------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshStandardMaterial({ color: 0xdfe1e4, roughness: 0.95, metalness: 0.0 })
);
ground.name = 'ground';
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

// ---------------------------------------------------------------------------
// Procedural quartz/stone texture for the countertop (CanvasTexture)
// ---------------------------------------------------------------------------
function makeQuartzTexture() {
  const s = 512;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#dadad3';
  ctx.fillRect(0, 0, s, s);
  // scatter fine speckles of varying grey to read as engineered stone
  for (let i = 0; i < 9000; i++) {
    const x = Math.random() * s;
    const y = Math.random() * s;
    const r = Math.random() * 1.6 + 0.3;
    const shade = Math.random();
    let col;
    if (shade < 0.55) { const g = 205 + ((Math.random() * 45) | 0); col = `rgba(${g},${g},${g - 6},0.5)`; }
    else if (shade < 0.85) col = 'rgba(158,158,154,0.42)';
    else col = 'rgba(118,118,116,0.35)';
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// ---------------------------------------------------------------------------
// Materials
// ---------------------------------------------------------------------------
const matCabinet = new THREE.MeshStandardMaterial({   // flat-panel doors, drawer, carcass
  color: 0xeceae2, roughness: 0.62, metalness: 0.0
});
const matToeKick = new THREE.MeshStandardMaterial({   // recessed dark plinth
  color: 0x2b2e31, roughness: 0.85, metalness: 0.0
});
const matCounter = new THREE.MeshPhysicalMaterial({   // polished stone countertop
  map: makeQuartzTexture(),
  color: 0xffffff, roughness: 0.35, metalness: 0.0,
  clearcoat: 0.35, clearcoatRoughness: 0.28
});
const matHandle = new THREE.MeshStandardMaterial({    // brushed metal bar handles
  color: 0xbfc3c7, roughness: 0.34, metalness: 0.95
});

// ---------------------------------------------------------------------------
// Cabinet dimensions (metres, realistic base-cabinet proportions)
// ---------------------------------------------------------------------------
const W = 0.80;          // overall carcass width
const D = 0.60;          // overall carcass depth
const TOE_H = 0.12;      // toe-kick / plinth height
const TOE_RECESS = 0.05; // how far the toe-kick sits back from the front
const CARCASS_H = 0.72;  // body height above the toe-kick
const CT_TH = 0.04;      // countertop thickness
const DOOR_TH = 0.02;    // door / drawer front thickness
const GAP = 0.004;       // reveal gap between panels

const carcassBottom = TOE_H;                 // y where the body starts
const carcassTop    = TOE_H + CARCASS_H;     // y = 0.84, top of the body
const frontZ        = D / 2;                 // front face of the door/drawer panels
const panelCenterZ  = frontZ - DOOR_TH / 2;  // centre of the panel slabs

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
function addBox(group, name, w, h, d, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.name = name;
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  group.add(m);
  return m;
}

// Slim bar handle: a round bar standing on two posts, mounting plane at local z = 0
function makeBarHandle(name, length) {
  const g = new THREE.Group();
  g.name = name;
  const radius = 0.007, standoff = 0.028, postR = 0.004;

  const bar = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, length, 24), matHandle
  );
  bar.name = name + '-bar';
  bar.position.z = standoff + radius;   // stands proud of the panel
  bar.castShadow = true;
  g.add(bar);

  const postGeo = new THREE.CylinderGeometry(postR, postR, standoff, 16);
  for (const sy of [ length / 2 - radius * 1.5, -(length / 2 - radius * 1.5) ]) {
    const p = new THREE.Mesh(postGeo, matHandle);
    p.rotation.x = Math.PI / 2;         // lay the post along +z
    p.position.set(0, sy, standoff / 2);
    p.castShadow = true;
    g.add(p);
  }
  return g;
}

// ---------------------------------------------------------------------------
// Build the cabinet
// ---------------------------------------------------------------------------
const cabinet = new THREE.Group();
cabinet.name = 'kitchenBaseCabinet';

// Carcass (body) — sits just behind the door/drawer plane so the fronts are proud
const carcassDepth = D - DOOR_TH;
addBox(cabinet, 'carcass', W, CARCASS_H, carcassDepth, matCabinet,
       0, (carcassBottom + carcassTop) / 2, -DOOR_TH / 2);

// Toe-kick plinth — recessed and darker, gives the "floating" base look
const toeDepth = D - TOE_RECESS;
addBox(cabinet, 'toeKick', W - 0.02, TOE_H, toeDepth, matToeKick,
       0, TOE_H / 2, -TOE_RECESS / 2);

// Countertop — slab overhanging the front and sides, flush at the back
const ctW = W + 0.03;                 // side overhang
const ctDepth = D + 0.03;             // front overhang (back stays flush at -D/2)
addBox(cabinet, 'countertop', ctW, CT_TH, ctDepth, matCounter,
       0, carcassTop + CT_TH / 2, 0.03 / 2);

// --- Front layout: shallow drawer across the top, two doors below ----------
const drawerZoneH = 0.15;                              // top drawer band
const doorZoneTop = carcassTop - drawerZoneH;          // y = 0.69
const doorZoneBottom = carcassBottom;                  // y = 0.12

// Drawer front (spans the full width)
const drawerH = drawerZoneH - 2 * GAP;
const drawerW = W - 2 * GAP;
const drawerCenterY = carcassTop - drawerZoneH / 2;    // y = 0.765
addBox(cabinet, 'drawerFront', drawerW, drawerH, DOOR_TH, matCabinet,
       0, drawerCenterY, panelCenterZ);

// Drawer handle — horizontal slim bar, centred on the drawer
const drawerHandle = makeBarHandle('drawerHandle', 0.30);
drawerHandle.rotation.z = Math.PI / 2;                 // lay the bar horizontally
drawerHandle.position.set(0, drawerCenterY, frontZ);
cabinet.add(drawerHandle);

// Two hinged lower doors
const doorZoneH = doorZoneTop - doorZoneBottom;        // 0.57
const doorH = doorZoneH - 2 * GAP;
const doorW = (W - 2 * GAP - GAP) / 2;                 // split, minus centre reveal
const doorCenterY = (doorZoneTop + doorZoneBottom) / 2;
const doorOffsetX = GAP / 2 + doorW / 2;

addBox(cabinet, 'doorLeft',  doorW, doorH, DOOR_TH, matCabinet,
       -doorOffsetX, doorCenterY, panelCenterZ);
addBox(cabinet, 'doorRight', doorW, doorH, DOOR_TH, matCabinet,
        doorOffsetX, doorCenterY, panelCenterZ);

// Door handles — vertical slim bars near the inner edges, upper region
const doorHandleLen = 0.20;
const doorHandleY = doorCenterY + doorH / 2 - doorHandleLen / 2 - 0.03;  // toward the top
const handleInsetX = 0.03;

const handleLeft = makeBarHandle('doorHandleLeft', doorHandleLen);
handleLeft.position.set(-handleInsetX, doorHandleY, frontZ);
cabinet.add(handleLeft);

const handleRight = makeBarHandle('doorHandleRight', doorHandleLen);
handleRight.position.set(handleInsetX, doorHandleY, frontZ);
cabinet.add(handleRight);

scene.add(cabinet);

// ---------------------------------------------------------------------------
// Centre the cabinet at the origin (x,z) while it rests on the ground (y=0)
// ---------------------------------------------------------------------------
const box0 = new THREE.Box3().setFromObject(cabinet);
const c0 = box0.getCenter(new THREE.Vector3());
cabinet.position.x -= c0.x;
cabinet.position.z -= c0.z;
cabinet.position.y -= box0.min.y;   // ensure the base sits exactly on y = 0

// ---------------------------------------------------------------------------
// OrbitControls with damping + gentle auto-rotate
// ---------------------------------------------------------------------------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 0.6;
controls.maxDistance = 6;
controls.maxPolarAngle = Math.PI * 0.495;   // stay above the floor

// ---------------------------------------------------------------------------
// Auto-frame the camera to the cabinet's bounding box
// ---------------------------------------------------------------------------
const box = new THREE.Box3().setFromObject(cabinet);
const center = box.getCenter(new THREE.Vector3());
const size = box.getSize(new THREE.Vector3());
const maxDim = Math.max(size.x, size.y, size.z);
const fov = camera.fov * Math.PI / 180;
let dist = (maxDim / 2) / Math.tan(fov / 2);
dist *= 1.7;   // padding around the object

camera.position.set(center.x + dist * 0.72, center.y + dist * 0.42, center.z + dist * 0.92);
camera.lookAt(center);
controls.target.copy(center);
controls.update();

// ---------------------------------------------------------------------------
// Resize handling
// ---------------------------------------------------------------------------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------------------------------------------------------------------------
// Render loop
// ---------------------------------------------------------------------------
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
