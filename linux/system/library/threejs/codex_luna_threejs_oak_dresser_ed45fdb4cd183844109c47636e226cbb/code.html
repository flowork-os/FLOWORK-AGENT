<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solid Oak Dresser</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1d1713; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1c1511);
scene.fog = new THREE.Fog(0x1c1511, 500, 900);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 1, 1200);
camera.position.set(225, 155, 285);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 58, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 170;
controls.maxDistance = 480;
controls.maxPolarAngle = Math.PI * 0.48;

const oakTop = new THREE.MeshStandardMaterial({
  color: 0xb8793d, roughness: 0.48, metalness: 0
});
const oakFront = new THREE.MeshStandardMaterial({
  color: 0xa96531, roughness: 0.52, metalness: 0
});
const oakSide = new THREE.MeshStandardMaterial({
  color: 0x8b5129, roughness: 0.58, metalness: 0
});
const oakEdge = new THREE.MeshStandardMaterial({
  color: 0x74401f, roughness: 0.62, metalness: 0
});
const recess = new THREE.MeshStandardMaterial({
  color: 0x2b160d, roughness: 0.92, metalness: 0
});
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x30221a, roughness: 0.82, metalness: 0
});
const wallMat = new THREE.MeshStandardMaterial({
  color: 0x493529, roughness: 0.95, metalness: 0
});

function box(w, h, d, material, x, y, z, bevel = 0.8) {
  const geometry = new RoundedBoxGeometry(w, h, d, bevel, 4);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function cylinder(radius, height, material, x, y, z, rotationX = 0) {
  const geometry = new THREE.CylinderGeometry(radius, radius * 1.04, height, 32);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(x, y, z);
  mesh.rotation.x = rotationX;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

const dresserWidth = 150;
const dresserDepth = 48;
const bodyBottom = 13;
const bodyTop = 108;
const frontZ = 26.2;

box(142, 9, 46, oakEdge, 0, 8.5, 0, 1.8);
box(136, 4, 43, oakTop, 0, 112, 0, 1.2);

box(6, 96, dresserDepth, oakSide, -72, 60, 0, 1.2);
box(6, 96, dresserDepth, oakSide, 72, 60, 0, 1.2);
box(140, 4, 46, oakEdge, 0, 14.5, 0, 0.8);
box(138, 91, 3, recess, 0, 61, -22.2, 0.35);

box(4, 88, 38, oakEdge, -23.5, 61, -1, 0.5);
box(4, 88, 38, oakEdge, 23.5, 61, -1, 0.5);

const drawerCentersX = [-46.5, 0, 46.5];
const drawerCentersY = [29, 57, 85];
const drawerWidth = 44;
const drawerHeight = 24;

for (const y of drawerCentersY) {
  for (const x of drawerCentersX) {
    box(drawerWidth - 1.5, drawerHeight - 2, 37, oakEdge, x, y, 1.5, 0.45);
    box(drawerWidth, drawerHeight, 3.6, oakFront, x, y, frontZ, 1.15);

    const knobMat = new THREE.MeshStandardMaterial({
      color: 0x70401f,
      roughness: 0.38,
      metalness: 0
    });

    cylinder(1.35, 3.5, knobMat, x, y, 28.6, Math.PI / 2);

    const knob = new THREE.Mesh(
      new THREE.SphereGeometry(3.45, 32, 20),
      knobMat
    );
    knob.position.set(x, y, 31.0);
    knob.scale.set(1, 1, 0.82);
    knob.castShadow = true;
    knob.receiveShadow = true;
    scene.add(knob);
  }
}

box(137, 2.4, 2.2, oakTop, 0, 106.2, 24.0, 0.45);
box(137, 2.2, 2.2, oakEdge, 0, 16.8, 24.0, 0.35);

box(132, 3, 45, oakTop, 0, 116, 0, 1.1);

const footMat = new THREE.MeshStandardMaterial({
  color: 0x5e351c,
  roughness: 0.7
});
box(18, 5, 38, footMat, -54, 3, 0, 1.1);
box(18, 5, 38, footMat, 54, 3, 0, 1.1);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(1000, 1000),
  floorMat
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
floor.receiveShadow = true;
scene.add(floor);

const backWall = new THREE.Mesh(
  new THREE.PlaneGeometry(1000, 500),
  wallMat
);
backWall.position.set(0, 250, -85);
backWall.receiveShadow = true;
scene.add(backWall);

const hemi = new THREE.HemisphereLight(0xffd9ae, 0x24150d, 2.0);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xffd0a1, 4.2);
keyLight.position.set(-180, 280, 220);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -260;
keyLight.shadow.camera.right = 260;
keyLight.shadow.camera.top = 300;
keyLight.shadow.camera.bottom = -80;
keyLight.shadow.camera.near = 20;
keyLight.shadow.camera.far = 700;
keyLight.shadow.bias = -0.0004;
scene.add(keyLight);

const fillLight = new THREE.PointLight(0xc18b61, 55, 420, 2);
fillLight.position.set(185, 100, 160);
scene.add(fillLight);

const warmRim = new THREE.PointLight(0xff9b50, 35, 300, 2);
warmRim.position.set(-170, 90, -120);
scene.add(warmRim);

const ambient = new THREE.AmbientLight(0x8d6148, 0.35);
scene.add(ambient);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
</body>
</html>
