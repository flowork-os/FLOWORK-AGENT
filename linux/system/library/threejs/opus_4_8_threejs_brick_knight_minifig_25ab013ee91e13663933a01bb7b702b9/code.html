<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brick Knight — LEGO-style Minifigure</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #16181d; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  .hint {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.4 system-ui, sans-serif; color: #8b93a1;
    letter-spacing: .3px; user-select: none; pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="hint">Brick Knight · drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------------------------------------------------------------------
   Renderer
--------------------------------------------------------------------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

/* ---------------------------------------------------------------------------
   Scene + Camera
--------------------------------------------------------------------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17191f);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4.6, 3.5, 7.2);

// Procedural studio environment for glossy plastic / metal reflections
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ---------------------------------------------------------------------------
   Lighting: hemisphere ambient + key / fill / rim
--------------------------------------------------------------------------- */
const hemi = new THREE.HemisphereLight(0xa9bdd6, 0x1a1d24, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff3e4, 2.5);
key.position.set(5.5, 8.5, 6.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 40;
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -3;
key.shadow.radius = 5;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
scene.add(key);

const fill = new THREE.DirectionalLight(0x93b4ff, 0.7);
fill.position.set(-6.5, 3.5, 3.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 1.35);
rim.position.set(-3.5, 6.0, -6.5);
scene.add(rim);

/* ---------------------------------------------------------------------------
   Ground plane — receives shadows only
--------------------------------------------------------------------------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------------------------------------------------------------------
   Materials — glossy molded plastic + molded metal
--------------------------------------------------------------------------- */
function plastic(color, opts = {}) {
  return new THREE.MeshPhysicalMaterial({
    color,
    roughness: opts.roughness ?? 0.38,
    metalness: 0.0,
    clearcoat: opts.clearcoat ?? 0.55,
    clearcoatRoughness: opts.clearcoatRoughness ?? 0.28,
    envMapIntensity: 0.9
  });
}
function metal(color, rough = 0.32) {
  return new THREE.MeshStandardMaterial({
    color, roughness: rough, metalness: 0.92, envMapIntensity: 1.0
  });
}

const MAT = {
  blue:      plastic(0x2160bd),
  darkBlue:  plastic(0x14396f),
  yellow:    plastic(0xf6c53c, { roughness: 0.3 }),
  red:       plastic(0xc02f28),
  visor:     new THREE.MeshStandardMaterial({ color: 0x0d0f13, roughness: 0.6, metalness: 0.2 }),
  helmet:    metal(0xb6bcc6, 0.34),
  silver:    metal(0xcbd0d8, 0.3),
  steel:     metal(0x9aa0aa, 0.28),
  gold:      metal(0xd7a72c, 0.3)
};

/* ---------------------------------------------------------------------------
   Small builders
--------------------------------------------------------------------------- */
function box(w, h, d, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function cyl(rt, rb, h, mat, seg = 28) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function stud(mat, r = 0.14, h = 0.09) {
  return cyl(r, r, h, mat, 24);
}

/* ---------------------------------------------------------------------------
   The Brick Knight (feet on y = 0)
--------------------------------------------------------------------------- */
const knight = new THREE.Group();

/* ---- Legs & hips ---- */
const legW = 0.72, legH = 1.5, legD = 1.0, legGap = 0.06;
[-1, 1].forEach(s => {
  const leg = box(legW, legH, legD, MAT.darkBlue);
  leg.position.set(s * (legW / 2 + legGap / 2), legH / 2, 0);
  knight.add(leg);
  // little foot toe for silhouette
  const toe = box(legW, 0.34, 0.34, MAT.darkBlue);
  toe.position.set(s * (legW / 2 + legGap / 2), 0.17, legD / 2 + 0.02);
  knight.add(toe);
  // knee joint accent
  const knee = box(legW * 0.62, 0.22, legD * 0.7, MAT.silver);
  knee.position.set(s * (legW / 2 + legGap / 2), legH * 0.62, 0.02);
  knight.add(knee);
});

const hipsY = legH;                 // 1.5
const hips = box(1.62, 0.62, legD + 0.02, MAT.silver);
hips.position.set(0, hipsY + 0.31, 0);
knight.add(hips);

/* ---- Torso (tapered / trapezoidal minifigure body) ---- */
const torsoBaseY = hipsY + 0.62;    // 2.12
const torsoH = 1.82;
const torso = new THREE.Group();
torso.position.set(0, torsoBaseY, 0);
knight.add(torso);

const tShape = new THREE.Shape();
tShape.moveTo(-0.76, 0);
tShape.lineTo(0.76, 0);
tShape.lineTo(0.95, torsoH);
tShape.lineTo(-0.95, torsoH);
tShape.lineTo(-0.76, 0);
const tGeo = new THREE.ExtrudeGeometry(tShape, {
  depth: 1.02, bevelEnabled: true, bevelThickness: 0.07, bevelSize: 0.07, bevelSegments: 2
});
tGeo.translate(0, 0, -0.58);
const torsoMesh = new THREE.Mesh(tGeo, MAT.blue);
torsoMesh.castShadow = true; torsoMesh.receiveShadow = true;
torso.add(torsoMesh);

/* printed chest-plate (silver armour panel) */
const cShape = new THREE.Shape();
cShape.moveTo(-0.56, 0.2);
cShape.lineTo(0.56, 0.2);
cShape.lineTo(0.7, 1.42);
cShape.lineTo(-0.7, 1.42);
cShape.lineTo(-0.56, 0.2);
const cGeo = new THREE.ExtrudeGeometry(cShape, {
  depth: 0.12, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 1
});
cGeo.translate(0, 0, 0.5);
const chest = new THREE.Mesh(cGeo, MAT.silver);
chest.castShadow = true; chest.receiveShadow = true;
torso.add(chest);

/* heraldic cross emblem printed on the plate */
const emblemZ = 0.66;
const crossV = box(0.15, 0.82, 0.03, MAT.gold); crossV.position.set(0, 0.86, emblemZ); torso.add(crossV);
const crossH = box(0.56, 0.15, 0.03, MAT.gold); crossH.position.set(0, 0.98, emblemZ); torso.add(crossH);
const gem = new THREE.Mesh(new THREE.SphereGeometry(0.1, 20, 16), MAT.red);
gem.castShadow = true; gem.position.set(0, 0.98, emblemZ + 0.03); torso.add(gem);

/* belt + buckle */
const belt = box(1.56, 0.2, 1.04, MAT.gold); belt.position.set(0, 0.16, 0); torso.add(belt);
const buckle = box(0.24, 0.24, 0.06, MAT.silver); buckle.position.set(0, 0.16, 0.55); torso.add(buckle);

/* shoulder pauldrons + studs (stud-topped brick look) */
[-1, 1].forEach(s => {
  const pauld = box(0.5, 0.28, 0.9, MAT.silver);
  pauld.position.set(s * 0.72, torsoH - 0.12, 0);
  torso.add(pauld);
  const sd = stud(MAT.silver, 0.13, 0.09);
  sd.position.set(s * 0.72, torsoH + 0.02, 0.0);
  torso.add(sd);
});

/* ---- Neck + head ---- */
const neck = cyl(0.3, 0.32, 0.22, MAT.yellow, 24);
neck.position.set(0, torsoBaseY + torsoH + 0.05, 0);
knight.add(neck);

const head = cyl(0.55, 0.55, 0.8, MAT.yellow, 30);
head.position.set(0, torsoBaseY + torsoH + 0.5, 0);
knight.add(head);

/* ---- Cylindrical knight helmet (great helm) ---- */
const helmetGrp = new THREE.Group();
const helmCenterY = torsoBaseY + torsoH + 0.58;   // ~4.52
helmetGrp.position.set(0, helmCenterY, 0);
knight.add(helmetGrp);

const helmBody = cyl(0.66, 0.66, 0.98, MAT.helmet, 40);
helmetGrp.add(helmBody);
const helmTop = new THREE.Mesh(new THREE.SphereGeometry(0.66, 40, 20, 0, Math.PI * 2, 0, Math.PI / 2), MAT.helmet);
helmTop.castShadow = true; helmTop.position.y = 0.49; helmetGrp.add(helmTop);
const helmFlare = cyl(0.74, 0.7, 0.16, MAT.helmet, 40);
helmFlare.position.y = -0.46; helmetGrp.add(helmFlare);

/* visor slit + breathing holes */
const visor = box(0.96, 0.13, 0.06, MAT.visor);
visor.position.set(0, 0.06, 0.65); helmetGrp.add(visor);
for (let i = -2; i <= 2; i++) {
  const hole = box(0.05, 0.34, 0.06, MAT.visor);
  hole.position.set(i * 0.16, -0.28, 0.64);
  helmetGrp.add(hole);
}

/* crest holder + red plume */
const crestKnob = cyl(0.12, 0.12, 0.14, MAT.gold, 20);
crestKnob.position.set(0, 0.6, 0); helmetGrp.add(crestKnob);
const plume = new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.95, 18), MAT.red);
plume.castShadow = true;
plume.scale.set(1, 1, 0.42);
plume.position.set(0, 1.05, -0.12);
plume.rotation.x = 0.28;
helmetGrp.add(plume);

/* ---------------------------------------------------------------------------
   Arms + C-clip hands
--------------------------------------------------------------------------- */
function makeHand(mat) {
  const g = new THREE.Group();
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.072, 14, 26, Math.PI * 1.55), mat);
  ring.castShadow = true; ring.receiveShadow = true;
  ring.rotation.x = Math.PI / 2;   // vertical grip hole
  ring.rotation.y = Math.PI * 0.5;
  g.add(ring);
  const wrist = box(0.17, 0.18, 0.2, mat);
  wrist.position.set(0, 0.06, -0.16);
  g.add(wrist);
  return g;
}

// forearm tip offset (foreG at y=-0.7, rot.x=-0.75, forearm length 0.72)
const HAND_LOCAL = new THREE.Vector3(0, -1.227, 0.49);

function makeArm(side) {
  const arm = new THREE.Group();

  const upper = box(0.52, 0.72, 0.56, MAT.blue);
  upper.position.y = -0.36;
  arm.add(upper);

  // stud on top of the rectangular limb
  const sd = stud(MAT.blue, 0.13, 0.08);
  sd.position.set(0, 0.02, 0);
  arm.add(sd);

  const foreG = new THREE.Group();
  foreG.position.y = -0.7;
  foreG.rotation.x = -0.75;
  arm.add(foreG);

  const fore = box(0.48, 0.72, 0.5, MAT.blue);
  fore.position.y = -0.36;
  foreG.add(fore);
  const cuff = box(0.5, 0.14, 0.52, MAT.silver);
  cuff.position.y = -0.66;
  foreG.add(cuff);

  const hand = makeHand(MAT.yellow);
  hand.position.copy(HAND_LOCAL);
  arm.add(hand);

  arm.userData.hand = hand;
  return arm;
}

const shoulderY = torsoBaseY + torsoH - 0.28;   // ~3.66
const rightArm = makeArm(1);
rightArm.position.set(0.9, shoulderY, 0.0);
rightArm.rotation.z = -0.13;
knight.add(rightArm);

const leftArm = makeArm(-1);
leftArm.position.set(-0.9, shoulderY, 0.0);
leftArm.rotation.z = 0.13;
knight.add(leftArm);

/* ---------------------------------------------------------------------------
   Clip-on gray sword (held in right hand)
--------------------------------------------------------------------------- */
function makeSword() {
  const g = new THREE.Group();

  const grip = cyl(0.062, 0.062, 0.5, MAT.steel, 16);
  grip.position.y = 0.25; g.add(grip);

  const pommel = new THREE.Mesh(new THREE.SphereGeometry(0.095, 18, 14), MAT.steel);
  pommel.castShadow = true; pommel.position.y = -0.02; g.add(pommel);

  const guard = box(0.52, 0.09, 0.13, MAT.steel);
  guard.position.y = 0.52; g.add(guard);

  const bShape = new THREE.Shape();
  bShape.moveTo(-0.085, 0);
  bShape.lineTo(0.085, 0);
  bShape.lineTo(0.07, 1.15);
  bShape.lineTo(0, 1.42);
  bShape.lineTo(-0.07, 1.15);
  bShape.lineTo(-0.085, 0);
  const bGeo = new THREE.ExtrudeGeometry(bShape, {
    depth: 0.06, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 1
  });
  bGeo.translate(0, 0, -0.03);
  const blade = new THREE.Mesh(bGeo, MAT.steel);
  blade.castShadow = true; blade.receiveShadow = true;
  blade.position.y = 0.56;
  g.add(blade);

  return g;
}
const sword = makeSword();
sword.position.set(0, -0.2, 0.02);
sword.rotation.set(-0.12, 0, -0.08);
rightArm.userData.hand.add(sword);

/* ---------------------------------------------------------------------------
   Clip-on gray heater shield (held / mounted on left arm)
--------------------------------------------------------------------------- */
function makeShield() {
  const g = new THREE.Group();

  const s = new THREE.Shape();
  s.moveTo(-0.5, 0.6);
  s.lineTo(0.5, 0.6);
  s.lineTo(0.5, 0.15);
  s.quadraticCurveTo(0.5, -0.42, 0, -0.78);
  s.quadraticCurveTo(-0.5, -0.42, -0.5, 0.15);
  s.lineTo(-0.5, 0.6);
  const geo = new THREE.ExtrudeGeometry(s, {
    depth: 0.12, bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.04, bevelSegments: 2
  });
  geo.translate(0, 0, -0.06);
  const face = new THREE.Mesh(geo, MAT.steel);
  face.castShadow = true; face.receiveShadow = true;
  g.add(face);

  // heraldic cross + central boss
  const zf = 0.12;
  const cv = box(0.13, 1.0, 0.03, MAT.gold); cv.position.set(0, -0.05, zf); g.add(cv);
  const ch = box(0.7, 0.13, 0.03, MAT.gold);  ch.position.set(0, 0.18, zf);  g.add(ch);
  const boss = cyl(0.13, 0.15, 0.1, MAT.silver, 22);
  boss.rotation.x = Math.PI / 2; boss.position.set(0, 0.18, zf + 0.02); g.add(boss);

  // back clip bar
  const clip = box(0.16, 0.4, 0.12, MAT.silver);
  clip.position.set(0, 0.0, -0.14); g.add(clip);

  return g;
}
const shield = makeShield();
shield.position.set(-0.12, 0.18, 0.24);
shield.rotation.set(0.05, 0.18, 0.06);
leftArm.userData.hand.add(shield);

/* ---------------------------------------------------------------------------
   Add knight, center vertically
--------------------------------------------------------------------------- */
scene.add(knight);

/* ---------------------------------------------------------------------------
   Controls
--------------------------------------------------------------------------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.0;
controls.minDistance = 4.5;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.92;
controls.target.set(0, 2.65, 0);
controls.update();

/* ---------------------------------------------------------------------------
   Resize + render loop
--------------------------------------------------------------------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
