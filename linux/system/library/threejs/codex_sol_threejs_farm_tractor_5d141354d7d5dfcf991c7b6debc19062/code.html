<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Farm Tractor</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #b9d3e2; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb9d3e2);
scene.fog = new THREE.Fog(0xb9d3e2, 16, 34);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(-7.7, 5.1, 8.6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.25, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 5.5;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.48;

const hemi = new THREE.HemisphereLight(0xe8f6ff, 0x52613d, 2.1);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff0d2, 4.2);
sun.position.set(-6, 10, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -8;
sun.shadow.camera.right = 8;
sun.shadow.camera.top = 7;
sun.shadow.camera.bottom = -5;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 25;
sun.shadow.bias = -0.0003;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xb9d7ff, 1.0);
fill.position.set(7, 4, -6);
scene.add(fill);

const mats = {
  green: new THREE.MeshStandardMaterial({ color: 0x2f6d36, roughness: 0.58, metalness: 0.16 }),
  greenDark: new THREE.MeshStandardMaterial({ color: 0x1e4d29, roughness: 0.62, metalness: 0.18 }),
  yellow: new THREE.MeshStandardMaterial({ color: 0xe2ad24, roughness: 0.48, metalness: 0.16 }),
  steel: new THREE.MeshStandardMaterial({ color: 0x4d5558, roughness: 0.38, metalness: 0.72 }),
  darkSteel: new THREE.MeshStandardMaterial({ color: 0x23292a, roughness: 0.5, metalness: 0.58 }),
  tire: new THREE.MeshStandardMaterial({ color: 0x171817, roughness: 0.94, metalness: 0.01 }),
  rubber: new THREE.MeshStandardMaterial({ color: 0x101211, roughness: 0.82 }),
  seat: new THREE.MeshStandardMaterial({ color: 0x33251b, roughness: 0.88 }),
  red: new THREE.MeshStandardMaterial({ color: 0x8f241d, roughness: 0.55, metalness: 0.1 }),
  glass: new THREE.MeshStandardMaterial({ color: 0xfff0b0, emissive: 0xffbd44, emissiveIntensity: 0.55, roughness: 0.22 }),
  grille: new THREE.MeshStandardMaterial({ color: 0x141b18, roughness: 0.6, metalness: 0.48 }),
  ballast: new THREE.MeshStandardMaterial({ color: 0x687072, roughness: 0.76, metalness: 0.35 })
};

const tractor = new THREE.Group();
tractor.rotation.y = -0.06;
scene.add(tractor);

function mesh(geometry, material, position, rotation = [0, 0, 0], parent = tractor) {
  const m = new THREE.Mesh(geometry, material);
  m.position.set(...position);
  m.rotation.set(...rotation);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function box(size, material, position, rotation, parent) {
  return mesh(new THREE.BoxGeometry(...size), material, position, rotation, parent);
}

function cylinder(radiusTop, radiusBottom, height, segments, material, position, rotation, parent) {
  return mesh(new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments), material, position, rotation, parent);
}

function roundedBox(size, radius, material, position, parent = tractor) {
  const [w, h, d] = size;
  const shape = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  shape.moveTo(x + radius, y);
  shape.lineTo(x + w - radius, y);
  shape.quadraticCurveTo(x + w, y, x + w, y + radius);
  shape.lineTo(x + w, y + h - radius);
  shape.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
  shape.lineTo(x + radius, y + h);
  shape.quadraticCurveTo(x, y + h, x, y + h - radius);
  shape.lineTo(x, y + radius);
  shape.quadraticCurveTo(x, y, x + radius, y);
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: d,
    bevelEnabled: true,
    bevelSegments: 2,
    bevelSize: Math.min(radius * 0.35, 0.06),
    bevelThickness: 0.035,
    curveSegments: 8
  });
  geo.center();
  return mesh(geo, material, position, [0, Math.PI / 2, 0], parent);
}

function createWheel(x, y, z, radius, width, treadCount) {
  const group = new THREE.Group();
  group.position.set(x, y, z);
  tractor.add(group);

  const tire = mesh(
    new THREE.TorusGeometry(radius * 0.73, radius * 0.27, 16, 48),
    mats.tire, [0, 0, 0], [0, 0, 0], group
  );

  const sidewall = cylinder(radius * 0.78, radius * 0.78, width * 0.82, 40, mats.tire, [0, 0, 0], [Math.PI / 2, 0, 0], group);
  const rimOuter = cylinder(radius * 0.48, radius * 0.48, width * 0.9, 32, mats.yellow, [0, 0, 0], [Math.PI / 2, 0, 0], group);
  const rimInner = cylinder(radius * 0.29, radius * 0.29, width * 0.94, 24, mats.darkSteel, [0, 0, 0], [Math.PI / 2, 0, 0], group);
  const hub = cylinder(radius * 0.13, radius * 0.13, width * 1.12, 20, mats.steel, [0, 0, 0], [Math.PI / 2, 0, 0], group);

  for (let i = 0; i < treadCount; i++) {
    const a = i / treadCount * Math.PI * 2;
    const r = radius * 0.94;
    const tread = box(
      [radius * 0.23, radius * 0.13, width * 1.07],
      mats.tire,
      [Math.cos(a) * r, Math.sin(a) * r, 0],
      [0, (i % 2 ? 0.16 : -0.16), a + Math.PI / 2],
      group
    );
    tread.geometry.translate(0, 0, 0);
  }

  for (let i = 0; i < 8; i++) {
    const a = i / 8 * Math.PI * 2;
    cylinder(
      radius * 0.028, radius * 0.028, width * 1.17, 8, mats.steel,
      [Math.cos(a) * radius * 0.2, Math.sin(a) * radius * 0.2, 0],
      [Math.PI / 2, 0, 0], group
    );
  }
}

createWheel(1.25, 1.22, 1.03, 1.22, 0.58, 24);
createWheel(1.25, 1.22, -1.03, 1.22, 0.58, 24);
createWheel(-1.95, 0.70, 0.83, 0.70, 0.43, 18);
createWheel(-1.95, 0.70, -0.83, 0.70, 0.43, 18);

cylinder(0.14, 0.14, 2.15, 16, mats.darkSteel, [1.25, 1.22, 0], [Math.PI / 2, 0, 0]);
cylinder(0.12, 0.12, 1.72, 16, mats.darkSteel, [-1.95, 0.70, 0], [Math.PI / 2, 0, 0]);

box([3.5, 0.28, 0.73], mats.darkSteel, [-0.18, 0.88, 0]);
box([1.05, 0.22, 1.18], mats.greenDark, [0.95, 1.23, 0]);
box([0.42, 0.33, 0.78], mats.darkSteel, [1.15, 1.74, 0]);

roundedBox([2.35, 0.94, 1.08], 0.17, mats.green, [-0.82, 1.54]);
roundedBox([1.65, 0.20, 1.13], 0.08, mats.greenDark, [-0.98, 2.02]);

const noseShape = new THREE.Shape();
noseShape.moveTo(-0.45, -0.48);
noseShape.lineTo(0.35, -0.42);
noseShape.lineTo(0.43, 0.36);
noseShape.lineTo(0.18, 0.48);
noseShape.lineTo(-0.45, 0.48);
noseShape.closePath();
const noseGeo = new THREE.ExtrudeGeometry(noseShape, {
  depth: 1.02, bevelEnabled: true, bevelSize: 0.05, bevelThickness: 0.04, bevelSegments: 2
});
noseGeo.center();
mesh(noseGeo, mats.green, [-2.05, 1.54, 0], [0, Math.PI / 2, 0]);

box([0.065, 0.70, 0.78], mats.grille, [-2.49, 1.54, 0]);
for (let i = -3; i <= 3; i++) {
  box([0.075, 0.055, 0.70], mats.steel, [-2.535, 1.54 + i * 0.09, 0]);
}
for (const z of [-0.42, 0.42]) {
  cylinder(0.15, 0.15, 0.055, 24, mats.glass, [-2.50, 1.84, z], [0, 0, Math.PI / 2]);
  cylinder(0.18, 0.16, 0.11, 24, mats.greenDark, [-2.44, 1.84, z], [0, 0, Math.PI / 2]);
}

for (let i = 0; i < 4; i++) {
  box([0.24, 0.04, 0.018], mats.grille, [-1.35 + i * 0.27, 1.64, 0.556]);
  box([0.24, 0.04, 0.018], mats.grille, [-1.35 + i * 0.27, 1.64, -0.556]);
}

box([0.32, 0.50, 1.12], mats.ballast, [-2.82, 0.70, 0]);
box([0.42, 0.18, 1.28], mats.darkSteel, [-2.76, 0.96, 0]);
for (const z of [-0.42, 0, 0.42]) {
  box([0.14, 0.12, 0.28], mats.steel, [-3.02, 0.69, z]);
}

function fender(z, mirror) {
  const outer = 1.43, inner = 1.26;
  const start = 0.17, end = Math.PI - 0.17;
  const shape = new THREE.Shape();
  shape.moveTo(Math.cos(start) * outer, Math.sin(start) * outer);
  for (let i = 1; i <= 28; i++) {
    const a = start + (end - start) * i / 28;
    shape.lineTo(Math.cos(a) * outer, Math.sin(a) * outer);
  }
  for (let i = 28; i >= 0; i--) {
    const a = start + (end - start) * i / 28;
    shape.lineTo(Math.cos(a) * inner, Math.sin(a) * inner);
  }
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: 0.30, bevelEnabled: true, bevelSize: 0.035, bevelThickness: 0.025, bevelSegments: 2
  });
  geo.translate(0, 0, -0.15);
  mesh(geo, mats.green, [1.25, 1.22, z], [0, 0, 0]);
}
fender(0.79);
fender(-0.79);

box([1.25, 0.13, 0.56], mats.greenDark, [0.97, 2.39, 0]);
box([0.82, 0.20, 0.62], mats.seat, [1.12, 2.58, 0], [0, 0, -0.10]);
const seatBack = roundedBox([0.72, 0.73, 0.18], 0.14, mats.seat, [1.49, 2.91, 0]);
seatBack.rotation.z = -0.16;
box([0.10, 0.66, 0.10], mats.darkSteel, [1.33, 2.25, 0], [0, 0, -0.15]);

box([0.15, 0.62, 0.76], mats.greenDark, [0.46, 2.31, 0], [0, 0, -0.15]);
box([0.13, 0.18, 0.80], mats.grille, [0.40, 2.52, 0], [0, 0, -0.15]);

cylinder(0.045, 0.045, 0.70, 12, mats.darkSteel, [0.43, 2.82, 0], [0, 0, -0.42]);
const steering = new THREE.Group();
steering.position.set(0.28, 3.12, 0);
steering.rotation.y = Math.PI / 2;
steering.rotation.x = -0.40;
tractor.add(steering);
mesh(new THREE.TorusGeometry(0.29, 0.035, 10, 32), mats.rubber, [0, 0, 0], [0, 0, 0], steering);
cylinder(0.055, 0.055, 0.08, 12, mats.steel, [0, 0, 0], [Math.PI / 2, 0, 0], steering);
for (let i = 0; i < 3; i++) {
  const a = i * Math.PI * 2 / 3;
  box([0.24, 0.035, 0.035], mats.steel, [Math.cos(a) * 0.12, Math.sin(a) * 0.12, 0], [0, 0, a], steering);
}

cylinder(0.075, 0.075, 1.48, 16, mats.darkSteel, [-1.32, 2.73, -0.30]);
cylinder(0.12, 0.085, 0.22, 16, mats.darkSteel, [-1.32, 3.52, -0.30]);
cylinder(0.11, 0.11, 0.08, 16, mats.steel, [-1.32, 3.66, -0.30]);

cylinder(0.08, 0.08, 0.55, 16, mats.darkSteel, [-0.70, 2.38, 0.34]);
cylinder(0.14, 0.14, 0.30, 20, mats.darkSteel, [-0.70, 2.77, 0.34]);
cylinder(0.18, 0.13, 0.12, 20, mats.darkSteel, [-0.70, 2.98, 0.34]);

for (const z of [-0.55, 0.55]) {
  box([0.75, 0.08, 0.25], mats.darkSteel, [0.63, 1.56, z]);
  box([0.48, 0.07, 0.30], mats.steel, [0.72, 1.38, z]);
}
for (const z of [-0.73, 0.73]) {
  box([0.38, 0.06, 0.18], mats.darkSteel, [1.24, 1.58, z], [0, 0, -0.10]);
}

cylinder(0.09, 0.09, 0.82, 12, mats.greenDark, [-1.95, 1.22, 0], [Math.PI / 2, 0, 0]);
box([0.14, 0.42, 0.12], mats.greenDark, [-1.95, 1.43, 0]);
box([0.52, 0.08, 0.16], mats.darkSteel, [-1.95, 1.62, 0]);

const groundMat = new THREE.MeshStandardMaterial({ color: 0x81915a, roughness: 0.96 });
const ground = mesh(new THREE.CircleGeometry(18, 96), groundMat, [0, -0.015, 0], [-Math.PI / 2, 0, 0], scene);
ground.receiveShadow = true;
ground.castShadow = false;

const rings = new THREE.Group();
scene.add(rings);
for (let i = 0; i < 34; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = 4 + Math.random() * 12;
  const blade = box(
    [0.025, 0.12 + Math.random() * 0.18, 0.025],
    new THREE.MeshStandardMaterial({ color: Math.random() > 0.5 ? 0x657847 : 0x90a366, roughness: 1 }),
    [Math.cos(a) * r, 0.07, Math.sin(a) * r],
    [Math.random() * 0.18, a, Math.random() * 0.16],
    rings
  );
  blade.castShadow = false;
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
