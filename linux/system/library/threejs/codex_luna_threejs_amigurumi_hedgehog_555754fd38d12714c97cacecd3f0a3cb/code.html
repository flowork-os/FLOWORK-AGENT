<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amigurumi Hedgehog</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #eadcc8; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeadcc8);
scene.fog = new THREE.Fog(0xeadcc8, 7, 14);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.05, 6.6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 4.2;
controls.maxDistance = 9;
controls.target.set(0, 0.15, 0);

scene.add(new THREE.HemisphereLight(0xfff7e9, 0x755441, 2.1));

const keyLight = new THREE.DirectionalLight(0xfff1d6, 3.4);
keyLight.position.set(-4, 6, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -4;
keyLight.shadow.camera.right = 4;
keyLight.shadow.camera.top = 5;
keyLight.shadow.camera.bottom = -4;
scene.add(keyLight);

const rimLight = new THREE.PointLight(0xb97950, 2.2, 8);
rimLight.position.set(3, 2.2, -3);
scene.add(rimLight);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(4.5, 64),
  new THREE.MeshStandardMaterial({ color: 0xd9c2a7, roughness: 0.95 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1.18;
floor.receiveShadow = true;
scene.add(floor);

const hedgehog = new THREE.Group();
hedgehog.position.y = 0.12;
scene.add(hedgehog);

const brown = new THREE.MeshStandardMaterial({
  color: 0x75452e,
  roughness: 0.92,
  metalness: 0
});
const darkBrown = new THREE.MeshStandardMaterial({
  color: 0x4e2b20,
  roughness: 0.96
});
const oatmeal = new THREE.MeshStandardMaterial({
  color: 0xd8b98d,
  roughness: 0.98
});
const oatmealLight = new THREE.MeshStandardMaterial({
  color: 0xe7cba2,
  roughness: 0.95
});
const caramel = new THREE.MeshStandardMaterial({
  color: 0xb87343,
  roughness: 0.9
});
const goldenBrown = new THREE.MeshStandardMaterial({
  color: 0x99603a,
  roughness: 0.92
});
const blackGloss = new THREE.MeshStandardMaterial({
  color: 0x090706,
  roughness: 0.13,
  metalness: 0.15
});

const body = new THREE.Mesh(
  new THREE.SphereGeometry(1, 48, 32),
  brown
);
body.scale.set(1.48, 1.13, 1.55);
body.position.y = 0.02;
body.castShadow = true;
body.receiveShadow = true;
hedgehog.add(body);

const belly = new THREE.Mesh(
  new THREE.SphereGeometry(1, 48, 32),
  darkBrown
);
belly.scale.set(1.12, 0.88, 0.82);
belly.position.set(0, -0.05, 0.48);
belly.castShadow = true;
hedgehog.add(belly);

const face = new THREE.Mesh(
  new THREE.SphereGeometry(1, 64, 40),
  oatmeal
);
face.scale.set(1.08, 0.91, 0.72);
face.position.set(0, 0.24, 1.16);
face.castShadow = true;
face.receiveShadow = true;
hedgehog.add(face);

const muzzle = new THREE.Mesh(
  new THREE.SphereGeometry(1, 40, 24),
  oatmealLight
);
muzzle.scale.set(0.72, 0.53, 0.34);
muzzle.position.set(0, 0.01, 1.72);
muzzle.castShadow = true;
hedgehog.add(muzzle);

function addSphere(material, position, scale) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 20), material);
  mesh.position.copy(position);
  mesh.scale.copy(scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  hedgehog.add(mesh);
  return mesh;
}

addSphere(oatmeal, new THREE.Vector3(-0.88, 0.7, 0.93), new THREE.Vector3(0.31, 0.39, 0.18));
addSphere(oatmeal, new THREE.Vector3(0.88, 0.7, 0.93), new THREE.Vector3(0.31, 0.39, 0.18));
addSphere(darkBrown, new THREE.Vector3(-0.88, 0.7, 1.08), new THREE.Vector3(0.19, 0.25, 0.08));
addSphere(darkBrown, new THREE.Vector3(0.88, 0.7, 1.08), new THREE.Vector3(0.19, 0.25, 0.08));

const leftEye = addSphere(blackGloss, new THREE.Vector3(-0.39, 0.61, 1.77), new THREE.Vector3(0.105, 0.125, 0.075));
const rightEye = addSphere(blackGloss, new THREE.Vector3(0.39, 0.61, 1.77), new THREE.Vector3(0.105, 0.125, 0.075));

const eyeSpark = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  roughness: 0.06,
  metalness: 0.05
});
addSphere(eyeSpark, new THREE.Vector3(-0.425, 0.665, 1.828), new THREE.Vector3(0.028, 0.035, 0.018));
addSphere(eyeSpark, new THREE.Vector3(0.355, 0.665, 1.828), new THREE.Vector3(0.028, 0.035, 0.018));

addSphere(blackGloss, new THREE.Vector3(0, 0.13, 2.08), new THREE.Vector3(0.19, 0.16, 0.16));

const smileCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-0.27, -0.08, 2.035),
  new THREE.Vector3(-0.16, -0.19, 2.065),
  new THREE.Vector3(0, -0.22, 2.075),
  new THREE.Vector3(0.16, -0.19, 2.065),
  new THREE.Vector3(0.27, -0.08, 2.035)
]);
const smile = new THREE.Mesh(
  new THREE.TubeGeometry(smileCurve, 24, 0.021, 8, false),
  darkBrown
);
smile.castShadow = true;
hedgehog.add(smile);

function addPaw(x, y, z, rotationY) {
  const paw = new THREE.Mesh(
    new THREE.SphereGeometry(1, 32, 22),
    oatmeal
  );
  paw.position.set(x, y, z);
  paw.scale.set(0.34, 0.25, 0.43);
  paw.rotation.y = rotationY;
  paw.castShadow = true;
  paw.receiveShadow = true;
  hedgehog.add(paw);

  const pad = new THREE.Mesh(
    new THREE.SphereGeometry(1, 24, 16),
    darkBrown
  );
  pad.position.set(x, y - 0.02, z + 0.36);
  pad.scale.set(0.17, 0.11, 0.07);
  pad.castShadow = true;
  hedgehog.add(pad);
}

addPaw(-0.82, -0.68, 1.02, -0.22);
addPaw(0.82, -0.68, 1.02, 0.22);
addPaw(-1.05, -0.53, 0.23, -0.55);
addPaw(1.05, -0.53, 0.23, 0.55);

function seededRandom(seed) {
  const value = Math.sin(seed * 12.9898) * 43758.5453;
  return value - Math.floor(value);
}

const stitchRecords = [];
let stitchIndex = 0;

for (let row = 0; row < 9; row++) {
  const y = 0.98 - row * 0.235;
  const vertical = Math.max(0.18, Math.sqrt(Math.max(0, 1 - (y / 1.13) ** 2)));
  const count = 17 + (row % 3);
  for (let col = 0; col < count; col++) {
    let azimuth = -Math.PI + (col / count) * Math.PI * 2;
    azimuth += (row % 2) * 0.105;
    const xBase = 1.48 * vertical * Math.cos(azimuth);
    const zBase = 1.55 * vertical * Math.sin(azimuth);
    if (zBase > 0.46 && Math.abs(xBase) < 0.92) continue;

    const jitter = seededRandom(++stitchIndex) - 0.5;
    const localY = y + jitter * 0.075;
    const radial = new THREE.Vector3(xBase / 1.48, localY / 1.13, zBase / 1.55).normalize();
    const position = new THREE.Vector3(
      xBase + radial.x * 0.1,
      localY + radial.y * 0.1,
      zBase + radial.z * 0.1
    );
    const scale = 0.105 + seededRandom(++stitchIndex) * 0.035;
    stitchRecords.push({
      position,
      normal: radial,
      scale,
      materialIndex: stitchIndex % 7 < 3 ? 0 : (stitchIndex % 7 < 5 ? 1 : 2)
    });
  }
}

for (let top = 0; top < 22; top++) {
  const a = -Math.PI + (top / 22) * Math.PI * 2;
  const x = 1.18 * Math.cos(a);
  const z = 0.38 + 0.52 * Math.sin(a);
  const y = 1.04 + 0.08 * Math.cos(a * 2);
  const normal = new THREE.Vector3(x / 1.48, y / 1.13, z / 1.55).normalize();
  stitchRecords.push({
    position: new THREE.Vector3(x + normal.x * 0.1, y + normal.y * 0.1, z + normal.z * 0.1),
    normal,
    scale: 0.12,
    materialIndex: top % 3
  });
}

const stitchMaterials = [brown, caramel, goldenBrown];
const bobbleGeometry = new THREE.SphereGeometry(1, 16, 12);
const loopGeometry = new THREE.TorusGeometry(0.105, 0.027, 7, 14);
const bobbleGroups = [[], [], []];

for (const record of stitchRecords) {
  bobbleGroups[record.materialIndex].push(record);
}

for (let materialIndex = 0; materialIndex < bobbleGroups.length; materialIndex++) {
  const records = bobbleGroups[materialIndex];
  const bobbles = new THREE.InstancedMesh(bobbleGeometry, stitchMaterials[materialIndex], records.length);
  const loops = new THREE.InstancedMesh(loopGeometry, stitchMaterials[materialIndex], records.length);
  bobbles.castShadow = true;
  bobbles.receiveShadow = true;
  loops.castShadow = true;
  loops.receiveShadow = true;

  const bobbleMatrix = new THREE.Matrix4();
  const loopMatrix = new THREE.Matrix4();
  const bobbleQuaternion = new THREE.Quaternion();
  const loopQuaternion = new THREE.Quaternion();

  for (let i = 0; i < records.length; i++) {
    const record = records[i];
    bobbleQuaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), record.normal);
    bobbleMatrix.compose(
      record.position,
      bobbleQuaternion,
      new THREE.Vector3(record.scale * 1.05, record.scale * 0.86, record.scale)
    );
    bobbles.setMatrixAt(i, bobbleMatrix);

    loopQuaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), record.normal);
    loopMatrix.compose(
      record.position.clone().add(record.normal.clone().multiplyScalar(0.055)),
      loopQuaternion,
      new THREE.Vector3(1.05, 0.78, 1.0)
    );
    loops.setMatrixAt(i, loopMatrix);
  }

  bobbles.instanceMatrix.needsUpdate = true;
  loops.instanceMatrix.needsUpdate = true;
  hedgehog.add(bobbles);
  hedgehog.add(loops);
}

function addRaisedRound(side, height, radius) {
  const points = [];
  for (let i = 0; i <= 36; i++) {
    const t = i / 36;
    const angle = -2.7 + t * 2.25;
    const x = side * (1.25 + 0.11 * Math.sin(t * Math.PI)) * Math.cos(angle);
    const z = -0.43 + radius * Math.sin(angle);
    const y = height + 0.11 * Math.sin(t * Math.PI * 1.3);
    points.push(new THREE.Vector3(x, y, z));
  }
  const roundCurve = new THREE.CatmullRomCurve3(points);
  const round = new THREE.Mesh(
    new THREE.TubeGeometry(roundCurve, 40, 0.026, 7, false),
    caramel
  );
  round.castShadow = true;
  hedgehog.add(round);
}

addRaisedRound(-1, 0.72, 0.78);
addRaisedRound(1, 0.39, 0.92);
addRaisedRound(-1, 0.03, 1.02);

const groundShadow = new THREE.Mesh(
  new THREE.CircleGeometry(1.65, 48),
  new THREE.MeshBasicMaterial({ color: 0x8d6048, transparent: true, opacity: 0.13 })
);
groundShadow.rotation.x = -Math.PI / 2;
groundShadow.scale.set(1.15, 0.52, 1);
groundShadow.position.set(0, -1.165, 0.08);
scene.add(groundShadow);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
