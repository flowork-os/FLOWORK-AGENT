<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============ 1. CONFIG, PALETTE & SCENE CONSTANTS ====================== */
const SEED = 73412;
const ROOM = { w: 16, d: 14, h: 6.4, wall: 0.3 };        // loft shell, metres
const HAZE = 0xf6ead6;                                   // warm cream atmosphere
const PIGMENT = ['#d94f3d', '#f0a02e', '#2f7fc4', '#4aa367',
                 '#e8d34a', '#7d55b5', '#e07fa8', '#1f9a9c', '#c8452f'];
const WIN = { z: [-4.6, 0, 4.6], w: 3.0, y0: 1.05, y1: 4.85 };
const SKY_L = { cx: -2.2, cz: -1.0, w: 6.4, d: 3.0 };    // skylight opening
const SUN_DIR = new THREE.Vector3(5.6, -3.1, -1.7);      // shaft travel direction

// animation registries, filled by the builders
const drapes = [], shafts = [], swingers = [], leafSets = [];
let turntable = null, motes = null, motesBase = null;

/* ============ 2. SEEDED PRNG & GEOMETRY HELPERS ========================= */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(SEED);
const rr = (a, b) => a + rand() * (b - a);
const ri = (a, b) => Math.floor(rr(a, b + 1));
const pick = (arr) => arr[Math.floor(rand() * arr.length)];

function shad(m, c = true, r = true) { m.castShadow = c; m.receiveShadow = r; return m; }
function box(w, h, d, mat) { return shad(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat)); }
function cyl(rt, rb, h, mat, seg = 14) { return shad(new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat)); }
function sph(r, mat, seg = 18) { return shad(new THREE.Mesh(new THREE.SphereGeometry(r, seg, Math.round(seg * 0.7)), mat)); }
function at(o, x, y, z) { o.position.set(x, y, z); return o; }
function canvas2d(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function toTex(c, rx = 1, ry = 1) {
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry); t.anisotropy = 4;
  return t;
}

/* ============ 3. PROCEDURAL CANVAS TEXTURES ============================= */
function makeFloorTex() {                                  // splattered pine boards
  const [c, g] = canvas2d(1024, 1024), planks = 12, ph = 1024 / planks;
  for (let i = 0; i < planks; i++) {
    const y = i * ph, v = rr(-16, 16);
    g.fillStyle = `rgb(${198 + v},${154 + v},${106 + v * 0.8})`; g.fillRect(0, y, 1024, ph - 2);
    g.fillStyle = 'rgba(88,58,30,0.42)'; g.fillRect(0, y + ph - 3, 1024, 3);
    for (let k = 0; k < 22; k++) {                         // grain streaks
      g.strokeStyle = `rgba(112,76,40,${rr(0.05, 0.17)})`; g.lineWidth = rr(0.6, 2.4);
      const gy = y + rr(4, ph - 6); g.beginPath(); g.moveTo(0, gy);
      for (let x = 0; x <= 1024; x += 64) g.lineTo(x, gy + Math.sin(x * 0.011 + k) * rr(0.6, 2.6));
      g.stroke();
    }
    g.fillStyle = 'rgba(78,50,26,0.45)'; g.fillRect(rr(140, 880), y, 3, ph - 3);
  }
  for (let i = 0; i < 120; i++) {                          // dropped paint and spatter
    const x = rr(0, 1024), y = rr(0, 1024), r = rr(5, 26);
    g.globalAlpha = rr(0.22, 0.62); g.fillStyle = pick(PIGMENT);
    g.beginPath(); g.ellipse(x, y, r, r * rr(0.6, 1.15), rr(0, 6.28), 0, Math.PI * 2); g.fill();
    for (let d = 0; d < 4; d++) {
      const s = r * rr(0.1, 0.32);
      g.beginPath(); g.ellipse(x + rr(-1.7, 1.7) * r, y + rr(-1.7, 1.7) * r, s, s, 0, 0, Math.PI * 2); g.fill();
    }
  }
  g.globalAlpha = 1;
  return toTex(c, 3, 3);
}
function makeBrickTex() {
  const [c, g] = canvas2d(512, 512), rows = 13, bh = 512 / rows, bw = 118;
  g.fillStyle = '#a2917f'; g.fillRect(0, 0, 512, 512);     // mortar bed
  for (let r = 0; r < rows; r++) {
    const off = (r % 2) ? bw * 0.5 : 0;
    for (let x = -bw; x < 512 + bw; x += bw + 6) {
      const v = rr(-26, 26);
      g.fillStyle = `rgb(${152 + v},${78 + v * 0.6},${62 + v * 0.5})`; g.fillRect(x + off + 3, r * bh + 3, bw - 6, bh - 6);
      g.fillStyle = `rgba(255,238,218,${rr(0.03, 0.12)})`; g.fillRect(x + off + 3, r * bh + 3, bw - 6, 3);
    }
  }
  for (let i = 0; i < 700; i++) {                          // soot speckle
    g.fillStyle = `rgba(60,40,30,${rr(0.02, 0.09)})`;
    const s = rr(1, 5); g.fillRect(rr(0, 512), rr(0, 512), s, s);
  }
  return toTex(c, 3.4, 1.6);
}
function makePlasterTex() {
  const [c, g] = canvas2d(512, 512);
  g.fillStyle = '#f0e5d2'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 900; i++) {
    g.fillStyle = `rgba(${ri(185, 240)},${ri(172, 224)},${ri(150, 202)},${rr(0.05, 0.24)})`;
    const s = rr(2, 13); g.fillRect(rr(0, 512), rr(0, 512), s, s);
  }
  for (let i = 0; i < 16; i++) {                            // hairline cracks
    g.strokeStyle = `rgba(148,128,108,${rr(0.06, 0.2)})`; g.lineWidth = rr(0.6, 1.6);
    let x = rr(0, 512), y = rr(0, 512); g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 5; k++) { x += rr(-40, 40); y += rr(12, 52); g.lineTo(x, y); }
    g.stroke();
  }
  return toTex(c, 2.2, 1.4);
}
function makeArtTex(kind) {                                 // painterly canvas faces
  const [c, g] = canvas2d(512, 640);
  g.fillStyle = '#f2e8d5'; g.fillRect(0, 0, 512, 640);
  for (let i = 0; i < 640; i += 4) { g.fillStyle = 'rgba(198,182,158,0.22)'; g.fillRect(0, i, 512, 1); }
  for (let i = 0; i < 512; i += 4) { g.fillStyle = 'rgba(198,182,158,0.16)'; g.fillRect(i, 0, 1, 640); }
  if (kind === 'wip') {                                     // half-finished study
    g.strokeStyle = 'rgba(92,80,68,0.55)'; g.lineWidth = 2.4;
    for (let i = 0; i < 9; i++) { g.beginPath(); g.ellipse(rr(90, 430), rr(120, 520), rr(34, 112), rr(44, 126), rr(0, 3.1), 0, Math.PI * 2); g.stroke(); }
    for (let i = 0; i < 76; i++) {                          // colour laid in on the left only
      g.globalAlpha = rr(0.5, 0.95); g.fillStyle = pick(PIGMENT);
      g.beginPath(); g.ellipse(rr(-20, 318), rr(0, 640), rr(14, 56), rr(10, 42), rr(0, 3.1), 0, Math.PI * 2); g.fill();
    }
  } else if (kind === 'land') {                             // small landscape
    const sky = g.createLinearGradient(0, 0, 0, 640);
    sky.addColorStop(0, '#8fc4e8'); sky.addColorStop(0.55, '#e2ecef'); sky.addColorStop(1, '#8fae62');
    g.fillStyle = sky; g.fillRect(0, 0, 512, 640);
    g.fillStyle = '#63819c'; g.beginPath(); g.moveTo(0, 360); g.lineTo(140, 224); g.lineTo(268, 366);
    g.lineTo(382, 246); g.lineTo(512, 382); g.lineTo(512, 640); g.lineTo(0, 640); g.closePath(); g.fill();
    for (let i = 0; i < 90; i++) {
      g.globalAlpha = rr(0.25, 0.72); g.fillStyle = pick(['#7ea45c', '#4d7a3f', '#c9b45e', '#e0a54a']);
      g.beginPath(); g.ellipse(rr(0, 512), rr(376, 640), rr(10, 42), rr(6, 20), 0, 0, Math.PI * 2); g.fill();
    }
  } else {                                                  // bold abstract
    for (let i = 0; i < 48; i++) {
      g.globalAlpha = rr(0.45, 0.95); g.fillStyle = pick(PIGMENT);
      if (rand() < 0.5) g.fillRect(rr(-30, 420), rr(-30, 560), rr(44, 152), rr(30, 124));
      else { g.beginPath(); g.ellipse(rr(0, 512), rr(0, 640), rr(22, 92), rr(20, 82), rr(0, 3.1), 0, Math.PI * 2); g.fill(); }
    }
  }
  for (let i = 0; i < 54; i++) {                            // impasto highlights
    g.globalAlpha = rr(0.18, 0.6); g.fillStyle = rand() < 0.5 ? '#ffffff' : '#2b2118';
    g.fillRect(rr(0, 512), rr(0, 640), rr(3, 17), rr(3, 11));
  }
  g.globalAlpha = 1;
  return toTex(c);
}
function makeSkyTex() {
  const [c, g] = canvas2d(256, 512), gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, '#b6dcf4'); gr.addColorStop(0.5, '#eef4f2'); gr.addColorStop(1, '#fdf2d8');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 512);
  for (let i = 0; i < 26; i++) {                            // soft cloud banks
    g.globalAlpha = rr(0.12, 0.4); g.fillStyle = '#ffffff';
    g.beginPath(); g.ellipse(rr(0, 256), rr(20, 320), rr(22, 74), rr(9, 28), 0, 0, Math.PI * 2); g.fill();
  }
  g.globalAlpha = 1;
  return toTex(c);
}
function makeClothTex(base) {
  const [c, g] = canvas2d(256, 256);
  g.fillStyle = base; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 256; i += 3) {                        // linen weave
    g.fillStyle = 'rgba(255,255,255,0.07)'; g.fillRect(0, i, 256, 1);
    g.fillStyle = 'rgba(0,0,0,0.05)'; g.fillRect(i, 0, 1, 256);
  }
  for (let i = 0; i < 24; i++) {
    g.globalAlpha = rr(0.08, 0.3); g.fillStyle = pick(PIGMENT);
    g.beginPath(); g.ellipse(rr(0, 256), rr(0, 256), rr(3, 17), rr(3, 13), 0, 0, Math.PI * 2); g.fill();
  }
  g.globalAlpha = 1;
  return toTex(c, 2, 2);
}
function makeSketchTex() {
  const [c, g] = canvas2d(256, 320);
  g.fillStyle = '#f7f0e2'; g.fillRect(0, 0, 256, 320); g.strokeStyle = 'rgba(72,62,52,0.62)';
  for (let i = 0; i < 13; i++) {                            // scribbled charcoal studies
    g.lineWidth = rr(1, 3); let x = rr(30, 220), y = rr(30, 290); g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 4; k++) { x += rr(-52, 52); y += rr(-46, 46); g.lineTo(x, y); }
    g.stroke();
  }
  g.lineWidth = 2.2; g.beginPath(); g.ellipse(128, 142, 50, 66, 0, 0, Math.PI * 2); g.stroke();
  return toTex(c);
}
function makeRadialTex(inner, mid) {
  const [c, g] = canvas2d(256, 256), gr = g.createRadialGradient(128, 128, 2, 128, 128, 126);
  gr.addColorStop(0, inner); gr.addColorStop(0.42, mid); gr.addColorStop(1, 'rgba(255,214,150,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ============ 4. MATERIAL PALETTE (single definition point) ============= */
const ART = { wip: makeArtTex('wip'), ab1: makeArtTex('ab'), ab2: makeArtTex('ab'), land: makeArtTex('land') };
const SKY_TEX = makeSkyTex();
const MAT = {
  floor:    new THREE.MeshStandardMaterial({ map: makeFloorTex(), roughness: 0.86, metalness: 0.02 }),
  brick:    new THREE.MeshStandardMaterial({ map: makeBrickTex(), roughness: 0.95 }),
  plaster:  new THREE.MeshStandardMaterial({ map: makePlasterTex(), roughness: 0.98 }),
  beam:     new THREE.MeshStandardMaterial({ color: 0x8a6440, roughness: 0.88 }),
  trim:     new THREE.MeshStandardMaterial({ color: 0xe6dcc6, roughness: 0.8 }),
  woodLt:   new THREE.MeshStandardMaterial({ color: 0xc79a63, roughness: 0.72 }),
  woodDk:   new THREE.MeshStandardMaterial({ color: 0x8a6238, roughness: 0.76 }),
  iron:     new THREE.MeshStandardMaterial({ color: 0x38342e, roughness: 0.52, metalness: 0.72 }),
  metal:    new THREE.MeshStandardMaterial({ color: 0xb9bcc0, roughness: 0.34, metalness: 0.85 }),
  brass:    new THREE.MeshStandardMaterial({ color: 0xc79a3e, roughness: 0.3, metalness: 0.9 }),
  rubber:   new THREE.MeshStandardMaterial({ color: 0x2a2725, roughness: 0.95 }),
  glass:    new THREE.MeshBasicMaterial({ map: SKY_TEX, side: THREE.DoubleSide, toneMapped: false }),
  jar:      new THREE.MeshStandardMaterial({ color: 0xcfe3e0, roughness: 0.16, metalness: 0.05,
              transparent: true, opacity: 0.55 }),
  cart:     new THREE.MeshStandardMaterial({ color: 0xcf4a3c, roughness: 0.44 }),
  clay:     new THREE.MeshStandardMaterial({ color: 0xc0785a, roughness: 0.94 }),
  canvasW:  new THREE.MeshStandardMaterial({ color: 0xf1e7d4, roughness: 0.94 }),
  tube:     new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.45, metalness: 0.25 }),
  paper:    new THREE.MeshStandardMaterial({ map: makeSketchTex(), roughness: 0.95, side: THREE.DoubleSide }),
  leaf:     new THREE.MeshStandardMaterial({ color: 0x5f9550, roughness: 0.8, side: THREE.DoubleSide }),
  terracot: new THREE.MeshStandardMaterial({ color: 0xb1633f, roughness: 0.9 }),
  shade:    new THREE.MeshStandardMaterial({ color: 0x2e2a26, roughness: 0.7, side: THREE.DoubleSide }),
  bulb:     new THREE.MeshStandardMaterial({ color: 0xfff0c8, emissive: 0xffcf86, emissiveIntensity: 2.6 }),
  pool:     new THREE.MeshBasicMaterial({ map: makeRadialTex('rgba(255,238,200,0.95)', 'rgba(255,224,168,0.4)'),
              transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.3, toneMapped: false }),
  shaft:    new THREE.MeshBasicMaterial({ color: 0xfff1d2, transparent: true, opacity: 0.035,
              blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false }),
  mote:     new THREE.PointsMaterial({ map: makeRadialTex('rgba(255,247,226,1)', 'rgba(255,238,200,0.5)'),
              size: 0.085, transparent: true, opacity: 0.9, depthWrite: false,
              blending: THREE.AdditiveBlending, sizeAttenuation: true, toneMapped: false })
};
const CLOTH = ['#efe3cd', '#e7c99a', '#d9a9a2', '#cdd8c6'].map(hex =>
  new THREE.MeshStandardMaterial({ map: makeClothTex(hex), roughness: 0.97, side: THREE.DoubleSide }));

/* ============ 5. BUILDER FUNCTIONS ====================================== */
function buildRoomShell() {
  const g = new THREE.Group();
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.d), MAT.floor);
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; g.add(floor);
  g.add(at(box(ROOM.w + ROOM.wall * 2, ROOM.h, ROOM.wall, MAT.brick), 0, ROOM.h / 2, -ROOM.d / 2 - ROOM.wall / 2));
  g.add(at(box(ROOM.w, 0.36, 0.15, MAT.trim), 0, 0.18, -ROOM.d / 2 + 0.075));
  for (const z of [-6.1, -4.4, -2.7]) {                    // exposed ceiling joists
    g.add(at(box(ROOM.w + 0.8, 0.44, 0.3, MAT.beam), 0, ROOM.h - 0.32, z));
  }
  g.add(at(box(ROOM.w + 0.8, 0.5, 0.36, MAT.beam), 0, ROOM.h - 0.32, -ROOM.d / 2 + 0.22));
  g.add(at(box(ROOM.w, 0.34, 0.34, MAT.beam), 0, ROOM.h - 1.05, -1.6));   // drape beam
  return g;
}

function buildWindowWall() {
  const g = new THREE.Group();
  const X = -ROOM.w / 2, hh = WIN.y1 - WIN.y0;
  g.add(at(box(ROOM.wall, WIN.y0, ROOM.d, MAT.plaster), X - ROOM.wall / 2, WIN.y0 / 2, 0));
  g.add(at(box(ROOM.wall, ROOM.h - WIN.y1, ROOM.d, MAT.plaster), X - ROOM.wall / 2, (ROOM.h + WIN.y1) / 2, 0));
  const edges = [-ROOM.d / 2, WIN.z[0] - WIN.w / 2, WIN.z[0] + WIN.w / 2, WIN.z[1] - WIN.w / 2,
                 WIN.z[1] + WIN.w / 2, WIN.z[2] - WIN.w / 2, WIN.z[2] + WIN.w / 2, ROOM.d / 2];
  for (let i = 0; i < edges.length; i += 2) {              // piers between openings
    const a = edges[i], b = edges[i + 1];
    g.add(at(box(ROOM.wall, hh, b - a, MAT.plaster), X - ROOM.wall / 2, (WIN.y0 + WIN.y1) / 2, (a + b) / 2));
  }
  for (const zc of WIN.z) {
    const glass = new THREE.Mesh(new THREE.PlaneGeometry(WIN.w, hh), MAT.glass);
    glass.rotation.y = Math.PI / 2; g.add(at(glass, X - 0.06, (WIN.y0 + WIN.y1) / 2, zc));
    g.add(at(box(0.18, 0.15, WIN.w + 0.24, MAT.iron), X, WIN.y0 - 0.03, zc));
    g.add(at(box(0.18, 0.15, WIN.w + 0.24, MAT.iron), X, WIN.y1 + 0.03, zc));
    for (const s of [-1, 1]) g.add(at(box(0.18, hh + 0.3, 0.15, MAT.iron), X, (WIN.y0 + WIN.y1) / 2, zc + s * (WIN.w / 2 + 0.07)));
    for (const s of [-1, 1]) g.add(at(box(0.14, hh, 0.09, MAT.iron), X, (WIN.y0 + WIN.y1) / 2, zc + s * WIN.w / 6));
    for (let k = 1; k <= 4; k++) g.add(at(box(0.14, 0.08, WIN.w, MAT.iron), X, WIN.y0 + hh * k / 5, zc));
    g.add(at(box(0.56, 0.16, WIN.w + 0.6, MAT.trim), X + 0.16, WIN.y0 - 0.12, zc));
  }
  const rad = new THREE.Group();                            // cast-iron radiator
  for (let i = 0; i < 11; i++) rad.add(at(cyl(0.075, 0.075, 0.86, MAT.metal, 10), 0, 0.43, -0.75 + i * 0.15));
  for (const y of [0.08, 0.82]) {
    const bar = cyl(0.05, 0.05, 1.7, MAT.metal, 10);
    bar.rotation.x = Math.PI / 2; rad.add(at(bar, 0, y, 0));
  }
  rad.position.set(-ROOM.w / 2 + 0.42, 0, WIN.z[1]); g.add(rad);
  return g;
}

function buildSkylight() {
  const g = new THREE.Group();
  const y = ROOM.h - 0.06, hw = SKY_L.w / 2, hd = SKY_L.d / 2;
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(SKY_L.w, SKY_L.d), MAT.glass);
  glass.rotation.x = Math.PI / 2; glass.position.set(SKY_L.cx, y, SKY_L.cz); g.add(glass);
  for (const s of [-1, 1]) {                                // curb + frame
    g.add(at(box(SKY_L.w + 0.5, 0.34, 0.26, MAT.trim), SKY_L.cx, y - 0.16, SKY_L.cz + s * (hd + 0.1)));
    g.add(at(box(0.26, 0.34, SKY_L.d + 0.2, MAT.trim), SKY_L.cx + s * (hw + 0.12), y - 0.16, SKY_L.cz));
  }
  for (let k = -1; k <= 1; k++) g.add(at(box(0.11, 0.13, SKY_L.d, MAT.iron), SKY_L.cx + k * 2.05, y - 0.08, SKY_L.cz));
  g.add(at(box(SKY_L.w, 0.11, 0.11, MAT.iron), SKY_L.cx, y - 0.08, SKY_L.cz));
  const beam = new THREE.Mesh(new THREE.BoxGeometry(SKY_L.w * 0.82, SKY_L.d * 0.8, 7.0), MAT.shaft);
  beam.rotation.set(Math.PI / 2 - 0.24, 0.3, 0.16); beam.position.set(SKY_L.cx + 1.03, y - 3.25, SKY_L.cz + 0.79);
  beam.renderOrder = 3; g.add(beam); shafts.push({ mesh: beam, base: 0.03, ph: 0.4 });
  return g;
}

function buildLightShafts() {
  const g = new THREE.Group();
  const dir = SUN_DIR.clone().normalize(), len = 7.4;
  for (const zc of WIN.z) {
    const start = new THREE.Vector3(-ROOM.w / 2 + 0.1, (WIN.y0 + WIN.y1) / 2 + 0.4, zc);
    const m = new THREE.Mesh(new THREE.BoxGeometry(WIN.w * 0.95, (WIN.y1 - WIN.y0) * 0.9, len), MAT.shaft.clone());
    m.position.copy(start).addScaledVector(dir, len * 0.46);
    m.lookAt(start.clone().addScaledVector(dir, len)); m.renderOrder = 3; g.add(m);
    shafts.push({ mesh: m, base: 0.04, ph: rr(0, 6.28) });
    const pool = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 4.2), MAT.pool);   // warm floor pool
    pool.rotation.x = -Math.PI / 2; pool.position.set(-ROOM.w / 2 + 5.2, 0.02, zc - 1.5);
    pool.renderOrder = 2; g.add(pool);
  }
  const sPool = new THREE.Mesh(new THREE.PlaneGeometry(6.6, 4.6), MAT.pool);    // pool under the skylight
  sPool.rotation.x = -Math.PI / 2; sPool.position.set(SKY_L.cx + 2.2, 0.021, SKY_L.cz - 1.2);
  sPool.renderOrder = 2; g.add(sPool);
  return g;
}

function paintedPanel(w, h, tex) {                          // stretched canvas, art on the +Z face
  const front = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.93 }), e = MAT.canvasW;
  return shad(new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.05), [e, e, e, e, front, e]));
}

function buildEasel() {

function animateDrapes(t) {                                   // gentle cloth sway
  for (const d of drapes) {
    const p = d.mesh.geometry.attributes.position, b = d.base;
    for (let i = 0; i < p.count; i++) {
      const x = b[i * 3], y = b[i * 3 + 1];
      const amp = (d.h / 2 - y) / d.h;                        // still at the beam, loose at the hem
      p.setZ(i, Math.sin(x * 4.6 + t * 0.7 + d.ph) * 0.13 * amp
               + Math.sin(y * 1.1 - t * 0.55 + d.ph) * 0.09 * amp);
      p.setX(i, x + Math.sin(t * 0.4 + d.ph + y) * 0.03 * amp);
    }
    p.needsUpdate = true; d.mesh.geometry.computeVertexNormals();
  }
}
function animateMotes(t) {                                    // dust drifting in the light
  const p = motes.geometry.attributes.position, a = p.array;
  for (let i = 0; i < p.count; i++) {
    const bx = motesBase[i * 3], by = motesBase[i * 3 + 1], bz = motesBase[i * 3 + 2];
    a[i * 3] = bx + Math.sin(t * 0.22 + by * 1.6) * 0.42;
    a[i * 3 + 1] = 0.3 + ((by - 0.3) + t * 0.14 * (0.5 + (i % 7) * 0.11)) % (ROOM.h - 0.7);
    a[i * 3 + 2] = bz + Math.cos(t * 0.18 + bx * 1.3) * 0.38;
  }
  p.needsUpdate = true;
}

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  animateDrapes(t);
  animateMotes(t);
  for (const s of swingers) {                                 // pendant lamps swing
    s.group.rotation.x = Math.sin(t * 0.6 + s.ph) * s.ax;
    s.group.rotation.z = Math.cos(t * 0.44 + s.ph * 1.3) * s.az;
  }
  for (const s of shafts) {                                   // shafts breathe with the haze
    s.mesh.material.opacity = s.base * (0.78 + 0.28 * Math.sin(t * 0.5 + s.ph));
  }
  if (turntable) turntable.rotation.y = t * 0.08;             // sculpture stand turns slowly
  for (const p of leafSets) p.rotation.z = Math.sin(t * 0.5) * 0.018;
  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ============ 10. RESIZE ================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
