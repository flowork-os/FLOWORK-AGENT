<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Low-Poly Vintage Biplane</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #d7e5e4;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9e7e5);
scene.fog = new THREE.Fog(0xd9e7e5, 15, 28);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8.4, 5.4, 9.4);
camera.lookAt(0, 0.7, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.55, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 7;
controls.maxDistance = 20;
controls.maxPolarAngle = Math.PI * 0.48;

const hemi = new THREE.HemisphereLight(0xf5fbff, 0x667060, 2.4);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff1d4, 4.5);
key.position.set(6, 9, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -9;
key.shadow.camera.right = 9;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -6;
key.shadow.camera.near = 1;
key.shadow.camera.far = 25;
key.shadow.bias = -0.00025;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbcd9ff, 1.5);
fill.position.set(-7, 4, -5);
scene.add(fill);

const red = new THREE.MeshStandardMaterial({
  color: 0x9e1f24,
  roughness: 0.74,
  metalness: 0.06,
  flatShading: true
});
const redLight = new THREE.MeshStandardMaterial({
  color: 0xc23532,
  roughness: 0.72,
  metalness: 0.04,
  flatShading: true
});
const redDark = new THREE.MeshStandardMaterial({
  color: 0x67151a,
  roughness: 0.8,
  metalness: 0.04,
  flatShading: true
});
const cream = new THREE.MeshStandardMaterial({
  color: 0xf1dfb3,
  roughness: 0.82,
  metalness: 0,
  flatShading: true
});
const creamDark = new THREE.MeshStandardMaterial({
  color: 0xcab783,
  roughness: 0.86,
  metalness: 0,
  flatShading: true
});
const metal = new THREE.MeshStandardMaterial({
  color: 0x4e5352,
  roughness: 0.48,
  metalness: 0.62,
  flatShading: true
});
const darkMetal = new THREE.MeshStandardMaterial({
  color: 0x202527,
  roughness: 0.55,
  metalness: 0.55,
  flatShading: true
});
const rubber = new THREE.MeshStandardMaterial({
  color: 0x17191a,
  roughness: 0.92,
  metalness: 0,
  flatShading: true
});
const glass = new THREE.MeshStandardMaterial({
  color: 0x7098a2,
  roughness: 0.25,
  metalness: 0.15,
  transparent: true,
  opacity: 0.78,
  flatShading: true
});
const wood = new THREE.MeshStandardMaterial({
  color: 0x6f381d,
  roughness: 0.72,
  metalness: 0,
  flatShading: true
});
const brass = new THREE.MeshStandardMaterial({
  color: 0xb6853d,
  roughness: 0.42,
  metalness: 0.66,
  flatShading: true
});

const aircraft = new THREE.Group();
aircraft.rotation.y = -0.12;
aircraft.position.y = 0.15;
scene.add(aircraft);

function mesh(geometry, material, parent = aircraft) {
  const object = new THREE.Mesh(geometry, material);
  object.castShadow = true;
  object.receiveShadow = true;
  parent.add(object);
  return object;
}

function box(w, h, d, material, x, y, z, parent = aircraft) {
  const object = mesh(new THREE.BoxGeometry(w, h, d), material, parent);
  object.position.set(x, y, z);
  return object;
}

function cylinder(radiusTop, radiusBottom, height, segments, material, x, y, z, axis = 'y', parent = aircraft) {
  const object = mesh(
    new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments, 1, false),
    material,
    parent
  );
  object.position.set(x, y, z);
  if (axis === 'x') object.rotation.z = Math.PI / 2;
  if (axis === 'z') object.rotation.x = Math.PI / 2;
  return object;
}

function beamBetween(a, b, thickness, material, parent = aircraft) {
  const midpoint = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);
  const length = a.distanceTo(b);
  const object = mesh(new THREE.BoxGeometry(thickness, length, thickness), material, parent);
  object.position.copy(midpoint);
  object.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    new THREE.Vector3().subVectors(b, a).normalize()
  );
  return object;
}

function taperedPrism(span, rootChord, tipChord, thickness, material) {
  const sx = span * 0.5;
  const ry = thickness * 0.5;
  const rz = rootChord * 0.5;
  const tz = tipChord * 0.5;
  const positions = new Float32Array([
    -sx,-ry,-tz,  -sx,-ry,tz,   sx,-ry,rz,   sx,-ry,-rz,
    -sx, ry,-tz,  -sx, ry,tz,   sx, ry,rz,   sx, ry,-rz
  ]);
  const indices = [
    0,2,1, 0,3,2,
    4,5,6, 4,6,7,
    0,1,5, 0,5,4,
    3,7,6, 3,6,2,
    1,2,6, 1,6,5,
    0,4,7, 0,7,3
  ];
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return mesh(geometry.toNonIndexed(), material);
}

function addWingHalf(side, y, z, upper) {
  const wing = taperedPrism(3.85, 1.55, 1.22, 0.14, cream);
  wing.position.set(side * 1.92, y, z);
  if (side < 0) wing.rotation.y = Math.PI;

  const centerPanel = box(1.65, 0.155, 1.55, red, side * 0.72, y, z);
  centerPanel.rotation.z = upper ? side * 0.01 : 0;

  const stripe = box(0.34, 0.165, 1.38, redLight, side * 2.72, y + 0.003, z);
  stripe.rotation.z = upper ? side * 0.012 : 0;

  const tip = box(0.18, 0.17, 1.18, redDark, side * 3.77, y, z - 0.02);
  tip.rotation.z = upper ? side * 0.015 : 0;
}

addWingHalf(1, 0.15, 0.05, false);
addWingHalf(-1, 0.15, 0.05, false);
addWingHalf(1, 2.05, -0.05, true);
addWingHalf(-1, 2.05, -0.05, true);

const fuselageMid = cylinder(0.55, 0.78, 2.75, 10, red, 0, 0.82, 0.55, 'z');
const fuselageTail = cylinder(0.2, 0.56, 2.75, 8, redLight, 0, 0.91, -2.05, 'z');
const noseCone = cylinder(0.7, 0.76, 0.72, 12, redDark, 0, 0.82, 2.25, 'z');

const belly = box(0.68, 0.18, 2.8, creamDark, 0, 0.42, -0.35);
belly.rotation.x = -0.035;

const dorsalStripe = box(0.42, 0.08, 2.3, cream, 0, 1.38, -0.18);
dorsalStripe.rotation.x = 0.02;

const cockpitRim = cylinder(0.43, 0.43, 0.12, 10, darkMetal, 0, 1.46, -0.45, 'y');
const cockpitVoid = cylinder(0.34, 0.34, 0.135, 10, rubber, 0, 1.5, -0.45, 'y');
const windscreen = box(0.62, 0.42, 0.055, glass, 0, 1.68, -0.02);
windscreen.rotation.x = -0.22;

const pilotHead = mesh(new THREE.DodecahedronGeometry(0.24, 0), creamDark);
pilotHead.position.set(0, 1.68, -0.58);
const pilotCap = cylinder(0.23, 0.25, 0.16, 8, redDark, 0, 1.85, -0.58, 'y');

const cowling = mesh(new THREE.TorusGeometry(0.62, 0.17, 4, 12), red);
cowling.position.set(0, 0.82, 2.67);
cowling.rotation.z = Math.PI / 12;

const engineHub = cylinder(0.18, 0.2, 0.4, 10, darkMetal, 0, 0.82, 2.78, 'z');

for (let i = 0; i < 9; i++) {
  const angle = i / 9 * Math.PI * 2;
  const px = Math.cos(angle) * 0.39;
  const py = 0.82 + Math.sin(angle) * 0.39;
  const engineCylinder = cylinder(0.09, 0.105, 0.28, 6, metal, px, py, 2.78, 'z');
  engineCylinder.rotation.z = angle;
  const rod = beamBetween(
    new THREE.Vector3(0, 0.82, 2.89),
    new THREE.Vector3(px * 0.9, 0.82 + (py - 0.82) * 0.9, 2.89),
    0.025,
    brass
  );
  rod.castShadow = true;
}

const propeller = new THREE.Group();
propeller.position.set(0, 0.82, 3.07);
aircraft.add(propeller);

const propHub = mesh(new THREE.CylinderGeometry(0.16, 0.2, 0.28, 8), brass, propeller);
propHub.rotation.x = Math.PI / 2;

function propBlade(direction) {
  const shape = new THREE.Shape();
  shape.moveTo(-0.12, 0.05);
  shape.lineTo(-0.18, 0.72);
  shape.lineTo(-0.10, 1.42);
  shape.lineTo(0.12, 1.55);
  shape.lineTo(0.2, 1.35);
  shape.lineTo(0.13, 0.62);
  shape.lineTo(0.09, 0.05);
  shape.closePath();
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: 0.08,
    bevelEnabled: false,
    steps: 1
  });
  geometry.translate(0, 0, -0.04);
  const blade = mesh(geometry, wood, propeller);
  blade.rotation.z = direction === 1 ? 0.23 : Math.PI + 0.23;
  blade.rotation.x = 0.08;
  return blade;
}
propBlade(1);
propBlade(-1);

const spinner = mesh(new THREE.ConeGeometry(0.21, 0.34, 8), redLight, propeller);
spinner.rotation.x = Math.PI / 2;
spinner.position.z = 0.22;

const topTail = new THREE.Shape();
topTail.moveTo(-0.06, 0);
topTail.lineTo(-0.06, 1.15);
topTail.lineTo(0, 1.45);
topTail.lineTo(0.24, 1.32);
topTail.lineTo(0.39, 0.18);
topTail.closePath();
const finGeometry = new THREE.ExtrudeGeometry(topTail, {
  depth: 0.12,
  bevelEnabled: false,
  steps: 1
});
finGeometry.translate(-0.06, 0, -0.06);
const fin = mesh(finGeometry, red);
fin.rotation.y = Math.PI / 2;
fin.position.set(0, 1.02, -3.26);

function tailHalf(side) {
  const tail = taperedPrism(1.42, 0.82, 0.52, 0.1, cream);
  tail.position.set(side * 0.71, 1.04, -3.15);
  if (side < 0) tail.rotation.y = Math.PI;
  const tip = box(0.17, 0.115, 0.5, redDark, side * 1.34, 1.04, -3.14);
  return tail;
}
tailHalf(1);
tailHalf(-1);

const tailStripe = box(0.18, 0.12, 0.75, red, 0, 1.04, -3.14);

const strutPositions = [-2.55, -0.9, 0.9, 2.55];
for (const x of strutPositions) {
  beamBetween(
    new THREE.Vector3(x, 0.25, -0.38),
    new THREE.Vector3(x * 1.04, 1.98, -0.49),
    0.085,
    redDark
  );
  beamBetween(
    new THREE.Vector3(x, 0.25, 0.45),
    new THREE.Vector3(x * 1.04, 1.98, 0.36),
    0.085,
    redDark
  );
}

for (const side of [-1, 1]) {
  beamBetween(
    new THREE.Vector3(side * 1.0, 0.22, -0.45),
    new THREE.Vector3(side * 2.55, 1.98, 0.38),
    0.025,
    metal
  );
  beamBetween(
    new THREE.Vector3(side * 1.0, 0.22, 0.45),
    new THREE.Vector3(side * 2.55, 1.98, -0.46),
    0.025,
    metal
  );
}

for (const side of [-1, 1]) {
  beamBetween(
    new THREE.Vector3(side * 0.42, 0.48, 0.45),
    new THREE.Vector3(side * 0.92, -0.62, 0.18),
    0.075,
    darkMetal
  );
  beamBetween(
    new THREE.Vector3(side * 0.18, 0.42, -0.15),
    new THREE.Vector3(side * 0.92, -0.62, 0.18),
    0.07,
    darkMetal
  );

  const wheel = mesh(new THREE.TorusGeometry(0.35, 0.105, 6, 12), rubber);
  wheel.position.set(side * 0.95, -0.63, 0.17);
  wheel.rotation.y = Math.PI / 2;

  const wheelHub = cylinder(0.1, 0.1, 0.23, 8, brass, side * 0.95, -0.63, 0.17, 'x');
}

beamBetween(
  new THREE.Vector3(0, 0.83, -2.75),
  new THREE.Vector3(0, 0.15, -3.36),
  0.055,
  darkMetal
);
const tailWheel = mesh(new THREE.TorusGeometry(0.13, 0.045, 5, 9), rubber);
tailWheel.position.set(0, 0.07, -3.42);
tailWheel.rotation.y = Math.PI / 2;

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(12, 64),
  new THREE.MeshStandardMaterial({
    color: 0xbfc7b6,
    roughness: 1,
    metalness: 0
  })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.02;
ground.receiveShadow = true;
scene.add(ground);

const groundRing = new THREE.Mesh(
  new THREE.RingGeometry(8.5, 12, 64),
  new THREE.MeshStandardMaterial({
    color: 0xcbd5c9,
    roughness: 1,
    metalness: 0
  })
);
groundRing.rotation.x = -Math.PI / 2;
groundRing.position.y = -1.015;
groundRing.receiveShadow = true;
scene.add(groundRing);

aircraft.traverse(object => {
  if (object.isMesh) {
    object.castShadow = true;
    object.receiveShadow = true;
  }
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.05);
  propeller.rotation.z -= delta * 3.2;
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
