<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Monumental Stone Statue</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #15171a; }
  #app { position: fixed; inset: 0; }
  #hint {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.4 system-ui, sans-serif;
    color: rgba(230,230,235,0.55);
    letter-spacing: 0.02em; pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="hint">Drag to orbit · scroll to zoom · monument turns on its own</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------ *
 *  Renderer
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('app').appendChild(renderer.domElement);

const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

/* ------------------------------------------------------------------ *
 *  Scene, camera, controls
 * ------------------------------------------------------------------ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171a);
scene.fog = new THREE.FogExp2(0x15171a, 0.0055);

const camera = new THREE.PerspectiveCamera(
  42, window.innerWidth / window.innerHeight, 0.1, 500
);
camera.position.set(26, 12, 27);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.target.set(0, 8.6, 0);
controls.minDistance = 16;
controls.maxDistance = 80;
controls.maxPolarAngle = Math.PI * 0.495; // stay above the ground
controls.update();

/* ------------------------------------------------------------------ *
 *  Lighting: hemisphere fill + key + fill + rim
 * ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0x9aa4b6, 0x2a2620, 0.55);
scene.add(hemi);

const ambient = new THREE.AmbientLight(0xffffff, 0.08);
scene.add(ambient);

// Key light — warm, casts the soft shadows
const key = new THREE.DirectionalLight(0xfff2df, 2.25);
key.position.set(20, 32, 16);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.03;
key.shadow.radius = 4;
const sc = key.shadow.camera;
sc.near = 1; sc.far = 110;
sc.left = -28; sc.right = 28; sc.top = 34; sc.bottom = -6;
sc.updateProjectionMatrix();
scene.add(key);
scene.add(key.target);
key.target.position.set(0, 9, 0);

// Fill light — cool, no shadow, opens the shadow side
const fill = new THREE.DirectionalLight(0x9fb4d6, 0.55);
fill.position.set(-22, 15, 10);
scene.add(fill);

// Rim / back light — carves the silhouette from the dark background
const rim = new THREE.DirectionalLight(0xbfd0ff, 1.15);
rim.position.set(-10, 20, -24);
scene.add(rim);

/* ------------------------------------------------------------------ *
 *  Procedural weathered-stone textures (canvas, no external assets)
 * ------------------------------------------------------------------ */
function buildStoneTextures() {
  const S = 512;
  const cvs = document.createElement('canvas');
  cvs.width = cvs.height = S;
  const ctx = cvs.getContext('2d');

  // base tone
  ctx.fillStyle = '#8b8477';
  ctx.fillRect(0, 0, S, S);

  // fine grain
  const img = ctx.getImageData(0, 0, S, S);
  const d = img.data;
  const cl = v => v < 0 ? 0 : v > 255 ? 255 : v;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * 46;
    d[i]     = cl(d[i]     + n);
    d[i + 1] = cl(d[i + 1] + n * 0.94);
    d[i + 2] = cl(d[i + 2] + n * 0.82);
  }
  ctx.putImageData(img, 0, 0);

  // soft blotches / discolouration
  for (let k = 0; k < 190; k++) {
    const x = Math.random() * S, y = Math.random() * S, r = 8 + Math.random() * 70;
    const dark = Math.random() < 0.55;
    const a = 0.02 + Math.random() * 0.08;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, dark ? `rgba(60,54,45,${a})` : `rgba(190,184,168,${a})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  // vertical weathering streaks (water staining)
  for (let k = 0; k < 46; k++) {
    const x = Math.random() * S;
    const w = 1 + Math.random() * 4;
    const h = 40 + Math.random() * 260;
    const y = Math.random() * S;
    const g = ctx.createLinearGradient(x, y, x, y + h);
    const a = 0.05 + Math.random() * 0.08;
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.5, `rgba(50,44,36,${a})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);
  }

  // a few dark pits / chips
  for (let k = 0; k < 120; k++) {
    const x = Math.random() * S, y = Math.random() * S, r = 0.6 + Math.random() * 2.4;
    ctx.fillStyle = `rgba(35,30,24,${0.15 + Math.random() * 0.3})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  const colorMap = new THREE.CanvasTexture(cvs);
  colorMap.colorSpace = THREE.SRGBColorSpace;
  colorMap.wrapS = colorMap.wrapT = THREE.RepeatWrapping;
  colorMap.anisotropy = MAX_ANISO;

  // grayscale bump derived from the same canvas
  const bcvs = document.createElement('canvas');
  bcvs.width = bcvs.height = S;
  const bctx = bcvs.getContext('2d');
  bctx.drawImage(cvs, 0, 0);
  const bi = bctx.getImageData(0, 0, S, S);
  const bd = bi.data;
  for (let i = 0; i < bd.length; i += 4) {
    const g = (bd[i] * 0.3 + bd[i + 1] * 0.59 + bd[i + 2] * 0.11);
    bd[i] = bd[i + 1] = bd[i + 2] = g;
  }
  bctx.putImageData(bi, 0, 0);
  const bumpMap = new THREE.CanvasTexture(bcvs);
  bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
  bumpMap.anisotropy = MAX_ANISO;

  return { colorMap, bumpMap };
}

const STONE = buildStoneTextures();

function cloneTex(tex, rx, ry) {
  const t = tex.clone();
  t.needsUpdate = true;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  t.anisotropy = MAX_ANISO;
  return t;
}

/* ------------------------------------------------------------------ *
 *  Weathering: displace vertices by a position-based noise so that
 *  shared seams stay closed while surfaces & edges erode.
 * ------------------------------------------------------------------ */
function pnoise(x, y, z) {
  return (
    Math.sin(x * 1.3 + y * 2.1) * Math.sin(y * 1.7 + z * 1.1) * Math.sin(z * 1.9 + x * 0.7) * 0.7 +
    Math.sin(x * 3.1 + z * 2.7) * Math.sin(y * 2.9 + x * 1.3) * 0.3
  );
}

function weather(geo, amp, freq) {
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const dx = pnoise(v.x * freq,        v.y * freq,       v.z * freq);
    const dy = pnoise(v.y * freq + 5.2,  v.z * freq + 1.1, v.x * freq);
    const dz = pnoise(v.z * freq + 9.4,  v.x * freq + 2.3, v.y * freq);
    pos.setXYZ(i, v.x + dx * amp, v.y + dy * amp, v.z + dz * amp);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
}

/* ------------------------------------------------------------------ *
 *  Part factory
 * ------------------------------------------------------------------ */
const statue = new THREE.Group();

function stoneMaterialFor(geo, tint) {
  geo.computeBoundingBox();
  const bb = geo.boundingBox;
  const sx = Math.max(bb.max.x - bb.min.x, 0.5);
  const sy = Math.max(bb.max.y - bb.min.y, 0.5);
  const rx = Math.max(1, Math.round(sx / 2.4));
  const ry = Math.max(1, Math.round(sy / 2.4));
  const mat = new THREE.MeshStandardMaterial({
    color: tint || 0xb7b0a0,
    map: cloneTex(STONE.colorMap, rx, ry),
    bumpMap: cloneTex(STONE.bumpMap, rx, ry),
    bumpScale: 0.05,
    roughness: 0.96,
    metalness: 0.0
  });
  return mat;
}

function addPart(geo, x, y, z, opts = {}) {
  weather(geo, opts.amp ?? 0.045, opts.freq ?? 0.6);
  const mesh = new THREE.Mesh(geo, stoneMaterialFor(geo, opts.tint));
  mesh.position.set(x, y, z);
  if (opts.rot) mesh.rotation.set(opts.rot.x || 0, opts.rot.y || 0, opts.rot.z || 0);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  statue.add(mesh);
  return mesh;
}

function boxGeo(w, h, d) {
  const seg = s => Math.max(1, Math.round(s / 1.2));
  return new THREE.BoxGeometry(w, h, d, seg(w), seg(h), seg(d));
}

/* ------------------------------------------------------------------ *
 *  Stepped plinth  (weathered, slightly darker & cooler than figure)
 * ------------------------------------------------------------------ */
const PLINTH_TINT = 0x9c968a;
addPart(boxGeo(10.0, 1.3, 10.0), 0, 0.65, 0, { amp: 0.05, freq: 0.55, tint: PLINTH_TINT }); // step 0
addPart(boxGeo(8.0, 1.1, 8.0),  0, 1.85, 0, { amp: 0.05, freq: 0.6,  tint: PLINTH_TINT }); // step 1
addPart(boxGeo(6.4, 1.0, 6.4),  0, 2.90, 0, { amp: 0.045, freq: 0.6, tint: PLINTH_TINT }); // step 2
addPart(boxGeo(4.8, 2.8, 4.4),  0, 4.80, 0, { amp: 0.045, freq: 0.55, tint: PLINTH_TINT }); // pedestal block

const Y0 = 6.2; // top of pedestal — where the figure stands

/* ------------------------------------------------------------------ *
 *  The robed figure — one cohesive silhouette of blocky carved masses
 * ------------------------------------------------------------------ */
const FIG_TINT = 0xbdb6a5;

// Lower + mid robe: a lathe-turned bell that flares to the ground
const robeProfile = [
  new THREE.Vector2(2.30, 0.00),
  new THREE.Vector2(2.55, 0.25),
  new THREE.Vector2(2.42, 1.00),
  new THREE.Vector2(2.22, 2.50),
  new THREE.Vector2(1.98, 4.00),
  new THREE.Vector2(1.72, 5.20),
  new THREE.Vector2(1.52, 6.50)
];
const robeGeo = new THREE.LatheGeometry(robeProfile, 56);
addPart(robeGeo, 0, Y0, 0, { amp: 0.06, freq: 0.5, tint: FIG_TINT });

// Chest / upper-body block rising out of the robe
addPart(boxGeo(2.9, 2.5, 1.7), 0, Y0 + 6.4, 0, { amp: 0.05, freq: 0.6, tint: FIG_TINT });

// Arms — vertical masses draped along the sides, under the cloak
addPart(boxGeo(0.78, 3.5, 1.15), -1.58, Y0 + 5.4, 0.05, { amp: 0.05, freq: 0.6, tint: FIG_TINT, rot: { z:  0.06 } });
addPart(boxGeo(0.78, 3.5, 1.15),  1.58, Y0 + 5.4, 0.05, { amp: 0.05, freq: 0.6, tint: FIG_TINT, rot: { z: -0.06 } });

// Folded forearms / hands across the front
addPart(boxGeo(2.3, 1.05, 0.95), 0, Y0 + 5.3, 0.95, { amp: 0.05, freq: 0.65, tint: FIG_TINT });

// Shoulder mass
addPart(boxGeo(3.4, 0.95, 1.9), 0, Y0 + 7.75, 0, { amp: 0.05, freq: 0.6, tint: FIG_TINT });

// Cowl / robe gathered at the shoulders (open cone frustum)
const cowlGeo = new THREE.CylinderGeometry(0.95, 1.95, 1.5, 40, 4, true);
addPart(cowlGeo, 0, Y0 + 8.55, 0, { amp: 0.05, freq: 0.7, tint: FIG_TINT });

// Neck
addPart(boxGeo(0.98, 0.9, 0.92), 0, Y0 + 8.55, 0, { amp: 0.04, freq: 0.7, tint: FIG_TINT });

// Hood / back of head slab (reinforces the "robed" reading in silhouette)
addPart(boxGeo(1.95, 2.35, 0.75), 0, Y0 + 9.95, -0.62, { amp: 0.045, freq: 0.6, tint: FIG_TINT });

// Head — blocky carved mass
addPart(boxGeo(1.5, 1.9, 1.6), 0, Y0 + 9.9, 0, { amp: 0.04, freq: 0.75, tint: FIG_TINT });

// Simplified brow and nose to give the monument a face
addPart(boxGeo(1.42, 0.3, 0.22), 0, Y0 + 10.2, 0.82, { amp: 0.03, freq: 0.9, tint: FIG_TINT });
addPart(boxGeo(0.3, 0.75, 0.4),  0, Y0 + 9.78, 0.86, { amp: 0.03, freq: 0.9, tint: FIG_TINT });

// Recentre the whole monument on X/Z (already symmetric) and seat it on the ground
scene.add(statue);

/* ------------------------------------------------------------------ *
 *  Ground plane — receives shadows only
 * ------------------------------------------------------------------ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(600, 600),
  new THREE.ShadowMaterial({ opacity: 0.4 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0.02;
ground.receiveShadow = true;
scene.add(ground);

/* ------------------------------------------------------------------ *
 *  Resize + render loop
 * ------------------------------------------------------------------ */
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
