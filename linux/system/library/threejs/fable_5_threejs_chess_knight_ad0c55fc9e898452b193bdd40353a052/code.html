<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staunton Knight</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#241f1a}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x241f1a);
scene.fog = new THREE.Fog(0x241f1a, 12, 26);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.2, 3.4, 6.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.4;
controls.minDistance = 3;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.52;

// --- warm wood grain texture ---
function woodTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#94622f'; g.fillRect(0, 0, 512, 512);
  const grad = g.createLinearGradient(0, 0, 512, 512);
  grad.addColorStop(0, 'rgba(120,70,30,0.25)'); grad.addColorStop(1, 'rgba(70,40,15,0.25)');
  g.fillStyle = grad; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 160; i++) {
    const d = Math.random();
    g.strokeStyle = d < 0.8
      ? `rgba(${55 + Math.random() * 40},${28 + Math.random() * 22},${10 + Math.random() * 10},${0.05 + Math.random() * 0.14})`
      : `rgba(215,170,110,${0.04 + Math.random() * 0.08})`;
    g.lineWidth = 0.6 + Math.random() * 2.6;
    const y = Math.random() * 512, ph = Math.random() * 9;
    g.beginPath(); g.moveTo(0, y);
    for (let x = 0; x <= 512; x += 24) g.lineTo(x, y + Math.sin(x * 0.018 + ph) * 7 + Math.sin(x * 0.05 + ph * 2) * 2);
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const wood = new THREE.MeshPhysicalMaterial({
  map: woodTexture(), roughness: 0.42, metalness: 0,
  clearcoat: 0.35, clearcoatRoughness: 0.5
});
const dark = new THREE.MeshStandardMaterial({ color: 0x241209, roughness: 0.3 });

const knight = new THREE.Group();

// --- turned circular base (lathe) ---
const basePts = [
  [0, 0], [0.98, 0], [1.04, 0.1], [1.0, 0.22], [0.9, 0.3], [0.85, 0.36],
  [0.78, 0.42], [0.72, 0.5], [0.76, 0.58], [0.68, 0.66],
  [0.55, 0.8], [0.48, 1.0], [0.46, 1.2], [0.5, 1.32],
  [0.62, 1.4], [0.64, 1.5], [0.56, 1.58], [0.44, 1.62], [0.28, 1.64], [0, 1.64]
].map(p => new THREE.Vector2(p[0], p[1]));
knight.add(new THREE.Mesh(new THREE.LatheGeometry(basePts, 72), wood));

// --- horse head silhouette (extruded profile) ---
const s = new THREE.Shape();
s.moveTo(-0.62, 0);
s.lineTo(0.18, 0);
s.quadraticCurveTo(0.34, 0.3, 0.36, 0.72);   // chest up front of neck to throat
s.quadraticCurveTo(0.52, 0.92, 0.74, 1.02);  // defined jaw, jutting forward
s.quadraticCurveTo(0.93, 1.08, 1.0, 1.2);    // toward chin
s.lineTo(0.88, 1.26);                        // mouth undercut
s.lineTo(1.06, 1.34);                        // lip
s.quadraticCurveTo(1.16, 1.45, 1.08, 1.56);  // rounded muzzle front
s.quadraticCurveTo(0.92, 1.64, 0.78, 1.7);   // top of muzzle
s.quadraticCurveTo(0.5, 1.86, 0.32, 2.14);   // nose bridge / forehead
s.quadraticCurveTo(0.18, 2.36, 0.02, 2.46);  // brow to poll
s.quadraticCurveTo(-0.18, 2.52, -0.26, 2.42);// crest
let p = [-0.26, 2.42];
const maneAnchors = [[-0.34, 2.0], [-0.46, 1.5], [-0.56, 1.0], [-0.62, 0.5]];
for (const q of maneAnchors) {                // carved mane scallops down the neck
  s.quadraticCurveTo(p[0] - 0.16, (p[1] + q[1]) / 2, q[0], q[1]);
  s.lineTo(q[0] + 0.08, q[1] - 0.06);
  p = [q[0] + 0.08, q[1] - 0.06];
}
s.quadraticCurveTo(-0.66, 0.22, -0.62, 0);
s.closePath();

const headGeo = new THREE.ExtrudeGeometry(s, {
  depth: 0.44, steps: 1, curveSegments: 36,
  bevelEnabled: true, bevelThickness: 0.12, bevelSize: 0.1, bevelSegments: 6
});
headGeo.translate(0, 0, -0.22);
const head = new THREE.Group();
head.position.y = 1.58;
head.add(new THREE.Mesh(headGeo, wood));

// --- raised carved mane ridge along the back ---
const m = new THREE.Shape();
m.moveTo(-0.2, 2.52); m.lineTo(-0.3, 2.5);
let mp = [-0.3, 2.5];
for (const q of [[-0.4, 2.02], [-0.52, 1.5], [-0.62, 0.98], [-0.68, 0.45]]) {
  m.quadraticCurveTo(mp[0] - 0.17, (mp[1] + q[1]) / 2, q[0], q[1]);
  m.lineTo(q[0] + 0.07, q[1] - 0.05);
  mp = [q[0] + 0.07, q[1] - 0.05];
}
m.quadraticCurveTo(-0.7, 0.2, -0.68, 0);
m.lineTo(-0.3, 0);
m.quadraticCurveTo(-0.25, 1.3, -0.05, 2.3);
m.closePath();
const maneGeo = new THREE.ExtrudeGeometry(m, {
  depth: 0.18, steps: 1, curveSegments: 24,
  bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.045, bevelSegments: 3
});
maneGeo.translate(0, 0, -0.09);
head.add(new THREE.Mesh(maneGeo, wood));

// --- ears ---
for (const side of [-1, 1]) {
  const ear = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.34, 16), wood);
  ear.position.set(-0.08, 2.58, side * 0.14);
  ear.scale.z = 0.6;
  ear.rotation.set(side * -0.18, 0, 0.32);
  head.add(ear);
}
// --- cheeks / jaw bulge ---
for (const side of [-1, 1]) {
  const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.16, 24, 16), wood);
  cheek.position.set(0.34, 0.96, side * 0.24);
  cheek.scale.set(1.15, 1.4, 0.6);
  head.add(cheek);
}
// --- eyes & nostrils ---
for (const side of [-1, 1]) {
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.055, 16, 12), dark);
  eye.position.set(0.3, 2.16, side * 0.29);
  eye.scale.set(1, 0.75, 0.55);
  head.add(eye);
  const nostril = new THREE.Mesh(new THREE.SphereGeometry(0.035, 12, 8), dark);
  nostril.position.set(1.0, 1.5, side * 0.16);
  head.add(nostril);
}
knight.add(head);
knight.rotation.y = -0.5;
knight.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } });
scene.add(knight);

// --- ground ---
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(14, 64),
  new THREE.MeshStandardMaterial({ color: 0x2e2721, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// --- lighting ---
scene.add(new THREE.HemisphereLight(0xfff0dd, 0x3a2e22, 0.55));
const key = new THREE.DirectionalLight(0xffe2b8, 2.4);
key.position.set(4, 7, 3.5);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = key.shadow.camera.bottom = -5;
key.shadow.camera.right = key.shadow.camera.top = 5;
key.shadow.camera.near = 1; key.shadow.camera.far = 20;
key.shadow.radius = 10; key.shadow.blurSamples = 16;
key.shadow.bias = -0.0002; key.shadow.normalBias = 0.02;
scene.add(key);
const fill = new THREE.DirectionalLight(0x9db4ff, 0.4);
fill.position.set(-5, 3, -2);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffcf9a, 0.9);
rim.position.set(-2, 4, -6);
scene.add(rim);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
