<title>Glowing Mushroom Forest</title>

html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030414}
canvas{display:block}

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x040516);
scene.fog = new THREE.FogExp2(0x11113a, 0.026);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 150);
camera.position.set(17, 10, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.28;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 9;
controls.maxDistance = 40;

const WORLD = new THREE.Group();
scene.add(WORLD);

let seed = 847231;
const rand = () => {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
};
const range = (a, b) => a + (b - a) * rand();
const pick = a => a[Math.floor(rand() * a.length)];
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

const clock = new THREE.Clock();
const mushroomPulses = [];
const fernWaves = [];
const floatingSpores = [];
const poolRipples = [];
const stoneLights = [];

function canvasTexture(draw, size = 256) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  draw(ctx, size);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  return texture;
}

const groundTexture = canvasTexture((ctx, s) => {
  ctx.fillStyle = '#11152a';
  ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 2500; i++) {
    const v = Math.floor(range(8, 38));
    const a = range(0.05, 0.24);
    ctx.fillStyle = `rgba(${v},${v + 10},${v + 24},${a})`;
    ctx.fillRect(rand() * s, rand() * s, range(1, 3), range(1, 3));
  }
  for (let i = 0; i < 120; i++) {
    ctx.strokeStyle = `rgba(28,62,57,${range(.08,.22)})`;
    ctx.lineWidth = range(.4, 1.4);
    ctx.beginPath();
    ctx.arc(rand()*s, rand()*s, range(4,18), 0, Math.PI*2);
    ctx.stroke();
  }
});
groundTexture.repeat.set(7, 7);

const barkTexture = canvasTexture((ctx, s) => {
  ctx.fillStyle = '#161124';
  ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 290; i++) {
    const x = rand() * s;
    const y = rand() * s;
    ctx.strokeStyle = `rgba(${Math.floor(range(42,82))},${Math.floor(range(25,50))},${Math.floor(range(55,85))},${range(.15,.55)})`;
    ctx.lineWidth = range(1, 4);
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.bezierCurveTo(x + range(-8,8), y + 20, x + range(-12,12), y + 42, x + range(-8,8), y + 75);
    ctx.stroke();
  }
});

const capTexture = canvasTexture((ctx, s) => {
  const g = ctx.createRadialGradient(s*.5,s*.42,2,s*.5,s*.5,s*.58);
  g.addColorStop(0,'#f7e7e3');
  g.addColorStop(.08,'#d7d6ed');
  g.addColorStop(.34,'#5364a4');
  g.addColorStop(1,'#191c4e');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,s,s);
  for(let i=0;i<220;i++){
    ctx.fillStyle=`rgba(255,255,255,${range(.025,.16)})`;
    ctx.beginPath();
    ctx.arc(rand()*s,rand()*s,range(.4,2.2),0,Math.PI*2);
    ctx.fill();
  }
});

const groundMat = new THREE.MeshStandardMaterial({
  map: groundTexture, roughness: 0.95, metalness: 0
});
const barkMat = new THREE.MeshStandardMaterial({
  map: barkTexture, color: 0x33233d, roughness: 0.98
});
const darkMat = new THREE.MeshStandardMaterial({
  color: 0x17132a, roughness: 0.96
});
const mossMat = new THREE.MeshStandardMaterial({
  color: 0x1e6759, roughness: 0.92, emissive: 0x092b29, emissiveIntensity: 0.3
});
const paleMossMat = new THREE.MeshStandardMaterial({
  color: 0x57a98b, roughness: 0.85, emissive: 0x0d302c, emissiveIntensity: 0.5
});
const waterMat = new THREE.MeshPhysicalMaterial({
  color: 0x123b5e, roughness: 0.12, metalness: 0.22,
  transmission: 0.08, transparent: true, opacity: 0.86,
  emissive: 0x09263d, emissiveIntensity: 0.45
});

function shadow(mesh, cast = true, receive = true) {
  mesh.castShadow = cast;
  mesh.receiveShadow = receive;
  return mesh;
}

function makeGround() {
  const ground = shadow(new THREE.Mesh(
    new THREE.PlaneGeometry(80, 80, 80, 80),
    groundMat
  ), false, true);
  ground.rotation.x = -Math.PI / 2;
  const pos = ground.geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i);
    const r = Math.sqrt(x*x + y*y);
    const undulation = Math.sin(x*.38) * .18 + Math.cos(y*.31) * .16;
    const pathDip = Math.exp(-Math.pow(x + y*.22, 2) / 11) * .28;
    pos.setZ(i, undulation - pathDip - Math.max(0, r - 28) * .035);
  }
  ground.geometry.computeVertexNormals();
  WORLD.add(ground);
}
makeGround();

function makeSky() {
  const geo = new THREE.SphereGeometry(75, 32, 20);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
      top: { value: new THREE.Color(0x020315) },
      horizon: { value: new THREE.Color(0x29204c) },
      bottom: { value: new THREE.Color(0x060719) }
    },
    vertexShader: `
      varying vec3 vPos;
      void main(){vPos=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}
    `,
    fragmentShader: `
      varying vec3 vPos; uniform vec3 top; uniform vec3 horizon; uniform vec3 bottom;
      void main(){
        float h=normalize(vPos).y*.5+.5;
        vec3 c=mix(bottom,horizon,smoothstep(.15,.52,h));
        c=mix(c,top,smoothstep(.52,1.0,h));
        gl_FragColor=vec4(c,1.0);
      }
    `
  });
  WORLD.add(new THREE.Mesh(geo, mat));
}
makeSky();

function rock(x, z, scale = 1, color = 0x26334a) {
  const geo = new THREE.DodecahedronGeometry(scale, 1);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    pos.setXYZ(i, pos.getX(i) * range(.7, 1.25), pos.getY(i) * range(.55, 1.1), pos.getZ(i) * range(.7, 1.25));
  }
  geo.computeVertexNormals();
  const mesh = shadow(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color, roughness: .92, emissive: 0x07121c, emissiveIntensity: .14
  })));
  mesh.position.set(x, scale * .45, z);
  mesh.rotation.set(range(0,1), range(0,6), range(0,1));
  WORLD.add(mesh);
  return mesh;
}

for (let i = 0; i < 95; i++) {
  const a = rand() * Math.PI * 2;
  const r = range(8, 31);
  rock(Math.cos(a)*r, Math.sin(a)*r, range(.12,.55), pick([0x243149,0x29314a,0x1d3a40]));
}

function makeTree(x, z, h, lean = 0) {
  const group = new THREE.Group();
  group.position.set(x, 0, z);
  group.rotation.z = lean;
  const trunk = shadow(new THREE.Mesh(
    new THREE.CylinderGeometry(h*.105, h*.18, h, 8, 8),
    barkMat
  ));
  trunk.position.y = h / 2;
  group.add(trunk);

  const branchMat = new THREE.MeshStandardMaterial({ color: 0x20152d, roughness: 1 });
  for (let i = 0; i < 6; i++) {
    const y = h * range(.38,.9);
    const length = h * range(.24,.48);
    const branch = shadow(new THREE.Mesh(
      new THREE.CylinderGeometry(.025*h, .06*h, length, 6),
      branchMat
    ));
    branch.position.y = y;
    branch.rotation.z = range(.6,1.12) * (rand() < .5 ? 1 : -1);
    branch.rotation.y = rand() * Math.PI * 2;
    branch.translateY(length * .35);
    group.add(branch);

    if (i % 2 === 0) {
      const twig = shadow(new THREE.Mesh(
        new THREE.CylinderGeometry(.012*h,.027*h,length*.48,5),
        branchMat
      ));
      twig.position.copy(branch.position);
      twig.rotation.copy(branch.rotation);
      twig.rotation.z += range(-.8,.8);
      twig.translateY(length*.36);
      group.add(twig);
    }
  }
  WORLD.add(group);
  return group;
}

makeTree(-13, -11, 11, -.12);
makeTree(12, -13, 13, .1);
makeTree(-20, 4, 15, .08);
makeTree(17, 6, 12, -.06);
makeTree(-9, 16, 9, .11);
makeTree(5, 20, 11, -.15);

function makeMushroom(x, z, options = {}) {
  const {
    height = 4, radius = 2, hue = 0.5, saturation = .8, lightness = .55,
    capType = 'round', spots = true, glow = 1.6, tilt = 0
  } = options;
  const group = new THREE.Group();
  group.position.set(x, 0, z);
  group.rotation.z = tilt;

  const stemMat = new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(hue, .26, .72),
    roughness: .76, emissive: new THREE.Color().setHSL(hue, .35, .16),
    emissiveIntensity: .45
  });
  const capColor = new THREE.Color().setHSL(hue, saturation, lightness);
  const capMat = new THREE.MeshStandardMaterial({
    map: capTexture, color: capColor, roughness: .38, metalness: .06,
    emissive: capColor.clone(), emissiveIntensity: glow
  });
  const undersideMat = new THREE.MeshStandardMaterial({
    color: capColor.clone().lerp(new THREE.Color(0xffffff), .55),
    roughness: .63, emissive: capColor, emissiveIntensity: glow * .55,
    side: THREE.DoubleSide
  });

  const stem = shadow(new THREE.Mesh(
    new THREE.CylinderGeometry(radius*.22, radius*.34, height, 12, 6),
    stemMat
  ));
  stem.position.y = height / 2;
  group.add(stem);

  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(radius*.26, radius*.035, 8, 18),
    undersideMat
  );
  ring.position.y = height * .62;
  ring.rotation.x = Math.PI / 2;
  group.add(ring);

  let capGeo;
  if (capType === 'bell') {
    capGeo = new THREE.SphereGeometry(radius, 24, 16, 0, Math.PI*2, 0, Math.PI*.55);
  } else if (capType === 'flat') {
    capGeo = new THREE.SphereGeometry(radius, 24, 12, 0, Math.PI*2, 0, Math.PI*.36);
  } else {
    capGeo = new THREE.SphereGeometry(radius, 28, 18, 0, Math.PI*2, 0, Math.PI*.62);
  }
  const cap = shadow(new THREE.Mesh(capGeo, capMat));
  cap.position.y = height * .94;
  cap.scale.y = capType === 'flat' ? .82 : 1;
  group.add(cap);

  const gills = new THREE.Mesh(
    new THREE.CylinderGeometry(radius*.78, radius*.58, radius*.09, 24, 1, true),
    undersideMat
  );
  gills.position.y = height*.94 + radius*.07;
  group.add(gills);

  if (spots) {
    const spotMat = new THREE.MeshStandardMaterial({
      color: 0xd8fff7, emissive: 0x89fff0, emissiveIntensity: 1.8, roughness: .45
    });
    const count = Math.floor(radius * 9);
    for (let i = 0; i < count; i++) {
      const phi = rand() * Math.PI * 2;
      const theta = range(.18, 1.15);
      const rr = radius * Math.sin(theta);
      const dot = new THREE.Mesh(
        new THREE.SphereGeometry(range(.045,.11) * radius, 9, 7),
        spotMat
      );
      dot.position.set(
        Math.cos(phi) * rr,
        height*.94 + Math.cos(theta) * radius * .84,
        Math.sin(phi) * rr
      );
      group.add(dot);
    }
  }

  const light = new THREE.PointLight(capColor, glow * 1.3, radius * 6, 2);
  light.position.set(0, height*.82, 0);
  light.castShadow = radius > 1.4;
  light.shadow.mapSize.set(256, 256);
  group.add(light);

  WORLD.add(group);
  mushroomPulses.push({
    group, capMat, undersideMat, light,
    base: glow, phase: rand() * Math.PI * 2,
    speed: range(.55, 1.15)
  });
  return group;
}

makeMushroom(-5.8, -2.4, {height:7.4,radius:3.05,hue:.51,saturation:.9,lightness:.52,capType:'round',glow:2.15,tilt:-.055});
makeMushroom(5.2, -3.6, {height:6.1,radius:2.55,hue:.76,saturation:.78,lightness:.56,capType:'bell',glow:2.0,tilt:.065});
makeMushroom(1.0, 4.8, {height:5.1,radius:2.25,hue:.11,saturation:.9,lightness:.56,capType:'flat',glow:1.85,tilt:-.04});
makeMushroom(-10.4, 3.4, {height:4.1,radius:1.7,hue:.47,saturation:.8,lightness:.49,capType:'bell',glow:1.45});
makeMushroom(9.6, 4.5, {height:4.7,radius:1.9,hue:.7,saturation:.72,lightness:.53,capType:'round',glow:1.55});

function tinyCluster(x, z, count, hue) {
  for (let i = 0; i < count; i++) {
    const a = rand() * Math.PI * 2;
    const r = Math.sqrt(rand()) * 1.3;
    makeMushroom(x + Math.cos(a)*r, z + Math.sin(a)*r, {
      height: range(.35,1.15), radius: range(.18,.5), hue,
      saturation: range(.55,.95), lightness: range(.45,.62),
      capType: pick(['bell','round','flat']), glow: range(.35,.85),
      spots: rand() > .5, tilt: range(-.16,.16)
    });
  }
}
tinyCluster(-2.2, -5.1, 13, .5);
tinyCluster(7.7, -1.0, 11, .77);
tinyCluster(-8.5, 6.1, 10, .12);
tinyCluster(6.4, 7.8, 9, .46);
tinyCluster(-1.5, 9.1, 12, .72);

function makeFern(x, z, scale = 1, hue = .43) {
  const group = new THREE.Group();
  group.position.set(x, .05, z);
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(hue,.55,.28),
    roughness: .8, side: THREE.DoubleSide,
    emissive: new THREE.Color().setHSL(hue,.8,.08), emissiveIntensity:.65
  });
  const stem = new THREE.Mesh(
    new THREE.CylinderGeometry(.018*scale,.045*scale,1.4*scale,6),
    mat
  );
  stem.position.y = .68*scale;
  group.add(stem);

  for (let row = 0; row < 7; row++) {
    const y = .28*scale + row*.16*scale;
    const w = (1 - row/9) * .68 * scale;
    for (const side of [-1,1]) {
      const leaf = new THREE.Mesh(
        new THREE.PlaneGeometry(w, .13*scale, 2, 1),
        mat
      );
      leaf.position.set(side*w*.38, y, 0);
      leaf.rotation.set(range(-.18,.18), 0, side*(.52 + row*.06));
      group.add(leaf);
    }
  }
  group.rotation.y = rand() * Math.PI * 2;
  WORLD.add(group);
  fernWaves.push({group, phase:rand()*6.28, amount:range(.04,.12)});
}
for (let i = 0; i < 45; i++) {
  const a = rand()*Math.PI*2, r = range(4,19);
  makeFern(Math.cos(a)*r, Math.sin(a)*r, range(.35,1.12), pick([.35,.43,.48,.57]));
}

function makeLog(x, z, length, angle) {
  const group = new THREE.Group();
  group.position.set(x, .55, z);
  group.rotation.y = angle;
  const log = shadow(new THREE.Mesh(
    new THREE.CylinderGeometry(.48,.6,length,10,5),
    barkMat
  ));
  log.rotation.z = Math.PI/2;
  group.add(log);

  const cutMat = new THREE.MeshStandardMaterial({
    color:0x77596c, roughness:.9, emissive:0x221526, emissiveIntensity:.2
  });
  for (const side of [-1,1]) {
    const cut = new THREE.Mesh(new THREE.CircleGeometry(.48,10), cutMat);
    cut.position.x = side * length/2;
    cut.rotation.y = side * Math.PI/2;
    group.add(cut);
  }
  for (let i=0;i<14;i++) {
    const moss = new THREE.Mesh(
      new THREE.SphereGeometry(range(.12,.27),8,6), paleMossMat
    );
    moss.position.set(range(-length*.38,length*.38), range(.35,.6), range(-.32,.32));
    moss.scale.y=.55;
    group.add(moss);
  }
  WORLD.add(group);
}
makeLog(-8.8,-6.7,5.2,.28);
makeLog(8.6,7.3,4.4,-.45);

function makePool() {
  const group = new THREE.Group();
  group.position.set(0, .02, 8.1);
  const rim = new THREE.Mesh(
    new THREE.RingGeometry(2.3,4.25,48,1),
    mossMat
  );
  rim.rotation.x = -Math.PI/2;
  rim.scale.y=.65;
  group.add(rim);

  const water = new THREE.Mesh(
    new THREE.CircleGeometry(3.85,64),
    waterMat
  );
  water.rotation.x=-Math.PI/2;
  water.scale.y=.64;
  group.add(water);

  const edgeMat = new THREE.MeshStandardMaterial({
    color:0x274154,roughness:.8,emissive:0x0e2330,emissiveIntensity:.35
  });
  for(let i=0;i<20;i++){
    const a=i/20*Math.PI*2;
    const s=range(.18,.45);
    const pebble=shadow(new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),edgeMat));
    pebble.position.set(Math.cos(a)*range(3.5,4.25),.08,Math.sin(a)*range(2.2,2.75));
    pebble.scale.y=.5;
    group.add(pebble);
  }
  for(let i=0;i<5;i++){
    const ripple=new THREE.Mesh(
      new THREE.RingGeometry(.2,.24,32),
      new THREE.MeshBasicMaterial({color:0x72ffe0,transparent:true,opacity:.25,side:THREE.DoubleSide})
    );
    ripple.rotation.x=-Math.PI/2;
    ripple.position.set(range(-2.4,2.4),.04,range(-1.5,1.5));
    ripple.scale.setScalar(range(.4,1.3));
    group.add(ripple);
    poolRipples.push({mesh:ripple,phase:rand()*6.28});
  }
  WORLD.add(group);
}
makePool();

function makePath() {
  const mat = new THREE.MeshStandardMaterial({
    color:0x6bd9cb,roughness:.48,emissive:0x199a94,emissiveIntensity:1.7
  });
  for(let i=0;i<13;i++){
    const t=i/12;
    const x=Math.sin(t*5.4)*1.25 + (t-.5)*.8;
    const z=-11 + t*19;
    const s=range(.3,.53);
    const stone=shadow(new THREE.Mesh(
      new THREE.CylinderGeometry(s*.9,s,range(.12,.22),8),
      mat
    ));
    stone.position.set(x,.1,z);
    stone.rotation.y=rand()*Math.PI;
    WORLD.add(stone);
    stoneLights.push({mesh:stone,phase:rand()*6.28});
  }
}
makePath();

function makeSpores() {
  const count = 460;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const sizes = new Float32Array(count);
  const data = [];
  const palette = [new THREE.Color(0x70fff0),new THREE.Color(0xd7a8ff),new THREE.Color(0xffc36b)];
  for(let i=0;i<count;i++){
    const a=rand()*Math.PI*2, r=Math.pow(rand(),.62)*20;
    const x=Math.cos(a)*r, z=Math.sin(a)*r, y=range(.15,11);
    positions.set([x,y,z],i*3);
    const c=pick(palette);
    colors.set([c.r,c.g,c.b],i*3);
    sizes[i]=range(1.5,5.4);
    data.push({x,z,y,baseY:y,speed:range(.08,.34),phase:rand()*6.28});
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(positions,3));
  geo.setAttribute('color',new THREE.BufferAttribute(colors,3));
  geo.setAttribute('size',new THREE.BufferAttribute(sizes,1));
  const mat=new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,vertexColors:true,
    vertexShader:`
      attribute float size; varying vec3 vColor;
      void main(){
        vColor=color; vec4 mv=modelViewMatrix*vec4(position,1.0);
        gl_PointSize=size*(150.0/-mv.z); gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:`
      varying vec3 vColor;
      void main(){
        float d=length(gl_PointCoord-.5);
        float a=smoothstep(.5,.06,d);
        gl_FragColor=vec4(vColor,a*.88);
      }`
  });
  const points=new THREE.Points(geo,mat);
  WORLD.add(points);
  floatingSpores.push({points,data});
}
makeSpores();

function makeFireflies() {
  for(let i=0;i<18;i++){
    const c=pick([0x7ffff0,0xe7b2ff,0xffd27d]);
    const light=new THREE.PointLight(c,.45,3,2);
    const orb=new THREE.Mesh(
      new THREE.SphereGeometry(.045,8,8),
      new THREE.MeshBasicMaterial({color:c})
    );
    light.add(orb);
    light.position.set(range(-13,13),range(1,6),range(-10,12));
    WORLD.add(light);
    floatingSpores.push({light,firefly:true,base:light.position.clone(),phase:rand()*6.28});
  }
}
makeFireflies();

moonLight.shadow.mapSize.set(2048,2048);

scene.add(new THREE.HemisphereLight(0x5968b9,0x071518,1.1));
const violetFill = new THREE.PointLight(0x8d54ff, 2.1, 22, 2);
violetFill.position.set(3,8,-9);
scene.add(violetFill);
const tealFill = new THREE.PointLight(0x38ffe4, 1.5, 20, 2);
tealFill.position.set(-9,4,4);
scene.add(tealFill);

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  mushroomPulses.forEach(p => {
    const pulse = .78 + Math.sin(t*p.speed + p.phase)*.22;
    p.capMat.emissiveIntensity = p.base*pulse;
    p.undersideMat.emissiveIntensity = p.base*.55*pulse;
    p.light.intensity = p.base*1.3*pulse;
    p.group.children[2].scale.setScalar(1 + Math.sin(t*p.speed+p.phase)*.012);
  });

  fernWaves.forEach(f => {
    f.group.rotation.z = Math.sin(t*.85+f.phase)*f.amount;
    f.group.rotation.x = Math.cos(t*.62+f.phase)*f.amount*.34;
  });

  floatingSpores.forEach(s => {
    if(s.firefly){
      s.light.position.x=s.base.x+Math.sin(t*.8+s.phase)*.7;
      s.light.position.y=s.base.y+Math.sin(t*1.5+s.phase)*.38;
      s.light.position.z=s.base.z+Math.cos(t*.65+s.phase)*.7;
      return;
    }
    const pos=s.points.geometry.attributes.position;
    s.data.forEach((d,i)=>{
      d.y += d.speed*.018;
      if(d.y>13)d.y=.1;
      pos.setXYZ(i,d.x+Math.sin(t*.7+d.phase)*.22,d.y,d.z+Math.cos(t*.55+d.phase)*.22);
    });
    pos.needsUpdate=true;
  });

  poolRipples.forEach(r => {
    const q=(Math.sin(t*.8+r.phase)+1)*.5;
    r.mesh.scale.setScalar(.35+q*2.3);
    r.mesh.material.opacity=(1-q)*.19;
  });

  stoneLights.forEach(s => {
    s.mesh.material.emissiveIntensity = 1.25 + Math.sin(t*1.2+s.phase)*.45;
  });

  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
