<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rooftop HVAC Package Unit</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: linear-gradient(#b9c7d2, #e6e9e8);
    }
    canvas {
      display: block;
    }
    .label {
      position: fixed;
      left: 22px;
      bottom: 18px;
      padding: 9px 12px;
      color: rgba(32, 40, 43, 0.72);
      background: rgba(240, 244, 244, 0.58);
      border: 1px solid rgba(70, 80, 82, 0.15);
      border-radius: 4px;
      font: 11px/1.25 Arial, sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      pointer-events: none;
      backdrop-filter: blur(5px);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="label">Rooftop Package Unit · Industrial HVAC</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xcbd5da);
    scene.fog = new THREE.Fog(0xcbd5da, 18, 42);

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.05, 100);
    camera.position.set(8.6, 6.1, 9.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.65, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.42;
    controls.minDistance = 7;
    controls.maxDistance = 22;
    controls.maxPolarAngle = Math.PI * 0.48;

    const hemi = new THREE.HemisphereLight(0xeaf5fb, 0x6d6b63, 2.0);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff4df, 4.0);
    sun.position.set(-7, 11, 8);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -10;
    sun.shadow.camera.right = 10;
    sun.shadow.camera.top = 10;
    sun.shadow.camera.bottom = -10;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 28;
    sun.shadow.bias = -0.00025;
    sun.shadow.normalBias = 0.025;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0xaec9db, 1.1);
    fill.position.set(7, 5, -8);
    scene.add(fill);

    const materials = {
      roof: new THREE.MeshStandardMaterial({ color: 0x777a78, roughness: 0.92, metalness: 0.03 }),
      roofEdge: new THREE.MeshStandardMaterial({ color: 0x54585a, roughness: 0.82, metalness: 0.12 }),
      curb: new THREE.MeshStandardMaterial({ color: 0x4c5253, roughness: 0.55, metalness: 0.62 }),
      curbDark: new THREE.MeshStandardMaterial({ color: 0x272c2d, roughness: 0.72, metalness: 0.48 }),
      metal: new THREE.MeshStandardMaterial({ color: 0x9aa09e, roughness: 0.43, metalness: 0.72 }),
      metalLight: new THREE.MeshStandardMaterial({ color: 0xb3b8b5, roughness: 0.38, metalness: 0.68 }),
      panel: new THREE.MeshStandardMaterial({ color: 0x8b9290, roughness: 0.48, metalness: 0.67 }),
      seam: new THREE.MeshStandardMaterial({ color: 0x555c5c, roughness: 0.48, metalness: 0.72 }),
      dark: new THREE.MeshStandardMaterial({ color: 0x202526, roughness: 0.58, metalness: 0.65 }),
      grille: new THREE.MeshStandardMaterial({ color: 0x343a3a, roughness: 0.42, metalness: 0.78 }),
      black: new THREE.MeshStandardMaterial({ color: 0x101313, roughness: 0.67, metalness: 0.35 }),
      copper: new THREE.MeshStandardMaterial({ color: 0x8e5735, roughness: 0.35, metalness: 0.82 }),
      warning: new THREE.MeshStandardMaterial({ color: 0xe8bd36, roughness: 0.5, metalness: 0.18 }),
      white: new THREE.MeshStandardMaterial({ color: 0xe4e5db, roughness: 0.64, metalness: 0.08 }),
      rubber: new THREE.MeshStandardMaterial({ color: 0x171a19, roughness: 0.9, metalness: 0.05 })
    };

    function box(width, height, depth, material, x, y, z, parent = scene) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function cylinder(radiusTop, radiusBottom, height, segments, material, x, y, z, parent = scene) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments),
        material
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function torus(major, tube, radialSegments, tubularSegments, material, x, y, z, parent = scene) {
      const mesh = new THREE.Mesh(
        new THREE.TorusGeometry(major, tube, radialSegments, tubularSegments),
        material
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addEdges(mesh, color = 0x4d5352, opacity = 0.55) {
      const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(mesh.geometry, 35),
        new THREE.LineBasicMaterial({ color, transparent: true, opacity })
      );
      edges.position.copy(mesh.position);
      edges.rotation.copy(mesh.rotation);
      edges.scale.copy(mesh.scale);
      mesh.parent.add(edges);
      return edges;
    }

    const roof = box(15, 0.34, 11, materials.roof, 0, -0.17, 0);
    roof.receiveShadow = true;
    box(15.18, 0.16, 11.18, materials.roofEdge, 0, -0.38, 0);

    const roofLines = new THREE.Group();
    scene.add(roofLines);
    const seamMat = new THREE.MeshStandardMaterial({ color: 0x626664, roughness: 0.95, metalness: 0.05 });
    for (let x = -6; x <= 6; x += 2) {
      box(0.018, 0.008, 10.6, seamMat, x, 0.008, 0, roofLines);
    }
    for (let z = -4; z <= 4; z += 2) {
      box(14.6, 0.008, 0.018, seamMat, 0, 0.009, z, roofLines);
    }

    const curb = new THREE.Group();
    scene.add(curb);
    box(5.35, 0.42, 2.76, materials.curb, 0, 0.23, 0, curb);
    box(4.95, 0.21, 2.38, materials.curbDark, 0, 0.34, 0, curb);
    box(5.55, 0.13, 2.96, materials.curb, 0, 0.49, 0, curb);

    const unit = new THREE.Group();
    unit.position.y = 0.55;
    scene.add(unit);

    const body = box(5.25, 2.48, 2.7, materials.metal, 0, 1.27, 0, unit);
    addEdges(body, 0x505655, 0.55);

    box(5.36, 0.1, 2.81, materials.seam, 0, 0.08, 0, unit);
    box(5.4, 0.12, 2.83, materials.metalLight, 0, 2.54, 0, unit);
    box(5.5, 0.09, 2.92, materials.seam, 0, 2.64, 0, unit);

    const roofCap = box(5.58, 0.11, 3.0, materials.metalLight, 0, 2.71, 0, unit);
    addEdges(roofCap, 0x5b6160, 0.55);
    box(5.45, 0.065, 2.88, materials.seam, 0, 2.625, 0, unit);

    for (const x of [-2.52, 2.52]) {
      box(0.055, 2.3, 2.56, materials.metalLight, x, 1.31, 0, unit);
    }

    function addFrontPanel(x, width, height, centerY, options = {}) {
      const z = 1.372;
      const panel = box(width, height, 0.045, options.material || materials.panel, x, centerY, z, unit);
      addEdges(panel, 0x444a49, 0.75);

      const rail = 0.035;
      box(width - 0.07, rail, 0.025, materials.seam, x, centerY + height / 2 - 0.055, z + 0.035, unit);
      box(width - 0.07, rail, 0.025, materials.seam, x, centerY - height / 2 + 0.055, z + 0.035, unit);

      const screwPositions = [
        [-width / 2 + 0.085, -height / 2 + 0.09],
        [ width / 2 - 0.085, -height / 2 + 0.09],
        [-width / 2 + 0.085,  height / 2 - 0.09],
        [ width / 2 - 0.085,  height / 2 - 0.09]
      ];
      for (const [sx, sy] of screwPositions) {
        const screw = cylinder(0.025, 0.025, 0.018, 12, materials.dark, x + sx, centerY + sy, z + 0.045, unit);
        screw.rotation.x = Math.PI / 2;
      }

      if (options.handle) {
        box(0.17, 0.055, 0.055, materials.dark, x + width / 2 - 0.18, centerY + 0.15, z + 0.075, unit);
        box(0.045, 0.2, 0.055, materials.dark, x + width / 2 - 0.245, centerY + 0.07, z + 0.075, unit);
      }

      if (options.warning) {
        const plate = box(0.34, 0.25, 0.014, materials.warning, x - 0.05, centerY + 0.2, z + 0.047, unit);
        addEdges(plate, 0x725d16, 0.8);
        const triangle = new THREE.Shape();
        triangle.moveTo(0, 0.075);
        triangle.lineTo(-0.075, -0.06);
        triangle.lineTo(0.075, -0.06);
        triangle.closePath();
        const mark = new THREE.Mesh(
          new THREE.ShapeGeometry(triangle),
          new THREE.MeshBasicMaterial({ color: 0x292817 })
        );
        mark.position.set(x - 0.05, centerY + 0.2, z + 0.056);
        unit.add(mark);
      }
    }

    addFrontPanel(-1.82, 1.42, 2.17, 1.27, { handle: true, warning: true });
    addFrontPanel(-0.35, 1.39, 2.17, 1.27, { handle: true });
    addFrontPanel(1.13, 1.42, 2.17, 1.27, { handle: true });

    const louverPanel = box(1.06, 2.17, 0.05, materials.panel, 2.06, 1.27, 1.375, unit);
    addEdges(louverPanel, 0x454b4a, 0.8);

    box(0.84, 1.65, 0.04, materials.black, 2.06, 1.35, 1.413, unit);
    const frontLouverGroup = new THREE.Group();
    unit.add(frontLouverGroup);
    for (let i = 0; i < 16; i++) {
      const y = 0.62 + i * 0.098;
      const slat = box(0.87, 0.045, 0.105, materials.grille, 2.06, y, 1.46, frontLouverGroup);
      slat.rotation.x = -0.22;
    }
    box(0.05, 1.68, 0.07, materials.seam, 1.61, 1.35, 1.46, unit);
    box(0.05, 1.68, 0.07, materials.seam, 2.51, 1.35, 1.46, unit);

    function addSidePanel(z, width, centerZ, centerY, height) {
      const x = -2.657;
      const panel = box(0.045, height, width, materials.panel, x, centerY, centerZ, unit);
      addEdges(panel, 0x444a49, 0.72);
      for (const sy of [-1, 1]) {
        for (const sz of [-1, 1]) {
          const screw = cylinder(
            0.024, 0.024, 0.018, 12, materials.dark,
            x - 0.03,
            centerY + sy * (height / 2 - 0.09),
            centerZ + sz * (width / 2 - 0.09),
            unit
          );
          screw.rotation.z = Math.PI / 2;
        }
      }
    }

    addSidePanel(0, 1.1, -0.72, 1.27, 2.16);
    addSidePanel(0, 1.1, 0.72, 1.27, 2.16);

    const sideVentBack = box(0.05, 1.56, 1.05, materials.black, -2.688, 1.35, -0.72, unit);
    for (let i = 0; i < 15; i++) {
      const y = 0.67 + i * 0.096;
      const slat = box(0.105, 0.042, 1.08, materials.grille, -2.73, y, -0.72, unit);
      slat.rotation.z = 0.22;
    }

    const sideService = box(0.05, 1.84, 1.05, materials.panel, -2.686, 1.27, 0.72, unit);
    addEdges(sideService, 0x444a49, 0.8);
    box(0.07, 0.24, 0.07, materials.dark, -2.735, 1.44, 1.08, unit);
    box(0.07, 0.055, 0.25, materials.dark, -2.735, 1.54, 1.0, unit);

    const rightVentBack = box(0.05, 1.55, 1.85, materials.black, 2.687, 1.36, -0.25, unit);
    for (let i = 0; i < 15; i++) {
      const y = 0.69 + i * 0.094;
      const slat = box(0.105, 0.042, 1.88, materials.grille, 2.73, y, -0.25, unit);
      slat.rotation.z = -0.22;
    }
    box(0.07, 1.62, 0.045, materials.seam, 2.745, 1.36, -1.2, unit);
    box(0.07, 1.62, 0.045, materials.seam, 2.745, 1.36, 0.7, unit);

    const backPanelA = box(2.48, 2.14, 0.045, materials.panel, -1.31, 1.27, -1.373, unit);
    const backPanelB = box(2.48, 2.14, 0.045, materials.panel, 1.31, 1.27, -1.373, unit);
    addEdges(backPanelA, 0x474d4c, 0.62);
    addEdges(backPanelB, 0x474d4c, 0.62);

    for (const x of [-2.44, -0.18, 0.18, 2.44]) {
      for (const y of [0.3, 2.24]) {
        const screw = cylinder(0.024, 0.024, 0.018, 12, materials.dark, x, y, -1.41, unit);
        screw.rotation.x = Math.PI / 2;
      }
    }

    const fanGroup = new THREE.Group();
    fanGroup.position.set(0.95, 2.82, 0);
    unit.add(fanGroup);

    cylinder(1.02, 1.02, 0.06, 64, materials.dark, 0, 0, 0, fanGroup);
    cylinder(0.92, 0.92, 0.07, 64, materials.black, 0, 0.025, 0, fanGroup);

    const bladeMaterial = new THREE.MeshStandardMaterial({
      color: 0x313737,
      roughness: 0.45,
      metalness: 0.72
    });

    for (let i = 0; i < 7; i++) {
      const angle = i * Math.PI * 2 / 7;
      const blade = box(0.67, 0.025, 0.25, bladeMaterial, 0, 0.08, 0, fanGroup);
      blade.position.x = Math.cos(angle) * 0.47;
      blade.position.z = Math.sin(angle) * 0.47;
      blade.rotation.y = -angle + 0.55;
      blade.rotation.z = 0.04;
    }

    cylinder(0.18, 0.2, 0.14, 32, materials.grille, 0, 0.13, 0, fanGroup);
    cylinder(0.09, 0.09, 0.04, 24, materials.metalLight, 0, 0.22, 0, fanGroup);

    for (const radius of [0.2, 0.38, 0.56, 0.74, 0.91, 1.03]) {
      const ring = torus(radius, 0.018, 8, 64, materials.grille, 0, 0.205, 0, fanGroup);
      ring.rotation.x = Math.PI / 2;
    }

    for (let i = 0; i < 16; i++) {
      const angle = i * Math.PI * 2 / 16;
      const spoke = box(2.02, 0.025, 0.025, materials.grille, 0, 0.205, 0, fanGroup);
      spoke.rotation.y = angle;
    }

    for (let i = 0; i < 8; i++) {
      const angle = i * Math.PI * 2 / 8;
      const bolt = cylinder(
        0.028, 0.028, 0.035, 10, materials.metalLight,
        Math.cos(angle) * 0.98, 0.225, Math.sin(angle) * 0.98, fanGroup
      );
    }

    const topHatch = box(1.55, 0.06, 1.45, materials.panel, -1.55, 2.79, 0, unit);
    addEdges(topHatch, 0x555b5a, 0.68);
    for (const x of [-2.19, -0.91]) {
      for (const z of [-0.57, 0.57]) {
        cylinder(0.026, 0.026, 0.025, 12, materials.dark, x, 2.835, z, unit);
      }
    }

    const disconnect = new THREE.Group();
    disconnect.position.set(-3.18, 1.15, 0.62);
    scene.add(disconnect);
    box(0.42, 0.67, 0.24, materials.metalLight, 0, 0, 0, disconnect);
    box(0.32, 0.5, 0.025, materials.panel, 0, 0.02, 0.135, disconnect);
    addEdges(disconnect.children[0], 0x474d4c, 0.7);
    box(0.055, 0.22, 0.06, materials.dark, 0.1, 0.05, 0.17, disconnect);
    box(0.17, 0.055, 0.06, materials.dark, 0.045, 0.14, 0.17, disconnect);
    const smallWarning = box(0.16, 0.13, 0.012, materials.warning, -0.05, -0.14, 0.153, disconnect);
    addEdges(smallWarning, 0x715c18, 0.8);

    const conduitMat = materials.seam;
    const conduitA = cylinder(0.035, 0.035, 0.62, 16, conduitMat, -3.18, 0.64, 0.62);
    const conduitB = cylinder(0.035, 0.035, 0.48, 16, conduitMat, -2.91, 0.63, 0.62);
    const elbow = torus(0.135, 0.035, 8, 20, conduitMat, -3.045, 0.88, 0.62);
    elbow.rotation.y = Math.PI / 2;

    const pipeGroup = new THREE.Group();
    scene.add(pipeGroup);
    const pipe1 = cylinder(0.055, 0.055, 1.08, 18, materials.copper, -2.35, 0.55, -1.65, pipeGroup);
    pipe1.rotation.x = Math.PI / 2;
    const pipe2 = cylinder(0.035, 0.035, 1.16, 18, materials.copper, -2.15, 0.5, -1.7, pipeGroup);
    pipe2.rotation.x = Math.PI / 2;
    torus(0.16, 0.052, 10, 24, materials.copper, -2.35, 0.55, -2.18, pipeGroup);
    torus(0.13, 0.033, 10, 24, materials.copper, -2.15, 0.5, -2.27, pipeGroup);

    for (const x of [-2.15, 2.15]) {
      for (const z of [-1.05, 1.05]) {
        box(0.38, 0.08, 0.32, materials.rubber, x, 0.54, z);
      }
    }

    const drain = new THREE.Group();
    scene.add(drain);
    const drainVertical = cylinder(0.045, 0.045, 0.72, 18, materials.seam, 2.4, 0.36, 1.66, drain);
    const drainHorizontal = cylinder(0.045, 0.045, 0.82, 18, materials.seam, 2.78, 0.08, 1.66, drain);
    drainHorizontal.rotation.z = Math.PI / 2;
    const drainEnd = cylinder(0.06, 0.06, 0.08, 18, materials.seam, 3.18, 0.08, 1.66, drain);
    drainEnd.rotation.z = Math.PI / 2;

    const plaque = box(0.68, 0.34, 0.014, materials.white, -0.36, 1.0, 1.426, unit);
    addEdges(plaque, 0x686b65, 0.85);
    for (let i = 0; i < 5; i++) {
      box(0.48 - i * 0.035, 0.012, 0.008, materials.dark, -0.4, 1.1 - i * 0.047, 1.439, unit);
    }

    const shadowPad = new THREE.Mesh(
      new THREE.PlaneGeometry(7.5, 5.3),
      new THREE.ShadowMaterial({ color: 0x202424, opacity: 0.15 })
    );
    shadowPad.rotation.x = -Math.PI / 2;
    shadowPad.position.y = 0.012;
    shadowPad.receiveShadow = true;
    scene.add(shadowPad);

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', resize);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
