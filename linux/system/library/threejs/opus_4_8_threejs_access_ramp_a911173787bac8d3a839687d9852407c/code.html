<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ADA Accessibility Ramp — three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17191c; }
  #c { display: block; width: 100%; height: 100%; }
  #label {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: rgba(230,235,240,0.55); letter-spacing: 0.3px; user-select: none;
    pointer-events: none;
  }
  #label b { color: rgba(230,235,240,0.8); font-weight: 600; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="label"><b>ADA Access Ramp</b> — 1:12 slope · procedural three.js · drag to orbit</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ------------------------------------------------------------------ *
 *  Renderer
 * ------------------------------------------------------------------ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

/* ------------------------------------------------------------------ *
 *  Scene & camera
 * ------------------------------------------------------------------ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17191c);
scene.fog = new THREE.Fog(0x17191c, 20, 46);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(10.5, 5.6, 10.5);

/* Procedural studio environment for realistic metal reflections */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ------------------------------------------------------------------ *
 *  Orbit controls
 * ------------------------------------------------------------------ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.minDistance = 6;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI * 0.495;
controls.target.set(0, 0.85, 0);

/* ------------------------------------------------------------------ *
 *  Lighting  (hemisphere fill + key / fill / rim directionals)
 * ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0xcdd8e6, 0x2b2622, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2e2, 2.7);
key.position.set(7, 9.5, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 42;
key.shadow.camera.left = -9;
key.shadow.camera.right = 9;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -5;
key.shadow.bias = -0.0002;
key.shadow.normalBias = 0.02;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9fb4d0, 0.7);
fill.position.set(-8, 4.5, 4);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xbfd0e6, 1.1);
rim.position.set(-5, 6, -9);
scene.add(rim);

/* ------------------------------------------------------------------ *
 *  Ground plane (subtle, receives shadows)
 * ------------------------------------------------------------------ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(120, 120),
  new THREE.MeshStandardMaterial({ color: 0x101317, roughness: 1.0, metalness: 0.0 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ------------------------------------------------------------------ *
 *  Procedural concrete texture
 * ------------------------------------------------------------------ */
function makeConcreteTexture() {
  const s = 512;
  const cvs = document.createElement('canvas');
  cvs.width = cvs.height = s;
  const ctx = cvs.getContext('2d');
  ctx.fillStyle = '#8f8f89';
  ctx.fillRect(0, 0, s, s);

  const img = ctx.getImageData(0, 0, s, s);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * 34;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  ctx.putImageData(img, 0, 0);

  // aggregate speckle
  for (let k = 0; k < 2200; k++) {
    const x = Math.random() * s, y = Math.random() * s, r = Math.random() * 1.8 + 0.3;
    ctx.fillStyle = 'rgba(30,28,24,' + (Math.random() * 0.14) + ')';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.06) + ')';
    ctx.beginPath(); ctx.arc(x, y, r * 0.6, 0, Math.PI * 2); ctx.fill();
  }
  const tex = new THREE.CanvasTexture(cvs);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}
const concreteBase = makeConcreteTexture();

function concreteMat(repX, repY) {
  const t = concreteBase.clone();
  t.needsUpdate = true;
  t.repeat.set(repX, repY);
  return new THREE.MeshStandardMaterial({ map: t, color: 0xcfcec8, roughness: 0.94, metalness: 0.0 });
}

/* Materials */
const steelMat  = new THREE.MeshStandardMaterial({ color: 0xb9bec4, metalness: 0.95, roughness: 0.32 });
const steelDark = new THREE.MeshStandardMaterial({ color: 0x565a60, metalness: 0.85, roughness: 0.45 });
const curbMat   = concreteMat(4, 1);
const footMat   = new THREE.MeshStandardMaterial({ color: 0x2c2e31, metalness: 0.3, roughness: 0.85 });

/* ------------------------------------------------------------------ *
 *  Dimensions (metres — buildable ADA proportions)
 * ------------------------------------------------------------------ */
const H         = 0.60;   // landing / top of ramp height (rise)
const rampRunX  = 7.20;   // horizontal run  ->  slope = 0.58 : 7.20 ≈ 1:12.4
const landingLen= 1.60;   // level landing length (63" > 60" min)
const deckW     = 1.25;   // deck width (49" ; ~44" clear between rails)
const t         = 0.12;   // deck thickness
const yBottom   = 0.02;   // walking surface height at foot of ramp

const xBottom   = -(rampRunX + landingLen) / 2;   // -4.40
const xTopRamp  = xBottom + rampRunX;             //  2.80
const xEnd      = xTopRamp + landingLen;          //  4.40

const dh    = H - yBottom;
const theta = Math.atan2(dh, rampRunX);           // ramp pitch
const Lramp = Math.hypot(rampRunX, dh);

function surfaceAt(x) {
  if (x <= xTopRamp) return yBottom + (x - xBottom) / rampRunX * dh;
  return H;
}

const ramp = new THREE.Group();

/* ---------- helpers ---------- */
function addBox(group, w, h, d, mat, x, y, z, rotZ = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  if (rotZ) m.rotation.z = rotZ;
  m.castShadow = true; m.receiveShadow = true;
  group.add(m);
  return m;
}
const UP = new THREE.Vector3(0, 1, 0);
function addCyl(group, a, b, r, mat, cast = true) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 14), mat);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(UP, dir.normalize());
  m.castShadow = cast; m.receiveShadow = true;
  group.add(m);
  return m;
}
function addSphere(group, p, r, mat) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 12), mat);
  m.position.copy(p);
  m.castShadow = true; m.receiveShadow = true;
  group.add(m);
  return m;
}

/* ------------------------------------------------------------------ *
 *  Deck slabs
 * ------------------------------------------------------------------ */
// Sloped ramp deck
const Mx = (xBottom + xTopRamp) / 2;
const My = (yBottom + H) / 2;
addBox(ramp, Lramp, t, deckW, concreteMat(rampRunX, deckW),
       Mx + (t / 2) * Math.sin(theta), My - (t / 2) * Math.cos(theta), 0, theta);

// Level landing deck
addBox(ramp, landingLen, t, deckW, concreteMat(landingLen, deckW),
       (xTopRamp + xEnd) / 2, H - t / 2, 0);

// Low curb / edge protection along both sides (concrete lip)
const curbH = 0.10, curbW = 0.06;
const zc = deckW / 2 - 0.04;
for (const side of [-1, 1]) {
  // ramp curb
  addBox(ramp, Lramp, curbH, curbW, curbMat,
         Mx - (curbH / 2) * Math.sin(theta), My + (curbH / 2) * Math.cos(theta), side * zc, theta);
  // landing curb
  addBox(ramp, landingLen, curbH, curbW, curbMat,
         (xTopRamp + xEnd) / 2, H + curbH / 2, side * zc);
}

/* ------------------------------------------------------------------ *
 *  Handrails  (top graspable rail @0.90, bottom rail, posts, balusters)
 * ------------------------------------------------------------------ */
const topOff = 0.90, botOff = 0.14;
const railR = 0.022, botR = 0.018, postR = 0.024, balR = 0.008;
const zRail = deckW / 2 - 0.06;

function railLine(z, offset, radius, withExt) {
  const p0 = new THREE.Vector3(xBottom, yBottom + offset, z);
  const p1 = new THREE.Vector3(xTopRamp, H + offset, z);
  const p2 = new THREE.Vector3(xEnd, H + offset, z);
  addCyl(ramp, p0, p1, radius, steelMat);   // sloped span
  addCyl(ramp, p1, p2, radius, steelMat);   // level span
  addSphere(ramp, p1, radius, steelMat);    // bend

  if (withExt) {
    // bottom extension (~12") + ground return
    const eB = new THREE.Vector3(xBottom - 0.30, yBottom + offset, z);
    addCyl(ramp, eB, p0, radius, steelMat);
    addSphere(ramp, p0, radius, steelMat);
    addCyl(ramp, eB, new THREE.Vector3(eB.x, yBottom + 0.02, z), radius, steelMat);
    // top extension + ground return
    const eT = new THREE.Vector3(xEnd + 0.30, H + offset, z);
    addCyl(ramp, p2, eT, radius, steelMat);
    addSphere(ramp, p2, radius, steelMat);
    addCyl(ramp, eT, new THREE.Vector3(eT.x, H + 0.02, z), radius, steelMat);
  }
}

// Vertical structural posts
const postXs = [-4.4, -3.2, -2.0, -0.8, 0.4, 1.6, 2.8, 3.6, 4.4];

for (const side of [-1, 1]) {
  const z = side * zRail;
  // top graspable rail (with extensions) + bottom rail
  railLine(z, topOff, railR, true);
  railLine(z, botOff, botR, false);

  // posts
  for (const x of postXs) {
    const s = surfaceAt(x);
    addCyl(ramp, new THREE.Vector3(x, s, z), new THREE.Vector3(x, s + topOff, z), postR, steelMat);
  }

  // balusters (guard infill between bottom and top rails)
  for (let x = xBottom + 0.16; x < xEnd - 0.05; x += 0.16) {
    const s = surfaceAt(x);
    addCyl(ramp, new THREE.Vector3(x, s + botOff, z), new THREE.Vector3(x, s + topOff, z), balR, steelMat, false);
  }
}

/* ------------------------------------------------------------------ *
 *  Sub-structure  (support legs, beams, footings)
 * ------------------------------------------------------------------ */
const legR = 0.045;
const zLeg = deckW / 2 - 0.12;

function leg(x, z, topY) {
  addCyl(ramp, new THREE.Vector3(x, 0, z), new THREE.Vector3(x, topY, z), legR, steelDark);
  addBox(ramp, 0.20, 0.05, 0.20, footMat, x, 0.025, z); // footing pad
}

// under landing (4 corners) + cross beam
for (const side of [-1, 1]) {
  leg(xTopRamp + 0.18, side * zLeg, H - t);
  leg(xEnd - 0.18, side * zLeg, H - t);
}
addBox(ramp, 0.10, 0.10, deckW - 0.20, steelDark, xTopRamp + 0.18, H - t - 0.06, 0);
addBox(ramp, 0.10, 0.10, deckW - 0.20, steelDark, xEnd - 0.18, H - t - 0.06, 0);

// under ramp (intermediate bents)
for (const x of [-2.0, 0.4]) {
  const topY = surfaceAt(x) - t;
  for (const side of [-1, 1]) leg(x, side * zLeg, topY);
  addBox(ramp, 0.09, 0.09, deckW - 0.20, steelDark, x, topY - 0.055, 0);
}

/* ------------------------------------------------------------------ *
 *  Add to scene (centred)
 * ------------------------------------------------------------------ */
scene.add(ramp);

/* ------------------------------------------------------------------ *
 *  Resize + render loop
 * ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
