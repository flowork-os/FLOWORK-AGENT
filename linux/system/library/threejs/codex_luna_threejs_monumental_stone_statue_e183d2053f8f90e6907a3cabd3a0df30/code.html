<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monumental Stone Statue</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #151719;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17191b);
scene.fog = new THREE.Fog(0x17191b, 24, 43);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(14, 10.5, 17);
camera.lookAt(0, 6.1, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 6.1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 10;
controls.maxDistance = 28;
controls.maxPolarAngle = Math.PI * 0.48;

const stone = new THREE.MeshStandardMaterial({
  color: 0x817b70,
  roughness: 0.91,
  metalness: 0
});
const stoneLight = new THREE.MeshStandardMaterial({
  color: 0x999286,
  roughness: 0.94
});
const stoneDark = new THREE.MeshStandardMaterial({
  color: 0x625f58,
  roughness: 0.98
});
const stoneWarm = new THREE.MeshStandardMaterial({
  color: 0x8b8375,
  roughness: 0.96
});
const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0x292a27,
  roughness: 1
});

function addBox(name, size, position, material, rotation = [0, 0, 0]) {
  const geometry = new THREE.BoxGeometry(size[0], size[1], size[2]);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.name = name;
  mesh.position.set(position[0], position[1], position[2]);
  mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function addCylinder(name, radiusTop, radiusBottom, height, position, material, segments = 12) {
  const geometry = new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments, 1, false);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.name = name;
  mesh.position.set(position[0], position[1], position[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function addSphere(name, scale, position, material, segments = 20) {
  const geometry = new THREE.SphereGeometry(1, segments, Math.max(12, Math.floor(segments * 0.7)));
  const mesh = new THREE.Mesh(geometry, material);
  mesh.name = name;
  mesh.scale.set(scale[0], scale[1], scale[2]);
  mesh.position.set(position[0], position[1], position[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function addBetween(name, start, end, radius, material, segments = 10) {
  const a = new THREE.Vector3(start[0], start[1], start[2]);
  const b = new THREE.Vector3(end[0], end[1], end[2]);
  const direction = new THREE.Vector3().subVectors(b, a);
  const length = direction.length();
  const geometry = new THREE.CylinderGeometry(radius, radius * 1.08, length, segments, 1, false);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.name = name;
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function addStoneTile(x, y, z, sx, sy, sz, material, rx = 0, ry = 0, rz = 0) {
  return addBox("weathered stone block", [sx, sy, sz], [x, y, z], material, [rx, ry, rz]);
}

const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), groundMaterial);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.04;
ground.receiveShadow = true;
scene.add(ground);

addBox("foundation shadow course", [9.2, 0.55, 8.4], [0, 0.28, 0], stoneDark);
addBox("lower plinth", [8.2, 0.72, 7.45], [0, 0.88, 0], stoneWarm);
addBox("middle plinth", [7.25, 0.62, 6.65], [0, 1.55, 0], stone);
addBox("upper plinth", [6.35, 0.55, 5.8], [0, 2.12, 0], stoneLight);
addBox("cap slab", [5.75, 0.42, 5.25], [0, 2.60, 0], stoneDark);
addBox("statue footing", [4.5, 0.52, 4.1], [0, 3.07, 0], stoneLight);

const baseStones = [
  [-3.15, 0.63, 2.05, 2.1, 0.42, 1.0, stone],
  [3.05, 0.63, -1.95, 2.0, 0.42, 1.05, stoneDark],
  [-3.0, 1.15, -2.25, 1.65, 0.4, 0.78, stoneLight],
  [2.95, 1.78, 2.45, 1.55, 0.34, 0.72, stoneWarm],
  [-2.72, 2.31, 2.15, 1.4, 0.3, 0.6, stoneDark],
  [2.55, 2.86, -1.92, 1.45, 0.28, 0.62, stoneLight]
];
for (const item of baseStones) {
  addStoneTile(item[0], item[1], item[2], item[3], item[4], item[5], item[6], 0, item[0] * 0.018, item[0] * 0.009);
}

const robe = addCylinder("massive faceted robe", 1.10, 1.82, 5.45, [0, 5.95, 0], stone, 10);
robe.rotation.y = Math.PI / 10;

addCylinder("upper mantle", 1.17, 1.42, 1.35, [0, 8.46, 0], stoneLight, 10);
addBox("left mantle plane", [1.5, 2.35, 0.38], [-0.87, 7.72, 0.03], stoneWarm, [0, 0, -0.18]);
addBox("right mantle plane", [1.5, 2.35, 0.38], [0.87, 7.72, 0.03], stoneDark, [0, 0, 0.18]);

const foldData = [
  [-1.12, 6.05, 0.86, 0.23, 3.95, 0.25, 0.06],
  [-0.58, 5.8, 1.4, 0.2, 4.25, 0.22, -0.025],
  [0.02, 5.72, 1.58, 0.24, 4.42, 0.25, 0],
  [0.63, 5.86, 1.35, 0.2, 4.1, 0.22, 0.03],
  [1.18, 6.08, 0.77, 0.22, 3.85, 0.24, -0.06]
];
for (const fold of foldData) {
  addBox("deep robe fold", [fold[3], fold[4], fold[5]], [fold[0], fold[1], fold[2]], stoneDark, [0, fold[6], 0]);
}

addCylinder("neck", 0.49, 0.56, 0.75, [0, 9.25, 0], stoneDark, 10);
addSphere("hooded head", [0.82, 0.98, 0.72], [0, 10.18, 0.03], stoneLight, 18);
addCylinder("hood crown", 0.8, 1.08, 1.18, [0, 10.42, -0.08], stoneDark, 10);
addBox("hood front rim", [1.3, 0.27, 0.34], [0, 9.93, 0.58], stoneWarm, [0.08, 0, 0]);
addBox("brow plane", [0.74, 0.25, 0.28], [0, 10.27, 0.69], stoneDark, [0.1, 0, 0]);
addBox("nose plane", [0.22, 0.42, 0.26], [0, 10.02, 0.85], stone, [0.17, 0, 0]);

addBetween("left upper arm", [-1.0, 8.45, 0], [-2.0, 7.3, 0.02], 0.42, stoneLight, 10);
addBetween("left forearm", [-2.0, 7.3, 0.02], [-2.15, 5.98, 0.2], 0.34, stone, 10);
addSphere("left hand", [0.42, 0.58, 0.38], [-2.13, 5.63, 0.25], stoneDark, 14);

addBetween("right upper arm", [1.0, 8.45, 0], [2.0, 7.3, -0.04], 0.42, stone, 10);
addBetween("right forearm", [2.0, 7.3, -0.04], [2.18, 5.98, 0.18], 0.34, stoneLight, 10);
addSphere("right hand", [0.42, 0.58, 0.38], [2.16, 5.63, 0.23], stoneDark, 14);

addBox("left sleeve plane", [0.55, 2.1, 0.68], [-1.62, 7.65, 0.02], stoneDark, [0, 0, -0.24]);
addBox("right sleeve plane", [0.55, 2.1, 0.68], [1.62, 7.65, -0.02], stoneWarm, [0, 0, 0.24]);

addBox("front hem block", [2.1, 0.34, 0.55], [0, 3.38, 1.28], stoneLight, [0, 0, 0.02]);
addBox("left hem block", [0.78, 0.32, 0.5], [-1.13, 3.38, 0.92], stoneDark, [0, -0.08, -0.04]);
addBox("right hem block", [0.78, 0.32, 0.5], [1.13, 3.38, 0.92], stoneWarm, [0, 0.08, 0.04]);

const weatherMarks = [
  [-2.75, 1.98, 3.37, 0.95, 0.09, 0.08, stoneDark],
  [2.42, 1.27, 3.36, 0.8, 0.08, 0.1, stoneDark],
  [-2.48, 2.64, 3.0, 0.7, 0.07, 0.07, stoneDark],
  [2.2, 2.64, -2.91, 0.82, 0.08, 0.08, stoneDark],
  [-2.05, 0.42, 3.9, 1.0, 0.08, 0.08, stoneDark],
  [2.1, 0.42, 3.9, 0.7, 0.08, 0.08, stoneDark]
];
for (const mark of weatherMarks) {
  addBox("weathering seam", [mark[3], mark[4], mark[5]], [mark[0], mark[1], mark[2]], mark[6], [0, 0.02, 0.03]);
}

const hemi = new THREE.HemisphereLight(0xb8c3c9, 0x292822, 1.45);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xffe6bd, 3.2);
keyLight.position.set(-8, 15, 10);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -14;
keyLight.shadow.camera.right = 14;
keyLight.shadow.camera.top = 18;
keyLight.shadow.camera.bottom = -5;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 38;
keyLight.shadow.bias = -0.00025;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x91b7d0, 1.25);
rimLight.position.set(10, 10, -12);
scene.add(rimLight);

const fillLight = new THREE.PointLight(0x806b54, 0.7, 25);
fillLight.position.set(-7, 4, 6);
scene.add(fillLight);

const halo = new THREE.Mesh(
  new THREE.CylinderGeometry(5.7, 5.7, 0.02, 64),
  new THREE.MeshBasicMaterial({ color: 0x36342f, transparent: true, opacity: 0.22 })
);
halo.position.y = 0.015;
halo.receiveShadow = true;
scene.add(halo);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
