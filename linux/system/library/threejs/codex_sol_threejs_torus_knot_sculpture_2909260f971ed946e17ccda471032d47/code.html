<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parametric Torus-Knot Sculpture</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #d8d5ce;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xd8d5ce);
  scene.fog = new THREE.Fog(0xd8d5ce, 16, 28);

  const camera = new THREE.PerspectiveCamera(
    38,
    window.innerWidth / window.innerHeight,
    0.1,
    100
  );
  camera.position.set(8.4, 6.0, 10.8);

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance'
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const pmremGenerator = new THREE.PMREMGenerator(renderer);
  scene.environment = pmremGenerator.fromScene(
    new RoomEnvironment(renderer),
    0.04
  ).texture;
  pmremGenerator.dispose();

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 3.15, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.55;
  controls.minDistance = 7;
  controls.maxDistance = 20;
  controls.minPolarAngle = Math.PI * 0.19;
  controls.maxPolarAngle = Math.PI * 0.72;

  function knotPoint(t, target = new THREE.Vector3()) {
    const p = 3;
    const q = 2;
    const majorRadius = 2.12;
    const minorRadius = 0.86;
    const radial = majorRadius + minorRadius * Math.cos(q * t);

    return target.set(
      radial * Math.cos(p * t),
      radial * Math.sin(p * t),
      minorRadius * Math.sin(q * t)
    );
  }

  function knotTangent(t, target = new THREE.Vector3()) {
    const p = 3;
    const q = 2;
    const majorRadius = 2.12;
    const minorRadius = 0.86;
    const radial = majorRadius + minorRadius * Math.cos(q * t);
    const radialDerivative = -minorRadius * q * Math.sin(q * t);

    target.set(
      radialDerivative * Math.cos(p * t) - radial * p * Math.sin(p * t),
      radialDerivative * Math.sin(p * t) + radial * p * Math.cos(p * t),
      minorRadius * q * Math.cos(q * t)
    );

    return target.normalize();
  }

  function createRibbonGeometry() {
    const lengthSegments = 480;
    const crossSegments = 24;
    const halfWidth = 0.245;
    const halfThickness = 0.078;

    const positions = [];
    const normals = [];
    const uvs = [];
    const indices = [];

    const center = new THREE.Vector3();
    const tangent = new THREE.Vector3();
    const surfaceDirection = new THREE.Vector3();
    const widthAxis = new THREE.Vector3();
    const thicknessAxis = new THREE.Vector3();
    const vertexNormal = new THREE.Vector3();

    for (let i = 0; i <= lengthSegments; i++) {
      const u = i / lengthSegments;
      const t = u * Math.PI * 2;

      knotPoint(t, center);
      knotTangent(t, tangent);

      surfaceDirection.set(
        Math.cos(2 * t) * Math.cos(3 * t),
        Math.cos(2 * t) * Math.sin(3 * t),
        Math.sin(2 * t)
      );

      widthAxis.copy(surfaceDirection)
        .addScaledVector(tangent, -surfaceDirection.dot(tangent))
        .normalize();

      thicknessAxis.crossVectors(tangent, widthAxis).normalize();

      for (let j = 0; j < crossSegments; j++) {
        const v = j / crossSegments;
        const angle = v * Math.PI * 2;
        const cosAngle = Math.cos(angle);
        const sinAngle = Math.sin(angle);

        positions.push(
          center.x + widthAxis.x * halfWidth * cosAngle
                   + thicknessAxis.x * halfThickness * sinAngle,
          center.y + widthAxis.y * halfWidth * cosAngle
                   + thicknessAxis.y * halfThickness * sinAngle,
          center.z + widthAxis.z * halfWidth * cosAngle
                   + thicknessAxis.z * halfThickness * sinAngle
        );

        vertexNormal.copy(widthAxis)
          .multiplyScalar(cosAngle / halfWidth)
          .addScaledVector(thicknessAxis, sinAngle / halfThickness)
          .normalize();

        normals.push(vertexNormal.x, vertexNormal.y, vertexNormal.z);
        uvs.push(u, v);
      }
    }

    for (let i = 0; i < lengthSegments; i++) {
      for (let j = 0; j < crossSegments; j++) {
        const nextJ = (j + 1) % crossSegments;
        const a = i * crossSegments + j;
        const b = (i + 1) * crossSegments + j;
        const c = (i + 1) * crossSegments + nextJ;
        const d = i * crossSegments + nextJ;

        indices.push(a, b, d, b, c, d);
      }
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute(
      'position',
      new THREE.Float32BufferAttribute(positions, 3)
    );
    geometry.setAttribute(
      'normal',
      new THREE.Float32BufferAttribute(normals, 3)
    );
    geometry.setAttribute(
      'uv',
      new THREE.Float32BufferAttribute(uvs, 2)
    );
    geometry.setIndex(indices);
    geometry.computeBoundingSphere();
    return geometry;
  }

  const sculptureGroup = new THREE.Group();

  const metalMaterial = new THREE.MeshPhysicalMaterial({
    color: new THREE.Color(0xd8dce0),
    metalness: 1,
    roughness: 0.085,
    clearcoat: 0.35,
    clearcoatRoughness: 0.08,
    envMapIntensity: 2.25
  });

  const ribbon = new THREE.Mesh(createRibbonGeometry(), metalMaterial);
  ribbon.rotation.x = Math.PI / 2;
  ribbon.position.y = 3.47;
  ribbon.castShadow = true;
  ribbon.receiveShadow = true;
  sculptureGroup.add(ribbon);

  const pedestalProfile = [
    new THREE.Vector2(0.00, 0.00),
    new THREE.Vector2(2.18, 0.00),
    new THREE.Vector2(2.30, 0.035),
    new THREE.Vector2(2.38, 0.12),
    new THREE.Vector2(2.41, 0.22),
    new THREE.Vector2(2.40, 0.33),
    new THREE.Vector2(2.34, 0.42),
    new THREE.Vector2(2.23, 0.48),
    new THREE.Vector2(0.00, 0.48)
  ];

  const pedestalGeometry = new THREE.LatheGeometry(
    pedestalProfile,
    128,
    0,
    Math.PI * 2
  );

  const pedestalMaterial = new THREE.MeshStandardMaterial({
    color: 0x303236,
    metalness: 0.08,
    roughness: 0.3,
    envMapIntensity: 0.7
  });

  const pedestal = new THREE.Mesh(pedestalGeometry, pedestalMaterial);
  pedestal.castShadow = true;
  pedestal.receiveShadow = true;
  sculptureGroup.add(pedestal);

  const insetGeometry = new THREE.CylinderGeometry(2.13, 2.13, 0.018, 128);
  const insetMaterial = new THREE.MeshPhysicalMaterial({
    color: 0x16181b,
    metalness: 0.65,
    roughness: 0.18,
    envMapIntensity: 1.2
  });
  const inset = new THREE.Mesh(insetGeometry, insetMaterial);
  inset.position.y = 0.489;
  inset.receiveShadow = true;
  sculptureGroup.add(inset);

  scene.add(sculptureGroup);

  const floorMaterial = new THREE.MeshStandardMaterial({
    color: 0xc8c4bc,
    metalness: 0,
    roughness: 0.82
  });

  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(18, 128),
    floorMaterial
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.012;
  floor.receiveShadow = true;
  scene.add(floor);

  const ambientLight = new THREE.HemisphereLight(0xf7f3e9, 0x555b63, 1.2);
  scene.add(ambientLight);

  const keyLight = new THREE.SpotLight(
    0xfff2df,
    950,
    24,
    Math.PI * 0.2,
    0.55,
    1.2
  );
  keyLight.position.set(5.5, 10.5, 6.5);
  keyLight.target.position.set(0, 3.0, 0);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  keyLight.shadow.camera.near = 2;
  keyLight.shadow.camera.far = 24;
  keyLight.shadow.bias = -0.0002;
  keyLight.shadow.normalBias = 0.025;
  scene.add(keyLight, keyLight.target);

  const rimLight = new THREE.DirectionalLight(0xb9d5ff, 3.8);
  rimLight.position.set(-6, 5, -5);
  scene.add(rimLight);

  const fillLight = new THREE.DirectionalLight(0xffd8b4, 2.1);
  fillLight.position.set(4, 2.5, -6);
  scene.add(fillLight);

  function resize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  window.addEventListener('resize', resize);

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  animate();
</script>
</body>
</html>
