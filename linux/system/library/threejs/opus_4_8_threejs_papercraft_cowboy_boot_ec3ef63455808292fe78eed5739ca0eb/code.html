<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Papercraft Cowboy Boot</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141518; }
  #app { position: fixed; inset: 0; }
  .caption {
    position: fixed; left: 16px; bottom: 14px;
    font: 500 13px/1.4 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: #cdb79a; letter-spacing: .04em; opacity: .55; user-select: none; pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="caption">Papercraft Cowboy Boot — drag to orbit</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const V = THREE.Vector3;

/* ------------------------------------------------------------------ *
 *  Renderer / Scene / Camera
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141518);
scene.fog = new THREE.Fog(0x141518, 13, 34);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4.4, 2.7, 5.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 3.5;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.5;

/* ------------------------------------------------------------------ *
 *  Lighting  (hemisphere + key/fill/rim)
 * ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0xa8c4d4, 0x3a2e22, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff1dc, 2.3);
key.position.set(4.5, 7.5, 5.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 6;
key.shadow.bias = -0.0004;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 26;
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 6;
key.shadow.camera.bottom = -3;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbfe0ff, 0.55);
fill.position.set(-5.5, 3.0, -1.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffe4bd, 1.05);
rim.position.set(-3.5, 4.5, -6.0);
scene.add(rim);

/* ------------------------------------------------------------------ *
 *  Ground — subtle studio floor that receives shadows only
 * ------------------------------------------------------------------ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color: 0x1d1f24, roughness: 1.0, metalness: 0.0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ------------------------------------------------------------------ *
 *  Procedural "printed cardstock" texture — tan panels with
 *  turquoise bands and dashed tooled stitching.
 *  v (down the canvas) runs shaft-top -> toe.
 * ------------------------------------------------------------------ */
function makeBootTexture() {
  const W = 512, H = 1024;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');

  g.fillStyle = '#c99f68';
  g.fillRect(0, 0, W, H);

  const grd = g.createLinearGradient(0, 0, W, 0);
  grd.addColorStop(0.0, 'rgba(0,0,0,0.07)');
  grd.addColorStop(0.5, 'rgba(255,255,255,0.06)');
  grd.addColorStop(1.0, 'rgba(0,0,0,0.07)');
  g.fillStyle = grd;
  g.fillRect(0, 0, W, H);

  // paper speckle
  for (let i = 0; i < 1400; i++) {
    const x = Math.random() * W, y = Math.random() * H;
    const dark = Math.random() < 0.5;
    g.fillStyle = 'rgba(' + (dark ? '120,90,52' : '244,224,186') + ',' + (0.03 + Math.random() * 0.05) + ')';
    g.fillRect(x, y, 2, 2);
  }

  const turq = '#23a89a', turqD = '#178b80', stitch = '#5a3a20', cream = '#f4e6c6';

  function dashH(y, col, w) {
    g.strokeStyle = col; g.lineWidth = w || 3; g.setLineDash([10, 8]);
    g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); g.setLineDash([]);
  }

  // top collar band
  g.fillStyle = turq; g.fillRect(0, 0, W, H * 0.115);
  g.fillStyle = turqD; g.fillRect(0, H * 0.115, W, H * 0.012);
  dashH(H * 0.10, cream);
  dashH(H * 0.128, stitch);

  // vertical decorative stitching on the shaft
  g.lineWidth = 3; g.setLineDash([9, 7]);
  for (let k = 0; k < 8; k++) {
    const x = (k + 0.5) / 8 * W;
    g.strokeStyle = (k % 2) ? stitch : turqD;
    g.beginPath(); g.moveTo(x, H * 0.15); g.lineTo(x, H * 0.44); g.stroke();
  }
  g.setLineDash([]);
  // tooled dots
  for (let k = 0; k < 8; k++)
    for (let r = 0; r < 5; r++) {
      const x = (k + 0.5) / 8 * W, y = H * (0.175 + r * 0.052);
      g.fillStyle = 'rgba(90,58,32,0.5)';
      g.beginPath(); g.arc(x, y, 2.3, 0, 7); g.fill();
    }

  // vamp / instep seam
  dashH(H * 0.47, stitch);
  dashH(H * 0.49, cream);

  g.setLineDash([8, 6]); g.strokeStyle = turqD; g.lineWidth = 3;
  for (let k = 0; k < 6; k++) {
    const x = (k + 0.5) / 6 * W;
    g.beginPath(); g.moveTo(x, H * 0.52); g.lineTo(x, H * 0.72); g.stroke();
  }
  g.setLineDash([]);

  // toe cap band
  g.fillStyle = turq; g.fillRect(0, H * 0.82, W, H * 0.18);
  g.fillStyle = turqD; g.fillRect(0, H * 0.82, W, H * 0.012);
  dashH(H * 0.835, cream);

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

/* ------------------------------------------------------------------ *
 *  Materials — stiff, matte, faceted cardstock
 * ------------------------------------------------------------------ */
const bootTex = makeBootTexture();
const bootMat = new THREE.MeshStandardMaterial({ map: bootTex, roughness: 0.92, metalness: 0.0, side: THREE.DoubleSide, flatShading: true });
const turquoiseMat = new THREE.MeshStandardMaterial({ color: 0x25a99b, roughness: 0.85, metalness: 0.0, side: THREE.DoubleSide, flatShading: true });
const soleMat = new THREE.MeshStandardMaterial({ color: 0x6a4d2c, roughness: 0.98, metalness: 0.0, side: THREE.DoubleSide, flatShading: true });
const heelMat = new THREE.MeshStandardMaterial({ color: 0x4c351f, roughness: 0.98, metalness: 0.0, side: THREE.DoubleSide, flatShading: true });
const innerMat = new THREE.MeshStandardMaterial({ color: 0x3a2a1b, roughness: 1.0, metalness: 0.0, side: THREE.DoubleSide, flatShading: true });
const silverMat = new THREE.MeshStandardMaterial({ color: 0xcdd2d8, roughness: 0.5, metalness: 0.35, side: THREE.DoubleSide, flatShading: true });

/* ------------------------------------------------------------------ *
 *  Boot spine (side view: X forward, Y up) + faceted cross-sections
 * ------------------------------------------------------------------ */
const spinePts = [
  new V(-0.10, 3.00, 0),
  new V( 0.00, 2.20, 0),
  new V( 0.14, 1.45, 0),
  new V( 0.24, 0.80, 0),
  new V( 0.45, 0.50, 0),
  new V( 1.00, 0.78, 0),
  new V( 1.70, 0.60, 0),
  new V( 2.40, 0.62, 0),
  new V( 2.90, 0.80, 0),
];
const curve = new THREE.CatmullRomCurve3(spinePts, false, 'catmullrom', 0.5);

// [t, halfWidth(Z), halfThickness(N)]
const PROFILE = [
  [0.00, 0.52, 0.50],
  [0.10, 0.46, 0.47],
  [0.22, 0.42, 0.44],
  [0.32, 0.40, 0.42],
  [0.42, 0.44, 0.42],
  [0.55, 0.49, 0.44],
  [0.68, 0.50, 0.45],
  [0.80, 0.46, 0.42],
  [0.90, 0.36, 0.34],
  [0.96, 0.22, 0.24],
  [1.00, 0.045, 0.07],
];

const BOOT_M = 12;   // facets around
const BOOT_R = 26;   // rings along length

const lerp = (a, b, t) => a + (b - a) * t;
function crossRadii(t) {
  t = Math.max(0, Math.min(1, t));
  for (let i = 0; i < PROFILE.length - 1; i++) {
    const a = PROFILE[i], b = PROFILE[i + 1];
    if (t >= a[0] && t <= b[0]) {
      const f = (t - a[0]) / (b[0] - a[0]);
      return { w: lerp(a[1], b[1], f), n: lerp(a[2], b[2], f) };
    }
  }
  const L = PROFILE[PROFILE.length - 1];
  return { w: L[1], n: L[2] };
}

function frameAt(t) {
  const P = curve.getPoint(t);
  const T = curve.getTangent(t);
  const N = new V(-T.y, T.x, 0).normalize(); // in-plane normal
  const B = new V(0, 0, 1);                  // width axis
  return { P, N, B };
}

// closed elliptical ring; dupSeam adds a duplicate final vertex for clean UVs
function ringAt(t, dupSeam, scale, radialOffset) {
  scale = (scale === undefined) ? 1 : scale;
  radialOffset = radialOffset || 0;
  const { w, n } = crossRadii(t);
  const { P, N, B } = frameAt(t);
  const count = dupSeam ? BOOT_M + 1 : BOOT_M;
  const arr = [];
  for (let j = 0; j < count; j++) {
    const a = 2 * Math.PI * ((j % BOOT_M) / BOOT_M);
    const ww = (w * scale + radialOffset) * Math.cos(a);
    const nn = (n * scale + radialOffset) * Math.sin(a);
    arr.push(P.clone().addScaledVector(B, ww).addScaledVector(N, nn));
  }
  return arr;
}

/* Generic tube builder from an array of equal-length rings */
function ringsToGeometry(rings, opts) {
  opts = opts || {};
  const closeLoop = opts.closeLoop !== false;
  const capStart = !!opts.capStart;
  const capEnd = !!opts.capEnd;
  const uvFn = opts.uvFn || null;

  const R = rings.length, K = rings[0].length;
  const pos = [], uv = [], idx = [];

  for (let i = 0; i < R; i++)
    for (let j = 0; j < K; j++) {
      const p = rings[i][j];
      pos.push(p.x, p.y, p.z);
      if (uvFn) { const t = uvFn(i, j, R, K); uv.push(t[0], t[1]); }
      else uv.push(j / (K - 1), i / (R - 1));
    }

  const jmax = closeLoop ? K : K - 1;
  for (let i = 0; i < R - 1; i++)
    for (let j = 0; j < jmax; j++) {
      const j2 = (j + 1) % K;
      const a = i * K + j, b = i * K + j2, c = (i + 1) * K + j2, d = (i + 1) * K + j;
      idx.push(a, b, c, a, c, d);
    }

  let vcount = R * K;
  function addCap(ri, reverse) {
    const base = ri * K;
    let cx = 0, cy = 0, cz = 0;
    for (let j = 0; j < K; j++) { const p = rings[ri][j]; cx += p.x; cy += p.y; cz += p.z; }
    cx /= K; cy /= K; cz /= K;
    const ci = vcount++;
    pos.push(cx, cy, cz); uv.push(0.5, 0.5);
    for (let j = 0; j < K; j++) {
      const j2 = (j + 1) % K;
      if (!reverse) idx.push(ci, base + j, base + j2);
      else idx.push(ci, base + j2, base + j);
    }
  }
  if (capStart) addCap(0, true);
  if (capEnd) addCap(R - 1, false);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}

function fanDisk(ring) {
  const K = ring.length;
  const pos = [], idx = [];
  let cx = 0, cy = 0, cz = 0;
  for (const p of ring) { cx += p.x; cy += p.y; cz += p.z; }
  cx /= K; cy /= K; cz /= K;
  pos.push(cx, cy, cz);
  for (const p of ring) pos.push(p.x, p.y, p.z);
  for (let j = 0; j < K; j++) { const j2 = (j + 1) % K; idx.push(0, 1 + j, 1 + j2); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* ------------------------------------------------------------------ *
 *  Assemble the single boot object
 * ------------------------------------------------------------------ */
const boot = new THREE.Group();

// --- main lofted body ---
const bodyRings = [];
for (let i = 0; i < BOOT_R; i++) bodyRings.push(ringAt(i / (BOOT_R - 1), true));
const bodyGeo = ringsToGeometry(bodyRings, {
  closeLoop: false, capEnd: true,
  uvFn: (i, j, R, K) => [j / (K - 1), i / (R - 1)]
});
boot.add(new THREE.Mesh(bodyGeo, bootMat));

// --- interior "cavity floor" so you can't see through the shaft ---
boot.add(new THREE.Mesh(fanDisk(ringAt(0.36, false)), innerMat));

// --- raised turquoise collar band (layered paper) ---
const collarRings = [];
for (let k = 0; k <= 4; k++) collarRings.push(ringAt(0.015 + 0.115 * (k / 4), false, 1, 0.035));
boot.add(new THREE.Mesh(ringsToGeometry(collarRings, { closeLoop: true }), turquoiseMat));

// --- raised turquoise toe cap ---
const toeRings = [];
for (let k = 0; k <= 5; k++) toeRings.push(ringAt(0.80 + 0.20 * (k / 5), false, 1, 0.03));
boot.add(new THREE.Mesh(ringsToGeometry(toeRings, { closeLoop: true, capEnd: true }), turquoiseMat));

// --- sole slab hugging the foot underside ---
const soleRings = [];
const SOLE_STEPS = 14, TH = 0.06;
for (let k = 0; k <= SOLE_STEPS; k++) {
  const t = 0.40 + (1.0 - 0.40) * (k / SOLE_STEPS);
  const { w, n } = crossRadii(t);
  const { P, N, B } = frameAt(t);
  const bottom = P.clone().addScaledVector(N, -n * 0.98);
  const wid = Math.max(w * 0.92, 0.03);
  const tl = bottom.clone().addScaledVector(B, wid);
  const tr = bottom.clone().addScaledVector(B, -wid);
  const bl = tl.clone().add(new V(0, -TH, 0));
  const br = tr.clone().add(new V(0, -TH, 0));
  soleRings.push([tl, tr, br, bl]);
}
boot.add(new THREE.Mesh(ringsToGeometry(soleRings, { closeLoop: true, capStart: true, capEnd: true }), soleMat));

// --- angular cuban heel block ---
const hTop = 0.44;
const heelRings = [
  [ new V(0.66, hTop, 0.33), new V(0.66, hTop, -0.33), new V(0.12, hTop, -0.33), new V(0.12, hTop, 0.33) ],
  [ new V(0.60, 0.0, 0.28), new V(0.60, 0.0, -0.28), new V(0.22, 0.0, -0.28), new V(0.22, 0.0, 0.28) ],
];
boot.add(new THREE.Mesh(ringsToGeometry(heelRings, { closeLoop: true, capStart: true, capEnd: true }), heelMat));

// --- two folded pull straps at the shaft top ---
function makeStrap(side) {
  const rings = [];
  const S = 6;
  for (let k = 0; k <= S; k++) {
    const p = k / S;
    const cx = 0.02 + Math.sin(p * Math.PI) * 0.06;
    const cy = 2.98 + p * 0.62;
    const cz = side * (0.46 + p * 0.10 + Math.sin(p * Math.PI) * 0.05);
    const c = new V(cx, cy, cz);
    const hw = 0.08 * (1.0 - 0.25 * p);  // slight taper
    const hz = 0.018;
    rings.push([
      c.clone().add(new V(hw, 0, side * hz)),
      c.clone().add(new V(hw, 0, -side * hz)),
      c.clone().add(new V(-hw, 0, -side * hz)),
      c.clone().add(new V(-hw, 0, side * hz)),
    ]);
  }
  return new THREE.Mesh(ringsToGeometry(rings, { closeLoop: true, capStart: true, capEnd: true }), turquoiseMat);
}
boot.add(makeStrap(1));
boot.add(makeStrap(-1));

// --- folded spur at the heel ---
const spur = new THREE.Group();

const band = new THREE.Mesh(new THREE.TorusGeometry(0.27, 0.022, 8, 22), silverMat);
band.rotation.y = Math.PI / 2;
band.position.set(0.24, 0.30, 0);
spur.add(band);

const arm = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.05, 0.05), silverMat);
arm.position.set(0.02, 0.24, 0);
spur.add(arm);

const starShape = new THREE.Shape();
const SP = 7, ro = 0.13, ri = 0.058;
for (let i = 0; i <= SP * 2; i++) {
  const ang = i / (SP * 2) * Math.PI * 2 - Math.PI / 2;
  const r = (i % 2) ? ri : ro;
  const x = Math.cos(ang) * r, y = Math.sin(ang) * r;
  if (i === 0) starShape.moveTo(x, y); else starShape.lineTo(x, y);
}
const rowelGeo = new THREE.ExtrudeGeometry(starShape, { depth: 0.03, bevelEnabled: false });
rowelGeo.translate(0, 0, -0.015);
const rowel = new THREE.Mesh(rowelGeo, silverMat);
rowel.rotation.y = Math.PI / 2;
rowel.position.set(-0.20, 0.24, 0);
spur.add(rowel);

boot.add(spur);

/* ------------------------------------------------------------------ *
 *  Center the single object & seat it on the ground
 * ------------------------------------------------------------------ */
boot.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

let box = new THREE.Box3().setFromObject(boot);
const c0 = box.getCenter(new V());
boot.position.x -= c0.x;
boot.position.z -= c0.z;
boot.position.y -= box.min.y;
scene.add(boot);

box = new THREE.Box3().setFromObject(boot);
const c1 = box.getCenter(new V());
controls.target.set(0, c1.y, 0);
controls.update();

/* ------------------------------------------------------------------ *
 *  Resize + render loop
 * ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
