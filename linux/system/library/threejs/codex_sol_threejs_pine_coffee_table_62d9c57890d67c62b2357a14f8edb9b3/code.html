<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pine Coffee Table</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #e9e5dd; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe9e5dd);
  scene.fog = new THREE.Fog(0xe9e5dd, 4.5, 9);

  const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.01, 30);
  camera.position.set(1.55, 1.05, 1.65);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.27, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.55;
  controls.minDistance = 1.15;
  controls.maxDistance = 4;
  controls.minPolarAngle = 0.35;
  controls.maxPolarAngle = Math.PI * 0.48;
  controls.enablePan = false;

  function seededRandom(seed) {
    let value = seed >>> 0;
    return function () {
      value = (value * 1664525 + 1013904223) >>> 0;
      return value / 4294967296;
    };
  }

  function createPineTexture(seed, width = 1024, height = 512) {
    const random = seededRandom(seed);
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');

    const image = ctx.createImageData(width, height);
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const broad = Math.sin(x * 0.022 + Math.sin(y * 0.014) * 1.8) * 4;
        const fine = Math.sin(x * 0.11 + y * 0.007) * 1.5;
        const noise = (random() - 0.5) * 5;
        const index = (y * width + x) * 4;
        image.data[index] = 205 + broad + fine + noise;
        image.data[index + 1] = 159 + broad * 0.75 + fine + noise;
        image.data[index + 2] = 96 + broad * 0.45 + noise;
        image.data[index + 3] = 255;
      }
    }
    ctx.putImageData(image, 0, 0);

    ctx.globalAlpha = 0.14;
    for (let i = 0; i < 58; i++) {
      const y = random() * height;
      const amplitude = 2 + random() * 10;
      const frequency = 0.008 + random() * 0.018;
      ctx.beginPath();
      ctx.strokeStyle = random() > 0.25 ? '#7d4926' : '#fff0bd';
      ctx.lineWidth = 0.45 + random() * 1.5;
      for (let x = -10; x <= width + 10; x += 8) {
        const yy = y + Math.sin(x * frequency + random() * 0.15) * amplitude;
        if (x === -10) ctx.moveTo(x, yy);
        else ctx.lineTo(x, yy);
      }
      ctx.stroke();
    }

    for (let i = 0; i < 5; i++) {
      const x = width * (0.16 + random() * 0.68);
      const y = height * (0.1 + random() * 0.8);
      const radius = 5 + random() * 10;
      ctx.strokeStyle = 'rgba(102,57,27,0.18)';
      ctx.lineWidth = 1.2;
      for (let ring = 0; ring < 4; ring++) {
        ctx.beginPath();
        ctx.ellipse(x, y, radius + ring * 5, 3 + ring * 2, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return texture;
  }

  function makeWoodMaterial(seed, repeatX, repeatY, color = 0xffffff) {
    const map = createPineTexture(seed);
    map.repeat.set(repeatX, repeatY);
    const bump = map.clone();
    bump.colorSpace = THREE.NoColorSpace;
    bump.needsUpdate = true;
    return new THREE.MeshStandardMaterial({
      color,
      map,
      bumpMap: bump,
      bumpScale: 0.006,
      roughness: 0.58,
      metalness: 0
    });
  }

  const topMaterial = makeWoodMaterial(17, 1.15, 1.3, 0xffefd0);
  const frameMaterial = makeWoodMaterial(31, 1.7, 0.75, 0xfbe5ba);
  const endMaterial = makeWoodMaterial(53, 0.7, 1.6, 0xf5d9a8);

  const table = new THREE.Group();
  table.rotation.y = -0.08;
  scene.add(table);

  function addPart(geometry, material, x, y, z, cast = true) {
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(x, y, z);
    mesh.castShadow = cast;
    mesh.receiveShadow = true;
    table.add(mesh);
    return mesh;
  }

  const topWidth = 1.2;
  const topDepth = 0.62;
  const topThickness = 0.058;
  const tableHeight = 0.45;
  const topCenterY = tableHeight - topThickness * 0.5;
  const undersideY = tableHeight - topThickness;

  const topGeometry = new RoundedBoxGeometry(topWidth, topThickness, topDepth, 5, 0.018);
  addPart(topGeometry, topMaterial, 0, topCenterY, 0);

  const legSize = 0.064;
  const legHeight = 0.345;
  const legCenterY = legHeight * 0.5;
  const legInsetX = 0.075;
  const legInsetZ = 0.065;
  const legX = topWidth * 0.5 - legInsetX - legSize * 0.5;
  const legZ = topDepth * 0.5 - legInsetZ - legSize * 0.5;
  const legGeometry = new RoundedBoxGeometry(legSize, legHeight, legSize, 3, 0.006);

  const legPositions = [
    [-legX, legCenterY, -legZ],
    [ legX, legCenterY, -legZ],
    [-legX, legCenterY,  legZ],
    [ legX, legCenterY,  legZ]
  ];

  legPositions.forEach((position, index) => {
    const leg = addPart(legGeometry, index % 2 ? frameMaterial : endMaterial, ...position);
    leg.rotation.y = index % 2 ? 0.012 : -0.01;
  });

  const apronHeight = 0.105;
  const apronThickness = 0.026;
  const apronCenterY = undersideY - apronHeight * 0.5 + 0.003;
  const longApronLength = legX * 2 + legSize;
  const shortApronLength = legZ * 2 + legSize;
  const apronZ = topDepth * 0.5 - legInsetZ - apronThickness * 0.5;
  const apronX = topWidth * 0.5 - legInsetX - apronThickness * 0.5;

  const longApronGeometry = new RoundedBoxGeometry(longApronLength, apronHeight, apronThickness, 3, 0.004);
  addPart(longApronGeometry, frameMaterial, 0, apronCenterY, -apronZ);
  addPart(longApronGeometry, frameMaterial, 0, apronCenterY, apronZ);

  const shortApronGeometry = new RoundedBoxGeometry(apronThickness, apronHeight, shortApronLength, 3, 0.004);
  addPart(shortApronGeometry, endMaterial, -apronX, apronCenterY, 0);
  addPart(shortApronGeometry, endMaterial, apronX, apronCenterY, 0);

  const seamMaterial = new THREE.MeshStandardMaterial({
    color: 0x9b6a3d,
    roughness: 0.8,
    transparent: true,
    opacity: 0.27
  });
  const seamGeometry = new THREE.BoxGeometry(topWidth - 0.045, 0.0007, 0.00115);
  [-0.154, 0, 0.154].forEach((z) => {
    addPart(seamGeometry, seamMaterial, 0, tableHeight + 0.0002, z, false);
  });

  const floorMaterial = new THREE.MeshStandardMaterial({
    color: 0xd9d3c8,
    roughness: 0.92,
    metalness: 0
  });
  const floor = new THREE.Mesh(new THREE.CircleGeometry(4.5, 96), floorMaterial);
  floor.rotation.x = -Math.PI * 0.5;
  floor.position.y = -0.004;
  floor.receiveShadow = true;
  scene.add(floor);

  const ambient = new THREE.HemisphereLight(0xfff7e8, 0x7f8790, 1.8);
  scene.add(ambient);

  const keyLight = new THREE.DirectionalLight(0xffefd8, 3.2);
  keyLight.position.set(-2.2, 3.4, 2.5);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  keyLight.shadow.camera.left = -2;
  keyLight.shadow.camera.right = 2;
  keyLight.shadow.camera.top = 2;
  keyLight.shadow.camera.bottom = -2;
  keyLight.shadow.camera.near = 0.5;
  keyLight.shadow.camera.far = 8;
  keyLight.shadow.bias = -0.00015;
  keyLight.shadow.normalBias = 0.018;
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0xc7dcff, 0.75);
  fillLight.position.set(2.5, 1.8, -2.2);
  scene.add(fillLight);

  const warmLight = new THREE.PointLight(0xffc98f, 0.45, 4, 2);
  warmLight.position.set(-1.1, 0.8, -1.1);
  scene.add(warmLight);

  function resize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  window.addEventListener('resize', resize);

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  animate();
</script>
</body>
</html>
