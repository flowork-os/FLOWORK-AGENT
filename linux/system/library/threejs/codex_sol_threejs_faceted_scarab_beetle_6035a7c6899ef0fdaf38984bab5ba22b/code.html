<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faceted Emerald Scarab</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 38%, #123b38 0%, #061715 46%, #020706 100%);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x03100e);
  scene.fog = new THREE.FogExp2(0x03100e, 0.055);

  const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(4.8, 3.8, -6.2);

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance'
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.28;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const pmremGenerator = new THREE.PMREMGenerator(renderer);
  pmremGenerator.compileEquirectangularShader();
  const roomEnvironment = new RoomEnvironment(renderer);
  const environmentMap = pmremGenerator.fromScene(roomEnvironment, 0.05);
  scene.environment = environmentMap.texture;
  roomEnvironment.dispose();
  pmremGenerator.dispose();

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.08, -0.08);
  controls.enableDamping = true;
  controls.dampingFactor = 0.045;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.72;
  controls.minDistance = 4.8;
  controls.maxDistance = 11;
  controls.minPolarAngle = 0.35;
  controls.maxPolarAngle = 1.48;

  const emeraldMaterial = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    vertexColors: true,
    metalness: 0.16,
    roughness: 0.16,
    transmission: 0.12,
    thickness: 1.4,
    ior: 1.68,
    clearcoat: 1,
    clearcoatRoughness: 0.09,
    iridescence: 0.18,
    iridescenceIOR: 1.25,
    envMapIntensity: 1.8,
    flatShading: true
  });

  const deepGemMaterial = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    vertexColors: true,
    metalness: 0.24,
    roughness: 0.2,
    transmission: 0.06,
    thickness: 0.8,
    ior: 1.55,
    clearcoat: 0.9,
    clearcoatRoughness: 0.12,
    envMapIntensity: 1.55,
    flatShading: true
  });

  const amberGemMaterial = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    vertexColors: true,
    metalness: 0.48,
    roughness: 0.18,
    transmission: 0.05,
    thickness: 0.7,
    ior: 1.6,
    clearcoat: 1,
    clearcoatRoughness: 0.08,
    envMapIntensity: 1.8,
    flatShading: true
  });

  const goldMaterial = new THREE.MeshPhysicalMaterial({
    color: 0xd99124,
    metalness: 0.72,
    roughness: 0.2,
    clearcoat: 0.72,
    clearcoatRoughness: 0.12,
    envMapIntensity: 1.7,
    flatShading: true
  });

  const darkGoldMaterial = new THREE.MeshPhysicalMaterial({
    color: 0x7d3e09,
    metalness: 0.68,
    roughness: 0.25,
    clearcoat: 0.55,
    envMapIntensity: 1.4,
    flatShading: true
  });

  const eyeMaterial = new THREE.MeshPhysicalMaterial({
    color: 0x1b0302,
    metalness: 0.32,
    roughness: 0.08,
    clearcoat: 1,
    clearcoatRoughness: 0.04,
    emissive: 0x240200,
    emissiveIntensity: 0.32
  });

  const emeraldPalette = [
    0x006b50, 0x008d68, 0x00aa80, 0x075f58,
    0x11b89b, 0x005241, 0x159f8d, 0x023e36
  ];

  const thoraxPalette = [
    0x004c3f, 0x00695b, 0x078477, 0x00372f,
    0x0b7167, 0x005247
  ];

  const amberPalette = [
    0x8d4308, 0xb8610e, 0xe09a2a, 0xffc45a,
    0x9d5010, 0xd57a16, 0x713306
  ];

  function applyFacetColors(geometry, palette, offset = 0) {
    const position = geometry.getAttribute('position');
    const colors = new Float32Array(position.count * 3);
    const color = new THREE.Color();

    for (let i = 0; i < position.count; i += 3) {
      const cx = (position.getX(i) + position.getX(i + 1) + position.getX(i + 2)) / 3;
      const cy = (position.getY(i) + position.getY(i + 1) + position.getY(i + 2)) / 3;
      const cz = (position.getZ(i) + position.getZ(i + 1) + position.getZ(i + 2)) / 3;
      const hash = Math.abs(Math.sin(
        (i + offset * 19.7) * 12.9898 + cx * 37.719 + cy * 23.357 + cz * 51.113
      ));
      const index = Math.min(palette.length - 1, Math.floor(hash * palette.length));
      color.setHex(palette[index]);

      const lift = 0.83 + 0.25 * Math.abs(Math.sin(i * 0.73 + offset));
      color.multiplyScalar(lift);

      for (let j = 0; j < 3; j++) {
        colors[(i + j) * 3] = color.r;
        colors[(i + j) * 3 + 1] = color.g;
        colors[(i + j) * 3 + 2] = color.b;
      }
    }

    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  }

  function createGemEllipsoid(sx, sy, sz, palette, material, offset, segments = 10, rings = 6) {
    const geometry = new THREE.SphereGeometry(1, segments, rings).toNonIndexed();
    const position = geometry.getAttribute('position');

    for (let i = 0; i < position.count; i++) {
      const x = position.getX(i);
      const y = position.getY(i);
      const z = position.getZ(i);
      const endTaper = 0.88 + 0.12 * Math.max(0, 1 - z * z);
      position.setXYZ(
        i,
        x * sx * endTaper,
        y * sy * (y < 0 ? 0.56 : 1),
        z * sz
      );
    }

    position.needsUpdate = true;
    geometry.computeVertexNormals();
    applyFacetColors(geometry, palette, offset);

    const mesh = new THREE.Mesh(geometry, material);
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(geometry, 7),
      new THREE.LineBasicMaterial({
        color: material === amberGemMaterial ? 0xffd57c : 0x65ffe0,
        transparent: true,
        opacity: material === amberGemMaterial ? 0.2 : 0.14,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      })
    );
    mesh.add(edges);
    return mesh;
  }

  function createColoredPolyhedron(radius, detail, palette, material, offset) {
    const geometry = new THREE.IcosahedronGeometry(radius, detail).toNonIndexed();
    geometry.computeVertexNormals();
    applyFacetColors(geometry, palette, offset);
    const mesh = new THREE.Mesh(geometry, material);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
  }

  function addSegment(parent, start, end, startRadius, endRadius, material, radialSegments = 5) {
    const direction = new THREE.Vector3().subVectors(end, start);
    const length = direction.length();
    const geometry = new THREE.CylinderGeometry(endRadius, startRadius, length, radialSegments, 1, false);
    const segment = new THREE.Mesh(geometry, material);
    segment.position.copy(start).add(end).multiplyScalar(0.5);
    segment.quaternion.setFromUnitVectors(
      new THREE.Vector3(0, 1, 0),
      direction.clone().normalize()
    );
    segment.castShadow = true;
    segment.receiveShadow = true;
    parent.add(segment);
    return segment;
  }

  function addJoint(parent, position, scale, material) {
    const joint = new THREE.Mesh(new THREE.OctahedronGeometry(scale, 0), material);
    joint.position.copy(position);
    joint.scale.set(1.12, 0.86, 1);
    joint.rotation.set(0.18, 0.35, 0.12);
    joint.castShadow = true;
    parent.add(joint);
  }

  const scarab = new THREE.Group();
  scarab.rotation.x = -0.04;
  scarab.position.y = 0.02;
  scene.add(scarab);

  const underbody = createGemEllipsoid(
    0.7, 0.38, 1.17, thoraxPalette, deepGemMaterial, 4, 9, 5
  );
  underbody.position.set(0, -0.12, 0.18);
  scarab.add(underbody);

  const leftWing = createGemEllipsoid(
    0.67, 0.62, 1.13, emeraldPalette, emeraldMaterial, 1, 11, 7
  );
  leftWing.position.set(-0.36, 0.15, 0.28);
  leftWing.rotation.z = -0.035;
  scarab.add(leftWing);

  const rightWing = createGemEllipsoid(
    0.67, 0.62, 1.13, emeraldPalette, emeraldMaterial, 8, 11, 7
  );
  rightWing.position.set(0.36, 0.15, 0.28);
  rightWing.rotation.z = 0.035;
  scarab.add(rightWing);

  const thorax = createGemEllipsoid(
    1.02, 0.57, 0.68, thoraxPalette, emeraldMaterial, 14, 10, 6
  );
  thorax.position.set(0, 0.13, -0.76);
  scarab.add(thorax);

  const collar = new THREE.Mesh(
    new THREE.TorusGeometry(0.66, 0.075, 5, 12, Math.PI),
    darkGoldMaterial
  );
  collar.position.set(0, 0.16, -1.05);
  collar.rotation.set(Math.PI / 2, 0, 0);
  collar.scale.set(1.12, 1, 0.7);
  collar.castShadow = true;
  scarab.add(collar);

  const head = createGemEllipsoid(
    0.67, 0.45, 0.52, amberPalette, amberGemMaterial, 21, 8, 5
  );
  head.position.set(0, 0.03, -1.36);
  scarab.add(head);

  const seam = new THREE.Mesh(
    new THREE.CylinderGeometry(0.026, 0.045, 1.77, 5, 1),
    darkGoldMaterial
  );
  seam.position.set(0, 0.76, 0.39);
  seam.rotation.x = Math.PI / 2;
  seam.castShadow = true;
  scarab.add(seam);

  const seamTip = createColoredPolyhedron(0.075, 0, amberPalette, amberGemMaterial, 31);
  seamTip.position.set(0, 0.68, 1.28);
  seamTip.scale.set(0.65, 0.5, 1.15);
  scarab.add(seamTip);

  const eyeGeometry = new THREE.IcosahedronGeometry(0.105, 1);
  for (const side of [-1, 1]) {
    const eye = new THREE.Mesh(eyeGeometry, eyeMaterial);
    eye.position.set(side * 0.49, 0.16, -1.54);
    eye.scale.set(0.72, 0.9, 1);
    eye.castShadow = true;
    scarab.add(eye);
  }

  const legSets = [
    {
      root: [0.64, -0.01, -0.79],
      knee: [1.08, -0.13, -1.08],
      ankle: [1.42, -0.43, -1.43],
      foot: [1.67, -0.51, -1.57]
    },
    {
      root: [0.73, -0.06, -0.07],
      knee: [1.21, -0.17, -0.10],
      ankle: [1.58, -0.43, -0.21],
      foot: [1.82, -0.51, -0.16]
    },
    {
      root: [0.62, -0.04, 0.66],
      knee: [1.09, -0.14, 0.91],
      ankle: [1.45, -0.42, 1.27],
      foot: [1.68, -0.51, 1.48]
    }
  ];

  for (const side of [-1, 1]) {
    for (let legIndex = 0; legIndex < legSets.length; legIndex++) {
      const data = legSets[legIndex];
      const root = new THREE.Vector3(side * data.root[0], data.root[1], data.root[2]);
      const knee = new THREE.Vector3(side * data.knee[0], data.knee[1], data.knee[2]);
      const ankle = new THREE.Vector3(side * data.ankle[0], data.ankle[1], data.ankle[2]);
      const foot = new THREE.Vector3(side * data.foot[0], data.foot[1], data.foot[2]);

      addSegment(scarab, root, knee, 0.115, 0.092, goldMaterial, 5);
      addSegment(scarab, knee, ankle, 0.09, 0.055, goldMaterial, 5);
      addSegment(scarab, ankle, foot, 0.055, 0.022, darkGoldMaterial, 5);
      addJoint(scarab, knee, 0.125, amberGemMaterial);
      addJoint(scarab, ankle, 0.075, goldMaterial);

      const clawForward = foot.clone().add(new THREE.Vector3(side * 0.13, -0.015, -0.08));
      const clawRear = foot.clone().add(new THREE.Vector3(side * 0.12, -0.015, 0.09));
      addSegment(scarab, foot, clawForward, 0.026, 0.007, darkGoldMaterial, 4);
      addSegment(scarab, foot, clawRear, 0.026, 0.007, darkGoldMaterial, 4);
    }
  }

  for (const side of [-1, 1]) {
    const hornRoot = new THREE.Vector3(side * 0.27, 0.09, -1.68);
    const hornMid = new THREE.Vector3(side * 0.48, 0.08, -1.91);
    const hornTip = new THREE.Vector3(side * 0.72, 0.16, -2.08);

    addSegment(scarab, hornRoot, hornMid, 0.105, 0.07, goldMaterial, 5);
    addSegment(scarab, hornMid, hornTip, 0.072, 0.012, amberGemMaterial, 5);
    addJoint(scarab, hornMid, 0.085, amberGemMaterial);

    const antennaRoot = new THREE.Vector3(side * 0.39, 0.23, -1.56);
    const antennaMid = new THREE.Vector3(side * 0.68, 0.34, -1.72);
    const antennaTip = new THREE.Vector3(side * 0.91, 0.29, -1.88);

    addSegment(scarab, antennaRoot, antennaMid, 0.026, 0.018, darkGoldMaterial, 5);
    addSegment(scarab, antennaMid, antennaTip, 0.019, 0.006, goldMaterial, 5);

    const antennaGem = createColoredPolyhedron(0.055, 0, amberPalette, amberGemMaterial, 43 + side);
    antennaGem.position.copy(antennaTip);
    antennaGem.scale.set(0.65, 0.65, 1.35);
    scarab.add(antennaGem);
  }

  const crown = createColoredPolyhedron(0.19, 0, amberPalette, amberGemMaterial, 52);
  crown.position.set(0, 0.43, -1.56);
  crown.scale.set(1.35, 0.78, 1.15);
  crown.rotation.x = 0.25;
  scarab.add(crown);

  const groundMaterial = new THREE.MeshStandardMaterial({
    color: 0x061b17,
    roughness: 0.72,
    metalness: 0.08
  });
  const ground = new THREE.Mesh(new THREE.CircleGeometry(9, 64), groundMaterial);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.54;
  ground.receiveShadow = true;
  scene.add(ground);

  const halo = new THREE.Mesh(
    new THREE.RingGeometry(2.25, 2.7, 64),
    new THREE.MeshBasicMaterial({
      color: 0x087d68,
      transparent: true,
      opacity: 0.055,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.DoubleSide
    })
  );
  halo.rotation.x = -Math.PI / 2;
  halo.position.y = -0.525;
  scene.add(halo);

  const hemisphere = new THREE.HemisphereLight(0x67f5e1, 0x180803, 1.35);
  scene.add(hemisphere);

  const keyLight = new THREE.SpotLight(0xd9fff7, 150, 18, 0.58, 0.55, 1.45);
  keyLight.position.set(-4.2, 6.8, -4.2);
  keyLight.target.position.set(0, 0, 0);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  keyLight.shadow.camera.near = 1;
  keyLight.shadow.camera.far = 16;
  keyLight.shadow.bias = -0.00025;
  scene.add(keyLight, keyLight.target);

  const tealRim = new THREE.PointLight(0x00ffd0, 34, 9, 1.65);
  tealRim.position.set(4.2, 2.4, 2.8);
  scene.add(tealRim);

  const blueRim = new THREE.PointLight(0x248cff, 25, 8, 1.7);
  blueRim.position.set(-4, 1.4, 3.3);
  scene.add(blueRim);

  const warmFront = new THREE.PointLight(0xff9b28, 31, 7, 1.7);
  warmFront.position.set(1.3, 2.2, -4.2);
  scene.add(warmFront);

  const topSpark = new THREE.PointLight(0xffffff, 18, 5, 1.8);
  topSpark.position.set(0, 4.6, 0.4);
  scene.add(topSpark);

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const elapsed = clock.getElapsedTime();

    tealRim.position.x = 4.1 * Math.cos(elapsed * 0.28);
    tealRim.position.z = 4.1 * Math.sin(elapsed * 0.28);
    blueRim.position.x = 3.6 * Math.cos(elapsed * 0.28 + Math.PI);
    blueRim.position.z = 3.6 * Math.sin(elapsed * 0.28 + Math.PI);
    warmFront.intensity = 29 + Math.sin(elapsed * 1.4) * 2;

    controls.update();
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
</script>
</body>
</html>
