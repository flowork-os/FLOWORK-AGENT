<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Backyard Pond Edge</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#b9cde0}
  canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaec8dc);
scene.fog = new THREE.Fog(0xaec8dc, 18, 43);

const camera = new THREE.PerspectiveCamera(43, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8.8, 6.1, 9.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.38;
controls.minDistance = 5;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.47;

const hemi = new THREE.HemisphereLight(0xd9ebf8, 0x58703d, 2.25);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff2d5, 3.2);
sun.position.set(-7, 10, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -12;
sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12;
sun.shadow.camera.bottom = -12;
sun.shadow.bias = -0.00015;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x9bc7ea, 0.65);
fill.position.set(7, 4, -8);
scene.add(fill);

const groundMat = new THREE.MeshStandardMaterial({ color: 0x566c38, roughness: 0.96 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(36, 36, 48, 48), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const groundGeo = ground.geometry;
const groundPos = groundGeo.attributes.position;
for (let i = 0; i < groundPos.count; i++) {
  const x = groundPos.getX(i);
  const y = groundPos.getY(i);
  const radial = Math.sqrt(x * x + y * y);
  const ripple = Math.sin(x * 1.7) * Math.cos(y * 1.35) * 0.035;
  const basin = radial < 4.2 ? -0.06 * Math.exp(-(radial * radial) / 7.5) : 0;
  groundPos.setZ(i, ripple + basin);
}
groundGeo.computeVertexNormals();

const pondShape = new THREE.Shape();
const pondPoints = [
  new THREE.Vector2(-3.28, -0.62), new THREE.Vector2(-2.88, -1.72),
  new THREE.Vector2(-1.77, -2.42), new THREE.Vector2(-0.28, -2.58),
  new THREE.Vector2(1.38, -2.31), new THREE.Vector2(2.83, -1.42),
  new THREE.Vector2(3.23, -0.22), new THREE.Vector2(2.83, 1.14),
  new THREE.Vector2(1.65, 2.10), new THREE.Vector2(0.10, 2.35),
  new THREE.Vector2(-1.42, 2.12), new THREE.Vector2(-2.72, 1.38),
  new THREE.Vector2(-3.38, 0.45)
];
pondShape.moveTo(pondPoints[0].x, pondPoints[0].y);
for (let i = 1; i < pondPoints.length; i++) pondShape.lineTo(pondPoints[i].x, pondPoints[i].y);
pondShape.closePath();

const linerMat = new THREE.MeshStandardMaterial({ color: 0x111615, roughness: 0.52, metalness: 0.03 });
const liner = new THREE.Mesh(new THREE.ShapeGeometry(pondShape), linerMat);
liner.rotation.x = -Math.PI / 2;
liner.position.y = 0.005;
liner.receiveShadow = true;
scene.add(liner);

const waterShape = pondShape.clone();
const water = new THREE.Mesh(
  new THREE.ShapeGeometry(waterShape),
  new THREE.MeshPhysicalMaterial({
    color: 0x244f55,
    roughness: 0.16,
    metalness: 0.04,
    transmission: 0.08,
    transparent: true,
    opacity: 0.92,
    clearcoat: 0.7,
    clearcoatRoughness: 0.17
  })
);
water.rotation.x = -Math.PI / 2;
water.position.y = 0.105;
water.receiveShadow = true;
scene.add(water);

const waterRings = [];
for (let r = 0; r < 19; r++) {
  const curve = new THREE.EllipseCurve(
    (Math.random() - 0.5) * 3.6,
    (Math.random() - 0.5) * 2.6,
    0.12 + Math.random() * 0.34,
    0.05 + Math.random() * 0.13,
    0, Math.PI * 2, false, 0
  );
  const pts = curve.getPoints(20);
  const lineGeo = new THREE.BufferGeometry().setFromPoints(pts.map(p => new THREE.Vector3(p.x, 0.122, p.y)));
  const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0x88b8ae, transparent: true, opacity: 0.12 }));
  scene.add(line);
  waterRings.push(line);
}

const rockPalette = [0x706a5a, 0x827865, 0x5f6356, 0x968b75, 0x665e50, 0x777261];
const rockMatCache = rockPalette.map(color => new THREE.MeshStandardMaterial({ color, roughness: 0.9, metalness: 0 }));
function makeRock(x, z, scale, angle) {
  const geo = new THREE.IcosahedronGeometry(1, 2);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const vx = pos.getX(i);
    const vy = pos.getY(i);
    const vz = pos.getZ(i);
    const noise = 0.83 + Math.sin(i * 17.3 + angle * 7.1) * 0.08;
    pos.setXYZ(i, vx * noise, vy * noise * 0.72, vz * noise);
  }
  geo.computeVertexNormals();
  const rock = new THREE.Mesh(geo, rockMatCache[Math.floor(Math.random() * rockMatCache.length)]);
  rock.position.set(x, 0.20 + scale * 0.17, z);
  rock.scale.set(scale * (0.94 + Math.random() * 0.2), scale * 0.56, scale * (0.76 + Math.random() * 0.28));
  rock.rotation.set((Math.random() - 0.5) * 0.26, angle, (Math.random() - 0.5) * 0.16);
  rock.castShadow = true;
  rock.receiveShadow = true;
  scene.add(rock);
}

for (let i = 0; i < pondPoints.length; i++) {
  const a = pondPoints[i];
  const b = pondPoints[(i + 1) % pondPoints.length];
  const dx = b.x - a.x;
  const dz = b.y - a.y;
  const length = Math.hypot(dx, dz);
  const count = Math.max(2, Math.ceil(length / 0.52));
  for (let j = 0; j < count; j++) {
    const t = (j + 0.5) / count;
    const px = THREE.MathUtils.lerp(a.x, b.x, t);
    const pz = THREE.MathUtils.lerp(a.y, b.y, t);
    const nx = -dz / length;
    const nz = dx / length;
    const outward = 0.20 + (Math.random() - 0.5) * 0.18;
    makeRock(px + nx * outward, pz + nz * outward, 0.34 + Math.random() * 0.18, Math.atan2(dx, dz) + (Math.random() - 0.5) * 0.4);
  }
}

const soilMat = new THREE.MeshStandardMaterial({ color: 0x403724, roughness: 1 });
const soilPatches = [
  [-2.75, 1.62, 0.8, 0.46], [2.65, 0.92, 0.82, 0.5],
  [2.2, -1.52, 0.76, 0.4], [-2.4, -1.92, 0.7, 0.42]
];
for (const patch of soilPatches) {
  const patchMesh = new THREE.Mesh(new THREE.CircleGeometry(1, 24), soilMat);
  patchMesh.rotation.x = -Math.PI / 2;
  patchMesh.position.set(patch[0], 0.028, patch[1]);
  patchMesh.scale.set(patch[2], patch[3], 1);
  patchMesh.receiveShadow = true;
  scene.add(patchMesh);
}

const stemMat = new THREE.MeshStandardMaterial({ color: 0x486232, roughness: 0.78 });
const leafMat = new THREE.MeshStandardMaterial({ color: 0x587837, roughness: 0.78, side: THREE.DoubleSide });
const cattailMat = new THREE.MeshStandardMaterial({ color: 0x4d311b, roughness: 0.85 });

function createLeaf(base, height, direction, width) {
  const curve = new THREE.QuadraticBezierCurve3(
    base,
    base.clone().add(new THREE.Vector3(Math.cos(direction) * width * 0.55, height * 0.55, Math.sin(direction) * width * 0.55)),
    base.clone().add(new THREE.Vector3(Math.cos(direction) * width, height, Math.sin(direction) * width))
  );
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 8, 0.022, 5, false), leafMat);
  tube.castShadow = true;
  scene.add(tube);
}
function createCattail(x, z, h, lean) {
  const base = new THREE.Vector3(x, 0.10, z);
  const tip = new THREE.Vector3(x + lean, h, z + lean * 0.35);
  const stemCurve = new THREE.QuadraticBezierCurve3(
    base,
    new THREE.Vector3(x + lean * 0.18, h * 0.52, z + lean * 0.12),
    tip
  );
  const stem = new THREE.Mesh(new THREE.TubeGeometry(stemCurve, 10, 0.029, 6, false), stemMat);
  stem.castShadow = true;
  scene.add(stem);
  const head = new THREE.Mesh(new THREE.CapsuleGeometry(0.075, 0.36, 6, 10), cattailMat);
  head.position.copy(tip).add(new THREE.Vector3(lean * 0.025, 0.12, lean * 0.009));
  head.rotation.z = Math.atan2(-lean, 0.52);
  head.castShadow = true;
  scene.add(head);
  for (let i = 0; i < 3; i++) {
    const angle = i * 2.1 + x * 1.7;
    createLeaf(base.clone().add(new THREE.Vector3(0, 0.03, 0)), 0.38 + i * 0.08, angle, 0.38 + i * 0.08);
  }
}
createCattail(-2.72, 1.45, 1.82, -0.18);
createCattail(-2.42, 1.66, 1.52, 0.12);
createCattail(-2.94, 1.11, 1.32, -0.06);
createCattail(2.57, 0.94, 1.50, 0.14);
createCattail(2.82, 0.64, 1.18, -0.12);

const grassMat = new THREE.MeshStandardMaterial({ color: 0x4b7331, roughness: 0.88, side: THREE.DoubleSide });
const grassGeo = new THREE.ConeGeometry(0.018, 0.30, 4);
function grassClump(x, z, count) {
  for (let i = 0; i < count; i++) {
    const blade = new THREE.Mesh(grassGeo, grassMat);
    const a = Math.random() * Math.PI * 2;
    const r = Math.random() * 0.18;
    blade.position.set(x + Math.cos(a) * r, 0.14, z + Math.sin(a) * r);
    blade.rotation.set((Math.random() - 0.5) * 0.6, Math.random() * Math.PI, (Math.random() - 0.5) * 0.65);
    blade.scale.y = 0.65 + Math.random() * 1.2;
    blade.castShadow = true;
    scene.add(blade);
  }
}
for (let i = 0; i < 48; i++) {
  const a = Math.random() * Math.PI * 2;
  const radius = 3.55 + Math.random() * 1.0;
  grassClump(Math.cos(a) * radius * 1.02, Math.sin(a) * radius * 0.78, 3 + Math.floor(Math.random() * 4));
}

const lilyMat = new THREE.MeshStandardMaterial({ color: 0x356b42, roughness: 0.56, side: THREE.DoubleSide });
function lilyPad(x, z, s, rot) {
  const shape = new THREE.Shape();
  const segments = 28;
  for (let i = 0; i <= segments; i++) {
    const angle = -Math.PI * 0.08 + (i / segments) * Math.PI * 2;
    const notch = Math.abs(angle) < 0.25 ? 0.48 : 1;
    const px = Math.cos(angle) * s * notch;
    const py = Math.sin(angle) * s;
    if (i === 0) shape.moveTo(px, py); else shape.lineTo(px, py);
  }
  const pad = new THREE.Mesh(new THREE.ShapeGeometry(shape), lilyMat);
  pad.rotation.set(-Math.PI / 2, 0, rot);
  pad.position.set(x, 0.128, z);
  pad.receiveShadow = true;
  scene.add(pad);
}
lilyPad(-0.6, 0.38, 0.38, 0.5);
lilyPad(0.78, -0.68, 0.30, 2.1);
lilyPad(1.28, 0.64, 0.25, 1.15);

const stonePathMat = new THREE.MeshStandardMaterial({ color: 0x847e6a, roughness: 0.95 });
for (let i = 0; i < 8; i++) {
  const step = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.38, 0.075, 10), stonePathMat);
  step.position.set(-5.25 + i * 0.62, 0.06, 3.25 + Math.sin(i * 0.75) * 0.18);
  step.rotation.y = i * 0.47;
  step.scale.set(1.15, 1, 0.78);
  step.castShadow = true;
  step.receiveShadow = true;
  scene.add(step);
}

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  for (let i = 0; i < waterRings.length; i++) {
    waterRings[i].rotation.y = Math.sin(t * 0.18 + i) * 0.018;
    waterRings[i].position.y = Math.sin(t * 0.7 + i * 1.4) * 0.003;
  }
  water.material.roughness = 0.14 + Math.sin(t * 0.45) * 0.018;
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
