<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lava Rock Outcrop</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#d7d3cc}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- deterministic noise ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const fract=x=>x-Math.floor(x);
const h3=(x,y,z)=>fract(Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453);
function vnoise(x,y,z){
  const X=Math.floor(x),Y=Math.floor(y),Z=Math.floor(z);
  x-=X;y-=Y;z-=Z;
  const u=x*x*(3-2*x),v=y*y*(3-2*y),w=z*z*(3-2*z),L=(a,b,t)=>a+(b-a)*t;
  return L(
    L(L(h3(X,Y,Z),h3(X+1,Y,Z),u),L(h3(X,Y+1,Z),h3(X+1,Y+1,Z),u),v),
    L(L(h3(X,Y,Z+1),h3(X+1,Y,Z+1),u),L(h3(X,Y+1,Z+1),h3(X+1,Y+1,Z+1),u),v),w);
}
function fbm(x,y,z,o=4){let a=.5,f=1,s=0;for(let i=0;i<o;i++){s+=a*vnoise(x*f,y*f,z*f);f*=2.03;a*=.5}return s}
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));

// ---------- scene ----------
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xd7d3cc);

const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,100);
camera.position.set(4.4,2.7,5.0);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.85,0);
controls.enableDamping=true;
controls.autoRotate=true;
controls.autoRotateSpeed=1.1;
controls.minDistance=3;
controls.maxDistance=14;
controls.maxPolarAngle=1.5;

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0xdfe6ee,0x8a8177,0.85));
const key=new THREE.DirectionalLight(0xfff0dd,1.9);
key.position.set(5,8,4);
key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=key.shadow.camera.bottom=-4.5;
key.shadow.camera.right=key.shadow.camera.top=4.5;
key.shadow.camera.near=1;key.shadow.camera.far=25;
key.shadow.bias=-0.0004;key.shadow.normalBias=0.03;
scene.add(key);
const rim=new THREE.DirectionalLight(0xaec4ff,0.55);
rim.position.set(-6,3.5,-6);
scene.add(rim);

// ---------- vesicular micro-surface (bump) ----------
function poresTexture(){
  const c=document.createElement('canvas');c.width=c.height=512;
  const x=c.getContext('2d'),rnd=mulberry32(99);
  x.fillStyle='#8a8a8a';x.fillRect(0,0,512,512);
  for(let i=0;i<1500;i++){
    const px=rnd()*512,py=rnd()*512,pr=0.6+rnd()*rnd()*5.5;
    const g=x.createRadialGradient(px,py,0,px,py,pr);
    g.addColorStop(0,`rgba(0,0,0,${0.35+rnd()*0.45})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=g;x.beginPath();x.arc(px,py,pr,0,7);x.fill();
  }
  for(let i=0;i<220;i++){
    const px=rnd()*512,py=rnd()*512;
    x.fillStyle='rgba(255,255,255,0.12)';
    x.beginPath();x.arc(px,py,0.5+rnd()*1.5,0,7);x.fill();
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(3,3);
  return t;
}
const rockMat=new THREE.MeshStandardMaterial({
  vertexColors:true,flatShading:true,
  roughness:0.96,metalness:0.02,
  bumpMap:poresTexture(),bumpScale:0.6
});

// ---------- procedural fractured boulder ----------
function makeRock(r,seed){
  const rnd=mulberry32(seed*7919+13);
  const g=new THREE.IcosahedronGeometry(1,r>0.9?4:3);
  g.scale(r*(0.85+rnd()*0.4),r*(0.65+rnd()*0.4),r*(0.85+rnd()*0.4));
  const off=seed*17.31+3.7;
  // fracture planes (sharp facets)
  const planes=[];
  const np=7+(rnd()*4|0);
  for(let i=0;i<np;i++){
    const n=new THREE.Vector3(rnd()*2-1,rnd()*2-1,rnd()*2-1).normalize();
    planes.push([n,r*(0.55+rnd()*0.32)]);
  }
  planes.push([new THREE.Vector3(0,-1,0),r*0.5]); // flat base
  // cavities (shadowed hollows)
  const cavs=[];
  const ncv=2+(rnd()*3|0);
  for(let i=0;i<ncv;i++){
    const d=new THREE.Vector3(rnd()*2-1,rnd()*0.9-0.15,rnd()*2-1).normalize();
    cavs.push([d.multiplyScalar(r*(0.85+rnd()*0.35)),r*(0.28+rnd()*0.3)]);
  }
  const pos=g.attributes.position,count=pos.count;
  const col=new Float32Array(count*3);
  const p=new THREE.Vector3(),dir=new THREE.Vector3(),dv=new THREE.Vector3();
  for(let i=0;i<count;i++){
    p.fromBufferAttribute(pos,i);
    dir.copy(p).normalize();
    const nx=p.x*1.4/r+off,ny=p.y*1.4/r+off,nz=p.z*1.4/r+off;
    // bulk shape + ridged crevices
    const base=(fbm(nx,ny,nz,4)-0.47)*0.42*r;
    let rid=1-Math.abs(fbm(nx*1.9,ny*1.9,nz*1.9,3)*2-0.94);
    rid=clamp(rid,0,1);rid*=rid;
    p.addScaledVector(dir,base-rid*0.2*r);
    // planar fracture cuts
    for(const[n,d]of planes){const dp=p.dot(n);if(dp>d)p.addScaledVector(n,-(dp-d));}
    // carve hollows
    let cav=0;
    for(const[c,cr]of cavs){
      dv.copy(p).sub(c);const ds=dv.length();
      if(ds<cr){cav=Math.max(cav,1-ds/cr);p.copy(c).addScaledVector(dv,cr/ds);}
    }
    // fine grain
    p.addScaledVector(dir,(fbm(nx*5.2,ny*5.2,nz*5.2,3)-0.47)*0.06*r);
    pos.setXYZ(i,p.x,p.y,p.z);
    // coloring: charcoal basalt, darker crevices/hollows, faint oxide patches
    const shade=clamp(0.82+(fbm(nx*3.1+7,ny*3.1+7,nz*3.1+7,3)-0.47)*1.1,0.45,1.25);
    const oxide=Math.max(0,fbm(nx*1.2+31,ny*1.2+31,nz*1.2+31,3)-0.6)*2.2;
    const dark=1-clamp(cav*0.85+rid*0.35,0,0.92);
    let cr_=(0.15+oxide*0.14)*shade*dark;
    let cg_=(0.142+oxide*0.03)*shade*dark;
    let cb_=(0.138-oxide*0.02)*shade*dark;
    col[i*3]=Math.max(cr_,0.015);col[i*3+1]=Math.max(cg_,0.015);col[i*3+2]=Math.max(cb_,0.015);
  }
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  g.computeVertexNormals();
  const m=new THREE.Mesh(g,rockMat);
  m.castShadow=m.receiveShadow=true;
  m.rotation.y=seed*1.7;
  return m;
}

// ---------- clustered outcrop ----------
const outcrop=new THREE.Group();
const ROCKS=[
  [1.55, 0.00,0.05, 1],
  [1.00, 1.50,0.45, 2],
  [0.85,-1.45,-0.50,3],
  [0.72, 0.60,-1.35,4],
  [0.62,-0.70,1.30, 5],
  [0.50, 1.15,-1.10,6]
];
for(const[r,x,z,s]of ROCKS){
  const rock=makeRock(r,s);
  rock.position.set(x,r*0.48,z);
  outcrop.add(rock);
}
scene.add(outcrop);

// ---------- soft ground shadow ----------
const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(40,40),
  new THREE.ShadowMaterial({opacity:0.32})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// ---------- loop ----------
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
renderer.setAnimationLoop(()=>{
  controls.update();
  renderer.render(scene,camera);
});
</script>
</body>
</html>
