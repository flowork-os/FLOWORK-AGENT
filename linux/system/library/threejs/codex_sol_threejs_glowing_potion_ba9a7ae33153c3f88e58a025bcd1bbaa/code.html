<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glowing Fantasy Potion</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 42%, #132c2b 0%, #081313 42%, #030707 100%);
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030808);
scene.fog = new THREE.FogExp2(0x030808, 0.045);

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.2, 5.2, 9.2);
camera.lookAt(0, 2.5, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  0.9,
  0.65,
  0.28
);
composer.addPass(bloomPass);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.65, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 7;
controls.maxDistance = 16;
controls.minPolarAngle = Math.PI * 0.24;
controls.maxPolarAngle = Math.PI * 0.57;

scene.add(new THREE.HemisphereLight(0x8fd8cb, 0x10100e, 0.9));

const keyLight = new THREE.DirectionalLight(0xccefff, 3.2);
keyLight.position.set(5, 8, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.bias = -0.0003;
scene.add(keyLight);

const rimLight = new THREE.SpotLight(0x55ffd0, 35, 18, Math.PI / 5, 0.65, 1.3);
rimLight.position.set(-5, 6, -5);
rimLight.target.position.set(0, 2.5, 0);
scene.add(rimLight, rimLight.target);

const potion = new THREE.Group();
potion.rotation.y = -0.2;
scene.add(potion);

const glassProfile = [
  [0.24, 5.70],
  [0.38, 5.66],
  [0.40, 5.48],
  [0.36, 5.34],
  [0.37, 4.48],
  [0.48, 4.27],
  [0.78, 4.05],
  [1.22, 3.72],
  [1.60, 3.28],
  [1.82, 2.80],
  [1.93, 2.23],
  [1.86, 1.55],
  [1.57, 0.92],
  [1.13, 0.48],
  [0.62, 0.23],
  [0.18, 0.17],
  [0.04, 0.24]
].map(([x, y]) => new THREE.Vector2(x, y));

const glassGeometry = new THREE.LatheGeometry(glassProfile, 14);
glassGeometry.computeVertexNormals();

const glassMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xb8fff0,
  roughness: 0.08,
  metalness: 0,
  transmission: 0.96,
  thickness: 0.55,
  ior: 1.47,
  transparent: true,
  opacity: 0.38,
  clearcoat: 1,
  clearcoatRoughness: 0.08,
  attenuationColor: new THREE.Color(0x55c9b4),
  attenuationDistance: 4,
  side: THREE.DoubleSide
});

const flask = new THREE.Mesh(glassGeometry, glassMaterial);
flask.castShadow = true;
flask.receiveShadow = true;
potion.add(flask);

const baseRing = new THREE.Mesh(
  new THREE.TorusGeometry(0.67, 0.055, 8, 14),
  new THREE.MeshPhysicalMaterial({
    color: 0x9ce9da,
    roughness: 0.12,
    transmission: 0.75,
    transparent: true,
    opacity: 0.34
  })
);
baseRing.rotation.x = Math.PI / 2;
baseRing.position.y = 0.25;
potion.add(baseRing);

const neckRim = new THREE.Mesh(
  new THREE.TorusGeometry(0.405, 0.08, 8, 14),
  new THREE.MeshPhysicalMaterial({
    color: 0xc4fff3,
    roughness: 0.09,
    transmission: 0.85,
    transparent: true,
    opacity: 0.48
  })
);
neckRim.rotation.x = Math.PI / 2;
neckRim.position.y = 5.47;
potion.add(neckRim);

const liquidProfile = [
  [0.05, 0.28],
  [0.55, 0.34],
  [1.04, 0.56],
  [1.43, 0.94],
  [1.68, 1.52],
  [1.74, 2.15],
  [1.69, 2.62],
  [0.05, 2.62]
].map(([x, y]) => new THREE.Vector2(x, y));

const liquidMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x16ffb3,
  emissive: 0x00d891,
  emissiveIntensity: 4.5,
  roughness: 0.16,
  metalness: 0,
  transmission: 0.12,
  thickness: 1.5,
  transparent: true,
  opacity: 0.9,
  clearcoat: 0.7,
  clearcoatRoughness: 0.16,
  side: THREE.DoubleSide
});

const liquid = new THREE.Mesh(new THREE.LatheGeometry(liquidProfile, 14), liquidMaterial);
liquid.scale.setScalar(0.96);
potion.add(liquid);

const liquidSurface = new THREE.Mesh(
  new THREE.CylinderGeometry(1.62, 1.69, 0.055, 48),
  new THREE.MeshPhysicalMaterial({
    color: 0x74ffcf,
    emissive: 0x00ffac,
    emissiveIntensity: 6,
    roughness: 0.1,
    transparent: true,
    opacity: 0.94
  })
);
liquidSurface.position.y = 2.61;
potion.add(liquidSurface);

const glowLight = new THREE.PointLight(0x24ffc0, 38, 8, 1.8);
glowLight.position.set(0, 2.1, 0.1);
glowLight.castShadow = true;
glowLight.shadow.mapSize.set(512, 512);
potion.add(glowLight);

const lowerGlow = new THREE.PointLight(0x00df9b, 18, 5, 2);
lowerGlow.position.set(0, 0.8, 0);
potion.add(lowerGlow);

class SpiralCurve extends THREE.Curve {
  getPoint(t, target = new THREE.Vector3()) {
    const angle = t * Math.PI * 3.7;
    const radius = 1.26 - t * 0.28;
    return target.set(
      Math.cos(angle) * radius,
      1.02 + t * 1.42 + Math.sin(t * Math.PI) * 0.12,
      Math.sin(angle) * radius
    );
  }
}

const swirl = new THREE.Mesh(
  new THREE.TubeGeometry(new SpiralCurve(), 100, 0.045, 7, false),
  new THREE.MeshBasicMaterial({
    color: 0xc5ffe9,
    transparent: true,
    opacity: 0.9
  })
);
potion.add(swirl);

class InnerSpiralCurve extends THREE.Curve {
  getPoint(t, target = new THREE.Vector3()) {
    const angle = -t * Math.PI * 4.6 + 1.2;
    const radius = 0.68 - 0.34 * t;
    return target.set(
      Math.cos(angle) * radius,
      0.72 + t * 1.75,
      Math.sin(angle) * radius
    );
  }
}

const innerSwirl = new THREE.Mesh(
  new THREE.TubeGeometry(new InnerSpiralCurve(), 90, 0.026, 6, false),
  new THREE.MeshBasicMaterial({
    color: 0x66ffd0,
    transparent: true,
    opacity: 0.72
  })
);
potion.add(innerSwirl);

const bubbleMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xc6fff0,
  emissive: 0x43ffc7,
  emissiveIntensity: 5,
  roughness: 0.05,
  transmission: 0.25,
  transparent: true,
  opacity: 0.88
});

const bubbles = [];
const bubbleData = [
  [-0.72, 1.25, 0.48, 0.11],
  [0.52, 1.62, 0.78, 0.15],
  [-0.15, 2.02, -0.58, 0.09],
  [0.63, 2.42, -0.22, 0.12],
  [-0.35, 2.78, 0.17, 0.085],
  [0.18, 3.08, 0.04, 0.065],
  [-0.10, 3.42, -0.03, 0.052]
];

for (const [x, y, z, radius] of bubbleData) {
  const bubble = new THREE.Mesh(
    new THREE.SphereGeometry(radius, 14, 10),
    bubbleMaterial
  );
  bubble.position.set(x, y, z);
  bubble.userData.baseY = y;
  bubble.userData.phase = Math.random() * Math.PI * 2;
  potion.add(bubble);
  bubbles.push(bubble);
}

const corkMaterial = new THREE.MeshStandardMaterial({
  color: 0x8c5127,
  roughness: 0.92,
  metalness: 0
});

const cork = new THREE.Mesh(
  new THREE.CylinderGeometry(0.31, 0.285, 0.72, 12, 4),
  corkMaterial
);
cork.position.y = 5.65;
cork.castShadow = true;
potion.add(cork);

const corkTop = new THREE.Mesh(
  new THREE.CylinderGeometry(0.34, 0.31, 0.13, 12),
  new THREE.MeshStandardMaterial({ color: 0xa56734, roughness: 0.88 })
);
corkTop.position.y = 6.03;
corkTop.castShadow = true;
potion.add(corkTop);

for (let i = 0; i < 4; i++) {
  const groove = new THREE.Mesh(
    new THREE.TorusGeometry(0.313 - i * 0.004, 0.012, 5, 12),
    new THREE.MeshStandardMaterial({ color: 0x5c3019, roughness: 1 })
  );
  groove.rotation.x = Math.PI / 2;
  groove.position.y = 5.42 + i * 0.18;
  potion.add(groove);
}

const cordMaterial = new THREE.MeshStandardMaterial({
  color: 0x5b3823,
  roughness: 0.95
});

const cordLoop = new THREE.Mesh(
  new THREE.TorusGeometry(0.44, 0.025, 7, 24),
  cordMaterial
);
cordLoop.rotation.x = Math.PI / 2;
cordLoop.position.y = 4.92;
potion.add(cordLoop);

const cordCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0.34, 4.92, 0.12),
  new THREE.Vector3(0.58, 4.64, 0.31),
  new THREE.Vector3(0.78, 4.29, 0.44),
  new THREE.Vector3(0.93, 3.91, 0.5)
]);
const cord = new THREE.Mesh(
  new THREE.TubeGeometry(cordCurve, 28, 0.025, 6, false),
  cordMaterial
);
potion.add(cord);

const tagShape = new THREE.Shape();
tagShape.moveTo(-0.48, 0.65);
tagShape.lineTo(0.34, 0.65);
tagShape.lineTo(0.51, 0.43);
tagShape.lineTo(0.48, -0.62);
tagShape.lineTo(-0.48, -0.62);
tagShape.lineTo(-0.52, 0.46);
tagShape.closePath();

const tag = new THREE.Mesh(
  new THREE.ExtrudeGeometry(tagShape, {
    depth: 0.045,
    bevelEnabled: true,
    bevelSegments: 2,
    bevelSize: 0.035,
    bevelThickness: 0.02
  }),
  new THREE.MeshStandardMaterial({
    color: 0xd6bd81,
    roughness: 0.9,
    side: THREE.DoubleSide
  })
);
tag.position.set(1.08, 3.38, 0.48);
tag.rotation.set(-0.08, 0.35, -0.13);
tag.castShadow = true;
potion.add(tag);

const tagHole = new THREE.Mesh(
  new THREE.TorusGeometry(0.075, 0.018, 6, 18),
  new THREE.MeshStandardMaterial({
    color: 0x6f4929,
    roughness: 0.7,
    metalness: 0.1
  })
);
tagHole.position.set(0.99, 3.95, 0.55);
tagHole.rotation.set(Math.PI / 2 - 0.08, 0.35, -0.13);
potion.add(tagHole);

const runeMaterial = new THREE.MeshBasicMaterial({
  color: 0x426c55,
  transparent: true,
  opacity: 0.78,
  side: THREE.DoubleSide
});

const runeGroup = new THREE.Group();
const runeLines = [
  [[-0.18, 0.22], [0.10, 0.38]],
  [[0.10, 0.38], [0.20, 0.05]],
  [[0.20, 0.05], [-0.12, -0.14]],
  [[-0.12, -0.14], [-0.23, 0.13]],
  [[-0.23, 0.13], [0.20, 0.05]],
  [[-0.20, -0.34], [0.18, -0.34]]
];

for (const [[x1, y1], [x2, y2]] of runeLines) {
  const length = Math.hypot(x2 - x1, y2 - y1);
  const line = new THREE.Mesh(
    new THREE.PlaneGeometry(length, 0.026),
    runeMaterial
  );
  line.position.set((x1 + x2) * 0.5, (y1 + y2) * 0.5, 0);
  line.rotation.z = Math.atan2(y2 - y1, x2 - x1);
  runeGroup.add(line);
}
runeGroup.position.set(1.108, 3.4, 0.535);
runeGroup.rotation.set(-0.08, 0.35, -0.13);
runeGroup.scale.setScalar(0.78);
potion.add(runeGroup);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(8, 64),
  new THREE.MeshStandardMaterial({
    color: 0x07100f,
    roughness: 0.82,
    metalness: 0.05
  })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
floor.receiveShadow = true;
scene.add(floor);

const aura = new THREE.Mesh(
  new THREE.RingGeometry(1.5, 3.4, 64),
  new THREE.MeshBasicMaterial({
    color: 0x00b781,
    transparent: true,
    opacity: 0.12,
    side: THREE.DoubleSide,
    depthWrite: false
  })
);
aura.rotation.x = -Math.PI / 2;
aura.position.y = 0.012;
scene.add(aura);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  controls.update();

  swirl.rotation.y = t * 0.32;
  innerSwirl.rotation.y = -t * 0.46;
  liquidSurface.scale.y = 1 + Math.sin(t * 1.8) * 0.025;
  liquidMaterial.emissiveIntensity = 4.3 + Math.sin(t * 1.35) * 0.45;
  glowLight.intensity = 36 + Math.sin(t * 1.65) * 5;
  aura.material.opacity = 0.1 + Math.sin(t * 1.4) * 0.025;
  aura.scale.setScalar(1 + Math.sin(t * 1.15) * 0.035);

  for (const bubble of bubbles) {
    const phase = bubble.userData.phase;
    bubble.position.y = bubble.userData.baseY + Math.sin(t * 1.2 + phase) * 0.06;
    bubble.position.x += Math.sin(t * 1.5 + phase) * 0.00035;
    bubble.scale.setScalar(1 + Math.sin(t * 2.1 + phase) * 0.08);
  }

  composer.render();
}

animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
