<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cheeky Cartoon Venus Flytrap</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0e11; }
  #app { width: 100vw; height: 100vh; display: block; }
  .hint {
    position: fixed; left: 14px; bottom: 12px; z-index: 10;
    font: 13px/1.4 system-ui, sans-serif; color: rgba(255,255,255,0.42);
    letter-spacing: .2px; user-select: none; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="app"></canvas>
<div class="hint">drag to orbit • scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------------------------------------------------------------------
   Renderer
--------------------------------------------------------------------------- */
const canvas = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

/* ---------------------------------------------------------------------------
   Scene + soft studio environment for glossy reflections
--------------------------------------------------------------------------- */
const scene = new THREE.Scene();

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

function makeBackground() {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(256, 210, 40, 256, 260, 380);
  g.addColorStop(0, '#2c3037');
  g.addColorStop(0.55, '#181a1f');
  g.addColorStop(1, '#0b0c0f');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
scene.background = makeBackground();

/* ---------------------------------------------------------------------------
   Camera
--------------------------------------------------------------------------- */
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4.6, 3.1, 5.6);

/* ---------------------------------------------------------------------------
   Controls
--------------------------------------------------------------------------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 3.5;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 1.95, 0);

/* ---------------------------------------------------------------------------
   Lighting : hemisphere fill + key + fill + rim
--------------------------------------------------------------------------- */
const hemi = new THREE.HemisphereLight(0xc7ddff, 0x3a281c, 0.45);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff4e2, 2.5);
key.position.set(5, 8.5, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 30;
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -2;
key.shadow.bias = -0.0004;
key.shadow.radius = 5;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbcd2ff, 0.55);
fill.position.set(-6, 4, 3);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffe6bf, 1.5);
rim.position.set(-4, 5.5, -6);
scene.add(rim);

/* ---------------------------------------------------------------------------
   Ground plane : only receives shadows
--------------------------------------------------------------------------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------------------------------------------------------------------
   Materials
--------------------------------------------------------------------------- */
const terracottaMat = new THREE.MeshStandardMaterial({ color: 0xc4693f, roughness: 0.82, metalness: 0.0 });
const terracottaRimMat = new THREE.MeshStandardMaterial({ color: 0xb15733, roughness: 0.8, metalness: 0.0 });
const grooveMat = new THREE.MeshStandardMaterial({ color: 0x8f451f, roughness: 0.9 });
const soilMat = new THREE.MeshStandardMaterial({ color: 0x241812, roughness: 1.0 });

const stemMat = new THREE.MeshPhysicalMaterial({
  color: 0x4aa838, roughness: 0.42, clearcoat: 0.7, clearcoatRoughness: 0.28
});
const greenMat = new THREE.MeshPhysicalMaterial({
  color: 0x5ecb3b, roughness: 0.34, clearcoat: 1.0, clearcoatRoughness: 0.1, side: THREE.DoubleSide
});
const innerMat = new THREE.MeshPhysicalMaterial({
  color: 0xe0426b, roughness: 0.4, clearcoat: 0.85, clearcoatRoughness: 0.2,
  side: THREE.DoubleSide, emissive: 0x5a1225, emissiveIntensity: 0.3
});
const toothMat = new THREE.MeshPhysicalMaterial({
  color: 0xfff7ee, roughness: 0.22, clearcoat: 1.0, clearcoatRoughness: 0.08
});
const hairMat = new THREE.MeshStandardMaterial({ color: 0xff5f80, roughness: 0.5 });
const eyeWhiteMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.12, clearcoat: 1.0 });
const pupilMat = new THREE.MeshStandardMaterial({ color: 0x140b11, roughness: 0.3 });
const highlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

/* ---------------------------------------------------------------------------
   Root of the single centered object
--------------------------------------------------------------------------- */
const root = new THREE.Group();
scene.add(root);

/* ---------------------------------------------------------------------------
   Terracotta pot
--------------------------------------------------------------------------- */
function buildPot() {
  const pot = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(1.16, 0.86, 1.5, 48, 1),
    terracottaMat
  );
  body.position.y = 0.75;
  body.castShadow = true;
  body.receiveShadow = true;
  pot.add(body);

  const rimRing = new THREE.Mesh(
    new THREE.CylinderGeometry(1.24, 1.18, 0.3, 48, 1),
    terracottaRimMat
  );
  rimRing.position.y = 1.5;
  rimRing.castShadow = true;
  rimRing.receiveShadow = true;
  pot.add(rimRing);

  const groove = new THREE.Mesh(
    new THREE.TorusGeometry(1.15, 0.03, 12, 48),
    grooveMat
  );
  groove.rotation.x = Math.PI / 2;
  groove.position.y = 1.28;
  pot.add(groove);

  // mounded soil
  const soil = new THREE.Mesh(
    new THREE.SphereGeometry(1.06, 40, 22),
    soilMat
  );
  soil.scale.y = 0.2;
  soil.position.y = 1.34;
  soil.receiveShadow = true;
  pot.add(soil);

  return pot;
}
root.add(buildPot());

/* ---------------------------------------------------------------------------
   Lobe geometry : cupped half-disc hinged on the z-axis midrib
--------------------------------------------------------------------------- */
function buildLobeGeometry(R, cupH, segA, segR) {
  const geo = new THREE.BufferGeometry();
  const pos = [];
  const idx = [];
  for (let i = 0; i <= segA; i++) {
    const psi = -Math.PI / 2 + Math.PI * i / segA;
    const cp = Math.cos(psi), sp = Math.sin(psi);
    for (let j = 0; j <= segR; j++) {
      const a = j / segR;
      const rho = R * a;
      const x = rho * cp;
      const z = rho * sp;
      const y = cupH * a * cp; // scoop rises toward the outer centre
      pos.push(x, y, z);
    }
  }
  const rowN = segR + 1;
  for (let i = 0; i < segA; i++) {
    for (let j = 0; j < segR; j++) {
      const A = i * rowN + j, B = A + rowN, C = A + 1, D = B + 1;
      idx.push(A, B, D, A, D, C);
    }
  }
  geo.setIndex(idx);
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.computeVertexNormals();
  return geo;
}

/* ---------------------------------------------------------------------------
   Cartoon eye
--------------------------------------------------------------------------- */
function makeEye() {
  const g = new THREE.Group();
  const w = new THREE.Mesh(new THREE.SphereGeometry(0.13, 24, 20), eyeWhiteMat);
  w.castShadow = true;
  g.add(w);
  const p = new THREE.Mesh(new THREE.SphereGeometry(0.07, 18, 16), pupilMat);
  p.position.set(0, 0.01, 0.09);
  g.add(p);
  const h = new THREE.Mesh(new THREE.SphereGeometry(0.026, 10, 10), highlightMat);
  h.position.set(0.036, 0.05, 0.115);
  g.add(h);
  return g;
}

/* ---------------------------------------------------------------------------
   A single trap : two hinged lobes, fat teeth, red maw, optional eyes
--------------------------------------------------------------------------- */
function createTrap(R, withEyes) {
  const group = new THREE.Group();
  const cupH = R * 0.42;
  const k = R / 0.7; // scale factor relative to the reference big trap

  const lobeGeo = buildLobeGeometry(R, cupH, 30, 12);
  const innerGeo = buildLobeGeometry(R * 0.8, cupH * 0.8, 26, 10);
  const toothGeo = new THREE.ConeGeometry(0.085 * k, 0.34 * k, 16);
  const hairGeo = new THREE.ConeGeometry(0.02 * k, 0.14 * k, 8);

  function makeLobe(mirror) {
    const g = new THREE.Group();

    const green = new THREE.Mesh(lobeGeo, greenMat);
    green.castShadow = true;
    green.receiveShadow = true;
    g.add(green);

    const inner = new THREE.Mesh(innerGeo, innerMat);
    inner.position.y = 0.03 * k;
    g.add(inner);

    // fat white teeth along the outer arc
    const T = 9;
    for (let i = 0; i < T; i++) {
      const psi = -Math.PI / 2 + Math.PI * (i + 0.5) / T;
      const cp = Math.cos(psi), sp = Math.sin(psi);
      const x = R * cp, z = R * sp, y = cupH * cp;
      const dir = new THREE.Vector3(cp * 0.85, 0.62, sp * 0.85).normalize();
      const tooth = new THREE.Mesh(toothGeo, toothMat);
      tooth.castShadow = true;
      const hh = 0.34 * k;
      tooth.position.set(
        x + dir.x * hh * 0.35,
        y + dir.y * hh * 0.35,
        z + dir.z * hh * 0.35
      );
      tooth.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      tooth.scale.setScalar(0.85 + 0.3 * Math.cos(psi));
      g.add(tooth);
    }

    // little trigger hairs inside
    const hairSpots = [[0.35, -0.5], [0.5, 0.0], [0.35, 0.5]];
    for (const [a, psi] of hairSpots) {
      const hair = new THREE.Mesh(hairGeo, hairMat);
      hair.position.set(R * a * Math.cos(psi), cupH * a * Math.cos(psi) + 0.05 * k, R * a * Math.sin(psi));
      g.add(hair);
    }

    if (mirror) g.scale.x = -1;
    return g;
  }

  const left = makeLobe(true);
  const right = makeLobe(false);
  group.add(left, right);

  // green calyx where the lobes meet
  const calyx = new THREE.Mesh(new THREE.SphereGeometry(0.2 * k, 18, 14), stemMat);
  calyx.scale.y = 0.6;
  calyx.position.y = -0.04 * k;
  calyx.castShadow = true;
  group.add(calyx);

  // goofy stalked eyes
  if (withEyes) {
    function makeEyeStalk(sx) {
      const s = new THREE.Group();
      const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.045, 0.4, 10), stemMat);
      stalk.position.y = 0.2;
      stalk.castShadow = true;
      s.add(stalk);
      const eye = makeEye();
      eye.position.y = 0.43;
      s.add(eye);
      s.position.set(sx * 0.15, 0.02, 0.04);
      s.rotation.set(-0.18, 0, sx * -0.22);
      return s;
    }
    group.add(makeEyeStalk(-1), makeEyeStalk(1));
  }

  function setOpen(phi) {
    right.rotation.z = phi;
    left.rotation.z = phi;
  }
  setOpen(0.5);

  return { group, setOpen };
}

/* ---------------------------------------------------------------------------
   A stem carrying one trap ( pivots at its soil base for the wobble )
--------------------------------------------------------------------------- */
function createStemUnit(cfg) {
  const grp = new THREE.Group();
  grp.position.copy(cfg.basePos);

  const curve = new THREE.CatmullRomCurve3(cfg.points.map(p => new THREE.Vector3(p[0], p[1], p[2])));
  const tube = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 48, cfg.stemR, 12, false),
    stemMat
  );
  tube.castShadow = true;
  tube.receiveShadow = true;
  grp.add(tube);

  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.16, 20, 16), stemMat);
  bulb.scale.y = 0.7;
  bulb.castShadow = true;
  grp.add(bulb);

  const trap = createTrap(cfg.trapR, cfg.eyes);
  const tip = cfg.points[cfg.points.length - 1];
  trap.group.position.set(tip[0], tip[1], tip[2]);
  trap.group.rotation.set(cfg.trapRot[0], cfg.trapRot[1], cfg.trapRot[2]);
  grp.add(trap.group);

  return { group: grp, setOpen: trap.setOpen };
}

/* ---------------------------------------------------------------------------
   Assemble the plant
--------------------------------------------------------------------------- */
const soilY = 1.36;
const plant = new THREE.Group();
plant.position.y = soilY;
root.add(plant);

const plants = [];

// #1 : the grinning open trap ( with eyes )
const grin = createStemUnit({
  basePos: new THREE.Vector3(-0.12, 0, 0.06),
  points: [[0, 0, 0], [-0.1, 0.52, 0.12], [-0.32, 1.0, 0.28], [-0.48, 1.42, 0.42]],
  stemR: 0.09,
  trapR: 0.74,
  trapRot: [-0.55, -0.4, -0.12],
  eyes: true
});
plant.add(grin.group);
plants.push({ group: grin.group, setOpen: grin.setOpen, isGrin: true, phase: 0.0, bx: 0, bz: 0 });

// #2 : the second oversized trap, half open ( with eyes )
const second = createStemUnit({
  basePos: new THREE.Vector3(0.14, 0, -0.02),
  points: [[0, 0, 0], [0.14, 0.5, 0.06], [0.34, 0.92, 0.2], [0.5, 1.3, 0.34]],
  stemR: 0.085,
  trapR: 0.66,
  trapRot: [-0.55, 0.5, 0.14],
  eyes: true
});
plant.add(second.group);
plants.push({ group: second.group, setOpen: second.setOpen, isGrin: false, closeAmt: 0.86, phase: 1.7, bx: 0, bz: 0 });

// #3 & #4 : little closed buds for fullness
const bud1 = createStemUnit({
  basePos: new THREE.Vector3(0.02, 0, -0.18),
  points: [[0, 0, 0], [0.03, 0.34, -0.12], [0.06, 0.62, -0.22]],
  stemR: 0.06,
  trapR: 0.3,
  trapRot: [-0.3, 0.2, 0.05],
  eyes: false
});
bud1.setOpen(1.05);
plant.add(bud1.group);
plants.push({ group: bud1.group, setOpen: bud1.setOpen, isGrin: false, closeAmt: 1.05, phase: 3.2, bx: 0, bz: 0 });

const bud2 = createStemUnit({
  basePos: new THREE.Vector3(-0.22, 0, -0.1),
  points: [[0, 0, 0], [-0.06, 0.3, -0.06], [-0.12, 0.52, -0.1]],
  stemR: 0.055,
  trapR: 0.24,
  trapRot: [-0.2, -0.3, -0.05],
  eyes: false
});
bud2.setOpen(1.1);
plant.add(bud2.group);
plants.push({ group: bud2.group, setOpen: bud2.setOpen, isGrin: false, closeAmt: 1.1, phase: 5.0, bx: 0, bz: 0 });

/* ---------------------------------------------------------------------------
   Animation
--------------------------------------------------------------------------- */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  for (const p of plants) {
    // bouncy stem wobble
    p.group.rotation.x = p.bx + Math.sin(t * 1.7 + p.phase) * 0.05;
    p.group.rotation.z = p.bz + Math.cos(t * 1.35 + p.phase) * 0.045;

    // mouth motion
    if (p.isGrin) {
      const pulse = Math.pow(0.5 + 0.5 * Math.sin(t * 1.1), 10); // occasional snap
      p.setOpen(0.5 - 0.34 * pulse + Math.sin(t * 4.0) * 0.03);
    } else {
      p.setOpen(p.closeAmt + Math.sin(t * 1.6 + p.phase) * 0.05);
    }
  }

  // whole-plant gentle sway
  plant.rotation.z = Math.sin(t * 0.9) * 0.02;

  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ---------------------------------------------------------------------------
   Resize
--------------------------------------------------------------------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
