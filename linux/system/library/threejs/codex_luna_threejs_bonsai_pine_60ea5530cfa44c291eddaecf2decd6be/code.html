<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procedural Bonsai Pine</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #d8d0c1; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8d0c1);
scene.fog = new THREE.Fog(0xd8d0c1, 16, 29);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(8.4, 5.6, 10.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 6;
controls.maxDistance = 17;
controls.target.set(0, 2.55, 0);

const hemi = new THREE.HemisphereLight(0xf8f1df, 0x40382d, 2.0);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffe6bd, 4.1);
key.position.set(-6, 11, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -8;
key.shadow.camera.right = 8;
key.shadow.camera.top = 12;
key.shadow.camera.bottom = -5;
key.shadow.bias = -0.0004;
scene.add(key);

const fill = new THREE.DirectionalLight(0xa9c9d4, 1.2);
fill.position.set(7, 5, -8);
scene.add(fill);

const trunkMaterial = new THREE.MeshStandardMaterial({
  color: 0x4b3021,
  roughness: 0.92,
  metalness: 0.02
});
const barkLight = new THREE.MeshStandardMaterial({
  color: 0x725038,
  roughness: 0.96
});
const barkDark = new THREE.MeshStandardMaterial({
  color: 0x291c17,
  roughness: 1
});
const soilMaterial = new THREE.MeshStandardMaterial({
  color: 0x30251c,
  roughness: 1
});
const potMaterial = new THREE.MeshStandardMaterial({
  color: 0x72675c,
  roughness: 0.82,
  metalness: 0.03
});
const potEdgeMaterial = new THREE.MeshStandardMaterial({
  color: 0x918477,
  roughness: 0.76
});
const needleMaterials = [
  new THREE.MeshStandardMaterial({ color: 0x183d2b, roughness: 0.88 }),
  new THREE.MeshStandardMaterial({ color: 0x24543a, roughness: 0.86 }),
  new THREE.MeshStandardMaterial({ color: 0x356b45, roughness: 0.84 }),
  new THREE.MeshStandardMaterial({ color: 0x102d22, roughness: 0.9 })
];
const wireMaterial = new THREE.MeshStandardMaterial({
  color: 0x977442,
  roughness: 0.42,
  metalness: 0.72
});

function makeBox(size, material, position, bevelScale = 0) {
  const geometry = new THREE.BoxGeometry(size.x, size.y, size.z);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(position);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function cylinderBetween(a, b, radiusA, radiusB, material, radialSegments = 9) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const length = direction.length();
  const geometry = new THREE.CylinderGeometry(radiusB, radiusA, length, radialSegments, 1);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function addCurve(points, radii, material = trunkMaterial, segments = 9) {
  for (let i = 0; i < points.length - 1; i++) {
    cylinderBetween(points[i], points[i + 1], radii[i], radii[i + 1], material, segments);
    if (i > 0) {
      const knot = new THREE.Mesh(
        new THREE.IcosahedronGeometry(radii[i] * 1.06, 1),
        material
      );
      knot.position.copy(points[i]);
      knot.scale.y = 1.15;
      knot.castShadow = true;
      scene.add(knot);
    }
  }
}

function addBarkRidge(a, b, width, material) {
  const midpoint = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);
  const direction = new THREE.Vector3().subVectors(b, a);
  const length = direction.length();
  const geometry = new THREE.BoxGeometry(width, length, width * 0.42);
  const ridge = new THREE.Mesh(geometry, material);
  ridge.position.copy(midpoint);
  ridge.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  ridge.castShadow = true;
  scene.add(ridge);
}

function addRoot(angle, length, thickness, lift) {
  const start = new THREE.Vector3(0, 0.72, 0);
  const end = new THREE.Vector3(
    Math.cos(angle) * length,
    0.48 + lift,
    Math.sin(angle) * length
  );
  const middle = new THREE.Vector3(
    Math.cos(angle) * length * 0.5,
    0.55 + lift * 0.55,
    Math.sin(angle) * length * 0.5
  );
  addCurve([start, middle, end], [thickness, thickness * 0.72, 0.045], trunkMaterial, 8);
  const rootHighlight = new THREE.Mesh(
    new THREE.CylinderGeometry(thickness * 0.15, thickness * 0.2, length * 0.72, 6),
    barkLight
  );
  rootHighlight.position.copy(start).lerp(end, 0.44);
  rootHighlight.rotation.z = Math.PI * 0.5;
  rootHighlight.rotateY(-angle);
  rootHighlight.castShadow = true;
  scene.add(rootHighlight);
}

function addNeedlePad(position, scale, rotation, seed) {
  const group = new THREE.Group();
  group.position.copy(position);
  group.rotation.set(rotation.x, rotation.y, rotation.z);
  group.scale.set(scale.x, scale.y, scale.z);

  const pad = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.65, 2),
    needleMaterials[seed % needleMaterials.length]
  );
  pad.scale.set(1.65, 0.43, 0.7);
  pad.castShadow = true;
  pad.receiveShadow = true;
  group.add(pad);

  const tuftCount = 13;
  for (let i = 0; i < tuftCount; i++) {
    const theta = (i / tuftCount) * Math.PI * 2 + seed * 0.37;
    const radial = 0.25 + (i % 3) * 0.12;
    const tuft = new THREE.Mesh(
      new THREE.ConeGeometry(0.12 + (i % 2) * 0.025, 0.48 + (i % 4) * 0.055, 5),
      needleMaterials[(seed + i + 1) % needleMaterials.length]
    );
    tuft.position.set(
      Math.cos(theta) * radial,
      0.18 + Math.sin(i * 1.7 + seed) * 0.08,
      Math.sin(theta) * radial * 0.56
    );
    tuft.rotation.set(
      -0.38 + Math.sin(theta) * 0.22,
      theta,
      Math.cos(theta) * 0.2
    );
    tuft.castShadow = true;
    group.add(tuft);
  }
  scene.add(group);
  return group;
}

function addWire(points, radius = 0.018) {
  for (let i = 0; i < points.length - 1; i++) {
    cylinderBetween(points[i], points[i + 1], radius, radius * 0.98, wireMaterial, 6);
  }
}

const potBody = makeBox(new THREE.Vector3(4.9, 0.72, 3.55), potMaterial, new THREE.Vector3(0, 0.42, 0));
const potTop = makeBox(new THREE.Vector3(4.55, 0.15, 3.2), soilMaterial, new THREE.Vector3(0, 0.82, 0));
makeBox(new THREE.Vector3(5.25, 0.22, 0.25), potEdgeMaterial, new THREE.Vector3(0, 0.91, 1.72));
makeBox(new THREE.Vector3(5.25, 0.22, 0.25), potEdgeMaterial, new THREE.Vector3(0, 0.91, -1.72));
makeBox(new THREE.Vector3(0.25, 0.22, 3.2), potEdgeMaterial, new THREE.Vector3(2.5, 0.91, 0));
makeBox(new THREE.Vector3(0.25, 0.22, 3.2), potEdgeMaterial, new THREE.Vector3(-2.5, 0.91, 0));

const footPositions = [
  new THREE.Vector3(-1.85, 0.02, -1.2),
  new THREE.Vector3(1.85, 0.02, -1.2),
  new THREE.Vector3(-1.85, 0.02, 1.2),
  new THREE.Vector3(1.85, 0.02, 1.2)
];
for (const footPosition of footPositions) {
  makeBox(new THREE.Vector3(0.46, 0.18, 0.46), potMaterial, footPosition);
}

for (let i = 0; i < 9; i++) {
  const stone = new THREE.Mesh(
    new THREE.DodecahedronGeometry(0.09 + (i % 3) * 0.035, 0),
    new THREE.MeshStandardMaterial({ color: 0x63564a, roughness: 1 })
  );
  stone.position.set(-1.7 + (i * 0.73) % 3.4, 0.96 + (i % 2) * 0.025, -1.05 + ((i * 1.17) % 2.1));
  stone.scale.y = 0.45;
  stone.castShadow = true;
  scene.add(stone);
}

const trunkPoints = [
  new THREE.Vector3(0, 0.72, 0),
  new THREE.Vector3(-0.08, 1.42, 0.05),
  new THREE.Vector3(0.16, 2.12, 0.02),
  new THREE.Vector3(-0.04, 2.76, 0.08),
  new THREE.Vector3(0.20, 3.38, 0.16),
  new THREE.Vector3(0.05, 4.02, 0.02),
  new THREE.Vector3(0.25, 4.56, -0.04),
  new THREE.Vector3(0.04, 5.02, 0.04)
];
const trunkRadii = [0.51, 0.44, 0.38, 0.32, 0.265, 0.205, 0.14, 0.055];
addCurve(trunkPoints, trunkRadii, trunkMaterial, 12);

for (let i = 0; i < 7; i++) {
  const side = i % 2 === 0 ? 1 : -1;
  const y = 1.05 + i * 0.54;
  const a = new THREE.Vector3(side * 0.27, y, 0.05);
  const b = new THREE.Vector3(side * 0.30, y + 0.38, 0.09);
  addBarkRidge(a, b, 0.065 + (i % 3) * 0.016, i % 2 ? barkDark : barkLight);
}

for (let i = 0; i < 10; i++) {
  const angle = i * 0.63 + 0.15;
  addRoot(angle, 0.72 + (i % 4) * 0.15, 0.17 - (i % 3) * 0.018, (i % 2) * 0.045);
}

const branches = [
  {
    points: [new THREE.Vector3(-0.05, 1.75, 0.02), new THREE.Vector3(-0.72, 1.86, 0.02), new THREE.Vector3(-1.55, 2.02, 0.16), new THREE.Vector3(-2.15, 2.22, 0.1)],
    pads: [
      [new THREE.Vector3(-1.68, 2.29, 0.12), new THREE.Vector3(0.95, 0.42, 0.78), new THREE.Vector3(0, 0.2, -0.08)],
      [new THREE.Vector3(-1.13, 2.13, -0.1), new THREE.Vector3(0.86, 0.4, 0.68), new THREE.Vector3(0, -0.22, 0.12)]
    ]
  },
  {
    points: [new THREE.Vector3(0.05, 2.30, 0.02), new THREE.Vector3(0.76, 2.43, 0.06), new THREE.Vector3(1.48, 2.68, -0.12), new THREE.Vector3(2.15, 2.65, -0.08)],
    pads: [
      [new THREE.Vector3(1.76, 2.72, -0.12), new THREE.Vector3(0.92, 0.39, 0.72), new THREE.Vector3(0, -0.16, -0.08)],
      [new THREE.Vector3(1.18, 2.56, 0.12), new THREE.Vector3(0.78, 0.36, 0.62), new THREE.Vector3(0, 0.15, 0.1)]
    ]
  },
  {
    points: [new THREE.Vector3(-0.03, 2.92, 0.07), new THREE.Vector3(-0.64, 3.12, 0.08), new THREE.Vector3(-1.28, 3.55, 0.02), new THREE.Vector3(-1.82, 3.62, 0.12)],
    pads: [
      [new THREE.Vector3(-1.49, 3.68, 0.16), new THREE.Vector3(0.86, 0.37, 0.7), new THREE.Vector3(0, -0.2, 0.08)],
      [new THREE.Vector3(-0.92, 3.39, -0.08), new THREE.Vector3(0.7, 0.33, 0.58), new THREE.Vector3(0, 0.2, -0.1)]
    ]
  },
  {
    points: [new THREE.Vector3(0.08, 3.55, 0.13), new THREE.Vector3(0.67, 3.73, 0.08), new THREE.Vector3(1.22, 4.08, 0.0), new THREE.Vector3(1.72, 4.12, 0.05)],
    pads: [
      [new THREE.Vector3(1.38, 4.2, 0.04), new THREE.Vector3(0.73, 0.33, 0.6), new THREE.Vector3(0, -0.1, 0.05)],
      [new THREE.Vector3(0.84, 3.91, 0.16), new THREE.Vector3(0.63, 0.3, 0.52), new THREE.Vector3(0, 0.22, -0.08)]
    ]
  },
  {
    points: [new THREE.Vector3(0.16, 4.10, 0.05), new THREE.Vector3(-0.35, 4.34, 0.04), new THREE.Vector3(-0.87, 4.72, -0.02), new THREE.Vector3(-1.25, 4.74, 0.0)],
    pads: [
      [new THREE.Vector3(-1.0, 4.83, 0.1), new THREE.Vector3(0.65, 0.3, 0.54), new THREE.Vector3(0, -0.2, 0.1)]
    ]
  },
  {
    points: [new THREE.Vector3(0.17, 4.48, -0.01), new THREE.Vector3(0.57, 4.63, 0.04), new THREE.Vector3(1.02, 4.92, 0.03), new THREE.Vector3(1.3, 4.98, 0.08)],
    pads: [
      [new THREE.Vector3(1.08, 5.08, 0.08), new THREE.Vector3(0.56, 0.27, 0.5), new THREE.Vector3(0, 0.16, 0.04)]
    ]
  }
];

for (let b = 0; b < branches.length; b++) {
  const branch = branches[b];
  const radii = branch.points.map((point, index) => 0.14 * Math.pow(0.42, index) + 0.018);
  addCurve(branch.points, radii, trunkMaterial, 8);
  for (let p = 0; p < branch.pads.length; p++) {
    addNeedlePad(branch.pads[p][0], branch.pads[p][1], branch.pads[p][2], b * 3 + p);
  }
}

addCurve([
  new THREE.Vector3(0.04, 4.92, 0.04),
  new THREE.Vector3(-0.18, 5.26, 0.08),
  new THREE.Vector3(0.12, 5.57, 0.02),
  new THREE.Vector3(-0.02, 5.83, 0.03)
], [0.075, 0.06, 0.04, 0.018], trunkMaterial, 8);

addNeedlePad(new THREE.Vector3(-0.08, 5.72, 0.05), new THREE.Vector3(0.55, 0.3, 0.48), new THREE.Vector3(0, 0.1, 0), 21);
addNeedlePad(new THREE.Vector3(0.22, 5.36, -0.02), new THREE.Vector3(0.62, 0.31, 0.5), new THREE.Vector3(0, -0.18, 0.04), 22);

addWire([
  new THREE.Vector3(-0.19, 1.94, 0.29),
  new THREE.Vector3(-0.73, 2.08, 0.35),
  new THREE.Vector3(-1.3, 2.31, 0.38),
  new THREE.Vector3(-1.9, 2.42, 0.25)
], 0.017);
addWire([
  new THREE.Vector3(0.16, 2.52, 0.3),
  new THREE.Vector3(0.76, 2.68, 0.28),
  new THREE.Vector3(1.35, 2.91, 0.2),
  new THREE.Vector3(1.95, 2.9, 0.15)
], 0.016);
addWire([
  new THREE.Vector3(0.0, 3.15, 0.31),
  new THREE.Vector3(-0.57, 3.36, 0.3),
  new THREE.Vector3(-1.12, 3.78, 0.25),
  new THREE.Vector3(-1.66, 3.88, 0.16)
], 0.015);
addWire([
  new THREE.Vector3(0.2, 3.82, 0.27),
  new THREE.Vector3(0.72, 4.0, 0.25),
  new THREE.Vector3(1.25, 4.33, 0.2),
  new THREE.Vector3(1.57, 4.38, 0.13)
], 0.014);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(22, 64),
  new THREE.MeshStandardMaterial({ color: 0xb9b09f, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.09;
ground.receiveShadow = true;
scene.add(ground);

const plinth = new THREE.Mesh(
  new THREE.CylinderGeometry(4.4, 4.7, 0.18, 64),
  new THREE.MeshStandardMaterial({ color: 0x9a8d7a, roughness: 0.88 })
);
plinth.position.y = -0.02;
plinth.receiveShadow = true;
plinth.castShadow = true;
scene.add(plinth);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
