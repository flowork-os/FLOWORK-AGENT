<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procedural Hydraulic Excavator</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #a9c9d2; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa9c9d2);
scene.fog = new THREE.Fog(0xa9c9d2, 32, 75);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 150);
camera.position.set(10, 7.5, 11);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(1.3, 2.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 7;
controls.maxDistance = 28;
controls.maxPolarAngle = Math.PI * 0.49;

const hemi = new THREE.HemisphereLight(0xdceff2, 0x56615e, 2.0);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff3d5, 4.2);
sun.position.set(-10, 18, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -18;
sun.shadow.camera.right = 18;
sun.shadow.camera.top = 18;
sun.shadow.camera.bottom = -12;
sun.shadow.bias = -0.00025;
scene.add(sun);

const yellow = new THREE.MeshStandardMaterial({ color: 0xe7a900, roughness: 0.7, metalness: 0.12 });
const yellowBright = new THREE.MeshStandardMaterial({ color: 0xffbf16, roughness: 0.58, metalness: 0.1 });
const yellowDark = new THREE.MeshStandardMaterial({ color: 0xb97900, roughness: 0.78, metalness: 0.12 });
const rubber = new THREE.MeshStandardMaterial({ color: 0x171917, roughness: 0.96, metalness: 0.02 });
const rubberEdge = new THREE.MeshStandardMaterial({ color: 0x252824, roughness: 0.9 });
const steel = new THREE.MeshStandardMaterial({ color: 0x596064, roughness: 0.5, metalness: 0.78 });
const chrome = new THREE.MeshStandardMaterial({ color: 0xc4cbd0, roughness: 0.22, metalness: 0.95 });
const glass = new THREE.MeshPhysicalMaterial({
  color: 0x102c35, roughness: 0.16, metalness: 0.25,
  transmission: 0.08, transparent: true, opacity: 0.86
});
const warning = new THREE.MeshStandardMaterial({ color: 0xd93b15, roughness: 0.55 });
const groundMat = new THREE.MeshStandardMaterial({ color: 0x7b846f, roughness: 1 });

function roundedBox(w, h, d, r, material, bevelSegments = 3) {
  const shape = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  shape.moveTo(x + r, y);
  shape.lineTo(x + w - r, y);
  shape.quadraticCurveTo(x + w, y, x + w, y + r);
  shape.lineTo(x + w, y + h - r);
  shape.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  shape.lineTo(x + r, y + h);
  shape.quadraticCurveTo(x, y + h, x, y + h - r);
  shape.lineTo(x, y + r);
  shape.quadraticCurveTo(x, y, x + r, y);
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: d, bevelEnabled: true, bevelSegments,
    bevelSize: Math.min(r * 0.45, 0.08), bevelThickness: Math.min(r * 0.45, 0.08),
    curveSegments: 4
  });
  geo.translate(0, 0, -d / 2);
  return new THREE.Mesh(geo, material);
}

function box(w, h, d, material) {
  return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
}

function cylinder(radius, depth, material, radial = 24) {
  return new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, depth, radial), material);
}

function between(a, b, radius, material, radial = 20) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const mesh = cylinder(radius, direction.length(), material, radial);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function addMesh(parent, mesh, pos = [0, 0, 0], rot = [0, 0, 0]) {
  mesh.position.set(...pos);
  mesh.rotation.set(...rot);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.02;
ground.receiveShadow = true;
scene.add(ground);

const excavator = new THREE.Group();
excavator.rotation.y = -0.12;
scene.add(excavator);

const undercarriage = new THREE.Group();
excavator.add(undercarriage);

addMesh(undercarriage, roundedBox(4.35, 0.48, 2.1, 0.18, rubberEdge), [-0.45, 0.52, 0]);
addMesh(undercarriage, roundedBox(3.5, 0.3, 1.3, 0.1, steel), [-0.35, 0.9, 0]);

for (const side of [-1, 1]) {
  const z = side * 1.12;
  addMesh(undercarriage, roundedBox(4.85, 1.05, 0.54, 0.22, rubber), [-0.45, 0.66, z]);
  addMesh(undercarriage, roundedBox(4.45, 0.7, 0.11, 0.06, rubberEdge), [-0.45, 0.66, z + side * 0.29]);

  for (let i = 0; i < 12; i++) {
    const x = -2.55 + i * 0.382;
    const tread = box(0.29, 0.14, 0.1, steel);
    addMesh(undercarriage, tread, [x, 1.18, z + side * 0.31], [0, 0, 0]);
    const bottomTread = box(0.29, 0.14, 0.1, steel);
    addMesh(undercarriage, bottomTread, [x, 0.14, z + side * 0.31], [0, 0, 0]);
  }

  for (const x of [-2.35, -1.15, 0.2, 1.35]) {
    const wheel = cylinder(0.39, 0.13, rubberEdge, 32);
    addMesh(undercarriage, wheel, [x, 0.66, z + side * 0.34], [Math.PI / 2, 0, 0]);
    const hub = cylinder(0.18, 0.145, yellowDark, 24);
    addMesh(undercarriage, hub, [x, 0.66, z + side * 0.42], [Math.PI / 2, 0, 0]);
    const cap = cylinder(0.08, 0.16, steel, 20);
    addMesh(undercarriage, cap, [x, 0.66, z + side * 0.49], [Math.PI / 2, 0, 0]);
  }
}

const slew = new THREE.Group();
slew.position.set(-0.25, 1.12, 0);
excavator.add(slew);
addMesh(slew, cylinder(1.34, 0.26, yellowDark, 40), [0, 0, 0], [0, 0, 0]);
addMesh(slew, cylinder(1.12, 0.3, yellow, 40), [0, 0.22, 0]);

const house = new THREE.Group();
house.position.y = 0.38;
slew.add(house);

addMesh(house, roundedBox(2.55, 1.05, 1.85, 0.2, yellow), [-0.15, 0.45, 0]);
addMesh(house, roundedBox(1.18, 0.9, 1.58, 0.18, yellowDark), [-1.05, 0.52, 0]);
addMesh(house, roundedBox(0.9, 0.66, 1.7, 0.16, yellow), [0.77, 0.41, 0]);

const cab = new THREE.Group();
cab.position.set(-0.05, 0.95, 0);
house.add(cab);
addMesh(cab, roundedBox(1.52, 1.85, 1.52, 0.1, yellow), [0, 0.52, 0]);
addMesh(cab, box(1.1, 1.16, 1.545, glass), [0.1, 0.7, 0]);
addMesh(cab, box(1.18, 0.92, 0.08, glass), [0.1, 0.65, 0.81]);
addMesh(cab, box(1.18, 0.92, 0.08, glass), [0.1, 0.65, -0.81]);
addMesh(cab, box(0.08, 0.95, 1.12, glass), [0.77, 0.64, 0]);
addMesh(cab, box(1.62, 0.12, 1.64, yellowBright), [0, 1.47, 0]);
addMesh(cab, cylinder(0.12, 0.08, warning, 20), [-0.3, 1.58, 0.4], [Math.PI / 2, 0, 0]);
addMesh(cab, box(0.12, 0.2, 0.12, warning), [-0.3, 1.68, 0.4]);

const exhaust = cylinder(0.11, 0.72, steel, 20);
addMesh(house, exhaust, [-0.82, 1.38, -0.58]);
addMesh(house, cylinder(0.15, 0.12, rubber, 20), [-0.82, 1.76, -0.58]);

const boomPivot = new THREE.Group();
boomPivot.position.set(0.72, 2.14, 0);
excavator.add(boomPivot);

const boomAngle = 0.91;
const boomLength = 3.15;
const boom = new THREE.Group();
boom.rotation.z = boomAngle;
boomPivot.add(boom);

addMesh(boom, roundedBox(3.25, 0.42, 0.62, 0.12, yellowBright), [boomLength / 2, 0, 0]);
addMesh(boom, roundedBox(2.3, 0.18, 0.7, 0.06, yellowDark), [1.1, -0.12, 0]);
addMesh(boom, cylinder(0.28, 0.76, yellowDark, 28), [0, 0, 0], [Math.PI / 2, 0, 0]);
addMesh(boom, cylinder(0.17, 0.8, steel, 24), [boomLength, 0, 0], [Math.PI / 2, 0, 0]);

const boomEnd = new THREE.Vector3(0.72 + boomLength * Math.cos(boomAngle), 2.14 + boomLength * Math.sin(boomAngle), 0);
const stickAngle = -0.69;
const stickLength = 2.85;
const stickPivot = new THREE.Group();
stickPivot.position.set(boomLength, 0, 0);
boom.add(stickPivot);

const stick = new THREE.Group();
stick.rotation.z = stickAngle - boomAngle;
stickPivot.add(stick);
addMesh(stick, roundedBox(2.95, 0.36, 0.52, 0.1, yellowBright), [stickLength / 2, 0, 0]);
addMesh(stick, roundedBox(2.15, 0.16, 0.58, 0.05, yellowDark), [1.05, -0.11, 0]);
addMesh(stick, cylinder(0.22, 0.66, yellowDark, 28), [0, 0, 0], [Math.PI / 2, 0, 0]);
addMesh(stick, cylinder(0.16, 0.68, steel, 24), [stickLength, 0, 0], [Math.PI / 2, 0, 0]);

const stickEnd = new THREE.Vector3(
  boomEnd.x + stickLength * Math.cos(stickAngle),
  boomEnd.y + stickLength * Math.sin(stickAngle),
  0
);

const bucketPivot = new THREE.Group();
bucketPivot.position.set(stickLength, 0, 0);
stick.add(bucketPivot);
const bucketRotation = -0.58 - stickAngle;
const bucket = new THREE.Group();
bucket.rotation.z = bucketRotation;
bucketPivot.add(bucket);

const bucketShape = new THREE.Shape();
bucketShape.moveTo(-0.2, 0.08);
bucketShape.lineTo(0.95, -0.08);
bucketShape.lineTo(1.25, -0.48);
bucketShape.lineTo(1.03, -1.03);
bucketShape.lineTo(0.25, -1.19);
bucketShape.lineTo(-0.28, -0.73);
bucketShape.closePath();

const bucketGeo = new THREE.ExtrudeGeometry(bucketShape, {
  depth: 1.22, bevelEnabled: true, bevelSegments: 2,
  bevelSize: 0.035, bevelThickness: 0.04, curveSegments: 3
});
bucketGeo.translate(0, 0, -0.61);
addMesh(bucket, new THREE.Mesh(bucketGeo, yellowBright));

addMesh(bucket, box(0.82, 0.16, 1.3, yellowDark), [0.5, -0.92, 0], [0, 0, -0.18]);
for (let i = 0; i < 4; i++) {
  const tooth = box(0.38, 0.13, 0.18, steel);
  addMesh(bucket, tooth, [1.22 + i * 0.08, -0.94 - Math.abs(i - 1.5) * 0.025, -0.48 + i * 0.32], [0, 0, -0.18]);
}

function pivot(parent, position, radius = 0.23) {
  addMesh(parent, cylinder(radius, 0.78, yellowDark, 28), position, [Math.PI / 2, 0, 0]);
  addMesh(parent, cylinder(radius * 0.58, 0.84, steel, 24), position, [Math.PI / 2, 0, 0]);
}

pivot(boomPivot, [0, 0, 0], 0.3);
pivot(stickPivot, [0, 0, 0], 0.24);
pivot(bucketPivot, [0, 0, 0], 0.2);

const boomHydraulicBase = new THREE.Vector3(0.02, 2.2, -0.42);
const boomHydraulicTop = new THREE.Vector3(
  0.72 + 1.72 * Math.cos(boomAngle),
  2.14 + 1.72 * Math.sin(boomAngle),
  -0.42
);
between(boomHydraulicBase, boomHydraulicTop, 0.13, yellowDark);
between(
  new THREE.Vector3().lerpVectors(boomHydraulicBase, boomHydraulicTop, 0.46),
  new THREE.Vector3().lerpVectors(boomHydraulicBase, boomHydraulicTop, 0.92),
  0.072, chrome
);

const stickHydraulicBase = new THREE.Vector3(
  boomEnd.x - 0.38 * Math.cos(boomAngle),
  boomEnd.y - 0.38 * Math.sin(boomAngle),
  -0.38
);
const stickHydraulicTop = new THREE.Vector3(
  boomEnd.x + 1.68 * Math.cos(stickAngle),
  boomEnd.y + 1.68 * Math.sin(stickAngle),
  -0.38
);
between(stickHydraulicBase, stickHydraulicTop, 0.115, yellowDark);
between(
  new THREE.Vector3().lerpVectors(stickHydraulicBase, stickHydraulicTop, 0.42),
  new THREE.Vector3().lerpVectors(stickHydraulicBase, stickHydraulicTop, 0.93),
  0.064, chrome
);

const bucketHydraulicBase = new THREE.Vector3(
  stickEnd.x - 0.72 * Math.cos(stickAngle),
  stickEnd.y - 0.72 * Math.sin(stickAngle),
  0.38
);
const bucketHydraulicTop = new THREE.Vector3(
  stickEnd.x + 0.45 * Math.cos(-0.58),
  stickEnd.y + 0.45 * Math.sin(-0.58),
  0.38
);
between(bucketHydraulicBase, bucketHydraulicTop, 0.095, yellowDark);
between(
  new THREE.Vector3().lerpVectors(bucketHydraulicBase, bucketHydraulicTop, 0.45),
  new THREE.Vector3().lerpVectors(bucketHydraulicBase, bucketHydraulicTop, 0.94),
  0.052, chrome
);

for (let i = 0; i < 5; i++) {
  const stripe = box(0.08, 0.52, 0.02, warning);
  addMesh(cab, stripe, [-0.68 + i * 0.19, 0.64, 0.79], [0, 0, 0]);
}

const marker = cylinder(0.06, 0.28, warning, 16);
addMesh(house, marker, [-1.08, 1.12, 0.91], [Math.PI / 2, 0, 0]);

const ambientDust = new THREE.Mesh(
  new THREE.CircleGeometry(7, 64),
  new THREE.MeshBasicMaterial({ color: 0x87927e, transparent: true, opacity: 0.16 })
);
ambientDust.rotation.x = -Math.PI / 2;
ambientDust.position.set(0.8, 0.005, 0);
scene.add(ambientDust);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  controls.update();
  excavator.position.y = Math.sin(t * 1.1) * 0.008;
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
