<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Riverbank Cut</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #a9c6d1; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa9c6d1);
scene.fog = new THREE.Fog(0xa9c6d1, 28, 75);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 120);
camera.position.set(13, 9, 14);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.32;
controls.target.set(0, 1.25, 1.3);
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 7;
controls.maxDistance = 38;

scene.add(new THREE.HemisphereLight(0xdcebf0, 0x604b31, 1.8));

const sun = new THREE.DirectionalLight(0xffefd0, 3.2);
sun.position.set(-12, 20, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -20;
sun.shadow.camera.right = 20;
sun.shadow.camera.top = 22;
sun.shadow.camera.bottom = -16;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 60;
sun.shadow.bias = -0.0004;
scene.add(sun);

const rand = (() => {
  let s = 94731;
  return () => {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
})();

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const bankHeight = z => {
  const t = clamp((z + 1.1) / 5.8, 0, 1);
  const rise = 0.27 + 2.85 * Math.pow(t, 0.86);
  const irregular = t > 0.04 && t < 0.96
    ? Math.sin(z * 4.1) * 0.045 + Math.sin(z * 8.7 + 1.2) * 0.022
    : 0;
  return rise + irregular;
};

const soilMaterials = [
  new THREE.MeshStandardMaterial({ color: 0x70503a, roughness: 1 }),
  new THREE.MeshStandardMaterial({ color: 0x856043, roughness: 1 }),
  new THREE.MeshStandardMaterial({ color: 0x62452f, roughness: 1 }),
  new THREE.MeshStandardMaterial({ color: 0x987052, roughness: 1 })
];

function makeBank() {
  const nx = 42, nz = 30;
  const width = 22;
  const zMin = -1.15, zMax = 5.65;
  const positions = [];
  const uvs = [];
  const indices = [];

  for (let iz = 0; iz <= nz; iz++) {
    const z = zMin + (zMax - zMin) * iz / nz;
    for (let ix = 0; ix <= nx; ix++) {
      const x = -width / 2 + width * ix / nx;
      const edge = Math.pow(Math.abs(x) / (width / 2), 2.5);
      const local = (Math.sin(x * 1.7 + z * 2.8) + Math.sin(x * 4.5 - z * 3.3)) * 0.012;
      const y = bankHeight(z) - edge * 0.035 + local;
      positions.push(x, y, z);
      uvs.push(ix / nx, iz / nz);
    }
  }

  for (let iz = 0; iz < nz; iz++) {
    for (let ix = 0; ix < nx; ix++) {
      const a = iz * (nx + 1) + ix;
      const b = a + 1;
      const c = a + nx + 1;
      const d = c + 1;
      indices.push(a, c, b, b, c, d);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();

  const bank = new THREE.Mesh(geometry, soilMaterials[1]);
  bank.receiveShadow = true;
  bank.castShadow = true;
  scene.add(bank);

  const sideMat = new THREE.MeshStandardMaterial({ color: 0x583e2c, roughness: 1 });
  for (const x of [-11.05, 11.05]) {
    const side = new THREE.Mesh(new THREE.BoxGeometry(0.18, 1.6, 6.8), sideMat);
    side.position.set(x, 1.45, 2.25);
    side.rotation.x = (x < 0 ? -1 : 1) * 0.08;
    side.castShadow = true;
    side.receiveShadow = true;
    scene.add(side);
  }
}
makeBank();

function makeRibbon(z, width, color, offset = 0) {
  const segments = 34;
  const positions = [];
  const indices = [];
  for (let i = 0; i <= segments; i++) {
    const x = -10.85 + i * 21.7 / segments;
    const wobble = Math.sin(x * 1.65 + z * 2.2) * 0.045;
    const zz = z + wobble;
    const y = bankHeight(zz) + offset;
    positions.push(x, y, zz - width / 2, x, y + 0.008, zz + width / 2);
  }
  for (let i = 0; i < segments; i++) {
    const a = i * 2;
    indices.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  g.setIndex(indices);
  g.computeVertexNormals();
  const m = new THREE.MeshStandardMaterial({ color, roughness: 1, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(g, m);
  mesh.receiveShadow = true;
  scene.add(mesh);
}

makeRibbon(-0.62, 0.11, 0x4c3527, 0.018);
makeRibbon(0.05, 0.09, 0x9a7050, 0.012);
makeRibbon(0.72, 0.12, 0x5f422e, 0.014);
makeRibbon(1.36, 0.08, 0xaa7d58, 0.012);
makeRibbon(2.02, 0.1, 0x65452f, 0.012);
makeRibbon(2.63, 0.08, 0x9b704d, 0.012);

const waterMat = new THREE.MeshPhysicalMaterial({
  color: 0x3d8490,
  roughness: 0.12,
  metalness: 0.04,
  transmission: 0.08,
  transparent: true,
  opacity: 0.86
});
const water = new THREE.Mesh(new THREE.PlaneGeometry(30, 24), waterMat);
water.rotation.x = -Math.PI / 2;
water.position.set(0, 0.18, -7.2);
water.receiveShadow = true;
scene.add(water);

const rippleMat = new THREE.MeshBasicMaterial({
  color: 0x9bc8c5,
  transparent: true,
  opacity: 0.2,
  side: THREE.DoubleSide
});
for (let i = 0; i < 16; i++) {
  const ripple = new THREE.Mesh(new THREE.PlaneGeometry(0.8 + rand() * 2.1, 0.025 + rand() * 0.04), rippleMat);
  ripple.rotation.x = -Math.PI / 2;
  ripple.rotation.z = (rand() - 0.5) * 0.35;
  ripple.position.set(-10 + rand() * 20, 0.205 + i * 0.0002, -2.2 - rand() * 9);
  scene.add(ripple);
}

const grassMat = new THREE.MeshStandardMaterial({ color: 0x587044, roughness: 1 });
const grassDark = new THREE.MeshStandardMaterial({ color: 0x3c5534, roughness: 1 });
const grassStrip = new THREE.Mesh(new THREE.PlaneGeometry(22, 1.25), grassMat);
grassStrip.rotation.x = -Math.PI / 2;
grassStrip.position.set(0, 3.19, 5.15);
grassStrip.scale.x = 1;
grassStrip.receiveShadow = true;
scene.add(grassStrip);

for (let i = 0; i < 95; i++) {
  const x = -10.7 + rand() * 21.4;
  const z = 4.75 + rand() * 0.75;
  const blade = new THREE.Mesh(
    new THREE.ConeGeometry(0.025 + rand() * 0.025, 0.22 + rand() * 0.28, 4),
    rand() > 0.45 ? grassMat : grassDark
  );
  blade.position.set(x, 3.18 + blade.geometry.parameters.height / 2, z);
  blade.rotation.z = (rand() - 0.5) * 0.5;
  blade.castShadow = true;
  scene.add(blade);
}

function addClump(x, z, scale = 1) {
  const group = new THREE.Group();
  const stemMat = new THREE.MeshStandardMaterial({ color: 0x4f6e45, roughness: 0.8 });
  const reedMat = new THREE.MeshStandardMaterial({ color: 0x7d6239, roughness: 0.9 });
  const count = 5 + Math.floor(rand() * 4);

  for (let i = 0; i < count; i++) {
    const angle = rand() * Math.PI * 2;
    const radius = rand() * 0.32;
    const h = (1.0 + rand() * 1.15) * scale;
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.018 * scale, 0.034 * scale, h, 6), stemMat);
    stem.position.set(Math.cos(angle) * radius, h / 2, Math.sin(angle) * radius);
    stem.rotation.z = (rand() - 0.5) * 0.22;
    stem.rotation.x = (rand() - 0.5) * 0.22;
    stem.castShadow = true;
    group.add(stem);

    if (i % 2 === 0) {
      const head = new THREE.Mesh(new THREE.CylinderGeometry(0.035 * scale, 0.052 * scale, 0.23 * scale, 7), reedMat);
      head.position.copy(stem.position);
      head.position.y += h / 2 + 0.105 * scale;
      head.castShadow = true;
      group.add(head);
    }
  }
  group.position.set(x, 0.2, z);
  scene.add(group);
}

for (let i = 0; i < 17; i++) {
  addClump(-10.1 + rand() * 20.2, -0.55 + (rand() - 0.5) * 0.55, 0.82 + rand() * 0.4);
}

const rockMat = new THREE.MeshStandardMaterial({ color: 0x59483a, roughness: 1 });
for (let i = 0; i < 26; i++) {
  const x = -10.5 + rand() * 21;
  const z = -0.35 + rand() * 5.0;
  const y = bankHeight(z);
  const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.12 + rand() * 0.28, 0), rockMat);
  rock.position.set(x, y + 0.04 + rand() * 0.1, z + (rand() - 0.5) * 0.18);
  rock.scale.set(1.2, 0.55 + rand() * 0.45, 0.8);
  rock.rotation.set(rand(), rand(), rand());
  rock.castShadow = true;
  rock.receiveShadow = true;
  scene.add(rock);
}

const stakeMat = new THREE.MeshStandardMaterial({ color: 0xb5a078, roughness: 0.82 });
const capMat = new THREE.MeshStandardMaterial({ color: 0xb34d2c, roughness: 0.8 });
for (let i = 0; i < 10; i++) {
  const x = -9.6 + i * 2.12;
  const stake = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.065, 1.25, 8), stakeMat);
  stake.position.set(x, 3.78, 5.25 + Math.sin(x * 0.8) * 0.035);
  stake.rotation.z = (rand() - 0.5) * 0.025;
  stake.castShadow = true;
  scene.add(stake);

  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.12, 8), capMat);
  cap.position.set(x, 4.43, stake.position.z);
  cap.castShadow = true;
  scene.add(cap);
}

const bankEdgeMat = new THREE.MeshStandardMaterial({ color: 0x3e3025, roughness: 1 });
for (let i = 0; i < 9; i++) {
  const x = -9.7 + rand() * 19.4;
  const chunk = new THREE.Mesh(new THREE.DodecahedronGeometry(0.22 + rand() * 0.24, 0), bankEdgeMat);
  chunk.position.set(x, 0.3 + rand() * 0.45, -0.85 + rand() * 0.6);
  chunk.scale.set(1.5, 0.6, 0.8);
  chunk.rotation.set(rand(), rand(), rand());
  chunk.castShadow = true;
  scene.add(chunk);
}

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(70, 70),
  new THREE.MeshStandardMaterial({ color: 0x6e6a55, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.03;
ground.receiveShadow = true;
scene.add(ground);

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  water.material.opacity = 0.84 + Math.sin(t * 0.7) * 0.025;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
