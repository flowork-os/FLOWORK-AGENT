<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asian Night Market</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#10101d}
canvas{display:block}
#label{position:fixed;left:18px;bottom:16px;color:#ffd89c;font:600 12px/1.4 sans-serif;letter-spacing:2px;text-shadow:0 2px 8px #000;opacity:.8}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="label">NIGHT MARKET · 請慢用</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x101526, 0.018);
scene.background = new THREE.Color(0x101526);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 180);
camera.position.set(17, 12.5, 22);
camera.lookAt(0, 4.2, -7);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .055;
controls.autoRotate = true;
controls.autoRotateSpeed = .42;
controls.target.set(0, 4.5, -8);
controls.minDistance = 13;
controls.maxDistance = 38;
controls.maxPolarAngle = Math.PI * .48;

let seed = 738291;
function rnd(a=0,b=1){
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return a + (seed / 4294967296) * (b-a);
}
function pick(arr){ return arr[Math.floor(rnd(0,arr.length))]; }
function mat(color, rough=.75, emissive=0x000000, intensity=0){
  return new THREE.MeshStandardMaterial({
    color, roughness:rough, metalness:.05,
    emissive, emissiveIntensity:intensity
  });
}
function box(w,h,d,material,x=0,y=0,z=0){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; return m;
}
function cyl(r,h,material,x=0,y=0,z=0,segments=16){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,segments),material);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; return m;
}
function sphere(r,material,x=0,y=0,z=0){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,10),material);
  m.position.set(x,y,z); m.castShadow=true; return m;
}
function tube(points,r,material){
  const curve=new THREE.CatmullRomCurve3(points);
  const m=new THREE.Mesh(new THREE.TubeGeometry(curve,24,r,8,false),material);
  m.castShadow=true; return m;
}
function textTexture(text, bg='#b62b27', ink='#ffe1a3', vertical=false){
  const c=document.createElement('canvas');
  c.width=vertical?180:640; c.height=vertical?640:180;
  const x=c.getContext('2d');
  x.fillStyle=bg; x.fillRect(0,0,c.width,c.height);
  x.strokeStyle='#efb56e'; x.lineWidth=10; x.strokeRect(8,8,c.width-16,c.height-16);
  x.fillStyle=ink; x.font=`bold ${vertical?92:72}px serif`;
  x.textAlign='center'; x.textBaseline='middle';
  if(vertical){
    text.split('').forEach((ch,i)=>x.fillText(ch,c.width/2,80+i*105));
  }else x.fillText(text,c.width/2,c.height/2);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
function glowTexture(){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const x=c.getContext('2d'), g=x.createRadialGradient(64,64,2,64,64,64);
  g.addColorStop(0,'rgba(255,239,157,1)');
  g.addColorStop(.18,'rgba(255,172,45,.9)');
  g.addColorStop(.55,'rgba(255,96,15,.26)');
  g.addColorStop(1,'rgba(255,50,0,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
const glow=glowTexture();
const M={
  asphalt:mat(0x242838,.95),
  edge:mat(0x343344),
  wood:mat(0x754331),
  darkWood:mat(0x3d272a),
  red:mat(0xb73532),
  redDark:mat(0x641f2a),
  teal:mat(0x176c70),
  tealDark:mat(0x12464e),
  mustard:mat(0xd69235),
  cream:mat(0xf2dca9),
  bamboo:mat(0xb8824d),
  metal:mat(0x626777,.4),
  black:mat(0x14151c,.7),
  leaf:mat(0x3e8745),
  orange:mat(0xe56b25),
  lime:mat(0x9dbb38),
  steam:mat(0xfff1d0,.3,0xffd8a0,.15),
  bulb:mat(0xffcc65,.25,0xff9b24,3),
  lantern:mat(0xc72f27,.55,0x7c120e,.4)
};

scene.add(new THREE.HemisphereLight(0x596b9c,0x24151d,1.7));

const moon=new THREE.DirectionalLight(0x9ba9d0,2.1);
moon.position.set(-12,22,10); moon.castShadow=true;
moon.shadow.mapSize.set(2048,2048);
moon.shadow.camera.left=-25; moon.shadow.camera.right=25;
moon.shadow.camera.top=24; moon.shadow.camera.bottom=-18;
scene.add(moon);

const ground=box(42,.35,58,M.asphalt,0,-.2,-8);
scene.add(ground);

for(let i=-18;i<=18;i+=2){
  const strip=box(.045,.012,56,mat(i%4===0?0x454052:0x363443),i,.01,-8);
  scene.add(strip);
}
for(let z=18;z>-38;z-=3){
  const line=box(38,.012,.035,mat(0x424151),0,.02,z);
  scene.add(line);
}

const wall=box(42,15,.5,mat(0x171b2b),0,7,-27);
scene.add(wall);
for(let i=-18;i<=18;i+=4){
  const facade=box(3.3,10,.28,mat(i%8===0?0x25253a:0x202438),i,5,-26.7);
  scene.add(facade);
}
for(let i=-18;i<=18;i+=4){
  const window=box(1.8,2.7,.05,mat(0x7d4d39,.5,0xe67e32,1),i,7.2,-26.52);
  scene.add(window);
}

function addLantern(parent,x,y,z,s=1){
  const g=new THREE.Group(); g.position.set(x,y,z);
  const body=cyl(.42*s,.72*s,M.lantern,0,0,0,16);
  body.scale.y=1.1; g.add(body);
  g.add(sphere(.17*s,M.mustard,0,.38*s,0));
  g.add(sphere(.17*s,M.mustard,0,-.38*s,0));
  const cap=cyl(.5*s,.08*s,M.mustard,0,.43*s,0,16);
  const base=cyl(.5*s,.08*s,M.mustard,0,-.43*s,0,16);
  g.add(cap,base);
  const stripe=cyl(.44*s,.1*s,M.cream,0,.08*s,0,16); g.add(stripe);
  const cord=tube([new THREE.Vector3(0,.48*s,0),new THREE.Vector3(0,.72*s,0)],.025*s,M.black); g.add(cord);
  const light=new THREE.PointLight(0xff7d32,1.5*s,5.5*s,2); light.position.set(0,0,0); light.castShadow=true; g.add(light);
  parent.add(g); return g;
}
const lanterns=[];
for(let side of [-1,1]){
  for(let i=0;i<7;i++){
    const g=new THREE.Group();
    scene.add(g);
    const l=addLantern(g,side*(7.2+rnd(-.3,.4)),8.5+rnd(-.3,.5),-20+i*5.8+rnd(-.5,.5),.72);
    g.rotation.z=side*.08; lanterns.push({g,phase:rnd(0,6)});
  }
}

function bulb(x,y,z){
  const g=new THREE.Group(); g.position.set(x,y,z);
  g.add(sphere(.105,M.bulb,0,0,0));
  const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:glow,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
  halo.scale.set(1.5,1.5,1.5); g.add(halo);
  const l=new THREE.PointLight(0xffb33f,.7,3.3,2); g.add(l);
  return g;
}
for(let side of [-1,1]){
  const pts=[];
  for(let i=0;i<=9;i++) pts.push(new THREE.Vector3(side*(6.7),8.7,-25+i*5));
  scene.add(tube(pts,.035,M.mustard));
  for(let i=0;i<9;i++) scene.add(bulb(side*6.7,8.5,-23+i*5));
}
scene.add(tube([new THREE.Vector3(-6.9,10,-24),new THREE.Vector3(-2,11,-15),new THREE.Vector3(2,10.2,-7),new THREE.Vector3(6.9,10,-1)],.045,M.mustard));
for(let i=0;i<12;i++){
  const t=i/11, x=-6.9+13.8*t, y=10+Math.sin(t*Math.PI)*1;
  scene.add(bulb(x,y,-24+23*t));
}

function awningTexture(){
  const c=document.createElement('canvas'); c.width=512;c.height=256;
  const x=c.getContext('2d'); x.fillStyle='#f0c56f';x.fillRect(0,0,512,256);
  for(let i=0;i<8;i++){x.fillStyle=i%2?'#bd3832':'#f5d889';x.fillRect(i*64,0,64,256)}
  x.fillStyle='rgba(60,30,30,.16)';x.fillRect(0,210,512,46);
  return new THREE.CanvasTexture(c);
}
const awningMat=new THREE.MeshStandardMaterial({map:awningTexture(),side:THREE.DoubleSide,roughness:.85});

function stall(side,z,name,color){
  const g=new THREE.Group(); g.position.set(side*5.15,0,z); scene.add(g);
  const back=box(4.5,5.2,.28,mat(color),0,3,-.2); g.add(back);
  const pmat=M.wood;
  [-2.05,2.05].forEach(x=>g.add(box(.22,5.8,.25,pmat,x,2.9,.3)));
  g.add(box(4.7,.28,.8,M.wood,0,.85,.6));
  g.add(box(4.9,.18,2.9,M.darkWood,0,6.3,.25));
  const aw=new THREE.Mesh(new THREE.PlaneGeometry(5.4,2.1),awningMat);
  aw.position.set(0,6.05,1); aw.rotation.x=-Math.PI/2.15; aw.rotation.z=side<0?.03:-.03; g.add(aw);
  const sign=new THREE.Mesh(new THREE.PlaneGeometry(3.3,1),new THREE.MeshStandardMaterial({map:textTexture(name),roughness:.72}));
  sign.position.set(0,4.55,.28); g.add(sign);
  for(let i=0;i<4;i++){
    const gl=bulb(-1.5+i,5.15,1.05); gl.scale.set(.65,.65,.65); g.add(gl);
  }
  const counterLight=new THREE.PointLight(color===0x1a625e?0x63d7bd:0xff7230,2.3,7,2);
  counterLight.position.set(0,3,1.3); counterLight.castShadow=true; g.add(counterLight);
  return g;
}
const stalls=[];
stalls.push(stall(-1,-20,'麵 · NOODLES',0x8e3534));
stalls.push(stall(1,-20,'串 · SKEWERS',0x195d63));
stalls.push(stall(-1,-12,'茶 · TEA',0x9b552c));
stalls.push(stall(1,-12,'餃子 · GYOZA',0x315c3f));
stalls.push(stall(-1,-4,'果 · FRUIT',0x8b3742));
stalls.push(stall(1,-4,'燒 · GRILL',0x175765));

function stool(x,z){
  const g=new THREE.Group(); g.position.set(x,.05,z);
  g.add(cyl(.42,.12,M.wood,0,.58,0,12));
  for(let a=0;a<4;a++){const q=a*Math.PI/2;g.add(box(.09,.65,.09,M.darkWood,Math.cos(q)*.27,.3,Math.sin(q)*.27));}
  return g;
}
function table(x,z){
  const g=new THREE.Group();g.position.set(x,0,z);
  g.add(box(1.9,.13,1.05,M.wood,0,1.05,0));
  for(let sx of [-.7,.7])for(let sz of [-.32,.32])g.add(box(.1,1,.1,M.darkWood,sx,.5,sz));
  return g;
}
for(let i=0;i<7;i++){
  const x=sideX(i%2), z=-19+i*2.55;
  table(x,z); stool(x-1.3,z+.25); stool(x+1.3,z-.25);
}
function sideX(i){return i%2?-1.1:1.1}

function crate(x,y,z,color){
  const g=new THREE.Group();g.position.set(x,y,z);
  g.add(box(.8,.7,.8,M.wood));
  for(let a=-.28;a<=.28;a+=.56){
    g.add(box(.09,.74,.84,mat(color),a,0,0));
    g.add(box(.84,.74,.09,mat(color),0,0,a));
  }
  return g;
}
for(let i=0;i<12;i++){
  const side=i%2?-1:1, z=-21+rnd(0,18);
  const c=crate(side*(4.1+rnd(.1,.9)),.4,z,pick([M.orange,M.lime,M.red,M.mustard]));
  scene.add(c);
  scene.add(sphere(.16,pick([M.orange,M.lime,M.red,M.mustard]),c.position.x+rnd(-.2,.2),1.03,z+rnd(-.2,.2)));
}

function steamer(x,z){
  const g=new THREE.Group();g.position.set(x,0,z);
  for(let i=0;i<3;i++)g.add(cyl(.55,.24,M.bamboo,0,1.22+i*.23,0,20));
  g.add(cyl(.62,.08,M.darkWood,0,1.9,0,20));
  g.add(sphere(.35,M.cream,0,2.02,0));
  scene.add(g);
}
steamer(-4.4,-19.2); steamer(4.5,-19.2); steamer(-4.4,-11.3); steamer(4.45,-11.3);

function skewer(x,z){
  const g=new THREE.Group();g.position.set(x,1.05,z);
  const stick=cyl(.025,1.4,M.bamboo,0,.7,0,8); g.add(stick);
  for(let i=0;i<4;i++)g.add(sphere(.13,pick([M.orange,M.red,M.mustard]),0,.23+i*.27,0));
  scene.add(g);
}
for(let i=0;i<12;i++)skewer(i%2?-4.1:4.1,-20+rnd(0,4));

const steamGroup=[];
function steam(x,z){
  const g=new THREE.Group();g.position.set(x,2.2,z);
  for(let i=0;i<4;i++){
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glow,transparent:true,opacity:.14,color:0xffead2,depthWrite:false}));
    s.scale.set(.65,.9,.65);s.position.set(rnd(-.3,.3),i*.55,rnd(-.15,.15));g.add(s);
  }
  scene.add(g);steamGroup.push({g,phase:rnd(0,5)});
}
steam(-4.4,-19.2);steam(4.5,-19.2);steam(-4.4,-11.3);steam(4.45,-11.3);

function bicycle(x,z,flip=1){
  const g=new THREE.Group();g.position.set(x,.05,z);g.scale.x=flip;
  const wheelMat=new THREE.MeshBasicMaterial({color:0x252735});
  for(let wx of [-.72,.72]){
    const w=new THREE.Mesh(new THREE.TorusGeometry(.48,.065,8,20),wheelMat);
    w.rotation.y=Math.PI/2;w.position.set(wx,.55,0);g.add(w);
    g.add(cyl(.025,.95,M.metal,wx,.55,0,8));
  }
  g.add(tube([new THREE.Vector3(-.72,.55,0),new THREE.Vector3(0,1.15,0),new THREE.Vector3(.72,.55,0),new THREE.Vector3(0,.55,0),new THREE.Vector3(-.25,.25,0)],.055,M.metal));
  g.add(tube([new THREE.Vector3(.72,.55,0),new THREE.Vector3(1.05,1.24,0),new THREE.Vector3(1.28,1.28,0)],.05,M.metal));
  g.add(box(1.45,.12,.85,M.red,.05,1.35,0));
  g.add(box(1.45,.1,.85,M.cream,.05,1.48,0));
  for(let i=0;i<4;i++)g.add(sphere(.13,pick([M.orange,M.lime,M.red]),-.45+i*.3,1.62,rnd(-.2,.2)));
  scene.add(g);
}
bicycle(-3.1,-1,1); bicycle(3.1,-7,-1);

function roofSign(x,z,text,color){
  const g=new THREE.Group();g.position.set(x,0,z);
  g.add(box(2.7,.18,.16,M.darkWood,0,5.5,0));
  const p=new THREE.Mesh(new THREE.PlaneGeometry(2.3,1.05),new THREE.MeshStandardMaterial({map:textTexture(text,color,'#ffe7a4'),roughness:.7}));
  p.position.set(0,5.95,.1);g.add(p);
  scene.add(g);
}
roofSign(-4.9,-18,'火 HOT', '#8e302a');
roofSign(4.9,-18,'香香', '#17666a');
roofSign(-4.9,-10,'茶 TEA', '#98552c');
roofSign(4.9,-10,'餃子', '#39704c');

function paperFan(x,y,z,rot){
  const shape=new THREE.Shape();
  shape.moveTo(-.7,0);shape.quadraticCurveTo(0,1.2,.7,0);shape.lineTo(-.7,0);
  const m=new THREE.Mesh(new THREE.ShapeGeometry(shape),new THREE.MeshStandardMaterial({color:pick([0xd84a36,0xe6b34f,0x3d8d88]),side:THREE.DoubleSide}));
  m.position.set(x,y,z);m.rotation.set(-.15,rot,0);m.scale.set(.75,.75,.75);scene.add(m);
}
for(let i=0;i<8;i++)paperFan(-6.6+rnd(0,13),7.2,-24+rnd(0,20),rnd(-.5,.5));

function pole(x,z,h=5){
  scene.add(cyl(.09,h,M.bamboo,x,h/2,z,10));
  scene.add(sphere(.16,M.mustard,x,h+.12,z));
}
pole(-7,-22,8);pole(7,-22,8);pole(-7,-8,8);pole(7,-8,8);

for(let i=0;i<18;i++){
  const side=i%2?-1:1;
  const x=side*(5.8+rnd(0,1.3)), z=-24+rnd(0,22);
  const bag=cyl(.22,.5,pick([M.red,M.teal,M.mustard]),x,1.35,z,12);
  bag.rotation.z=rnd(-.2,.2);scene.add(bag);
}

const timeClock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=timeClock.getElapsedTime();
  lanterns.forEach((o,i)=>{
    o.g.rotation.z=Math.sin(t*1.25+o.phase)*.055;
    o.g.position.y+=Math.sin(t*1.1+o.phase)*.0008;
  });
  steamGroup.forEach((o,i)=>{
    o.g.position.y=2.1+Math.sin(t*.8+o.phase)*.12;
    o.g.rotation.y=Math.sin(t*.7+o.phase)*.25;
    o.g.children.forEach((s,j)=>{
      s.position.x=Math.sin(t*.75+o.phase+j)*.18;
      s.material.opacity=.1+.05*Math.sin(t*1.2+o.phase+j);
      s.scale.setScalar(.65+j*.07+Math.sin(t+j)*.08);
    });
  });
  controls.update();
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
animate();
</script>
</body>
</html>
