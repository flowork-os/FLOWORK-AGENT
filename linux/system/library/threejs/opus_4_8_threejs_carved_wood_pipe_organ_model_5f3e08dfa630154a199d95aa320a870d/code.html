<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carved Wood Zither</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #17151a; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    color: #c9b79a; font: 12px/1.5 "Georgia", serif; letter-spacing: .08em;
    opacity: .55; pointer-events: none; user-select: none; text-align: center;
  }
</style>
</head>
<body>
<div id="hint">CARVED WALNUT ZITHER &mdash; drag to orbit &middot; scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------ *
 *  Renderer / Scene / Camera
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x191619);
scene.fog = new THREE.Fog(0x191619, 2.4, 7.0);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.05, 100);
camera.position.set(0.95, 0.72, 1.15);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.target.set(0, 0.045, 0);
controls.minDistance = 0.55;
controls.maxDistance = 3.6;
controls.maxPolarAngle = Math.PI * 0.495;

/* ------------------------------------------------------------------ *
 *  Procedural wood grain textures (canvas based, no external assets)
 * ------------------------------------------------------------------ */

// Small deterministic value-noise helpers
function makeRng(seed) {
  let s = seed >>> 0;
  return function () {
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5;  s >>>= 0;
    return s / 4294967296;
  };
}

const permRng = makeRng(20260721);
const perm = new Uint8Array(512);
{
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(permRng() * (i + 1));
    const t = p[i]; p[i] = p[j]; p[j] = t;
  }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
}
function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
function lerp(a, b, t) { return a + (b - a) * t; }
function grad2(hash, x, y) {
  switch (hash & 7) {
    case 0: return  x + y;
    case 1: return  x - y;
    case 2: return -x + y;
    case 3: return -x - y;
    case 4: return  x;
    case 5: return -x;
    case 6: return  y;
    default: return -y;
  }
}
function pnoise(x, y) {
  const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
  const xf = x - Math.floor(x), yf = y - Math.floor(y);
  const u = fade(xf), v = fade(yf);
  const aa = perm[perm[X] + Y], ab = perm[perm[X] + Y + 1];
  const ba = perm[perm[X + 1] + Y], bb = perm[perm[X + 1] + Y + 1];
  const x1 = lerp(grad2(aa, xf, yf), grad2(ba, xf - 1, yf), u);
  const x2 = lerp(grad2(ab, xf, yf - 1), grad2(bb, xf - 1, yf - 1), u);
  return lerp(x1, x2, v); // roughly [-1,1]
}
function fbm(x, y, oct = 4, gain = 0.5, lac = 2.0) {
  let a = 0.5, f = 1.0, sum = 0;
  for (let i = 0; i < oct; i++) { sum += a * pnoise(x * f, y * f); f *= lac; a *= gain; }
  return sum;
}

/**
 * Walnut grain: bands sweeping lengthwise (along U) with cathedral figure,
 * plus fine pore streaks. Returns { map, roughnessMap, bumpMap }.
 */
function makeWalnutTextures(w, h, opts) {
  const o = Object.assign({
    bandFreq: 26.0,     // number of grain lines across V
    sweep: 2.2,         // how much the grain arcs lengthwise
    warp: 0.55,
    poreStrength: 0.5,
    base: [0x5a, 0x36, 0x1e],
    dark: [0x24, 0x12, 0x08],
    light: [0x9c, 0x6c, 0x40],
    seedOff: 0.0
  }, opts || {});

  const cA = document.createElement('canvas'); cA.width = w; cA.height = h;
  const cR = document.createElement('canvas'); cR.width = w; cR.height = h;
  const cB = document.createElement('canvas'); cB.width = w; cB.height = h;
  const gA = cA.getContext('2d'), gR = cR.getContext('2d'), gB = cB.getContext('2d');
  const iA = gA.createImageData(w, h), iR = gR.createImageData(w, h), iB = gB.createImageData(w, h);
  const dA = iA.data, dR = iR.data, dB = iB.data;

  for (let y = 0; y < h; y++) {
    const v = y / h;
    for (let x = 0; x < w; x++) {
      const u = x / w;

      // Warp coordinates so grain flows lengthwise and arcs gently
      const wx = u * 3.0 + o.seedOff;
      const wy = v * 3.0 + o.seedOff * 0.5;
      const n1 = fbm(wx * 1.3, wy * 4.5, 4);
      const n2 = fbm(wx * 2.7 + 11.3, wy * 9.0 + 4.1, 3);

      // Distance field that produces long cathedral arcs along the length
      let t = v + o.sweep * 0.035 * Math.cos(u * Math.PI * 1.15) + o.warp * 0.055 * n1;
      let bands = Math.sin(t * o.bandFreq * Math.PI * 2.0 * 0.5 + n2 * 0.9);
      bands = Math.pow(Math.abs(bands), 0.55);

      // fine pores: short dashes strictly along U
      const pore = fbm(u * 260.0 + o.seedOff * 30.0, v * 26.0, 2);
      const poreMask = Math.max(0, pore) * o.poreStrength;

      // blotchy medullary figure
      const blotch = fbm(wx * 0.8 + 30.0, wy * 1.1 + 7.0, 3) * 0.5 + 0.5;

      let k = bands * 0.72 + poreMask * 0.5;
      k = Math.min(1, Math.max(0, k));

      // color mix dark <-> base <-> light
      let r, g, b;
      if (k < 0.5) {
        const m = k / 0.5;
        r = lerp(o.dark[0], o.base[0], m);
        g = lerp(o.dark[1], o.base[1], m);
        b = lerp(o.dark[2], o.base[2], m);
      } else {
        const m = (k - 0.5) / 0.5;
        r = lerp(o.base[0], o.light[0], m);
        g = lerp(o.base[1], o.light[1], m);
        b = lerp(o.base[2], o.light[2], m);
      }
      const bl = 0.86 + blotch * 0.30;
      r = Math.min(255, r * bl); g = Math.min(255, g * bl); b = Math.min(255, b * bl);

      const i = (y * w + x) * 4;
      dA[i] = r; dA[i + 1] = g; dA[i + 2] = b; dA[i + 3] = 255;

      // roughness: pores and dark grain slightly rougher under oil finish
      let rough = 0.30 + (1.0 - k) * 0.26 + poreMask * 0.22 + (blotch - 0.5) * 0.06;
      rough = Math.min(0.92, Math.max(0.12, rough));
      const rv = rough * 255;
      dR[i] = rv; dR[i + 1] = rv; dR[i + 2] = rv; dR[i + 3] = 255;

      // bump: open pores sit slightly below the surface
      let bump = 0.55 + (k - 0.5) * 0.35 - poreMask * 0.35;
      bump = Math.min(1, Math.max(0, bump));
      const bv = bump * 255;
      dB[i] = bv; dB[i + 1] = bv; dB[i + 2] = bv; dB[i + 3] = 255;
    }
  }
  gA.putImageData(iA, 0, 0);
  gR.putImageData(iR, 0, 0);
  gB.putImageData(iB, 0, 0);

  const map = new THREE.CanvasTexture(cA);
  map.colorSpace = THREE.SRGBColorSpace;
  const roughnessMap = new THREE.CanvasTexture(cR);
  const bumpMap = new THREE.CanvasTexture(cB);
  for (const t of [map, roughnessMap, bumpMap]) {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  }
  return { map, roughnessMap, bumpMap };
}

const woodTop  = makeWalnutTextures(1024, 512, { bandFreq: 30, sweep: 2.4, seedOff: 0.0 });
const woodSide = makeWalnutTextures(512, 256,  { bandFreq: 18, sweep: 0.6, seedOff: 3.7, poreStrength: 0.35 });

/* ------------------------------------------------------------------ *
 *  Materials
 * ------------------------------------------------------------------ */
const matSoundboard = new THREE.MeshPhysicalMaterial({
  map: woodTop.map,
  roughnessMap: woodTop.roughnessMap,
  bumpMap: woodTop.bumpMap,
  bumpScale: 0.0016,
  color: 0xffffff,
  roughness: 0.42,
  metalness: 0.0,
  clearcoat: 0.55,
  clearcoatRoughness: 0.35,
  sheen: 0.18,
  sheenColor: new THREE.Color(0xffcf9a),
  sheenRoughness: 0.7
});

const matBody = new THREE.MeshPhysicalMaterial({
  map: woodSide.map,
  roughnessMap: woodSide.roughnessMap,
  bumpMap: woodSide.bumpMap,
  bumpScale: 0.0014,
  color: 0xe8ddd4,
  roughness: 0.5,
  metalness: 0.0,
  clearcoat: 0.4,
  clearcoatRoughness: 0.45
});

const matBodyDark = matBody.clone();
matBodyDark.color = new THREE.Color(0xbfa993);

const matBone = new THREE.MeshPhysicalMaterial({
  color: 0xefe4cf,
  roughness: 0.34,
  metalness: 0.0,
  clearcoat: 0.35,
  clearcoatRoughness: 0.4,
  sheen: 0.3,
  sheenColor: new THREE.Color(0xfff2dd)
});

const matEbony = new THREE.MeshPhysicalMaterial({
  color: 0x241a15,
  roughness: 0.38,
  metalness: 0.0,
  clearcoat: 0.5,
  clearcoatRoughness: 0.3
});

const matString = new THREE.MeshStandardMaterial({
  color: 0xc9b78a,
  roughness: 0.28,
  metalness: 0.85
});

const matStringBass = new THREE.MeshStandardMaterial({
  color: 0x9a8567,
  roughness: 0.45,
  metalness: 0.7
});

const matBrass = new THREE.MeshStandardMaterial({
  color: 0xb5883f,
  roughness: 0.3,
  metalness: 0.95
});

/* ------------------------------------------------------------------ *
 *  Zither geometry
 *  Dimensions (metres): ~0.60 long, 0.36 wide at bass end, 0.20 at
 *  treble end, ~0.045 deep.  Single object group, centred at origin.
 * ------------------------------------------------------------------ */
const zither = new THREE.Group();

const L = 0.60;          // length along X
const W_WIDE = 0.360;    // width at -X end (bass / wide)
const W_NARR = 0.200;    // width at +X end (narrow, tuning pins)
const DEPTH = 0.046;     // body depth
const HALF_L = L / 2;

// Outline of the trapezoid in the XZ plane at a given fractional inset.
// x from -HALF_L (wide) to +HALF_L (narrow)
function halfWidthAt(x) {
  const t = (x + HALF_L) / L;              // 0 at wide end .. 1 at narrow end
  const base = lerp(W_WIDE, W_NARR, t) * 0.5;
  // slight convex bow on the long rails for a hand-carved feel
  const bow = Math.sin(t * Math.PI) * 0.007;
  return base + bow;
}

/* ---------- Chisel-faceted body shell -------------------------------
 * Build as a lofted set of rings: each ring is the trapezoid outline
 * scaled/offset by a rounded-edge profile, producing visible facets
 * because we use flat shading with a modest number of profile steps.
 * ------------------------------------------------------------------ */

// Perimeter samples of the trapezoid outline (counter-clockwise seen from +Y)
function outlinePoints(segLong, segEnd) {
  const pts = [];
  // narrow end (+X) from -z to +z
  for (let i = 0; i < segEnd; i++) {
    const t = i / segEnd;
    const x = HALF_L;
    const hw = halfWidthAt(x);
    pts.push(new THREE.Vector2(x, lerp(-hw, hw, t)));
  }
  // +z rail: narrow -> wide
  for (let i = 0; i < segLong; i++) {
    const t = i / segLong;
    const x = lerp(HALF_L, -HALF_L, t);
    pts.push(new THREE.Vector2(x, halfWidthAt(x)));
  }
  // wide end (-X) from +z to -z
  for (let i = 0; i < segEnd; i++) {
    const t = i / segEnd;
    const x = -HALF_L;
    const hw = halfWidthAt(x);
    pts.push(new THREE.Vector2(x, lerp(hw, -hw, t)));
  }
  // -z rail: wide -> narrow
  for (let i = 0; i < segLong; i++) {
    const t = i / segLong;
    const x = lerp(-HALF_L, HALF_L, t);
    pts.push(new THREE.Vector2(x, -halfWidthAt(x)));
  }
  return pts;
}

const SEG_LONG = 96;
const SEG_END = 20;
const OUTLINE = outlinePoints(SEG_LONG, SEG_END);
const NP = OUTLINE.length;

// Outward 2D normals of the outline (for inset)
const OUT_NORMALS = [];
for (let i = 0; i < NP; i++) {
  const p0 = OUTLINE[(i - 1 + NP) % NP];
  const p1 = OUTLINE[(i + 1) % NP];
  const tx = p1.x - p0.x, tz = p1.y - p0.y;
  const len = Math.hypot(tx, tz) || 1;
  // outward normal for CCW winding in (x, z) with y up: (tz, -tx) normalised
  OUT_NORMALS.push(new THREE.Vector2(tz / len, -tx / len));
}

/**
 * Loft a closed tube from a profile: array of {inset, y} pairs.
 * Flat-shaded to keep chisel facets crisp.
 */
function buildLoft(profile, opts) {
  const o = Object.assign({ capTop: false, capBottom: false, uvScaleU: 1, uvScaleV: 1 }, opts);
  const rings = profile.length;
  const positions = [];
  const uvs = [];
  const indices = [];

  const ringPts = [];
  for (let r = 0; r < rings; r++) {
    const { inset, y } = profile[r];
    const ring = [];
    for (let i = 0; i < NP; i++) {
      const p = OUTLINE[i], n = OUT_NORMALS[i];
      ring.push(new THREE.Vector3(p.x - n.x * inset, y, p.y - n.y * inset));
    }
    ringPts.push(ring);
  }

  for (let r = 0; r < rings; r++) {
    for (let i = 0; i < NP; i++) {
      const p = ringPts[r][i];
      positions.push(p.x, p.y, p.z);
      uvs.push((i / NP) * o.uvScaleU, (r / Math.max(1, rings - 1)) * o.uvScaleV);
    }
  }
  for (let r = 0; r < rings - 1; r++) {
    for (let i = 0; i < NP; i++) {
      const a = r * NP + i;
      const b = r * NP + ((i + 1) % NP);
      const c = (r + 1) * NP + i;
      const d = (r + 1) * NP + ((i + 1) % NP);
      indices.push(a, c, b);
      indices.push(b, c, d);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

// Profile: rounded, chisel-faceted edge going from the top plane, down the
// side, and under to the back. Few steps => visible facets.
const TOP_Y = DEPTH * 0.5;
const BOT_Y = -DEPTH * 0.5;

function chiselProfile() {
  const prof = [];
  const steps = 6;                       // few facets on purpose
  const roundR = 0.013;                  // radius of the rounded edge
  // top face inner edge -> rounded top corner
  prof.push({ inset: roundR + 0.004, y: TOP_Y });
  for (let i = 1; i <= steps; i++) {
    const a = (i / steps) * (Math.PI * 0.5);
    // small irregularity so facets read as hand-cut
    const jitter = (pnoise(i * 3.13, 0.7) * 0.0009);
    prof.push({
      inset: roundR * (1 - Math.sin(a)) + jitter,
      y: TOP_Y - roundR * (1 - Math.cos(a)) + jitter * 0.5
    });
  }
  // straight side wall (slight inward taper towards the back)
  prof.push({ inset: 0.0000, y: TOP_Y - roundR - 0.004 });
  prof.push({ inset: 0.0015, y: BOT_Y + roundR + 0.002 });
  // rounded bottom corner
  for (let i = 1; i <= steps; i++) {
    const a = (i / steps) * (Math.PI * 0.5);
    const jitter = (pnoise(i * 5.71 + 20.0, 1.9) * 0.0007);
    prof.push({
      inset: 0.0015 + roundR * (1 - Math.cos(a)) + jitter,
      y: BOT_Y + roundR * (1 - Math.sin(a)) - jitter * 0.4
    });
  }
  prof.push({ inset: roundR + 0.006, y: BOT_Y });
  return prof;
}

const shellGeo = buildLoft(chiselProfile(), { uvScaleU: 5.0, uvScaleV: 1.0 });
const shell = new THREE.Mesh(shellGeo, matBody);
shell.castShadow = true;
shell.receiveShadow = true;
zither.add(shell);

/* ---------- Soundboard (top plate) with knotwork rosette ------------ */

// Soundhole centre & radius
const HOLE_C = new THREE.Vector2(-0.045, 0.0);   // slightly toward the wide end
const HOLE_R = 0.062;

function soundboardShape() {
  const inset = 0.017;      // matches profile top inner edge
  const shape = new THREE.Shape();
  for (let i = 0; i < NP; i++) {
    const p = OUTLINE[i], n = OUT_NORMALS[i];
    const x = p.x - n.x * inset;
    const z = p.y - n.y * inset;
    if (i === 0) shape.moveTo(x, z); else shape.lineTo(x, z);
  }
  shape.closePath();

  const hole = new THREE.Path();
  const segs = 128;
  for (let i = 0; i <= segs; i++) {
    const a = (i / segs) * Math.PI * 2;
    // scalloped rim like a chiselled rosette opening
    const rr = HOLE_R * (1 + 0.035 * Math.sin(a * 12));
    const x = HOLE_C.x + Math.cos(a) * rr;
    const z = HOLE_C.y + Math.sin(a) * rr;
    if (i === 0) hole.moveTo(x, z); else hole.lineTo(x, z);
  }
  hole.closePath();
  shape.holes.push(hole);
  return shape;
}

const sbGeo = new THREE.ExtrudeGeometry(soundboardShape(), {
  depth: 0.006,
  bevelEnabled: true,
  bevelThickness: 0.0022,
  bevelSize: 0.0026,
  bevelSegments: 3,
  curveSegments: 8
});
// Shape lives in XY; rotate so it lies in XZ with thickness along Y.
sbGeo.rotateX(Math.PI / 2);
sbGeo.translate(0, TOP_Y + 0.0005, 0);
// Planar UVs so the grain sweeps lengthwise
{
  const pos = sbGeo.attributes.position;
  const uv = new Float32Array(pos.count * 2);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    uv[i * 2] = (x + HALF_L) / L;
    uv[i * 2 + 1] = (z + W_WIDE * 0.5) / W_WIDE;
  }
  sbGeo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  sbGeo.computeVertexNormals();
}
const soundboard = new THREE.Mesh(sbGeo, matSoundboard);
soundboard.castShadow = true;
soundboard.receiveShadow = true;
zither.add(soundboard);

/* ---------- Back plate --------------------------------------------- */
{
  const backShape = new THREE.Shape();
  const inset = 0.019;
  for (let i = 0; i < NP; i++) {
    const p = OUTLINE[i], n = OUT_NORMALS[i];
    const x = p.x - n.x * inset, z = p.y - n.y * inset;
    if (i === 0) backShape.moveTo(x, z); else backShape.lineTo(x, z);
  }
  backShape.closePath();
  const bg = new THREE.ExtrudeGeometry(backShape, {
    depth: 0.005, bevelEnabled: true, bevelThickness: 0.0018,
    bevelSize: 0.002, bevelSegments: 2, curveSegments: 6
  });
  bg.rotateX(Math.PI / 2);
  bg.translate(0, BOT_Y + 0.0055, 0);
  const pos = bg.attributes.position;
  const uv = new Float32Array(pos.count * 2);
  for (let i = 0; i < pos.count; i++) {
    uv[i * 2] = (pos.getX(i) + HALF_L) / L;
    uv[i * 2 + 1] = (pos.getZ(i) + W_WIDE * 0.5) / W_WIDE;
  }
  bg.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  bg.computeVertexNormals();
  const back = new THREE.Mesh(bg, matBodyDark);
  back.castShadow = true;
  back.receiveShadow = true;
  zither.add(back);
}

/* ---------- Dark cavity liner (so the hole reads as a void) --------- */
{
  const cav = new THREE.Mesh(
    new THREE.CylinderGeometry(HOLE_R * 1.35, HOLE_R * 1.35, DEPTH * 0.92, 48, 1, true),
    new THREE.MeshStandardMaterial({ color: 0x140d08, roughness: 0.95, metalness: 0.0, side: THREE.BackSide })
  );
  cav.position.set(HOLE_C.x, 0, HOLE_C.y);
  zither.add(cav);
  const cavFloor = new THREE.Mesh(
    new THREE.CircleGeometry(HOLE_R * 1.35, 48),
    new THREE.MeshStandardMaterial({ color: 0x1a1109, roughness: 0.95 })
  );
  cavFloor.rotation.x = -Math.PI / 2;
  cavFloor.position.set(HOLE_C.x, BOT_Y + 0.0085, HOLE_C.y);
  zither.add(cavFloor);
}

/* ---------- Interlaced knotwork rosette ----------------------------- *
 * Built from tube segments woven over/under: three concentric bands of
 * arcs whose radius oscillates, phase-shifted, so strands cross and the
 * over/under alternation is expressed as a small Y offset.
 * ------------------------------------------------------------------ */
function knotStrandCurve(baseR, amp, lobes, phase, weaveAmp, yBase) {
  const pts = [];
  const N = 320;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const a = t * Math.PI * 2;
    const r = baseR + amp * Math.sin(a * lobes + phase);
    // over/under weave: y wobbles at twice the crossing rate
    const y = yBase + weaveAmp * Math.sin(a * lobes * 2 + phase * 2 + Math.PI * 0.5);
    pts.push(new THREE.Vector3(
      HOLE_C.x + Math.cos(a) * r,
      y,
      HOLE_C.y + Math.sin(a) * r
    ));
  }
  return new THREE.CatmullRomCurve3(pts, true, 'centripetal', 0.5);
}

const rosette = new THREE.Group();
{
  const strandR = 0.0032;
  const yBase = TOP_Y - 0.0015;
  const configs = [
    { baseR: HOLE_R * 0.62, amp: HOLE_R * 0.20, lobes: 6, phase: 0.0 },
    { baseR: HOLE_R * 0.62, amp: HOLE_R * 0.20, lobes: 6, phase: Math.PI / 3 },
    { baseR: HOLE_R * 0.62, amp: HOLE_R * 0.20, lobes: 6, phase: (2 * Math.PI) / 3 },
    { baseR: HOLE_R * 0.34, amp: HOLE_R * 0.13, lobes: 8, phase: 0.4 },
    { baseR: HOLE_R * 0.34, amp: HOLE_R * 0.13, lobes: 8, phase: 0.4 + Math.PI / 4 }
  ];
  for (const c of configs) {
    const curve = knotStrandCurve(c.baseR, c.amp, c.lobes, c.phase, 0.0026, yBase);
    const g = new THREE.TubeGeometry(curve, 420, strandR, 8, true);
    const m = new THREE.Mesh(g, matEbony);
    m.castShadow = true;
    m.receiveShadow = true;
    rosette.add(m);
  }
  // Outer retaining ring of the rosette, chiselled bead
  const ringCurvePts = [];
  for (let i = 0; i <= 200; i++) {
    const a = (i / 200) * Math.PI * 2;
    const rr = HOLE_R * 0.97;
    ringCurvePts.push(new THREE.Vector3(HOLE_C.x + Math.cos(a) * rr, yBase, HOLE_C.y + Math.sin(a) * rr));
  }
  const ringCurve = new THREE.CatmullRomCurve3(ringCurvePts, true, 'centripetal', 0.5);
  const ring = new THREE.Mesh(new THREE.TubeGeometry(ringCurve, 260, 0.0038, 8, true), matEbony);
  ring.castShadow = true; ring.receiveShadow = true;
  rosette.add(ring);

  // Inner boss: a small carved medallion at the centre
  const boss = new THREE.Mesh(
    new THREE.SphereGeometry(0.0075, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.5),
    matBone
  );
  boss.position.set(HOLE_C.x, yBase - 0.0006, HOLE_C.y);
  boss.castShadow = true;
  rosette.add(boss);

  // Petal spokes radiating from the boss (shallow relief)
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    const petal = new THREE.Mesh(
      new THREE.BoxGeometry(HOLE_R * 0.26, 0.0028, 0.0035),
      matEbony
    );
    const rr = HOLE_R * 0.20;
    petal.position.set(
      HOLE_C.x + Math.cos(a) * rr,
      yBase - 0.0018,
      HOLE_C.y + Math.sin(a) * rr
    );
    petal.rotation.y = -a;
    petal.castShadow = true;
    rosette.add(petal);
  }
}
zither.add(rosette);

/* ---------- Carved vine relief along the long rails ----------------- *
 * Sinuous tube following the rail, with leaves and tendrils. Shallow
 * ridges sit just proud of the soundboard so raking light catches them.
 * ------------------------------------------------------------------ */
function railPath(side, offsetIn) {
  // side = +1 (+z rail) or -1 (-z rail)
  const pts = [];
  const N = 140;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const x = lerp(-HALF_L + 0.030, HALF_L - 0.030, t);
    const hw = halfWidthAt(x) - offsetIn;
    const wob = Math.sin(t * Math.PI * 9.0) * 0.0075;
    pts.push(new THREE.Vector3(x, TOP_Y + 0.0018, side * (hw + wob * 0.55)));
  }
  return new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.5);
}

function makeLeaf(size) {
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.bezierCurveTo(size * 0.55, size * 0.30, size * 0.95, size * 0.42, size * 1.35, 0);
  s.bezierCurveTo(size * 0.95, -size * 0.42, size * 0.55, -size * 0.30, 0, 0);
  const g = new THREE.ExtrudeGeometry(s, {
    depth: size * 0.10, bevelEnabled: true,
    bevelThickness: size * 0.05, bevelSize: size * 0.06,
    bevelSegments: 2, curveSegments: 8
  });
  g.rotateX(-Math.PI / 2);
  g.computeVertexNormals();
  return g;
}

const leafGeoBig = makeLeaf(0.016);
const leafGeoSmall = makeLeaf(0.011);

const vines = new THREE.Group();
for (const side of [1, -1]) {
  const curve = railPath(side, 0.0135);
  const vine = new THREE.Mesh(new THREE.TubeGeometry(curve, 400, 0.0026, 7, false), matBody);
  vine.castShadow = true;
  vine.receiveShadow = true;
  vines.add(vine);

  // secondary thinner strand twining around the first
  const pts2 = [];
  for (let i = 0; i <= 160; i++) {
    const t = i / 160;
    const p = curve.getPoint(t);
    const off = Math.sin(t * Math.PI * 22.0) * 0.0055;
    pts2.push(new THREE.Vector3(p.x, TOP_Y + 0.0016 + Math.abs(Math.cos(t * Math.PI * 22.0)) * 0.0008, p.z - side * off));
  }
  const c2 = new THREE.CatmullRomCurve3(pts2, false, 'centripetal', 0.5);
  const vine2 = new THREE.Mesh(new THREE.TubeGeometry(c2, 360, 0.0017, 6, false), matBody);
  vine2.castShadow = true; vine2.receiveShadow = true;
  vines.add(vine2);

  // leaves & tendrils
  const LEAVES = 22;
  for (let i = 0; i < LEAVES; i++) {
    const t = (i + 0.5) / LEAVES;
    const p = curve.getPoint(t);
    const tan = curve.getTangent(t);
    const big = (i % 3 !== 1);
    const leaf = new THREE.Mesh(big ? leafGeoBig : leafGeoSmall, matBody);
    const inward = (i % 2 === 0) ? -side : side;
    const baseAng = Math.atan2(tan.z, tan.x);
    leaf.position.set(p.x, TOP_Y + 0.0014, p.z);
    leaf.rotation.y = -baseAng + (inward === -side ? -0.85 : 0.85) * side;
    leaf.rotation.z = 0.0;
    leaf.scale.setScalar(0.85 + 0.3 * ((i * 37) % 7) / 7);
    leaf.castShadow = true;
    leaf.receiveShadow = true;
    vines.add(leaf);

    // small berry cluster occasionally
    if (i % 5 === 2) {
      for (let b = 0; b < 3; b++) {
        const berry = new THREE.Mesh(new THREE.SphereGeometry(0.0022, 12, 10), matBody);
        berry.position.set(
          p.x + (b - 1) * 0.0042,
          TOP_Y + 0.0026,
          p.z - side * 0.0055 + (b % 2) * 0.0018
        );
        berry.castShadow = true;
        vines.add(berry);
      }
    }
  }
}
zither.add(vines);

// A carved chevron border along the two end rails (chisel notches)
{
  const notches = new THREE.Group();
  for (const endX of [-HALF_L + 0.020, HALF_L - 0.020]) {
    const hw = halfWidthAt(endX) - 0.017;
    const count = Math.max(6, Math.round(hw * 2 / 0.014));
    for (let i = 0; i < count; i++) {
      const z = lerp(-hw + 0.006, hw - 0.006, count === 1 ? 0.5 : i / (count - 1));
      const n = new THREE.Mesh(
        new THREE.ConeGeometry(0.0038, 0.0055, 4),
        matBody
      );
      n.position.set(endX, TOP_Y + 0.0018, z);
      n.rotation.z = Math.PI / 2;
      n.rotation.y = Math.PI / 4;
      n.scale.set(1, 0.55, 1);
      n.castShadow = true;
      notches.add(n);
    }
  }
  zither.add(notches);
}

/* ---------- Bridges (bass + treble) --------------------------------- */
function makeBridge(xPos, hwFactor, height, mat) {
  const hw = halfWidthAt(xPos) - 0.030;
  const g = new THREE.Group();
  const barGeo = new THREE.BoxGeometry(0.011, height, hw * 2 * hwFactor);
  const bar = new THREE.Mesh(barGeo, mat);
  bar.position.set(xPos, TOP_Y + height * 0.5 + 0.0035, 0);
  bar.castShadow = true;
  bar.receiveShadow = true;
  g.add(bar);
  // chamfer cap: thin bone saddle on top
  const cap = new THREE.Mesh(
    new THREE.BoxGeometry(0.0045, 0.0028, hw * 2 * hwFactor + 0.002),
    matBone
  );
  cap.position.set(xPos, TOP_Y + height + 0.0035 + 0.0012, 0);
  cap.castShadow = true;
  g.add(cap);
  // little carved feet
  for (const s of [-1, 1]) {
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.016, 0.004, 0.010), mat);
    foot.position.set(xPos, TOP_Y + 0.0045, s * (hw * hwFactor - 0.006));
    foot.castShadow = true;
    g.add(foot);
  }
  return { group: g, hw: hw * hwFactor, y: TOP_Y + height + 0.0035 + 0.0026 };
}

const bridgeA = makeBridge(-HALF_L + 0.075, 0.94, 0.011, matEbony);  // wide end bridge
const bridgeB = makeBridge(HALF_L - 0.115, 0.92, 0.009, matEbony);   // near tuning-pin end
zither.add(bridgeA.group);
zither.add(bridgeB.group);

/* ---------- Bone tuning pins along the narrow end ------------------- */
const pinGroup = new THREE.Group();
const PIN_COUNT = 26;
const pinXBase = HALF_L - 0.036;
const pinTops = [];
{
  const hwPin = halfWidthAt(pinXBase) - 0.026;
  for (let i = 0; i < PIN_COUNT; i++) {
    const t = PIN_COUNT === 1 ? 0.5 : i / (PIN_COUNT - 1);
    const z = lerp(-hwPin, hwPin, t);
    // two staggered rows so pins don't crowd
    const stagger = (i % 2 === 0) ? 0.0 : 0.016;
    const x = pinXBase - stagger;

    const pin = new THREE.Group();

    // Shaft
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.0024, 0.0030, 0.030, 12), matBone);
    shaft.position.y = 0.015;
    shaft.castShadow = true;
    shaft.receiveShadow = true;
    pin.add(shaft);

    // Turned collar
    const collar = new THREE.Mesh(new THREE.TorusGeometry(0.0031, 0.0009, 8, 18), matBone);
    collar.rotation.x = Math.PI / 2;
    collar.position.y = 0.0215;
    collar.castShadow = true;
    pin.add(collar);

    // Carved head — a flattened, faceted knob
    const head = new THREE.Mesh(new THREE.CylinderGeometry(0.0046, 0.0030, 0.0085, 6), matBone);
    head.position.y = 0.0305;
    head.rotation.y = (i * 0.6);
    head.castShadow = true;
    head.receiveShadow = true;
    pin.add(head);

    // Tiny brass ferrule where the pin enters the wood
    const ferrule = new THREE.Mesh(new THREE.CylinderGeometry(0.0038, 0.0038, 0.0022, 12), matBrass);
    ferrule.position.y = 0.0012;
    ferrule.castShadow = true;
    pin.add(ferrule);

    pin.position.set(x, TOP_Y + 0.0015, z);
    pin.rotation.z = -0.10; // pins lean slightly away from string pull
    pinGroup.add(pin);

    pinTops.push(new THREE.Vector3(x + 0.0022, TOP_Y + 0.0225, z));
  }
}
zither.add(pinGroup);

/* ---------- Hitch pins at the wide end ------------------------------ */
const hitchPts = [];
{
  const hx = -HALF_L + 0.026;
  const hwH = halfWidthAt(hx) - 0.026;
  for (let i = 0; i < PIN_COUNT; i++) {
    const t = PIN_COUNT === 1 ? 0.5 : i / (PIN_COUNT - 1);
    const z = lerp(-hwH, hwH, t);
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.0013, 0.0016, 0.0085, 10), matBrass);
    p.position.set(hx, TOP_Y + 0.004, z);
    p.castShadow = true;
    zither.add(p);
    hitchPts.push(new THREE.Vector3(hx, TOP_Y + 0.0072, z));
  }
}

/* ---------- Strings ------------------------------------------------- */
{
  const strings = new THREE.Group();
  for (let i = 0; i < PIN_COUNT; i++) {
    const a = hitchPts[i];
    const b = pinTops[i];

    // Break over the two bridges: compute the crossing heights
    const bA = new THREE.Vector3(bridgeA.group.children[0].position.x, bridgeA.y, lerp(a.z, b.z,
      (bridgeA.group.children[0].position.x - a.x) / (b.x - a.x)));
    const bB = new THREE.Vector3(bridgeB.group.children[0].position.x, bridgeB.y, lerp(a.z, b.z,
      (bridgeB.group.children[0].position.x - a.x) / (b.x - a.x)));

    const path = new THREE.CatmullRomCurve3([a, bA, bB, b], false, 'catmullrom', 0.0);
    const isBass = i < PIN_COUNT * 0.35;
    const radius = isBass ? 0.00062 : 0.00040;
    const g = new THREE.TubeGeometry(path, 90, radius, 6, false);
    const s = new THREE.Mesh(g, isBass ? matStringBass : matString);
    s.castShadow = true;
    strings.add(s);
  }
  zither.add(strings);
}

/* ---------- Carved corner volutes at the wide end ------------------- */
{
  for (const s of [-1, 1]) {
    const pts = [];
    const N = 60;
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const ang = t * Math.PI * 2.4;
      const r = lerp(0.017, 0.0022, t);
      pts.push(new THREE.Vector3(
        -HALF_L + 0.024 + Math.cos(ang) * r,
        TOP_Y + 0.0016 + t * 0.0022,
        s * (halfWidthAt(-HALF_L) - 0.030) + Math.sin(ang) * r * s
      ));
    }
    const c = new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.5);
    const volute = new THREE.Mesh(new THREE.TubeGeometry(c, 160, 0.0025, 7, false), matBody);
    volute.castShadow = true;
    volute.receiveShadow = true;
    zither.add(volute);
  }
}

/* ---------- Assemble ------------------------------------------------ */
zither.rotation.y = -0.18;
scene.add(zither);

// Centre precisely on the origin
{
  const box = new THREE.Box3().setFromObject(zither);
  const c = new THREE.Vector3();
  box.getCenter(c);
  zither.position.sub(c);
  // rest it just above the shadow plane
  const box2 = new THREE.Box3().setFromObject(zither);
  zither.position.y -= box2.min.y - 0.0;
  controls.target.set(0, DEPTH * 0.8, 0);
}

/* ------------------------------------------------------------------ *
 *  Lighting
 * ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0xa9b7c9, 0x2a1c12, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff0d8, 3.0);
key.position.set(0.85, 1.15, 0.72);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.1;
key.shadow.camera.far = 6.0;
key.shadow.camera.left = -0.6;
key.shadow.camera.right = 0.6;
key.shadow.camera.top = 0.6;
key.shadow.camera.bottom = -0.6;
key.shadow.bias = -0.0006;
key.shadow.normalBias = 0.004;
key.shadow.radius = 3;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9fb4d4, 0.6);
fill.position.set(-1.0, 0.55, 0.55);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffc98a, 1.5);
rim.position.set(-0.6, 0.65, -1.1);
scene.add(rim);

// Raking light to catch the shallow vine ridges
const rake = new THREE.SpotLight(0xffe2b8, 12.0, 4.0, Math.PI * 0.30, 0.75, 1.6);
rake.position.set(0.05, 0.42, 0.95);
rake.target.position.set(0, 0.03, 0);
scene.add(rake);
scene.add(rake.target);

// Soft warm bounce from below-front
const bounce = new THREE.PointLight(0xc98b52, 1.1, 2.2, 2.0);
bounce.position.set(0.15, -0.12, 0.45);
scene.add(bounce);

/* ---------- Shadow-catcher ground ----------------------------------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(8, 8),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0.0;
ground.receiveShadow = true;
scene.add(ground);

// Subtle radial vignette disc under the instrument for grounding
{
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(128, 128, 8, 128, 128, 128);
  grd.addColorStop(0.0, 'rgba(60,48,40,0.85)');
  grd.addColorStop(0.55, 'rgba(40,32,28,0.35)');
  grd.addColorStop(1.0, 'rgba(0,0,0,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const disc = new THREE.Mesh(
    new THREE.PlaneGeometry(1.7, 1.7),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false })
  );
  disc.rotation.x = -Math.PI / 2;
  disc.position.y = -0.0006;
  scene.add(disc);
}

/* ------------------------------------------------------------------ *
 *  Resize + Render loop
 * ------------------------------------------------------------------ */
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
