<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glowing Phoenix</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #08080c; }
  #c { display: block; width: 100%; height: 100%; }
  .hint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    color: #d8c2a0; font: 12px/1.4 -apple-system, Segoe UI, Roboto, sans-serif;
    letter-spacing: .08em; opacity: .5; pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------- helpers ----------
const D2R = Math.PI / 180;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const UP = new THREE.Vector3(0, 1, 0);

// Fire temperature gradient: t=0 deep ember red -> t=1 white-hot core
const STOPS = [
  { t: 0.00, c: [0.34, 0.020, 0.008] },
  { t: 0.20, c: [0.85, 0.090, 0.020] },
  { t: 0.40, c: [1.00, 0.280, 0.045] },
  { t: 0.60, c: [1.00, 0.500, 0.130] },
  { t: 0.80, c: [1.00, 0.740, 0.300] },
  { t: 1.00, c: [1.00, 0.965, 0.860] },
];
function tempColor(t, target) {
  t = clamp01(t);
  let a = STOPS[0], b = STOPS[STOPS.length - 1];
  for (let i = 0; i < STOPS.length - 1; i++) {
    if (t >= STOPS[i].t && t <= STOPS[i + 1].t) { a = STOPS[i]; b = STOPS[i + 1]; break; }
  }
  const f = (t - a.t) / Math.max(1e-6, b.t - a.t);
  target.setRGB(
    a.c[0] + (b.c[0] - a.c[0]) * f,
    a.c[1] + (b.c[1] - a.c[1]) * f,
    a.c[2] + (b.c[2] - a.c[2]) * f,
    THREE.LinearSRGBColorSpace
  );
  return target;
}

// ---------- renderer / scene / camera ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08080c);
scene.fog = new THREE.FogExp2(0x07070b, 0.016);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(3.6, 1.3, 6.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.target.set(0, -0.05, -0.55);
controls.minDistance = 3.5;
controls.maxDistance = 14;
controls.enablePan = false;

// ---------- lighting ----------
scene.add(new THREE.HemisphereLight(0x3a2740, 0x0a0806, 0.5));

const keyLight = new THREE.DirectionalLight(0xffd9b0, 2.1);
keyLight.position.set(4.5, 7, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 25;
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -6;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.radius = 4;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x5a6cff, 0.45);
fillLight.position.set(-5, 2.5, 3);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xff5522, 1.4);
rimLight.position.set(-2, 3, -6);
scene.add(rimLight);

// warm core light radiating from the bird into the surrounding air / ground
const coreLight = new THREE.PointLight(0xff8a44, 6.0, 16, 2);
coreLight.position.set(0, 0.2, 0.1);
scene.add(coreLight);

// ---------- ground plane (only receives shadows) ----------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ color: 0x000000, opacity: 0.38 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.95;
ground.receiveShadow = true;
scene.add(ground);

// ---------- materials ----------
// Shared feather material: emissive glow driven per-vertex by baked temperature colors.
const featherMat = new THREE.MeshStandardMaterial({
  color: 0x060404,
  emissive: 0xffffff,
  emissiveIntensity: 2.4,
  roughness: 0.55,
  metalness: 0.0,
  vertexColors: true,
  side: THREE.DoubleSide,
});
featherMat.onBeforeCompile = (shader) => {
  shader.fragmentShader = shader.fragmentShader.replace(
    '#include <emissivemap_fragment>',
    '#include <emissivemap_fragment>\n\ttotalEmissiveRadiance *= vColor;'
  );
};

const bodyMat = new THREE.MeshStandardMaterial({
  color: 0x0a0503, emissive: 0xffcf9a, emissiveIntensity: 3.0, roughness: 0.5, metalness: 0.0,
});
const headMat = new THREE.MeshStandardMaterial({
  color: 0x0a0604, emissive: 0xffe4c2, emissiveIntensity: 3.2, roughness: 0.45, metalness: 0.0,
});
const beakMat = new THREE.MeshStandardMaterial({
  color: 0x160702, emissive: 0xff7a1e, emissiveIntensity: 2.2, roughness: 0.4, metalness: 0.0,
});
const eyeMat = new THREE.MeshStandardMaterial({
  color: 0x000000, emissive: 0xffffff, emissiveIntensity: 4.5, roughness: 0.3,
});

// ---------- feather base geometry ----------
const featherShape = new THREE.Shape();
featherShape.moveTo(0, 0);
featherShape.bezierCurveTo(0.9, 0.12, 0.72, 0.66, 0.0, 1.0);   // right edge -> tip
featherShape.bezierCurveTo(-0.72, 0.66, -0.9, 0.12, 0.0, 0.0); // left edge -> base
const featherBase = new THREE.ShapeGeometry(featherShape, 22);

function colorFeather(geo, baseTemp, tipTemp) {
  const pos = geo.attributes.position;
  const col = new Float32Array(pos.count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const y = clamp01(pos.getY(i)); // 0 (base) .. 1 (tip)
    tempColor(baseTemp + (tipTemp - baseTemp) * y, c);
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
}

const phoenix = new THREE.Group();
scene.add(phoenix);

const emitters = []; // world-space ember emission points (wingtips + tail tips)

function addFeather(root, dir, length, width, baseTemp, tipTemp) {
  const g = featherBase.clone();
  colorFeather(g, baseTemp, tipTemp);
  g.scale(width, length, 1);
  const m = new THREE.Mesh(g, featherMat);
  m.quaternion.setFromUnitVectors(UP, dir.clone().normalize());
  m.position.copy(root);
  m.castShadow = true;
  phoenix.add(m);
  return m;
}

// ---------- body ----------
const bodyMesh = new THREE.Mesh(new THREE.SphereGeometry(0.5, 40, 30), bodyMat);
bodyMesh.scale.set(0.72, 0.82, 1.16);
bodyMesh.position.set(0, 0.12, 0.12);
bodyMesh.rotation.x = -0.16;
bodyMesh.castShadow = true;
phoenix.add(bodyMesh);

// ---------- neck ----------
const neckCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 0.20, 0.36),
  new THREE.Vector3(0, 0.34, 0.62),
  new THREE.Vector3(0, 0.50, 0.83),
  new THREE.Vector3(0, 0.58, 0.98),
]);
const neckMesh = new THREE.Mesh(new THREE.TubeGeometry(neckCurve, 28, 0.155, 18, false), bodyMat);
neckMesh.castShadow = true;
phoenix.add(neckMesh);

// ---------- head ----------
const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.19, 28, 22), headMat);
headMesh.position.set(0, 0.60, 1.00);
headMesh.castShadow = true;
phoenix.add(headMesh);

// beak
const beak = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.26, 20), beakMat);
beak.rotation.x = Math.PI / 2;
beak.position.set(0, 0.565, 1.17);
beak.castShadow = true;
phoenix.add(beak);

// eyes
for (const sx of [-1, 1]) {
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.032, 14, 12), eyeMat);
  eye.position.set(0.10 * sx, 0.645, 1.11);
  phoenix.add(eye);
}

// crest feathers
{
  const root = new THREE.Vector3(0, 0.76, 0.95);
  const n = 5;
  for (let i = 0; i < n; i++) {
    const u = i / (n - 1);
    const dir = new THREE.Vector3((u - 0.5) * 0.55, 1.0, -0.5 - u * 0.15).normalize();
    const L = 0.34 + 0.18 * Math.sin(u * Math.PI);
    addFeather(root.clone().addScaledVector(dir, 0.05), dir, L, 0.075, 1.0, 0.55);
  }
}

// ---------- wings ----------
function wingDir(side, thetaDeg, phiDeg) {
  const th = thetaDeg * D2R, ph = phiDeg * D2R;
  return new THREE.Vector3(
    Math.cos(th) * Math.cos(ph) * side,
    Math.sin(th),
    -Math.cos(th) * Math.sin(ph)
  );
}

function buildWing(side) {
  const root = new THREE.Vector3(0.24 * side, 0.24, 0.12);

  // primary flight feathers
  const nP = 11;
  for (let i = 0; i < nP; i++) {
    const u = i / (nP - 1);
    const dir = wingDir(side, lerp(80, 4, u), lerp(-6, 74, u));
    const L = lerp(0.95, 1.82, u);
    const W = lerp(0.10, 0.165, u);
    addFeather(root.clone().addScaledVector(dir, 0.12), dir, L, W, lerp(0.85, 0.32, u), lerp(0.5, 0.0, u));
    if (u > 0.45) {
      const tip = root.clone().addScaledVector(dir, L);
      emitters.push(tip.clone());
      if (u > 0.8) emitters.push(tip.clone()); // denser embers at the very tips
    }
  }

  // covert feathers (overlay)
  const nC = 9;
  for (let i = 0; i < nC; i++) {
    const u = i / (nC - 1);
    const dir = wingDir(side, lerp(86, 26, u), lerp(-2, 58, u));
    const L = lerp(0.5, 0.96, u);
    const W = lerp(0.09, 0.14, u);
    const pos = root.clone().addScaledVector(dir, 0.08).add(new THREE.Vector3(0, 0.02, 0.06));
    addFeather(pos, dir, L, W, lerp(0.98, 0.55, u), lerp(0.75, 0.2, u));
  }

  // tertials filling toward the body
  const nT = 5;
  for (let i = 0; i < nT; i++) {
    const u = i / (nT - 1);
    const dir = wingDir(side, lerp(92, 60, u), lerp(6, 30, u));
    const L = lerp(0.36, 0.62, u);
    const pos = root.clone().addScaledVector(dir, 0.05).add(new THREE.Vector3(-0.05 * side, 0.05, 0.02));
    addFeather(pos, dir, L, 0.09, 0.98, lerp(0.85, 0.5, u));
  }
}
buildWing(1);
buildWing(-1);

// ---------- sweeping tail ----------
function buildTail() {
  const root = new THREE.Vector3(0, -0.02, -0.72);

  const n = 13;
  for (let i = 0; i < n; i++) {
    const m = i / (n - 1);
    const c = m - 0.5;
    const dir = new THREE.Vector3(c * 1.15, -0.42 + Math.abs(c) * 0.10, -1.0).normalize();
    const L = 2.65 - Math.abs(c) * 1.7;
    const W = 0.15 - Math.abs(c) * 0.045;
    addFeather(root.clone().addScaledVector(dir, 0.1), dir, L, W, 0.8, Math.abs(c) < 0.12 ? 0.08 : 0.0);
    if (i % 2 === 0) emitters.push(root.clone().addScaledVector(dir, L));
  }

  // tail coverts (shorter, hotter, layered above the base)
  const nc = 9;
  for (let i = 0; i < nc; i++) {
    const m = i / (nc - 1);
    const c = m - 0.5;
    const dir = new THREE.Vector3(c * 1.0, -0.15, -1.0).normalize();
    const L = 1.0 - Math.abs(c) * 0.9;
    const W = 0.13 - Math.abs(c) * 0.04;
    const pos = root.clone().addScaledVector(dir, 0.06).add(new THREE.Vector3(0, 0.12, 0.05));
    addFeather(pos, dir, L, W, 0.92, lerp(0.7, 0.25, clamp01(Math.abs(c) * 2)));
  }
}
buildTail();

// ---------- soft sprite texture ----------
function makeSoftSprite() {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 64;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0.0, 'rgba(255,255,255,1)');
  g.addColorStop(0.3, 'rgba(255,238,196,0.85)');
  g.addColorStop(1.0, 'rgba(255,170,70,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 64);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const softSprite = makeSoftSprite();

// atmospheric warm haze around the bird
const glow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: softSprite, color: 0xff7a33, transparent: true, opacity: 0.15,
  blending: THREE.AdditiveBlending, depthWrite: false,
}));
glow.scale.set(9, 9, 1);
glow.position.set(0, 0.1, -0.5);
scene.add(glow);

// ---------- ember particles rising from wingtips ----------
const N = 520;
const ePos = new Float32Array(N * 3);
const eCol = new Float32Array(N * 3);
const eVel = new Float32Array(N * 3);
const eLife = new Float32Array(N);
const eMax = new Float32Array(N);
const tmpCol = new THREE.Color();

function spawnEmber(i) {
  const e = emitters.length ? emitters[(Math.random() * emitters.length) | 0] : new THREE.Vector3();
  const ix = i * 3;
  ePos[ix]     = e.x + (Math.random() - 0.5) * 0.12;
  ePos[ix + 1] = e.y + (Math.random() - 0.5) * 0.12;
  ePos[ix + 2] = e.z + (Math.random() - 0.5) * 0.12;
  eVel[ix]     = (Math.random() - 0.5) * 0.35;
  eVel[ix + 1] = 0.40 + Math.random() * 0.75;
  eVel[ix + 2] = (Math.random() - 0.5) * 0.35;
  eMax[i]  = 1.2 + Math.random() * 1.8;
  eLife[i] = eMax[i] * (0.15 + Math.random() * 0.85);
}
for (let i = 0; i < N; i++) spawnEmber(i);

const emberGeo = new THREE.BufferGeometry();
const ePosAttr = new THREE.BufferAttribute(ePos, 3);
const eColAttr = new THREE.BufferAttribute(eCol, 3);
emberGeo.setAttribute('position', ePosAttr);
emberGeo.setAttribute('color', eColAttr);
const emberMat = new THREE.PointsMaterial({
  size: 0.135, map: softSprite, vertexColors: true, transparent: true,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
});
const embers = new THREE.Points(emberGeo, emberMat);
embers.frustumCulled = false;
scene.add(embers);

function updateEmbers(dt, time) {
  for (let i = 0; i < N; i++) {
    eLife[i] -= dt;
    if (eLife[i] <= 0) spawnEmber(i);
    const ix = i * 3;
    eVel[ix]     += Math.sin(time * 2.0 + i * 0.7) * 0.15 * dt;
    eVel[ix + 2] += Math.cos(time * 1.7 + i * 1.3) * 0.15 * dt;
    eVel[ix + 1] += 0.25 * dt; // buoyancy
    ePos[ix]     += eVel[ix] * dt;
    ePos[ix + 1] += eVel[ix + 1] * dt;
    ePos[ix + 2] += eVel[ix + 2] * dt;
    const k = clamp01(eLife[i] / eMax[i]);
    tempColor(0.12 + 0.85 * k, tmpCol);
    const b = k * k * 1.25;
    eCol[ix] = tmpCol.r * b; eCol[ix + 1] = tmpCol.g * b; eCol[ix + 2] = tmpCol.b * b;
  }
  ePosAttr.needsUpdate = true;
  eColAttr.needsUpdate = true;
}

// ---------- post processing (bloom) ----------
const composer = new EffectComposer(renderer);
composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
composer.setSize(window.innerWidth, window.innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight), 0.85, 0.6, 0.18
);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

// ---------- resize ----------
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloomPass.setSize(w, h);
}
window.addEventListener('resize', onResize);

// ---------- animate ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // living-flame flicker
  featherMat.emissiveIntensity = 2.35 + 0.35 * Math.sin(t * 7.0) + 0.18 * Math.sin(t * 13.3 + 1.0);
  bodyMat.emissiveIntensity = 3.0 + 0.35 * Math.sin(t * 5.0 + 0.5);
  headMat.emissiveIntensity = 3.2 + 0.3 * Math.sin(t * 6.1);
  coreLight.intensity = 6.0 + 1.6 * Math.sin(t * 6.0);
  bloomPass.strength = 0.82 + 0.12 * Math.sin(t * 3.3);

  updateEmbers(dt, t);
  controls.update();
  composer.render();
}
animate();
</script>
</body>
</html>
