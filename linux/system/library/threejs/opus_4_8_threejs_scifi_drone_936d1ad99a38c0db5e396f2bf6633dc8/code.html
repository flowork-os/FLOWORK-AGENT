<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sci-Fi Surveillance Drone</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101216; }
  #app { position: fixed; inset: 0; }
  .hint {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    font: 12px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: rgba(200,225,235,0.55); letter-spacing: .08em; text-transform: uppercase;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="hint">Aegis-IV · Autonomous Surveillance Unit</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------------------------------------------------------------------
   Renderer
--------------------------------------------------------------------------- */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

/* ---------------------------------------------------------------------------
   Scene & Camera
--------------------------------------------------------------------------- */
const BG = 0x0f1216;
const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 7, 18);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(2.6, 1.5, 3.4);

/* ---------------------------------------------------------------------------
   Lighting  (Hemisphere fill + directional key + fill + rim)
--------------------------------------------------------------------------- */
const hemi = new THREE.HemisphereLight(0x9fc4de, 0x14171c, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(3.5, 5.2, 3.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 5;
key.shadow.bias = -0.0002;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 20;
key.shadow.camera.left = -4;
key.shadow.camera.right = 4;
key.shadow.camera.top = 4;
key.shadow.camera.bottom = -4;
scene.add(key);

const fill = new THREE.DirectionalLight(0x8fb7d6, 0.7);
fill.position.set(-4, 2.2, 1.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0x38e9ff, 1.5);
rim.position.set(-2.5, 2.0, -4.5);
scene.add(rim);

/* ---------------------------------------------------------------------------
   Ground plane — receives shadows only
--------------------------------------------------------------------------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.ShadowMaterial({ opacity: 0.4 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.15;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------------------------------------------------------------------
   Materials
--------------------------------------------------------------------------- */
const matWhite = new THREE.MeshStandardMaterial({ color: 0xeaeef2, metalness: 0.18, roughness: 0.42 });
const matGrey  = new THREE.MeshStandardMaterial({ color: 0x2b3038, metalness: 0.55, roughness: 0.40 });
const matDark  = new THREE.MeshStandardMaterial({ color: 0x14171c, metalness: 0.62, roughness: 0.34 });
const matBlade = new THREE.MeshStandardMaterial({ color: 0x30353d, metalness: 0.45, roughness: 0.5, side: THREE.DoubleSide });
const matDuct  = new THREE.MeshStandardMaterial({ color: 0x22262d, metalness: 0.5, roughness: 0.45, side: THREE.DoubleSide });
const matAccent = new THREE.MeshStandardMaterial({
  color: 0x02181c, emissive: 0x18e6ff, emissiveIntensity: 1.9, metalness: 0.0, roughness: 0.4
});
const matEye = new THREE.MeshStandardMaterial({
  color: 0x012a31, emissive: 0x30f2ff, emissiveIntensity: 2.2, metalness: 0.0, roughness: 0.2
});
const matEyeCore = new THREE.MeshStandardMaterial({
  color: 0xffffff, emissive: 0xbdfaff, emissiveIntensity: 3.0, metalness: 0.0, roughness: 0.1
});

/* ---------------------------------------------------------------------------
   Drone assembly
--------------------------------------------------------------------------- */
const drone = new THREE.Group();
scene.add(drone);

const ELONG = 1.32;   // front-back elongation of the central body

// helper — lathe body shell
function lathe(points, material, segments = 72) {
  const geo = new THREE.LatheGeometry(points, segments);
  const m = new THREE.Mesh(geo, material);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

/* ----- central aerodynamic body (white top shell + dark belly) ----- */
const topProfile = [
  new THREE.Vector2(0.00, 0.300),
  new THREE.Vector2(0.12, 0.288),
  new THREE.Vector2(0.26, 0.256),
  new THREE.Vector2(0.40, 0.202),
  new THREE.Vector2(0.52, 0.118),
  new THREE.Vector2(0.60, 0.028),
  new THREE.Vector2(0.625, 0.000)
];
const bottomProfile = [
  new THREE.Vector2(0.625, 0.000),
  new THREE.Vector2(0.58, -0.058),
  new THREE.Vector2(0.46, -0.115),
  new THREE.Vector2(0.30, -0.160),
  new THREE.Vector2(0.14, -0.184),
  new THREE.Vector2(0.00, -0.192)
];

const shellTop = lathe(topProfile, matWhite);
shellTop.scale.z = ELONG;
drone.add(shellTop);

const shellBottom = lathe(bottomProfile, matGrey);
shellBottom.scale.z = ELONG;
drone.add(shellBottom);

// seam accent ring (emissive) at the shell equator
const seam = new THREE.Mesh(new THREE.TorusGeometry(0.612, 0.012, 12, 90), matAccent);
seam.rotation.x = Math.PI / 2;
seam.scale.z = ELONG;
drone.add(seam);

// subtle panel-line rings on the top shell
[0.24, 0.42].forEach((r, i) => {
  const y = i === 0 ? 0.235 : 0.14;
  const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.004, 8, 80), matDark);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = y;
  ring.scale.z = ELONG;
  drone.add(ring);
});

// emissive accent strips running front-back on the top shell
[-0.11, 0.11].forEach((x) => {
  const strip = new THREE.Mesh(new THREE.BoxGeometry(0.022, 0.006, 0.52), matAccent);
  strip.position.set(x, 0.263, 0.05);
  drone.add(strip);
});

/* ----- front sensor eye ----- */
const eye = new THREE.Group();
eye.position.set(0, 0.03, 0.70);
drone.add(eye);

// dark housing bezel around the lens
const bezel = new THREE.Mesh(new THREE.TorusGeometry(0.115, 0.03, 16, 40), matDark);
bezel.castShadow = true;
eye.add(bezel);

// housing cup behind the lens
const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.125, 0.14, 0.10, 40), matGrey);
cup.rotation.x = Math.PI / 2;
cup.position.z = -0.06;
cup.castShadow = true;
eye.add(cup);

// glowing cyan lens
const lens = new THREE.Mesh(new THREE.SphereGeometry(0.105, 40, 32), matEye);
lens.scale.z = 0.62;
lens.position.z = 0.015;
eye.add(lens);

// bright inner core
const core = new THREE.Mesh(new THREE.SphereGeometry(0.045, 24, 20), matEyeCore);
core.scale.z = 0.55;
core.position.z = 0.06;
eye.add(core);

// small point light emanating from the eye
const eyeLight = new THREE.PointLight(0x30f2ff, 1.2, 3.0, 2.0);
eyeLight.position.set(0, 0.03, 0.85);
drone.add(eyeLight);

/* ----- four arms + ducted rotor pods (X configuration) ----- */
const rotors = [];
const ARM_ANGLES = [Math.PI / 4, 3 * Math.PI / 4, 5 * Math.PI / 4, 7 * Math.PI / 4];

function buildPod(index) {
  const pod = new THREE.Group();

  // arm — extends along +X in local space
  const armGeo = new THREE.CylinderGeometry(0.05, 0.062, 0.66, 20);
  const arm = new THREE.Mesh(armGeo, matGrey);
  arm.rotation.z = Math.PI / 2;
  arm.position.set(0.72, 0.0, 0.0);
  arm.castShadow = true;
  pod.add(arm);

  // arm accent strip
  const armStrip = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.006, 0.02), matAccent);
  armStrip.position.set(0.70, 0.052, 0);
  pod.add(armStrip);

  // fairing where arm meets body
  const fair = new THREE.Mesh(new THREE.SphereGeometry(0.10, 20, 16), matWhite);
  fair.scale.set(1.0, 0.7, 0.9);
  fair.position.set(0.42, 0.02, 0);
  fair.castShadow = true;
  pod.add(fair);

  const DX = 1.12; // duct centre distance

  // ducted housing — outer torus ring
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.27, 0.05, 18, 48), matDark);
  ring.rotation.x = Math.PI / 2;
  ring.position.set(DX, 0, 0);
  ring.castShadow = true;
  ring.receiveShadow = true;
  pod.add(ring);

  // duct inner wall (open cylinder)
  const wall = new THREE.Mesh(new THREE.CylinderGeometry(0.245, 0.245, 0.15, 40, 1, true), matDuct);
  wall.position.set(DX, 0, 0);
  wall.castShadow = true;
  pod.add(wall);

  // emissive lip accent on top of the duct
  const lip = new THREE.Mesh(new THREE.TorusGeometry(0.252, 0.012, 12, 48), matAccent);
  lip.rotation.x = Math.PI / 2;
  lip.position.set(DX, 0.06, 0);
  pod.add(lip);

  // white duct shroud (top cap ring)
  const shroud = new THREE.Mesh(new THREE.TorusGeometry(0.285, 0.03, 16, 48), matWhite);
  shroud.rotation.x = Math.PI / 2;
  shroud.position.set(DX, 0.055, 0);
  shroud.castShadow = true;
  pod.add(shroud);

  // rotor assembly
  const rotor = new THREE.Group();
  rotor.position.set(DX, 0.03, 0);

  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.07, 20), matDark);
  hub.castShadow = true;
  rotor.add(hub);

  const bladeGeo = new THREE.BoxGeometry(0.235, 0.006, 0.05);
  bladeGeo.translate(0.12, 0, 0);
  for (let i = 0; i < 3; i++) {
    const blade = new THREE.Mesh(bladeGeo, matBlade);
    blade.rotation.y = (i * 2 * Math.PI) / 3;
    blade.rotation.x = 0.28;
    blade.castShadow = true;
    rotor.add(blade);
  }
  rotor.userData.dir = index % 2 === 0 ? 1 : -1;
  rotors.push(rotor);
  pod.add(rotor);

  // small nav light beneath each pod
  const nav = new THREE.Mesh(new THREE.SphereGeometry(0.022, 12, 10), matAccent);
  nav.position.set(DX, -0.07, 0.12);
  pod.add(nav);

  pod.rotation.y = ARM_ANGLES[index];
  return pod;
}

ARM_ANGLES.forEach((_, i) => drone.add(buildPod(i)));

/* ----- thin landing skids ----- */
function buildSkids() {
  const g = new THREE.Group();
  [-1, 1].forEach((side) => {
    // curved rail
    const rail = new THREE.Mesh(new THREE.CapsuleGeometry(0.028, 0.78, 8, 16), matDark);
    rail.rotation.x = Math.PI / 2;
    rail.position.set(side * 0.30, -0.42, 0.0);
    rail.castShadow = true;
    g.add(rail);

    // up-turned front tip
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.028, 12, 10), matDark);
    tip.position.set(side * 0.30, -0.40, 0.47);
    g.add(tip);

    // two struts connecting rail to belly
    [-0.20, 0.20].forEach((z) => {
      const strut = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.02, 0.26, 12), matGrey);
      strut.position.set(side * 0.29, -0.30, z);
      strut.rotation.z = side * 0.14;
      strut.castShadow = true;
      g.add(strut);
    });
  });
  return g;
}
drone.add(buildSkids());

/* ---------------------------------------------------------------------------
   Controls
--------------------------------------------------------------------------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 2.2;
controls.maxDistance = 9;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 0.15, 0);

/* ---------------------------------------------------------------------------
   Resize
--------------------------------------------------------------------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

/* ---------------------------------------------------------------------------
   Animation loop
--------------------------------------------------------------------------- */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // hover bob + subtle sway
  drone.position.y = 0.16 + Math.sin(t * 1.15) * 0.055;
  drone.rotation.z = Math.sin(t * 0.7) * 0.02;
  drone.rotation.x = Math.sin(t * 0.9 + 1.0) * 0.015;

  // spinning rotors
  for (const r of rotors) r.rotation.y = t * 34 * r.userData.dir;

  // pulsing sensor eye
  const pulse = 1.9 + Math.sin(t * 3.0) * 0.6;
  matEye.emissiveIntensity = pulse;
  eyeLight.intensity = 0.9 + Math.sin(t * 3.0) * 0.35;
  matAccent.emissiveIntensity = 1.7 + Math.sin(t * 2.0 + 0.5) * 0.35;

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
