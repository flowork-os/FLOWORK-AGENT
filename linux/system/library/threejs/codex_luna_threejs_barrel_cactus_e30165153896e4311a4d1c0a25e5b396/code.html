<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procedural Barrel Cactus</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #e7eee9;
    }

    canvas {
      display: block;
    }

    .caption {
      position: fixed;
      left: 28px;
      top: 26px;
      color: #263b32;
      pointer-events: none;
      user-select: none;
    }

    .caption h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 750;
      letter-spacing: 0.22em;
    }

    .caption p {
      margin: 8px 0 0;
      color: #668074;
      font-size: 11px;
      letter-spacing: 0.08em;
    }

    .hint {
      position: fixed;
      right: 26px;
      bottom: 24px;
      color: #668074;
      font-size: 11px;
      letter-spacing: 0.08em;
      pointer-events: none;
      user-select: none;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="caption">
    <h1>BARREL CACTUS</h1>
    <p>PROCEDURAL BOTANICAL STUDY</p>
  </div>
  <div class="hint">DRAG TO ORBIT · SCROLL TO ZOOM</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe7eee9);
    scene.fog = new THREE.Fog(0xe7eee9, 8, 18);

    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(6.2, 4.8, 7.2);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.15, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.7;
    controls.minDistance = 4.6;
    controls.maxDistance = 11;
    controls.minPolarAngle = 0.55;
    controls.maxPolarAngle = 1.48;

    const ambientLight = new THREE.HemisphereLight(0xf4fff8, 0x9a816f, 2.0);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xfff4dd, 4.2);
    keyLight.position.set(5.5, 8.5, 4.5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -5;
    keyLight.shadow.camera.right = 5;
    keyLight.shadow.camera.top = 7;
    keyLight.shadow.camera.bottom = -3;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 22;
    keyLight.shadow.bias = -0.0003;
    keyLight.shadow.normalBias = 0.025;
    scene.add(keyLight);
    scene.add(keyLight.target);
    keyLight.target.position.set(0, 1.8, 0);

    const fillLight = new THREE.PointLight(0xc6e5dc, 2.0, 12, 2);
    fillLight.position.set(-4, 3.5, 4);
    scene.add(fillLight);

    const cactusBaseY = 0.82;
    const cactusHeight = 3.55;
    const ribCount = 14;

    function cactusRadiusAt(localY) {
      const normalizedY = THREE.MathUtils.clamp(localY / cactusHeight, 0, 1);
      return 0.18 + 1.25 * Math.pow(Math.sin(Math.PI * normalizedY), 0.34);
    }

    function buildRibbedCactusGeometry() {
      const radialSegments = 128;
      const verticalSegments = 48;
      const positions = [];
      const indices = [];

      for (let yIndex = 0; yIndex <= verticalSegments; yIndex += 1) {
        const localY = cactusHeight * yIndex / verticalSegments;
        const baseRadius = cactusRadiusAt(localY);

        for (let angleIndex = 0; angleIndex < radialSegments; angleIndex += 1) {
          const angle = angleIndex / radialSegments * Math.PI * 2;
          const ridgeAmount = Math.pow(
            Math.max(0, Math.cos(ribCount * angle)),
            2.8
          );
          const radius = baseRadius * (1 + 0.105 * ridgeAmount);
          positions.push(
            Math.cos(angle) * radius,
            localY,
            Math.sin(angle) * radius
          );
        }
      }

      const bottomCenterIndex = positions.length / 3;
      positions.push(0, 0, 0);

      const topCenterIndex = positions.length / 3;
      positions.push(0, cactusHeight, 0);

      for (let angleIndex = 0; angleIndex < radialSegments; angleIndex += 1) {
        const nextAngleIndex = (angleIndex + 1) % radialSegments;
        indices.push(
          bottomCenterIndex,
          nextAngleIndex,
          angleIndex
        );
      }

      for (let yIndex = 0; yIndex < verticalSegments; yIndex += 1) {
        const lowerStart = yIndex * radialSegments;
        const upperStart = (yIndex + 1) * radialSegments;

        for (let angleIndex = 0; angleIndex < radialSegments; angleIndex += 1) {
          const nextAngleIndex = (angleIndex + 1) % radialSegments;
          const lowerCurrent = lowerStart + angleIndex;
          const upperCurrent = upperStart + angleIndex;
          const upperNext = upperStart + nextAngleIndex;
          const lowerNext = lowerStart + nextAngleIndex;

          indices.push(
            lowerCurrent,
            upperCurrent,
            upperNext,
            lowerCurrent,
            upperNext,
            lowerNext
          );
        }
      }

      const topStart = verticalSegments * radialSegments;
      for (let angleIndex = 0; angleIndex < radialSegments; angleIndex += 1) {
        const nextAngleIndex = (angleIndex + 1) % radialSegments;
        indices.push(
          topCenterIndex,
          topStart + nextAngleIndex,
          topStart + angleIndex
        );
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(positions, 3)
      );
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      geometry.computeBoundingSphere();
      return geometry;
    }

    const cactusMaterial = new THREE.MeshStandardMaterial({
      color: 0x4f8a62,
      roughness: 0.82,
      metalness: 0.0
    });

    const cactus = new THREE.Mesh(
      buildRibbedCactusGeometry(),
      cactusMaterial
    );
    cactus.position.y = cactusBaseY;
    cactus.castShadow = true;
    cactus.receiveShadow = true;
    scene.add(cactus);

    const spineMaterial = new THREE.MeshStandardMaterial({
      color: 0xe8d9ad,
      roughness: 0.72,
      metalness: 0.0
    });

    const spineTipMaterial = new THREE.MeshStandardMaterial({
      color: 0xf4eacb,
      roughness: 0.64,
      metalness: 0.0
    });

    const spineGeometry = new THREE.ConeGeometry(0.026, 0.22, 7, 1);
    const spineClusterGeometry = new THREE.SphereGeometry(0.06, 10, 7);

    function addSpineCluster(angle, localY, clusterIndex) {
      const localRadius = cactusRadiusAt(localY) * 1.105;
      const surface = new THREE.Vector3(
        Math.cos(angle) * localRadius,
        cactusBaseY + localY,
        Math.sin(angle) * localRadius
      );

      const radial = new THREE.Vector3(
        Math.cos(angle),
        0,
        Math.sin(angle)
      );
      const tangent = new THREE.Vector3(
        -Math.sin(angle),
        0,
        Math.cos(angle)
      );

      const cluster = new THREE.Mesh(
        spineClusterGeometry,
        spineMaterial
      );
      cluster.position.copy(surface).addScaledVector(radial, 0.035);
      cluster.scale.set(1.0, 0.82, 1.0);
      cluster.castShadow = true;
      scene.add(cluster);

      const directions = [
        new THREE.Vector3().copy(radial).add(new THREE.Vector3(0, 0.20, 0)),
        new THREE.Vector3().copy(radial).addScaledVector(tangent, 0.62).add(new THREE.Vector3(0, 0.05, 0)),
        new THREE.Vector3().copy(radial).addScaledVector(tangent, -0.62).add(new THREE.Vector3(0, -0.04, 0))
      ];

      directions.forEach((direction, directionIndex) => {
        direction.normalize();
        const spineLength = 0.18 + 0.025 * ((clusterIndex + directionIndex) % 3);
        const spine = new THREE.Mesh(
          spineGeometry,
          directionIndex === 0 ? spineTipMaterial : spineMaterial
        );
        spine.scale.set(1, spineLength / 0.22, 1);
        spine.position.copy(surface).addScaledVector(direction, spineLength * 0.5);
        spine.quaternion.setFromUnitVectors(
          new THREE.Vector3(0, 1, 0),
          direction
        );
        spine.castShadow = true;
        scene.add(spine);
      });
    }

    const spineRows = [0.48, 1.06, 1.68, 2.30, 2.88, 3.30];
    spineRows.forEach((localY, rowIndex) => {
      for (let ribIndex = 0; ribIndex < ribCount; ribIndex += 1) {
        const angle = ribIndex / ribCount * Math.PI * 2;
        addSpineCluster(angle, localY, rowIndex + ribIndex);
      }
    });

    const potMaterial = new THREE.MeshStandardMaterial({
      color: 0xb86f4f,
      roughness: 0.76,
      metalness: 0.0
    });

    const pot = new THREE.Mesh(
      new THREE.CylinderGeometry(1.52, 1.32, 0.9, 96, 1, false),
      potMaterial
    );
    pot.position.y = 0.45;
    pot.castShadow = true;
    pot.receiveShadow = true;
    scene.add(pot);

    const potFoot = new THREE.Mesh(
      new THREE.CylinderGeometry(1.27, 1.23, 0.10, 96),
      potMaterial
    );
    potFoot.position.y = 0.055;
    potFoot.castShadow = true;
    potFoot.receiveShadow = true;
    scene.add(potFoot);

    const potRim = new THREE.Mesh(
      new THREE.TorusGeometry(1.43, 0.105, 18, 96),
      potMaterial
    );
    potRim.rotation.x = Math.PI / 2;
    potRim.position.y = 0.91;
    potRim.castShadow = true;
    potRim.receiveShadow = true;
    scene.add(potRim);

    const soilMaterial = new THREE.MeshStandardMaterial({
      color: 0x3f3028,
      roughness: 1.0,
      metalness: 0.0
    });

    const soil = new THREE.Mesh(
      new THREE.CylinderGeometry(1.34, 1.34, 0.07, 96),
      soilMaterial
    );
    soil.position.y = 0.91;
    soil.receiveShadow = true;
    scene.add(soil);

    const crownMaterial = new THREE.MeshStandardMaterial({
      color: 0xd8c58f,
      roughness: 0.88,
      metalness: 0.0
    });

    const crown = new THREE.Mesh(
      new THREE.SphereGeometry(0.27, 24, 12),
      crownMaterial
    );
    crown.position.set(0, cactusBaseY + cactusHeight + 0.035, 0);
    crown.scale.set(1.0, 0.30, 1.0);
    crown.castShadow = true;
    scene.add(crown);

    const petalMaterial = new THREE.MeshStandardMaterial({
      color: 0xdcae4c,
      roughness: 0.62,
      metalness: 0.0
    });

    const petalGeometry = new THREE.SphereGeometry(0.115, 16, 9);
    const flowerY = cactusBaseY + cactusHeight + 0.105;

    for (let petalIndex = 0; petalIndex < 8; petalIndex += 1) {
      const angle = petalIndex / 8 * Math.PI * 2;
      const petal = new THREE.Mesh(petalGeometry, petalMaterial);
      petal.position.set(
        Math.cos(angle) * 0.19,
        flowerY,
        Math.sin(angle) * 0.19
      );
      petal.scale.set(1.42, 0.30, 0.55);
      petal.rotation.y = -angle;
      petal.castShadow = true;
      scene.add(petal);
    }

    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0xdce7df,
      roughness: 0.96,
      metalness: 0.0
    });

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      groundMaterial
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    ground.receiveShadow = true;
    scene.add(ground);

    const shadowDisc = new THREE.Mesh(
      new THREE.CircleGeometry(2.2, 96),
      new THREE.MeshBasicMaterial({
        color: 0xc8d8cf,
        transparent: true,
        opacity: 0.22,
        depthWrite: false
      })
    );
    shadowDisc.rotation.x = -Math.PI / 2;
    shadowDisc.position.y = 0.006;
    scene.add(shadowDisc);

    function handleResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", handleResize);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
