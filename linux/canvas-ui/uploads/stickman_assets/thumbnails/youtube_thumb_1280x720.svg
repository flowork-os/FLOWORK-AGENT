<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0515"/>
      <stop offset="50%" stop-color="#1f092b"/>
      <stop offset="100%" stop-color="#3b0d42"/>
    </linearGradient>
    <filter id="neonHero">
      <feGaussianBlur stdDeviation="10" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgG)"/>
  <!-- Diagonal Speed Slash Background Lines -->
  <line x1="-100" y1="100" x2="1400" y2="600" stroke="#ff0055" stroke-width="8" opacity="0.4"/>
  <line x1="-100" y1="250" x2="1400" y2="750" stroke="#00e5ff" stroke-width="12" opacity="0.5"/>
  <!-- Giant Glowing Katana -->
  <path d="M 200 680 L 1150 120" stroke="#ffffff" stroke-width="24" stroke-linecap="round" filter="url(#neonHero)"/>
  <path d="M 200 680 L 1150 120" stroke="#ff0055" stroke-width="12" stroke-linecap="round"/>
  <!-- Stickman Silhouette with Glowing Red Eyes -->
  <g transform="translate(420, 260) scale(3.5)" stroke="#000000" stroke-width="6" stroke-linecap="round">
    <circle cx="0" cy="-35" r="16" fill="#000000" stroke="#ffffff" stroke-width="3"/>
    <circle cx="-5" cy="-35" r="3" fill="#ff0033"/>
    <circle cx="5" cy="-35" r="3" fill="#ff0033"/>
    <line x1="0" y1="-19" x2="0" y2="25" stroke="#ffffff" stroke-width="4"/>
    <line x1="0" y1="-12" x2="-28" y2="10" stroke="#ffffff" stroke-width="4"/>
    <line x1="0" y1="-12" x2="35" y2="-5" stroke="#ffffff" stroke-width="4"/>
    <line x1="0" y1="25" x2="-20" y2="65" stroke="#ffffff" stroke-width="4"/>
    <line x1="0" y1="25" x2="25" y2="60" stroke="#ffffff" stroke-width="4"/>
  </g>
  <!-- High CTR Hyped Text -->
  <g transform="translate(60, 140)">
    <!-- Yellow Box Backing -->
    <rect x="-10" y="-70" width="580" height="90" fill="#ffff00" rx="8" transform="rotate(-3)"/>
    <text x="10" y="-8" font-family="'Impact', Arial Black" font-size="75" fill="#000000" transform="rotate(-3)">HE BROKE THE GAME?!</text>
  </g>
  <g transform="translate(60, 240)">
    <rect x="-10" y="-55" width="420" height="75" fill="#ff0055" rx="8" transform="rotate(-2)"/>
    <text x="10" y="-3" font-family="'Impact', Arial Black" font-size="60" fill="#ffffff" transform="rotate(-2)">999,999 DAMAGE</text>
  </g>
</svg>