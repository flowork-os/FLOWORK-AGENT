<!DOCTYPE html>
<!-- [FL_INDEX: keywords="concat_gui, code_concatenator, token_counter, canvas_ui, flowork_app" | purpose="Interactive Visual GUI for Concat app"] -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concat - Code & Context Packer</title>
  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #181b24;
      --border: #262b3a;
      --text: #e2e8f0;
      --text-muted: #8b949e;
      --primary: #3b82f6;
      --accent: #10b981;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-family);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand h1 { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
    .brand span { font-size: 11px; background: rgba(59,130,246,0.2); color: var(--primary); padding: 2px 8px; border-radius: 4px; }
    .stats { display: flex; gap: 16px; font-size: 13px; }
    .stat-badge { background: #212634; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); }
    .stat-val { font-weight: 700; color: var(--accent); }
    main { flex: 1; display: grid; grid-template-columns: 320px 1fr; overflow: hidden; }
    .sidebar { border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--card-bg); }
    .sidebar-header { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--text-muted); }
    .tree-container { flex: 1; overflow-y: auto; padding: 10px; font-size: 13px; }
    .tree-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 4px; cursor: pointer; user-select: none; }
    .tree-item:hover { background: #262b3a; }
    .tree-item input[type="checkbox"] { cursor: pointer; }
    .content-area { display: flex; flex-direction: column; overflow: hidden; background: #0b0c10; }
    .toolbar { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: center; background: var(--card-bg); }
    .btn { background: var(--primary); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .btn:hover { opacity: 0.9; }
    .btn-secondary { background: #262b3a; color: var(--text); }
    .output-viewer { flex: 1; padding: 16px; overflow-y: auto; font-family: monospace; font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; color: #cbd5e1; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>CONCAT</h1>
      <span>FLOWORK CANVAS APP</span>
    </div>
    <div class="stats">
      <div class="stat-badge">Selected: <span class="stat-val" id="count-files">0</span> files</div>
      <div class="stat-badge">Tokens (Est): <span class="stat-val" id="count-tokens">0</span></div>
      <div class="stat-badge">Size: <span class="stat-val" id="count-size">0 KB</span></div>
    </div>
  </header>
  <main>
    <div class="sidebar">
      <div class="sidebar-header">REPOSITORY BROWSER</div>
      <div class="tree-container" id="tree-root">Loading files...</div>
    </div>
    <div class="content-area">
      <div class="toolbar">
        <select id="format-select" style="background:#212634; color:#fff; border:1px solid var(--border); padding:6px 10px; border-radius:6px; font-size:12px;">
          <option value="markdown">Markdown (```)</option>
          <option value="xml">XML Tags (<file>)</option>
        </select>
        <button class="btn btn-secondary" id="btn-select-all">Select All</button>
        <button class="btn btn-secondary" id="btn-clear">Clear</button>
        <div style="flex:1"></div>
        <button class="btn" id="btn-copy">📋 Copy to Clipboard</button>
      </div>
      <div class="output-viewer" id="output-view">// Select files from the left sidebar to pack context...</div>
    </div>
  </main>

  <script>
    let selectedFiles = new Set();
    const treeRoot = document.getElementById('tree-root');
    const outputView = document.getElementById('output-view');
    const countFiles = document.getElementById('count-files');
    const countTokens = document.getElementById('count-tokens');
    const countSize = document.getElementById('count-size');
    const btnCopy = document.getElementById('btn-copy');

    async function loadTree() {
      try {
        const res = await fetch('/api/tree');
        const data = await res.json();
        if (data.status === 'ok') {
          renderTree(data.items);
        } else {
          treeRoot.innerText = 'Failed to load directory.';
        }
      } catch (e) {
        treeRoot.innerText = 'Server error.';
      }
    }

    function renderTree(items) {
      treeRoot.innerHTML = '';
      items.forEach(item => {
        if (!item.isDirectory) {
          const div = document.createElement('div');
          div.className = 'tree-item';
          div.innerHTML = `
            <input type="checkbox" id="chk-${item.path}" data-path="${item.path}">
            <label for="chk-${item.path}" style="cursor:pointer; flex:1;">📄 ${item.name}</label>
          `;
          div.querySelector('input').addEventListener('change', (e) => {
            if (e.target.checked) selectedFiles.add(item.path);
            else selectedFiles.delete(item.path);
            triggerConcat();
          });
          treeRoot.appendChild(div);
        }
      });
    }

    async function triggerConcat() {
      const files = Array.from(selectedFiles);
      countFiles.innerText = files.length;
      if (files.length === 0) {
        outputView.innerText = '// Select files from the left sidebar to pack context...';
        countTokens.innerText = '0';
        countSize.innerText = '0 KB';
        return;
      }
      try {
        const format = document.getElementById('format-select').value;
        const res = await fetch('/api/concat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ files, format })
        });
        const data = await res.json();
        if (data.status === 'ok') {
          outputView.innerText = data.output;
          countTokens.innerText = data.estimated_tokens.toLocaleString();
          countSize.innerText = (data.total_chars / 1024).toFixed(1) + ' KB';
        }
      } catch (err) {
        outputView.innerText = 'Error concatenating files.';
      }
    }

    btnCopy.addEventListener('click', () => {
      const text = outputView.innerText;
      if (text && !text.startsWith('// Select')) {
        navigator.clipboard.writeText(text).then(() => {
          const prev = btnCopy.innerText;
          btnCopy.innerText = '✅ Copied!';
          setTimeout(() => { btnCopy.innerText = prev; }, 1500);
        });
      }
    });

    document.getElementById('format-select').addEventListener('change', triggerConcat);
    document.getElementById('btn-clear').addEventListener('click', () => {
      selectedFiles.clear();
      document.querySelectorAll('#tree-root input[type="checkbox"]').forEach(c => c.checked = false);
      triggerConcat();
    });

    loadTree();
  </script>
</body>
</html>
