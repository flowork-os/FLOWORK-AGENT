<!-- [FL_INDEX: keywords="openreel, canvas, video_editor, timeline, ui" | purpose="Sovereign OpenReel Video Editor Interface"] -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenReel — Sovereign Video Studio</title>
  <link rel="stylesheet" href="openreel.css">
</head>
<body class="fl-openreel-body">
  <div id="flowork-root" class="fl-app-container">
    <!-- Top Studio Navbar -->
    <header class="fl-header">
      <div class="fl-brand-group">
        <div class="fl-brand-badge">OPENREEL</div>
        <span class="fl-app-title">Sovereign Video Studio</span>
        <span class="fl-status-indicator" id="flEngineStatus">Engine: Ready</span>
      </div>
      <div class="fl-top-actions">
        <button id="btnImportAsset" class="fl-btn fl-btn-secondary" title="Add Video / Audio / Image">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Import Media
        </button>
        <button id="btnAddText" class="fl-btn fl-btn-secondary" title="Add Sticky Overlay Text">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
          Sticky Text
        </button>
        <button id="btnExportVideo" class="fl-btn fl-btn-primary" title="Render MP4 via FFmpeg">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Export MP4
        </button>
      </div>
    </header>

    <!-- Main Workspace Layout -->
    <main class="fl-workspace-grid">
      <!-- Left Panel: Media Pool & Sticky Assets -->
      <aside class="fl-media-bin">
        <div class="fl-panel-header">
          <h3>Media Pool</h3>
          <span class="fl-bin-count" id="mediaCount">0 Items</span>
        </div>
        <div class="fl-dropzone" id="dropzone">
          <div class="fl-drop-icon">🎬</div>
          <p>Drop video, audio or click to browse</p>
          <input type="file" id="fileInput" accept="video/*,audio/*,image/*" multiple style="display:none">
        </div>
        <div class="fl-asset-list" id="assetList">
          <!-- Dynamically populated assets -->
        </div>

        <div class="fl-panel-header" style="margin-top: 1rem;">
          <h3>Overlay Library</h3>
        </div>
        <div class="fl-preset-badges">
          <button class="fl-chip" data-preset="sticky-title">📌 Sticky Title</button>
          <button class="fl-chip" data-preset="watermark">🛡️ Brand Watermark</button>
          <button class="fl-chip" data-preset="subtitles">💬 Auto Captions</button>
          <button class="fl-chip" data-preset="lower-third">🏷️ Lower Third</button>
        </div>
      </aside>

      <!-- Center Panel: Video Canvas Stage -->
      <section class="fl-stage-view">
        <div class="fl-monitor-wrapper">
          <canvas id="previewCanvas" width="1280" height="720"></canvas>
          <div id="canvasOverlayContainer" class="fl-canvas-overlay"></div>
        </div>

        <!-- Monitor Controls -->
        <div class="fl-monitor-controls">
          <div class="fl-timecode-display" id="timecodeDisplay">00:00:00 / 00:00:00</div>
          <div class="fl-transport-btns">
            <button id="btnPrevFrame" class="fl-btn-icon" title="Previous Frame">⏮</button>
            <button id="btnPlayPause" class="fl-btn-icon fl-play-btn" title="Play / Pause">▶</button>
            <button id="btnNextFrame" class="fl-btn-icon" title="Next Frame">⏭</button>
            <button id="btnSplitClip" class="fl-btn-icon" title="Slice at Playhead (S)">✂</button>
          </div>
          <div class="fl-aspect-selector">
            <label>Aspect:</label>
            <select id="aspectRatioSelect">
              <option value="16:9">16:9 (Landscape)</option>
              <option value="9:16">9:16 (Shorts/Reel)</option>
              <option value="1:1">1:1 (Square)</option>
            </select>
          </div>
        </div>
      </section>

      <!-- Right Panel: Inspector & Motion Properties -->
      <aside class="fl-inspector-panel">
        <div class="fl-panel-header">
          <h3>Inspector</h3>
          <span class="fl-selected-target" id="selectedTargetLabel">No clip selected</span>
        </div>
        <div class="fl-inspector-form" id="inspectorForm">
          <div class="fl-form-group">
            <label for="propOpacity">Opacity</label>
            <input type="range" id="propOpacity" min="0" max="100" value="100">
            <span class="fl-val" id="valOpacity">100%</span>
          </div>
          <div class="fl-form-group">
            <label for="propScale">Scale</label>
            <input type="range" id="propScale" min="10" max="250" value="100">
            <span class="fl-val" id="valScale">100%</span>
          </div>
          <div class="fl-form-group">
            <label for="propSticky">Sticky Overlay Anchor</label>
            <select id="propSticky">
              <option value="none">None (Free Floating)</option>
              <option value="top-left">Top Left</option>
              <option value="top-right">Top Right</option>
              <option value="bottom-left">Bottom Left</option>
              <option value="bottom-right">Bottom Right</option>
              <option value="center">Center Lock</option>
            </select>
          </div>
          <div class="fl-form-group" id="textOverlayFields" style="display:none;">
            <label for="overlayTextContent">Overlay Text</label>
            <input type="text" id="overlayTextContent" class="fl-input" placeholder="Type text...">
          </div>
        </div>
      </aside>
    </main>

    <!-- Bottom Multi-Track Sequencer Timeline -->
    <footer class="fl-timeline-dock">
      <div class="fl-timeline-toolbar">
        <span class="fl-track-legend">V2 (Overlay)</span>
        <span class="fl-track-legend">V1 (Main Video)</span>
        <span class="fl-track-legend">A1 (Audio)</span>
        <div class="fl-zoom-ctrl">
          <span>Zoom:</span>
          <input type="range" id="timelineZoom" min="10" max="200" value="60">
        </div>
      </div>
      <div class="fl-timeline-workspace" id="timelineWorkspace">
        <!-- Playhead Scrub Line -->
        <div class="fl-playhead" id="playhead">
          <div class="fl-playhead-cap"></div>
        </div>
        <!-- Time Ruler -->
        <div class="fl-ruler" id="timeRuler"></div>
        <!-- Tracks -->
        <div class="fl-tracks-container" id="tracksContainer">
          <div class="fl-track" data-track="V2" id="trackV2"><span class="fl-track-tag">V2</span></div>
          <div class="fl-track" data-track="V1" id="trackV1"><span class="fl-track-tag">V1</span></div>
          <div class="fl-track" data-track="A1" id="trackA1"><span class="fl-track-tag">A1</span></div>
        </div>
      </div>
    </footer>
  </div>

  <script src="openreel.js"></script>
</body>
</html>
