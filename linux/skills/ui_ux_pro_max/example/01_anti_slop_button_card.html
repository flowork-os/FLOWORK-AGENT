<!-- Example 01: Clean Component Without AI Slop -->
<article class="sovereign-card" style="background: var(--card, #16181d); border: 1px solid var(--border, #2d3139); border-radius: 8px; padding: 24px; max-width: 400px; color: var(--card-foreground, #f3f4f6); font-family: system-ui, sans-serif;">
  <header style="margin-bottom: 16px;">
    <span style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--primary, #6366f1);">System Verification</span>
    <h2 style="font-size: 20px; font-weight: 700; margin: 4px 0 0 0; line-height: 1.25;">Operational Node Status</h2>
  </header>
  <p style="font-size: 14px; line-height: 1.5; color: var(--muted-foreground, #9ca3af); margin: 0 0 20px 0;">
    Cryptographic seals verified. All micro-services are operating within nominal thermal thresholds.
  </p>
  <button type="button" style="display: inline-flex; align-items: center; justify-content: center; background: var(--primary, #6366f1); color: #ffffff; border: none; padding: 10px 18px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 150ms ease;">
    Run Diagnostics
  </button>
</article>
