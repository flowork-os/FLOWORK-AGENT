[package]
name = "xflow-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "xflow_core"
path = "src/lib.rs"

[[bin]]
name = "flowork"
path = "src/main.rs"


[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
notify = "6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
async-stream = "0.3"
mime_guess = "2.0"
uuid = { version = "1.10", features = ["v4", "fast-rng"] }
libc = "0.2"
ed25519-dalek = { version = "2.1", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
