[target.x86_64-unknown-linux-gnu]
rustflags = [
    "--remap-path-prefix=/home/mrflow=~",
    "-C", "link-arg=-Wl,-z,relro,-z,now,-z,noexecstack",
    "-C", "overflow-checks=on",
]

[target.x86_64-pc-windows-gnu]
rustflags = [
    "--remap-path-prefix=/home/mrflow=~",
    "-C", "overflow-checks=on",
]

[build]
rustflags = [
    "--remap-path-prefix=/home/mrflow=~",
    "-C", "overflow-checks=on",
]
